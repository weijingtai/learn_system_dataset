  quote: '十月壬水司权，至旺之极，取戊为用，若生辰日干，又见辰时，必须戊透，又须庚制甲，不伤戊土，戊庚两全，定主豋科乃第，位显权高。或甲出制戊，不见庚救者，断之贫穷。戊藏无制，可许生员。或戊庚两透无甲者，亦主荣显。


    或支成木局，有甲乙出干，得庚透者，富贵。无庚者、平常。或支成水局，不见戊己，名润下格，运行西北，大富贵，行东南者、必危。


    或丙戊两透，行火土运，名利双全。或有丙无戊，可云衣禄。有戊无丙，难许推盈。十月壬水、专用戊丙，次取庚金。


    时日月年


    庚壬丁庚


    戌戌亥子

    时日月年


    辛壬辛壬


    亥子亥申'
  location: 第51页 第1句
