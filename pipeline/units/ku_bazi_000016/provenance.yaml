  file: source/transcript_v1.md
  quote: '八月甲木，木囚金旺。丁火为先，次用丙火，庚金再次。


    一丁一庚，科甲定显。癸水一透，科甲不全。


    丙庚两透，富大贵小。丙丁全无，僧道之命。


    丙透无癸，富贵双全。有癸制丙，寻常之人。


    支成火局，可许假贵，戊己一透，可作富翁。


    或支成金局，干露庚金，为木被金伤，必主残疾，得丙丁破金，亦主老来暗疾。


    或支成木局，干透比劫，反取庚金为先，次用丁火。'
  location: 第7页 第3句
