  file: source/transcript_v1.md
  quote: '六月戊土，遇夏干枯，先看癸水，次用丙火甲木。癸丙两透，科甲中人。或有癸无丙，见甲可许秀才。无甲略富。或有丙无癸，假道斯文，衣食颇足。


    或癸透辛出，以刀笔之才，可谋异路。


    无癸丙者，常人。若又无甲，下贱之辈。


    或土多得一甲出，不见庚辛，为人作事轩昂，性情谨慎，即不显扬，亦文章惊世。


    用癸者，金妻、水子。用丙者，木妻、火子。用甲者，水妻、木子。


    时日月年


    癸戊己戊


    丑辰未戍

    时日月年


    辛戊己戊


    酉午未申

    时日月年


    丁戊癸庚


    巳子未子'
  location: 第28页 第3句
