  file: source/transcript_v1.md
  quote: '三月己土，正栽培禾稼之时，先丙后癸，土暖而润，随用甲疏，三者俱透天干，必官居黄阁。或三者透一，科甲定然，但要得地。却以庚金为病。


    或有甲无癸，亦可致富，但不贵显。或有癸而无甲丙，亦有衣衿。或有丙癸无甲，亦系人才。丙癸全无，流俗之辈。


    或一派乙木，无金制伏，贫而且夭也。


    妻子同前。


    时日月年


    丙己甲壬


    寅卯辰子

    时日月年


    甲己壬辛


    子巳辰未

    时日月年


    壬己甲壬


    申卯辰子'
  location: 第32页 第3句
