  file: source/transcript_v1.md
  quote: '五月辛金，壬、癸、己、三者皆用。或壬己两透，支见癸水，不剋，定主显达。即己藏支，亦有廪贡。或无壬有己，须得异途。或癸出有庚，必主衣锦，叨受恩荣。若水土多见，见甲方妙。


    庚辛生于夏月，要壬癸得地，若木多火多，不见金水，逢金水运必败。


    时日月年


    壬辛甲丙


    辰亥午子'
  location: 第43页 第3句
