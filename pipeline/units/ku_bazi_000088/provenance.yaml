  quote: '十二月庚金，寒气太重，且多湿泥，愈寒愈冻，先取丙火解冻，次取丁火炼金，甲亦不可少。


    丙丁甲透者，即不科甲，亦有思荣。有丙无丁甲者，富中取贵。有丁甲无丙者，特达才人。有丙丁无甲者，白手成家，刀笔亨通，乏金更美。或支成金局无火，僧道之流。


    时日月年


    癸庚己庚


    未戌丑辰


    女命

    时日月年


    甲庚丁己


    申子丑巳'
  location: 第40页 第3句
