  file: source/transcript_v1.md
  quote: '正月乙木，必须用丙，因天气尤有余寒，非丙不暖，虽有癸水，恐凝寒气，故以丙火为先，癸水次之。


    丙癸两透，科甲定然，或有丙无癸门户阐扬。或丙多乏癸，名曰春旱。独阳不长，浊富之人。或丙少癸多，又为困丙，终为寒士。或癸己多见，为溼土之木皆下格。


    用丙者，木妻火子。用癸水见火多者，金妻水子。'
  location: 第10页 第2句
