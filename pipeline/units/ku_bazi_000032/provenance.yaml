  file: source/transcript_v1.md
  quote: '九月乙木，根枯叶落，必赖癸水滋养。如见甲申时，名为藤萝系甲，可秋可冬。若见癸水，又遇辛金发水之源，定主科甲。或有癸无辛，常人。有辛无癸，贫贱。或四柱壬多，水难生乙，亦是寻常之辈。


    或支多戊土，又逢天干，作从才看，无比劫方妙，一逢比劫，富屋贫人。


    用癸者，金妻、水子。但子女艰难，季土剋制故也。'
  location: 第12页 第4句
