  file: source/transcript_v1.md
  quote: '三月丁火，戊土司令，洩弱丁气，先用甲木引丁制土，次看庚金。庚甲两透，定主科甲。或一藏一透，终非白丁。


    或支成木局，取庚为先。得庚透，丁癸不透，亦有异路功名。


    或支成水局，加以壬透，名杀重身轻，必夭折天年。或遭凶死。或戊己两透，廊庙之客。若一甲破，定是常人。


    用甲者，水妻木子。用金者，土妻金子。'
  location: 第21页 第3句
