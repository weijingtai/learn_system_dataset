  file: source/transcript_v1.md
  quote: '四月戊土，阳气发升，寒气内藏，外实内虚，不畏火炎，无阳气相催，万物不长，故先用甲疏噼，次取丙癸为佐。


    丙透甲出，廊庙之才，丙癸俱透，科甲之士，即透一位，支藏得所，终非白丁。


    若一派丙火，为火炎土燥，僧道之流，得一癸透壬藏，功名有准。或支藏癸水衣食充足，但骨肉多刑。


    化合成局无破，富贵非轻。


    此用癸水，金妻水子。


    时日月年


    丙戊癸辛


    辰午巳亥

    时日月年


    丁戊丁癸


    巳午巳丑'
  location: 第28页 第1句
