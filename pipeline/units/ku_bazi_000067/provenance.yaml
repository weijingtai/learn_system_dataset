  file: source/transcript_v1.md
  quote: '九月戊土当权，不可专用丙，先看甲木，次取癸水，却忌化合。见金先用癸水，后取丙火，配合支干，方成有生之土，定发云程。


    或无丙有癸，不见甲透者，衣衿小富。无癸丙、有甲者。衣食而已。若癸甲全无，虽有丙火，亦属平常，或为僧道。或支成水局，壬癸透干，用戊止流，有比透反主富。


    支成火局，名土燥，不发。


    得金水两透，此人清高，略可富贵。无水、一生困苦。妻子同前。


    时日月年


    丙戊甲己


    辰辰戌酉

    时日月年


    癸戊庚丁


    亥戌戌亥


    时日月年


    壬戊戊丙


    子寅戌戌

    时日月年


    乙戊庚丁


    卯寅戌酉

    时日月年


    己戊戊丙


    未辰戌子'
  location: 第29页 第3句
