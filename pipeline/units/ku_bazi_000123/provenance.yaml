  file: source/transcript_v1.md
  quote: '二月癸水，不刚不柔，乙木司令，洩弱元神，专以庚金为用，辛金次之。庚辛俱透，无丁出干者，贵由科甲。无庚辛者常人。或庚透辛藏，荣封有准。庚藏辛透，亦有衣衿。庚辛两藏，富中取贵，或刀笔扬名。或庚辛重见，有己丁出干者亦贵。


    或支成木局，月时又见木者，为洩水太过，定主贫困多灾。即运入西方，亦属无用。


    时日月年


    癸癸癸丁


    丑亥卯未

    时日月年


    癸癸癸丁


    丑卯卯亥

    时日月年


    庚癸己庚


    申酉卯子'
  location: 第53页 第3句
