  file: source/transcript_v1.md
  quote: '十一月丁火，或仲冬水多癸旺，全无比印，此作弃命从杀，亦有异途功名。见丁比出干，难合格局，常人，且主骨肉浮云，六亲流水。戊出破癸，颇有兄弟妻儿。此格用戊，火妻土子。用甲、水妻木子。


    三冬丁火，甲木为尊，庚金佐之，癸戊权宜酌用可也。


    时日月年


    甲丁己庚


    辰酉丑午

    时日月年


    甲丁己戊


    辰未丑子

    时日月年


    乙丁癸壬


    巳巳丑辰

    时日月年


    甲丁辛辛


    辰卯丑卯'
  location: 第24页 第2句
