  quote: '十月戊土，时值小阳，阳气略出，先用甲木，次取丙火。非甲、土不灵。非丙、土不暖，安能生发万物。甲丙两出，富贵中人。或甲得长生，遇支藏得地之水，一丙高透，亦主身贵扬名。


    支见庚金，入泮而已。若不见庚金，甲木藏支，丙火高透，科甲有之。若有庚，丁出制，必异路功名。或为典吏。即庚丁不透，甲丙藏支，亦云富贵。


    壬透得戊救丙，主富贵取贵。丙甲俱无，必为僧道。


    时日月年


    戊戊癸癸


    午辰亥卯

    时日月年


    庚戊辛壬


    甲寅亥申

    时日月年


    丙戊丁乙


    辰戌亥卯'
  location: 第30页 第1句
