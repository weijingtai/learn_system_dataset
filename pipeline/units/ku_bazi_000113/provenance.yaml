  file: source/transcript_v1.md
  quote: '八月壬水，辛金司权，正金白水清，忌戊土为病，专用甲木。甲木一透制戊，壬水澈底澄清，名高翰苑。若甲出时干，功名显达，设见庚破，又属常人。即甲藏支、无庚，秀才可许。


    或天干有壬，支见申亥，此非用甲，戊土作用。亥虽有甲，又有申中之金制甲，秀才一定，且富足多才。


    或无戊、多金水者，主人清才浊，困苦寒儒。


    无甲用金，发水之源，名独水三犯庚辛，号曰体全之象。'
  location: 第50页 第3句
