  quote: '五月庚金，丁火旺烈，庚金败地，专用壬水，癸又次之。壬透癸藏，支见庚辛，必然科甲，切忌戊己透干制水、则否。戊藏支内，不失儒林。或壬在支，有金生助，又得金神出干，明经之贵。或癸出带辛，异路之荣。


    或支成火局，乏水者，奔波之客。有壬癸制者，捐纳之人。又见戊己透者则吉。无壬癸制火者，又宜戊己出干补金洩火，庶不夭折孤贫。


    总之，仲夏无水，必非上格，或一派木火，无伤、印、比劫，又作从杀而论。'
  location: 第38页 第2句
