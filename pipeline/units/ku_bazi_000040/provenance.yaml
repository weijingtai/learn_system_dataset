  quote: '四月丙火，建禄于巳，火势炎炎，宜专用壬水，解炎威之力，成既济之功。如无壬水，孤阳失辅，难透清光。得庚发水源，方为有根之水。壬庚两透，不见戊土，号曰湖水汪洋，广映太阳，光辉显着，文明之象，人格合此，不但科甲峥嵘，必有恩谥封荣，若不验，必暗损阴德。


    或无壬水，癸亦姑用，见庚透癸，不富必贵，但心性乖僻，巧谋善辩。或壬癸俱无，愚顽之辈。火炎无制，僧道之流，不然，须防夭折。


    或一派庚金，不见比劫，有富无贵。


    或丙午日干，四柱多壬，不见戊制，名曰阴刑杀重，光棍之流。或支水局，加之重重壬透，一无制伏，盗贼之命，如见己土，下贱鄙夫。


    用壬者，金妻水子。


    时日月年


    戊丙乙丁


    子子巳巳


    庚运夺魁

    时日月年


    甲丙辛乙


    午午巳未

    时日月年


    丙丙辛庚


    申寅巳子'
  location: 第17页 第2句
