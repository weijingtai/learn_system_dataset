  quote: '七月丁火，退气柔弱，端用甲木，金虽乘旺司权，无伤丁之理，仍取庚劈甲，为引火之物，或借丙暖金晒甲，不虑丙夺丁光，凡两丙夹丁者，夏月忌之，余月不忌，但此格少年困苦刑克中年富贵，必要地支见水制丙，方妙。


    或八月一派辛金，不见庚金，又无比劫，此弃命从财，富而且贵，虽不科甲，亦有异途。从财者水为妻。不剋。有偏正。木为子。不刑。


    或九月一派戊土，洩丁火之气，不见甲木，为伤官伤尽，非寻常可比。或甲木透出，为文书清贵，秋闱可夺。用甲者，庚不可少。水妻木子。


    时日月年


    庚丁己壬


    戌亥酉午

    时日月年


    辛丁己丁


    亥丑酉未

    时日月年


    壬丁丙庚


    寅未戌午

    时日月年


    丙丁甲己


    午卯戌亥'
  location: 第23页 第2句
