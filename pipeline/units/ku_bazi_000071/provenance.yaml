  quote: '二月己土，阳气渐升，虽禾稼未成，万物出土，田园未展，先取甲木疏之，忌合。次取癸水润之。甲癸出干，定主科甲，加以一丙出透，势压百僚。一见壬水，微末官职。


    或见庚制甲，壬水出干，比劫重重，此必俗子。丙透犹有小富，丙藏衣禄无亏。


    或支成木局，庚透富贵，若柱多乙木，乙又屈庚，庚必输情于乙，不能扫邪于正，此必狡诈之徒，运入东南，恐有不测。当用丁洩之。有丁者、小人而已，不致无良。


    无比印、从杀者贵。


    若柱中无甲丙癸者，皆下格。


    妻子用神同前。


    时日月年


    庚己乙癸


    午巳卯卯

    时日月年


    乙己乙癸


    丑巳卯卯'
  location: 第32页 第2句
