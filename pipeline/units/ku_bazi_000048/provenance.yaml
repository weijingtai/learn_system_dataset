  quote: '十二月丙火，气进二阳，侮雪欺霜，喜壬为用。己土司令，土多又不可少甲。壬甲两透，科甲堪宜，甲藏则秀才而已。或无甲得一壬透，富中取贵。


    如见一派己土，不见甲乙，名为假伤官，聪明性傲，名利虚浮。


    或一派癸水，得己出干，必自主创业。若制伏太过，又取辛金作用。得见癸透。此人即不成名，必清雅文墨士。


    时日月年


    癸丙己乙


    巳申丑巳

    时日月年


    庚丙己乙


    寅午丑丑


    时日月年


    壬丙乙癸


    辰午丑卯

    时日月年


    庚丙丁己


    寅寅丑丑

    时日月年


    乙丙己乙


    丑寅丑酉'
  location: 第19页 第3句
