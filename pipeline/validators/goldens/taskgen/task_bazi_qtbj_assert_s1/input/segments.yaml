segments:
- seg_id: s01
  span_id: ss_qtbj_ed01_p0001_s01
  entry_title: 五行总论
  case_candidate: false
  text: '# 五行总论

    五行者，本乎天地之间而不穷者也，故谓之行。

    '
- seg_id: s02
  span_id: ss_qtbj_ed01_p0001_s02
  entry_title: 五行总论
  case_candidate: false
  text: '北方阴极而生寒，寒生水。南方阳极而生热，热生火。东方阳散以泄而生风，风生木。西方阴止以收而生燥，燥生金。中央阴阳交而生温，温生土。其相生也所以相维，其相克也所以相制，此之谓有伦。

    '
- seg_id: s03
  span_id: ss_qtbj_ed01_p0001_s03
  entry_title: 五行总论
  case_candidate: false
  text: '火为太阳，性炎上。水为太阴，性润下。木为少阳，性腾上而无所止。金为少阴，性沉下而有所止。土无常性，视四时所乘，欲使相济得所，勿令太过弗及。

    '
- seg_id: s04
  span_id: ss_qtbj_ed01_p0001_s04
  entry_title: 五行总论
  case_candidate: false
  text: '夫五行之性，各致其用。水者其性智，火者其性礼，木其性仁，金其性义，惟土主信，重宽厚博，无所不容：以之水，即水附之而行；以之木，则木托之而生；金不得土，则无自出；火不得土，则无自归。必损实以为通，致虚以为明，故五行皆赖土也。

    '
- seg_id: s05
  span_id: ss_qtbj_ed01_p0001_s05
  entry_title: 五行总论
  case_candidate: false
  text: '推其形色，则水黑、火赤、木青、土黄，此正色也。及其变易，则不然。常以生旺从正色，死绝从母色，成形冠带从妻色，病败从鬼色，旺墓从子色。

    '
- seg_id: s06
  span_id: ss_qtbj_ed01_p0001_s06
  entry_title: 五行总论
  case_candidate: false
  text: '其数则水一、火二、木三、金四、土五。生旺加倍，死绝减半。

    '
- seg_id: s07
  span_id: ss_qtbj_ed01_p0001_s07
  entry_title: 五行总论
  case_candidate: false
  text: '以义推之，夫万物负阴而抱阳，冲气以和。过与不及，皆为乖道。故高者抑之使平，下者举之使崇，或益其不及，或损其太过。所以贵在折衷，归於中道，使无有余不足之累，即才官印食贵人驿马之微意也。行运亦如之，识其微意，则於命理之说，思过半矣。

    '
- seg_id: s01
  span_id: ss_qtbj_ed01_p0005_s01
  entry_title: 三春甲木
  case_candidate: false
  text: '### 三春甲木

    春月之木，渐有生长之象。初春犹有余寒，当以火温暖，则有舒畅之美，水多变剋，有损精神。重见生旺，必用庚金斲凿，可成楝梁。春末阳壮水渴，藉水资扶，则花繁叶茂。初春无火，增之以水，则阴浓气弱，根损枝枯，不能华秀。春末失水，增之以火，则阳气太盛，燥渴相加，枝枯叶干，亦不华秀。是以水火二物，要得时相济为美。

    '
- seg_id: s02
  span_id: ss_qtbj_ed01_p0005_s02
  entry_title: 正月甲木
  case_candidate: false
  text: '正月甲木，初春尚有余寒，得丙癸逢，富贵双全。癸藏丙透，名寒木向阳，主大富贵。倘风水不及，亦不失儒林俊秀。如无丙癸，平常人也。

    '
- seg_id: s03
  span_id: ss_qtbj_ed01_p0005_s03
  entry_title: 正二月甲木
  case_candidate: true
  text: '正二月甲木，素无取从才从杀从化之理。或一派庚辛，主一生劳苦，剋子刑妻，再支会金局，非贫即夭。如无丙丁，一派壬癸，又无戊己制之，名水泛木浮，死无棺椁。如一派戊己，支会金局，为财多身弱，富屋贫人，终生劳苦，妻晚子迟。或无庚金，有丁透，亦属文星，为木火通明之象，又名伤官生财格，主聪明雅秀。一见癸水伤丁，但作厚道迂儒。或柱中多癸，滋助木神，伤灭丁火，其人奸雄枭险，曹操之徒，言清行浊，笑里藏刀。


    若庚申、戊寅、甲寅、丙寅。一行金水运，发进士。或甲午日庚午时，此人必贵。但要好运相催，不宜制了庚丁。


    或支成金局，多透庚辛，此又不吉，号曰木被金伤，若无丙丁破金，必主残疾。或支成火局，洩露太过，定主愚懦，常有啾唧灾病缠身，终有暗疾。支成木局，得庚为贵，无庚必凶，若非僧道，男主鳏孤，女主寡独。支成水局，戊透为贵，如无戊制，不但贫贱，且死无棺木。故书曰：甲木若无根，全赖申子辰，干得才杀透，平步上青云。


    凡三春甲木，用庚者，土为妻，金为子。用丁者，木为妻，火为子。


    总之正二月甲木，有庚戊者上命。如有丁透，大富大贵之命也。

    '
- seg_id: s04
  span_id: ss_qtbj_ed01_p0005_s04
  entry_title: 二月甲木
  case_candidate: false
  text: '二月甲木，庚金得所，名阳刃驾杀，可云小贵，异途显达，或主武职，但要财资之。柱中逢才，英雄独压万人。若见癸水，困了才杀，主为光棍，重刃必定遭凶。性情凶暴。书曰：木旺宜火之光辉，秋闱可试。木向春生，处世安然有寿。日主无依，却喜运行才地。

    '
- seg_id: s05
  span_id: ss_qtbj_ed01_p0005_s05
  entry_title: 三月甲木
  case_candidate: false
  text: '三月甲木，木气相竭。先取庚金，次用壬水。庚壬两透，一榜堪图。但要运用相生，风水阴德，方许富贵。


    或见一二庚金，独取壬水。壬透清秀之人，才学必富。


    或天干透出二丙，庚藏支下，此钝斧无钢，富贵难求。若有壬癸破火，堪作秀才。


    或柱中全无一水，戊己透干，支成土局，又作弃命从才，因人而致富贵，妻子有能。


    或见戊己，及比劫多者，名为杂气夺才，此人劳碌到老，无驭内之权。女命合此，女掌男权，贤能内助，若比劫重见，淫恶不堪。


    或支成金局，方可用丁，不然，三月无用丁之法。惟有先庚后壬取用。


    书曰：甲乙生寅卯，庚辛干上逢，离南推富贵，坎地却为凶。

    '
- seg_id: s01
  span_id: ss_qtbj_ed01_p0006_s01
  entry_title: 四五月甲木
  case_candidate: false
  text: '### 三夏甲木

    四月甲木退气，丙火司权，先癸后丁。


    庚金太多，甲反受病。若得壬水，方配得中和，此人性好清高，假装富贵。即荫袭显达，终日好作祸乱，善辨巧谈，喜作诗文。此理最验。


    如一庚二丙，稍有富贵。金多火多，又为下格。


    或癸丁与庚齐透天干，此命可言科甲，即风水浅薄，亦有选拔之才。癸水不出，虽有庚金丁火，不过富中取贵异途官职而已。壬透可云一富，若全无点水，又无庚金丁火，一派丙戊，此无用之人也。

    '
- seg_id: s02
  span_id: ss_qtbj_ed01_p0006_s02
  entry_title: 五六月甲木
  case_candidate: false
  text: '五六月甲木，木性虚焦，一理共推。五月先癸后丁庚金次之。六月三伏生寒，丁火退气。先丁后庚，无癸亦可。或五月乏癸，用丁亦可，要运行北地为隹。


    总之五六月用丁火，虽运行北地，不致于死。却不利运行火地，号曰木化成灰必死。行西程又不吉，号曰伤官遇杀，不测灾来，惟东方则吉，北方次之。此五六月用丁之说也。


    凡用神太多，不宜剋制，须洩之为妙。


    五六月甲木，木盛先庚，庚盛先丁。五月癸庚两透，为上上之格。六月庚丁两透，亦为上上之格。用神既透，木火通明，自然大富大贵。或丁火太多，癸水亦多，反作平人。


    若柱中多金，名曰杀重身轻，先富后贫，运不相扶，非贫即夭。或庚多，有一二丙丁制伏，又有壬癸透干，泄金之气，此又为先贫后富。


    或满柱丙火，又加丁火，不见官杀，谓之伤官伤尽最为奇，反成清贵，定主才学过人，科甲有望，但岁运不宜见水。若柱中有壬水，运又逢水，必贫夭死。


    但凡木火伤官者，聪明智巧，却是人同心异，多见多疑，虽不生事害人，每抱忌妒之想，女命一理同推。


    或四柱多土，干上有乙木，切勿作弃命从才。


    时月两透己土，名二土争合，男主奔流，女主淫贱。见二甲则不争矣，亦属平庸之辈。或四柱有辰，干见二己二甲，此人名利双全，大富大贵。


    若在六月，见辰支，名为逢时化合格。以癸水为妻，丁火为子。若二己一甲争合。取支中比劫为用。以甲为用者，壬癸为妻，甲乙为子。其余用庚者，土妻金子。用丁者，木妻火子。女命以妻作夫，用作子。十干皆同。


    或是己土，不见戊土，乃为假从，其人一生缩首，反畏妻子。若无印绶，一生贫苦。六月尤可，五月决不可。

    '
