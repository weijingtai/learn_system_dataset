# 古籍电子文本常见形近误字对照表（数据驱动，非穷尽，按校勘记与权威工具书审定入表）
# 每项包含疑似误字 (wrong)、正确考订 (correct) 与考订依据 (basis)
# 规则：严禁 self-mapping (wrong == correct)，严禁空 basis，必须真实成词且有据可查
pairs:
  - wrong: "子日"
    correct: "子曰"
    basis: "阮元《十三经注疏校勘记·论语注疏》：诸本'子曰'，坊刻与传抄常形近讹'曰'为'日'作'子日'。"
  - wrong: "曰月"
    correct: "日月"
    basis: "阮元《十三经注疏校勘记·周易正义》引郑玄注：'日月为易，刚柔相当'，刊本多形近讹'日'为'曰'作'曰月'。"
  - wrong: "戌守"
    correct: "戍守"
    basis: "顾炎武《日知录》卷二十一'戊戌己已'条：戍役之'戍'从人持戈，抄刻本多形近讹为地支之'戌'作'戌守'。"
  - wrong: "戊戍"
    correct: "戊戌"
    basis: "钱大昕《十驾斋养新录》卷十七：岁在戊戌，俗本传刻多差互，讹地支'戌'为守卫之'戍'作'戊戍'。"
  - wrong: "知已"
    correct: "知己"
    basis: "《史记·刺客列传》'士为知己者死'，宋明刻本及近代排印本多形近讹'己'为'已'作'知已'。"
  - wrong: "草管人命"
    correct: "草菅人命"
    basis: "《汉书·贾谊传》'其视杀人若艾草菅然'，明清递刻本俗字相混，常形近讹草头'菅'为竹头'管'作'草管人命'。"
  - wrong: "病入膏盲"
    correct: "病入膏肓"
    basis: "《左传·成公十年》'居肓之上，膏之下'，坊本常混淆'肓'（心膈之间）与'盲'（目失明），讹为'膏盲'。"
  - wrong: "赢弱"
    correct: "羸弱"
    basis: "《史记·魏公子列传》'罢羸老弱'，后世刻本音近形近易淆，常讹羊部瘦弱之'羸'为贝部赢利之'赢'作'赢弱'。"
  - wrong: "元享利贞"
    correct: "元亨利贞"
    basis: "阮元《十三经注疏校勘记·周易正义》：'元亨利贞'，宋景德本及抄本常形近讹'亨'为'享'作'元享利贞'。"
  - wrong: "汩罗"
    correct: "汨罗"
    basis: "《水经注·湘水》：汨水出黄龙山，历代文选校记辨水名'汨'（右为日）与疾流'汩'（右为曰），传本多形近讹写作'汩罗'。"
