segments:
- seg_id: s01
  text: 阴阳逆顺妙难穷，二至还乡一九宫。
  note: 一联，开篇阴阳之理
- seg_id: s02
  text: 若能了达阴阳理，天地都来一掌中。
  note: 一联，开篇阴阳之理
- seg_id: s03
  text: 轩辕黄帝战蚩尤，涿鹿经今苦未休。
  note: 一联，开篇阴阳之理
- seg_id: s04
  text: 偶梦天神授符诀，登坛致祭谨虔修。
  note: 一联，开篇阴阳之理
- seg_id: s05
  text: 神龙负图出洛水，彩凤衔书碧云里。
  note: 一联，奇门起源典故
- seg_id: s06
  text: 因命风后演成文，遁甲奇门从此始。
  note: 一联，奇门起源典故
- seg_id: s07
  text: 一千八百当时制，太公测成七十二。
  note: 一联，奇门起源典故
- seg_id: s08
  text: 逮于汉代张子房，一十八局为精艺。
  note: 一联，奇门起源典故
- seg_id: s09
  text: 先须掌上排九宫，纵横十五图其中。
  note: 一联，九宫八卦基础
- seg_id: s10
  text: 次将八卦分八节，一气统三为正宗。
  note: 一联，九宫八卦基础
- seg_id: s11
  text: 阴阳二遁分顺逆，一气三元人莫测。
  note: 一联，九宫八卦基础
- seg_id: s12
  text: 五日都来接一元，接气超神为准则。
  note: 一联，九宫八卦基础
