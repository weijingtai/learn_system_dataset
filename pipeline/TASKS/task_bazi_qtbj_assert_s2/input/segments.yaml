    亥申卯亥

    '
- seg_id: s04
  span_id: ss_qtbj_ed01_p0016_s04
  entry_title: 三月丙火
  case_candidate: false
  text: '三月丙火，气渐炎升，用壬水。或成土局，取甲为辅，壬不可离。壬甲两透，科甲定宜，惟忌庚出制甲，则秀才而已。无甲用庚，助壬水洩土气。


    壬透甲藏，富大贵小，有甲无壬，劳碌浊富。壬藏无甲，一介寒儒。壬甲两无，愚贱之辈。乙丁杂乱，定必属凡夫。


    用壬者，金妻水子。用甲者，水妻木子。

    '
- seg_id: s01
  span_id: ss_qtbj_ed01_p0017_s01
  entry_title: 三夏丙火
  case_candidate: false
  text: '### 三夏丙火

    三夏丙火，阳威性烈，专用壬水。若亥宫壬水无力，回剋洩气故也，仍用申宫长生之水，方云富贵。


    四月耑用壬水，金为佐。五月亦耑用壬。四五月壬透者富贵。丁多、兼看癸水。六月用壬，但借庚金为佐。


    阳刃合杀，威权万里。丁火羊刃太旺，正谓羊刃倒戈，无头之鬼。丙火用壬，生旺坐实方好，忌壬水太多，名杀重身轻。

    '
- seg_id: s02
  span_id: ss_qtbj_ed01_p0017_s02
  entry_title: 四月丙火
  case_candidate: true
  text: '四月丙火，建禄于巳，火势炎炎，宜专用壬水，解炎威之力，成既济之功。如无壬水，孤阳失辅，难透清光。得庚发水源，方为有根之水。壬庚两透，不见戊土，号曰湖水汪洋，广映太阳，光辉显着，文明之象，人格合此，不但科甲峥嵘，必有恩谥封荣，若不验，必暗损阴德。


    或无壬水，癸亦姑用，见庚透癸，不富必贵，但心性乖僻，巧谋善辩。或壬癸俱无，愚顽之辈。火炎无制，僧道之流，不然，须防夭折。


    或一派庚金，不见比劫，有富无贵。


    或丙午日干，四柱多壬，不见戊制，名曰阴刑杀重，光棍之流。或支水局，加之重重壬透，一无制伏，盗贼之命，如见己土，下贱鄙夫。


    用壬者，金妻水子。


