segments:
- seg_id: s01
  span_id: ss_qtbj_ed01_p0050_s01
  entry_title: 三秋壬水
  text: '### 三秋壬水

    七月壬水，庚金司令，壬得申之长生，源流自远，转弱为强，专用戊土，次取丁火佐戊制庚。但用辰戌之戊，不用申中受病之戊。戊丁俱透，科甲生员。戊透天干，丁藏午戌，恩封可待，特忌戊癸化合。即支见寅戌，年出丁火，可许衣衿。或丁戊两藏，富中取贵。


    或四柱多壬，戊又透干，名假杀化权，阆苑之仙。支中见甲，亦不忌也。但太多者、常人。有庚居申，颇有衣禄。


    或戊多而透，得一甲制，略富贵，无甲常人。或一派甲木，又见火多，无庚出者，别祖离乡，随缘度日。盖申中之庚，不能救也。'
- seg_id: s02
  span_id: ss_qtbj_ed01_p0050_s02
  entry_title: 七月壬水
  text: '七月壬水，专用戊土。丁火为佐。


    时日月年


    壬壬庚戊


    寅辰申寅

    时日月年


    丙壬戊丁


    午辰申亥

    时日月年


    辛壬庚癸


    亥辰申酉'
- seg_id: s03
  span_id: ss_qtbj_ed01_p0050_s03
  entry_title: 八月壬水
  text: '八月壬水，辛金司权，正金白水清，忌戊土为病，专用甲木。甲木一透制戊，壬水澈底澄清，名高翰苑。若甲出时干，功名显达，设见庚破，又属常人。即甲藏支、无庚，秀才可许。


    或天干有壬，支见申亥，此非用甲，戊土作用。亥虽有甲，又有申中之金制甲，秀才一定，且富足多才。


    或无戊、多金水者，主人清才浊，困苦寒儒。


    无甲用金，发水之源，名独水三犯庚辛，号曰体全之象。'
- seg_id: s04
  span_id: ss_qtbj_ed01_p0050_s04
  entry_title: 八月壬水
  text: '八月壬水，专用甲木，庚金次之。用甲者，水妻、木子。


    时日月年


    壬壬丁辛


    寅辰酉酉

    时日月年


    庚壬己壬


    戌子酉子

    时日月年


    己壬丁丙


    酉子酉子

    时日月年


    甲壬乙庚


    辰子酉午'
- seg_id: s05
  span_id: ss_qtbj_ed01_p0050_s05
  entry_title: 九月壬水
  text: '九月壬水进气，其性特厚，若一派壬水，见一甲、制戌中之戊，戊又出干，斯用丙火。此格清贵极矣，正合一将当关，群邪自伏，或不见丙戊，亦不为妙。


    或一派戊土，无一己庚杂乱，得一甲透时干。玉堂清贵，即甲透月上，亦主科甲。若支藏己土，一榜可图。或庚透乏丁，贫贱之人。或丁透见甲，略贵。或水多乏丙者，又用戊土，常人。'
- seg_id: s06
  span_id: ss_qtbj_ed01_p0050_s06
  entry_title: 九月壬水
  text: '九月壬水，专用甲木，次用丙火。用土者，火妻土子。


    时日月年


    辛壬戊两


    丑戌戌寅

    时日月年


    甲壬戊辛


    辰戌戌丑'
- seg_id: s01
  span_id: ss_qtbj_ed01_p0051_s01
  entry_title: 三冬壬水
  text: '### 三冬壬水

    十月壬水司权，至旺之极，取戊为用，若生辰日干，又见辰时，必须戊透，又须庚制甲，不伤戊土，戊庚两全，定主豋科乃第，位显权高。或甲出制戊，不见庚救者，断之贫穷。戊藏无制，可许生员。或戊庚两透无甲者，亦主荣显。


    或支成木局，有甲乙出干，得庚透者，富贵。无庚者、平常。或支成水局，不见戊己，名润下格，运行西北，大富贵，行东南者、必危。


    或丙戊两透，行火土运，名利双全。或有丙无戊，可云衣禄。有戊无丙，难许推盈。十月壬水、专用戊丙，次取庚金。


    时日月年


    庚壬丁庚


    戌戌亥子

    时日月年


    辛壬辛壬


    亥子亥申'
- seg_id: s02
  span_id: ss_qtbj_ed01_p0051_s02
  entry_title: 十一月壬水
  text: '十一月壬水，阳刃帮身，较前更旺，先取戊土，次用丙火，丙戊两透，富贵荣华。有戊无丙，略可言富。有丙无戊，好谋无成。


    或支成水局，丙不出干，即有戊土，亦是庸人。或丙透得所。即戊藏支，亦可显达，须运得用方妙。或支成火局，一富而已。


    或比见月时，年见丁火，平常之辈。支成四库，富贵中人。


    或丁出时干，名为争合，主名利难成。或壬子日、丁未时，虽不能科甲，亦有恩荣，何也？盖用子中癸水为官，号曰用神得地，亦主荣华。'
- seg_id: s03
  span_id: ss_qtbj_ed01_p0051_s03
  entry_title: 十一月壬水
  text: '十一月壬水，丙戊并用。


    时日月年


    壬壬壬壬


    寅寅子寅

    时日月年


    甲壬壬壬


    辰子子子'
- seg_id: s04
  span_id: ss_qtbj_ed01_p0051_s04
  entry_title: 十二月壬水
  text: '十二月壬水，旺极复衰，何也？上半月癸辛主事，故旺，专用丙火。下半月己土主事，故衰。亦用丙火，甲木佐之。


    有丙解冻，名利双全。丙透甲出，科甲之贵，然四柱无壬方妙。无丙、单寒之士。或四柱多壬，戊透制之，衣衿可望。


    或丁出时干，化合成木，月干又见丁火，无癸破格，亦主富贵。或支成金局，名金寒水冻，一世孤贫，见火略可。即丙透遇辛，亦不为妙，见丁颇吉。


    腊月壬水，先取丙火，丁甲为佐，故水冷金寒爱丙丁。用火者，木妻火子。


    水旺居垣须有智，水土混杂必愚顽。壬癸路经南域、主健、富贵堪图。又云：惟有水木伤官格，才官相见始为欢。'
- seg_id: s01
  span_id: ss_qtbj_ed01_p0053_s01
  entry_title: 三春癸水
  text: '### 三春癸水

    正月癸水，值三阳之候，雨露之精，其性至柔，先用辛金，生癸水之源，次用丙火照暖，名阴阳和合，万物发生。辛丙两透，金榜有名。


    或支成火局，辛金受伤，有壬出救者、富贵。无壬者、贫穷。或丙出天干，辛在酉丑，亦有衣衿。若辛丙皆无，贫寒下格。或辛透丙藏，恩荣之造。丙辛在柱，以富得官。


    或戊透月上、坐辰时，不见比劫，丙丁出干，此为化合，定主腰金，见刑冲、则否。或支成水局，宜有丙透，无壬者，衣禄不少。若见丙火重重，又作贵推。'
- seg_id: s02
  span_id: ss_qtbj_ed01_p0053_s02
  entry_title: 正月癸水
  text: '正月癸水，辛金为主，庚金次之，丙亦不可少。若无庚辛，虽有丙火，无用之人。或火多土多，残疾不免。


    用辛者，土妻、金子。'
- seg_id: s03
  span_id: ss_qtbj_ed01_p0053_s03
  entry_title: 二月癸水
  text: '二月癸水，不刚不柔，乙木司令，洩弱元神，专以庚金为用，辛金次之。庚辛俱透，无丁出干者，贵由科甲。无庚辛者常人。或庚透辛藏，荣封有准。庚藏辛透，亦有衣衿。庚辛两藏，富中取贵，或刀笔扬名。或庚辛重见，有己丁出干者亦贵。


    或支成木局，月时又见木者，为洩水太过，定主贫困多灾。即运入西方，亦属无用。


    时日月年


    癸癸癸丁


    丑亥卯未

    时日月年


    癸癸癸丁


    丑卯卯亥

    时日月年


    庚癸己庚


    申酉卯子'
- seg_id: s04
  span_id: ss_qtbj_ed01_p0053_s04
  entry_title: 三月癸水
  text: 三月癸水，要分清明谷雨。清明后、火气未炽，专用丙火，为阴阳合谐。谷雨后，虽用丙火，尚宜辛甲佐之。如辛卯、壬辰、癸未、丙辰，生上半月，用丙火、显达。生下半月，必无伤辛金癸水、方妙。然丙亦不可少。用丙、木妻、火子。
- seg_id: s05
  span_id: ss_qtbj_ed01_p0053_s05
  entry_title: 三月癸水
  text: 三月癸水，从化者多，得化者荣禄。不化者平常。或支成水局，又见己土、无木，乃假杀格，有甲出者、常人。或支坐四库，又得甲透，可谓显达名扬。无甲者僧道孤苦。或支成木局，名伤官生财格，主聪明博学，衣禄充饶。
- seg_id: s06
  span_id: ss_qtbj_ed01_p0053_s06
  entry_title: 三月癸水
  text: '三月癸水，辛甲皆酌用。下半月，土妻金子。


    时日月年


    辛癸甲丁


    酉亥辰酉

    时日月年


    甲癸壬丙


    寅巳辰寅

    时日月年


    辛癸丙戊


    酉丑辰午

    时日月年


    丙癸壬丙


    辰丑辰寅'
- seg_id: s01
  span_id: ss_qtbj_ed01_p0054_s01
  entry_title: 三夏癸水
  text: '### 三夏癸水

    四月癸水，喜辛金为用，无辛用庚。若辛高透，不见丁火，加以壬透，主科名荣贵，声播四夷。若有丁破格，贫无立锥，有壬可免。辛藏无丁，贡监衣衿。


    或一派火土乏辛，即有己庚，亦不能生水。又无比肩羊刃，必至熬干癸水，损目无疑。若庚壬两透，洩制火土，名劫印化晋，极贵之造。有丁见干者则否。如有庚无壬。亦无丁破庚者，堪入儒林。有庚无辛者，异路功名。总之四月癸水，专用辛金方妙。'
- seg_id: s02
  span_id: ss_qtbj_ed01_p0054_s02
  entry_title: 五月癸水
  text: '五月癸水，至弱无根，必须庚辛为生身之本，但丁火司权，金难敌火，安能滋养癸水，宜见比劫，方得辛金之用。五月癸水，庚辛壬参酌并用可也。


    如庚辛透干，又见壬癸者，定主钟鼎名家。或有金透，支见申子辰者，亦主金榜挂名。或无水出干，支只一水，虽有庚辛，一富之造。故曰：水源会夏，富重贵轻。又曰：金水会夏天，富贵永无边，运行火土地，快乐似神仙。


    或支成火局，无壬出干，定主僧道。或二壬一庚同透，衣锦腰金。或一派己土，无甲出制，此作从杀而论，又主大贵。凡从杀者，切不可破格方吉。'
- seg_id: s03
  span_id: ss_qtbj_ed01_p0054_s03
  entry_title: 六月癸水
  text: '六月癸水，有上下月之分。下半月庚辛有气，上半月庚辛休囚。凡六癸日、多不验者，何也？俗士不知此理。因未中有乙己同宫，破而不破，故癸水不能从杀，所以专用庚辛。如上半月金神衰弱，火气炎烈，宜比劫助身，可云富贵。与五月一理。下半月庚辛有气，即无比劫亦可，又忌丁透，即丁在支亦不吉。其生剋制化，与五月略同。


    时日月年


    庚癸癸乙


    申未未酉

    时日月年


    丙癸辛己


    辰未未未'
- seg_id: s01
  span_id: ss_qtbj_ed01_p0055_s01
  entry_title: 三秋癸水
  text: '### 三秋癸水

    七月癸水，正母旺子相之时，癸虽死申，殊不知申中有庚生之，名死处逢生，弱中复强，即运行西北，亦不死也。但庚司令刚锐极矣，必取丁火为用。或丁透有甲，名有燄之火，必主科甲。或丁透无甲，又无壬癸，即有一二庚金，亦有生监。有二丁更妙。或金多乏丁制者，贫困之人。


    或一丁坐午，名独才格，主金玉满堂，富中取贵。若在未戌，则是常人。或柱见二戌二未，又得丙丁藏支，干见甲出、无水，亦作富贵而推。


    时日月年


    甲癸戊丁


    寅卯申酉

    时日月年


    乙癸庚戊


    卯未申午

    时日月年


    辛癸丙辛


    酉酉申酉'
- seg_id: s02
  span_id: ss_qtbj_ed01_p0055_s02
  entry_title: 八月癸水
  text: 八月癸水，辛金虚灵，非顽金可比，正金白水清，故取辛金为用，丙火佐之。名水暖金温。如丙与辛隔位同透，主科甲功名。或丙透辛藏，一榜之士。或土多克水，生意中人。
- seg_id: s03
  span_id: ss_qtbj_ed01_p0055_s03
  entry_title: 八月癸水
  text: '八月癸水，丙辛皆用。


    时日月年


    丙癸乙庚


    辰亥酉寅

    时日月年


    癸癸丁辛


    亥巳酉酉'
- seg_id: s04
  span_id: ss_qtbj_ed01_p0055_s04
  entry_title: 九月癸水
  text: 九月癸水，失令无根，戊土司权，剋制太过，专用辛金发水之源，要比肩滋甲制戊方妙。或辛甲两透，支见子癸，定主平步青云，或癸甲两透，富贵成名。或有甲辛无癸者，亦有恩封。或有甲癸无辛者，富大贵小。有甲无癸辛者，常人。二者俱无，贫贱之格。或有甲见壬者，颇许衣衿。
- seg_id: s05
  span_id: ss_qtbj_ed01_p0055_s05
  entry_title: 九月癸水
  text: '九月癸水，辛甲并用。


    时日月年


    甲癸丙癸


    寅卯戌亥

    时日月年


    癸癸庚壬


    亥丑戌辰'
- seg_id: s01
  span_id: ss_qtbj_ed01_p0056_s01
  entry_title: 三冬癸水
  text: '### 三冬癸水

    十月癸水，旺中有弱，何也？因亥摇木，洩散元神，宜用庚辛为妙。得庚辛两透，不见丁伤者，功名有准。


    或支成木局，有丁出干，为木旺火相，制住庚辛不生水，必主清寒。或成木局，干见丙丁，异路之荣。或一派壬水，不见戊制，名冬水汪洋，奔波到老。若得戊透，清贵堪夸。


    或一派庚辛，得丁出制，主名利双全。若不见丁，又主贫薄。或四柱火多，名才多身弱，富屋贫人。


    时日月年


    癸癸癸癸


    亥丑亥卯

    时日月年


    壬癸辛壬


    子亥亥申'
- seg_id: s02
  span_id: ss_qtbj_ed01_p0056_s02
  entry_title: 十一月癸水
  text: '十一月癸水，值冰冻之时，金水无交欢之象，专用丙火解冻，庶不致成冰，又要辛金滋扶，无丙有辛，不妙。凡冬季癸水，有丙透解冻，则金温水暖，两两相生，要不见壬癸，自然豋科及第，紫诰金章。


    或一派壬水，无丙出干，寒困之士。一派癸水，孤贱之流。或支成水局，得丙火重出干者，又主蟒袍玉带之荣。


    或支成金局，丙火无剋者，芒鞋革履之流。如辛年丙月癸日。有火者、主恩荣宠锡，绕膝芝兰。无火者，捐资得贵，位重当朝。


    或一派戊己，名杀重身轻，非贫即夭。


    用火者，木妻、火子。用辛者，土妻、金子。'
- seg_id: s03
  span_id: ss_qtbj_ed01_p0056_s03
  entry_title: 十二月癸水
  text: '十二月癸水，寒极成冰，万物不能舒泰，宜丙火解冻。或丙透年时，加以壬透，支中多戊，名水辅阳光，主显达名臣，无戊者，异途之职。若有丙无壬，黉门之客。有壬无丙，戊又出干者，皂隶之流。


    或支见子丑，比肩出干，即有丙透，不能解冻，此属平常。或无癸水，有辛与合，亦不为美。有丁出、颇吉。


    或一片癸己会党，年透丁火，名雪后灯光，夜生者贵，日生者否。若无丁火，又主孤贫。或支成水局，无丙者，四海为家，一生劳苦。


    或支成火局，有庚辛透者，衣食充足。无金出、孤苦零仃。或支成金局，丙透得地，名金温水暖，彼此相生，定许光大门闾，声驰翰苑。乏丙者，即文章骇世，总为孙山。


    或支成木局，洩水太过，主残病呻吟，得金出干辅救，技艺之流。


    凡冬月用丙，须丙火得地方妙、不然，即重重丙火出干，安能轻许富贵哉。'
