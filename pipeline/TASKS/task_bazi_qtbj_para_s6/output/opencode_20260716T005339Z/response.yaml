  original: '十二月癸水，寒极成冰，万物不能舒泰，宜丙火解冻。或丙透年时，加以壬透，支中多戊，名水辅阳光，主显达名臣，无戊者，异途之职。若有丙无壬，黉门之客。有壬无丙，戊又出干者，皂隶之流。



    或支见子丑，比肩出干，即有丙透，不能解冻，此属平常。或无癸水，有辛与合，亦不为美。有丁出、颇吉。



    或一片癸己会党，年透丁火，名雪后灯光，夜生者贵，日生者否。若无丁火，又主孤贫。或支成水局，无丙者，四海为家，一生劳苦。



    或支成火局，有庚辛透者，衣食充足。无金出、孤苦零仃。或支成金局，丙透得地，名金温水暖，彼此相生，定许光大门闾，声驰翰苑。乏丙者，即文章骇世，总为孙山。



    或支成木局，洩水太过，主残病呻吟，得金出干辅救，技艺之流。



    凡冬月用丙，须丙火得地方妙、不然，即重重丙火出干，安能轻许富贵哉。'
  vernacular: '十二月的癸水，寒冷到极点而结成冰，万物都不能舒展安泰，适宜用丙火来解除冰冻。如果丙火透在年柱或时柱，加上壬水透出天干，地支中多有戊土，名为"水辅阳光"，主显达而有名的臣子，没有戊土的，是异路功名的职位。如果有丙火而没有壬水，是学校中的书生。有壬水而没有丙火，戊土又出现在天干上的，是皂隶（低贱差役）之流。



    如果地支见到子和丑，"比肩"出现在天干上，即使有丙火透出，也不能解除冰冻，这属于平常。如果没有癸水，有辛金与之相合，也不为美好。有丁火出现，颇为吉利。



    如果是一片癸水与己土会党，年柱透出丁火，名为雪后灯光，夜晚出生的人贵，白天出生的不是这样。如果没有丁火，又主孤贫。如果地支会成水局，没有丙火的，四海为家，一生劳苦。



    如果地支会成火局，有庚金和辛金透出天干的，衣食充足。没有金出现的，孤苦零丁。如果地支会成金局，丙火透出而得地，名为"金温水暖"，彼此互相生发，一定许为光大门户，声名驰骋于翰林院。缺少丙火的，即使文章惊骇世俗，总归还是名列孙山（落榜之人）。



    如果地支会成木局，泄水太过，主残疾疾病呻吟，得到金出现在天干上来辅助救助，是技艺之流。



    凡是冬月用丙火，必须丙火得地方才妙，不然的话，即使重重丙火出现在天干上，怎么能轻易许给富贵呢。'
