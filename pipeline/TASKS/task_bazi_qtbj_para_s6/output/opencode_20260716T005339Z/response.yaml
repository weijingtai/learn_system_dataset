- span_id: ss_qtbj_ed01_p0051_s04
  original: '十二月壬水，旺极复衰，何也？上半月癸辛主事，故旺，专用丙火。下半月己土主事，故衰。亦用丙火，甲木佐之。



    有丙解冻，名利双全。丙透甲出，科甲之贵，然四柱无壬方妙。无丙、单寒之士。或四柱多壬，戊透制之，衣衿可望。



    或丁出时干，化合成木，月干又见丁火，无癸破格，亦主富贵。或支成金局，名金寒水冻，一世孤贫，见火略可。即丙透遇辛，亦不为妙，见丁颇吉。



    腊月壬水，先取丙火，丁甲为佐，故水冷金寒爱丙丁。用火者，木妻火子。



    水旺居垣须有智，水土混杂必愚顽。壬癸路经南域、主健、富贵堪图。又云：惟有水木伤官格，才官相见始为欢。'
  vernacular: '十二月的壬水，旺盛到极点又重新转衰，为什么呢？上半月是癸水和辛金主事，所以旺，专用丙火。下半月是己土主事，所以衰，也用丙火，用甲木来辅佐它。



    有丙火来解除冰冻，名利双全。丙火透出而甲木也出现，有科举功名的贵气，然而四柱中没有壬水方才妙。没有丙火，是单独贫寒之士。如果四柱中壬水多，戊土透出来制伏它，秀才功名可以期望。



    如果丁火出现在时干，化合成木，月干又见到丁火，没有癸水来破格，也主富贵。如果地支会成金局，名为"金寒水冻"，一世孤贫，见到火勉强可以。即使丙火透出而遇到辛金，也不为妙，见到丁火颇为吉利。



    腊月的壬水，先取丙火，丁火和甲木为辅佐，所以"水冷金寒"喜爱丙火丁火。用火的，以木为妻、以火为子。



    水旺居于垣墙之中必须有智慧，"水土混杂"必定愚蠢顽劣。壬水癸水路径经过南方（火地），主健壮，富贵可以期望。又有说法：只有"水木伤官格"，"才"和"官"相见才能得到欢喜。'
