  status: machine_translated
- span_id: ss_qtbj_ed01_p0053_s01
  original: '### 三春癸水


    正月癸水，值三阳之候，雨露之精，其性至柔，先用辛金，生癸水之源，次用丙火照暖，名阴阳和合，万物发生。辛丙两透，金榜有名。



    或支成火局，辛金受伤，有壬出救者、富贵。无壬者、贫穷。或丙出天干，辛在酉丑，亦有衣衿。若辛丙皆无，贫寒下格。或辛透丙藏，恩荣之造。丙辛在柱，以富得官。



    或戊透月上、坐辰时，不见比劫，丙丁出干，此为化合，定主腰金，见刑冲、则否。或支成水局，宜有丙透，无壬者，衣禄不少。若见丙火重重，又作贵推。'
  vernacular: '正月的癸水，正值三阳开泰的节候，是雨露的精华，它的性质最为柔软，先用辛金，生发癸水的源头，其次用丙火来照耀温暖，名为"阴阳和合"，万物生长勃发。辛金和丙火都透出天干，金榜上有名。



    如果地支会成火局，辛金受到伤害，有壬水出现来救助的，富贵。没有壬水的，贫穷。如果丙火出现在天干上，辛金在酉或丑，也有秀才功名。如果辛金和丙火都没有，是贫寒的下等格局。如果辛金透出而丙火藏在地支，是皇恩荣宠的命格。丙火和辛金都在命局中，通过富裕而得到官职。



    如果戊土透在月干上、时柱坐在辰，不见"比劫"，丙火丁火出现在天干上，这是化合，一定主腰佩金印，见到刑冲的，就不是这样。如果地支会成水局，适宜有丙火透出天干，没有壬水的，衣禄不少。如果见到丙火重重，又当作贵格来推。'
  kept_terms:
  - 阴阳和合
  - 比劫
  status: machine_translated
- span_id: ss_qtbj_ed01_p0053_s02
  original: '正月癸水，辛金为主，庚金次之，丙亦不可少。若无庚辛，虽有丙火，无用之人。或火多土多，残疾不免。



    用辛者，土妻、金子。'
  vernacular: '正月的癸水，以辛金为主，庚金次之，丙火也不可缺少。如果没有庚金辛金，虽然有丙火，也是无用之人。如果火多土多，残疾免不了。



    用辛金的，以土为妻、以金为子。'
  status: machine_translated
