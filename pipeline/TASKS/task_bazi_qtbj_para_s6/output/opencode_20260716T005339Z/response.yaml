  original: '### 三夏癸水


    四月癸水，喜辛金为用，无辛用庚。若辛高透，不见丁火，加以壬透，主科名荣贵，声播四夷。若有丁破格，贫无立锥，有壬可免。辛藏无丁，贡监衣衿。



    或一派火土乏辛，即有己庚，亦不能生水。又无比肩羊刃，必至熬干癸水，损目无疑。若庚壬两透，洩制火土，名劫印化晋，极贵之造。有丁见干者则否。如有庚无壬。亦无丁破庚者，堪入儒林。有庚无辛者，异路功名。总之四月癸水，专用辛金方妙。'
  vernacular: '四月的癸水，喜欢辛金为用神，没有辛金就用庚金。如果辛金高高透出天干，不见丁火，加上壬水透出天干，主科举功名、荣耀显贵，名声传播到四方异域。如果有丁火来破格，贫穷得无立锥之地，有壬水可以避免。辛金藏在地支而没有丁火，是贡生监生的秀才功名。



    如果是一派火土而缺少辛金，即使有己土和庚金，也不能生水。又没有"比肩"和"羊刃"，必定会熬干癸水，损伤眼目毫无疑问。如果庚金和壬水都透出天干，泄耗和制伏火土，名为"劫印化晋"，是极为显贵的命格。有丁火出现在天干上的就不是这样。如果有庚金而没有壬水，也没有丁火来破庚金的，可以进入儒林。有庚金而没有辛金的，是异路功名。总而言之，四月的癸水，专用辛金方才妙。'
  kept_terms:
  - 比肩
  - 羊刃
  - 劫印化晋
  status: machine_translated
- span_id: ss_qtbj_ed01_p0054_s02
  original: '五月癸水，至弱无根，必须庚辛为生身之本，但丁火司权，金难敌火，安能滋养癸水，宜见比劫，方得辛金之用。五月癸水，庚辛壬参酌并用可也。



    如庚辛透干，又见壬癸者，定主钟鼎名家。或有金透，支见申子辰者，亦主金榜挂名。或无水出干，支只一水，虽有庚辛，一富之造。故曰：水源会夏，富重贵轻。又曰：金水会夏天，富贵永无边，运行火土地，快乐似神仙。



    或支成火局，无壬出干，定主僧道。或二壬一庚同透，衣锦腰金。或一派己土，无甲出制，此作从杀而论，又主大贵。凡从杀者，切不可破格方吉。'
  vernacular: '五月的癸水，极为衰弱而没有根，必须有庚金和辛金作为生养自身的根本，但丁火当权主事，金难以敌过火，怎么能滋养癸水呢，适宜见到"比劫"，才能发挥辛金的功用。五月的癸水，庚金、辛金、壬水参考斟酌并用就可以了。



    如果庚金和辛金透出天干，又见到壬水和癸水的，一定主是钟鼎传家的名门望族。如果有金透出天干，地支见到申子辰三合水局的，也主金榜挂名。如果壬水癸水不出现于天干，地支中只有一个水，虽然有庚金和辛金，也只是一种富富的命格。所以说：水源会集于夏天，富重而贵轻。又说：金和水会集在夏天，富贵永远没有边际，大运走到火土之地，快乐得如同神仙。



    如果地支会成火局，没有壬水出现在天干上，一定主僧道。如果两个壬水和一个庚金同时透出天干，衣锦还乡、腰佩金印。如果是一派己土，没有甲木出现来制伏，这当作"从杀"来论，又主大贵。凡是"从杀"的，切不可破格方才吉利。'
