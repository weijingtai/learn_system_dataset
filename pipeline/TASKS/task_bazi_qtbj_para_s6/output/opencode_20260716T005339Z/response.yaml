    如果有一个丁火坐在午，名为"独才格"，主金玉满堂，从富中求得贵气。如果在未或戌，就是常人。如果命局中出现两个戌和两个未，又得到丙火和丁火藏在地支，天干上见到甲木出现、没有水，也当作富贵来推。



