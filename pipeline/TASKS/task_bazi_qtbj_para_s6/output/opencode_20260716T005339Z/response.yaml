- span_id: ss_qtbj_ed01_p0050_s03
  original: '八月壬水，辛金司权，正金白水清，忌戊土为病，专用甲木。甲木一透制戊，壬水澈底澄清，名高翰苑。若甲出时干，功名显达，设见庚破，又属常人。即甲藏支、无庚，秀才可许。



    或天干有壬，支见申亥，此非用甲，戊土作用。亥虽有甲，又有申中之金制甲，秀才一定，且富足多才。



    或无戊、多金水者，主人清才浊，困苦寒儒。



    无甲用金，发水之源，名独水三犯庚辛，号曰体全之象。'
  vernacular: '八月的壬水，辛金当权主事，正是金白水清的格局，忌怕戊土成为弊病，专用甲木。甲木一旦透出天干来制戊土，壬水就能彻底澄清，名声高于翰林院。如果甲木出现在时干，功名显达，假使见到庚金来破，又属于常人。即使甲木藏在地支、没有庚金，秀才可以许给。



    如果天干有壬水，地支见到申和亥，这并非用甲木，而是以戊土为用神。亥宫中虽然有甲木，又有申宫中的庚金来制甲木，秀才一定可成，而且富足多才。



    如果没有戊土、金和水多的人，主人清气而才能浊，是困苦的贫寒儒生。



    没有甲木而用金，发动水的源头，名为独水三次触犯庚金辛金，号为体全之象。'
  kept_terms:
  - 司权
  status: machine_translated
