  original: '### 三冬壬水


    十月壬水司权，至旺之极，取戊为用，若生辰日干，又见辰时，必须戊透，又须庚制甲，不伤戊土，戊庚两全，定主豋科乃第，位显权高。或甲出制戊，不见庚救者，断之贫穷。戊藏无制，可许生员。或戊庚两透无甲者，亦主荣显。



    或支成木局，有甲乙出干，得庚透者，富贵。无庚者、平常。或支成水局，不见戊己，名润下格，运行西北，大富贵，行东南者、必危。



    或丙戊两透，行火土运，名利双全。或有丙无戊，可云衣禄。有戊无丙，难许推盈。十月壬水、专用戊丙，次取庚金。



    时日月年



    庚壬丁庚



    戌戌亥子


    时日月年



    辛壬辛壬



    亥子亥申'
  vernacular: '十月的壬水当权主事，旺盛到了极点，取戊土为用神，如果是辰日出生，又见到辰时，必须戊土透出天干，又必须有庚金来制甲木，不伤害戊土，戊土和庚金两者齐全，一定主登科及第，地位显赫、权位高。如果甲木出现来制戊土，不见庚金来救助的，断定为贫穷。戊土藏在地支而没有受制，可以许为生员。如果戊土和庚金都透出天干而没有甲木，也主荣华显达。



    如果地支会成木局，有甲木乙木出现在天干上，得到庚金透出的，富贵。没有庚金的，平常。如果地支会成水局，不见戊土己土，名为"润下格"，大运走到西北方，大富贵，走到东南方的，必定危险。



    如果丙火和戊土都透出天干，行火土的大运，名利双全。如果有丙火而没有戊土，可以说有衣禄。有戊土而没有丙火，难以许为富裕充盈。十月的壬水，专用戊土和丙火，其次取庚金。



    命例：时柱庚戌、日柱壬戌、月柱丁亥、年柱庚子。


    命例：时柱辛亥、日柱壬子、月柱辛亥、年柱壬申。'
  kept_terms:
  - 司权
  - 润下格
  status: machine_translated
- span_id: ss_qtbj_ed01_p0051_s02
  original: '十一月壬水，阳刃帮身，较前更旺，先取戊土，次用丙火，丙戊两透，富贵荣华。有戊无丙，略可言富。有丙无戊，好谋无成。



    或支成水局，丙不出干，即有戊土，亦是庸人。或丙透得所。即戊藏支，亦可显达，须运得用方妙。或支成火局，一富而已。



    或比见月时，年见丁火，平常之辈。支成四库，富贵中人。



    或丁出时干，名为争合，主名利难成。或壬子日、丁未时，虽不能科甲，亦有恩荣，何也？盖用子中癸水为官，号曰用神得地，亦主荣华。'
  vernacular: '十一月的壬水，"阳刃"帮身，比起前月更加旺盛，先取戊土，其次用丙火，丙火和戊土都透出天干，富贵荣华。有戊土而没有丙火，勉强可以说富。有丙火而没有戊土，喜好谋划却没有成就。



    如果地支会成水局，丙火不出现于天干，即使有戊土，也是庸人。如果丙火透出而得到适当位置，即使戊土藏在地支，也可以显达，但必须大运得用方才妙。如果地支会成火局，只是一富罢了。



    如果比肩出现在月柱和时柱，年柱见到丁火，是平常之辈。地支会成四库（辰戌丑未），是富贵中人。



    如果丁火出现在时干，名为"争合"，主名利难以成就。如果是壬子日、丁未时，虽然不能取得科举功名，也有皇恩荣宠，为什么呢？因为用子中所藏的癸水为"官"，号为"用神得地"，也主荣华。'
  kept_terms:
  - 阳刃
  - 争合
  - 官
  - 用神得地
  - 用神
  status: machine_translated
