- span_id: ss_qtbj_ed01_p0050_s05
  original: '九月壬水进气，其性特厚，若一派壬水，见一甲、制戌中之戊，戊又出干，斯用丙火。此格清贵极矣，正合一将当关，群邪自伏，或不见丙戊，亦不为妙。



    或一派戊土，无一己庚杂乱，得一甲透时干。玉堂清贵，即甲透月上，亦主科甲。若支藏己土，一榜可图。或庚透乏丁，贫贱之人。或丁透见甲，略贵。或水多乏丙者，又用戊土，常人。'
  vernacular: '九月的壬水"进气"，它的性质特别厚重，如果是一派壬水，见到一个甲木来制戌宫中所藏的戊土，戊土又出现在天干上，这时候就用丙火。这个格局清贵到了极点，正符合一将当关、群邪自行降伏的道理，如果不见丙火和戊土，也不为妙。



    如果是一派戊土，没有一丝己土和庚金来杂乱，得到一个甲木透在时干，是玉堂（翰林院）的清贵，即使甲木透在月干，也主科举功名。如果地支藏有己土，可以期望考中一榜。如果庚金透出而缺少丁火，是贫贱之人。如果丁火透出见到甲木，稍有贵气。如果水多而缺少丙火，又用戊土，是常人。'
  kept_terms:
  - 进气
  status: machine_translated
