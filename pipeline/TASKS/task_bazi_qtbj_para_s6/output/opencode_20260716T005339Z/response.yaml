  original: '二月癸水，不刚不柔，乙木司令，洩弱元神，专以庚金为用，辛金次之。庚辛俱透，无丁出干者，贵由科甲。无庚辛者常人。或庚透辛藏，荣封有准。庚藏辛透，亦有衣衿。庚辛两藏，富中取贵，或刀笔扬名。或庚辛重见，有己丁出干者亦贵。



    或支成木局，月时又见木者，为洩水太过，定主贫困多灾。即运入西方，亦属无用。



    时日月年



    癸癸癸丁



    丑亥卯未


    时日月年



    癸癸癸丁



    丑卯卯亥


    时日月年



    庚癸己庚



    申酉卯子'
  vernacular: '二月的癸水，不刚也不柔，乙木当令主事，泄耗衰弱的元神，专一以庚金为用神，辛金次之。庚金和辛金都透出天干，没有丁火出现在天干上的，贵气来自科举功名。没有庚金和辛金的是常人。如果庚金透出而辛金藏在地支，荣宠封赏有准。庚金藏在地支而辛金透出天干，也有秀才功名。庚金和辛金两者都藏在地支，从富中求得贵气，或者以刀笔吏扬名。如果庚金和辛金重重出现，有己土和丁火出现在天干上的也贵。



    如果地支会成木局，月柱和时柱又见到木的，是泄耗水太过了，一定主贫困多灾。即使大运走入西方（金地），也属于无用。



    命例：时柱癸丑、日柱癸亥、月柱癸卯、年柱丁未。


