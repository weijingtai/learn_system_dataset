- span_id: ss_qtbj_ed01_p0050_s01
  original: '### 三秋壬水


    七月壬水，庚金司令，壬得申之长生，源流自远，转弱为强，专用戊土，次取丁火佐戊制庚。但用辰戌之戊，不用申中受病之戊。戊丁俱透，科甲生员。戊透天干，丁藏午戌，恩封可待，特忌戊癸化合。即支见寅戌，年出丁火，可许衣衿。或丁戊两藏，富中取贵。



    或四柱多壬，戊又透干，名假杀化权，阆苑之仙。支中见甲，亦不忌也。但太多者、常人。有庚居申，颇有衣禄。



    或戊多而透，得一甲制，略富贵，无甲常人。或一派甲木，又见火多，无庚出者，别祖离乡，随缘度日。盖申中之庚，不能救也。'
  vernacular: '七月的壬水，庚金当令主事，壬水得到申宫的长生之位，源头和流向自然辽远，从衰弱转为强盛，专用戊土，其次取丁火来辅佐戊土、制住庚金。但要用辰戌中所藏的戊土，不用申宫中受病（被庚金泄气）的戊土。戊土和丁火都透出天干，有科举功名、可为生员。戊土透出天干，丁火藏在午或戌中，皇恩封赏可以期待，特别忌怕戊土与癸水化合。即使地支见到寅和戌，年柱出现丁火，可以许为秀才功名。如果丁火和戊土两者都藏在地支，从富中求得贵气。



    如果四柱中壬水多，戊土又透出天干，名为"假杀化权"，是阆苑（仙境）中的仙人。地支中见到甲木，也不忌怕。但甲木太多的，是常人。有庚金居于申宫，很有衣禄。



    如果戊土多而透出天干，得到一个甲木来制伏，稍有富贵，没有甲木就是常人。如果是一派甲木，又见到火多，没有庚金出现的，就要别离祖宗、离开故乡，随缘度日。因为申宫中的庚金，不能救助。'
  kept_terms:
  - 司令
  - 假杀化权
  - 杀
  status: machine_translated
