- seg_id: s01
  entry_title: 三夏丙火
  path: 十干分论 / 论丙火 / 三夏丙火 / 总论
  text: '### 三夏丙火

    三夏丙火，阳威性烈，专用壬水。若亥宫壬水无力，回剋洩气故也，仍用申宫长生之水，方云富贵。


    四月耑用壬水，金为佐。五月亦耑用壬。四五月壬透者富贵。丁多、兼看癸水。六月用壬，但借庚金为佐。


    阳刃合杀，威权万里。丁火羊刃太旺，正谓羊刃倒戈，无头之鬼。丙火用壬，生旺坐实方好，忌壬水太多，名杀重身轻。

    '
  note: 总论三夏丙火阳威性烈专用壬水，四月壬金佐、五月耑壬、六月壬借庚佐，忌杀重身轻
  case_candidate: false
- seg_id: s02
  entry_title: 四月丙火
  path: 十干分论 / 论丙火 / 三夏丙火 / 四月
  text: '四月丙火，建禄于巳，火势炎炎，宜专用壬水，解炎威之力，成既济之功。如无壬水，孤阳失辅，难透清光。得庚发水源，方为有根之水。壬庚两透，不见戊土，号曰湖水汪洋，广映太阳，光辉显着，文明之象，人格合此，不但科甲峥嵘，必有恩谥封荣，若不验，必暗损阴德。


    或无壬水，癸亦姑用，见庚透癸，不富必贵，但心性乖僻，巧谋善辩。或壬癸俱无，愚顽之辈。火炎无制，僧道之流，不然，须防夭折。


    或一派庚金，不见比劫，有富无贵。


    或丙午日干，四柱多壬，不见戊制，名曰阴刑杀重，光棍之流。或支水局，加之重重壬透，一无制伏，盗贼之命，如见己土，下贱鄙夫。


    用壬者，金妻水子。


    时日月年


    戊丙乙丁


    子子巳巳


    庚运夺魁

    时日月年


    甲丙辛乙


    午午巳未

    时日月年


    丙丙辛庚


    申寅巳子

    '
  note: 论四月丙火建禄于巳专取壬水，壬庚两透湖水汪洋为上格，含阴刑杀重变例，附三则命造举例
  case_candidate: true
- seg_id: s03
  entry_title: 五月丙火
  path: 十干分论 / 论丙火 / 三夏丙火 / 五月
  text: '五月丙火，得壬高透，方为上命。或一壬无庚，亦主贡监，犹防戊己出干，丁壬化合，则为平人。即不透庚壬，或有申宫长生之水，济之坐禄之金，至妙，必入词林。又怕戊己杂乱，则为异路。


    或成火局，不见滴水者，乃僧道鳏独之命。即有.


    一二癸水，多遇火土，用之无力，瞽目之人。得戊己透洩火气，亦主刑剋孤寡，行北运多凶，何也？所谓燥烈水激反凶！


    或成炎上格，柱运不见庚辛，多见甲乙者，反主大富贵，然亦不可见水运。


    或有庚癸透者，衣禄充足。支火轻，无目疾。支见水者，异途。或成土局，又为洩太过，得壬滋甲出干，土被制而火得生扶，此必富贵寿考之格也。


    时日月年


    己丙壬庚


    亥戌午寅

    时日月年


    己丙戊戊


    丑午午戌

    时日月年


    甲丙戊戊


    午辰午申

    '
  note: 论五月丙火得壬高透为上命，含炎上格、土局洩太过变例，附三则命造举例
  case_candidate: true
- seg_id: s04
  entry_title: 六月丙火
  path: 十干分论 / 论丙火 / 三夏丙火 / 六月
  text: '六月丙火退气，三伏生寒，壬水为用，取庚辅佐。


    庚壬两透，贴身相生，可云科甲名宦。若无庚有壬，不见戊出，小富小贵。见戊制壬，则为乡贤而已。


    或己土出干混杂，此必庸夫俗子。或壬水浅，己土出干，其人贫困。无壬下格，贱而且顽，男女一理。


    或天干一派丙火，阳极生阴，干支两见庚壬，登科及第。


    总之六月丙火用壬，不同余月用壬，喜运行西北，六月用壬，喜运行西南。


    时日月年


    壬丙丁壬


    辰申未寅

    时日月年


    己丙己戊


    亥戌未午

    时日月年


    戊丙丁壬


    戌申未寅

    '
  note: 论六月丙火退气取壬为用庚为辅，庚壬两透科甲，喜运喜西南异于余月，附三则命造举例
  case_candidate: true
