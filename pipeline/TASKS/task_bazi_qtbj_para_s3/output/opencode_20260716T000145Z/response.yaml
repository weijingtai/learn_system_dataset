  original: '### 三春戊土


    三春戊土，无丙照暖，戊土不生，无甲疏噼，戊土不灵，无癸滋润，万物不长。正二月先丙后甲，癸又次之。三月先甲后丙，癸又次之，因戊土司权故也。有甲、丙、癸，三者齐透，必主一品当朝，或二透一藏，亦登金榜，二藏一透，也可异途。'
  vernacular: 春天的戊土，没有丙火来照耀温暖，戊土就不能生长，没有甲木来疏松劈开，戊土就没有灵气，没有癸水来滋润，万物就不能生长。正月和二月先取丙火、后取甲木，癸水又次之。三月先取甲木、后取丙火，癸水又次之，这是因为戊土当权主事的缘故。有甲木、丙火、癸水，三者一起透出天干，必定主一品官员当朝执政，或者两者透出、一者藏在地支，也能登上金榜，两者藏在地支、一者透出天干，也可以走异路功名。
