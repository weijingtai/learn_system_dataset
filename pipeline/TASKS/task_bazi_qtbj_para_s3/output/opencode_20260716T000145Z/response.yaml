  original: '### 三夏丁火


    四月丁火乘旺，虽取甲引丁，必用庚噼甲。伐甲、方云木火通明。甲多、又取庚为先。但四柱忌见癸水。癸水一见，洩金、溼甲、伤丁，故以癸为病。或癸水藏支，壬水出干制丙，不夺丁光，自是雁塔题名，玉堂清贵。



    或有庚无甲，戊透天干，此为伤官生才，又取戊为用，必主富贵。戊土出干，不见甲乙，又不见水，是伤官伤尽。子平批八字清高，但不大贵，亦不大富。见水多木多，定是常人。



    或四柱多丙，不见壬癸，夺了丁光，此人贫苦。或丁年、巳月、丁巳日、丙午时，一丙不夺二丁，即不显达，亦名播四邻。故书曰：丁火阴柔一烛灯，太阳相见夺光明；柱中若见甲木透，定许身安福自临。



    时日月年



    乙丁己甲



    巳丑巳午


    时日月年



    乙丁癸辛



    巳巳巳酉'
  vernacular: '四月的丁火"乘旺"，虽然取甲木来引出丁火，必须用庚金来劈开甲木。伐甲木，才叫做"木火通明"。甲木多，又取庚金为先。但四柱忌怕见到癸水，癸水一出现，就会泄耗金、弄湿甲木、伤害丁火，所以把癸水当作弊病。如果癸水藏在地支，壬水出现在天干上来制丙火，不夺走丁火的光芒，自然是雁塔题名，玉堂清贵。



    如果有庚金而没有甲木，戊土透出天干，这叫做"伤官生才"，又取戊土为用神，必定主富贵。戊土出现在天干上，不见甲木乙木，又不见水，是"伤官伤尽"。子平法评此八字为清高，但不大贵，也不大富。见到水多木多，一定是常人。



    如果四柱中丙火多，不见壬水癸水，夺走了丁火的光芒，此人贫苦。或者是丁年、巳月、丁巳日、丙午时，一个丙火夺不走两个丁火，即使不能显达，也名声传播到四邻。所以书中说：丁火阴柔如同一盏烛灯，太阳（丙火）相见就会夺走光明；命局中如果见到甲木透出天干，一定许为身体安康、福气自然来临。



    命例：时柱乙巳、日柱丁丑、月柱己巳、年柱甲午。


    命例：时柱乙巳、日柱丁巳、月柱癸巳、年柱辛酉。'
