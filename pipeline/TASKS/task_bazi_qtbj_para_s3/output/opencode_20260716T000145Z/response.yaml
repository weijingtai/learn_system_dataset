  original: '### 三冬丙火


    十月丙火，太阳失令，得见甲戊庚出干，可云科甲，主为人性好清高，斯文领袖。如辛透见辰，名化合逢时，主大贵。



    或壬多无甲，乃作弃命从杀，即不科甲，亦是宦僚。或壬多有甲无戊，却非从杀，宜用己土混壬。



    总之十月丙火，木旺宜庚，水旺宜戊，火旺用壬，随宜酌用可也。



    时日月年



    庚丙乙甲



    寅戌亥申


    时日月年



    戊丙辛壬



    子戌亥辰


    时日月年



    壬丙己辛



    辰子亥巳'
  vernacular: '十月的丙火，太阳失令，能够见到甲木、戊土、庚金出现在天干上，可以说有科举功名，主为人性情喜好清高，是斯文中的领袖。如果辛金透出见到辰土，名为"化合逢时"，主大贵。



    如果壬水多而没有甲木，就当作"弃命从杀"来看，即使不是科举正途，也是官僚。如果壬水多而有甲木没有戊土，却不是从杀，适宜用己土来混浊壬水。



    总而言之，十月的丙火，木旺适宜用庚金，水旺适宜用戊土，火旺用壬水，随宜斟酌使用就可以了。



    命例：时柱庚寅、日柱丙戌、月柱乙亥、年柱甲申。


    命例：时柱戊子、日柱丙戌、月柱辛亥、年柱壬辰。


    命例：时柱壬辰、日柱丙子、月柱己亥、年柱辛巳。'
  kept_terms:
  - 化合逢时
  - 弃命从杀
  - 杀
  status: machine_translated
- span_id: ss_qtbj_ed01_p0019_s02
  original: '十一月丙火，冬至一阳生，弱中复强，壬水为最，戊土佐之。



    壬戊两透，科甲可许，无戊见己，异路功名。或无壬水，有癸出干得金滋无伤，又有丙透以解冻，可许衣衿。



    或一派壬，则耑用戊土，此人虽不成名，文章迈众，但名利虚浮。何也？因戊晦光，又须甲木为药也。或无壬水，癸亦可用，但不甚显。



    或四柱多壬无甲，乃作弃命从杀，亦有云路。



    或水多、有甲、无戊，却非从杀，宜用己土浊壬，十一月丙火，与十月颇同。



    时日月年



    庚丙庚辛



    寅寅子亥


    时日月年



    癸丙庚辛



    巳子子丑


    时日月年



    戊丙庚辛



    子戌子酉'
  vernacular: '十一月的丙火，冬至一阳初生，从衰弱中重新转强，以壬水为最紧要，戊土辅助它。



    壬水和戊土都透出天干，科举功名可以许给，没有戊土而见到己土，是异路功名。如果没有壬水，有癸水出现在天干上、得到金来滋润而没有受伤害，又有丙火透出来解冻，可以许为秀才。



    如果是一派壬水，就专一用戊土，此人虽然不能成名，文章超越众流，但名利虚浮。为什么呢？因为戊土晦暗了丙火的光辉，又需要甲木来作为解药了。如果没有壬水，癸水也可以使用，但不太显赫。



    如果四柱中壬水多而没有甲木，就当作"弃命从杀"来看，也有青云之路。



    如果水多、有甲木、没有戊土，却不是从杀，适宜用己土来混浊壬水。十一月的丙火，与十月的很相似。



    命例：时柱庚寅、日柱丙寅、月柱庚子、年柱辛亥。


