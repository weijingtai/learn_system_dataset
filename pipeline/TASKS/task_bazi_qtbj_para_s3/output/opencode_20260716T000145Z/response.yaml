  original: '### 三秋丁火


    三秋丁火，退气柔弱，耑用甲木，金虽乘旺司权，无伤丁之理，仍取庚噼甲，为引火之物，或借丙暖金晒木，不虑丙夺丁火。凡两丙夹丁者，夏月忌之，余月不忌淤。但此格少年困苦刑剋，中年富贵，必要地支见水制丙、方妙。



    三秋甲庚丙并用，仍分优劣，何也？七月甲丙，申中有庚，八月甲丙庚皆用，七八月或无甲木，乙亦可用，为枯草引灯，却不离丙晒也。九月耑用甲庚。大扺甲不离庚，乙不离丙，其理极明。或见甲庚丙皆透，必主科甲。无甲用乙者，富贵皆小，且富而不贵者多。



    或一重壬水，又多见癸水，必以戊土为制，自然富贵光辉。



    或一派庚金，名财多身弱，主富屋贫人，妻多主事。或壬多洩庚，丁壬化杀，反成富贵。若庚多无壬，奔流下贱。



    时日月年



    戊丁丙辛



    申丑申亥


    时日月年



    戊丁丙辛



    申卯申亥


    时日月年



    丙丁丙辛



    午酉申卯


    时日月年



    丙丁甲庚



    午未申辰'
  vernacular: '秋天的丁火，"退气"而柔弱，专一用甲木，金虽然处于"乘旺"状态而当权主事，并没有伤害丁火的道理，仍然取庚金来劈开甲木，作为引火之物，或者借丙火来温暖金、晒干木，不用顾虑丙火夺走丁火的光芒。凡是两个丙火夹着一个丁火的，夏天忌怕这种情况，其余月份不忌怕。但这个格局年少时困苦刑克，中年以后富贵，必须要地支见到水来制丙火，方才妙。



    秋天的三个月甲木、庚金、丙火并用，仍然要分出优劣，为什么呢？七月用甲木和丙火，申宫中有庚金，八月甲木、丙火、庚金都用，七月和八月如果没有甲木，乙木也可以使用，如同枯草引燃灯火，却离不开丙火来晒干。九月专一用甲木和庚金。大体上甲木离不开庚金，乙木离不开丙火，这个道理极为明白。如果见到甲木、庚金、丙火都透出天干，必定主科举功名。没有甲木而用乙木的，富贵都小，而且富而不贵的情况居多。



    如果有一重壬水，又多见癸水，必定以戊土来制伏，自然富贵光辉。



    如果是一派庚金，名为"财多身弱"，主是富屋中的穷人，妻子多而主事。如果壬水多来泄耗庚金，便是"丁壬化杀"，反而成就富贵。如果庚金多而没有壬水，奔流下贱。



    命例：时柱戊申、日柱丁丑、月柱丙申、年柱辛亥。


    命例：时柱戊申、日柱丁卯、月柱丙申、年柱辛亥。


    命例：时柱丙午、日柱丁酉、月柱丙申、年柱辛卯。


    命例：时柱丙午、日柱丁未、月柱甲申、年柱庚辰。'
