  original: '二月丁火，溼乙伤丁，先庚后甲，非庚不能去乙，非甲不能引丁。庚甲两透，科甲定然。庚透甲藏，亦有生贡。甲透庚藏，异路功名。



    或庚乙俱透，庚必输情于乙，未免贪合，运行金水，一贫彻骨。或庚透乙藏，则不能贪合，乙反引丁，即用乙亦无害，运入木火之乡，自然富贵。用乙者，水妻木子。若尽是乙木，不见一甲，此人富贵不久，因贪致祸﹐弄巧反拙。且不能承受先人之业。



    或支成木局，有庚透、主清贵。不见庚者、常人。二月乙木司权，必须有庚，有乙无庚，主贫苦无依。用庚者、土妻金子。



    得印旺杀高，大富大贵。或一派水，无一戊制，主贫苦无依。或乙少癸多，有戊出制，反吉。用土者、火妻土子。



    时日月年



    丁丁乙戊



    未巳卯子


    时日月年



    庚丁癸丁



    子卯卯卯


    时日月年



    甲丁己庚



    辰丑卯辰'
  vernacular: '二月的丁火，湿木（乙木）伤害丁火，先取庚金、后取甲木，没有庚金就不能去除乙木，没有甲木就不能引出丁火。庚金和甲木都透出天干，科举功名必定可得。庚金透出而甲木藏在地支，也有生员贡生的功名。甲木透出而庚金藏在地支，是异路功名。



    如果庚金和乙木都透出天干，庚金必定对乙木输情，未免会有"贪合"，大运走到金水之地，一贫到骨。如果庚金透出而乙木藏在地支，就不能贪合，乙木反而引发丁火，即使使用乙木也没有害处，大运走入木火之乡，自然富贵。用乙木的，以水为妻、以木为子。如果全都是乙木，不见一个甲木，此人富贵不长久，因为贪心而招致灾祸，弄巧反拙，而且不能承受先人的家业。



    如果地支会成木局，有庚金透出天干，主清贵。不见庚金的，是常人。二月的乙木当权主事，必须有庚金，有乙木而没有庚金，主贫苦没有依靠。用庚金的，以土为妻、以金为子。



    得到印星旺盛、"杀"高居天干，大富大贵。如果是一派水，没有一个戊土来制，主贫苦没有依靠。如果乙木少而癸水多，有戊土出现来制水，反而吉利。用土的，以火为妻、以土为子。



    命例：时柱丁未、日柱丁巳、月柱乙卯、年柱戊子。


    命例：时柱庚子、日柱丁卯、月柱癸卯、年柱丁卯。


    命例：时柱甲辰、日柱丁丑、月柱己卯、年柱庚辰。'
