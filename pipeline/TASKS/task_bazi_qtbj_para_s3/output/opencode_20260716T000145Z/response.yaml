  original: '三月丁火，戊土司令，洩弱丁气，先用甲木引丁制土，次看庚金。庚甲两透，定主科甲。或一藏一透，终非白丁。



    或支成木局，取庚为先。得庚透，丁癸不透，亦有异路功名。



    或支成水局，加以壬透，名杀重身轻，必夭折天年。或遭凶死。或戊己两透，廊庙之客。若一甲破，定是常人。



    用甲者，水妻木子。用金者，土妻金子。'
  vernacular: '三月的丁火，戊土当令主事，泄弱丁火的气，先用甲木来引出丁火、制住戊土，其次看庚金。庚金和甲木都透出天干，一定主科举功名。如果一藏一透，终究不是普通平民。



    如果地支会成木局，取庚金为先。得到庚金透出，丁火癸水不透出，也有异路功名。



    如果地支会成水局，加上壬水透出，名为"杀重身轻"，必定夭折天年，或者遭到凶死。如果戊土己土都透出天干，是朝堂廊庙中的贵客。如果有一个甲木来破，一定是常人。



    用甲木的，以水为妻、以木为子。用金的，以土为妻、以金为子。'
