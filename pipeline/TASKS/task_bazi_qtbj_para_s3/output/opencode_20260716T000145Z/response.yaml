- span_id: ss_qtbj_ed01_p0018_s01
  original: '### 三秋丙火


    七月丙火，太阳转西，阳气衰矣。日近西山，见土皆晦，惟日照湖海，暮夜光天，故仍用壬水，辅映光辉。



    如壬多，取戊制方妙。有壬透干，又见戊土出干，可云科甲。如戊藏支内，不过生员。多壬无戊，平常人也。或戊多壬少，亦属常人。或多壬，一戊出制，所谓众杀猖狂，一仁可化，必主显达，有权职。



    一派辛金，又为弃命从才，奇特之造，虽不科甲，亦得恩荣，但多依亲戚而为进身之阶。从才者以水妻木子。



    时日月年



    壬丙戊壬



    辰申申戌


    时日月年



    庚丙甲乙



    寅申申未'
  vernacular: '七月的丙火，太阳转向西方，阳气衰落了。太阳靠近西山，见到土都会晦暗，只有太阳照耀湖海，暮夜之间仍然照明天空，所以仍用壬水，辅助映照光辉。



    如果壬水多，取戊土来制方才妙。有壬水透出天干，又见到戊土出现在天干上，可以说有科举功名。如果戊土藏在地支之内，不过是生员。壬水多而没有戊土，是平常之人。如果戊土多而壬水少，也属于常人。如果壬水多，一个戊土出现来克制，这就是所谓"众杀猖狂，一仁可化"，必定主显达，有权位和职衔。



    如果是一派辛金，又当作"弃命从才"来看，是奇特的命造，虽然不是科举正途，也能得到恩荣，但多依靠亲戚作为进身的台阶。从才格以水为妻、以木为子。



    命例：时柱壬辰、日柱丙申、月柱戊申、年柱壬戌。


    命例：时柱庚寅、日柱丙申、月柱甲申、年柱乙未。'
  kept_terms:
  - 众杀猖狂
  - 一仁可化
  - 弃命从才
  - 从才
  - 杀
  status: machine_translated
- span_id: ss_qtbj_ed01_p0018_s02
  original: '八月丙火，日近黄昏，丙火之余光，存于光湖，仍用壬水辅映。



    四柱多丙，一壬高透为奇，定主登科及第。富贵双全。一壬藏支，亦主秀才。或戊多困水则假作斯文。若无壬水，癸亦可用，但功名不久。



    或见辛透，不能从化，贫苦到老。或见一丁制辛，为人奸诈，不识高低。女命合此，长舌淫贱。



    或成金局，无辛出干，此非从才，乃朱门饿莩。如辛出干，不见比劫，此从才格，反主富贵，亲戚提拔，妻贤内助。



    用水者，金妻水子。从才者，水妻木子。



    时日月年



    丁丙丁丙



    酉午酉子


    时日月年



    丁丙丁丙



    酉辰酉寅


    时日月年



    戊丙癸己



    子子酉卯'
  vernacular: '八月的丙火，太阳接近黄昏，丙火的余光，保存在光湖之中，仍用壬水来辅助映照。



    四柱中丙火多，有一个壬水高高透出为奇妙，一定主登科及第、富贵双全。一个壬水藏在地支，也主秀才。如果戊土多困住水就假作斯文。如果没有壬水，癸水也可以使用，但功名不会长久。



    如果见到辛金透出，不能从化，贫苦到老。如果见到一个丁火来制辛金，为人奸诈，不识高低。女命符合这个格局的，长舌多嘴、淫贱。



    如果会成金局，没有辛金出现在天干上，这并非"从才"，而是朱门中的饿殍（富户中的穷人）。如果辛金出现在天干上，不见"比劫"，这是"从才格"，反而主富贵，有亲戚提拔，妻子贤惠做内助。



    用水的，以金为妻、以水为子。从才格的，以水为妻、以木为子。



    命例：时柱丁酉、日柱丙午、月柱丁酉、年柱丙子。


    命例：时柱丁酉、日柱丙辰、月柱丁酉、年柱丙寅。


    命例：时柱戊子、日柱丙子、月柱癸酉、年柱己卯。'
  kept_terms:
  - 从化
  - 从才
  - 比劫
  - 才
  status: machine_translated
- span_id: ss_qtbj_ed01_p0018_s03
  original: '九月丙火，火气愈退，所忌土晦光火，必须先用甲木，次取壬水。甲壬两透，富贵非凡。若无壬水，得癸透干，亦可，虽不科甲，异路功名。壬癸藏支，贡监而已。甲藏壬透，无庚破甲，可许秀才。或庚戊困了水木，定是庸才。无甲壬癸者，下格。



    或一派火土，虽不太旺，亦自燥矣。如不离乡过继，亦主奔流，加以无庚辛壬癸出干，必为夭命。



    或支成火局，炎上失时，若运入南方，一贫彻骨。



    用甲者，水妻木子。用壬者，金妻水子。



    时日月年



    戊丙甲己



    子子戌亥


    时日月年



    戊丙戊丙



    戌午戌申


    时日月年



    壬丙壬戊



    辰寅戌戌'
  vernacular: '九月的丙火，火气越来越衰退，所忌怕的是土晦暗光芒和火，必须先用甲木，其次取壬水。甲木和壬水都透出天干，富贵非同寻常。如果没有壬水，得到癸水透出天干，也可以，虽然不是科举正途，也能有异路功名。壬水和癸水藏在地支，不过是贡生监生罢了。甲木藏在地支而壬水透出，没有庚金来破除甲木，可以许为秀才。如果庚金和戊土困住了水和木，一定是庸才。没有甲木、壬水、癸水的，是下等格局。



    如果是一派火和土，虽然不太旺盛，也已经燥了。如果不离乡背井或过继给人，也主奔波流离，加上没有庚金、辛金、壬水、癸水出现在天干上，必定是夭折之命。



    如果地支会成火局，"炎上"格失时，如果大运走入南方，一贫到骨。



    用甲木的，以水为妻、以木为子。用壬水的，以金为妻、以水为子。



    命例：时柱戊子、日柱丙子、月柱甲戌、年柱己亥。


    命例：时柱戊戌、日柱丙午、月柱戊戌、年柱丙申。


    命例：时柱壬辰、日柱丙寅、月柱壬戌、年柱戊戌。'
  kept_terms:
  - 炎上
  status: machine_translated
