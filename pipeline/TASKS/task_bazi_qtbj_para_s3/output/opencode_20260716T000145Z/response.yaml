    卯卯亥戌'
  vernacular: '冬天的丁火微寒，专一用庚金和甲木。甲木是庚金的好朋友。凡是使用甲木，庚金不可缺少，没有庚金也没有甲木，怎么能引出丁火呢？难以说是"木火通明"，冬天的丁火有甲木，不怕水多也不怕金多，可以称为上等格局。甲木和庚金都透出天干，科举功名分明。见到己土则不行，己土多会合住甲木，就成为常人了。



    如果有一个丙火来夺丁火的光明，必须依赖地支内的水来救助。如果有地支中的金来发动水的源头，官拜御史台（乌台）有准。完全没有癸水来制丙火，是无用之徒。如果有金而没有水，是贫寒之士。有水而没有金，又主清高。



    如果时柱和月柱有两个壬水来"争合"，取戊土来破除它。有戊土稍有富贵，没有戊土便是常人。假如戊土藏在地支而得到适当的位置，不失为秀才功名。



    如果两个丙火来夺丁火的光明，得到年干有癸水，地支下面带有合局，金和水各得其所，也必定显达，纳粟捐资奏名获取功名，必定应验。



    命例：时柱辛亥、日柱丁亥、月柱癸亥、年柱癸亥。


