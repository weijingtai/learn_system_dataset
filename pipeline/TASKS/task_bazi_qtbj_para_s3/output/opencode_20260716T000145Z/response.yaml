  original: '### 三春丁火


    正月丁火，甲木当权，乃为母旺，非庚不能噼甲，何以引丁，姑用庚金。



    或一派甲木，无庚制之，非贫即夭。或只一甲木，多见乙木者，必离乡之客，焉问妻儿。或见甲乙，生庚子时，又主妻早子早，且可采芹。



    得壬化木，弱极复生，合此必主大贵，但此化合，反以不见庚破格为妙。



    或有庚金壬癸，得己土出干制之，此命不由科甲，亦有异途。



    或一派壬癸，不得寅时，又无庚金，必主穷困。



    或丁年、壬月、丁日、壬时，男主大贵；女则不宜。此格以土为妻、金为子。但子女艰难。女命合此，淫贱，刑夫剋子。



    或支火局，无滴水解，僧道之命。见甲出略可。总不可无水。水多亦不宜。



    时日月年



    壬丁戊庚



    寅未寅辰


    时日月年



    癸丁庚辛



    卯酉寅卯'
  vernacular: '正月的丁火，甲木当权主事，就是母亲（印星）旺盛，没有庚金就不能劈开甲木，怎么能引出丁火呢，姑且用庚金。



    如果是一派甲木，没有庚金来制住它，不是贫困就是夭折。如果只是一个甲木，多见乙木的，必定是离乡背井之人，还谈得上什么妻儿呢。如果见到甲木乙木，出生在庚子时的，又主娶妻早、得子早，而且可以入学中秀才。



    得到壬水来化木，衰弱到极点又重新复苏，符合这个格局的必定主大贵，但这个化合，反而以不见庚金来破格为妙。



    如果有庚金、壬水、癸水，得到己土出现在天干上来制住它们，这个命格不通过科举正途，也有异路功名。



    如果是一派壬水癸水，没有得到寅时，又没有庚金，必定主穷困。



    如果是丁年、壬月、丁日、壬时，男命主大贵；女命则不适宜。这个格局以土为妻、以金为子。但子女艰难。女命符合这个格局的，淫贱，刑克丈夫、克子。



    如果地支会成火局，没有一滴水来解除，是僧道之命。见到甲木透出略微可以。总归不可没有水。水多也不适宜。



    命例：时柱壬寅、日柱丁未、月柱戊寅、年柱庚辰。


    命例：时柱癸卯、日柱丁酉、月柱庚寅、年柱辛卯。'
  kept_terms:
  - 杀
  status: machine_translated
