  original: '### 三夏戊土


    四月戊土，阳气发升，寒气内藏，外实内虚，不畏火炎，无阳气相催，万物不长，故先用甲疏噼，次取丙癸为佐。



    丙透甲出，廊庙之才，丙癸俱透，科甲之士，即透一位，支藏得所，终非白丁。



    若一派丙火，为火炎土燥，僧道之流，得一癸透壬藏，功名有准。或支藏癸水衣食充足，但骨肉多刑。



    化合成局无破，富贵非轻。



    此用癸水，金妻水子。



    时日月年



    丙戊癸辛



    辰午巳亥


    时日月年



    丁戊丁癸



    巳午巳丑'
  vernacular: '四月的戊土，阳气发动上升，寒气在内部潜藏，外表实而内里虚，不畏惧火势炎炎，没有阳气来催动，万物就不能生长，所以先用甲木来疏松劈开，其次取丙火和癸水为辅佐。



    丙火透出天干而甲木也出现，是朝堂廊庙中的栋梁之才，丙火和癸水都透出天干，是科举功名之士，即使只透出其中一位，地支藏得恰当，终究不是普通平民。



    如果是一派丙火，便是"火炎土燥"，是僧道之流，得到一个癸水透出、壬水藏支，功名有准。如果地支藏有癸水，衣食充足，但骨肉亲人多刑克。



    化合而成格局没有破格的，富贵不轻。



    这种情况用癸水，以金为妻、以水为子。



    命例：时柱丙辰、日柱戊午、月柱癸巳、年柱辛亥。


    命例：时柱丁巳、日柱戊午、月柱丁巳、年柱癸丑。'
