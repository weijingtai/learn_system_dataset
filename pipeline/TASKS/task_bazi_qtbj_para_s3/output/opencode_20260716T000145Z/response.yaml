  vernacular: '三月的戊土当令主事，不见丙火、甲木、癸水的，愚蠢而且卑贱。甲木和癸水透出天干的，有科举功名。丙火和癸水透出天干的，是生员。甲木和癸水都藏在地支的，只可以说富，有癸水可以走异路功名。



    如果丙火多而没有癸水，如同旱田没有水，不能种下禾苗，旧谷已经吃完了，新谷还没有收获，这是先富后贫的命造。如果火多而有壬水透出的，先贫后富。癸水透出的先贱后荣。壬水藏在地支不过是食物充足，癸水藏在地支不过是名声传播，就是如此也需要大运走得美。如果地支会成火局，得到癸水透出的，富贵天然。壬水透出的富贵辛苦，为什么呢？癸水是天上的甘霖，壬水是江河的波浪，所以有劳碌和安逸的差别。



    地支会成木局，又加上甲木乙木出现在天干上，这叫做"官杀会党"，官杀混杂没有去留的道理，得到一个庚金透出天干，扫除官杀，也主富贵。没有庚金就是浅薄之人，适宜用火来泄耗木的气。有一个命例：丁未、癸卯、戊寅、乙卯，癸水和丁火透出天干，加上戊土与癸水化合成火，将甲木暗中焚烧，反而获得武科探花（第三名）。



    如果有比肩和印星，专一看癸水是否透出，取癸水而成贵格。没有癸水、没有火、没有金，名为"土木自战"，主腹中疾病，忧愁艰苦。



    用甲木的，以水为妻、以木为子。用丙火的，以木为妻、以火为子。



