  original: '六月戊土，遇夏干枯，先看癸水，次用丙火甲木。癸丙两透，科甲中人。或有癸无丙，见甲可许秀才。无甲略富。或有丙无癸，假道斯文，衣食颇足。



    或癸透辛出，以刀笔之才，可谋异路。



    无癸丙者，常人。若又无甲，下贱之辈。



    或土多得一甲出，不见庚辛，为人作事轩昂，性情谨慎，即不显扬，亦文章惊世。



