  original: '五月丁火，时归建禄，不宜乱用甲木。



    遇年透隔位之壬，不贪丁合者，忠而且厚。或支成火局，干见火出，得庚壬两透者，科甲定然。土透制壬，常人。即壬藏支中，亦非白丁，但要运行西北，方可发达。得一癸透，名独杀当权，出人头地。



    若见寅辰亥卯字，化木生火，平常人物，丰衣足食，中年富，但刑克子息，劳而无功。或丙午月、丁未日、辛亥时，亥中有壬制丙，不致贫苦。若丙午时，则滴水难救炎火，必主僧道。若年支见子，虽不科甲，亦有衣衿。



    若干支无火局，有水透干，须用甲木，又要庚噼甲方明。木火通明，主大富贵。或木少火多，焚其木性，不能光透九霄，荣华不久。



    或生月是禄，支皆生旺合局，加以火出，无滴水解炎，乃身旺无依，孤贫之格。女必为尼。即运北地，反主凶危。



    用壬者，金妻水子。用甲者，水妻木子。



    时日月年



    戊丁壬庚



    申亥午午


    时日月年



    甲丁甲辛



    辰未午巳


    时日月年



    甲丁戊癸



    辰丑午卯


    时日月年



    乙丁甲丙



    巳丑午寅


    时日月年



    癸丁甲丙



    卯酉午子'
  vernacular: '五月的丁火，时令归于"建禄"，不适宜乱用甲木。



    遇到年干透出隔位的壬水，不贪图与丁火相合的，为人忠诚而且厚道。如果地支会成火局，天干上见到火出现，得到庚金和壬水都透出天干的，科举功名必定可得。土透出来制壬水，是常人。即使壬水藏在地支之中，也不是普通平民，但要大运走到西北方才可以发达。得到一个癸水透出天干，名为"独杀当权"，能够出人头地。



    如果见到寅、辰、亥、卯等字，化木来生火，是平常人物，丰衣足食，中年富裕，但是刑克子女，劳而无功。如果是丙午月、丁未日、辛亥时，亥中有壬水来制丙火，不至于贫苦。如果是丙午时，就一滴水难以救灭炎火，必定主僧道之命。如果年支见到子水，虽然不是科举正途，也有秀才功名。



    如果干支都没有火局，有水透出天干，必须用甲木，又要庚金劈开甲木才能明达。"木火通明"主大富贵。如果木少而火多，焚烧了木的性质，不能光芒透出九霄，荣华不会长久。



    如果出生月份是禄（巳月），地支都是"生旺"且合成局，加上火出现，没有一滴水来解除炎热，就是"身旺无依"，是孤贫的格局。女命必定成为尼姑。即使大运走到北地（水地），反而主凶险危难。



    用壬水的，以金为妻、以水为子。用甲木的，以水为妻、以木为子。



    命例：时柱戊申、日柱丁亥、月柱壬午、年柱庚午。


    命例：时柱甲辰、日柱丁未、月柱甲午、年柱辛巳。


    命例：时柱甲辰、日柱丁丑、月柱戊午、年柱癸卯。


