  original: '六月之丁，阴柔退气，但值三伏生寒，丁弱极矣，专取甲木，壬水次之。



    若得甲出天干，支成木局，见亥中之壬，为木神有根，接引丁火，必然科甲。即不见木局，支见壬水，虽不大贵，亦有凌云之气，无庚不妙。



    或支成水局，见水透干，则溼木性，不能引丁，必为平人，有甲透、亦有才干。有庚透、方无刑伤。若无甲木，假名假利，虽能生财，固执懦夫。



    或年月日时，皆一派丁未之类，此为纯阴，终无大用。



    用甲者，水妻木子。



    时日月年



    丙丁丁丁



    午未未卯


    时日月年



    丁丁丁壬



    未巳未子'
  vernacular: '六月的丁火，阴柔而"退气"，但正值三伏天中生出一丝寒气，丁火衰弱到了极点，专一取甲木为用神，壬水次之。



    如果得到甲木出现在天干上，地支会成木局，见到亥中所藏的壬水，就是木神有根，接引丁火，必然是科举功名。即使不见木局，地支见到壬水，虽然不是大贵，也有凌云的气势，没有庚金就不妙了。



    如果地支会成水局，见到水透出天干，就会弄湿木的性质，不能引出丁火，必定是平常之人，有甲木透出天干，也还有才干。有庚金透出天干，方才没有刑伤。如果没有甲木，是假名假利，虽然能够生财，但固执如懦夫。



    如果年月日时，全都是一派丁未这样的组合，这叫做纯阴，终究没有大用。



    用甲木的，以水为妻、以木为子。



    命例：时柱丙午、日柱丁未、月柱丁未、年柱丁卯。


