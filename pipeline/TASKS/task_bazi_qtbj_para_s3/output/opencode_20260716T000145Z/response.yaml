  vernacular: '十一月的丁火，或者仲冬（十一月）水多癸水旺，完全没有比肩和印星，这当作为"弃命从杀"来看，也有异路功名。见到丁火比肩出现在天干上，难以符合格局，是常人，而且主骨肉如浮云离散，六亲如流水般疏远。戊土出现来破除癸水，颇有兄弟和妻儿。这个格局用戊土，以火为妻、以土为子。用甲木，以水为妻、以木为子。



