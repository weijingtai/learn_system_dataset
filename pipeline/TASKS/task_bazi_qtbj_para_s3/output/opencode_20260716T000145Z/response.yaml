  original: '五月戊土，仲夏火炎，先看壬水，次取甲木，丙火酌用，用癸力微。



    壬甲两透，名君臣庆会，自然桃浪先声，权高位显，又得辛透年干，官居一品。一命、辛未、甲午、戊寅、壬子，壬甲两透。印旺杀高，出将入相，名播四夷。



    若支成火局，即透癸水，不能大济，是一杯水难济薪火也。人命合此，即好学不倦，亦不能成名，且主目疾。若得壬水出干，则非此比。



    又或土木重重，全无滴水，僧道孤贫之辈。



    用壬者、金妻水子。'
  vernacular: '五月的戊土，仲夏火势炎炎，先看壬水，其次取甲木，丙火酌情使用，用癸水力道微弱。



    壬水和甲木都透出天干，名为"君臣庆会"，自然是桃浪先声（科举捷报先到），权高位显，又得到辛金透出在年干，官居一品。有一个命例：辛未、甲午、戊寅、壬子，壬水和甲木都透出天干，印星旺而"杀"星高居天干，出可为将、入可为相，名声传播到四方异域。



    如果地支会成火局，即使透出癸水，也不能大加救济，这是所谓的一杯水难以救灭一车柴燃烧的火。人命符合这个的，即使好学不倦，也不能功成名就，而且主眼目疾病。如果得到壬水出现在天干上，就不能和这个相比了。



    又或者是土木重重，完全没有一滴水，是僧道孤贫之辈。



    用壬水的，以金为妻、以水为子。'
