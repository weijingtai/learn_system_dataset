  original: '正二月即有甲癸，若无丙除寒，如万物生而不长，故无丙者，富贵艰辛。或有丙无甲癸者，名曰春旱，如万物生而多厄。无甲癸者，一生勤苦，劳而无功。或一派丙火，有甲欠癸，先泰后否。或支成火局，不见壬癸，僧道孤贫。癸透者贵。壬透者富。



    用水者，要审水之多少。或一派甲木，无丙者，常人。得一庚透方妙。或支成水局，甲又出干，又有庚透，富贵双全。



    或无庚金，又无比印，难作从杀，定主遭凶，不然，必为盗贼。若日下坐午，不得善终。



    或一派乙木，为官杀会党，即有庚透，却难制乙，此人内奸外直，口是心非。加一甲在内，无庚，必懒惰自甘，好食无厌。或丙多甲多，宜以癸庚参用。'
  vernacular: '正月和二月即使有甲木和癸水，如果没有丙火来祛除寒气，就如同万物只生不长一样，所以没有丙火的，富贵艰辛。如果有丙火而没有甲木和癸水的，名为"春旱"，如同万物生存而多遭厄难。没有甲木和癸水的，一生勤苦，劳而无功。如果是一派丙火，有甲木而缺少癸水，先顺利后不顺。如果地支会成火局，不见壬水癸水，是僧道孤贫之命。癸水透出的贵，壬水透出的富。



    用水的，要审视水的多少。如果是一派甲木，没有丙火的，是常人。得到一个庚金透出方才妙。如果地支会成水局，甲木又出现在天干上，又有庚金透出，富贵双全。



    如果没有庚金，又没有比肩和印星，难以当作从杀，一定主遭凶，不然的话，必定成为盗贼。如果日柱下面坐着午火，不能得到善终。



    如果是一派乙木，便是"官杀会党"，即使有庚金透出，却难以制住乙木，此人内里奸诈、表面正直，口是心非。加上一个甲木在内，没有庚金，必定懒惰自甘，好吃而不满足。如果丙火多、甲木多，适宜以癸水和庚金参照使用。'
