segments:
  - seg_id: s01
    text: 陰陽順逆妙難窮，二至還鄉一九宮。
    note: 一联，总起阴阳顺逆与二至换局（类型 A 按联切，依 HANDBOOK 第 3 章）
  - seg_id: s02
    text: 若能了達陰陽理，天地都來一掌中。
    note: 一联，承上申明通达阴阳之效
  - seg_id: s03
    text: 軒轅黃帝戰蚩尤，涿鹿經年苦未休。
    note: 一联，转入黄帝战蚩尤典故
  - seg_id: s04
    text: 偶夢天神授符訣，登壇致祭謹虔修。
    note: 一联，述梦授符诀与登坛虔修
