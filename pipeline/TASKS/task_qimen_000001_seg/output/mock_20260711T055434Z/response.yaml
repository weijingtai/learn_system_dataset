segments:
- seg_id: s01
  text: 陰陽順逆妙難窮，
  note: 開篇點題，以陰陽順逆的玄妙引出奇門的核心概念
- seg_id: s02
  text: 二至還鄉一九宮。
  note: 承接上句，點明冬至與夏至與九宮的關係
- seg_id: s03
  text: 若能了達陰陽理，
  note: 轉折設問，引出通達陰陽之理的重要性
- seg_id: s04
  text: 天地都來一掌中。
  note: 回應該問，闡明通陰陽者能掌握天地
- seg_id: s05
  text: 軒轅黃帝戰蚩尤，
  note: 轉入典故，講述黃帝與蚩尤的涿鹿之戰
- seg_id: s06
  text: 涿鹿經年苦未休。
  note: 補充前句，說明戰事曠日持久未分勝負
- seg_id: s07
  text: 偶夢天神授符訣，
  note: 轉折事件，黃帝因夢得天神授符
- seg_id: s08
  text: 登壇致祭謹虔修。
  note: 承接前句，講述黃帝設壇祭祀、虔心修煉的過程
