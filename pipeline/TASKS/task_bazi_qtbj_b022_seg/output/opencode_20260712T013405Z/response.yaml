- seg_id: s01
  entry_title: 正月己土
  path: 十干分论 / 论己土 / 三春己土 / 正月
  text: '### 三春己土

    正月己土，田园犹冻，盖因腊气未除，余寒未退，故丙为尊。得丙照暖，万物自生，忌见壬水，反为己病，何也？壬乃江湖之水，湖水一发，则田园洗荡，变为沙土，而根苗尽没矣。须戊作堤，以保园圃。壬多要见戊制。有戊出干者，定主玉堂金马。若乏戊制，必属平常。


    或一派甲木，有庚出干，加以癸丙齐透，配得中和，亦名利双全。即丙生寅月，庚透天干，亦有俊秀。若甲多无庚，残疾废人，宜用丁洩。


    或一派火，即不见水无剋，何也？正月己土寒滋，必丙暖，反主厚禄。加一癸透，科甲自然。戊透、反作常人。或一派戊土，有甲出制，又主荣显。如见乙出，虽多不能疏土，且乙多者，奸诈小人。


    用丙者，木妻、火子。

    '
  note: 论正月己土田园犹冻以丙为尊忌壬水，壬多须戊作堤，含甲多无庚、一派戊土有甲制变例
  case_candidate: false
- seg_id: s02
  entry_title: 二月己土
  path: 十干分论 / 论己土 / 三春己土 / 二月
  text: '二月己土，阳气渐升，虽禾稼未成，万物出土，田园未展，先取甲木疏之，忌合。次取癸水润之。甲癸出干，定主科甲，加以一丙出透，势压百僚。一见壬水，微末官职。


    或见庚制甲，壬水出干，比劫重重，此必俗子。丙透犹有小富，丙藏衣禄无亏。


    或支成木局，庚透富贵，若柱多乙木，乙又屈庚，庚必输情于乙，不能扫邪于正，此必狡诈之徒，运入东南，恐有不测。当用丁洩之。有丁者、小人而已，不致无良。


    无比印、从杀者贵。


    若柱中无甲丙癸者，皆下格。


    妻子用神同前。


    时日月年


    庚己乙癸


    午巳卯卯

    时日月年


    乙己乙癸


    丑巳卯卯

    '
  note: 论二月己土先甲疏次癸润，甲癸出干科甲，含庚制甲、乙屈庚变例，附两则命造
  case_candidate: true
- seg_id: s03
  entry_title: 三月己土
  path: 十干分论 / 论己土 / 三春己土 / 三月
  text: '三月己土，正栽培禾稼之时，先丙后癸，土暖而润，随用甲疏，三者俱透天干，必官居黄阁。或三者透一，科甲定然，但要得地。却以庚金为病。


    或有甲无癸，亦可致富，但不贵显。或有癸而无甲丙，亦有衣衿。或有丙癸无甲，亦系人才。丙癸全无，流俗之辈。


    或一派乙木，无金制伏，贫而且夭也。


    妻子同前。


    时日月年


    丙己甲壬


    寅卯辰子

    时日月年


    甲己壬辛


    子巳辰未

    时日月年


    壬己甲壬


    申卯辰子

    '
  note: 论三月己土先丙后癸随用甲疏，三者俱透官居黄阁，含乙木无金制伏变例，附三则命造
  case_candidate: true
