- seg_id: s01
  entry_title: 五行总论
  path: 五行总论
  text: '# 五行总论

    五行者，本乎天地之间而不穷者也，故谓之行。

    '
  note: 五行定义：天地间运行不穷之气，故名五行
  case_candidate: false
- seg_id: s02
  entry_title: 五行总论
  path: 五行总论
  text: '北方阴极而生寒，寒生水。南方阳极而生热，热生火。东方阳散以泄而生风，风生木。西方阴止以收而生燥，燥生金。中央阴阳交而生温，温生土。其相生也所以相维，其相克也所以相制，此之谓有伦。

    '
  note: 五行方位起源：北寒生水、南热生火、东风生木、西燥生金、中温生土；相生相维相克相制构成有序关系
  case_candidate: false
- seg_id: s03
  entry_title: 五行总论
  path: 五行总论
  text: '火为太阳，性炎上。水为太阴，性润下。木为少阳，性腾上而无所止。金为少阴，性沉下而有所止。土无常性，视四时所乘，欲使相济得所，勿令太过弗及。

    '
  note: 五行性情：火太阳炎上、水太阴润下、木少阳腾上无止、金少阴沉下有止、土无常性随四时调济
  case_candidate: false
- seg_id: s04
  entry_title: 五行总论
  path: 五行总论
  text: '夫五行之性，各致其用。水者其性智，火者其性礼，木其性仁，金其性义，惟土主信，重宽厚博，无所不容：以之水，即水附之而行；以之木，则木托之而生；金不得土，则无自出；火不得土，则无自归。必损实以为通，致虚以为明，故五行皆赖土也。

    '
  note: 五行功用：水智火礼木仁金义土信，土居中为枢纽，四行皆赖土而行、生、出、归
  case_candidate: false
- seg_id: s05
  entry_title: 五行总论
  path: 五行总论
  text: '推其形色，则水黑、火赤、木青、土黄，此正色也。及其变易，则不然。常以生旺从正色，死绝从母色，成形冠带从妻色，病败从鬼色，旺墓从子色。

    '
  note: 五行形色正变：五正色（黑赤青黄）及五变色规则（生旺从正、死绝从母、冠带从妻、病败从鬼、旺墓从子）
  case_candidate: false
- seg_id: s06
  entry_title: 五行总论
  path: 五行总论
  text: '其数则水一、火二、木三、金四、土五。生旺加倍，死绝减半。

    '
  note: 五行数理：水一火二木三金四土五，生旺加倍死绝减半
  case_candidate: false
- seg_id: s07
  entry_title: 五行总论
  path: 五行总论
  text: '以义推之，夫万物负阴而抱阳，冲气以和。过与不及，皆为乖道。故高者抑之使平，下者举之使崇，或益其不及，或损其太过。所以贵在折衷，归於中道，使无有余不足之累，即才官印食贵人驿马之微意也。行运亦如之，识其微意，则於命理之说，思过半矣。

    '
  note: 中和折衷之道：万物负阴抱阳冲气为和，过与不及皆乖道，抑高举下损益折衷归於中道，即命理核心
  case_candidate: false
