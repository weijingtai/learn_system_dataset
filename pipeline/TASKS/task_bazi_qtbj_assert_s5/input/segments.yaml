segments:
- seg_id: s01
  span_id: ss_qtbj_ed01_p0039_s01
  entry_title: 三秋庚金
  case_candidate: false
  text: '### 三秋庚金

    七月庚金，刚锐极矣。专用丁火煅炼，次取甲木引丁，故曰：秋金锐锐最为奇，壬癸相逢总不宜，如逢木火来成局，试看福寿与天齐。


    如得丁甲两透，定步青云。若有丁无甲为俊秀。有甲无丁是平人。丁甲两无无用物，只堪门下作闲人。


    或支成水局，乏丁用丙，柱中即有丙火，不见甲木者，必主愚懦。何也？当时金水两旺，金生水以制火，何能发达。或见甲出引丁，可云生监。甲弱者、衣食充盈。


    或支成土局，先甲后丁。支成火局，富贵中人。金刚木明，行商坐贾之人。金备申酉戌之地，富贵无疑。金神入火乡，逢羊刃，富贵荣华。'
- seg_id: s02
  span_id: ss_qtbj_ed01_p0039_s02
  entry_title: 八月庚金
  case_candidate: true
  text: '八月庚金，刚锐未退，用丁用甲，丙不可少。若丁甲透，又见一丙，功名显赫，且见羊刃，无刑剋，丙杀藏支，名为羊刃驾杀，主出将入相，直介忠臣。


    或丙火重重，一丁高透，亦主科甲。丙出丁藏，异路功名。


    或甲藏支，火透而水不透者，亦主清高，衣衿可望。


    或丁藏支内，重见丙火者，此名假杀重重，虽羊刃帖身，却难从杀也。即一丙透，秀而不富。或支见重重甲乙，无用之人。


    总之，旺金木衰，非火莫制，不见丙丁，艺术之辈。


    时日月年


    丙庚丁丙


    子子酉子

    时日月年


    丁庚乙乙


    亥午酉巳

    时日月年


    戊庚癸己


    寅申酉亥'
- seg_id: s03
  span_id: ss_qtbj_ed01_p0039_s03
  entry_title: 九月庚金
  case_candidate: true
  text: '九月庚金，戊土司令，最怕土厚埋金，宜先用甲疏，后用壬洗，则金自出矣。忌见己土浊壬。


    壬甲两透，科甲相宜。或甲透壬藏，乡魁可望。甲藏壬透，廪贡堪谋。有甲无壬，犹有学问。有壬无甲，莫问衣衿。壬甲两无，则为下格。


    或支成水局，丙透救之，此人才高迈众，名重乡闾，不见癸水，一榜可许。


    或四柱戊多金旺，全无甲壬者，即有衣禄，亦不能久。或庚戊多而无壬甲者，愚顽之辈。


    时日月年


    甲庚戊辛


    申申戌酉

    时日月年


    辛庚丙庚


    巳戌戌寅

    时日月年


    辛庚戊辛


    巳申戌酉'
- seg_id: s01
  span_id: ss_qtbj_ed01_p0040_s01
  entry_title: 三冬庚金
  case_candidate: true
  text: '### 三冬庚金

    十月庚金，水冷性寒，非丁莫造，非丙不暖。丁甲两透，支无水局，一榜有之。支藏丙火，桃浪之仙。支见亥子，得己出制，亦有功名。


    若见丙透无丁者，决无显达。丁藏甲透，武职之人。以上不合者，庸俗。


    如金水混杂，全无丙丁者，鄙夫。支成金局，无火者，僧道之命也。书曰：水冷金寒爱丙丁。


    时日月年


    壬庚辛丁


    午子亥亥

    时日月年


    丙庚辛壬


    子辰亥辰'
- seg_id: s02
  span_id: ss_qtbj_ed01_p0040_s02
  entry_title: 十一月庚金
  case_candidate: true
  text: '十一月庚金，天气严寒，仍取丁甲，次取丙火照暖。或丁甲两透，丙在支中，必主科甲。即无丙火，亦有衣衿。有丁无甲，亦可富中取贵。有甲无丁，只作常人。或丙透丁藏，异途名望。丁藏有甲，武学可许。


    或重重丙火，可许一富，但不清高。丙戊生寅，或丙坐支寅，有一二者，富真贵假。若见癸透。一介寒儒。


    或支成水局，二见丙丁者，此乃伤官格，为人清雅，衣禄常盈，但子息艰难耳。


    或丙丁太多，名官杀混杂最无良。又怕身轻有损伤。如遇东南二运地，焉能挨得过时光。过于清冷，似有凄凉。柱中一派金水，不入火土之乡，主一生孤贫浪荡，难望有成也。


    时日月年


    庚庚壬壬


    辰申子子

    时日月年


    癸庚庚辛


    未辰子亥

    时日月年


    戊庚戊乙


    寅寅子卯'
- seg_id: s03
  span_id: ss_qtbj_ed01_p0040_s03
  entry_title: 十二月庚金
  case_candidate: true
  text: '十二月庚金，寒气太重，且多湿泥，愈寒愈冻，先取丙火解冻，次取丁火炼金，甲亦不可少。


    丙丁甲透者，即不科甲，亦有思荣。有丙无丁甲者，富中取贵。有丁甲无丙者，特达才人。有丙丁无甲者，白手成家，刀笔亨通，乏金更美。或支成金局无火，僧道之流。


    时日月年


    癸庚己庚


    未戌丑辰


    女命

    时日月年


    甲庚丁己


    申子丑巳'
- seg_id: s01
  span_id: ss_qtbj_ed01_p0042_s01
  entry_title: 三春辛金
  case_candidate: false
  text: '### 三春辛金

    正月辛金，阳气舒而寒气未除，不知正月建寅，中有长生之丙，解去寒气，忌甲木司权，辛金失令，取己土为生身之本，欲得辛金发现，全赖壬水之功，己壬两透，支见庚制甲，科甲定然。或己土透干，支中有甲，异路恩荣。或己土不全，号曰君臣失势，富贵难全。或有丙火出干，亦主武学。或见壬、无己庚者，贫贱之徒。


    或支成火局，即壬水出干，不剋己土，亦寻常之人。或庚壬两透，破局制火，必为显达之人。


    或支成水局，不见丙火，名为金弱沉寒，平常之士，书曰：金水性寒寒到底，凄凉难免少年忧。得丙照暖，反主富贵。


    故正月辛金，先己后壬。己为君，庚为佐。如用丙火须参看。用己，火妻土子。用壬，金妻水子。


    辛金珠玉，最怕红炉，辛逢卯日子时，名曰朝阳。


    时日月年


    己辛庚丙


    丑酉寅辰'
- seg_id: s02
  span_id: ss_qtbj_ed01_p0042_s02
  entry_title: 二月辛金
  case_candidate: true
  text: '二月辛金，阳和之际，壬水为尊，见戊己为病。得甲制伏，则辛金不致埋没，壬水不致混浊，合此者必身入玉堂。故二月辛金，有壬甲透者贵显。否则，乡绅。或壬坐亥支，不见土出，可能入芥，家亦小康。得申中之壬者，异途名望。无壬者常人。其生剋之理，与正月辛金皆同。


    或壬戊透，甲不出干，此为病不遇药，平常之人。得乙破戊，颇有衣衿。但假名假利，刻薄乖张。


    或一派壬水汪洋，名金水淘洗太过，不得中和，略有衣食，全无作为。如壬水重重，得戊反吉。或支成木局，洩尽壬水，有庚富贵，无庚平人。


    或支成火局，名官印相争，金水两伤，下流之格。得二壬出制，富贵反奇。


    辛金生于春季，一派壬水，而无丙火，即能显达，家无宿舂。得壬丙齐透，方许大富大贵。


    时日月年


    甲辛己乙


    午酉卯卯

    时日月年


    丙辛己乙


    申卯卯酉


    时日月年


    己辛丁己


    亥巳卯未

    时日月年


    己辛丁甲


    亥未卯午

    时日月年


    壬辛癸壬


    辰卯卯子'
- seg_id: s03
  span_id: ss_qtbj_ed01_p0042_s03
  entry_title: 三月辛金
  case_candidate: false
  text: '三月辛金，戊土司令，辛承正气，母旺子相，先壬后甲。壬甲两透，富贵必然。壬透甲藏，廪贡不失。甲透壬藏，富则可云。壬甲皆无，平常之格。


    所忌者丙贪合也，如月时皆丙，名为争合，主慷慨风流，交游四海。若癸出干制丙，可许采芹。或支坐亥子之乡，支又见申，即非玉堂，亦必高增禄位。若戊出干制水，不见甲乙，清闲之人。


    又或支见四库，名土厚金埋，不见甲制，愚顽之辈。或四柱火多，无水制伏，名火土杂乱，主作缁衣，见癸可解。


    或比劫重重，壬癸浅弱，主夭。有甲出干，则贵，然无庚制方妙。'
- seg_id: s01
  span_id: ss_qtbj_ed01_p0043_s01
  entry_title: 三夏辛金
  case_candidate: false
  text: '### 三夏辛金

    四月辛金，时逢首夏，忌丙火之燥烈，喜壬水之洗淘。支成金局，水透出干，有木制戊，名一清澈底，科甲功名。癸透壬藏，富真贵假。若壬癸皆藏，戊己亦藏，略富。若壬癸俱无，反见火出，必主鳏独。


    或支成火局，有制者吉，无制者凶。凡火旺无水，取土洩之。


    若壬水藏亥，戊不出干，亦主上达。有戊常人。有一甲透，衣禄可求。若有甲无壬癸者，富贵虚浮。所谓羊质虎皮是也。壬、癸、甲、三者全无，又不合格，斯为下品。


    时日月年


    乙辛辛乙


    未亥巳未'
- seg_id: s02
  span_id: ss_qtbj_ed01_p0043_s02
  entry_title: 五月辛金
  case_candidate: false
  text: 五月辛金，丁火司权，辛金失令，阴柔之极，不宜煅炼，须己壬兼用，何也？己为泥沙，壬为湖海，己无壬不湿，辛无己不生，故壬己并用。无壬、癸亦可用。但癸力小。或支成火局，即重见癸出亦不济，得壬透破火方可，必主生员。若无壬，癸见戊，虽有午宫己土，燥泥成灰，金必毁镕，反遭埋没，必为僧道。有一二重比肩，不致孤独。
- seg_id: s03
  span_id: ss_qtbj_ed01_p0043_s03
  entry_title: 五月辛金
  case_candidate: false
  text: '五月辛金，壬、癸、己、三者皆用。或壬己两透，支见癸水，不剋，定主显达。即己藏支，亦有廪贡。或无壬有己，须得异途。或癸出有庚，必主衣锦，叨受恩荣。若水土多见，见甲方妙。


    庚辛生于夏月，要壬癸得地，若木多火多，不见金水，逢金水运必败。


    时日月年


    壬辛甲丙


    辰亥午子'
- seg_id: s04
  span_id: ss_qtbj_ed01_p0043_s04
  entry_title: 六月辛金
  case_candidate: true
  text: '六月辛金，己土当权，辅助太多，恐掩金光，先用壬水，取庚佐之。壬庚两透，科甲功名，即不出干，藏支得所，亦有荣华。但忌戊出，得甲制之，方吉。甲须隔位，恐贪己合，反掩金光，又塞壬水之流，下贱之格。又忌庚出制甲。或只有未中一己，见了壬水，又为湿泥。不可见甲，甲出，反作平人。总以一壬一己，见庚无甲，方妙﹐与五月用己壬同。


    或丁乙出干，又有庚壬者，显贵。无壬者、否。或支成木局，得壬透，又有庚金发水之源，可云富贵。


    时日月年


    甲辛丁壬


    午丑未辰

    时日月年


    丁辛辛甲


    酉未未寅'
- seg_id: s01
  span_id: ss_qtbj_ed01_p0044_s01
  entry_title: 三秋辛金
  case_candidate: false
  text: '### 三秋辛金

    七月辛金，值庚司令，不旺自旺，且壬水居申，四柱不见戊土，胎元戊藏申内，为壬堤岸，人命得此，为官清正，但不富耳。


    或有土无甲，为有病无药，常人。有甲者，衣衿可望。或四柱金多，宜水洩之。若一派金水，得一戊土，反为辛用，又宜甲制，自然富贵。或干支水多，重见戊土，逢生得位，福寿之造。'
- seg_id: s02
  span_id: ss_qtbj_ed01_p0044_s02
  entry_title: 七月辛金
  case_candidate: false
  text: '七月辛金，壬不在多，故书云：水浅金多，号曰体全之象，壬水为尊，甲戊酌用可也，癸水不可为用。


    时日月年


    癸辛壬甲


    巳卯申午'
- seg_id: s03
  span_id: ss_qtbj_ed01_p0044_s03
  entry_title: 八月辛金
  case_candidate: true
  text: '八月辛金，当权得令，旺之极矣，专用壬水淘洗火，故云：金见水以流通。如见戊己，则生扶太过，故以土为病，见甲制土、方妙。无戊、不宜用甲。


    或四柱一点壬水，甲多洩水，此为用神无力，奸诈之徒。得庚制者，反主仁义。或三点辛金，一重壬水，多见甲木，有庚透者，主大富贵。不见丁为美，若见一丁，此人风雅清高，衣食饶裕而已。


    或一二比肩，壬甲皆一，无庚出干，亦有恩荣。若二三比肩，一点壬水，戊土多见，此为土厚埋金，此人愚懦，见一甲出，必为创立之人。


    或一派辛金，一位壬水，无庚杂乱，又主富中取贵。或一派壬水洩金，无戊出制，为沙水同流，主奔波劳苦。若得支见一戊止流，其人颇有才略，艺术过人。


    或支成金局，干见比肩，无壬淘洗，此宜用丁，无丁必主凶顽无赖。若得一壬高透，以洩群金，又名一清到底，定有治国之材。


    或支成金局，戊己透干，壬透无火，名曰虎格，运行西北，富贵大显，子息艰难。或透丙火，虽有壬出，亦属平庸。


    或一二辛金，一派己土，定为僧道。或干透己土，支见庚甲，一生安闲。或一派乙木，不见庚干，为才多身弱，一见庚制，富贵可期。


    金生秋月土重，贫无寸铁。六辛日逢戊子时，运喜西方，阴若朝阳，切忌丙丁离位。庚辛局全巳酉丑，位高权重。


    时日月年


    己辛癸己


    亥未酉酉

    时日月年


    丙辛己丁


    申酉酉酉

    时日月年


    壬辛己丁


    辰亥酉卯'
- seg_id: s04
  span_id: ss_qtbj_ed01_p0044_s04
  entry_title: 九月辛金
  case_candidate: false
  text: '九月辛金，戊土司令，母旺子相，须甲疏土，壬洩旺金，先壬后甲。壬甲两透，桃洞之仙。或壬透甲藏，又见戊者，平人。甲透、壬藏，戊在支内，异途之仕。


    或辛日甲月，壬水在支，有庚自能去浊留清，秋闱一榜。若戊戌月，即有甲在支，亦否。


    总之土太多，甲不出干，莫问功名，得一壬出，洗土助甲，虽不发达，富而可求。


    或土多无壬甲，时月多透丙辛者，略贵。加以辰字在支，则荣显莫及。


    或木多土厚，无水者常人。或干上重见癸水，虽无淘洗之功，颇有清明之用。此命主贵、辛苦。


    或己透无壬有癸，亦能滋生金力，衣衿之贵，但恐己多，不免浊富。'
- seg_id: s05
  span_id: ss_qtbj_ed01_p0044_s05
  entry_title: 九月辛金
  case_candidate: true
  text: '九月辛金，火土为病，水木为药。


    时日月年


    壬辛戊丙


    辰未戌戌

    时日月年


    戊辛壬戊


    子酉戌戌

    时日月年


