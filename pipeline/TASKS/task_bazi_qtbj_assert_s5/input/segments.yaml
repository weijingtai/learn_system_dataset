- seg_id: s01
  span_id: ss_qtbj_ed01_p0045_s01
  entry_title: 三冬辛金
  case_candidate: false
  text: '### 三冬辛金

    十月辛金，时值小阳，阳气渐升，寒气将降，先用壬水，次取丙火，壬丙两透，金榜题名，何也？盖辛金有壬水丙火，名金白水清，又在亥月故发。丙透壬藏，采芹之造。丙藏壬透，富有千金。壬丙在支，聪明之士。


    戊壬在柱，积富之人。或壬多无戊，名辛水汪洋，反成贫贱。戊多壬少，又主成名。或甲多戊少，因艺术而蓄金。


    若己多有戊，壬水被困，金被埋，不过诚实之人。或壬癸多无戊丙者，劳碌辛苦。十月辛金，先壬后丙，余皆参用。'
- seg_id: s02
  span_id: ss_qtbj_ed01_p0045_s02
  entry_title: 十一月辛金
  case_candidate: false
  text: '十一月辛金，癸水司令，为寒冬雨露，切忌癸出冻金，而困丙火，壬丙两透，不见戊癸，衣锦腰金。即壬藏丙透，一榜堪图。


    或壬多有戊，丙甲出干者，青云之客。若壬多无戊丙者，洩金太过，定主寒儒。或壬多、甲乙重重，无丙火者，贫寒。


    或支成水局，癸水出干，有二戊制者，富贵恩荣，无戊者常人。或支见亥子丑，干出比劫，无丙、名润下格，富贵双全，运喜西北。若无庚辛，又出甲乙，无戊丙者，必主僧道。


    或支成木局，有丁出干，又见成者，功名特达。冬月辛金，须丙温暖方妙。'
- seg_id: s03
  span_id: ss_qtbj_ed01_p0045_s03
  entry_title: 十二月辛金
  case_candidate: false
  text: '十二月辛金，寒冻之极，先丙后壬，无丙不能解冻，无壬不能洗淘。丙壬两透，金马玉堂之客。壬丙俱藏，游庠食饩之人。有丙无壬富真贵假。有壬乏丙，贱而且贫。或丙多、无壬、有癸，市中贸易之流。


    或水多、有戊己出干，又有丙丁，必主衣食充盈，一生安乐。'
- seg_id: s04
  span_id: ss_qtbj_ed01_p0045_s04
