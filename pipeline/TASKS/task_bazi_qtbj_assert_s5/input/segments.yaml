- seg_id: s02
  span_id: ss_qtbj_ed01_p0049_s02
  entry_title: 五月壬水
  case_candidate: true
  text: '五月壬水，丁旺壬弱，取癸为用，取庚为佐。无庚不能发水，无癸不能伤丁。五月壬水，辛癸亦可参用，其理与四月皆同。


    庚癸两透，科甲必然，庚壬两透，官居极品。有庚无壬癸者、常人。


    或支成火局，全无金水，名才多身弱，富屋贫人。若又甲乙多者，僧道之命。


    时日月年


    辛壬壬庚


    亥寅午午

    时日月年


    甲壬丙丁


    辰寅午酉'
- seg_id: s03
  span_id: ss_qtbj_ed01_p0049_s03
  entry_title: 六月壬水
  case_candidate: false
  text: '六月壬水，己土当权，丁火退气，先用辛金癸水，次用甲木噼土。六月壬水，先辛后甲，次取癸水。辛甲两透，富贵清高。甲藏辛透，贡监生员。辛藏甲透，异途武职。甲壬两透，无伤，有治国之贵。即甲藏壬出无破，是拾芥之才。或支多土火，又只清贫。


    或一派己土，此假从杀格，为人奸诈，且主孤贫，得甲乙出制可救。凡土居生旺之地，须用木制方妙。或支成木局，洩水太过，当用金水为贵，以金为妻、水为子。'
