  original: '五月壬水，丁旺壬弱，取癸为用，取庚为佐。无庚不能发水，无癸不能伤丁。五月壬水，辛癸亦可参用，其理与四月皆同。



    庚癸两透，科甲必然，庚壬两透，官居极品。有庚无壬癸者、常人。



    或支成火局，全无金水，名才多身弱，富屋贫人。若又甲乙多者，僧道之命。



    时日月年



    辛壬壬庚



    亥寅午午


    时日月年



    甲壬丙丁



    辰寅午酉'
  vernacular: '五月的壬水，丁火旺而壬水弱，取癸水为用神，取庚金为辅佐。没有庚金就不能发动水源，没有癸水就不能伤害丁火。五月的壬水，辛金和癸水也可以参考使用，其中的道理与四月都相同。



    庚金和癸水都透出天干，科举功名必然可得，庚金和壬水都透出天干，官居极品。有庚金而没有壬水和癸水的，是常人。



    如果地支会成火局，完全没有金和水，名为"才多身弱"，是富屋中的穷人。如果又有甲木乙木多的，是僧道之命。



    命例：时柱辛亥、日柱壬寅、月柱壬午、年柱庚午。


    命例：时柱甲辰、日柱壬寅、月柱丙午、年柱丁酉。'
