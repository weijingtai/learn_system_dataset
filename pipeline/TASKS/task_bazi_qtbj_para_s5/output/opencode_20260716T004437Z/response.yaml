  original: '三月辛金，戊土司令，辛承正气，母旺子相，先壬后甲。壬甲两透，富贵必然。壬透甲藏，廪贡不失。甲透壬藏，富则可云。壬甲皆无，平常之格。



    所忌者丙贪合也，如月时皆丙，名为争合，主慷慨风流，交游四海。若癸出干制丙，可许采芹。或支坐亥子之乡，支又见申，即非玉堂，亦必高增禄位。若戊出干制水，不见甲乙，清闲之人。



    又或支见四库，名土厚金埋，不见甲制，愚顽之辈。或四柱火多，无水制伏，名火土杂乱，主作缁衣，见癸可解。



    或比劫重重，壬癸浅弱，主夭。有甲出干，则贵，然无庚制方妙。'
  vernacular: '三月的辛金，戊土当令主事，辛金承受正气，母（戊土）旺而子（辛金）相，先取壬水、后取甲木。壬水和甲木都透出天干，富贵必然可得。壬水透出而甲木藏在地支，廪生贡生的功名不会失去。甲木透出而壬水藏在地支，富是可以说的。壬水和甲木都没有，是平常的格局。



    所忌怕的是丙火贪合，如果月柱和时柱都是丙火，名为"争合"，主慷慨风流，交游遍及四海。如果癸水出现在天干上来制丙火，可以许为入学中秀才。如果地支坐在亥子的水乡，地支又见到申，即使不是玉堂（翰林院），也必定高高提升禄位。如果戊土出现在天干上来制水，不见甲木乙木，是清闲之人。



    又或者地支见到四库（辰戌丑未），名为"土厚金埋"，不见甲木来制伏，是愚蠢顽劣之辈。如果四柱火多，没有水来制伏，名为"火土杂乱"，主做僧道（穿黑衣），见到癸水可以解除。



    如果"比劫"重重，壬水癸水浅弱，主夭折。有甲木出现在天干上，就会贵，但没有庚金来制伏方才妙。'
