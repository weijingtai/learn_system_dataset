  original: '### 三冬辛金


    十月辛金，时值小阳，阳气渐升，寒气将降，先用壬水，次取丙火，壬丙两透，金榜题名，何也？盖辛金有壬水丙火，名金白水清，又在亥月故发。丙透壬藏，采芹之造。丙藏壬透，富有千金。壬丙在支，聪明之士。



    戊壬在柱，积富之人。或壬多无戊，名辛水汪洋，反成贫贱。戊多壬少，又主成名。或甲多戊少，因艺术而蓄金。



    若己多有戊，壬水被困，金被埋，不过诚实之人。或壬癸多无戊丙者，劳碌辛苦。十月辛金，先壬后丙，余皆参用。'
  vernacular: '十月的辛金，时令正值小阳春，阳气渐渐上升，寒气将要降临，先用壬水，其次取丙火，壬水和丙火都透出天干，金榜题名，为什么呢？因为辛金有壬水和丙火，名为"金白水清"，又逢亥月所以发达。丙火透出而壬水藏在地支，是入学中秀才的命格。丙火藏在地支而壬水透出天干，富有千金。壬水和丙火都在地支，是聪明之士。



    戊土和壬水都在命局中的，是积富之人。如果壬水多而没有戊土，名为"辛水汪洋"，反而成为贫贱。戊土多而壬水少，又主能成名。如果甲木多而戊土少，因艺术手艺而积蓄金钱。



    如果己土多而有戊土，壬水被困住，金被埋没，不过是一个诚实之人。如果壬水癸水多而没有戊土丙火的，劳碌辛苦。十月的辛金，先取壬水、后取丙火，其余都参考使用。'
  kept_terms:
  - 金白水清
  - 辛水汪洋
  status: machine_translated
- span_id: ss_qtbj_ed01_p0045_s02
  original: '十一月辛金，癸水司令，为寒冬雨露，切忌癸出冻金，而困丙火，壬丙两透，不见戊癸，衣锦腰金。即壬藏丙透，一榜堪图。



    或壬多有戊，丙甲出干者，青云之客。若壬多无戊丙者，洩金太过，定主寒儒。或壬多、甲乙重重，无丙火者，贫寒。



    或支成水局，癸水出干，有二戊制者，富贵恩荣，无戊者常人。或支见亥子丑，干出比劫，无丙、名润下格，富贵双全，运喜西北。若无庚辛，又出甲乙，无戊丙者，必主僧道。



    或支成木局，有丁出干，又见成者，功名特达。冬月辛金，须丙温暖方妙。'
  vernacular: '十一月的辛金，癸水当令主事，是寒冬的雨露，切忌癸水出现来冻住金，而困住丙火，壬水和丙火都透出天干，不见戊土和癸水，衣锦还乡、腰佩金印。即使壬水藏在地支而丙火透出天干，一榜功名可以期望。



    如果壬水多而有戊土，丙火和甲木出现在天干上的，是直上青云之人。如果壬水多而没有戊土和丙火的，泄耗金太过了，一定主是贫寒的儒生。如果壬水多、甲木乙木重重，没有丙火的，贫寒。



    如果地支会成水局，癸水出现在天干上，有两个戊土来制伏的，富贵有皇恩荣宠，没有戊土的是常人。如果地支见到亥子丑，天干出现"比劫"，没有丙火、名为"润下格"，富贵双全，大运喜欢西北方。如果没有庚金辛金，又出现甲木乙木，没有戊土和丙火的，必定主僧道。



    如果地支会成木局，有丁火出现在天干上，又见到成功的，功名特别通达。冬天的辛金，必须有丙火温暖方才妙。'
  kept_terms:
  - 司令
  - 比劫
  - 润下格
  status: machine_translated
- span_id: ss_qtbj_ed01_p0045_s03
  original: '十二月辛金，寒冻之极，先丙后壬，无丙不能解冻，无壬不能洗淘。丙壬两透，金马玉堂之客。壬丙俱藏，游庠食饩之人。有丙无壬富真贵假。有壬乏丙，贱而且贫。或丙多、无壬、有癸，市中贸易之流。



    或水多、有戊己出干，又有丙丁，必主衣食充盈，一生安乐。'
  vernacular: '十二月的辛金，寒冷冰冻到了极点，先取丙火、后取壬水，没有丙火就不能解除冰冻，没有壬水就不能淘洗。丙火和壬水都透出天干，是金马玉堂（翰林院）的贵客。壬水和丙火都藏在地支，是游学于庠序、享受官粮的人。有丙火而没有壬水，富是真的、贵是假的。有壬水而缺少丙火，卑贱而且贫困。如果丙火多、没有壬水、有癸水，是市场中的贸易之辈。



    如果水多、有戊土己土出现在天干上，又有丙火丁火，必定主衣食充盈，一生安乐。'
  status: machine_translated
