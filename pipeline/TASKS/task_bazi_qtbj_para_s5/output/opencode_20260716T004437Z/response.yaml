  original: '### 三冬庚金


    十月庚金，水冷性寒，非丁莫造，非丙不暖。丁甲两透，支无水局，一榜有之。支藏丙火，桃浪之仙。支见亥子，得己出制，亦有功名。



    若见丙透无丁者，决无显达。丁藏甲透，武职之人。以上不合者，庸俗。



    如金水混杂，全无丙丁者，鄙夫。支成金局，无火者，僧道之命也。书曰：水冷金寒爱丙丁。



    时日月年



    壬庚辛丁



    午子亥亥


    时日月年



    丙庚辛壬



    子辰亥辰'
  vernacular: '十月的庚金，水冷而性质寒冷，没有丁火就不能造就，没有丙火就不能温暖。丁火和甲木都透出天干，地支没有水局，考中一榜可以有。地支藏有丙火，是桃浪之仙（科举高中的人）。地支见到亥和子，得到己土出现来制伏，也有功名。



    如果见到丙火透出而没有丁火的，决不会显达。丁火藏在地支而甲木透出天干，是武职之人。以上条件不符合的，是庸俗之辈。



    如果金水混杂，完全没有丙火丁火的，是鄙陋之人。地支会成金局，没有火的，是僧道之命。书中说：水冷金寒喜爱丙火丁火。



    命例：时柱壬午、日柱庚子、月柱辛亥、年柱丁亥。


    命例：时柱丙子、日柱庚辰、月柱辛亥、年柱壬辰。'
  kept_terms:
  - 水冷金寒
  status: machine_translated
- span_id: ss_qtbj_ed01_p0040_s02
  original: '十一月庚金，天气严寒，仍取丁甲，次取丙火照暖。或丁甲两透，丙在支中，必主科甲。即无丙火，亦有衣衿。有丁无甲，亦可富中取贵。有甲无丁，只作常人。或丙透丁藏，异途名望。丁藏有甲，武学可许。



    或重重丙火，可许一富，但不清高。丙戊生寅，或丙坐支寅，有一二者，富真贵假。若见癸透。一介寒儒。



    或支成水局，二见丙丁者，此乃伤官格，为人清雅，衣禄常盈，但子息艰难耳。



    或丙丁太多，名官杀混杂最无良。又怕身轻有损伤。如遇东南二运地，焉能挨得过时光。过于清冷，似有凄凉。柱中一派金水，不入火土之乡，主一生孤贫浪荡，难望有成也。



    时日月年



    庚庚壬壬



    辰申子子


    时日月年



    癸庚庚辛



    未辰子亥


    时日月年



    戊庚戊乙



    寅寅子卯'
  vernacular: '十一月的庚金，天气严寒，仍然取丁火和甲木，其次取丙火来照耀温暖。如果丁火和甲木都透出天干，丙火在地支之中，必定主科举功名。即使没有丙火，也有秀才功名。有丁火而没有甲木，也可以从富中求得贵气。有甲木而没有丁火，只作为平常之人。如果丙火透出而丁火藏在地支，是异路的名望。丁火藏而甲木有，武学可以许给。



    如果重重有丙火，可以许为一富，但不一定清高。丙火和戊土生在寅，或者丙火坐在地支寅上，有一两个这样的，富是真的而贵是假的。如果见到癸水透出天干，只是一个贫寒的儒生。



    如果地支会成水局，两处见到丙火丁火，这就是"伤官格"，为人清雅，衣禄常常丰盈，但子女艰难罢了。



    如果丙火丁火太多，名为"官杀混杂"，最是不良。又怕日主身轻有损伤。如果遇到东南方（木火）的大运之地，哪里能挨得过时光。过于清冷，似乎有凄凉之意。命局中一派金水，不进入火土之乡，主一生孤贫浪荡，难以期望有成就。



    命例：时柱庚辰、日柱庚申、月柱壬子、年柱壬子。


    命例：时柱癸未、日柱庚辰、月柱庚子、年柱辛亥。


    命例：时柱戊寅、日柱庚寅、月柱戊子、年柱乙卯。'
  kept_terms:
