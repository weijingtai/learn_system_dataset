  original: '六月壬水，己土当权，丁火退气，先用辛金癸水，次用甲木噼土。六月壬水，先辛后甲，次取癸水。辛甲两透，富贵清高。甲藏辛透，贡监生员。辛藏甲透，异途武职。甲壬两透，无伤，有治国之贵。即甲藏壬出无破，是拾芥之才。或支多土火，又只清贫。



    或一派己土，此假从杀格，为人奸诈，且主孤贫，得甲乙出制可救。凡土居生旺之地，须用木制方妙。或支成木局，洩水太过，当用金水为贵，以金为妻、水为子。'
  vernacular: '六月的壬水，己土当权主事，丁火退气，先用辛金和癸水，其次用甲木来劈开土。六月的壬水，先取辛金、后取甲木，其次取癸水。辛金和甲木都透出天干，富贵清高。甲木藏在地支而辛金透出天干，是贡生监生的生员。辛金藏在地支而甲木透出天干，是异路功名的武职。甲木和壬水都透出天干，没有受伤害，有治理国家的贵气。即使甲木藏而壬水出现没有破格，也是拾取功名的人才。如果地支多土和火，又只是清贫。



    如果是一派己土，这叫"假从杀格"，为人奸诈，而且主孤贫，得到甲木乙木出现来制伏可以挽救。凡是土居于"生旺"之地，必须用木来制伏方才妙。如果地支会成木局，泄水太过，应当以金和水为贵，以金为妻、以水为子。'
  kept_terms:
  - 当权
  - 退气
  - 假从杀格
  - 杀
  - 生旺
  status: machine_translated
