  original: '### 三春壬水


    正月壬水，汪洋之象，能并百川之流，然水性柔弱，宜用庚金之源，庶不致汪洋无度。有庚丙戊三者齐透，科甲功名。或庚戊藏支，丙坐寅支者，亦有恩诰，即一庚透，贡监有之。



    凡壬日无比肩羊刃者，不必用戊，专用庚金，以丙为佐。



    或见比劫，又有庚辛，此弱极复旺，又宜制伏。戊透、可云科甲。戊藏、则是秀才。然必丙透不合、为妙。



    或支见多戊，又有甲出，名一将当关，群邪自伏，主光明磊落，名重百僚。或支成火局，惜不逢时，主名利皆虚，文章骇俗。



    用庚者，土妻庚子。用丙者，木妻火子。用戊者，火妻土子。



    时日月年



    庚壬丙己



    子辰寅巳'
  vernacular: '正月的壬水，是汪洋的景象，能够合并百川的水流，然而水的性质柔弱，适宜用庚金作为水的源头，或许不至于汪洋泛滥没有限度。有庚金、丙火、戊土三者一起透出天干，有科举功名。如果庚金和戊土藏在地支，丙火坐在寅支，也有皇恩诰命，即使只有一个庚金透出天干，贡生监生也会有。



    凡是壬水日柱而没有"比肩"和"羊刃"的，不必用戊土，专用庚金，以丙火为辅佐。



    如果见到"比劫"，又有庚金辛金，这是衰弱到极点又再度旺盛，又适宜制伏。戊土透出天干，可以说有科举功名。戊土藏在地支，就是秀才。然而必须丙火透出而不合化，方才为妙。



    如果地支见到多处戊土，又有甲木出现，名为一将当关，群邪自然降伏，主为人光明磊落，名声重于百官。如果地支会成火局，可惜不逢其时，主名利都是虚幻，但文章惊世骇俗。



    用庚金的，以土为妻、以庚金为子。用丙火的，以木为妻、以火为子。用戊土的，以火为妻、以土为子。



    命例：时柱庚子、日柱壬辰、月柱丙寅、年柱己巳。'
  kept_terms:
  - 比肩
  - 羊刃
  - 比劫
  status: machine_translated
- span_id: ss_qtbj_ed01_p0048_s02
  original: '二月壬水，寒气初除，有并流之象，不用丙暖，专取戊土辛金。二月壬水，先戊后辛，庚金次之。



    戊辛两透，雁塔题名。戊透辛藏，亦有恩诰。或戊辛不透，有庚出干者、主富。或支成木局，有庚透者，金榜题名。庚在支者，异途之仕。



    或木出火多，名木盛火炎，须比肩羊刃，尤宜水透，富贵恩荣。乏水者则否。



    或比肩重重，又须戊土，书曰：土止流水福寿全。若戊不见，名水泛木浮。一生辛苦，再行水运，落水而亡。



    或甲乙重重无比肩者，此依人度日，全无作为。若见庚辛，饥寒可免。'
  vernacular: '二月的壬水，寒气刚刚消除，有并合水流的气象，不用丙火来温暖，专一取戊土和辛金。二月的壬水，先取戊土、后取辛金，庚金次之。



    戊土和辛金都透出天干，雁塔题名（科举高中）。戊土透出而辛金藏在地支，也有皇恩诰命。如果戊土和辛金都不透出天干，有庚金出现在天干上的，主富。如果地支会成木局，有庚金透出天干的，金榜题名。庚金在地支中的，是异路的官员。



    如果木出现而火多，名为木盛火炎，必须有"比肩"和"羊刃"，尤其适宜水透出天干，富贵有皇恩荣宠。缺少水的就不是这样。



    如果"比肩"重重，又必须有戊土，书中说：土能止住流水，福寿双全。如果戊土不见，名为"水泛木浮"，一生辛苦，再行水运，落水而亡。



    如果甲木乙木重重而没有"比肩"的，这种人依靠别人过日子，完全没有作为。如果见到庚金辛金，饥寒可以免去。'
  kept_terms:
  - 比肩
  - 羊刃
  - 水泛木浮
  status: machine_translated
- span_id: ss_qtbj_ed01_p0048_s03
  original: '三月壬水，戊土司权，恐有推山填海之患，先用甲疏季土，次取庚金。甲庚俱透，科甲定然。甲透庚藏，修齐品格。甲藏有根，可云俊秀。有癸滋甲，必主干城。独甲藏支，必富。独庚在柱，常人。无甲、刚暴之徒。乏庚、愚顽之辈。



    或时干透丁者，此为化合，助火而不助水。见丁未一理。或支成四库，乏甲者，名杀重身轻，终身有损。



    凡水旺多见庚金者，乃无用之人，须丙制之方妙。



    时日月年



    甲壬甲壬



    辰辰辰申'
  vernacular: '三月的壬水，戊土当权主事，恐怕有推山填海的祸患，先用甲木来疏松季土，其次取庚金。甲木和庚金都透出天干，科举功名必定可得。甲木透出而庚金藏在地支，是修身齐家的人品格调。甲木藏在地支而有根，可以说是俊秀之才。有癸水来滋润甲木，必定主成为国家的干城（栋梁）。单独甲木藏在地支，必定富。单独庚金在命局中，是常人。没有甲木，是刚暴之徒。缺少庚金，是愚蠢顽劣之辈。



    如果时干透出丁水（丁火），这是化合，助火而不助水。见到丁未也是一个道理。如果地支会成四库（辰戌丑未），缺少甲木的，名为"杀重身轻"，终身有损伤。



    凡是水旺而又多见庚金的，就是无用之人，必须有丙火来制伏方才妙。



    命例：时柱甲辰、日柱壬辰、月柱甲辰、年柱壬申。'
  kept_terms:
  - 司权
  - 杀重身轻
  - 杀
  status: machine_translated
- span_id: ss_qtbj_ed01_p0049_s01
  original: '### 三夏壬水


    四月壬水，丙火司权，水弱极矣，专取壬水比肩为助，次取辛金发源，且暗合丙火，庚金为佐。壬辛两透，金榜有名，或癸辛两出，加以甲透，亦主异路之荣。无甲者、富贵门下之客。



    如无壬，木少火多者，又作弃命从才格，因妻致富。癸透者残疾。



    或四柱多金得地，则极弱复强，须用巳中戊土，亦主名利双全。或异途之贵。若见一甲藏寅，与巳相刑，主有暗疾，名利皆虚，不能创立。



    或多甲乙，有庚出干者、贵。无庚者，否。



    或支成水局、大贵。



    时日月年



    乙壬乙壬



    巳午巳寅


    时日月年



    乙壬乙壬



    巳申巳午


    时日月年



    壬壬癸丙



    寅辰巳辰'
  vernacular: '四月的壬水，丙火当权主事，水衰弱到了极点，专一取壬水"比肩"来帮助，其次取辛金来发动水源，而且辛金能暗中合住丙火，庚金为辅佐。壬水和辛金都透出天干，金榜上有名字，或者癸水和辛金两者出现，加上甲木透出天干，也主异路的荣华。没有甲木的，是富贵门下的食客。



    如果没有壬水，木少而火多的，又当作"弃命从才格"来看，因为妻子而致富。癸水透出天干的是残疾之人。



    如果四柱中金多得地，就极弱又变为强了，必须用巳宫中所藏的戊土，也主名利双全，或者是异路的贵气。如果见到一个甲木藏在寅中，与巳相刑，主有暗疾，名利都是虚幻的，不能创立事业。



    如果甲木乙木多，有庚金出现在天干上的，贵。没有庚金的，就不是。



    如果地支会成水局，大贵。



    命例：时柱乙巳、日柱壬午、月柱乙巳、年柱壬寅。


    命例：时柱乙巳、日柱壬申、月柱乙巳、年柱壬午。


    命例：时柱壬寅、日柱壬辰、月柱癸巳、年柱丙辰。'
