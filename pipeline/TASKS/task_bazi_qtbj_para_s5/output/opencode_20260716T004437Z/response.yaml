  original: 五月辛金，丁火司权，辛金失令，阴柔之极，不宜煅炼，须己壬兼用，何也？己为泥沙，壬为湖海，己无壬不湿，辛无己不生，故壬己并用。无壬、癸亦可用。但癸力小。或支成火局，即重见癸出亦不济，得壬透破火方可，必主生员。若无壬，癸见戊，虽有午宫己土，燥泥成灰，金必毁镕，反遭埋没，必为僧道。有一二重比肩，不致孤独。
  vernacular: 五月的辛金，丁火当权主事，辛金失令，阴柔到了极点，不适宜锻炼，必须己土和壬水同时使用，为什么呢？己土是泥沙，壬水是湖海，己土没有壬水就不会湿润，辛金没有己土就不能生长，所以壬水和己土并用。没有壬水，癸水也可以使用，但癸水的力量小。如果地支会成火局，即使重重见到癸水出现也不能救助，得到壬水透出来破除火势才可以，必定主生员。如果没有壬水，癸水见到戊土，虽然有午宫中的己土，干燥的泥变成了灰，金必定被毁坏熔化，反而遭到埋没，必定成为僧道。有一两重"比肩"，不至于孤独。
