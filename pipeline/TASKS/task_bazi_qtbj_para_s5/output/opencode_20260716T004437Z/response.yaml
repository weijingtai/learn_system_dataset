    如果是一派辛金，一位壬水，没有庚金来杂乱，又主从富中求得贵气。如果是一派壬水泄耗金，没有戊土出现来制伏，就是沙水同流，主奔波劳苦。如果得到地支见到一个戊土来止住水流，此人颇有才略，艺术超过常人。



    如果地支会成金局，天干见到"比肩"，没有壬水来淘洗，这种情况适宜用丁火，没有丁火必定主凶顽无赖。如果得到一个壬水高高透出天干，来泄耗群金，又叫做"一清到底"，一定有治理国家的才能。



