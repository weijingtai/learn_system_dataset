- span_id: ss_qtbj_ed01_p0040_s03
  original: '十二月庚金，寒气太重，且多湿泥，愈寒愈冻，先取丙火解冻，次取丁火炼金，甲亦不可少。



    丙丁甲透者，即不科甲，亦有思荣。有丙无丁甲者，富中取贵。有丁甲无丙者，特达才人。有丙丁无甲者，白手成家，刀笔亨通，乏金更美。或支成金局无火，僧道之流。



    时日月年



    癸庚己庚



    未戌丑辰



    女命


    时日月年



    甲庚丁己



    申子丑巳'
  vernacular: '十二月的庚金，寒气太重，而且多有湿泥，越冷越冻，先取丙火来解除冰冻，其次取丁火来锻炼金，甲木也不可缺少。



    丙火、丁火、甲木都透出天干的，即使不是科举正途，也有皇恩荣宠。有丙火而没有丁火和甲木的，从富中求得贵气。有丁火和甲木而没有丙火的，是特别通达的才子。有丙火和丁火而没有甲木的，白手起家，刀笔吏身份亨通，缺少金更为美好。如果地支会成金局而没有火，是僧道之流。



    命例：时柱癸未、日柱庚戌、月柱己丑、年柱庚辰。女命。


    命例：时柱甲申、日柱庚子、月柱丁丑、年柱己巳。'
  status: machine_translated
- span_id: ss_qtbj_ed01_p0042_s01
  original: '### 三春辛金


    正月辛金，阳气舒而寒气未除，不知正月建寅，中有长生之丙，解去寒气，忌甲木司权，辛金失令，取己土为生身之本，欲得辛金发现，全赖壬水之功，己壬两透，支见庚制甲，科甲定然。或己土透干，支中有甲，异路恩荣。或己土不全，号曰君臣失势，富贵难全。或有丙火出干，亦主武学。或见壬、无己庚者，贫贱之徒。



    或支成火局，即壬水出干，不剋己土，亦寻常之人。或庚壬两透，破局制火，必为显达之人。



    或支成水局，不见丙火，名为金弱沉寒，平常之士，书曰：金水性寒寒到底，凄凉难免少年忧。得丙照暖，反主富贵。



    故正月辛金，先己后壬。己为君，庚为佐。如用丙火须参看。用己，火妻土子。用壬，金妻水子。



    辛金珠玉，最怕红炉，辛逢卯日子时，名曰朝阳。



    时日月年



    己辛庚丙



    丑酉寅辰'
  vernacular: '正月的辛金，阳气舒展而寒气还没有消除，要知道正月建寅，寅中有长生的丙火，能够解去寒气，忌怕甲木当权主事，辛金失令，取己土作为生养自身的根本，想要辛金发挥出来，全靠壬水的功效，己土和壬水都透出天干，地支见到庚金来制甲木，科举功名必定可得。如果己土透出天干，地支中有甲木，是异路的恩荣。如果己土不齐全，号为君臣失势，富贵难以两全。如果有丙火出现在天干上，也主武学功名。如果见到壬水、没有己土和庚金的，是贫贱之徒。



    如果地支会成火局，即使壬水出现在天干上，不克己土，也是寻常之人。如果庚金和壬水都透出天干，破局制火，必定是显达之人。



    如果地支会成水局，不见丙火，名为"金弱沉寒"，是平常之士，书中说：金水性寒寒到底，凄凉难免少年忧愁。得到丙火照耀温暖，反而主富贵。



    所以正月的辛金，先取己土、后取壬水。己土为君，庚金为佐。如果用丙火必须参考来斟酌。用己土的，以火为妻、以土为子。用壬水的，以金为妻、以水为子。



    辛金是珠玉，最怕红炉（丙火），辛金遇到卯日、子时，名叫"朝阳"。



    命例：时柱己丑、日柱辛酉、月柱庚寅、年柱丙辰。'
  kept_terms:
  - 司权
  - 金弱沉寒
  - 朝阳
  status: machine_translated
- span_id: ss_qtbj_ed01_p0042_s02
  original: '二月辛金，阳和之际，壬水为尊，见戊己为病。得甲制伏，则辛金不致埋没，壬水不致混浊，合此者必身入玉堂。故二月辛金，有壬甲透者贵显。否则，乡绅。或壬坐亥支，不见土出，可能入芥，家亦小康。得申中之壬者，异途名望。无壬者常人。其生剋之理，与正月辛金皆同。



    或壬戊透，甲不出干，此为病不遇药，平常之人。得乙破戊，颇有衣衿。但假名假利，刻薄乖张。



    或一派壬水汪洋，名金水淘洗太过，不得中和，略有衣食，全无作为。如壬水重重，得戊反吉。或支成木局，洩尽壬水，有庚富贵，无庚平人。



    或支成火局，名官印相争，金水两伤，下流之格。得二壬出制，富贵反奇。



    辛金生于春季，一派壬水，而无丙火，即能显达，家无宿舂。得壬丙齐透，方许大富大贵。



    时日月年



    甲辛己乙



    午酉卯卯


    时日月年



    丙辛己乙



    申卯卯酉



    时日月年



    己辛丁己



    亥巳卯未


    时日月年



    己辛丁甲



    亥未卯午


    时日月年



    壬辛癸壬



    辰卯卯子'
  vernacular: '二月的辛金，阳气平和之际，以壬水为最尊贵，见到戊土己土就是弊病。得到甲木来制伏，那么辛金不至于埋没，壬水不至于混浊，符合这个格局的必定身入玉堂（翰林院）。所以二月的辛金，有壬水和甲木透出天干的贵显。否则，是乡绅。如果壬水坐在亥支，不见土出现，可能入学中秀才，家庭也是小康。得到申宫中所藏的壬水的，是异路功名的名望。没有壬水的是常人。其中生克的道理，与正月的辛金都相同。



    如果壬水和戊土透出天干，甲木不出现在天干上，这是有病没有药来治，是平常之人。得到乙木来破解戊土，很有秀才功名，但只是假名假利，为人刻薄乖张。



    如果是一派壬水汪洋，名为金水淘洗太过，不能得到中和，略有衣食，完全没有作为。如果壬水重重，得到戊土反而吉利。如果地支会成木局，泄尽壬水，有庚金就会富贵，没有庚金就是平常之人。



    如果地支会成火局，名为"官印相争"，金和水两者受伤，是下流的格局。得到两个壬水出现来制伏，富贵反而奇特。



    辛金生在春季，一派壬水，而没有丙火，即使能够显达，家里也没有隔夜的粮食。得到壬水和丙火一起透出天干，方才许为大富大贵。



    命例：时柱甲午、日柱辛酉、月柱己卯、年柱乙卯。


    命例：时柱丙申、日柱辛卯、月柱己卯、年柱乙酉。


    命例：时柱己亥、日柱辛巳、月柱丁卯、年柱己未。


    命例：时柱己亥、日柱辛未、月柱丁卯、年柱甲午。


    命例：时柱壬辰、日柱辛卯、月柱癸卯、年柱壬子。'
