- span_id: ss_qtbj_ed01_p0039_s01
  original: '### 三秋庚金


    七月庚金，刚锐极矣。专用丁火煅炼，次取甲木引丁，故曰：秋金锐锐最为奇，壬癸相逢总不宜，如逢木火来成局，试看福寿与天齐。



    如得丁甲两透，定步青云。若有丁无甲为俊秀。有甲无丁是平人。丁甲两无无用物，只堪门下作闲人。



    或支成水局，乏丁用丙，柱中即有丙火，不见甲木者，必主愚懦。何也？当时金水两旺，金生水以制火，何能发达。或见甲出引丁，可云生监。甲弱者、衣食充盈。



    或支成土局，先甲后丁。支成火局，富贵中人。金刚木明，行商坐贾之人。金备申酉戌之地，富贵无疑。金神入火乡，逢羊刃，富贵荣华。'
  vernacular: '七月的庚金，刚锐到了极点。专用丁火来锻炼，其次取甲木来引出丁火，所以说：秋天的金锐利最是奇妙，壬水癸水相逢总是不适宜，如果遇到木和火来成局，试看福气寿命与天齐高。



    如果得到丁火和甲木都透出天干，一定走上青云之路。如果有丁火而没有甲木是俊秀之人。有甲木而没有丁火是平常之人。丁火和甲木两者都没有就是无用之物，只配在门下做闲散之人。



    如果地支会成水局，缺少丁火而用丙火，命局中即使有丙火，不见甲木的，必定主愚蠢懦弱。为什么呢？当时金和水两旺，金生水来制火，怎么能发达呢。如果见到甲木出现来引出丁火，可以说是生员监生。甲木弱的，衣食充足丰盈。



    如果地支会成土局，先取甲木、后取丁火。地支会成火局，是富贵中人。金刚而木明，是行商坐贾之人。金齐全了申酉戌之地，富贵无疑。金神进入火乡，遇到"羊刃"，富贵荣华。'
  kept_terms:
  - 羊刃
  status: machine_translated
- span_id: ss_qtbj_ed01_p0039_s02
  original: '八月庚金，刚锐未退，用丁用甲，丙不可少。若丁甲透，又见一丙，功名显赫，且见羊刃，无刑剋，丙杀藏支，名为羊刃驾杀，主出将入相，直介忠臣。



    或丙火重重，一丁高透，亦主科甲。丙出丁藏，异路功名。



    或甲藏支，火透而水不透者，亦主清高，衣衿可望。



    或丁藏支内，重见丙火者，此名假杀重重，虽羊刃帖身，却难从杀也。即一丙透，秀而不富。或支见重重甲乙，无用之人。



    总之，旺金木衰，非火莫制，不见丙丁，艺术之辈。



    时日月年



    丙庚丁丙



    子子酉子


    时日月年



    丁庚乙乙



    亥午酉巳


    时日月年



    戊庚癸己



    寅申酉亥'
  vernacular: '八月的庚金，刚锐还没有消退，用丁火、用甲木，丙火不可缺少。如果丁火和甲木透出天干，又见到一个丙火，功名显赫，而且见到"羊刃"，没有刑克，丙火七杀藏在地支，名为"羊刃驾杀"，主出可为将、入可为相，是耿直正派的忠臣。



    如果丙火重重出现，一个丁火高高透出天干，也主科举功名。丙火出现而丁火藏在地支，是异路功名。



    如果甲木藏在地支，火透出而水不透出的，也主清高，秀才功名可望。



    如果丁火藏在地支之内，重重见到丙火的，这叫做"假杀重重"，虽然"羊刃"贴身，却难从杀格。即使有一个丙火透出，只秀而不富。如果地支见到重重甲木乙木，是无用之人。



    总而言之，金旺而木衰，没有火就不能制伏，不见丙火丁火，是艺术手艺之辈。



    命例：时柱丙子、日柱庚子、月柱丁酉、年柱丙子。


    命例：时柱丁亥、日柱庚午、月柱乙酉、年柱乙巳。


    命例：时柱戊寅、日柱庚申、月柱癸酉、年柱己亥。'
