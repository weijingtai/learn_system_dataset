  original: '九月庚金，戊土司令，最怕土厚埋金，宜先用甲疏，后用壬洗，则金自出矣。忌见己土浊壬。



    壬甲两透，科甲相宜。或甲透壬藏，乡魁可望。甲藏壬透，廪贡堪谋。有甲无壬，犹有学问。有壬无甲，莫问衣衿。壬甲两无，则为下格。



    或支成水局，丙透救之，此人才高迈众，名重乡闾，不见癸水，一榜可许。



    或四柱戊多金旺，全无甲壬者，即有衣禄，亦不能久。或庚戊多而无壬甲者，愚顽之辈。



    时日月年



    甲庚戊辛



    申申戌酉


    时日月年



    辛庚丙庚



    巳戌戌寅


    时日月年



    辛庚戊辛



    巳申戌酉'
  vernacular: '九月的庚金，戊土当令主事，最怕土厚埋没金，适宜先用甲木来疏松，后用壬水来淘洗，那么金自然就显露出来了。忌怕见到己土来混浊壬水。



    壬水和甲木都透出天干，科举功名相适宜。如果甲木透出而壬水藏在地支，乡试魁首可望。甲木藏在地支而壬水透出天干，廪生贡生可以谋求。有甲木而没有壬水，还有学问。有壬水而没有甲木，不要问秀才功名。壬水和甲木两者都没有，就是下等格局。



    如果地支会成水局，丙火透出来救助它，此人才高超越众人，名声在乡里被人敬重，不见癸水，考中一榜可以许给。



    如果四柱戊土多、金旺，完全没有甲木和壬水的，即使有衣禄，也不能长久。如果庚金和戊土多而没有壬水和甲木的，是愚蠢顽劣之辈。



    命例：时柱甲申、日柱庚申、月柱戊戌、年柱辛酉。


    命例：时柱辛巳、日柱庚戌、月柱丙戌、年柱庚寅。


    命例：时柱辛巳、日柱庚申、月柱戊戌、年柱辛酉。'
