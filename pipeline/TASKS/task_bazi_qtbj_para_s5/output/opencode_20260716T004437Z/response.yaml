  vernacular: '四月的辛金，时令正值夏季初始，忌怕丙火的燥烈，喜欢壬水来淘洗。地支会成金局，水透出天干，有木来制戊土，名为"一清澈底"，有科举功名。癸水透出而壬水藏在地支，富是真的、贵是假的。如果壬水和癸水都藏在地支，戊土己土也藏在地支，稍有富裕。如果壬水和癸水都没有，反而见到火出现，必定主鳏寡孤独。



    如果地支会成火局，有制伏的就吉利，没有制伏的就凶。凡是火旺而没有水，取土来泄耗火的炎气。



    如果壬水藏在亥中，戊土不出现于天干，也主向上发达。有戊土就是常人。有一个甲木透出天干，衣禄可以追求。如果有甲木而没有壬水和癸水的，富贵虚浮，这就是所谓羊的实质披着虎皮。壬水、癸水、甲木三者都没有，又不符合格局，这就是下等品级。



    命例：时柱乙未、日柱辛亥、月柱辛巳、年柱乙未。'
