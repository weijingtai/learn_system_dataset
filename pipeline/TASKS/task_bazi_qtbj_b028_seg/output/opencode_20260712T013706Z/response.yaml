- seg_id: s02
  entry_title: 八月
  path: 十干分论 / 论庚金 / 三秋庚金 / 八月
  text: '八月庚金，刚锐未退，用丁用甲，丙不可少。若丁甲透，又见一丙，功名显赫，且见羊刃，无刑剋，丙杀藏支，名为羊刃驾杀，主出将入相，直介忠臣。


    或丙火重重，一丁高透，亦主科甲。丙出丁藏，异路功名。


    或甲藏支，火透而水不透者，亦主清高，衣衿可望。


    或丁藏支内，重见丙火者，此名假杀重重，虽羊刃帖身，却难从杀也。即一丙透，秀而不富。或支见重重甲乙，无用之人。


    总之，旺金木衰，非火莫制，不见丙丁，艺术之辈。


    时日月年


    丙庚丁丙


    子子酉子

    时日月年


    丁庚乙乙


    亥午酉巳

    时日月年


    戊庚癸己


    寅申酉亥'
  note: 八月庚金，刚锐未退，用丁用甲，丙不可少。若丁甲透，又见一丙，功名显赫，且见羊刃，无刑剋，丙杀藏支，名为羊刃驾杀，主出将入
