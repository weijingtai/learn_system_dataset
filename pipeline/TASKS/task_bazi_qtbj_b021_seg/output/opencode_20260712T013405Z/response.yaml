- seg_id: s01
  entry_title: 十月戊土
  path: 十干分论 / 论戊土 / 三冬戊土 / 十月
  text: '### 三冬戊土

    十月戊土，时值小阳，阳气略出，先用甲木，次取丙火。非甲、土不灵。非丙、土不暖，安能生发万物。甲丙两出，富贵中人。或甲得长生，遇支藏得地之水，一丙高透，亦主身贵扬名。


    支见庚金，入泮而已。若不见庚金，甲木藏支，丙火高透，科甲有之。若有庚，丁出制，必异路功名。或为典吏。即庚丁不透，甲丙藏支，亦云富贵。


    壬透得戊救丙，主富贵取贵。丙甲俱无，必为僧道。


    时日月年


    戊戊癸癸


    午辰亥卯

    时日月年


    庚戊辛壬


    甲寅亥申

    时日月年


    丙戊丁乙


    辰戌亥卯

    '
  note: 论十月戊土阳气略出先甲次丙，甲丙两出富贵中人，含庚金制甲、壬透戊救丙变例，附三则命造
  case_candidate: true
- seg_id: s02
  entry_title: 十一十二月戊土
  path: 十干分论 / 论戊土 / 三冬戊土 / 十一月十二月
  text: '十一十二月严寒冰冻，丙火为专，甲木为佐。丙甲两透，桃浪之人，丙出甲藏，采芹食饩。丙藏甲出，佐杂前程。有丙无甲者，豪富。有甲无丙者，清贫。丙甲全无，下流之造。


    或一派丙火，加以丙透，运值火土，弱中复强，又一壬透，主清高荣禄。乏壬、僧道孤寒。


    或一派壬水，不见比劫，可作从才而论。即有比劫，得甲出干，又主富贵，若寒土无丙，虽有甲木，亦是内虚外实之人。


    或二癸透月时，名为争合，终属劳碌之人。得一己出干制癸，反为忠义之士，舍己从人而论。


    年月透辛金者，又属土金伤官，异路功名可许。以金为妻、水为子。


    时日月年


    壬戊壬壬


    子子子子

    时日月年


    癸戊乙癸


    丑申丑卯

    时日月年


    戊戊甲戊


    午辰子寅

    '
  note: 论十一十二月戊土严寒丙专甲佐，丙甲两透桃浪之人，含从才、争合、土金伤官变例，附三则命造
  case_candidate: true
