- seg_id: s05
  entry_title: 九月
  path: 十干分论 / 论壬水 / 三秋壬水 / 九月
  text: '九月壬水进气，其性特厚，若一派壬水，见一甲、制戌中之戊，戊又出干，斯用丙火。此格清贵极矣，正合一将当关，群邪自伏，或不见丙戊，亦不为妙。


    或一派戊土，无一己庚杂乱，得一甲透时干。玉堂清贵，即甲透月上，亦主科甲。若支藏己土，一榜可图。或庚透乏丁，贫贱之人。或丁透见甲，略贵。或水多乏丙者，又用戊土，常人。'
  note: 论九月
  case_candidate: false
