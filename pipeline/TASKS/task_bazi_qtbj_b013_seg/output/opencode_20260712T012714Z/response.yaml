- seg_id: s01
  entry_title: 十月丙火
  path: 十干分论 / 论丙火 / 三冬丙火 / 十月
  text: '### 三冬丙火

    十月丙火，太阳失令，得见甲戊庚出干，可云科甲，主为人性好清高，斯文领袖。如辛透见辰，名化合逢时，主大贵。


    或壬多无甲，乃作弃命从杀，即不科甲，亦是宦僚。或壬多有甲无戊，却非从杀，宜用己土混壬。


    总之十月丙火，木旺宜庚，水旺宜戊，火旺用壬，随宜酌用可也。


    时日月年


    庚丙乙甲


    寅戌亥申

    时日月年


    戊丙辛壬


    子戌亥辰

    时日月年


    壬丙己辛


    辰子亥巳

    '
  note: 论十月丙火太阳失令取甲戊庚，含化合逢时、弃命从杀变例，附三则命造
  case_candidate: true
- seg_id: s02
  entry_title: 十一月丙火
  path: 十干分论 / 论丙火 / 三冬丙火 / 十一月
  text: '十一月丙火，冬至一阳生，弱中复强，壬水为最，戊土佐之。


    壬戊两透，科甲可许，无戊见己，异路功名。或无壬水，有癸出干得金滋无伤，又有丙透以解冻，可许衣衿。


    或一派壬，则耑用戊土，此人虽不成名，文章迈众，但名利虚浮。何也？因戊晦光，又须甲木为药也。或无壬水，癸亦可用，但不甚显。


    或四柱多壬无甲，乃作弃命从杀，亦有云路。


    或水多、有甲、无戊，却非从杀，宜用己土浊壬，十一月丙火，与十月颇同。


    时日月年


    庚丙庚辛


    寅寅子亥

    时日月年


    癸丙庚辛


    巳子子丑

    时日月年


    戊丙庚辛


    子戌子酉

    '
  note: 论十一月丙火冬至一阳生壬为最戊佐之，壬戊两透科甲，含弃命从杀变例，附三则命造
  case_candidate: true
- seg_id: s03
  entry_title: 十二月丙火
  path: 十干分论 / 论丙火 / 三冬丙火 / 十二月
  text: '十二月丙火，气进二阳，侮雪欺霜，喜壬为用。己土司令，土多又不可少甲。壬甲两透，科甲堪宜，甲藏则秀才而已。或无甲得一壬透，富中取贵。


    如见一派己土，不见甲乙，名为假伤官，聪明性傲，名利虚浮。


    或一派癸水，得己出干，必自主创业。若制伏太过，又取辛金作用。得见癸透。此人即不成名，必清雅文墨士。


    时日月年


    癸丙己乙


    巳申丑巳

    时日月年


    庚丙己乙


    寅午丑丑


    时日月年


    壬丙乙癸


    辰午丑卯

    时日月年


    庚丙丁己


    寅寅丑丑

    时日月年


    乙丙己乙


    丑寅丑酉

    '
  note: 论十二月丙火气进二阳喜壬为用，壬甲两透科甲，含假伤官变例，附五则命造
  case_candidate: true
