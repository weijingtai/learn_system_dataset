  original: '### 三冬己土


    三冬己土，溼泥寒冻，非丙暖不生，取丙为尊，甲木参酌。戊土癸水不用。惟初冬壬旺，取戊制之。余皆用丙丁，但丁不能解冻除寒，不能大济。



    或干透一丙，支藏一丙，加以甲透，科甲有准。即藏丙无制，亦主衣衿。



    或多壬水，得戊透制之，此命安然，富中取贵。不见戊土，富屋贫人。



    凡三冬己土，见壬水出干，为水浸湖田，此人孤苦。若见火不孤，见土不贫。



    或一派癸，不见比劫，此为从才，反主富贵，虽不科甲，恩诰有之。若见比争，平常人物，妻子主事。从才者，木妻、火子。



    或一派戊己，取甲制之，甲透者，富贵。



    或一派辛庚，须用丙火，还须丁火为助。丙藏、富贵奇特之命。



    时日月年



    甲己癸壬



    戌丑丑申


    时日月年



    己己癸壬



    巳卯丑子'
  vernacular: '冬天的己土，湿泥寒冷冰冻，没有丙火来温暖就不能生长，取丙火为最尊贵，甲木参考斟酌使用。戊土和癸水不用。只有初冬壬水旺盛，取戊土来制伏它。其余都用丙火和丁火，但丁火不能解除冰冻、祛除严寒，不能起大作用。



    如果天干透出一个丙火，地支藏着一个丙火，加上甲木透出天干，科举功名有准。即使藏着丙火而没有受制，也主有秀才功名。



    如果壬水多，得到戊土透出来制伏它，这个命格安然，从富中求得贵气。不见戊土，是富屋中的穷人。



    凡是冬天的己土，见到壬水出现在天干上，是水浸湖田，此人孤苦。如果见到火就不孤，见到土就不贫。



    如果是一派癸水，不见"比劫"，这叫做"从才"，反而主富贵，虽然不是科举正途，恩赐的诰命也会有。如果见到比肩来争，是平常人物，妻子主事。从才格的，以木为妻、以火为子。



