  original: '### 三夏庚金


    四月庚金，长生于巳，巳内有戊。丙不镕金，故不畏火炎，丙亦可作用，但先壬水，方得中和，故曰群金生夏，喜用勾陈。次取戊土，丙火佐之。三者皆全，登科及第，即透一二，亦非白丁。



    或一派丙火，名曰假杀为权，须不见壬制者，此人假作清高，并无仁义，刑妻剋子。有壬制者，又主荣华。壬藏支者，有富贵之名，而无其实。



    或支成金局，变弱为强，用丙无力，用丁方妙，故丁透者吉。无丁、无用之人。或丁出三四，煅制太过，其人奔波。



    四月庚金，须用壬丙戊，但非拘执先后，宜分病用药。妻子仝前。



    剑戟成功，入火乡而反害。金逢火已损，再见火必伤。庚辛火旺怕南方，逢辰巳之乡，又为荣断。'
  vernacular: '四月的庚金，长生于巳宫，巳宫之内有戊土。丙火不能熔化金，所以不畏惧火势炎炎，丙火也可以作用神，但先要用壬水，才能达到中和，所以说众多的金生在夏天，喜欢用勾陈（戊土）。其次取戊土，丙火辅佐它。三者都齐全，可以登科及第，即使透出其中一二个，也不是普通平民。



    如果是一派丙火，名为"假杀为权"，必须不见壬水来制伏的，此人假装清高，并没有仁义，刑妻克子。有壬水来制伏的，又主荣华。壬水藏在地支的，有富贵的名声，却没有其实质。



    如果地支会成金局，变弱为强，用丙火就没有力量了，用丁火才妙，所以丁火透出天干的吉利。没有丁火，是无用之人。如果丁火出现三四个，锻炼克制太过，此人奔波劳碌。



    四月的庚金，必须使用壬水、丙火、戊土，但不必拘泥于先后顺序，适宜分辨弊病来用药。妻子、子女的推断与前面相同。



    剑戟虽然已经成功，进入火乡反而受害。金遇到火已经受损，再见到火必定受伤。庚金辛金火旺害怕南方（火地），遇到辰巳的地方，又当作荣耀来论断。'
