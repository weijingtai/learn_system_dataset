  original: '### 三秋己土


    三秋己土，万物收藏之际，外虚内实，寒气渐升，须丙火温之，癸水润之，不特此也，且癸能洩金，丙能制金，补土精神，则秋生之物咸茂矣。癸先丙后。



    丙癸两透，雁塔题名。或无癸，有两丙透者，异途显达。或武职权高。或有丙火，不见壬癸，为假道斯文，终无诚实。或有壬癸无丙者，衣食充足，才能而已。



    或支成金局，癸透有根，此人家畜万缗，富中取贵。



    或支四库，甲透者富。乏甲者孤贫。或甲出无癸乏金，积德可全科甲。或会火局，无水救，乃大奸大恶之徒。



    或丙透癸藏，遇金颇有选援，加一壬辅，富贵慷慨，有贤声。见戊透者，主遭凶厄且贫。



    八月支成金局，无丙丁出救，此人零丁孤苦。如得丙透丁藏，生己元神，此人名魁天下，五福完人。



    总之，三秋己土，先癸后丙，取辛辅癸。九月土盛，宜甲木疏之，余皆酌用。



    时日月年



    壬己癸甲



    申未酉寅


    时日月年



    壬己甲己



    申丑戌巳



    勾陈全备润下，劳碌奔波之客。土凝水竭，离乡背井之流。



    勾陈得位会才官，无剋无破必然端，甲子北方寅卯木，管教环拱戴金冠。戊己喜亥卯未为官，申子辰为才，忌刑剋杀害。'
  vernacular: '秋天的己土，是万物收藏的季节，外表空虚而内里充实，寒气渐渐上升，必须用丙火来温暖它，用癸水来滋润它，不只是这样，而且癸水能够泄耗金，丙火能够制住金，补益土的精神，那么秋天生长的事物就都茂盛了。先取癸水、后取丙火。



    丙火和癸水都透出天干，雁塔题名（科举高中）。如果没有癸水，有两个丙火透出天干的，异路途径显达，或者武职权位高。如果有丙火，不见壬水癸水，是假道学斯文之辈，终究没有诚实。如果有壬水癸水而没有丙火的，衣食充足，只是有才能罢了。



    如果地支会成金局，癸水透出而有根，此人家中蓄有万贯财富，从富中求得贵气。



    如果地支为四库（辰戌丑未），甲木透出天干的富。缺少甲木的孤贫。如果甲木出现而没有癸水也缺少金，积累阴德可以保全科举功名。如果会成火局，没有水来救助，是大奸大恶之徒。



    如果丙火透出而癸水藏在地支，遇到金就颇有选拔升迁的机会，加上一个壬水来辅助，富贵慷慨，有贤良的名声。见到戊土透出的，主遭遇凶险厄难而且贫困。



    八月地支会成金局，没有丙火丁火出现来救助，此人零丁孤苦。如果得到丙火透出而丁火藏在地支，生养己土的元神，此人是名冠天下的魁首，五福齐全的完人。



    总而言之，秋天的己土，先取癸水、后取丙火，取辛金来辅助癸水。九月土旺盛，适宜用甲木来疏松，其余都酌情使用。



    命例：时柱壬申、日柱己未、月柱癸酉、年柱甲寅。


    命例：时柱壬申、日柱己丑、月柱甲戌、年柱己巳。



    勾陈（戊己土）全备而润下（水），是劳碌奔波之人。土凝固而水枯竭，是离乡背井之流。



    勾陈得位遇到"才"和"官"，没有克制和冲破必定端正，甲子北方寅卯木，管教环拱而头戴金冠。戊己土喜欢亥卯未为"官"星，申子辰为"才"星，忌怕刑克冲害。'
