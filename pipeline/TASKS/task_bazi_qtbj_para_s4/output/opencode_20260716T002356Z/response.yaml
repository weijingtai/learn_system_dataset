  original: '金以至阴为体，中含至阳之精，乃能坚刚，独异众物，若独阴而不坚，冰雪是也，遇火则消矣。故金无火炼，不能成器，金重火轻，执事繁难。金轻火重，煅炼消亡。金极火盛，为格最精。金火全、名曰铸印。犯丑字、即为损模。金火多名为乘轩，遇死衰、反为不利。



    木火炼金，成名锐而退速。纯金遇水，逢富显以赢余。



    金能生水，水旺则金沉；土能生金，金多则土贱。金无水干枯；水重、则沉沦无用。金无土则死绝；土重、则埋没不显。两金两火、最上。两金两木、才足。一金生三水，力弱难胜；一金得三木，顽钝自损。金成则火灭，故金未成器，欲得见火；金已成器，不欲见火。金到申酉巳丑，亦可谓之成也，运喜西北，不利东南。



    生于春月，余寒未尽，贵乎火气为荣；性柔体弱，欲得厚土为助；水盛增寒，难施锋锐之势；木旺损力，有挫钝之危，金来比助，扶持最妙。比而无火，失类非良。



    夏月之金，尤为柔弱，形质未备，尤嫌死绝。火多而却为不厌；水盛而滋润呈祥；见木而助鬼伤身；遇金而扶持精壮；土薄而最为有用；土厚而埋没无光。



    秋月之金，当权得令，火来煅炼，遂成钟鼎之材。土多培养，反惹顽浊之气。见水则精神越秀；逢木则琢削施威；金助愈刚，刚过则决。气重愈旺，旺极则衰。



    冬月之金，形寒性冷；木多则难施琢削之功；水盛未免沉潜之患。土能制水，金体不寒，火来助土，子母成功，喜比肩聚气相扶，欲官印温养为利。'
  vernacular: '金以极阴为体，内中含有极阳的精华，才能坚硬刚强，独特地与众物不同，如果是单纯的阴而不坚硬，就像冰雪一样，遇到火就消融了。所以金没有火来锻炼，就不能成为器物，金重而火轻，做事情繁难。金轻而火重，锻炼过度就会消亡。金极旺而火极盛，形成的格局最为精纯。金和火齐全，名叫"铸印"。犯了丑字，就是损坏了模具。金多火多名为"乘轩"，遇到"死绝"之地，反而不利。



    木和火来锻炼金，成名锐利但退步也快。纯粹的金遇到水，遇到富显而会有盈余。



    金能够生水，水旺则金沉；土能够生金，金多则土不值钱。金没有水就干枯；水太重，就会沉沦无用。金没有土就会"死绝"；土太重，就会埋没而不显。两金两火，最为上等。两金两木，"才"力充足。一个金生三个水，力量弱小难以胜任；一个金得到三个木，顽钝而自己受损。金炼成了火就熄灭，所以金还没有成器的时候，希望见到火；金已经成器之后，不希望见到火。金到了申、酉、巳、丑，也可以说是成器了，大运喜欢走西北方，不利东南方。



    出生在春天的月份，残余的寒气还没有消除，以火气为贵来获得荣华；性质柔弱身体羸弱，希望得到厚土来帮助；水旺盛就会增加寒气，难以施展锋锐的气势；木旺盛就会减损力量，有挫钝的危险，金来比助扶持，最为妙。有比肩而没有火，失去同类就不是良局。



    夏天的金，尤其柔弱，形质还没有完备，尤其嫌忌"死绝"。火多却不会厌烦；水盛来滋润就呈现吉祥；见到木就是助长鬼来伤害身体；遇到金就扶持而精神饱满；土薄最有用；土厚就会埋没而没有光芒。



    秋天的金，当权得令，火来锻炼，就成就了钟鼎之材。土多来培养，反而惹来顽浊的气。见到水就精神越发秀美；遇到木就砍削而施加威力；金来帮助就更加刚强，刚强过头就会决裂。气势重就更加旺盛，旺盛到了极点就会衰退。



    冬天的金，形体寒冷、性质冰凉；木多就难以施展砍削的功夫；水盛就未免有沉没的隐患。土能够制水，金的形体就不寒冷了，火来帮助土，子母（火生土）取得成功，喜欢"比肩"聚气来相互扶持，希望"官"和"印"来温和养育为利。'
