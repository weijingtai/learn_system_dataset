- span_id: ss_qtbj_ed01_p0029_s01
  original: '### 三秋戊土


    七月戊土，阳气渐入，寒气渐出，先丙后癸，甲木次之。丙癸甲透者，富贵极品。癸藏丙透，不仅秀才。丙甲两透，癸水会局藏辰，亦不失富贵。无丙得癸甲透，此人清雅，家富千金。无癸甲者、常人。有丙火、妻贤子肖。若丙甲癸三者俱无，下流之命。



    或支成水局，休作弃命从才，宜取甲洩之。甲透者、稍有富贵。用神妻子仝前。



    时日月年



    壬戊戊壬



    午辰申寅


    时日月年



    癸戊甲庚



    丑寅申寅


    时日月年



    丙戊丙辛



    辰子申酉'
  vernacular: '七月的戊土，阳气渐渐进入，寒气渐渐退出，先取丙火、后取癸水，甲木次之。丙火、癸水、甲木都透出天干的，富贵到极品。癸水藏在地支而丙火透出天干，不仅是秀才。丙火和甲木都透出天干，癸水会成水局藏于辰中，也不失为富贵。没有丙火而得到癸水和甲木透出天干，此人清雅，家财富有千金。没有癸水和甲木的，是常人。有丙火，妻子贤惠、儿子肖似父亲。如果丙火、甲木、癸水三者都没有，是下流之命。



    如果地支会成水局，不要当作"弃命从才"，适宜取甲木来泄耗水。甲木透出天干的，稍有富贵。"用神"和妻子、子女的推断和前面相同。



    命例：时柱壬午、日柱戊辰、月柱戊申、年柱壬寅。


    命例：时柱癸丑、日柱戊寅、月柱甲申、年柱庚寅。


    命例：时柱丙辰、日柱戊子、月柱丙申、年柱辛酉。'
  kept_terms:
  - 弃命从才
  - 用神
  - 才
  status: machine_translated
- span_id: ss_qtbj_ed01_p0029_s02
  original: '八月戊土，金洩身寒，赖丙照暖，喜水滋润，先丙后癸，不必木疏。丙癸两透，科甲中人。丙透癸藏，可许入泮。癸透丙藏，纳资得官。若丙藏又无癸，即多不透，此皆常人。丙癸全无，奔流之客。



    或四柱皆辛，无丙丁，此名伤官格，为人清秀，即不能拾芥，亦可武庠。一见癸水，富而且贵。



    或支成水局，壬癸出干，此名才多身弱，愚懦无能。若天干有比劫，分散才神，颇言衣食。



    用神妻子仝前，秋土生金极弱，须丙火丁火出干方妙。'
  vernacular: '八月的戊土，金泄耗而使土身寒冷，依赖丙火来照耀温暖，喜欢水来滋润，先取丙火、后取癸水，不必用甲木来疏松。丙火和癸水都透出天干，是科举中人。丙火透出而癸水藏在地支，可以许为入学中秀才。癸水透出而丙火藏在地支，可以通过捐纳资财获得官职。如果丙火藏在地支又没有癸水，即使多有也不透出，这都属常人。丙火和癸水全都没有，是奔波流离之人。



    如果四柱都是辛金，没有丙火丁火，这叫做"伤官格"，为人清秀，即使不能轻易取得功名，也可以入武学。一见到癸水，就富而且贵。



    如果地支会成水局，壬水癸水出现在天干上，这叫做"才多身弱"，愚蠢懦弱无能。如果天干上有"比劫"，分散了财神的力量，就颇有衣食。



    "用神"和妻子、子女的推断和前面相同，秋天的土生金极为衰弱，必须有丙火丁火出现在天干上才好。'
  kept_terms:
  - 伤官格
  - 伤官
  - 才多身弱
  - 才
  - 比劫
  - 用神
  status: machine_translated
- span_id: ss_qtbj_ed01_p0029_s03
  original: '九月戊土当权，不可专用丙，先看甲木，次取癸水，却忌化合。见金先用癸水，后取丙火，配合支干，方成有生之土，定发云程。



    或无丙有癸，不见甲透者，衣衿小富。无癸丙、有甲者。衣食而已。若癸甲全无，虽有丙火，亦属平常，或为僧道。或支成水局，壬癸透干，用戊止流，有比透反主富。



    支成火局，名土燥，不发。



    得金水两透，此人清高，略可富贵。无水、一生困苦。妻子同前。



    时日月年



    丙戊甲己



    辰辰戌酉


    时日月年



    癸戊庚丁



    亥戌戌亥


    时日月年



    壬戊戊丙



    子寅戌戌


    时日月年



    乙戊庚丁



    卯寅戌酉


    时日月年



    己戊戊丙



    未辰戌子'
  vernacular: '九月的戊土当权主事，不可以专用丙火，先看甲木，其次取癸水，却忌怕化合。见到金就先用癸水，后取丙火，配合地支和天干，才能成为有生机的土，一定能够飞黄腾达。



    如果没有丙火而有癸水，不见甲木透出天干的，是秀才、小富。没有癸水和丙火、有甲木的，只是衣食罢了。如果癸水和甲木全都没有，虽然有丙火，也属于平常，或者成为僧道。如果地支会成水局，壬水癸水透出天干，用戊土来止住水流，有比肩透出天干反而主富。



    地支会成火局，名为土燥，不能发达。



    得到金和水两者都透出天干，此人清高，略微可以有富贵。没有水，一生困苦。妻子和子女的推断与前面相同。



    命例：时柱丙辰、日柱戊辰、月柱甲戌、年柱己酉。


    命例：时柱癸亥、日柱戊戌、月柱庚戌、年柱丁亥。


    命例：时柱壬子、日柱戊寅、月柱戊戌、年柱丙戌。


    命例：时柱乙卯、日柱戊寅、月柱庚戌、年柱丁酉。


    命例：时柱己未、日柱戊辰、月柱戊戌、年柱丙子。'
  kept_terms:
  - 当权
  - 比肩
  status: machine_translated
- span_id: ss_qtbj_ed01_p0030_s01
  original: '### 三冬戊土


    十月戊土，时值小阳，阳气略出，先用甲木，次取丙火。非甲、土不灵。非丙、土不暖，安能生发万物。甲丙两出，富贵中人。或甲得长生，遇支藏得地之水，一丙高透，亦主身贵扬名。



    支见庚金，入泮而已。若不见庚金，甲木藏支，丙火高透，科甲有之。若有庚，丁出制，必异路功名。或为典吏。即庚丁不透，甲丙藏支，亦云富贵。



    壬透得戊救丙，主富贵取贵。丙甲俱无，必为僧道。



    时日月年



    戊戊癸癸



    午辰亥卯


    时日月年



    庚戊辛壬



    甲寅亥申


    时日月年



    丙戊丁乙



    辰戌亥卯'
  vernacular: '十月的戊土，时令正值小阳春，阳气略微出现，先用甲木，其次取丙火。没有甲木，土就没有灵气。没有丙火，土就不温暖，怎么能生发万物呢。甲木和丙火两者都出现，是富贵中人。或者甲木得到长生，遇到地支所藏得地之水，有一个丙火高高透出天干，也主自身显贵、扬名于世。



    地支见到庚金，只是入学中秀才罢了。如果不见庚金，甲木藏在地支，丙火高高透出天干，科举功名可以有。如果有庚金，丁火出现来制住它，必定是异路功名，或者成为典吏。即使庚金和丁火不透出天干，甲木和丙火藏在地支，也可以说富贵。



    壬水透出天干而得到戊土来救助丙火，主从富贵中取得贵气。丙火和甲木都没有，必定成为僧道。



    命例：时柱戊午、日柱戊辰、月柱癸亥、年柱癸卯。


    命例：时柱庚申、日柱戊寅、月柱辛亥、年柱壬申。


    命例：时柱丙辰、日柱戊戌、月柱丁亥、年柱乙卯。'
  status: machine_translated
- span_id: ss_qtbj_ed01_p0030_s02
  original: '十一十二月严寒冰冻，丙火为专，甲木为佐。丙甲两透，桃浪之人，丙出甲藏，采芹食饩。丙藏甲出，佐杂前程。有丙无甲者，豪富。有甲无丙者，清贫。丙甲全无，下流之造。



    或一派丙火，加以丙透，运值火土，弱中复强，又一壬透，主清高荣禄。乏壬、僧道孤寒。



    或一派壬水，不见比劫，可作从才而论。即有比劫，得甲出干，又主富贵，若寒土无丙，虽有甲木，亦是内虚外实之人。



    或二癸透月时，名为争合，终属劳碌之人。得一己出干制癸，反为忠义之士，舍己从人而论。



    年月透辛金者，又属土金伤官，异路功名可许。以金为妻、水为子。



    时日月年



    壬戊壬壬



    子子子子


    时日月年



    癸戊乙癸



    丑申丑卯


    时日月年



    戊戊甲戊



    午辰子寅'
  vernacular: '十一月和十二月严寒冰冻，以丙火为专，甲木为辅佐。丙火和甲木都透出天干，是桃浪之人（科举高中的人），丙火出现而甲木藏在地支，是入学中秀才、享受官粮的人。丙火藏在地支而甲木出现，是佐杂小吏的前程。有丙火而没有甲木的，是豪富。有甲木而没有丙火的，是清贫。丙火和甲木全都没有，是下流之命。



    如果是一派丙火，加上丙火透出天干，大运走到火土之地，从衰弱中重新转强，又有一个壬水透出天干，主清高而享受荣禄。缺少壬水，是僧道孤寒之人。



    如果是一派壬水，不见"比劫"，可以当作"从才"来论。即使有"比劫"，得到甲木出现在天干上，又主富贵，如果寒冷的土没有丙火，虽然有甲木，也是内里空虚、外表充实的人。



    如果有两个癸水透在月柱和时柱，名为"争合"，终究属于劳碌之人。得到一个己土出现在天干上来制癸水，反而成为忠义之士，是舍己从人的格局。



    年月透出辛金的，又属于"土金伤官"，异路功名可以许给。以金为妻、以水为子。



    命例：时柱壬子、日柱戊子、月柱壬子、年柱壬子。


    命例：时柱癸丑、日柱戊申、月柱乙丑、年柱癸卯。


    命例：时柱戊午、日柱戊辰、月柱甲子、年柱戊寅。'
