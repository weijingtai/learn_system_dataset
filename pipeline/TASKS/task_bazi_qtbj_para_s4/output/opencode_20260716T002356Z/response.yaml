  original: '三月庚金，戊土司令，无生金之理，有埋金之忧，故先甲后丁，不用庚噼甲。三月之庚，土旺金顽，顽金宜丁，旺土须甲，乏甲不能立业，乏丁焉能成名。二者少一，富贵不真。



    庚金无火，非夭则贫。身弱才多，富贵不久。



    得丁甲两透，不见比肩，科甲之命，但要好运相催。甲透丁藏，采芹拾芥。甲藏丁透，异路功名。丁甲俱藏，不受庚制，富中取贵，刀笔起家。有甲无丁，平常之辈。有丁无甲，迂儒腐儒。丁甲两无，下贱之流。



    或一甲、无丁、有丙，由行伍而得官职，须不见壬癸为妙。



    或支成土局，无木，贫贱僧道；见乙、奸诈小人。



    或支成火局，癸水透，富贵。有丙丁出干，见壬制之、方吉。无制、残疾之人。



    用甲者，水妻、木子。用丁者，木妻、火子。



    时日月年



    壬庚庚庚



    午申辰子'
  vernacular: '三月的庚金，戊土当令主事，没有生金的道理，却有埋金的忧虑，所以先取甲木、后取丁火，不用庚金来劈甲木。三月的庚金，土旺而金顽钝，顽钝的金适宜用丁火，旺盛的土必须用甲木，缺少甲木就不能建立事业，缺少丁火又怎么能功成名就。两者缺少一个，富贵就不真实。



    庚金没有火，不是夭折就是贫困。日主身弱而"才"多，富贵不会长久。



    得到丁火和甲木都透出天干，不见"比肩"，是科举功名的命格，但要有好运来催助。甲木透出而丁火藏在地支，可以入学中秀才、拾取功名。甲木藏在地支而丁火透出，是异路功名。丁火和甲木都藏在地支，不受庚金所制，从富中求得贵气，以刀笔吏起家。有甲木而没有丁火，是平常之辈。有丁火而没有甲木，是迂腐的儒生。丁火和甲木两者都没有，是下贱之流。



    如果有一位甲木、没有丁火、有丙火，由行伍出身而得到官职，必须不见壬水癸水为妙。



    如果地支会成土局，没有木，是贫贱的僧道；见到乙木，是奸诈小人。



    如果地支会成火局，癸水透出天干，富贵。有丙火丁火出现在天干上，见到壬水来制伏它们，方才吉利。没有制伏的，是残疾之人。



    用甲木的，以水为妻、以木为子。用丁火的，以木为妻、以火为子。



