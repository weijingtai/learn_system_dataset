  vernacular: '二月的庚金，命局中自然有乙木，当令的乙木，见到庚金必定会对乙木输情，这个金有暗中强旺的趋势，和秋天的金是一个道理，所以二月的庚金，专用丁火，借甲木来引出丁火，借庚金来劈开甲木。没有丁火而用丙火的，富贵多出于勉强。



