  status: machine_translated
- span_id: ss_qtbj_ed01_p0032_s03
  original: '三月己土，正栽培禾稼之时，先丙后癸，土暖而润，随用甲疏，三者俱透天干，必官居黄阁。或三者透一，科甲定然，但要得地。却以庚金为病。



    或有甲无癸，亦可致富，但不贵显。或有癸而无甲丙，亦有衣衿。或有丙癸无甲，亦系人才。丙癸全无，流俗之辈。



    或一派乙木，无金制伏，贫而且夭也。



    妻子同前。



    时日月年



    丙己甲壬



    寅卯辰子


    时日月年



    甲己壬辛



    子巳辰未


    时日月年



    壬己甲壬



    申卯辰子'
  vernacular: '三月的己土，正是栽培庄稼的时候，先取丙火、后取癸水，土温暖而滋润，随着用甲木来疏松，三者都透出天干，必定官居黄阁（内阁）。如果三者透出其中一个，科举功名也一定可得，但要得地（有根）。却以庚金为弊病。



    如果有甲木而没有癸水，也可以致富，但不贵显。如果有癸水而没有甲木和丙火，也有秀才功名。如果有丙火和癸水而没有甲木，也算人才。丙火和癸水全都没有，是流俗之辈。



    如果是一派乙木，没有金来制伏，贫困而且夭折。



    妻子、子女的推断与前面相同。



    命例：时柱丙寅、日柱己卯、月柱甲辰、年柱壬子。


    命例：时柱甲子、日柱己巳、月柱壬辰、年柱辛未。


    命例：时柱壬申、日柱己卯、月柱甲辰、年柱壬子。'
