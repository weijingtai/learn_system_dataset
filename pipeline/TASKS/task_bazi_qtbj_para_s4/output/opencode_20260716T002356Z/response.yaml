    如果地支会成火局，缺少水的，是奔波之客。有壬水癸水来制伏的，是捐纳资财获取功名的人。又见到戊土己土透出天干的就吉利。没有壬水癸水来制火的，又适宜用戊土己土出现在天干上来补金、泄火，或许不会夭折孤贫。



    总而言之，仲夏（五月）没有水，必定不是上等格局，如果是一派木火，没有伤官、印星、"比劫"，又当作"从杀"来论。'
