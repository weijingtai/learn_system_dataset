  original: '### 三春庚金


    正月庚金，木旺之际，有土皆死，不能生金，且金之寒气未除，先用丙暖庚性，又虑土厚埋金，须甲疏洩。丙甲两透，科甲显荣。二者透一，亦有生监。丙藏甲透，异路功名。



    或柱中土多，甲透者贵；甲藏者富，庚出则否。



    或丁火出干，加以戊己而无水者，又主富贵，名官星有气，才旺生扶，故以富贵推之。



    如火多则用土。用土者，火妻土子。



    或支成火局，壬透、有根者，大富贵。无根者、小富贵。乏水者、残疾之人。



    或木被金伤，无丙丁出制，支无丁火﹐此系平人。或丙遭癸困，无戊制者亦然。



    总之，正月庚金，丙甲为上，丁火次之。春金多火，不夭则贫。阳金最喜火炼，煅炼太过，反主奔流。



    时日月年



    庚庚壬壬



    辰申寅子


    时日月年



    丙庚庚辛



    戌戌寅巳'
  vernacular: '正月的庚金，是木旺盛的时候，有土都死了，不能生金，而且金的寒气还没有消除，先用丙火来温暖庚金的性质，又顾虑土厚会埋没金，必须用甲木来疏松泄耗。丙火和甲木都透出天干，科举功名显赫荣耀。两者透出其中一个，也有生员或监生的功名。丙火藏在地支而甲木透出天干，是异路功名。



    如果命局中土多，甲木透出天干的贵；甲木藏在地支的富，庚金出现就不好了。



    如果丁火出现在天干上，加上戊土己土而没有水，又主富贵，名为"官星有气"，"才"旺盛来生扶，所以按富贵来推。



    如果火多就用土。用土的，以火为妻、以土为子。



    如果地支会成火局，壬水透出天干、有根的，大富贵。没有根的，小富贵。缺少水的，是残疾之人。



    如果是"木被金伤"，没有丙火丁火出现来制伏，地支中没有丁火，这是平常之人。如果丙火遭到癸水困住，没有戊土来制的也是这样。



    总而言之，正月的庚金，以丙火和甲木为上，丁火次之。春天的金如果火多，不夭折就贫困。阳金最喜欢火来锻炼，锻炼太过，反而主奔波流离。



    命例：时柱庚辰、日柱庚申、月柱壬寅、年柱壬子。


