- span_id: ss_qtbj_ed01_p0032_s01
  original: '### 三春己土


    正月己土，田园犹冻，盖因腊气未除，余寒未退，故丙为尊。得丙照暖，万物自生，忌见壬水，反为己病，何也？壬乃江湖之水，湖水一发，则田园洗荡，变为沙土，而根苗尽没矣。须戊作堤，以保园圃。壬多要见戊制。有戊出干者，定主玉堂金马。若乏戊制，必属平常。



    或一派甲木，有庚出干，加以癸丙齐透，配得中和，亦名利双全。即丙生寅月，庚透天干，亦有俊秀。若甲多无庚，残疾废人，宜用丁洩。



    或一派火，即不见水无剋，何也？正月己土寒滋，必丙暖，反主厚禄。加一癸透，科甲自然。戊透、反作常人。或一派戊土，有甲出制，又主荣显。如见乙出，虽多不能疏土，且乙多者，奸诈小人。



    用丙者，木妻、火子。'
  vernacular: '正月的己土，田园仍然冰冻，因为腊月的气息还没有消除，残余的寒气还没有退去，所以丙火为最尊贵。得到丙火照耀温暖，万物自然生长，忌怕见到壬水，反而成为己土的弊病，为什么呢？壬水是江湖之水，湖水一旦发出来，就会把田园冲刷荡平，变成沙土，根苗全部淹没了。必须用戊土作为堤防，来保护田园。壬水多要见到戊土来制伏。有戊土出现在天干上的，一定主玉堂金马（翰林院的显贵）。如果缺少戊土来制伏，必定属于平常。



    如果是一派甲木，有庚金出现在天干上，加上癸水和丙火一起透出天干，配合得中和，也是名利双全。即使丙火生在寅月，庚金透出天干，也有俊秀之才。如果甲木多而没有庚金，是残疾废人，适宜用丁火来泄耗。



    如果是一派火，即使不见水也没有克害，为什么呢？正月己土寒冷湿润，必须用丙火来温暖，反而主享受厚禄。加上一个癸水透出天干，科举功名自然是囊中之物。戊土透出天干，反而成为常人。如果是一派戊土，有甲木出现来制伏，又主荣华显达。如果见到乙木出现，虽然多也不能疏松土，而且乙木多的，是奸诈小人。



    用丙火的，以木为妻、以火为子。'
  status: machine_translated
- span_id: ss_qtbj_ed01_p0032_s02
  original: '二月己土，阳气渐升，虽禾稼未成，万物出土，田园未展，先取甲木疏之，忌合。次取癸水润之。甲癸出干，定主科甲，加以一丙出透，势压百僚。一见壬水，微末官职。



    或见庚制甲，壬水出干，比劫重重，此必俗子。丙透犹有小富，丙藏衣禄无亏。



    或支成木局，庚透富贵，若柱多乙木，乙又屈庚，庚必输情于乙，不能扫邪于正，此必狡诈之徒，运入东南，恐有不测。当用丁洩之。有丁者、小人而已，不致无良。



    无比印、从杀者贵。



    若柱中无甲丙癸者，皆下格。



    妻子用神同前。



    时日月年



    庚己乙癸



    午巳卯卯


    时日月年



    乙己乙癸



    丑巳卯卯'
  vernacular: '二月的己土，阳气渐渐上升，虽然庄稼还没有成熟，万物都冒出土地，田园还没有展开，先取甲木来疏松它，忌怕合化。其次取癸水来滋润它。甲木和癸水出现在天干上，一定主科举功名，加上一个丙火透出天干，气势能压倒百官。一旦见到壬水，只是微末的小官职。



    如果见到庚金来制甲木，壬水出现在天干上，"比劫"重重，这必定是俗子。丙火透出还有小富，丙火藏在地支则衣禄无亏。



    如果地支会成木局，庚金透出天干则富贵，如果命局中乙木多，乙木又委屈庚金，庚金必定对乙木输情，不能扫除邪气而归于正道，这必定是狡诈之徒，大运走入东南方，恐怕会有不测。应当用丁火来泄耗。有丁火的，只是小人罢了，不至于没有良心。



    没有比肩和印星的，"从杀"者贵。



    如果命局中没有甲木、丙火、癸水的，都是下等格局。



    妻子、子女和"用神"的推断与前面相同。



    命例：时柱庚午、日柱己巳、月柱乙卯、年柱癸卯。


    命例：时柱乙丑、日柱己巳、月柱乙卯、年柱癸卯。'
  kept_terms:
