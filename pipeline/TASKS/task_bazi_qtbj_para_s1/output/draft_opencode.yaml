  - span_id: ss_qtbj_ed01_p0001_s01
    original: |-
      # 五行总论

      五行者，本乎天地之间而不穷者也，故谓之行。
    vernacular: 所谓五行，是源自天地之间而运行不息的存在，所以称之为"行"。
    kept_terms: []
    status: machine_translated

  - span_id: ss_qtbj_ed01_p0001_s02
    original: 北方阴极而生寒，寒生水。南方阳极而生热，热生火。东方阳散以泄而生风，风生木。西方阴止以收而生燥，燥生金。中央阴阳交而生温，温生土。其相生也所以相维，其相克也所以相制，此之谓有伦。
    vernacular: 北方阴气到极点而产生寒气，寒气生成水。南方阳气到极点而产生热气，热气生成火。东方阳气发散宣泄而产生风，风生成木。西方阴气收敛止息而产生燥气，燥气生成金。中央阴阳交汇而产生温气，温气生成土。它们之间相生的关系是用来相互维系，相克的关系是用来相互制约，这就叫做有秩序条理。
    kept_terms: []
    status: machine_translated

  - span_id: ss_qtbj_ed01_p0001_s03
    original: 火为太阳，性炎上。水为太阴，性润下。木为少阳，性腾上而无所止。金为少阴，性沉下而有所止。土无常性，视四时所乘，欲使相济得所，勿令太过弗及。
    vernacular: 火属于太阳，性质是炎热向上。水属于太阴，性质是滋润向下。木属于少阳，性质是向上腾跃而没有停歇。金属于少阴，性质是向下沉降而有所止息。土没有固定的性质，要看四时它所秉承的态势，务必要使它们相互配合得当，不要让太过或不及。
    kept_terms: []
    status: machine_translated

  - span_id: ss_qtbj_ed01_p0001_s04
    original: 夫五行之性，各致其用。水者其性智，火者其性礼，木其性仁，金其性义，惟土主信，重宽厚博，无所不容：以之水，即水附之而行；以之木，则木托之而生；金不得土，则无自出；火不得土，则无自归。必损实以为通，致虚以为明，故五行皆赖土也。
    vernacular: 五行的性质，各有各的作用。水的性质对应智，火的性质对应礼，木的性质对应仁，金的性质对应义，只有土主信，厚重宽博，没有什么不能包容：以土来承载水，水就依附土而流动；以土来承载木，木就依托土而生长；金没有土，就无从产生；火没有土，就无处归宿。必须减损实在来实现通达，达到虚静来成就明澈，所以五行都依赖土。
    kept_terms: []
    status: machine_translated

  - span_id: ss_qtbj_ed01_p0001_s05
    original: 推其形色，则水黑、火赤、木青、土黄，此正色也。及其变易，则不然。常以生旺从正色，死绝从母色，成形冠带从妻色，病败从鬼色，旺墓从子色。
    vernacular: 推究五行的形色，则是水为黑色、火为赤色、木为青色、土为黄色，这是正色。到了发生变化的时候，就不再是这样了。一般规律是：处于"生旺"状态时依从正色，处于"死绝"状态时依从母色，成形"冠带"时依从妻色，病败时依从"鬼色"，旺墓时依从"子色"。
    kept_terms:
      - 生旺
      - 死绝
    status: machine_translated

  - span_id: ss_qtbj_ed01_p0001_s06
    original: 其数则水一、火二、木三、金四、土五。生旺加倍，死绝减半。
    vernacular: 五行的数则是水为一、火为二、木为三、金为四、土为五。处于"生旺"时加倍，处于"死绝"时减半。
    kept_terms:
      - 生旺
      - 死绝
    status: machine_translated

  - span_id: ss_qtbj_ed01_p0001_s07
    original: 以义推之，夫万物负阴而抱阳，冲气以和。过与不及，皆为乖道。故高者抑之使平，下者举之使崇，或益其不及，或损其太过。所以贵在折衷，归於中道，使无有余不足之累，即才官印食贵人驿马之微意也。行运亦如之，识其微意，则於命理之说，思过半矣。
    vernacular: 以义理来推导，万物都是背负着阴而怀抱着阳，以冲和之气来达到和谐。太过和不及，都是违背正道的。所以高亢的要抑制它使其平缓，低下的要抬举它使其升高，或者补益它不及的部分，或者削减它太过的部分。因此可贵的在于折中调和，归于中道，使没有有余或不足的拖累，这就是"才"、"官"、"印"、"食"、"贵人"、"驿马"等概念的微妙用意。行运也是如此，理解了这层微妙用意，那么对于命理的说法，就已经领悟过半了。
    kept_terms:
      - 才
      - 官
      - 印
      - 食
    status: machine_translated

  - span_id: ss_qtbj_ed01_p0005_s01
    original: |-
      ### 三春甲木

      春月之木，渐有生长之象。初春犹有余寒，当以火温暖，则有舒畅之美，水多变剋，有损精神。重见生旺，必用庚金斲凿，可成楝梁。春末阳壮水渴，藉水资扶，则花繁叶茂。初春无火，增之以水，则阴浓气弱，根损枝枯，不能华秀。春末失水，增之以火，则阳气太盛，燥渴相加，枝枯叶干，亦不华秀。是以水火二物，要得时相济为美。
    vernacular: |-
      春季的树木，渐渐有了生长的气象。初春还有残余的寒气，应当用火来温暖，就有舒畅的美好，水多了会克制，有损精神。重重遇到"生旺"状态的木，必定要用庚金来砍削雕琢，可以成为栋梁之材。春末阳气壮盛而水干涸，借助水来滋养扶持，就能花繁叶茂。初春没有火，反而增加水，就会阴气浓重而气机衰弱，根受损枝条枯槁，不能开花茂盛。春末失去水，反而增加火，就会阳气太盛，燥热干渴交加，枝条枯槁叶子干焦，也不能开花茂盛。因此水和火这两种东西，要得到时令相济为美。
    kept_terms:
      - 生旺
      - 斲凿
      - 相济
    status: machine_translated

  - span_id: ss_qtbj_ed01_p0005_s02
    original: 正月甲木，初春尚有余寒，得丙癸逢，富贵双全。癸藏丙透，名寒木向阳，主大富贵。倘风水不及，亦不失儒林俊秀。如无丙癸，平常人也。
    vernacular: 正月的甲木，初春还有残余的寒气，若同时得到丙火和癸水，主富贵双全。癸水藏于地支而丙火透出天干，名为"寒木向阳"，主大富贵。倘若风水条件不够，也不失为儒林中的才俊之士。如果没有丙火和癸水，便是平常之人。
    kept_terms:
      - 寒木向阳
    status: machine_translated

  - span_id: ss_qtbj_ed01_p0005_s03
    original: |-
      正二月甲木，素无取从才从杀从化之理。或一派庚辛，主一生劳苦，剋子刑妻，再支会金局，非贫即夭。如无丙丁，一派壬癸，又无戊己制之，名水泛木浮，死无棺椁。如一派戊己，支会金局，为财多身弱，富屋贫人，终生劳苦，妻晚子迟。或无庚金，有丁透，亦属文星，为木火通明之象，又名伤官生财格，主聪明雅秀。一见癸水伤丁，但作厚道迂儒。或柱中多癸，滋助木神，伤灭丁火，其人奸雄枭险，曹操之徒，言清行浊，笑里藏刀。


      若庚申、戊寅、甲寅、丙寅。一行金水运，发进士。或甲午日庚午时，此人必贵。但要好运相催，不宜制了庚丁。


      或支成金局，多透庚辛，此又不吉，号曰木被金伤，若无丙丁破金，必主残疾。或支成火局，洩露太过，定主愚懦，常有啾唧灾病缠身，终有暗疾。支成木局，得庚为贵，无庚必凶，若非僧道，男主鳏孤，女主寡独。支成水局，戊透为贵，如无戊制，不但贫贱，且死无棺木。故书曰：甲木若无根，全赖申子辰，干得才杀透，平步上青云。


      凡三春甲木，用庚者，土为妻，金为子。用丁者，木为妻，火为子。


      总之正二月甲木，有庚戊者上命。如有丁透，大富大贵之命也。
    vernacular: |-
      正月的甲木和二月的甲木，从来没有取"从才"、"从杀"、"从化"的道理。如果命局中一派庚金辛金，主一生劳苦，克子刑妻，再加上地支会成金局，不是贫困就是夭折。如果没有丙火丁火，出现一派壬水癸水，又没有戊土己土来克制，名为"水泛木浮"，主死无棺椁。如果出现一派戊土己土，地支会成金局，这就是"财多身弱"，是富屋中的穷人，终生劳苦，娶妻晚、得子迟。如果没有庚金，有丁火透出天干，也属于文星，是"木火通明"之象，又名为"伤官生财格"，主聪明雅秀。一旦见到癸水克伤丁火，就只能做个厚道的迂腐儒生。如果命局中癸水多，滋助了木神，伤灭了丁火，此人奸雄阴险，是曹操一类的人物，言语清高而行为污浊，笑里藏刀。


      比如庚申、戊寅、甲寅、丙寅这个命局。一旦行金水运，考中进士。或者是甲午日庚午时出生，此人必定显贵。但要有好运来催助，不宜制住了庚金和丁火。


      如果地支会成金局，又多透出庚金辛金，这又是不吉的，号为"木被金伤"，如果没有丙火丁火来破除金，必定主残疾。如果地支会成火局，泄耗太过，一定主愚昧懦弱，常有琐碎灾病缠身，终究有暗疾。地支会成木局，得到庚金为贵，没有庚金必定凶，如果不是出家为僧道，男命主鳏寡孤独，女命主寡居独处。地支会成水局，有戊土透出为贵，如果没有戊土来制水，不但贫贱，而且死后没有棺木。所以书中说：甲木如果没有根，全靠申子辰水局，天干上得到"才"和"杀"透出，便可以平步青云。


      凡是三春的甲木，用庚金为用神的，以土为妻、以金为子。用丁火为用神的，以木为妻、以火为子。


      总而言之，正月和二月的甲木，有庚金和戊土的为上等命格。如有丁火透出，是大富大贵的命格。
    kept_terms:
      - 从才
      - 从杀
      - 从化
      - 水泛木浮
      - 财多身弱
      - 木火通明
      - 伤官生财格
      - 木被金伤
      - 杀
      - 伤官
      - 才
    status: machine_translated

  - span_id: ss_qtbj_ed01_p0005_s04
    original: 二月甲木，庚金得所，名阳刃驾杀，可云小贵，异途显达，或主武职，但要财资之。柱中逢才，英雄独压万人。若见癸水，困了才杀，主为光棍，重刃必定遭凶。性情凶暴。书曰：木旺宜火之光辉，秋闱可试。木向春生，处世安然有寿。日主无依，却喜运行才地。
    vernacular: 二月的甲木，庚金得到了适当的位置，名为"阳刃驾杀"，可以说有小贵，可以通过异路途径显达，或者主武职，但需要有财来资助。命局中遇到"才"，英雄气概能独压万人。如果见到癸水，困住了"才"和"杀"，主为光棍，重重阳刃必定遭凶。性情凶暴。书中说：木旺适宜用火的辉煌，可以去参加科举考试。木向春天生长，处世安然有寿。日主没有依凭，却喜欢行运走到"才"地。
    kept_terms:
      - 阳刃
      - 阳刃驾杀
      - 杀
      - 才
    status: machine_translated

  - span_id: ss_qtbj_ed01_p0005_s05
    original: |-
      三月甲木，木气相竭。先取庚金，次用壬水。庚壬两透，一榜堪图。但要运用相生，风水阴德，方许富贵。


      或见一二庚金，独取壬水。壬透清秀之人，才学必富。


      或天干透出二丙，庚藏支下，此钝斧无钢，富贵难求。若有壬癸破火，堪作秀才。


      或柱中全无一水，戊己透干，支成土局，又作弃命从才，因人而致富贵，妻子有能。


      或见戊己，及比劫多者，名为杂气夺才，此人劳碌到老，无驭内之权。女命合此，女掌男权，贤能内助，若比劫重见，淫恶不堪。


      或支成金局，方可用丁，不然，三月无用丁之法。惟有先庚后壬取用。


      书曰：甲乙生寅卯，庚辛干上逢，离南推富贵，坎地却为凶。
    vernacular: |-
      三月的甲木，木气已近枯竭。首先取庚金为用，其次用壬水。庚金和壬水都透出天干，可以谋求考中一榜。但需要大运相生配合，加上风水和阴德，方才允许有富贵。


      如果见到一两分庚金，就只取壬水为用。壬水透出的是清秀之人，才学必定丰富。


      如果天干透出两个丙火，庚金藏在支下，这就如同钝斧没有钢刃，富贵难以求得。如果有壬水或癸水来破除火势，还可以做个秀才。


      如果命局中完全没有一点水，戊土己土透出天干，地支会成土局，这又作"弃命从才"论，因他人而获得富贵，妻子有能耐。


      如果见到戊土己土，以及"比劫"多的，名为"杂气夺才"，此人劳碌到老，没有驾驭内部的权力。女命符合这个格局的，女子掌握男子权力，是贤能的内助，如果"比劫"重重出现，便淫恶不堪。


      只有地支会成金局，方才可以用丁火，否则，三月没有用丁火的方法。惟有先庚金后壬水来取用。


      书中说：甲乙木生在寅卯月，天干上遇到庚金辛金，往南方推求富贵，到了坎地（北方）却为凶。
    kept_terms:
      - 弃命从才
      - 杂气夺才
      - 比劫
      - 才
    status: machine_translated

  - span_id: ss_qtbj_ed01_p0006_s01
    original: |-
      ### 三夏甲木

      四月甲木退气，丙火司权，先癸后丁。


      庚金太多，甲反受病。若得壬水，方配得中和，此人性好清高，假装富贵。即荫袭显达，终日好作祸乱，善辨巧谈，喜作诗文。此理最验。


      如一庚二丙，稍有富贵。金多火多，又为下格。


      或癸丁与庚齐透天干，此命可言科甲，即风水浅薄，亦有选拔之才。癸水不出，虽有庚金丁火，不过富中取贵异途官职而已。壬透可云一富，若全无点水，又无庚金丁火，一派丙戊，此无用之人也。
    vernacular: |-
      四月的甲木，"退气"了，丙火当令主事，先取癸水、后取丁火为用。


      庚金太多，甲木反而受病。如果得到壬水，方才调配得中和，此人性情喜好清高，假装富贵。即便是荫袭而来的显达，也终日喜欢制造祸乱，善于辩论、巧于言谈，喜好写作诗文。这个道理最是应验。


      比如一庚金配二丙火，稍有富贵。金多火又多，又为下等格局。


      如果癸水、丁火与庚金一起透出天干，这个命格可以说有科甲之功名，即使风水浅薄，也有选拔之才。癸水不透出，虽然有庚金和丁火，不过是富中求贵、走异路官职罢了。壬水透出可以说有一富，如果完全没有一点水，又没有庚金和丁火，一派丙火戊土，这是无用之人。
    kept_terms:
      - 退气
      - 司权
    status: machine_translated

  - span_id: ss_qtbj_ed01_p0006_s02
    original: |-
      五六月甲木，木性虚焦，一理共推。五月先癸后丁庚金次之。六月三伏生寒，丁火退气。先丁后庚，无癸亦可。或五月乏癸，用丁亦可，要运行北地为隹。


      总之五六月用丁火，虽运行北地，不致于死。却不利运行火地，号曰木化成灰必死。行西程又不吉，号曰伤官遇杀，不测灾来，惟东方则吉，北方次之。此五六月用丁之说也。


      凡用神太多，不宜剋制，须洩之为妙。


      五六月甲木，木盛先庚，庚盛先丁。五月癸庚两透，为上上之格。六月庚丁两透，亦为上上之格。用神既透，木火通明，自然大富大贵。或丁火太多，癸水亦多，反作平人。


      若柱中多金，名曰杀重身轻，先富后贫，运不相扶，非贫即夭。或庚多，有一二丙丁制伏，又有壬癸透干，泄金之气，此又为先贫后富。


      或满柱丙火，又加丁火，不见官杀，谓之伤官伤尽最为奇，反成清贵，定主才学过人，科甲有望，但岁运不宜见水。若柱中有壬水，运又逢水，必贫夭死。


      但凡木火伤官者，聪明智巧，却是人同心异，多见多疑，虽不生事害人，每抱忌妒之想，女命一理同推。


      或四柱多土，干上有乙木，切勿作弃命从才。


