segments:
- seg_id: s01
  text: 阴阳逆顺妙难穷，二至还乡一九宫。
  note: 一联，开篇阴阳之理
- seg_id: s02
  text: 若能了达阴阳理，天地都来一掌中。
  note: 一联，开篇阴阳之理
- seg_id: s03
  text: 轩辕黄帝战蚩尤，涿鹿经今苦未休。
  note: 一联，开篇阴阳之理
- seg_id: s04
  text: 偶梦天神授符诀，登坛致祭谨虔修。
  note: 一联，开篇阴阳之理
- seg_id: s05
  text: 神龙负图出洛水，彩凤衔书碧云里。
  note: 一联，奇门起源典故
- seg_id: s06
  text: 因命风后演成文，遁甲奇门从此始。
  note: 一联，奇门起源典故
- seg_id: s07
  text: 一千八百当时制，太公测成七十二。
  note: 一联，奇门起源典故
- seg_id: s08
  text: 逮于汉代张子房，一十八局为精艺。
  note: 一联，奇门起源典故
- seg_id: s09
  text: 先须掌上排九宫，纵横十五图其中。
  note: 一联，九宫八卦基础
- seg_id: s10
  text: 次将八卦分八节，一气统三为正宗。
  note: 一联，九宫八卦基础
- seg_id: s11
  text: 阴阳二遁分顺逆，一气三元人莫测。
  note: 一联，九宫八卦基础
- seg_id: s12
  text: 五日都来接一元，接气超神为准则。
  note: 一联，九宫八卦基础
- seg_id: s13
  text: 认取九宫为九星，八门又逐九宫行。
  note: 一联，阴阳二遁顺逆
- seg_id: s14
  text: 九宫逢甲为直符，八门值使自分明。
  note: 一联，阴阳二遁顺逆
- seg_id: s15
  text: 符上之门为直使，十时一易堪凭据。
  note: 一联，阴阳二遁顺逆
- seg_id: s16
  text: 值符常遣加时干，值使顺逆遁宫去。
  note: 一联，阴阳二遁顺逆
- seg_id: s17
  text: 六甲元号六仪名，三奇即是乙丙丁。
  note: 一联，三奇六仪
- seg_id: s18
  text: 阳遁顺仪奇逆布，阴遁逆仪奇顺行。
  note: 一联，三奇六仪
- seg_id: s19
  text: 吉门偶合尔三奇，万事开三万事宜。
  note: 一联，三奇六仪
- seg_id: s20
  text: 更合从旁加检点，馀宫不可有微疵。
  note: 一联，三奇六仪
- seg_id: s21
  text: 三奇得使诚堪使，六甲遇之非小补。
  note: 一联，三奇得使与守门
- seg_id: s22
  text: 乙逢犬马丙鼠猴，六丁玉女骑龙虎。
  note: 一联，三奇得使与守门
- seg_id: s23
  text: 又有三奇游六仪，号为玉女守门扉。
  note: 一联，三奇得使与守门
- seg_id: s24
  text: 若作阴私和合事，从君但向此中推。
  note: 一联，三奇得使与守门
- seg_id: s25
  text: 天三门兮地四户，问君此法如何处？
  note: 一联，天门地户
- seg_id: s26
  text: 天冲小吉与从魁，此是天门私出路。
  note: 一联，天门地户
- seg_id: s27
  text: 地户除危定与开，举事皆从此中去。
  note: 一联，天门地户
- seg_id: s28
  text: 六合太阴太常君，三辰元是地私门。
  note: 一联，天门地户
- seg_id: s29
  text: 更得奇门相照辉，出门百事总欣欣。
  note: 一联，天马与生气死气
- seg_id: s30
  text: 天冲天马最为贵，猝然有难宜逃避。
  note: 一联，天马与生气死气
- seg_id: s31
  text: 但当乘驭天马行，剑戟如山不足畏。
  note: 一联，天马与生气死气
- seg_id: s32
  text: 三为生气五为死，胜在三兮衰在五。
  note: 一联，天马与生气死气
- seg_id: s33
  text: 能识游三避五时，造化真机须记取。
  note: 一联，伏吟返吟
- seg_id: s34
  text: 就中伏吟最为凶，天蓬加著地天蓬。
  note: 一联，伏吟返吟
- seg_id: s35
  text: 天蓬若到天央上，须知即是返吟宫。
  note: 一联，伏吟返吟
- seg_id: s36
  text: 八门返伏皆如此，生在生兮死在死。
  note: 一联，击刑与入墓
- seg_id: s37
  text: 假令凶宿得奇门，万事皆凶不堪使。
  note: 一联，击刑与入墓
- seg_id: s38
  text: 六仪击刑何太凶，甲子值符愁向东。
  note: 一联，击刑与入墓
- seg_id: s39
  text: 戌刑未上申刑虎，寅巳辰辰午刑午。
  note: 一联，击刑与入墓
- seg_id: s40
  text: 三奇入墓宜细推，甲日那堪入坤宫。
  note: 一联，奇墓时墓
- seg_id: s41
  text: 丙奇属火火墓戌，此时诸事不宜为。
  note: 一联，奇墓时墓
- seg_id: s42
  text: 更兼乙奇来临六，丁奇临八亦同时。
  note: 一联，奇墓时墓
- seg_id: s43
  text: 又有时干入墓宫，课中时下忌相逢。
  note: 一联，奇墓时墓
- seg_id: s44
  text: 戊戌壬辰与壬癸，癸未丁丑亦同凶。
  note: 一联，五不遇时与奇门太阴
- seg_id: s45
  text: 五不遇时龙不精，号为日月损光明。
  note: 一联，五不遇时与奇门太阴
- seg_id: s46
  text: 时干来克日干上，甲日须知时忌庚。
  note: 一联，五不遇时与奇门太阴
- seg_id: s47
  text: 奇与门兮共太阴，三般难得共加临。
  note: 一联，五不遇时与奇门太阴
- seg_id: s48
  text: 若还得二亦为吉，举措行藏必遂心。
  note: 一联，兵家值符值使
- seg_id: s49
  text: 更得值符值使利，兵家用事最为贵。
  note: 一联，兵家值符值使
- seg_id: s50
  text: 常从此地击其冲，百战百胜君须记。
  note: 一联，兵家值符值使
- seg_id: s51
  text: 天乙之神所在宫，大将宜居击对冲。
  note: 一联，兵家值符值使
- seg_id: s52
  text: 假令值符居离位，天英坐取击天蓬。
  note: 一联，主客阳阴时
- seg_id: s53
  text: 甲乙丙丁戊阳时，神人天上报君知。
  note: 一联，主客阳阴时
- seg_id: s54
  text: 坐击须凭天上奇，阴时地下亦如之。
  note: 一联，主客阳阴时
- seg_id: s55
  text: 若见三奇在五阳，偏宜为客是高强；忽然逢著五阴位，又宜为主好裁详。
  note: 一联，九天九地太阴六合
- seg_id: s56
  text: 值符前三六合位，太阴之神在前二。
  note: 一联，九天九地太阴六合
- seg_id: s57
  text: 后一宫中为九天，后二之神为九地。
  note: 一联，九天九地太阴六合
- seg_id: s58
  text: 九天之上好扬兵，九地潜藏可立营。
  note: 一联，九天九地太阴六合
- seg_id: s59
  text: 伏兵但向太阴位，若逢六合利逃形。
  note: 一联，天地人三遁
- seg_id: s60
  text: 天地人分三遁名，天遁月精华盖临。
  note: 一联，天地人三遁
- seg_id: s61
  text: 地遁日去紫云蔽，人遁当知是太阴。
  note: 一联，天地人三遁
- seg_id: s62
  text: 生门六丙合六丁，此为天遁自分明。
  note: 一联，天地人三遁
- seg_id: s63
  text: (开门六乙合六己，地遁如斯而已矣。)
  note: 一联，天地人三遁
- seg_id: s64
  text: 休门六丁共太阴，欲求人遁无过此。
  note: 一联，庚丙格勃
- seg_id: s65
  text: 要知三遁何所宜，藏形遁迹斯为美。
  note: 一联，庚丙格勃
- seg_id: s66
  text: 庚为太白丙荧惑，庚丙相加谁会得？
  note: 一联，庚丙格勃
- seg_id: s67
  text: 六庚加丙白入荧，六丙加庚荧入白。
  note: 一联，庚丙格勃
- seg_id: s68
  text: 白入荧兮贼即来，荧入白兮贼即去。
  note: 一联，庚格与奇格
- seg_id: s69
  text: 丙为勃兮庚为格，格则不通勃乱逆。
  note: 一联，庚格与奇格
- seg_id: s70
  text: 丙加天乙为伏逆，天乙加丙为飞勃。
  note: 一联，庚格与奇格
- seg_id: s71
  text: 庚加日干为伏干，日干加庚飞于格。
  note: 一联，庚格与奇格
- seg_id: s72
  text: 加一宫兮战在野，同一宫兮战于国。
  note: 一联，庚格与奇格
- seg_id: s73
  text: 庚加值符天乙伏，值符加庚天乙飞。
  note: 一联，庚格与奇格
- seg_id: s74
  text: 庚加癸兮为大格，加己为刑最不宜。
  note: 一联，庚格与奇格
- seg_id: s75
  text: 加壬之时为上格，又嫌岁月日时逢。
  note: 一联，庚格与奇格
- seg_id: s76
  text: 更有一般奇格者，六庚谨勿加三奇。
  note: 一联，蛇雀龙虎、鸟跌龙首
- seg_id: s77
  text: 此时若也行兵去，匹马只轮无返期。
  note: 一联，蛇雀龙虎、鸟跌龙首
- seg_id: s78
  text: 六癸加丁蛇夭矫，六丁加癸雀投江。
  note: 一联，蛇雀龙虎、鸟跌龙首
- seg_id: s79
  text: 六乙加辛龙逃走，六辛加乙虎猖狂。
  note: 一联，蛇雀龙虎、鸟跌龙首
- seg_id: s80
  text: 请观四者是凶神，百事逢之莫措手。
  note: 一联，蛇雀龙虎、鸟跌龙首
- seg_id: s81
  text: 丙加甲兮鸟跌穴，甲加丙兮龙返首。
  note: 一联，蛇雀龙虎、鸟跌龙首
- seg_id: s82
  text: 只此二者是吉神，为事如意十八九。
  note: 一联，八门吉凶
- seg_id: s83
  text: 八门若遇开休生，诸事逢之总趁情。
  note: 一联，八门吉凶
- seg_id: s84
  text: 伤宜捕猎终须获，杜好邀遮及隐形。
  note: 一联，八门吉凶
- seg_id: s85
  text: 景上投书并破阵，惊能擒讼有声名。
  note: 一联，八门吉凶
- seg_id: s86
  text: 若开死门何所主，只宜吊死与行刑。
  note: 一联，九星吉凶
- seg_id: s87
  text: 蓬任冲辅禽阳星，英芮柱心阴宿名。
  note: 一联，九星吉凶
- seg_id: s88
  text: 辅禽心星为上吉，(冲任小吉)未全亨。
  note: 一联，九星吉凶
- seg_id: s89
  text: 大凶蓬芮不堪使，小凶英柱不精明。
  note: 一联，九星吉凶
- seg_id: s90
  text: 小凶无气变为吉，大凶无气却平平。
  note: 一联，九星旺相休囚
- seg_id: s91
  text: 吉宿更能(逢)旺相，万举万全功必成。
  note: 一联，九星旺相休囚
- seg_id: s92
  text: 若遇休囚并废没，劝君不必走前程。
  note: 一联，九星旺相休囚
- seg_id: s93
  text: 要识九星配五行，须求八卦考羲经。
  note: 一联，九星旺相休囚
- seg_id: s94
  text: 坎蓬水星离英火，中宫坤艮土为营。
  note: 一联，星宿旺相五行
- seg_id: s95
  text: 干兑为金震巽木，旺相休囚看重轻。
  note: 一联，星宿旺相五行
- seg_id: s96
  text: 与我同行即为我，我生之月诚为旺。
  note: 一联，星宿旺相五行
- seg_id: s97
  text: 废于父母休于财，囚于鬼兮真不妄。
  note: 一联，星宿旺相五行
- seg_id: s98
  text: 假令水宿号天蓬，相在初冬与仲冬。
  note: 一联，急从神缓从门
- seg_id: s99
  text: 旺于正二休四五，其馀仿此身研穷。
  note: 一联，急从神缓从门
- seg_id: s100
  text: 急从神兮缓从门，三五反复天道亨。
  note: 一联，十干、斗精、天目
- seg_id: s101
  text: 十干加符若加错，入墓休囚吉事危。
  note: 一联，十干、斗精、天目
- seg_id: s102
  text: 斗精为使最为贵，起官天乙用无遗。
  note: 一联，十干、斗精、天目
- seg_id: s103
  text: 天目为客地耳主，六甲推合无差理。
  note: 一联，宫门迫制与天网
- seg_id: s104
  text: 劝君莫失此玄机，洞彻九宫辅明主。
  note: 一联，宫门迫制与天网
- seg_id: s105
  text: 宫制其门不迫门，门制其宫是迫雄。
  note: 一联，宫门迫制与天网
- seg_id: s106
  text: 天网四张无走路，一二网底有路踪。
  note: 一联，宫门迫制与天网
- seg_id: s107
  text: 三至四宫难回避，八九高张任西东。
  note: 一联，节气三元与收尾
- seg_id: s108
  text: 节气推移时候定，阴阳顺逆要精通。
  note: 一联，节气三元与收尾
- seg_id: s109
  text: 三元积数成六纪，天地未成有一理。
  note: 一联，烟波钓叟歌
- seg_id: s110
  text: 请观歌里真妙诀，非是真贤莫相与。
  note: 一联，烟波钓叟歌
