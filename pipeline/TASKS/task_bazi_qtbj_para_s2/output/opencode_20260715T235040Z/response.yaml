  original: '十一月乙木，花木寒冻，一阳来复，喜用丙火解冻，则花木有向阳之意，不宜用癸以冻花木，故耑用丙火。



    有一二点丙火出干，无癸制者，可许科甲。即丙藏支内，亦有选拔恩封，得此不贵，必因风水薄。或壬癸出干，有戊制，可作能人，即丙在支内，亦是俊秀。若壬透无戊，贫贱之人。



    支成水局，干透壬癸，丙丁全无，虽有戊制，贫乏到老，运至南方，稍有衣食。丁火有亦如无，丁乃灯烛之火，岂能解严寒之冻。设无丙丁，戊土多见，金水奔流，下贱。或有戊己无火，亦属常人，但不至下贱。或一派丁火，大奸大诈之徒。如无甲引丁，孤鳏到老。丁火见甲，必主麟趾振振，芝兰绕膝。



    或成水局，壬癸两透，则木浮矣，不特贫贱，而且夭折，得一戊救方可。



    冬月之木，虽取戊制水，不可作用，耑取丙火则可。用火者，木妻、火子。用土者，火妻、土子。



    乙木生于冬至之后，坐下木局，得丙透干者，富贵之造。即丁出干，亦有衣禄，须忌癸制丁。乙木生于冬月，己土透干，又有丙透，大富贵之造。



    十一月乙木，木寒宜丙﹐有寒谷回春之象，得一丙透，无癸出破格，不特科甲，定主名臣显宦。丙火藏支，食饩而已。干支无丙，一介寒儒。



    或四柱多己，不逢比劫，乃为从才，富比王侯，若见比劫，贫无立锥。虽或一派戊己，见甲颇有衣禄。耑以丙火为用，方妙。'
  vernacular: '十一月的乙木，花木寒冷受冻，一阳初来回复，喜欢用丙火来解冻，那么花木就有向阳的意味，不适宜用癸水来冻住花木，所以专一用丙火。



    有一两点丙火出现在天干上，没有癸水来制住的，可以许为科举功名。即使丙火藏在地支之内，也有选拔贡生及皇恩封赏，得到这些还不贵，必定是因为风水单薄。如果壬水癸水出现在天干上，有戊土来制住，可以成为能干之人，即使丙火在地支之内，也是俊秀之才。如果壬水透出而没有戊土，是贫贱之人。



    地支会成水局，天干透出壬水癸水，丙火丁火完全没有，虽然有戊土来制水，也贫乏到老，大运走到南方，稍微有衣食。丁火有也如同没有，丁火是灯烛之火，怎么能解除严寒的冰冻呢。假如没有丙火和丁火，戊土多见，金水奔流，是下贱之人。或者有戊土己土而没有火，也属于常人，但不至于下贱。如果是一派丁火，是大奸大诈之徒。如果没有甲木来引丁火，孤鳏到老。丁火见到甲木，必定主子孙昌盛，芝兰绕膝。



    如果会成水局，壬水癸水都透出天干，那么木就漂浮了，不但贫贱，而且夭折，得到一个戊土来救助才可以。



    冬天的木，虽然取戊土来制水，不可作"用神"，专一取丙火才可以。用火的，以木为妻、以火为子。用土的，以火为妻、以土为子。



    乙木生在冬至之后，坐下为木局，得到丙火透出天干的，是富贵之命。即使丁火出现在天干上，也有衣禄，但必须忌怕癸水来制丁火。乙木生于冬月，己土透出天干，又有丙火透出，是大富大贵之命。



    十一月的乙木，木寒适宜用丙火，有寒谷回春的气象，得到一个丙火透出天干，没有癸水出现来破格，不但科举功名，一定主成为名臣显宦。丙火藏在地支，只是食饩（享受官粮）罢了。天干地支都没有丙火，只是一个贫寒的儒生。



    如果四柱己土多，不遇到"比劫"，就是"从才"，富裕可比王侯，如果见到"比劫"，贫穷得无立锥之地。虽然是一派戊土己土，见到甲木颇有衣禄。专一以丙火为用神，才好。'
