    如果没有壬水，己土姑且使用，主有才学，虽然不能成名，必定衣食充足。



    如果是一派壬水，见到一个戊土来制，虽然不是科举正途，也有恩庇。如果没有戊土透出，就有辰戌丑未中所藏的戊土，但辰宫中的癸水，贪合而化成火，不能制土，这是平常的衣禄。如果地支下面完全没有一个戊土，这是奔流之人，加上金多来生水，是下贱之命。



