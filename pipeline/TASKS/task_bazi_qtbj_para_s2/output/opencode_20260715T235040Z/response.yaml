  original: '四月丙火，建禄于巳，火势炎炎，宜专用壬水，解炎威之力，成既济之功。如无壬水，孤阳失辅，难透清光。得庚发水源，方为有根之水。壬庚两透，不见戊土，号曰湖水汪洋，广映太阳，光辉显着，文明之象，人格合此，不但科甲峥嵘，必有恩谥封荣，若不验，必暗损阴德。



    或无壬水，癸亦姑用，见庚透癸，不富必贵，但心性乖僻，巧谋善辩。或壬癸俱无，愚顽之辈。火炎无制，僧道之流，不然，须防夭折。



    或一派庚金，不见比劫，有富无贵。



    或丙午日干，四柱多壬，不见戊制，名曰阴刑杀重，光棍之流。或支水局，加之重重壬透，一无制伏，盗贼之命，如见己土，下贱鄙夫。



    用壬者，金妻水子。



    时日月年


    戊丙乙丁


    子子巳巳


    庚运夺魁


    时日月年


    甲丙辛乙


    午午巳未


    时日月年


    丙丙辛庚


    申寅巳子'
  vernacular: '四月的丙火，在巳宫建禄，火势炎炎，适宜专用壬水，解除炎热的威势之力，成就"既济"之功。如果没有壬水，孤阳失去辅助，难以透出清光。得到庚金来发动水源，才是有根之水。壬水和庚金都透出天干，不见戊土，号为湖水汪洋，广阔地映照太阳，光辉显著，是文明的景象，命格符合这个的，不但科举功名峥嵘，必定有恩赐谥号封赏的荣耀，如果没有应验，必定是暗中损害了阴德。



    如果没有壬水，癸水也姑且使用，见到庚金透出和癸水透出，不富必定贵，但心性乖僻，巧于谋划、善于辩论。如果壬水和癸水都没有，是愚蠢顽劣之辈。火势猛烈而没有制伏，是僧道之流，不然的话，须要预防夭折。



