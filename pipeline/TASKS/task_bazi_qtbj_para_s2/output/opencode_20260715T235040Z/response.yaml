  original: '### 三春丙火


    三春丙火，秉象至威，阳回大地，侮雪欺霜，耑用壬水为扶阳，名曰天和地润，既济功成。



    正月用壬，庚辛为助。二月耑用壬水。三月土重晦光，取甲佐之为妙。



    癸丙春生，不晴不雨之天。丙日春生，时月出癸，云雾迷濛，不显不达，非若壬水辅丙也。'
  vernacular: '春天的丙火，秉持的形象极为威严，阳气回归大地，凌侮霜雪，专一用壬水来扶助阳气，取名为天和地润，"既济"之功成就。



    正月用壬水，以庚金辛金为辅助。二月专一用壬水。三月土重遮蔽光芒，取甲木来辅助为妙。



    癸水和丙火在春天一起出现，如同不晴不雨的天气。丙火日主生在春天，时柱和月柱出现癸水，云雾迷蒙，不能显达，不像壬水辅助丙火那样有功效。'
