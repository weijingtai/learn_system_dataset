- span_id: ss_qtbj_ed01_p0008_s01
  original: '### 三冬甲木


    十月甲木，庚丁为要，丙火次之。忌壬水泛身，须戊土制之。



    若庚丁两透，又加戊出干，名曰去浊留清，富贵之极，即乏丁火，亦稍有富贵。或甲多制戊，庚金无根，平常人也。庚戊若透，虽出比劫，必定富而寿。



    或多比劫，只一庚出干，坐禄逢生乃为舍丁从庚，略富贵。或支见申亥，戊己得所，以救庚丁，可许科甲。若单己透，其力弱小，不过贡监而已。



    用庚，土妻金子。用丁，木妻火子。'
  vernacular: '十月的甲木，以庚金和丁火为关键，丙火次之。忌壬水泛滥克身，须用戊土来制住。



    如果庚金和丁火都透出天干，又加上戊土透出天干，名叫"去浊留清"，富贵到了极点，即使缺少丁火，也稍有富贵。如果甲木多来制戊土，庚金没有根气，便是平常之人。庚金和戊土如果透出，虽然出现"比劫"，必定富而且长寿。



    如果"比劫"多，只有一个庚金透出天干，坐禄逢生，就是舍弃丁火而依从庚金，稍有富贵。如果地支见到申和亥，戊土己土得到适当的位置，来挽救庚金和丁火，可以许为科举功名。如果只有己土透出，它的力量弱而小，不过是贡生监生罢了。



    用庚金的，以土为妻、以金为子。用丁火的，以木为妻、以火为子。'
  kept_terms:
  - 去浊留清
  - 比劫
  status: machine_translated
- span_id: ss_qtbj_ed01_p0008_s02
  original: '十一月甲木，木性生寒，丁先庚后，丙火佐之。癸水司权，为火金之病。庚丁两透，支见巳寅，科甲有准，风水不及，选拔有之。若癸透伤丁。无戊己辅救，残疾之人。或壬水重出，丁火全无者，庸人也，得丙方妙。



    或支成水局，加以壬透，名为水泛木浮，死无棺木。



    总之十一月甲木，为寒枝，不比春木清茂，耑取庚丁。透壬无丙，不过刀笔异途，武职有验。



    用庚，土妻金子。用火，木妻火子。'
  vernacular: '十一月的甲木，木的性质生来寒冷，先取丁火、后取庚金，丙火辅助。癸水当令主事，是火和金的病根。庚金和丁火都透出天干，地支见到巳和寅，科举功名有准，风水条件不够的，也有选拔贡生的机会。如果癸水透出伤克丁火，没有戊土己土来辅助救助，便是残疾之人。如果壬水重重出现，丁火完全没有的，是庸人，得到丙火才好。



    如果地支会成水局，加上壬水透出，名为"水泛木浮"，主死无棺木。



    总而言之，十一月的甲木，是寒冷的枝条，不能和春天的木那样清秀茂盛相比，专一取庚金和丁火为用。壬水透出而没有丙火，不过是刀笔小吏走异路功名，武职有应验。



    用庚金的，以土为妻、以金为子。用火的，以木为妻、以火为子。'
  kept_terms:
  - 司权
  - 水泛木浮
  status: machine_translated
- span_id: ss_qtbj_ed01_p0008_s03
  original: '十二月甲木，天寒气冻，木性极寒，无生发之象，先用庚噼甲，方引丁火始得木火有通明之象，故丁次之。



    庚丁两透，科甲恩封。庚透丁藏，小贵。丁透庚藏，小富贵。无庚者，贫贱。无丁者，寒儒。或有丁透重重，亦是富贵中人，但须比肩，能发丁之燄，自有德业才能。如无比肩，寻常之士，稍有衣食而已。或支多见水，即有比肩，亦属平常。



    总之腊月甲木，虽有庚金，丁不可少。乏庚略可，乏丁无用。经云：甲木无根，男女夭寿。'
  vernacular: '十二月的甲木，天气寒冷冰冻，木的性质极为寒冷，没有生发的迹象，先要用庚金劈开甲木，方才引出丁火，才能让木和火有通明的气象，所以丁火次之。



    庚金和丁火都透出天干，科举功名及皇恩封赏。庚金透出而丁火藏支，有小贵。丁火透出而庚金藏支，有小富贵。没有庚金的，贫贱。没有丁火的，是贫寒的儒生。如果有丁火重重透出，也是富贵之人，但必须有"比肩"，能够诱发丁火的火焰，自然有道德功业和才能。如果没有"比肩"，便是寻常之士，稍微有衣食罢了。如果地支多见水，即使有"比肩"，也属于平常。



    总而言之，腊月的甲木，虽然有庚金，丁火不可缺少。缺乏庚金勉强可以，缺乏丁火便无用。经书上说：甲木没有根，男女都夭折短寿。'
  kept_terms:
  - 比肩
  status: machine_translated
- span_id: ss_qtbj_ed01_p0010_s01
  original: '### 三春乙木


    三春乙木，为芝兰蒿草之物，丙癸不可离也，春乙见丙，卉木向阳，万象回春，须癸滋养根基。丙癸齐透天干，无化合制剋，自然登科及第，故书云：乙木根荄种得深，只须阳地不宜阴，漂浮只怕多逢水，剋制何须苦用金。'
  vernacular: 春天的乙木，属于芝兰蒿草之类的植物，丙火和癸水不可分离，春天的乙木见到丙火，花草树木向阳而生，万象回春，必须用癸水来滋养根基。丙火和癸水一起透出天干，没有化合和克制，自然能够登科及第，所以书中说：乙木的根须种得深，只需要向阳之地不宜在阴处，漂浮只怕多遇到水，克制又何须苦苦用金。
  kept_terms: []
  status: machine_translated
- span_id: ss_qtbj_ed01_p0010_s02
  original: '正月乙木，必须用丙，因天气尤有余寒，非丙不暖，虽有癸水，恐凝寒气，故以丙火为先，癸水次之。



    丙癸两透，科甲定然，或有丙无癸门户阐扬。或丙多乏癸，名曰春旱。独阳不长，浊富之人。或丙少癸多，又为困丙，终为寒士。或癸己多见，为溼土之木皆下格。



    用丙者，木妻火子。用癸水见火多者，金妻水子。'
  vernacular: '正月的乙木，必须用丙火，因为天气还有残余的寒气，没有丙火就不能暖和，虽然有癸水，恐怕会凝结寒气，所以以丙火为先，癸水次之。



    丙火和癸水都透出天干，科举功名必定可得，或者有丙火而没有癸水也能光大门户。如果丙火多而缺少癸水，名为"春旱"。独阳不能生长，是浊富之人。如果丙火少而癸水多，又成为"困丙"，终究是贫寒之士。如果癸水和己土多见，是湿土中的树木，都是下等格局。



    用丙火的，以木为妻、以火为子。用癸水而见到火多的，以金为妻、以水为子。'
  kept_terms:
  - 春旱
  - 困丙
  status: machine_translated
- span_id: ss_qtbj_ed01_p0010_s03
  original: '二月乙木，阳气渐升，木不寒矣，以丙为君，癸为臣，丙癸两透，不透庚金，大富大贵。



    或天干透庚，支下无辰，不能化金，得癸透养木亦为贵，若见水库，则为假化，平常人也。



    二月乙木，耑用丙癸，或支成木局，有癸透乃作贵命，更得丙洩木气，上上之命，但须透癸。或水多困丙，多戊化癸，皆下格。



    用丙者，木妻、火子。用癸者，金妻、水子。



    亥卯未逢于甲乙，富贵无疑。木全寅卯辰方，功名有准。活木忌埋根之铁，支下有庚辛，戕贼其根，木则朽矣。'
  vernacular: '二月的乙木，阳气渐渐上升，木不寒冷了，以丙火为君，癸水为臣，丙火和癸水都透出天干，不透庚金，大富大贵。



    如果天干透出庚金，地支下面没有辰土，就不能化金，得到癸水透出来滋养木也算贵，如果见到水库（辰），就成为"假化"，是平常之人。



    二月的乙木，专一用丙火和癸水，如果地支会成木局，有癸水透出就是贵命，再加上丙火来泄耗木气，是上上等的命格，但必须透出癸水。如果水多困住丙火，戊土多来化解癸水，都是下等格局。



    用丙火的，以木为妻、以火为子。用癸水的，以金为妻、以水为子。



    亥卯未三合木局遇到甲乙木，富贵无疑。木齐全了寅卯辰东方木方，功名有准。活着的木忌怕埋住根的金属，地支下面有庚金辛金，戕害它的根，木就腐朽了。'
  kept_terms:
  - 假化
  status: machine_translated
- span_id: ss_qtbj_ed01_p0010_s04
  original: '三月乙木，阳气愈炽，先癸后丙。



    癸丙两透，不见己庚，玉堂之客。见己庚者，平常之人。或一乙逢庚，不见己者，亦主小富贵，但不显达。或多水见己，只恐高才不第。见戊堪发异途。或庚己混杂，丙癸全，则为下格。



    或见水局，丙戊高透，亦主科甲。或柱中全无丙戊，支合水局，此离乡之命。



    或见一派癸水，又有辛金，则作旺看。得一戊己制癸，亦可云小富贵。若一派壬水，不特贫贱，而且夭折。有一戊己，方云有寿，但终为技术之人。



    又或庚辰时月，名二庚争合，乃贫贱之辈。如年干见丁破庚，可云从化，亦不失武职之权。



    用癸者，金妻水子。癸多用丙者，木妻火子。'
  vernacular: '三月的乙木，阳气越来越炽盛，先取癸水、后取丙火为用。



    癸水和丙火都透出天干，不见己土和庚金，是玉堂（翰林院）的贵客。见到己土和庚金的，是平常之人。如果只有一个乙木遇到庚金，不见己土的，也主小富贵，但不显达。如果水多见己土，只恐怕有高才却不能中第。见到戊土可以发达于异路功名。如果庚金和己土混杂，丙火和癸水都齐全，便是下等格局。



    如果见到水局，丙火和戊土高高透出天干，也主科举功名。如果命局中完全没有丙火和戊土，地支合成水局，这是离乡背井之命。



    如果见到一派癸水，又有辛金，就当作身旺来看。得到一个戊土或己土来克制癸水，也可以说小富贵。如果是一派壬水，不但贫贱，而且夭折。有一个戊土或己土，才可以说有寿，但终究是技术手艺之人。



    又或者庚辰时柱和月柱，名为"二庚争合"，是贫贱之辈。如果年干见到丁火破除庚金，可以说是"从化"，也不失为武职的权位。



    用癸水的，以金为妻、以水为子。癸水多而用丙火的，以木为妻、以火为子。'
  kept_terms:
  - 二庚争合
  - 化合格
  status: machine_translated
- span_id: ss_qtbj_ed01_p0011_s01
  original: '### 三夏乙木


    三夏乙木，木性枯焦。四月专尚癸水。五六月先丙后癸，夏至前仍用癸水。先得丙透，支下又有丙火，名曰木秀火明。得一癸透，科甲中人。或透二丙一癸，可许采芹。



    或一派癸水，有丁无丙，平常之人。或一癸透干，异途显宦，难由科甲。癸居子辰，异路小职。或丙藏支下，癸透年干，己出月上，虽非科甲，异路功名。又或重重癸水，或支藏癸水，由行伍出身得功名。'
  vernacular: '夏天的乙木，木的性质枯焦。四月专门崇尚癸水。五月和六月先取丙火、后取癸水，夏至之前仍用癸水。先得到丙火透出，地支下面又有丙火，名叫"木秀火明"。得到一个癸水透出天干，是科举中人。如果透出两个丙火和一个癸水，可以许为入学中秀才。



    如果是一派癸水，有丁火而没有丙火，是平常之人。如果有一个癸水透出天干，走异路途径可以做显赫的官员，但难以通过科举正途。癸水居于子或辰，是异路的小官职。如果丙火藏在地支之下，癸水透在年干，己土出现在月干之上，虽然不是科举正途，也能取得异路功名。又或者癸水重重，或地支藏有癸水，由行伍出身获得功名。'
  kept_terms:
  - 木秀火明
  status: machine_translated
- span_id: ss_qtbj_ed01_p0011_s02
  original: '四月乙木，自有丙火，耑取癸水为尊。四月乙木专用癸水，丙火酌用，虽以庚辛佐癸，须辛透为清。癸透、庚辛又透，科甲定然，独一点癸水、无金，是水无根，虽出天干，不过秀才小富，须要大运相扶。或土多困癸，贫贱之人。丙戊太多，支成火局，瞽目之流。



    用癸者，金妻水子。



    乙逢双女木伤残，若见辛金寿必难，不得丙丁来制伏，岂知安乐不久长。'
  vernacular: '四月的乙木，自身就有丙火，专门取癸水为最尊贵。四月的乙木专用癸水，丙火酌情使用，虽然可以用庚金辛金来辅助癸水，但必须辛金透出才算清纯。癸水透出、庚金辛金又透出，科举功名必定可得，只有一点癸水、没有金，这是水没有根，虽然出现在天干上，不过是秀才小富，需要大运来相扶。如果土多困住癸水，是贫贱之人。丙火戊土太多，地支会成火局，是眼瞎盲目之辈。



    用癸水的，以金为妻、以水为子。



    乙木遇到双女（巳月）木受到伤残，如果见到辛金寿命必定难保，不能得到丙火丁火来制伏，哪里知道安乐不能长久呢。'
  kept_terms: []
  status: machine_translated
