  original: '### 三冬乙木


    十月乙木，木不受气，而壬水司令，取丙为用，戊土次之。丙戊两透，科甲定然。有丙无戊，虽不科甲，亦入儒林。支多丙火，运入火乡，亦主显达。



    或水多无戊，乙性漂浮，流荡之徒。若不见丙巳，妻子难全，或一点壬水，即多见戊土，亦为不妙，得甲制戊，可许能干，但为人好生祸乱，构讼生非，男女一理。支成木局，时值小阳，此又如春木同旺，若有癸出，须取戊为尊，加以丙透，科甲之人。若无丙戊二字，自成自败，终非承受之辈。'
  vernacular: '十月的乙木，木不接受气，而壬水当令主事，取丙火为用神，戊土次之。丙火和戊土都透出天干，科举功名必定可得。有丙火而没有戊土，虽然不是科举正途，也能进入儒林。地支中丙火多，大运走入火乡，也主显达。



    如果水多而没有戊土，乙木的性质漂浮，是流荡之徒。如果见不到丙火和巳火，妻子难全，或者有一点壬水，即使多见戊土，也是不妙，得到甲木来制戊土，可以许为能干之人，但为人喜欢制造祸乱，惹官司生是非，男女命都是同样的道理。地支会成木局，时令正值小阳春（十月），这又和春天的木同样旺盛，如果有癸水出现，必须取戊土为最尊贵，加上丙火透出，是科举之人。如果没有丙火和戊土二字，自成自败，终究不是能承受家业之辈。'
