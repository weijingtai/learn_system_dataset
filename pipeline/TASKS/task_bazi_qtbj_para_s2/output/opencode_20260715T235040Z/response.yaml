  original: '七月乙木，庚金乘令，庚虽输情于乙妹，怎奈干乙难合支金。柱见庚多，乙难受载。或丙透干，又加巳出埋金，此格可云科甲。有己透、加丙，亦是上命。七月喜己土为用，或不见丙癸。己土必不可少，此则以火为妻，土为子。



    或癸透、丙藏、庚少，此不用己，可许贡拔。无丙、有癸透者，不失刀笔门户。有支下庚多，癸又藏者，无丙己二神，平常人物。



    或生辰时，此为从化，反主富贵。凡化合格皆以所生之神为用。化金者，戊为用神，特忌丙丁煅炼破格。从化者以火为妻，土为子。其余以金为妻。妻必贤美。以水为子，子必剋肖，但忌刑冲。凡命皆然，不特此也。



    秋乙逢金，非贫即夭。秋生乙木忌根枯，根既枯藁，贫苦到老。'
  vernacular: '七月的乙木，庚金当令，庚金虽然对乙木妹妹有情，怎奈天干的乙木难以合住地支的金。命局中见到庚金多，乙木难以承受荷载。如果丙火透出天干，又加上巳火出现来埋住金，这个格局可以说是科举功名。有己土透出、加上丙火，也是上等命格。七月喜欢己土为用神，或者不见丙火和癸水，己土必不可少，这种情况以火为妻、以土为子。



    如果癸水透出、丙火藏在地支、庚金少，这种情况不用己土，可以许为贡生选拔。没有丙火、有癸水透出的，不失为刀笔吏的门户。如果地支下面庚金多，癸水又藏而不透，没有丙火和己土二神，是平常人物。



    如果生在辰时，这叫做"从化"，反而主富贵。凡是"化合格"都以所化之神为用神。化金的，以戊土为"用神"，特别忌怕丙火丁火锻炼而破格。从化者以火为妻、以土为子。其余以金为妻，妻子必定贤惠美貌。以水为子，儿子必定克肖父亲，但忌怕刑冲。凡是命格都是这样，不单单是这种情况。



    秋天的乙木遇到金，不是贫困就是夭折。秋天出生的乙木忌怕根枯，根既然枯槁了，贫苦到老。'
