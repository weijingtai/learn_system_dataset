- span_id: ss_qtbj_ed01_p0007_s01
  original: '### 三秋甲木


    三秋甲木，木性枯藁，金土乘旺，先丁后庚，丁庚两全，将甲造为画戟，七月甲堪为戟，非丁火不能造庚，非庚不能造甲，丁庚两透，科甲定然。庚禄居申，杀印相生，运行金水，身伴明君。或庚透无丁，一富而已，主为人操心太重，不能坐享。或丁透庚藏，亦主青衿小富。或庚多无丁，残疾之人若为僧道，灾厄可免。



    或四柱庚旺，支内水多，不作弃命从杀。见土多可作从才而看。



    庚多无癸，而壬水多，戊己亦多，此则专用一点丁火，方可制金以养群土，此命大富。丁藏富小，不显。丁露定作富豪。得二丁，不坐死绝，必然富贵双全，即风水不及，亦可富中取贵，纳粟奏名。



    或癸叠叠制伏丁火，虽满腹文章，终难显达。得运行火土，破癸，略可假就功名，岁运皆背，刀笔之徒。



    支成水局，戊己透干，制去癸水，存其丁火又可云科甲，但此等命，主为人心奸巧诈，好讼争非，因贪致祸。奸险之徒，决非安份之人也。'
  vernacular: '秋天的甲木，木的性质枯槁，金和土处于"乘旺"状态，先取丁火、后取庚金为用，丁火和庚金两者齐全，就能将甲木打造成画戟，七月的甲木能够做成画戟，没有丁火就不能锻炼庚金，没有庚金就不能雕琢甲木，丁火和庚金都透出天干，科举功名必定可得。庚金的长生之位在申，形成"杀印相生"，大运走到金水之地，能陪伴在明君身边。如果庚金透出而没有丁火，不过是一个富人罢了，主为人操心太重，不能坐享其成。如果丁火透出而庚金藏在地支，也主能获得青衿（秀才功名）、小富。如果庚金多而没有丁火，是残疾之人，如果做了僧道，灾厄可以免除。



    如果四柱庚金旺盛，地支内水又多，不当作"弃命从杀"来看。见到土多可以当作"从才"来看。



    庚金多而没有癸水，而壬水多，戊土己土也多，这种情况就专取一点丁火为用，才可以制住金来养护众多的土，这种命格是大富。丁火藏在地支富小、不显赫。丁火透出天干必定成为富豪。得到两个丁火，且不坐"死绝"之地，必然富贵双全，即使风水条件不够，也可以从富裕中求得贵气，通过纳粟捐资获取功名。



    如果癸水层层叠叠制伏丁火，虽然满腹文章，终究难以显达。如果大运走到火土之地，破除癸水，略微可以假借获得功名，如果岁运都背逆，只能是刀笔小吏之辈。



    地支会成水局，戊土己土透出天干，制去癸水，保存丁火，又可以取得科举功名，但这种命格，主为人心奸巧诈，喜好诉讼争执是非，因贪心而招致灾祸。是奸险之人，决非安分守己的人。'
  kept_terms:
  - 乘旺
  - 杀印相生
  - 弃命从杀
  - 从才
  - 死绝
  - 杀
  - 才
  status: machine_translated
- span_id: ss_qtbj_ed01_p0007_s02
  original: 七月甲木，丁火为尊，庚金次之，庚金不可少。火隔水不能镕金，故丁火镕金，必赖甲木引助，方成洪炉。若有癸水阻隔，便灭丁火，壬水无碍，且能合丁，但须见戊土，方可制水存火。
  vernacular: 七月的甲木，以丁火为最尊贵，庚金次之，庚金不可缺少。火隔着水就不能熔化金，所以丁火要熔化金，必须依赖甲木来引助，方能形成洪炉。如果有癸水阻隔，便会扑灭丁火，壬水没有妨碍，而且能与丁火相合，但必须见到戊土，才可以制住水而保存火。
  kept_terms: []
  status: machine_translated
- span_id: ss_qtbj_ed01_p0007_s03
  original: '八月甲木，木囚金旺。丁火为先，次用丙火，庚金再次。



    一丁一庚，科甲定显。癸水一透，科甲不全。



    丙庚两透，富大贵小。丙丁全无，僧道之命。



    丙透无癸，富贵双全。有癸制丙，寻常之人。



    支成火局，可许假贵，戊己一透，可作富翁。



    或支成金局，干露庚金，为木被金伤，必主残疾，得丙丁破金，亦主老来暗疾。



    或支成木局，干透比劫，反取庚金为先，次用丁火。'
  vernacular: '八月的甲木，木被囚禁而金旺。以丁火为先，其次用丙火，庚金再次。



    有一个丁火和一个庚金，科举功名必定显赫。癸水一旦透出天干，科举功名就不齐全了。



    丙火和庚金都透出天干，富大而贵小。丙火和丁火全都没有，是僧道之命。



    丙火透出而没有癸水，富贵双全。有癸水来制丙火，便是寻常之人。



    地支会成火局，可以许为假贵，戊土己土一旦透出天干，可以成为富翁。



    如果地支会成金局，天干露出庚金，这就是"木被金伤"，必定主残疾，得到丙火丁火来破除金，也主老来有暗疾。



    如果地支会成木局，天干透出"比劫"，反而取庚金为先，其次用丁火。'
  kept_terms:
  - 木被金伤
  - 比劫
  status: machine_translated
- span_id: ss_qtbj_ed01_p0007_s04
  original: '九月甲木，木星凋零，独爱丁火，壬癸滋扶，丁壬癸透，戊己亦透，此命配得中和，可许一榜。庚金得所，科甲定然。



    或见一二比肩，无庚金制之，平常人也。倘运不得用，贫无立锥。一命，甲辰、甲戌、甲辰、甲戌、身伴明君，富贵寿考，此为天元一气，又名一才一用。遇比用才，专取季土。或见庚丙，可许入泮，白手成家。用火者，木妻火子，子肖妻贤。



    或四柱木多，用丙用丁，皆不足异，耑用庚金为妙。凡四季甲木，总不外乎庚金。譬如木为犁，能疏季土，非庚金为犁嘴，安能疏土虽用丙丁，癸庚决不可少也。九月却不取土妻庚子，当取水妻木子。



    凡甲木，多见戊己，定作弃命从才而看。从才格，取火妻土子。



    或见一派丙丁伤金，不过假道斯文，有壬癸破了丙丁，技艺之流。无壬癸破火，支又成火局，乃为枯朽之木，有庚亦何能为力，定作孤贫下贱之辈，男女一理。



    或有假伤官，得地逢生，此正合甲乙秋生贵元武之说，用水制伤官者，以金为妻，水为子。



    或丁戊俱多，总不见水，又为伤官生财格，亦可云富贵，此格取火为妻，土为子。



    凡甲多庚透，大贵。庚藏，小贵。若柱中多庚，则又以丁为奇，富贵人也。如庚申年、丙戌月、甲申日、壬申时，此主功名显达，有文学。若无庚丙年月，又无火星出干，虽曰好学，终困名场。



    九月甲木，耑用丁癸，见戊透必贵。如戊戌、壬戌、甲子、甲申，支成水局，干有壬水，正合贵元武之说。配得中和，一榜之命，家计丰足。但庚丁未透出干，不能馆选。



    甲乙比肩，又逢比劫运，主兄弟劫财争讼，刑妻损子。甲乙生正二月，无制无洩，主长发师姑。'
  vernacular: '九月的甲木，木星凋零，只喜欢丁火，壬水癸水来滋润扶持，丁火、壬水、癸水透出天干，戊土己土也透出天干，这个命格配得中和，可以许为考中一榜。庚金得到适当的位置，科举功名必定可得。



    如果见到一两个"比肩"，没有庚金来制住它，便是平常之人。倘若大运不得用神相助，贫穷得无立锥之地。有一个命例：甲辰、甲戌、甲辰、甲戌，身伴明君，富贵长寿，这叫做"天元一气"，又叫做"一才一用"。遇到比肩就用"才"，专门取季土为用。如果见到庚金和丙火，可以许为入学中秀才，白手起家。用火为用神的，以木为妻、以火为子，儿子肖似父亲、妻子贤惠。



    如果四柱木多，用丙火用丁火，都不足为奇，专一用庚金为妙。凡是四季（辰戌丑未月）的甲木，总不外乎用庚金。譬如木是犁，能够疏松四季的土，没有庚金作为犁嘴，怎么能疏松土呢？虽然用丙火丁火，癸水和庚金决不可少。九月却不取土为妻、庚金为子，应当取水为妻、木为子。



    凡是甲木，多见戊土己土，一定当作"弃命从才"来看。从才格，取火为妻、土为子。



    如果见到一派丙火丁火伤害金，不过是假道学斯文之辈，有壬水癸水来破除丙火丁火，便是技艺之人。没有壬水癸水来破除火，地支又会成火局，就是枯朽之木，有庚金又能起什么作用呢，一定沦为孤贫下贱之辈，男女命都是同样的道理。



    或者有"假伤官"，得地得生，这正符合甲乙木秋天出生、贵在元武（水）的说法，用水来制伤官的，以金为妻、以水为子。



    如果丁火和戊土都多，始终不见水，又成为"伤官生财格"，也可以说是富贵，这个格局取火为妻、土为子。



    凡是甲木多而庚金透出的，大贵。庚金藏在地支的，小贵。如果命局中庚金多，就又以丁火为奇，是富贵之人。比如庚申年、丙戌月、甲申日、壬申时，这个命主功名显达，有文学之才。如果没有庚金和丙火在年月，又没有火星透出天干，虽然好学，终究受困于功名考场。



    九月的甲木，专一用丁火和癸水，见到戊土透出必定贵。比如戊戌、壬戌、甲子、甲申，地支会成水局，天干有壬水，正符合贵在元武（水）的说法。配得中和，是一榜之命，家庭经济丰足。但庚金和丁火没有透出天干，不能入选馆阁。



    甲乙"比肩"，又遇到"比劫"大运，主兄弟劫财争吵诉讼，刑伤妻子、损害子女。甲乙木生在正二月，没有克制也没有泄耗，主成为出家的长发女尼。'
