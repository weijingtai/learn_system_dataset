  original: '六月丙火退气，三伏生寒，壬水为用，取庚辅佐。



    庚壬两透，贴身相生，可云科甲名宦。若无庚有壬，不见戊出，小富小贵。见戊制壬，则为乡贤而已。



    或己土出干混杂，此必庸夫俗子。或壬水浅，己土出干，其人贫困。无壬下格，贱而且顽，男女一理。



    或天干一派丙火，阳极生阴，干支两见庚壬，登科及第。



    总之六月丙火用壬，不同余月用壬，喜运行西北，六月用壬，喜运行西南。



    时日月年


    壬丙丁壬


    辰申未寅


    时日月年


    己丙己戊


    亥戌未午


    时日月年


    戊丙丁壬


    戌申未寅'
  vernacular: '六月的丙火"退气"，三伏天中生出寒气，以壬水为用神，取庚金来辅助。



    庚金和壬水都透出天干，贴身相生，可以说是科举功名、有名望的官员。如果没有庚金而有壬水，不见戊土出现，小富小贵。见到戊土来制壬水，就只是乡贤罢了。



    如果己土出现在天干上混杂，这必定是庸夫俗子。如果壬水浅，己土出现在天干上，此人贫困。没有壬水是下等格局，卑贱而且顽固，男女命都是同样的道理。



    如果天干一派丙火，阳极生阴，天干和地支都见到庚金和壬水，登科及第。



    总而言之，六月的丙火用壬水，不同于其他月份用壬水，喜欢大运走西北方，六月用壬水，喜欢大运走西南方。



    命例：时柱壬辰、日柱丙申、月柱丁未、年柱壬寅。


    命例：时柱己亥、日柱丙戌、月柱己未、年柱戊午。


    命例：时柱戊戌、日柱丙申、月柱丁未、年柱壬寅。'
