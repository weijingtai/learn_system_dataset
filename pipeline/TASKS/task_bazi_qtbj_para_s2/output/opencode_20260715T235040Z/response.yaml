    如果是丙子日、辛卯时，是从化格，但不逢其时，"贪财坏印"，难以招来祖业。如果得到一两重丁火来破除辛金，壬水得到恰当的位置，也主富贵，虽然不是科举正途，也有异路功名，名声传到郡县。符合这个格局的，主妻妾多、儿子多。



    如果月柱和时柱见到两个辛卯，日柱是丙子，名为"争合"，年干不露出丁火来制辛金，此人沉迷酒色昏聩无能，年干露出丁火反而吉利。如果地支会成木局，反而因为奸情获得钱财，因酒而得到名声。



