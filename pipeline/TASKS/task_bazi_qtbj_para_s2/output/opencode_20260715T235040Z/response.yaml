  original: '五月丙火，得壬高透，方为上命。或一壬无庚，亦主贡监，犹防戊己出干，丁壬化合，则为平人。即不透庚壬，或有申宫长生之水，济之坐禄之金，至妙，必入词林。又怕戊己杂乱，则为异路。



    或成火局，不见滴水者，乃僧道鳏独之命。即有.



    一二癸水，多遇火土，用之无力，瞽目之人。得戊己透洩火气，亦主刑剋孤寡，行北运多凶，何也？所谓燥烈水激反凶！



    或成炎上格，柱运不见庚辛，多见甲乙者，反主大富贵，然亦不可见水运。



    或有庚癸透者，衣禄充足。支火轻，无目疾。支见水者，异途。或成土局，又为洩太过，得壬滋甲出干，土被制而火得生扶，此必富贵寿考之格也。



    时日月年


    己丙壬庚


    亥戌午寅


    时日月年


    己丙戊戊


    丑午午戌


    时日月年


    甲丙戊戊


    午辰午申'
  vernacular: '五月的丙火，得到壬水高高透出天干，才是上等命格。如果有一个壬水而没有庚金，也主贡生监生，仍然要防备戊土己土出现于天干，丁火与壬水化合，就成为平常之人。即使不露出庚金和壬水，如果有申宫长生之地的壬水，配合坐禄之金，最为妙，必定进入词林（翰林院）。又怕戊土己土杂乱，就成为异路功名。



    如果会成火局，见不到一滴水的，是僧道鳏寡孤独之命。即使有一两个癸水，多遇到火和土，用它却无力，是眼瞎盲目之人。得到戊土己土透出来泄耗火气，也主刑克孤寡，走北方运多凶，为什么？所谓燥烈遇水相激反而凶！



    如果会成"炎上"格，命局和大运不见庚金辛金，多见甲木乙木的，反而主大富贵，但也不可以见到水运。



    如果有庚金和癸水透出的，衣禄充足。地支火轻的，没有眼目疾病。地支见到水的，是异路功名。如果会成土局，又是泄耗太过，得到壬水滋润、甲木出现在天干上，土被制住而火得到生扶，这必定是富贵长寿的格局。



    命例：时柱己亥、日柱丙戌、月柱壬午、年柱庚寅。


    命例：时柱己丑、日柱丙午、月柱戊午、年柱戊戌。


    命例：时柱甲午、日柱丙辰、月柱戊午、年柱戊申。'
