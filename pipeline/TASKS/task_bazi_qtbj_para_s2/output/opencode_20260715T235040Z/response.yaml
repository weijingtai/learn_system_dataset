  status: machine_translated
- span_id: ss_qtbj_ed01_p0012_s03
  original: '八月乙木，芝兰禾稼均退。以丹桂为乙木。在白露之后，桂蕊未开，耑用癸水以滋桂萼。若秋分后，桂花已开，却喜向阳，又宜用丙，癸水次之，丙癸两透，科甲名臣。



    或支成金局，宜暗藏丁，无丁制金，恐木被金伤。若无水火，此人劳碌。或得癸水，为子得母，其人一生丰盈。或丙癸两透，戊土杂出，亦主异路功名。



    生秋分后，有丙无癸，亦略富贵。若有癸无丙，名利虚花。若四柱不见丙癸，下格。



    或癸在年（月）干，丙透时干，名为木火文星，定主上达。生于秋分后方佳。或生上半月无癸，姑用壬水，不然，枯木无用，必作贫人。又四柱多见戊己，下格。



    用癸者，金妻、水子。用丙者，木妻、火子。用壬者，金妻水子。



    甲乙遇强金，魂归西土，青龙逢兑旺，且贫且贱。



    乙木生居酉，莫逢巳酉丑，富贵坎离宫，贫穷申酉守。木逢金旺巳伤，再遇金乡，岂不损寿。'
  vernacular: '八月的乙木，芝兰和庄稼都退败了。以丹桂来比喻乙木。在白露之后，桂花的花蕊还没有开放，专一用癸水来滋润桂花的萼片。如果到了秋分之后，桂花已经开放，却喜欢向阳，又适宜用丙火，癸水次之，丙火和癸水都透出天干，是科举出身的著名臣子。



    如果地支会成金局，适宜暗藏丁火，没有丁火来制金，恐怕"木被金伤"。如果没有水和火，此人劳碌。如果得到癸水，就像儿子得到母亲一样，那人一生丰盈。如果丙火和癸水都透出天干，戊土杂出，也主异路功名。



    出生在秋分之后，有丙火而没有癸水，也稍有富贵。如果有癸水而没有丙火，名利是虚假的花朵。如果四柱不见丙火和癸水，是下等格局。



    如果癸水在年干（或月干），丙火透在时干，名为"木火文星"，一定主向上发达。出生在秋分之后方才为佳。如果出生在上半月而没有癸水，姑且用壬水，不然的话，枯木无用，必定成为贫困之人。又四柱多见戊土己土，是下等格局。



    用癸水的，以金为妻、以水为子。用丙火的，以木为妻、以火为子。用壬水的，以金为妻、以水为子。



    甲乙木遇到强金，魂归西方（死），青龙（木）遇到兑宫（金）旺盛，又贫又贱。



    乙木生在酉月，不要遇到巳酉丑三合金局，富贵在坎离宫（水方和火方），贫穷就在申酉方守着。木遇到金旺已经受伤，再遇到金的运地，岂不折损寿命。'
  kept_terms:
  - 木火文星
  status: machine_translated
- span_id: ss_qtbj_ed01_p0012_s04
  original: '九月乙木，根枯叶落，必赖癸水滋养。如见甲申时，名为藤萝系甲，可秋可冬。若见癸水，又遇辛金发水之源，定主科甲。或有癸无辛，常人。有辛无癸，贫贱。或四柱壬多，水难生乙，亦是寻常之辈。



