  original: '五月乙木，丁火司权，禾稼俱旱。上半月属阳，仍用癸水。下半月属阴，三伏生寒，丙癸齐用。柱多金水，丙火为先，余皆用癸水为先。



    乙木重逢火位，名为气散之文，支成火局，洩乙精神，须用癸滋。癸透有根，富贵双全。或庚辛年上，癸透时干，定许科甲，无癸者常人。



    若见丙透，支成火局，阳焦木性，此人残疾，无癸必夭，见壬可解。或火土太多，其人愚贱，或为僧道门下闲人。'
  vernacular: '五月的乙木，丁火当令主事，庄稼都干旱了。上半月属阳，仍然用癸水。下半月属阴，三伏天中生出寒气，丙火和癸水一起使用。命局中金和水多，以丙火为先，其余都以癸水为先。



    乙木重重遇到火的位置，名为"气散之文"，地支会成火局，泄耗乙木的精神，必须用癸水来滋润。癸水透出有根，富贵双全。如果庚金辛金在年柱上，癸水透在时干，一定许为科举功名，没有癸水的便是常人。



    如果见到丙火透出，地支会成火局，阳气焦灼了木的性质，此人是残疾之人，没有癸水必定夭折，见到壬水可以化解。如果火和土太多，此人愚蠢卑贱，或者成为僧道门下的闲散之人。'
  kept_terms:
  - 司权
  - 气散之文
  status: machine_translated
- span_id: ss_qtbj_ed01_p0011_s04
  original: '六月乙木，木性且寒，柱多金水，丙火为尊。支成水局，乙得无伤。癸水透干，大富大贵。无癸定作常人，运不行北，困苦一生。



    凡五六月乙木，气退枯焦，用癸水切忌戊己杂乱，则为下格。或甲木高透，制伏土神名为去浊留清，可许俊秀。土多乏甲秀气脱空，庸人而已。



    或丙癸两透，加以甲透制戊，选拔定然。若不见丙癸，只有丁火，亦属常人，有壬、可充衣食。



    或柱中无水，又无比劫出干﹐乃为弃命从才，富大贵小，能招贤德之妻。从才格以火为妻，土为子。



    或一派戊土出干，不见比肩，名为才多身弱，终为富屋贫人。



    或丙辛化水，嫖赌破家，终非承受之儿。



    或一派乙木，不见丙癸，名为乱臣无主劳碌奔波，又加支多辛金，僧道之辈。



    或一派甲木，无癸无丙，又无庚金，此人一生虚浮，总不诚实。有庚制甲，乃有谋之人，但嗜酒贪花，多欲败德，不修品行，男女一理。



    总之夏月之乙木，耑用癸水，丙火酌用，庚辛次之。'
  vernacular: '六月的乙木，木的性质尚且寒凉，命局中金和水多，以丙火为最尊贵。地支会成水局，乙木得以不受伤害。癸水透出天干，大富大贵。没有癸水一定成为常人，大运不走北方水地，困苦一生。



    凡是五月和六月的乙木，气机衰退枯焦，用癸水切忌戊土己土来杂乱，杂乱就成为下等格局。如果甲木高高透出，制伏土神，名为"去浊留清"，可以许为俊秀之才。土多而缺少甲木，秀气脱空，不过是庸人罢了。



    如果丙火和癸水都透出天干，加上甲木透出来制戊土，选拔贡生必定可得。如果见不到丙火和癸水，只有丁火，也属于常人，有壬水，可以满足衣食。



    如果命局中没有水，又没有"比劫"透出天干，就是"弃命从才"，富大而贵小，能够招来贤德的妻子。从才格以火为妻、以土为子。



    如果一派戊土透出天干，不见"比肩"，名为"才多身弱"，终究是富屋中的穷人。



    如果丙火与辛金化合成水，嫖赌败家，终究不是能承受家业的儿子。



    如果一派乙木，不见丙火和癸水，名为乱臣无主，劳碌奔波，再加上地支多辛金，是僧道之辈。



    如果一派甲木，没有癸水也没有丙火，又没有庚金，此人一生虚浮，总是不诚实。有庚金来制甲木，是有谋略的人，但嗜酒贪花，多欲望而败坏德行，不修品行，男女命都是同样的道理。



    总而言之，夏天的乙木，专一用癸水，丙火酌情使用，庚金辛金次之。'
