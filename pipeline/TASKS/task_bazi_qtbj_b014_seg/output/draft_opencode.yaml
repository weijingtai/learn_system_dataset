  - seg_id: s01
    entry_title: 正月丁火
    path: 十干分论 / 论丁火 / 三春丁火 / 正月
    text: |
      ### 三春丁火
      正月丁火，甲木当权，乃为母旺，非庚不能噼甲，何以引丁，姑用庚金。

      或一派甲木，无庚制之，非贫即夭。或只一甲木，多见乙木者，必离乡之客，焉问妻儿。或见甲乙，生庚子时，又主妻早子早，且可采芹。

      得壬化木，弱极复生，合此必主大贵，但此化合，反以不见庚破格为妙。

      或有庚金壬癸，得己土出干制之，此命不由科甲，亦有异途。

      或一派壬癸，不得寅时，又无庚金，必主穷困。

      或丁年、壬月、丁日、壬时，男主大贵；女则不宜。此格以土为妻、金为子。但子女艰难。女命合此，淫贱，刑夫剋子。

      或支火局，无滴水解，僧道之命。见甲出略可。总不可无水。水多亦不宜。

      时日月年

      壬丁戊庚

      寅未寅辰
      时日月年

      癸丁庚辛

      卯酉寅卯
    note: 论正月丁火甲木当权取庚噼甲引丁，含丁壬化合、支火局无水变例，附两则命造
    case_candidate: true

  - seg_id: s02
    entry_title: 二月丁火
    path: 十干分论 / 论丁火 / 三春丁火 / 二月
    text: |
      二月丁火，溼乙伤丁，先庚后甲，非庚不能去乙，非甲不能引丁。庚甲两透，科甲定然。庚透甲藏，亦有生贡。甲透庚藏，异路功名。

      或庚乙俱透，庚必输情于乙，未免贪合，运行金水，一贫彻骨。或庚透乙藏，则不能贪合，乙反引丁，即用乙亦无害，运入木火之乡，自然富贵。用乙者，水妻木子。若尽是乙木，不见一甲，此人富贵不久，因贪致祸﹐弄巧反拙。且不能承受先人之业。

      或支成木局，有庚透、主清贵。不见庚者、常人。二月乙木司权，必须有庚，有乙无庚，主贫苦无依。用庚者、土妻金子。

      得印旺杀高，大富大贵。或一派水，无一戊制，主贫苦无依。或乙少癸多，有戊出制，反吉。用土者、火妻土子。

      时日月年

      丁丁乙戊

      未巳卯子
      时日月年

      庚丁癸丁

      子卯卯卯
      时日月年

      甲丁己庚

      辰丑卯辰
    note: 论二月丁火溼乙伤丁先庚后甲，庚甲两透科甲，含庚乙贪合、支成木局变例，附三则命造
    case_candidate: true

  - seg_id: s03
    entry_title: 三月丁火
    path: 十干分论 / 论丁火 / 三春丁火 / 三月
    text: |
      三月丁火，戊土司令，洩弱丁气，先用甲木引丁制土，次看庚金。庚甲两透，定主科甲。或一藏一透，终非白丁。

      或支成木局，取庚为先。得庚透，丁癸不透，亦有异路功名。

      或支成水局，加以壬透，名杀重身轻，必夭折天年。或遭凶死。或戊己两透，廊庙之客。若一甲破，定是常人。

      用甲者，水妻木子。用金者，土妻金子。
    note: 论三月丁火戊土洩气先甲后庚，庚甲两透科甲，含水局杀重身轻变例
    case_candidate: false
