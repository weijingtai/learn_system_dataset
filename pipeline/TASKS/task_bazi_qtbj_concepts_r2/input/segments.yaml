  entry_title: 四月戊土
  text: '### 三夏戊土

    四月戊土，阳气发升，寒气内藏，外实内虚，不畏火炎，无阳气相催，万物不长，故先用甲疏噼，次取丙癸为佐。


    丙透甲出，廊庙之才，丙癸俱透，科甲之士，即透一位，支藏得所，终非白丁。


    若一派丙火，为火炎土燥，僧道之流，得一癸透壬藏，功名有准。或支藏癸水衣食充足，但骨肉多刑。


    化合成局无破，富贵非轻。


    此用癸水，金妻水子。


    时日月年


    丙戊癸辛


    辰午巳亥

    时日月年


    丁戊丁癸


    巳午巳丑

    '
- span_id: ss_qtbj_ed01_p0028_s02
  entry_title: 五月戊土
  text: '五月戊土，仲夏火炎，先看壬水，次取甲木，丙火酌用，用癸力微。


    壬甲两透，名君臣庆会，自然桃浪先声，权高位显，又得辛透年干，官居一品。一命、辛未、甲午、戊寅、壬子，壬甲两透。印旺杀高，出将入相，名播四夷。


    若支成火局，即透癸水，不能大济，是一杯水难济薪火也。人命合此，即好学不倦，亦不能成名，且主目疾。若得壬水出干，则非此比。


    又或土木重重，全无滴水，僧道孤贫之辈。


    用壬者、金妻水子。

    '
- span_id: ss_qtbj_ed01_p0028_s03
  entry_title: 六月戊土
  text: '六月戊土，遇夏干枯，先看癸水，次用丙火甲木。癸丙两透，科甲中人。或有癸无丙，见甲可许秀才。无甲略富。或有丙无癸，假道斯文，衣食颇足。


    或癸透辛出，以刀笔之才，可谋异路。


    无癸丙者，常人。若又无甲，下贱之辈。


    或土多得一甲出，不见庚辛，为人作事轩昂，性情谨慎，即不显扬，亦文章惊世。


    用癸者，金妻、水子。用丙者，木妻、火子。用甲者，水妻、木子。


    时日月年


    癸戊己戊


    丑辰未戍

    时日月年


    辛戊己戊


    酉午未申

    时日月年


    丁戊癸庚


    巳子未子

    '
