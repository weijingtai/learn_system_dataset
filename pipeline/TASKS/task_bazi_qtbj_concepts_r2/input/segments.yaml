- span_id: ss_qtbj_ed01_p0018_s01
  entry_title: 七月丙火
  text: '### 三秋丙火

    七月丙火，太阳转西，阳气衰矣。日近西山，见土皆晦，惟日照湖海，暮夜光天，故仍用壬水，辅映光辉。


    如壬多，取戊制方妙。有壬透干，又见戊土出干，可云科甲。如戊藏支内，不过生员。多壬无戊，平常人也。或戊多壬少，亦属常人。或多壬，一戊出制，所谓众杀猖狂，一仁可化，必主显达，有权职。


    一派辛金，又为弃命从才，奇特之造，虽不科甲，亦得恩荣，但多依亲戚而为进身之阶。从才者以水妻木子。


    时日月年


    壬丙戊壬


    辰申申戌

    时日月年


    庚丙甲乙


    寅申申未

    '
- span_id: ss_qtbj_ed01_p0018_s02
  entry_title: 八月丙火
  text: '八月丙火，日近黄昏，丙火之余光，存于光湖，仍用壬水辅映。


    四柱多丙，一壬高透为奇，定主登科及第。富贵双全。一壬藏支，亦主秀才。或戊多困水则假作斯文。若无壬水，癸亦可用，但功名不久。


    或见辛透，不能从化，贫苦到老。或见一丁制辛，为人奸诈，不识高低。女命合此，长舌淫贱。


    或成金局，无辛出干，此非从才，乃朱门饿莩。如辛出干，不见比劫，此从才格，反主富贵，亲戚提拔，妻贤内助。


    用水者，金妻水子。从才者，水妻木子。


    时日月年


    丁丙丁丙


    酉午酉子

    时日月年


    丁丙丁丙


    酉辰酉寅

    时日月年


    戊丙癸己


    子子酉卯

    '
- span_id: ss_qtbj_ed01_p0018_s03
  entry_title: 九月丙火
  text: '九月丙火，火气愈退，所忌土晦光火，必须先用甲木，次取壬水。甲壬两透，富贵非凡。若无壬水，得癸透干，亦可，虽不科甲，异路功名。壬癸藏支，贡监而已。甲藏壬透，无庚破甲，可许秀才。或庚戊困了水木，定是庸才。无甲壬癸者，下格。


    或一派火土，虽不太旺，亦自燥矣。如不离乡过继，亦主奔流，加以无庚辛壬癸出干，必为夭命。


    或支成火局，炎上失时，若运入南方，一贫彻骨。


    用甲者，水妻木子。用壬者，金妻水子。


    时日月年


    戊丙甲己


    子子戌亥

    时日月年


    戊丙戊丙


    戌午戌申

    时日月年


    壬丙壬戊


    辰寅戌戌

    '
- span_id: ss_qtbj_ed01_p0019_s01
  entry_title: 十月丙火
  text: '### 三冬丙火

    十月丙火，太阳失令，得见甲戊庚出干，可云科甲，主为人性好清高，斯文领袖。如辛透见辰，名化合逢时，主大贵。


    或壬多无甲，乃作弃命从杀，即不科甲，亦是宦僚。或壬多有甲无戊，却非从杀，宜用己土混壬。


    总之十月丙火，木旺宜庚，水旺宜戊，火旺用壬，随宜酌用可也。


    时日月年


    庚丙乙甲


    寅戌亥申

    时日月年


    戊丙辛壬


    子戌亥辰

    时日月年


    壬丙己辛


    辰子亥巳

    '
- span_id: ss_qtbj_ed01_p0019_s02
  entry_title: 十一月丙火
  text: '十一月丙火，冬至一阳生，弱中复强，壬水为最，戊土佐之。


    壬戊两透，科甲可许，无戊见己，异路功名。或无壬水，有癸出干得金滋无伤，又有丙透以解冻，可许衣衿。


    或一派壬，则耑用戊土，此人虽不成名，文章迈众，但名利虚浮。何也？因戊晦光，又须甲木为药也。或无壬水，癸亦可用，但不甚显。


    或四柱多壬无甲，乃作弃命从杀，亦有云路。


    或水多、有甲、无戊，却非从杀，宜用己土浊壬，十一月丙火，与十月颇同。


    时日月年


    庚丙庚辛


    寅寅子亥

    时日月年


    癸丙庚辛


    巳子子丑

    时日月年


    戊丙庚辛


    子戌子酉

    '
- span_id: ss_qtbj_ed01_p0019_s03
  entry_title: 十二月丙火
  text: '十二月丙火，气进二阳，侮雪欺霜，喜壬为用。己土司令，土多又不可少甲。壬甲两透，科甲堪宜，甲藏则秀才而已。或无甲得一壬透，富中取贵。


    如见一派己土，不见甲乙，名为假伤官，聪明性傲，名利虚浮。


    或一派癸水，得己出干，必自主创业。若制伏太过，又取辛金作用。得见癸透。此人即不成名，必清雅文墨士。


    时日月年


    癸丙己乙


    巳申丑巳

    时日月年


    庚丙己乙


    寅午丑丑


    时日月年


    壬丙乙癸


    辰午丑卯

    时日月年


    庚丙丁己


    寅寅丑丑

    时日月年


    乙丙己乙


    丑寅丑酉

