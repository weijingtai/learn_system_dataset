- span_id: ss_qtbj_ed01_p0024_s01
  entry_title: 三冬丁火
  text: '### 三冬丁火

    三冬丁火微寒，耑用庚甲。甲乃庚之良友。凡用甲木，庚不可少，无庚无甲，何能引丁？难云木火通明，冬丁有甲，不怕水多金多。可称上格。甲庚两透，科甲分明。见己则否。己多合甲，则为常人。


    或一丙夺丁，必赖支内水救。若有支金发水之源，官拜乌台有准。全无癸水制丙，无用之徒。或有金无水，贫寒之士。有水无金，又主清高。


    或时月二壬争合，取戊破之。有戊稍有富贵。无戊常人。设戊藏得所，不失衣衿。


    或二丙夺丁，得年干有癸，支下带合，金水得所，亦必显达，纳粟奏名，必验。


    时日月年


    辛丁癸癸


    亥亥亥亥

    时日月年


    庚丁丁乙


    戌未亥卯

    时日月年


    丁丁癸癸


    未丑亥丑

    时日月年


    癸丁丁庚


    卯卯亥戌

    '
- span_id: ss_qtbj_ed01_p0024_s02
  entry_title: 十一月丁火
  text: '十一月丁火，或仲冬水多癸旺，全无比印，此作弃命从杀，亦有异途功名。见丁比出干，难合格局，常人，且主骨肉浮云，六亲流水。戊出破癸，颇有兄弟妻儿。此格用戊，火妻土子。用甲、水妻木子。


    三冬丁火，甲木为尊，庚金佐之，癸戊权宜酌用可也。


    时日月年


    甲丁己庚


    辰酉丑午

    时日月年


    甲丁己戊


    辰未丑子

    时日月年


    乙丁癸壬


    巳巳丑辰

    时日月年


    甲丁辛辛


    辰卯丑卯

    '
- span_id: ss_qtbj_ed01_p0027_s01
  entry_title: 三春戊土
  text: '### 三春戊土

    三春戊土，无丙照暖，戊土不生，无甲疏噼，戊土不灵，无癸滋润，万物不长。正二月先丙后甲，癸又次之。三月先甲后丙，癸又次之，因戊土司权故也。有甲、丙、癸，三者齐透，必主一品当朝，或二透一藏，亦登金榜，二藏一透，也可异途。

    '
- span_id: ss_qtbj_ed01_p0027_s02
  entry_title: 正二月戊土
  text: '正二月即有甲癸，若无丙除寒，如万物生而不长，故无丙者，富贵艰辛。或有丙无甲癸者，名曰春旱，如万物生而多厄。无甲癸者，一生勤苦，劳而无功。或一派丙火，有甲欠癸，先泰后否。或支成火局，不见壬癸，僧道孤贫。癸透者贵。壬透者富。


    用水者，要审水之多少。或一派甲木，无丙者，常人。得一庚透方妙。或支成水局，甲又出干，又有庚透，富贵双全。


    或无庚金，又无比印，难作从杀，定主遭凶，不然，必为盗贼。若日下坐午，不得善终。


    或一派乙木，为官杀会党，即有庚透，却难制乙，此人内奸外直，口是心非。加一甲在内，无庚，必懒惰自甘，好食无厌。或丙多甲多，宜以癸庚参用。

    '
- span_id: ss_qtbj_ed01_p0027_s03
  entry_title: 三月戊土
  text: '三月戊土司令，不见丙甲癸者，愚而且贱。甲癸透者，科甲。丙癸透者、生员。甲癸俱藏者，只可云富，有癸异途。


    若丙多无癸，旱田无水，不能种苗，旧谷已没，新谷未登，此先富后贫之造。或火多有壬透者，先贫后富。癸透先贱后荣。壬藏不过食足，癸藏不过名传，即此亦须运美。或支成火局，得癸透者，富贵天然。壬透富贵辛苦，何也？癸乃天上甘霖，壬乃江河波浪，所以有劳逸之殊。


    支成木局，又甲乙出干，此名官杀会党，官杀无去留之义，得一庚透，扫除官杀，亦主富贵。无庚乃浅薄之人，宜用火洩木气。有一命、丁未、癸卯、戊寅、乙卯。癸丁透干，加以戊癸化火，将甲木暗焚，反得武科探花。


    或有比印，耑看癸透，取癸而成贵格。无癸、无火、无金，名为土木自战，主腹中疾病，忧愁艰苦。


    用甲者，水妻、木子。用丙者，木妻、火子。


    时日月年


    丙戊乙癸


    辰寅卯未

    时日月年


    壬戊乙癸


    子寅卯未

    时日月年


    壬戊癸辛


    子寅卯卯

    时日月年


    甲戊戊己


    寅寅辰未

    '
