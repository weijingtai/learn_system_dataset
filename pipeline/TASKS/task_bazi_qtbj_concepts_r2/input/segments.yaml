- span_id: ss_qtbj_ed01_p0021_s01
  entry_title: 正月丁火
  text: '### 三春丁火

    正月丁火，甲木当权，乃为母旺，非庚不能噼甲，何以引丁，姑用庚金。


    或一派甲木，无庚制之，非贫即夭。或只一甲木，多见乙木者，必离乡之客，焉问妻儿。或见甲乙，生庚子时，又主妻早子早，且可采芹。


    得壬化木，弱极复生，合此必主大贵，但此化合，反以不见庚破格为妙。


    或有庚金壬癸，得己土出干制之，此命不由科甲，亦有异途。


    或一派壬癸，不得寅时，又无庚金，必主穷困。


    或丁年、壬月、丁日、壬时，男主大贵；女则不宜。此格以土为妻、金为子。但子女艰难。女命合此，淫贱，刑夫剋子。


    或支火局，无滴水解，僧道之命。见甲出略可。总不可无水。水多亦不宜。


    时日月年


    壬丁戊庚


    寅未寅辰

    时日月年


    癸丁庚辛


    卯酉寅卯

    '
- span_id: ss_qtbj_ed01_p0021_s02
  entry_title: 二月丁火
  text: '二月丁火，溼乙伤丁，先庚后甲，非庚不能去乙，非甲不能引丁。庚甲两透，科甲定然。庚透甲藏，亦有生贡。甲透庚藏，异路功名。


    或庚乙俱透，庚必输情于乙，未免贪合，运行金水，一贫彻骨。或庚透乙藏，则不能贪合，乙反引丁，即用乙亦无害，运入木火之乡，自然富贵。用乙者，水妻木子。若尽是乙木，不见一甲，此人富贵不久，因贪致祸﹐弄巧反拙。且不能承受先人之业。


    或支成木局，有庚透、主清贵。不见庚者、常人。二月乙木司权，必须有庚，有乙无庚，主贫苦无依。用庚者、土妻金子。


    得印旺杀高，大富大贵。或一派水，无一戊制，主贫苦无依。或乙少癸多，有戊出制，反吉。用土者、火妻土子。


    时日月年


    丁丁乙戊


    未巳卯子

    时日月年


    庚丁癸丁


    子卯卯卯

    时日月年


    甲丁己庚


    辰丑卯辰

    '
- span_id: ss_qtbj_ed01_p0021_s03
  entry_title: 三月丁火
  text: '三月丁火，戊土司令，洩弱丁气，先用甲木引丁制土，次看庚金。庚甲两透，定主科甲。或一藏一透，终非白丁。


    或支成木局，取庚为先。得庚透，丁癸不透，亦有异路功名。


    或支成水局，加以壬透，名杀重身轻，必夭折天年。或遭凶死。或戊己两透，廊庙之客。若一甲破，定是常人。


    用甲者，水妻木子。用金者，土妻金子。

    '
- span_id: ss_qtbj_ed01_p0022_s01
  entry_title: 四月丁火
  text: '### 三夏丁火

    四月丁火乘旺，虽取甲引丁，必用庚噼甲。伐甲、方云木火通明。甲多、又取庚为先。但四柱忌见癸水。癸水一见，洩金、溼甲、伤丁，故以癸为病。或癸水藏支，壬水出干制丙，不夺丁光，自是雁塔题名，玉堂清贵。


    或有庚无甲，戊透天干，此为伤官生才，又取戊为用，必主富贵。戊土出干，不见甲乙，又不见水，是伤官伤尽。子平批八字清高，但不大贵，亦不大富。见水多木多，定是常人。


    或四柱多丙，不见壬癸，夺了丁光，此人贫苦。或丁年、巳月、丁巳日、丙午时，一丙不夺二丁，即不显达，亦名播四邻。故书曰：丁火阴柔一烛灯，太阳相见夺光明；柱中若见甲木透，定许身安福自临。


    时日月年


    乙丁己甲


    巳丑巳午

    时日月年


    乙丁癸辛


    巳巳巳酉

    '
- span_id: ss_qtbj_ed01_p0022_s02
  entry_title: 五月丁火
  text: '五月丁火，时归建禄，不宜乱用甲木。


    遇年透隔位之壬，不贪丁合者，忠而且厚。或支成火局，干见火出，得庚壬两透者，科甲定然。土透制壬，常人。即壬藏支中，亦非白丁，但要运行西北，方可发达。得一癸透，名独杀当权，出人头地。


    若见寅辰亥卯字，化木生火，平常人物，丰衣足食，中年富，但刑子息，劳而无功。或丙午月、丁未日、辛亥时，亥中有壬制丙，不致贫苦。若丙午时，则滴水难救炎火，必主僧道。若年支见子，虽不科甲，亦有衣衿。


    若干支无火局，有水透干，须用甲木，又要庚噼甲方明。木火通明，主大富贵。或木少火多，焚其木性，不能光透九霄，荣华不久。


    或生月是禄，支皆生旺合局，加以火出，无滴水解炎，乃身旺无依，孤贫之格。女必为尼。即运北地，反主凶危。


    用壬者，金妻水子。用甲者，水妻木子。


    时日月年


    戊丁壬庚


    申亥午午

    时日月年


    甲丁甲辛


    辰未午巳


    时日月年


    甲丁戊癸


    辰丑午卯

    时日月年


    乙丁甲丙


    巳丑午寅

    时日月年


    癸丁甲丙


    卯酉午子

    '
- span_id: ss_qtbj_ed01_p0022_s03
  entry_title: 六月丁火
  text: '六月之丁，阴柔退气，但值三伏生寒，丁弱极矣，专取甲木，壬水次之。


    若得甲出天干，支成木局，见亥中之壬，为木神有根，接引丁火，必然科甲。即不见木局，支见壬水，虽不大贵，亦有凌云之气，无庚不妙。


    或支成水局，见水透干，则溼木性，不能引丁，必为平人，有甲透、亦有才干。有庚透、方无刑伤。若无甲木，假名假利，虽能生财，固执懦夫。


    或年月日时，皆一派丁未之类，此为纯阴，终无大用。


    用甲者，水妻木子。


    时日月年


    丙丁丁丁


    午未未卯

    时日月年


    丁丁丁壬


    未巳未子

    '
- span_id: ss_qtbj_ed01_p0023_s01
  entry_title: 三秋丁火
  text: '### 三秋丁火

    三秋丁火，退气柔弱，耑用甲木，金虽乘旺司权，无伤丁之理，仍取庚噼甲，为引火之物，或借丙暖金晒木，不虑丙夺丁火。凡两丙夹丁者，夏月忌之，余月不忌淤。但此格少年困苦刑剋，中年富贵，必要地支见水制丙、方妙。


    三秋甲庚丙并用，仍分优劣，何也？七月甲丙，申中有庚，八月甲丙庚皆用，七八月或无甲木，乙亦可用，为枯草引灯，却不离丙晒也。九月耑用甲庚。大扺甲不离庚，乙不离丙，其理极明。或见甲庚丙皆透，必主科甲。无甲用乙者，富贵皆小，且富而不贵者多。


    或一重壬水，又多见癸水，必以戊土为制，自然富贵光辉。


    或一派庚金，名财多身弱，主富屋贫人，妻多主事。或壬多洩庚，丁壬化杀，反成富贵。若庚多无壬，奔流下贱。


    时日月年


    戊丁丙辛


    申丑申亥

    时日月年


    戊丁丙辛


    申卯申亥

    时日月年


    丙丁丙辛


    午酉申卯

    时日月年


    丙丁甲庚


    午未申辰

    '
- span_id: ss_qtbj_ed01_p0023_s02
  entry_title: 七月丁火
  text: '七月丁火，退气柔弱，端用甲木，金虽乘旺司权，无伤丁之理，仍取庚劈甲，为引火之物，或借丙暖金晒甲，不虑丙夺丁光，凡两丙夹丁者，夏月忌之，余月不忌，但此格少年困苦刑克中年富贵，必要地支见水制丙，方妙。


    或八月一派辛金，不见庚金，又无比劫，此弃命从财，富而且贵，虽不科甲，亦有异途。从财者水为妻。不剋。有偏正。木为子。不刑。


    或九月一派戊土，洩丁火之气，不见甲木，为伤官伤尽，非寻常可比。或甲木透出，为文书清贵，秋闱可夺。用甲者，庚不可少。水妻木子。


    时日月年


    庚丁己壬


    戌亥酉午

    时日月年


