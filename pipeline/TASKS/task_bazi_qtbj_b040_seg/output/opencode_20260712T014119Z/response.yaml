- seg_id: s01
  entry_title: 三秋癸水
  path: 十干分论 / 论癸水 / 三秋癸水
  text: '### 三秋癸水

    七月癸水，正母旺子相之时，癸虽死申，殊不知申中有庚生之，名死处逢生，弱中复强，即运行西北，亦不死也。但庚司令刚锐极矣，必取丁火为用。或丁透有甲，名有燄之火，必主科甲。或丁透无甲，又无壬癸，即有一二庚金，亦有生监。有二丁更妙。或金多乏丁制者，贫困之人。


    或一丁坐午，名独才格，主金玉满堂，富中取贵。若在未戌，则是常人。或柱见二戌二未，又得丙丁藏支，干见甲出、无水，亦作富贵而推。


    时日月年


    甲癸戊丁


    寅卯申酉

    时日月年


    乙癸庚戊


    卯未申午

    时日月年


    辛癸丙辛


    酉酉申酉'
  note: 论三秋癸水
  case_candidate: true
- seg_id: s02
  entry_title: 八月
  path: 十干分论 / 论癸水 / 三秋癸水 / 八月
  text: 八月癸水，辛金虚灵，非顽金可比，正金白水清，故取辛金为用，丙火佐之。名水暖金温。如丙与辛隔位同透，主科甲功名。或丙透辛藏，一榜之士。或土多水，生意中人。
  note: 论八月
  case_candidate: false
- seg_id: s03
  entry_title: 八月
  path: 十干分论 / 论癸水 / 三秋癸水 / 八月
  text: '八月癸水，丙辛皆用。


    时日月年


    丙癸乙庚


    辰亥酉寅

    时日月年


    癸癸丁辛


    亥巳酉酉'
  note: 论八月
  case_candidate: true
- seg_id: s04
  entry_title: 九月
  path: 十干分论 / 论癸水 / 三秋癸水 / 九月
  text: 九月癸水，失令无根，戊土司权，剋制太过，专用辛金发水之源，要比肩滋甲制戊方妙。或辛甲两透，支见子癸，定主平步青云，或癸甲两透，富贵成名。或有甲辛无癸者，亦有恩封。或有甲癸无辛者，富大贵小。有甲无癸辛者，常人。二者俱无，贫贱之格。或有甲见壬者，颇许衣衿。
  note: 论九月
  case_candidate: false
- seg_id: s05
  entry_title: 九月
  path: 十干分论 / 论癸水 / 三秋癸水 / 九月
  text: '九月癸水，辛甲并用。


    时日月年


    甲癸丙癸


    寅卯戌亥

    时日月年


    癸癸庚壬


    亥丑戌辰'
  note: 论九月
