- seg_id: s01
  entry_title: 三冬庚金
  path: 十干分论 / 论庚金 / 三冬庚金
  text: '### 三冬庚金

    十月庚金，水冷性寒，非丁莫造，非丙不暖。丁甲两透，支无水局，一榜有之。支藏丙火，桃浪之仙。支见亥子，得己出制，亦有功名。


    若见丙透无丁者，决无显达。丁藏甲透，武职之人。以上不合者，庸俗。


    如金水混杂，全无丙丁者，鄙夫。支成金局，无火者，僧道之命也。书曰：水冷金寒爱丙丁。


    时日月年


    壬庚辛丁


    午子亥亥

    时日月年


    丙庚辛壬


    子辰亥辰'
  note: 十月庚金，水冷性寒，非丁莫造，非丙不暖。丁甲两透，支无水局，一榜有之。支藏丙火，桃浪之仙。支见亥子，得己出制，亦有功名。
