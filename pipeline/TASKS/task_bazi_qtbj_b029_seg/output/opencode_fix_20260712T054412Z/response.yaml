- seg_id: s02
  entry_title: 十一月庚金
  path: 十干分论 / 论庚金 / 三冬庚金 / 十一月
  text: '十一月庚金，天气严寒，仍取丁甲，次取丙火照暖。或丁甲两透，丙在支中，必主科甲。即无丙火，亦有衣衿。有丁无甲，亦可富中取贵。有甲无丁，只作常人。或丙透丁藏，异途名望。丁藏有甲，武学可许。


    或重重丙火，可许一富，但不清高。丙戊生寅，或丙坐支寅，有一二者，富真贵假。若见癸透。一介寒儒。


    或支成水局，二见丙丁者，此乃伤官格，为人清雅，衣禄常盈，但子息艰难耳。


    或丙丁太多，名官杀混杂最无良。又怕身轻有损伤。如遇东南二运地，焉能挨得过时光。过于清冷，似有凄凉。柱中一派金水，不入火土之乡，主一生孤贫浪荡，难望有成也。


    时日月年


    庚庚壬壬


    辰申子子

    时日月年


    癸庚庚辛


    未辰子亥

    时日月年


    戊庚戊乙


    寅寅子卯'
  note: 十一月庚金，天气严寒，仍取丁甲，次取丙火照暖。或丁甲两透，丙在支中，必主科甲。即无丙火，亦有衣衿。有丁无甲，亦可富中取贵
  case_candidate: true
- seg_id: s03
  entry_title: 十二月庚金
  path: 十干分论 / 论庚金 / 三冬庚金 / 十二月
  text: '十二月庚金，寒气太重，且多湿泥，愈寒愈冻，先取丙火解冻，次取丁火炼金，甲亦不可少。


    丙丁甲透者，即不科甲，亦有思荣。有丙无丁甲者，富中取贵。有丁甲无丙者，特达才人。有丙丁无甲者，白手成家，刀笔亨通，乏金更美。或支成金局无火，僧道之流。


    时日月年


    癸庚己庚


    未戌丑辰


    女命

    时日月年


    甲庚丁己


    申子丑巳'
  note: 十二月庚金，寒气太重，且多湿泥，愈寒愈冻，先取丙火解冻，次取丁火炼金，甲亦不可少。
  case_candidate: true
