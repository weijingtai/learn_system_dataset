    entry_title: 三春甲木
    path: 十干分论 / 论甲木 / 三春甲木 / 总论
    text: |
      ### 三春甲木
      春月之木，渐有生长之象。初春犹有余寒，当以火温暖，则有舒畅之美，水多变剋，有损精神。重见生旺，必用庚金斲凿，可成楝梁。春末阳壮水渴，藉水资扶，则花繁叶茂。初春无火，增之以水，则阴浓气弱，根损枝枯，不能华秀。春末失水，增之以火，则阳气太盛，燥渴相加，枝枯叶干，亦不华秀。是以水火二物，要得时相济为美。
    note: 总论三春甲木之性：初春喜火、春末喜水，水火须及时相济
    case_candidate: false

  - seg_id: s02
    entry_title: 正月甲木
    path: 十干分论 / 论甲木 / 三春甲木 / 正月
    text: |
      正月甲木，初春尚有余寒，得丙癸逢，富贵双全。癸藏丙透，名寒木向阳，主大富贵。倘风水不及，亦不失儒林俊秀。如无丙癸，平常人也。
    note: 论正月甲木需丙癸配合，癸藏丙透为寒木向阳，主富贵
    case_candidate: false

  - seg_id: s03
    entry_title: 正二月甲木
    path: 十干分论 / 论甲木 / 三春甲木 / 正二月
    text: |
      正二月甲木，素无取从才从杀从化之理。或一派庚辛，主一生劳苦，剋子刑妻，再支会金局，非贫即夭。如无丙丁，一派壬癸，又无戊己制之，名水泛木浮，死无棺椁。如一派戊己，支会金局，为财多身弱，富屋贫人，终生劳苦，妻晚子迟。或无庚金，有丁透，亦属文星，为木火通明之象，又名伤官生财格，主聪明雅秀。一见癸水伤丁，但作厚道迂儒。或柱中多癸，滋助木神，伤灭丁火，其人奸雄枭险，曹操之徒，言清行浊，笑里藏刀。

      若庚申、戊寅、甲寅、丙寅。一行金水运，发进士。或甲午日庚午时，此人必贵。但要好运相催，不宜制了庚丁。

      或支成金局，多透庚辛，此又不吉，号曰木被金伤，若无丙丁破金，必主残疾。或支成火局，洩露太过，定主愚懦，常有啾唧灾病缠身，终有暗疾。支成木局，得庚为贵，无庚必凶，若非僧道，男主鳏孤，女主寡独。支成水局，戊透为贵，如无戊制，不但贫贱，且死无棺木。故书曰：甲木若无根，全赖申子辰，干得才杀透，平步上青云。

      凡三春甲木，用庚者，土为妻，金为子。用丁者，木为妻，火为子。

      总之正二月甲木，有庚戊者上命。如有丁透，大富大贵之命也。
    note: 论正二月甲木总体取用，含木火通明、水泛木浮、财多身弱等格局变例，附命造举例与四支方向局变格
    case_candidate: true

  - seg_id: s04
    entry_title: 二月甲木
    path: 十干分论 / 论甲木 / 三春甲木 / 二月
    text: |
      二月甲木，庚金得所，名阳刃驾杀，可云小贵，异途显达，或主武职，但要财资之。柱中逢才，英雄独压万人。若见癸水，困了才杀，主为光棍，重刃必定遭凶。性情凶暴。书曰：木旺宜火之光辉，秋闱可试。木向春生，处世安然有寿。日主无依，却喜运行才地。
    note: 论二月甲木阳刃驾杀格，喜财资、忌癸水困才杀
    case_candidate: false

  - seg_id: s05
    entry_title: 三月甲木
    path: 十干分论 / 论甲木 / 三春甲木 / 三月
    text: |
      三月甲木，木气相竭。先取庚金，次用壬水。庚壬两透，一榜堪图。但要运用相生，风水阴德，方许富贵。

      或见一二庚金，独取壬水。壬透清秀之人，才学必富。

      或天干透出二丙，庚藏支下，此钝斧无钢，富贵难求。若有壬癸破火，堪作秀才。

      或柱中全无一水，戊己透干，支成土局，又作弃命从才，因人而致富贵，妻子有能。

      或见戊己，及比劫多者，名为杂气夺才，此人劳碌到老，无驭内之权。女命合此，女掌男权，贤能内助，若比劫重见，淫恶不堪。

      或支成金局，方可用丁，不然，三月无用丁之法。惟有先庚后壬取用。

      书曰：甲乙生寅卯，庚辛干上逢，离南推富贵，坎地却为凶。
    note: 论三月甲木先庚后壬取用，含从才、杂气夺才、支成金局用丁等诸格变法
    case_candidate: false
