- seg_id: s01
  entry_title: 七月丙火
  path: 十干分论 / 论丙火 / 三秋丙火 / 七月
  text: '### 三秋丙火

    七月丙火，太阳转西，阳气衰矣。日近西山，见土皆晦，惟日照湖海，暮夜光天，故仍用壬水，辅映光辉。


    如壬多，取戊制方妙。有壬透干，又见戊土出干，可云科甲。如戊藏支内，不过生员。多壬无戊，平常人也。或戊多壬少，亦属常人。或多壬，一戊出制，所谓众杀猖狂，一仁可化，必主显达，有权职。


    一派辛金，又为弃命从才，奇特之造，虽不科甲，亦得恩荣，但多依亲戚而为进身之阶。从才者以水妻木子。


    时日月年


    壬丙戊壬


    辰申申戌

    时日月年


    庚丙甲乙


    寅申申未

    '
  note: 论七月丙火阳气衰仍用壬水辅映，壬多用戊制为众杀猖狂一仁可化，含弃命从才格，附两则命造
  case_candidate: true
- seg_id: s02
  entry_title: 八月丙火
  path: 十干分论 / 论丙火 / 三秋丙火 / 八月
  text: '八月丙火，日近黄昏，丙火之余光，存于光湖，仍用壬水辅映。


    四柱多丙，一壬高透为奇，定主登科及第。富贵双全。一壬藏支，亦主秀才。或戊多困水则假作斯文。若无壬水，癸亦可用，但功名不久。


    或见辛透，不能从化，贫苦到老。或见一丁制辛，为人奸诈，不识高低。女命合此，长舌淫贱。


    或成金局，无辛出干，此非从才，乃朱门饿莩。如辛出干，不见比劫，此从才格，反主富贵，亲戚提拔，妻贤内助。


    用水者，金妻水子。从才者，水妻木子。


    时日月年


    丁丙丁丙


    酉午酉子

    时日月年


    丁丙丁丙


    酉辰酉寅

    时日月年


    戊丙癸己


    子子酉卯

    '
  note: 论八月丙火日近黄昏仍用壬辅映，一壬高透为奇，含从才格变例，附三则命造
  case_candidate: true
- seg_id: s03
  entry_title: 九月丙火
  path: 十干分论 / 论丙火 / 三秋丙火 / 九月
  text: '九月丙火，火气愈退，所忌土晦光火，必须先用甲木，次取壬水。甲壬两透，富贵非凡。若无壬水，得癸透干，亦可，虽不科甲，异路功名。壬癸藏支，贡监而已。甲藏壬透，无庚破甲，可许秀才。或庚戊困了水木，定是庸才。无甲壬癸者，下格。


    或一派火土，虽不太旺，亦自燥矣。如不离乡过继，亦主奔流，加以无庚辛壬癸出干，必为夭命。


    或支成火局，炎上失时，若运入南方，一贫彻骨。


    用甲者，水妻木子。用壬者，金妻水子。


    时日月年


    戊丙甲己


    子子戌亥

    时日月年


    戊丙戊丙


    戌午戌申

    时日月年


    壬丙壬戊


    辰寅戌戌

    '
  note: 论九月丙火火退忌土晦光，先甲后壬，甲壬两透富贵，含炎上失时变例，附三则命造
  case_candidate: true
