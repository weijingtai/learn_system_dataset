- proposition: 甲年生人，甲以辛为官、辛之化禄为气，气即天官；以庚为七煞、庚之化禄为水，水即七煞；以丁为伤官、丁之化禄为金，金即伤官；以丙为食神、丙之化禄为木，木即食神；以己为正财、己之化禄为月，月即正财；以戊为偏财、戊之化禄为土，土即偏财；以壬为偏印、壬之化禄为计，计即偏印；以癸为正印、癸之化禄为罗，罗即正印；以乙为劫财、乙之化禄为孛，孛即劫财；甲之化禄为火，火即元禄。
