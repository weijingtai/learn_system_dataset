- span_id: ss_qianyuan_ed01_o0010259
  sequence: 420
  start_offset: 9705
  end_offset: 9723
  text: 与财曜有关，财曜又不得气，屡屡空乏。
  quote_sha256: d0dc0fed299daf91dd5ca1fa00b08fdda6e9cc589f6ef7037c6bcee7763db71c
  evidence_level: offset_level
  source_anchor:
