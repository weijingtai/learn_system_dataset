- span_id: ss_qianyuan_ed01_o0004492
  sequence: 201
  start_offset: 3938
  end_offset: 3951
  text: 果老云：「与元禄相催 克。
  quote_sha256: 41069e3d67f830a495f61414a91e93fd013f4923afb0d5fabeddb60368f70c3c
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 4492
    raw_end: 4505
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 3938
    end_offset: 3951
    quote_sha256: 41069e3d67f830a495f61414a91e93fd013f4923afb0d5fabeddb60368f70c3c
- span_id: ss_qianyuan_ed01_o0004505
  sequence: 202
  start_offset: 3951
  end_offset: 3980
  text: 」夫与元禄相催，谓之催官可也，与元禄相克亦谓之催官，何欤？
  quote_sha256: 35993d77b44deaea5fd4f377205fc1d038a2da1b543d53ebb956d6c455bd8392
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 4505
    raw_end: 4534
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 3951
    end_offset: 3980
    quote_sha256: 35993d77b44deaea5fd4f377205fc1d038a2da1b543d53ebb956d6c455bd8392
- span_id: ss_qianyuan_ed01_o0004534
  sequence: 203
  start_offset: 3980
  end_offset: 3993
  text: 用之则顾此失彼，殊为紊乱。
  quote_sha256: db24c74179f04d1e1ff9e6bfb783c69f0f4acc069bf70e37f301f4ac4a2a3a99
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 4534
    raw_end: 4547
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 3980
    end_offset: 3993
    quote_sha256: db24c74179f04d1e1ff9e6bfb783c69f0f4acc069bf70e37f301f4ac4a2a3a99
- span_id: ss_qianyuan_ed01_o0004547
  sequence: 204
  start_offset: 3993
  end_offset: 4041
  text: "科甲既不问其于年干何如，又不问其于官魁科文何如，而直以对宫主星当之，更属矫诬，均不可从。   \n"
  quote_sha256: 752fae399b3b9e65883247300b6e38ec646c194f2be3252f3e144787f35d1162
  evidence_level: offset_level
  source_anchor:
