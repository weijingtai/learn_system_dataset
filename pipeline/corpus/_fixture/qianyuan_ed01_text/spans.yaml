- span_id: ss_qianyuan_ed01_o0010443
  sequence: 429
  start_offset: 9889
  end_offset: 9925
  text: 况煞忌党，其刚凶多验，于刃兼之，气尽则身尽，官竭则命竭，危亦恒不在难也；
  quote_sha256: 8367a8df7c57cad2201305e56c925f933ff438042036dc369188a41068c874e6
