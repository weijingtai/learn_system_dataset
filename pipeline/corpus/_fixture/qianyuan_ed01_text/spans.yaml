- span_id: ss_qianyuan_ed01_o0010335
  sequence: 423
  start_offset: 9781
  end_offset: 9792
  text: '    元禄即天禄也。'
  quote_sha256: 96a22a3fef7c1791a3ce4ff0e7bac9549a5ec757783c49f18ed124d7a3b00201
  evidence_level: offset_level
  source_anchor:
