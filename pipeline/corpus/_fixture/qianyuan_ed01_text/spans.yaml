    raw_end: 12050
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11479
    end_offset: 11496
    quote_sha256: 97ee8350d55713ddb387c1a99bc5ebcba49a21fe107e173ea782705b8a35b8ce
