  sequence: 502
  start_offset: 11572
  end_offset: 11590
  text: 而气即寓乎其内，形可见而气不可见也。
  quote_sha256: 94826d2b2e389e0a17637e86c2fe87011d1f6c988fe159a1838dda09f7dae548
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12126
    raw_end: 12144
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11572
    end_offset: 11590
    quote_sha256: 94826d2b2e389e0a17637e86c2fe87011d1f6c988fe159a1838dda09f7dae548
- span_id: ss_qianyuan_ed01_o0012144
  sequence: 503
  start_offset: 11590
  end_offset: 11634
  text: 然可见者必有不可见者以为之宰，以故形气交孚，天星与人命妙合，形气自相流通，吉凶了如指掌。
  quote_sha256: db504066b5c551dea25f4746ae812174d4da544764a02d2fd8a0ef669fd9253e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12144
    raw_end: 12188
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11590
    end_offset: 11634
    quote_sha256: db504066b5c551dea25f4746ae812174d4da544764a02d2fd8a0ef669fd9253e
- span_id: ss_qianyuan_ed01_o0012188
  sequence: 504
  start_offset: 11634
  end_offset: 11660
  text: 有形吉而气凶者，有形凶而气吉者，均不可泥形而遗气焉。
  quote_sha256: 415b1a0061f363c8675675052ba99ed7d40e33b1a42c98a85c7315fbd0a372b4
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12188
    raw_end: 12214
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11634
    end_offset: 11660
    quote_sha256: 415b1a0061f363c8675675052ba99ed7d40e33b1a42c98a85c7315fbd0a372b4
- span_id: ss_qianyuan_ed01_o0012214
  sequence: 505
  start_offset: 11660
  end_offset: 11702
  text: 试思最近大圜者莫如恒星，次之土、次之木、次之火、次之太阳、次之金、次之水，最卑为月。
  quote_sha256: 6bd72bbe0f84c6a0bba5e24b6e75c1107f15383295c91123e60de741aa2ca356
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12214
    raw_end: 12256
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11660
    end_offset: 11702
    quote_sha256: 6bd72bbe0f84c6a0bba5e24b6e75c1107f15383295c91123e60de741aa2ca356
- span_id: ss_qianyuan_ed01_o0012256
  sequence: 506
  start_offset: 11702
  end_offset: 11735
  text: 以形而论，则高下之距实大悬殊，向非有气以主之，何以各系于天而不坠？
  quote_sha256: faf8817364ffd522c44b0c33364b3e4bc4186a701bcc5036d9fcd3274314d0ce
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12256
    raw_end: 12289
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11702
    end_offset: 11735
    quote_sha256: faf8817364ffd522c44b0c33364b3e4bc4186a701bcc5036d9fcd3274314d0ce
- span_id: ss_qianyuan_ed01_o0012289
  sequence: 507
  start_offset: 11735
  end_offset: 11751
  text: 又何以天道左旋而诸曜皆能右转也？
  quote_sha256: 14fffee9d66196123a00388126c9141d65d601bbda78d1210dfba1ac5b4e3f01
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12289
    raw_end: 12305
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11735
    end_offset: 11751
    quote_sha256: 14fffee9d66196123a00388126c9141d65d601bbda78d1210dfba1ac5b4e3f01
- span_id: ss_qianyuan_ed01_o0012305
  sequence: 508
  start_offset: 11751
  end_offset: 11768
  text: 以是知气虽渺冥恍惚，实则周浃旁皇。
  quote_sha256: 8bf5f36073b093d83bc2d3b8f3afe247343eda298542f34951f084e4502fc447
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12305
    raw_end: 12322
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11751
    end_offset: 11768
    quote_sha256: 8bf5f36073b093d83bc2d3b8f3afe247343eda298542f34951f084e4502fc447
- span_id: ss_qianyuan_ed01_o0012322
  sequence: 509
  start_offset: 11768
  end_offset: 11794
  text: 人受阴阳五行以生，亦何时何刻不与十一曜默默相融贯乎？
  quote_sha256: 2e0e6eaed319f25d155b517d6936b2e7b08fdf4d2b5b47ae99f2a1b4824657d0
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12322
    raw_end: 12348
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11768
    end_offset: 11794
    quote_sha256: 2e0e6eaed319f25d155b517d6936b2e7b08fdf4d2b5b47ae99f2a1b4824657d0
- span_id: ss_qianyuan_ed01_o0012348
  sequence: 510
  start_offset: 11794
  end_offset: 11820
  text: 耶律楚材云：「各星俱合格，限度无贵气所属，终难大伸；
  quote_sha256: a8e0211f0fb5db656bfd5d8ec1bd76784375e030ffdeedd0582ac76f7c9c6148
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12348
    raw_end: 12374
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11794
    end_offset: 11820
    quote_sha256: a8e0211f0fb5db656bfd5d8ec1bd76784375e030ffdeedd0582ac76f7c9c6148
- span_id: ss_qianyuan_ed01_o0012374
  sequence: 511
  start_offset: 11820
  end_offset: 11839
  text: 各星俱陷落，限度非戾气所归，何至大屈？
  quote_sha256: b800523355bface3205ad8528a0b58aea0b0389dea2018dbc6b014f4383ff25a
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12374
    raw_end: 12393
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11820
    end_offset: 11839
    quote_sha256: b800523355bface3205ad8528a0b58aea0b0389dea2018dbc6b014f4383ff25a
- span_id: ss_qianyuan_ed01_o0012393
  sequence: 512
  start_offset: 11839
  end_offset: 11857
  text: 即有此限度，太岁尚不钓，亦将从缓。
  quote_sha256: eba02c94d541f5b8236408f8a7bf58c5d7a7bff30c1b47eef1e1aa87d88ba2a1
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12393
    raw_end: 12411
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11839
    end_offset: 11857
    quote_sha256: eba02c94d541f5b8236408f8a7bf58c5d7a7bff30c1b47eef1e1aa87d88ba2a1
- span_id: ss_qianyuan_ed01_o0012411
  sequence: 513
  start_offset: 11857
  end_offset: 11867
  text: 」是诚识气之奥窔也。
  quote_sha256: 8dbda3b6b84068dc851ae024520334d1f08b527a7ffc8888e072e4594b8b9bd2
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12411
    raw_end: 12421
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11857
    end_offset: 11867
    quote_sha256: 8dbda3b6b84068dc851ae024520334d1f08b527a7ffc8888e072e4594b8b9bd2
- span_id: ss_qianyuan_ed01_o0012421
  sequence: 514
  start_offset: 11867
  end_offset: 11889
  text: 善观命者不视形而审气，气有清浊，则命分贵贱；
  quote_sha256: 841187be5e8275c4ee8519571480481fdf42477f63771151cb5c61dbd8c29644
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12421
    raw_end: 12443
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11867
    end_offset: 11889
    quote_sha256: 841187be5e8275c4ee8519571480481fdf42477f63771151cb5c61dbd8c29644
- span_id: ss_qianyuan_ed01_o0012443
  sequence: 515
  start_offset: 11889
  end_offset: 11900
  text: 气有明暗，则命分穷达；
  quote_sha256: 6b299b696c5175520093add9c951346d318678002bc1594e7c383fa16aaf46b0
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12443
    raw_end: 12454
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11889
    end_offset: 11900
    quote_sha256: 6b299b696c5175520093add9c951346d318678002bc1594e7c383fa16aaf46b0
- span_id: ss_qianyuan_ed01_o0012454
  sequence: 516
  start_offset: 11900
  end_offset: 11911
  text: 气有厚薄，则命分大小；
  quote_sha256: 7c1e5c6a603bd31cd478073f714797e4ff47847b596f5d2ea4ca03f907adc237
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12454
    raw_end: 12465
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11900
    end_offset: 11911
    quote_sha256: 7c1e5c6a603bd31cd478073f714797e4ff47847b596f5d2ea4ca03f907adc237
- span_id: ss_qianyuan_ed01_o0012465
  sequence: 517
  start_offset: 11911
  end_offset: 11922
  text: 气有顺逆，则命分夷险；
  quote_sha256: ed807f20758bf543615a3371acb9e954ecbf1633e4f502ab319d4160cfe9b0c7
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12465
    raw_end: 12476
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11911
    end_offset: 11922
    quote_sha256: ed807f20758bf543615a3371acb9e954ecbf1633e4f502ab319d4160cfe9b0c7
- span_id: ss_qianyuan_ed01_o0012476
  sequence: 518
  start_offset: 11922
  end_offset: 11933
  text: 气有善恶，则命分贤奸；
  quote_sha256: ef1d88f84ed9100ad2ddf8797a529e3cf55c5ee4257480f6774aca67040e1d8f
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12476
    raw_end: 12487
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11922
    end_offset: 11933
    quote_sha256: ef1d88f84ed9100ad2ddf8797a529e3cf55c5ee4257480f6774aca67040e1d8f
- span_id: ss_qianyuan_ed01_o0012487
  sequence: 519
  start_offset: 11933
  end_offset: 11944
  text: 气有促舒，则命分寿夭。
  quote_sha256: 96d117778d45482267aec8006bc70d17a03585b99a473d1205f5d0911416fba7
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12487
    raw_end: 12498
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11933
    end_offset: 11944
    quote_sha256: 96d117778d45482267aec8006bc70d17a03585b99a473d1205f5d0911416fba7
- span_id: ss_qianyuan_ed01_o0012498
  sequence: 520
  start_offset: 11944
  end_offset: 11978
  text: 若徒以形而已，则四余拦月、五曜环阳，为格中之最巨者，岂皆人人富贵乎？
  quote_sha256: a63930260522aa19a83c02ed5387657de421e4fd26cd77d2fcc26d30e77c1ab3
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12498
    raw_end: 12532
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11944
    end_offset: 11978
    quote_sha256: a63930260522aa19a83c02ed5387657de421e4fd26cd77d2fcc26d30e77c1ab3
- span_id: ss_qianyuan_ed01_o0012532
  sequence: 521
  start_offset: 11978
  end_offset: 12091
  text: 试举一二以例其余：一康熙庚申甲申癸卯癸亥生人，月在子之虚，孛在卯之氐，气在酉之胃，计在戌之室，罗在辰之翼，是四余拦月矣，木在申之毕，火在未之井五，土在未之井十
    六，金在午之柳四，日在午之柳十一，水在巳之张，是五曜顺生而环阳矣。
  quote_sha256: 8fa3e4e8614f75bdd7e1ba912285143d0715e159820eb4d86fc22663ad60f0d3
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12532
    raw_end: 12645
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11978
    end_offset: 12091
    quote_sha256: 8fa3e4e8614f75bdd7e1ba912285143d0715e159820eb4d86fc22663ad60f0d3
- span_id: ss_qianyuan_ed01_o0012645
  sequence: 522
  start_offset: 12091
  end_offset: 12154
  text: 木为文为煞，火为偏财，土为偏印，金为天官科名，水为魁为元禄，金水贵气所归，作阳引从，又递生至金水而住，若金水作命主，岂不大显？
  quote_sha256: ca75032d5d3996ea466660808a9bd86720ecd0feaaeb511dec7b47a57763c150
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12645
    raw_end: 12708
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12091
    end_offset: 12154
    quote_sha256: ca75032d5d3996ea466660808a9bd86720ecd0feaaeb511dec7b47a57763c150
- span_id: ss_qianyuan_ed01_o0012708
  sequence: 523
  start_offset: 12154
  end_offset: 12222
  text: 彼立命于戌，以火为命主，甚远于阳，仅受文木之生又带煞气，故于斗木文度内乡荐，厥后屡膺保题而不用，用亦仅以教职，譬之地脉乃过龙，非结穴也。
  quote_sha256: 826e88dfe07f222b1bd2e944442073abeeeda55c7035747a56dd5625da564e93
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12708
    raw_end: 12776
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12154
    end_offset: 12222
    quote_sha256: 826e88dfe07f222b1bd2e944442073abeeeda55c7035747a56dd5625da564e93
- span_id: ss_qianyuan_ed01_o0012776
  sequence: 524
  start_offset: 12222
  end_offset: 12276
  text: 一康熙辛卯庚子壬辰壬寅生人，月在亥之危，孛在申之昴，气在申之觜，罗在丑之斗十八，计在未之井，是四余拦月 矣。
  quote_sha256: bcbd0f5151d886ecc866cc760190ad9812de028783cb6f2df302bfeb7a9f06b1
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12776
    raw_end: 12830
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12222
    end_offset: 12276
    quote_sha256: bcbd0f5151d886ecc866cc760190ad9812de028783cb6f2df302bfeb7a9f06b1
- span_id: ss_qianyuan_ed01_o0012830
  sequence: 525
  start_offset: 12276
  end_offset: 12328
  text: 土在午之柳，金在卯之氐，水在寅之尾十五，木在丑之斗三，火在丑之斗四，日在寅之尾十一，是五曜顺生而环阳矣。
  quote_sha256: eb45095c47027a27a1ce90f0dcb3bf4e8a2d939aced43c0af1402a275f5eb510
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12830
    raw_end: 12882
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12276
    end_offset: 12328
    quote_sha256: eb45095c47027a27a1ce90f0dcb3bf4e8a2d939aced43c0af1402a275f5eb510
- span_id: ss_qianyuan_ed01_o0012882
  sequence: 526
  start_offset: 12328
  end_offset: 12398
  text: 土为正印，金为科名七煞，水为劫财，木为天官，火为正财，递生至火而住，立命于卯，以火为命主，火独受天官之生，而阳又在火躔，正如地脉结穴之所也。
  quote_sha256: 7174f750c1ca39ff85e4a5df00c52bc1313a9d15993b3313ccc4a56e31d600d3
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12882
    raw_end: 12952
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12328
    end_offset: 12398
    quote_sha256: 7174f750c1ca39ff85e4a5df00c52bc1313a9d15993b3313ccc4a56e31d600d3
- span_id: ss_qianyuan_ed01_o0012952
  sequence: 527
  start_offset: 12398
  end_offset: 12419
  text: 木属铨部，行至翼火，不满三十岁，遂作少宰。
  quote_sha256: da31e96edf384fe919e01622abf4c3fa26c4c52ae3205d0adb5c6854018ee3e9
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12952
    raw_end: 12973
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12398
    end_offset: 12419
    quote_sha256: da31e96edf384fe919e01622abf4c3fa26c4c52ae3205d0adb5c6854018ee3e9
- span_id: ss_qianyuan_ed01_o0012973
  sequence: 528
  start_offset: 12419
  end_offset: 12457
  text: "合此二命观之，全气之作用，而非局局于形者所能窥其万一也。   \n     "
  quote_sha256: 2972d026ab10fbdf898f426b0ac287697cc9384ff2a025fa69cda7383f349eff
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 12973
    raw_end: 13011
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12419
    end_offset: 12457
    quote_sha256: 2972d026ab10fbdf898f426b0ac287697cc9384ff2a025fa69cda7383f349eff
- span_id: ss_qianyuan_ed01_o0013011
  sequence: 529
  start_offset: 12457
  end_offset: 12463
  text: "旨    \n"
  quote_sha256: b6e73377c87fec0fb4b13781e94de3ba4d2a1de5650a4824d8c8ea980de679fc
  evidence_level: offset_level
  source_anchor:
