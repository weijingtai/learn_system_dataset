    start_offset: 2390
    end_offset: 2433
    quote_sha256: 77fdddad96ce801685a1e00683a7c8a2c17547e87c3052bb065368074f213a26
- span_id: ss_qianyuan_ed01_o0002987
  sequence: 116
  start_offset: 2433
  end_offset: 2463
  text: 若命主是金，火罗拱夹日，或火罗同纬日，系春夏生人遇日度必死。
  quote_sha256: 545dedf2c4cb116728042f5615d232485db877c09b0c704021a085c1102e7127
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
