    end_offset: 7584
    quote_sha256: 97d1e5d6c6eedbf82288ee5acd3904d25690fb4e44535f5a3faca4be06ebf49e
- span_id: ss_qianyuan_ed01_o0008138
  sequence: 327
  start_offset: 7584
  end_offset: 7641
  text: "    两星拱命主，或在三方，或在对宫，总以无混杂为贵，日月官魁之拱尤重，命主大限皆然，然亦须辨拱星之吉凶   \n"
  quote_sha256: 1965fc16ef1573139b968b276ba47f5a5c039ada464119b3aeded137b8aec1c0
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8138
    raw_end: 8195
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7584
    end_offset: 7641
    quote_sha256: 1965fc16ef1573139b968b276ba47f5a5c039ada464119b3aeded137b8aec1c0
- span_id: ss_qianyuan_ed01_o0008195
  sequence: 328
  start_offset: 7641
  end_offset: 7647
  text: "　　夹  \n"
  quote_sha256: 5a1e36d6c925b059dc3371ac12bed9811e7762a8c4f7a5dc48163b1623ab485c
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8195
    raw_end: 8201
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7641
    end_offset: 7647
    quote_sha256: 5a1e36d6c925b059dc3371ac12bed9811e7762a8c4f7a5dc48163b1623ab485c
- span_id: ss_qianyuan_ed01_o0008201
  sequence: 329
  start_offset: 7647
  end_offset: 7713
  text: '    两星夹命主，或在一宫，或在数宫，总以不混杂为贵，日月官魁之夹尤重，命主大限皆然，然亦须辨夹星之吉凶，至于日月所夹，更当推求。'
  quote_sha256: 980ac36ae427286e21ae4b51e70c5b042740183dcd0dd395974842e2ab6be4c1
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8201
    raw_end: 8267
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7647
    end_offset: 7713
    quote_sha256: 980ac36ae427286e21ae4b51e70c5b042740183dcd0dd395974842e2ab6be4c1
- span_id: ss_qianyuan_ed01_o0008267
  sequence: 330
  start_offset: 7713
  end_offset: 7751
  text: 命主是官魁文科，日月夹最宜，以其气聚神旺也，若系劫煞伤刃，日月夹之反为不美。
  quote_sha256: 4f70f98513223cccab1490bec67ed077485b2274aa8f82de87e2b494586cb983
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8267
    raw_end: 8305
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7713
    end_offset: 7751
    quote_sha256: 4f70f98513223cccab1490bec67ed077485b2274aa8f82de87e2b494586cb983
- span_id: ss_qianyuan_ed01_o0008305
  sequence: 331
  start_offset: 7751
  end_offset: 7811
  text: 倘非命主，仅属他星，则以夹官魁文科为祥，夹劫煞伤刃为灾，但必察其与命度有关会与否，如并未与命度经络贯串，则亦不见灾祥也。
  quote_sha256: 47d24ea32902301fc153212965692c7a1c88625e7b0d945798651d3e1130d78a
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8305
    raw_end: 8365
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7751
    end_offset: 7811
    quote_sha256: 47d24ea32902301fc153212965692c7a1c88625e7b0d945798651d3e1130d78a
- span_id: ss_qianyuan_ed01_o0008365
  sequence: 332
  start_offset: 7811
  end_offset: 7884
  text: 日月之夹虽取其不混杂，若冬生人，以水孛为官魁科名，日月夹水夹孛，或并夹火夹罗在内，则水孛方藉火罗以暖，始不寒冻，非惟不作混杂论，其精神正全在火罗；
  quote_sha256: 6579447a7f7578dc825dd0e91705a5256410635f2feab6a3d988d25c8a41b8f9
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8365
    raw_end: 8438
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7811
    end_offset: 7884
    quote_sha256: 6579447a7f7578dc825dd0e91705a5256410635f2feab6a3d988d25c8a41b8f9
- span_id: ss_qianyuan_ed01_o0008438
  sequence: 333
  start_offset: 7884
  end_offset: 7908
  text: 如夹水孛并无火罗，似乎不混杂，而其实反难生动矣。
  quote_sha256: 9cb474e50b3cacc6cf431f35c170f3e06f3bc6404727b3d540a7f7d073ae0724
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8438
    raw_end: 8462
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7884
    end_offset: 7908
    quote_sha256: 9cb474e50b3cacc6cf431f35c170f3e06f3bc6404727b3d540a7f7d073ae0724
- span_id: ss_qianyuan_ed01_o0008462
  sequence: 334
  start_offset: 7908
  end_offset: 7931
  text: "推之于拱亦然，夹与拱略同，而其力较大。   \n"
  quote_sha256: 77c79749309ee9db0da1b8fadb684ecd0661e9ac4070f7336e5609621d3051a2
  evidence_level: offset_level
  source_anchor:
