- span_id: ss_qianyuan_ed01_o0017227
  sequence: 664
  start_offset: 16673
  end_offset: 16706
  text: 有辛年人行娄金煞度馆选者，查金即科名，木在阳躔，则即以科名近阳也。
  quote_sha256: 550a323398e74efba8ea2a20a103c3136126d6ffdce40acfa0958ecc05683342
