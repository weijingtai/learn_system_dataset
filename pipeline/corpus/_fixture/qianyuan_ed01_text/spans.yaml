  quote_sha256: 580884253d66e4158a5f02dd6937cd628dad3c75f88bedc8275d5573cc31fbd9
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
