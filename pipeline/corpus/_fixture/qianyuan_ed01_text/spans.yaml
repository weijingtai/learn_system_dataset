    end_offset: 9723
    quote_sha256: d0dc0fed299daf91dd5ca1fa00b08fdda6e9cc589f6ef7037c6bcee7763db71c
- span_id: ss_qianyuan_ed01_o0010277
  sequence: 421
  start_offset: 9723
  end_offset: 9774
  text: "仅置诸闲散之地，尚恐招殃，倘入乎拦夹之乡，愈将肆虐，必得天官乃能制之，而天官又以制劫，力薄矣。   \n"
  quote_sha256: 10ff7be14efed5a5d258c7955fa990b5b55c2c22ed3cabb106055ac5913a238e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
