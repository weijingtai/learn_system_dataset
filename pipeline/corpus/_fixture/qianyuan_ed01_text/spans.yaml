    start_offset: 2347
    end_offset: 2390
    quote_sha256: 5008e4a503762f56337843b825f86149d58b4292078e121edb01aa5b8304829e
- span_id: ss_qianyuan_ed01_o0002944
  sequence: 115
  start_offset: 2390
  end_offset: 2433
  text: 若伤煞在日前后，及与日有关会，即难宦游，宦游亦不能见君，见君亦不能优旨，且恐终于贾祸。
  quote_sha256: 77fdddad96ce801685a1e00683a7c8a2c17547e87c3052bb065368074f213a26
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
