- span_id: ss_qianyuan_ed01_o0000533
  sequence: 5
  start_offset: 51
  end_offset: 88
  text: 西人之言九重天也，曰：最上为宗动天，无星辰，每日带各重天自东而西左旋一周。
  quote_sha256: d604eb02ac88d747aa783cc77076a5eee1dc33267eb7b9c0a847db73fe59b2e4
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 533
    raw_end: 570
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 51
    end_offset: 88
    quote_sha256: d604eb02ac88d747aa783cc77076a5eee1dc33267eb7b9c0a847db73fe59b2e4
- span_id: ss_qianyuan_ed01_o0000570
  sequence: 6
  start_offset: 88
  end_offset: 137
  text: 次曰列宿天，次曰镇星天，次日岁星天，次曰荧惑天，次曰太阳天，次曰金星天，次曰水星天，最下曰太阴天。
  quote_sha256: ecebf140691ff4580d63582dbbfb433c406b2ad8941ddb36f114791d5accc265
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 570
    raw_end: 619
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 88
    end_offset: 137
    quote_sha256: ecebf140691ff4580d63582dbbfb433c406b2ad8941ddb36f114791d5accc265
- span_id: ss_qianyuan_ed01_o0000619
  sequence: 7
  start_offset: 137
  end_offset: 232
  text: 自恒星以下，八重天皆随宗动天左旋，然各天皆有右旋之度，自西而东，与蚁行磨上之喻相符，由是往复循环，运行不息，以氤以氲，众物凭生，而人于其间得气之吉者则吉，得气之凶者则凶，细细按之，不爽毫末。
  quote_sha256: 03fcf8378ba39b746c8acd5b2fa0b99e02bef0a28fabcfdfd21ac1856fa25f3f
  evidence_level: offset_level
  source_anchor:
