    raw_end: 14207
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13579
    end_offset: 13653
    quote_sha256: b84f0929f1a8836a7db8699b03356a11b9e1c866b1fb2955384034719f5c0520
- span_id: ss_qianyuan_ed01_o0014207
  sequence: 558
  start_offset: 13653
  end_offset: 13706
  text: "　《耶律神数》《元星枢要》《原星出入》《天官经》等书皆命理正宗，集中已将精华采取，不复全录。   \n   "
  quote_sha256: 2af6ba24dd31d2b13a4d1b08fd06ab8765990fe5add1263deb5ff3886fbcadf5
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14207
    raw_end: 14260
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13653
    end_offset: 13706
    quote_sha256: 2af6ba24dd31d2b13a4d1b08fd06ab8765990fe5add1263deb5ff3886fbcadf5
- span_id: ss_qianyuan_ed01_o0014260
  sequence: 559
  start_offset: 13706
  end_offset: 13754
  text: 　岁在鹑火而武王克商，岁在实沉而晋文得位，淫於伭枵而裨?知楚子之将死，星见大火而梓慎知宋之将灾；
  quote_sha256: b09eb5f9624faeea8b8e2f7b78452665843ec9ba98e0841b41a22eb8c1f188e6
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14260
    raw_end: 14308
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13706
    end_offset: 13754
    quote_sha256: b09eb5f9624faeea8b8e2f7b78452665843ec9ba98e0841b41a22eb8c1f188e6
- span_id: ss_qianyuan_ed01_o0014308
  sequence: 560
  start_offset: 13754
  end_offset: 13799
  text: 他若五星聚东井而汉王入，关慧扫之而符秦灭，四星聚 牛女而晋元王，吴景星见箕尾而慕容垂复燕。
  quote_sha256: c7b8fcb3b535bc8c57bc2eef8984e76811733539f79f1a367db5ac754e3900bf
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14308
    raw_end: 14353
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13754
    end_offset: 13799
    quote_sha256: c7b8fcb3b535bc8c57bc2eef8984e76811733539f79f1a367db5ac754e3900bf
- span_id: ss_qianyuan_ed01_o0014353
  sequence: 561
  start_offset: 13799
  end_offset: 13872
  text: 分野之说原非无稽，但事关军国之大如可取证，若止一人一身，在心尾则以为宜迁宋燕，在虚危则以为宜迁齐卫，又何以为终身不去其乡，及数十年仕在一方者解也？
  quote_sha256: 32f45d1d318f21fb029c9d84ee02a0bc40e7fc48628c06734f0bcd513d81096e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14353
    raw_end: 14426
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13799
    end_offset: 13872
    quote_sha256: 32f45d1d318f21fb029c9d84ee02a0bc40e7fc48628c06734f0bcd513d81096e
- span_id: ss_qianyuan_ed01_o0014426
  sequence: 562
  start_offset: 13872
  end_offset: 13938
  text: 子平原有至理，但前六十年某月某日某时出一大贵人，后六十年仍有此八字，其人却与前迥异，及查阅五星，果宜高下悬绝，则子平似稍逊五星一筹。
  quote_sha256: 1848c216257a7d4885b3c970dcbc545b540c066441d10d41dfc4f5289042ed28
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14426
    raw_end: 14492
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13872
    end_offset: 13938
    quote_sha256: 1848c216257a7d4885b3c970dcbc545b540c066441d10d41dfc4f5289042ed28
- span_id: ss_qianyuan_ed01_o0014492
  sequence: 563
  start_offset: 13938
  end_offset: 13972
  text: 子平为体，五星为用，体同而用异，此前后六十年，八字相同而五星各异也。
  quote_sha256: 34e9f65b9a64a8cd1f1e08f404072003c3772e9f2b1435cc544a5ace6f2626d8
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14492
    raw_end: 14526
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13938
    end_offset: 13972
    quote_sha256: 34e9f65b9a64a8cd1f1e08f404072003c3772e9f2b1435cc544a5ace6f2626d8
- span_id: ss_qianyuan_ed01_o0014526
  sequence: 564
  start_offset: 13972
  end_offset: 13987
  text: 然体用一理，终不可详用而略体。
  quote_sha256: 202344338d41b3792961bf16c7cab71a903dd5fb60b28a0a9802211b355c4c17
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14526
    raw_end: 14541
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13972
    end_offset: 13987
    quote_sha256: 202344338d41b3792961bf16c7cab71a903dd5fb60b28a0a9802211b355c4c17
- span_id: ss_qianyuan_ed01_o0014541
  sequence: 565
  start_offset: 13987
  end_offset: 14000
  text: 格局皆形也，宜参形中之气。
  quote_sha256: c69090b2b415419c294b7a8840568f32fc25e85a36db2e2a894ec5bf6ebec689
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14541
    raw_end: 14554
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13987
    end_offset: 14000
    quote_sha256: c69090b2b415419c294b7a8840568f32fc25e85a36db2e2a894ec5bf6ebec689
- span_id: ss_qianyuan_ed01_o0014554
  sequence: 566
  start_offset: 14000
  end_offset: 14032
  text: 如四余在西北，五星同日在东南，太阴入西北，即四余栏月，五曜环阳；
  quote_sha256: 92d87decc1583d728befbda6bc4ead00107780a5d6521664575bec58b642040b
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14554
    raw_end: 14586
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14000
    end_offset: 14032
    quote_sha256: 92d87decc1583d728befbda6bc4ead00107780a5d6521664575bec58b642040b
- span_id: ss_qianyuan_ed01_o0014586
  sequence: 567
  start_offset: 14032
  end_offset: 14069
  text: 太阴入东南，即四余包七政，文东武西每每至两三月皆如此，其贱作奴隶者亦多矣！
  quote_sha256: 4ef34a6d750f164dc90160897236007a5a8e3e37071533a90d94de2250bf2479
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14586
    raw_end: 14623
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14032
    end_offset: 14069
    quote_sha256: 4ef34a6d750f164dc90160897236007a5a8e3e37071533a90d94de2250bf2479
- span_id: ss_qianyuan_ed01_o0014623
  sequence: 568
  start_offset: 14069
  end_offset: 14096
  text: "乃一见便以为大格局，即许以宜尊显，何愚昧至此？ \n\n "
  quote_sha256: 0b56505d58f675a110cfe07a2fe7e978b97d9dd856640d36ea531d54bf044551
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14623
    raw_end: 14650
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14069
    end_offset: 14096
    quote_sha256: 0b56505d58f675a110cfe07a2fe7e978b97d9dd856640d36ea531d54bf044551
- span_id: ss_qianyuan_ed01_o0014650
  sequence: 569
  start_offset: 14096
  end_offset: 14103
  text: 　　何为七曜？
  quote_sha256: 5f2eaba3a454be58927e74fed67baf02c361e2637f34c89b93dd842d69fcfb95
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14650
    raw_end: 14657
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14096
    end_offset: 14103
    quote_sha256: 5f2eaba3a454be58927e74fed67baf02c361e2637f34c89b93dd842d69fcfb95
- span_id: ss_qianyuan_ed01_o0014657
  sequence: 570
  start_offset: 14103
  end_offset: 14140
  text: 相照之光，多少不同，日前后光十五度，月一十二度，土木火各九度，金水各七度。
  quote_sha256: 808ff8632c9bc825a2da34018c56d576df7db6586d42bf485572065a3661ab08
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14657
    raw_end: 14694
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14103
    end_offset: 14140
    quote_sha256: 808ff8632c9bc825a2da34018c56d576df7db6586d42bf485572065a3661ab08
- span_id: ss_qianyuan_ed01_o0014694
  sequence: 571
  start_offset: 14140
  end_offset: 14162
  text: 假令火追逐土相离七度，则二星沾光，呼为相会。
  quote_sha256: a99075ceee332133e16b906983979408b5d0084f7fca12865507db4a4686e71c
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14694
    raw_end: 14716
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14140
    end_offset: 14162
    quote_sha256: a99075ceee332133e16b906983979408b5d0084f7fca12865507db4a4686e71c
- span_id: ss_qianyuan_ed01_o0014716
  sequence: 572
  start_offset: 14162
  end_offset: 14183
  text: 若星光度数均者相会，则各星度数减半同沾光。
  quote_sha256: 6a5f661459afbaa81902de099a5d8662cbf443b6eb2c93108f4aa32d09784d4d
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14716
    raw_end: 14737
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14162
    end_offset: 14183
    quote_sha256: 6a5f661459afbaa81902de099a5d8662cbf443b6eb2c93108f4aa32d09784d4d
- span_id: ss_qianyuan_ed01_o0014737
  sequence: 573
  start_offset: 14183
  end_offset: 14212
  text: 若星光度数多少不同者，初会时度数多者先沾光，少者光未沾及；
  quote_sha256: e6d4975e104540a13efa1d83d1808f5df38ee8ed8c1ca30dc7d3565f1278dce7
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14737
    raw_end: 14766
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14183
    end_offset: 14212
    quote_sha256: e6d4975e104540a13efa1d83d1808f5df38ee8ed8c1ca30dc7d3565f1278dce7
- span_id: ss_qianyuan_ed01_o0014766
  sequence: 574
  start_offset: 14212
  end_offset: 14230
  text: 少者度数相及，则二星同沾光，为正会。
  quote_sha256: 0f4ab34c2164d514ddc8136d168327d8ad3c61a9e4284e2eb3d5d03e9419c9bb
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14766
    raw_end: 14784
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14212
    end_offset: 14230
    quote_sha256: 0f4ab34c2164d514ddc8136d168327d8ad3c61a9e4284e2eb3d5d03e9419c9bb
- span_id: ss_qianyuan_ed01_o0014784
  sequence: 575
  start_offset: 14230
  end_offset: 14263
  text: 凡二星同度为相会，但遇一分为相离，虽相离力尚在，为二星后光未尽也。
  quote_sha256: f7df03fc256ac475d97794bf7c578aef9fd45b8fbfd78f815c6bb140672cab01
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14784
    raw_end: 14817
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14230
    end_offset: 14263
    quote_sha256: f7df03fc256ac475d97794bf7c578aef9fd45b8fbfd78f815c6bb140672cab01
- span_id: ss_qianyuan_ed01_o0014817
  sequence: 576
  start_offset: 14263
  end_offset: 14306
  text: 若二星相会后相离一分或二分，却再有一星在后追及，星虽未到，光已相沾，即与后星又为初会。
  quote_sha256: bd096e6295fc0d0aa3ef350801df6baa2ca48b85efea0f326ab3d229a4d84fba
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14817
    raw_end: 14860
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14263
    end_offset: 14306
    quote_sha256: bd096e6295fc0d0aa3ef350801df6baa2ca48b85efea0f326ab3d229a4d84fba
- span_id: ss_qianyuan_ed01_o0014860
  sequence: 577
  start_offset: 14306
  end_offset: 14331
  text: 此论经度则然，若在纬度、或黄道南、或黄道北，更重。
  quote_sha256: c3de124207c27a28bdeb9159a2c1f795df52f735429630066d1d5731cd135bf5
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14860
    raw_end: 14885
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14306
    end_offset: 14331
    quote_sha256: c3de124207c27a28bdeb9159a2c1f795df52f735429630066d1d5731cd135bf5
- span_id: ss_qianyuan_ed01_o0014885
  sequence: 578
  start_offset: 14331
  end_offset: 14359
  text: 如二星纬度同，经度亦同，则下星能掩却上星，故相会为尤紧。
  quote_sha256: c7a9a57cc5f2a22c76ab279c811087a0376e24d96713559662cb99cf79d77786
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14885
    raw_end: 14913
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14331
    end_offset: 14359
    quote_sha256: c7a9a57cc5f2a22c76ab279c811087a0376e24d96713559662cb99cf79d77786
- span_id: ss_qianyuan_ed01_o0014913
  sequence: 579
  start_offset: 14359
  end_offset: 14461
  text: 且此二星相会后，一星前去追及一星，即将先会星光移向后相会之星，假令二星东出度数与对黄道的赤道度数相同，如亥宫二十五度与戌宫五度同，或二星在两处，日长短同，如一星在申宫二十五度，一星在未宫五度，亦呼为相遇。
  quote_sha256: 09af83fdafaaee1caa644c55738de0802405b9fcbc5a7d0e740a9cc69671f878
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14913
    raw_end: 15015
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14359
    end_offset: 14461
    quote_sha256: 09af83fdafaaee1caa644c55738de0802405b9fcbc5a7d0e740a9cc69671f878
- span_id: ss_qianyuan_ed01_o0015015
  sequence: 580
  start_offset: 14461
  end_offset: 14523
  text: 又如火星在戌宫，木星在巳宫，金星在申宫，金离火追及木，却将火之光移向木星，似火与木亦为相遇，谓金先与火六合照后与木相弦照也。
  quote_sha256: e081d3d70494e1d6ac381e805352c86cf77dd1f16fed7ca27ea4300b6a310ec6
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15015
    raw_end: 15077
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14461
    end_offset: 14523
    quote_sha256: e081d3d70494e1d6ac381e805352c86cf77dd1f16fed7ca27ea4300b6a310ec6
- span_id: ss_qianyuan_ed01_o0015077
  sequence: 581
  start_offset: 14523
  end_offset: 14572
  text: 又火星在戌宫，木星在巳宫，土星在申宫，土与火六合照，与木相弦照，土将木火二星光聚于一处，亦为相遇。
  quote_sha256: 9da0de10d6b84808ef1e5eb7a6c82846d9a63cb89aae44c23896f76ae66b463c
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15077
    raw_end: 15126
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14523
    end_offset: 14572
    quote_sha256: 9da0de10d6b84808ef1e5eb7a6c82846d9a63cb89aae44c23896f76ae66b463c
- span_id: ss_qianyuan_ed01_o0015126
  sequence: 582
  start_offset: 14572
  end_offset: 14623
  text: "若一星在本宫，又在分定数上与一星或三合、或六合、或对、二弦 相照，主星即受相照之星之荣落。   \n "
  quote_sha256: 714699b7c3d491581cf1c22be6b6b65491422fd1b3d905cad6319716e6a06ebd
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15126
    raw_end: 15177
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14572
    end_offset: 14623
    quote_sha256: 714699b7c3d491581cf1c22be6b6b65491422fd1b3d905cad6319716e6a06ebd
- span_id: ss_qianyuan_ed01_o0015177
  sequence: 583
  start_offset: 14623
  end_offset: 14633
  text: 　  何谓政余类聚？
  quote_sha256: 19c0dc25f5f8f2a5f425414e290b2e38e12a2ffc8d7414bbea7eb04b1dd1ed12
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15177
    raw_end: 15187
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14623
    end_offset: 14633
    quote_sha256: 19c0dc25f5f8f2a5f425414e290b2e38e12a2ffc8d7414bbea7eb04b1dd1ed12
- span_id: ss_qianyuan_ed01_o0015187
  sequence: 584
  start_offset: 14633
  end_offset: 14656
  text: 乃水与孛、木与气、火与罗、土与计，一类分聚也。
  quote_sha256: 9a0a3aa96a23416ae2cda6bbd96bbf7323dc9ba0c3bb3f204a4991bae0948fd7
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15187
    raw_end: 15210
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14633
    end_offset: 14656
    quote_sha256: 9a0a3aa96a23416ae2cda6bbd96bbf7323dc9ba0c3bb3f204a4991bae0948fd7
- span_id: ss_qianyuan_ed01_o0015210
  sequence: 585
  start_offset: 14656
  end_offset: 14685
  text: 若金星居中，贵气所属，以之作命主，金无余气，理应位冠群僚。
  quote_sha256: da52f76759e77f5634109ff8f11aa50339275352aaeae6f71514130a7867b0cf
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15210
    raw_end: 15239
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14656
    end_offset: 14685
    quote_sha256: da52f76759e77f5634109ff8f11aa50339275352aaeae6f71514130a7867b0cf
- span_id: ss_qianyuan_ed01_o0015239
  sequence: 586
  start_offset: 14685
  end_offset: 14711
  text: 如水土木火作命主，非贵气所属，又不近阳，亦寻常人耳。
  quote_sha256: 3ca4c2392be1c0713a0ec7aebed85e2bc31b8656b62ec56a99707258560f3333
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15239
    raw_end: 15265
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14685
    end_offset: 14711
    quote_sha256: 3ca4c2392be1c0713a0ec7aebed85e2bc31b8656b62ec56a99707258560f3333
- span_id: ss_qianyuan_ed01_o0015265
  sequence: 587
  start_offset: 14711
  end_offset: 14743
  text: "贵气所属，又能近阳，终嫌其为余星分窃，仅列卿贰而已。   \n  "
  quote_sha256: 673ee453160336dbc93db94dddd34ffe364b9daebdf4768dcb6162340b17c20f
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15265
    raw_end: 15297
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14711
    end_offset: 14743
    quote_sha256: 673ee453160336dbc93db94dddd34ffe364b9daebdf4768dcb6162340b17c20f
- span_id: ss_qianyuan_ed01_o0015297
  sequence: 588
  start_offset: 14743
  end_offset: 14755
  text: 　 五列形也，而气存焉。
  quote_sha256: 062c9a2e7c7588317c17a613a0476d6cbefcaf13548ec134d8e8adaa33b82da7
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15297
    raw_end: 15309
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14743
    end_offset: 14755
    quote_sha256: 062c9a2e7c7588317c17a613a0476d6cbefcaf13548ec134d8e8adaa33b82da7
- span_id: ss_qianyuan_ed01_o0015309
  sequence: 589
  start_offset: 14755
  end_offset: 14774
  text: 三四五星同坐一宫，疏密匀停，谓之坐列。
  quote_sha256: dfeafe64dd26e3f3972db8ede2c555cd0fc2344c69b2d77e142857faa5e51998
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15309
    raw_end: 15328
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14755
    end_offset: 14774
    quote_sha256: dfeafe64dd26e3f3972db8ede2c555cd0fc2344c69b2d77e142857faa5e51998
- span_id: ss_qianyuan_ed01_o0015328
  sequence: 590
  start_offset: 14774
  end_offset: 14811
  text: 三四宫上，疏密匀停，谓之排列，宜命主居中及高地，犹四五人同坐，居中者尊也。
  quote_sha256: b8c9752ab9b1e143f719acbc676ec34f27861a998a11b2b4fb5dc6614bf7dbfb
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15328
    raw_end: 15365
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14774
    end_offset: 14811
    quote_sha256: b8c9752ab9b1e143f719acbc676ec34f27861a998a11b2b4fb5dc6614bf7dbfb
- span_id: ss_qianyuan_ed01_o0015365
  sequence: 591
  start_offset: 14811
  end_offset: 14883
  text: 疏密不匀，谓之行列，行列宜命主居前，犹四五同行，居前者尊，居后者卑也，居最后而有计罗拦转则非后也，乃前也，又上尊也，俨然旌旗导引，士卒拥卫之象。
  quote_sha256: b98dcdb4b5e6b9c02a514439d1b2164e91b65629b0cfc5b43fac4fc767e87d0e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15365
    raw_end: 15437
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14811
    end_offset: 14883
    quote_sha256: b98dcdb4b5e6b9c02a514439d1b2164e91b65629b0cfc5b43fac4fc767e87d0e
- span_id: ss_qianyuan_ed01_o0015437
  sequence: 592
  start_offset: 14883
  end_offset: 14947
  text: 命主独居一宫，两傍有官魁夹，官魁有日月夹，日月又有四余包裹，谓之主列，自是左右并辅，文武环护之象，或待漏于端门，或拜拱天门皆妙。
  quote_sha256: a87722588f296dd523073cdd150b49d8ee75620324792a78d98d12c2dc4202a0
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15437
    raw_end: 15501
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14883
    end_offset: 14947
    quote_sha256: a87722588f296dd523073cdd150b49d8ee75620324792a78d98d12c2dc4202a0
- span_id: ss_qianyuan_ed01_o0015501
  sequence: 593
  start_offset: 14947
  end_offset: 15010
  text: "太阳同三政一余在一连四宫，太阴同三余一政在一连四宫，独空中四宫，惟命主居之，谓之中列，自是超群出众，独立寡俦之象。   \n  "
  quote_sha256: f52c547d9d1a3e03e1afbb83a407db0daf72ec66fda02b3a1f97aa67282722e1
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15501
    raw_end: 15564
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 14947
    end_offset: 15010
    quote_sha256: f52c547d9d1a3e03e1afbb83a407db0daf72ec66fda02b3a1f97aa67282722e1
- span_id: ss_qianyuan_ed01_o0015564
  sequence: 594
  start_offset: 15010
  end_offset: 15040
  text: "　 命主朝君，命余觐后，此为阴阳和会，大都贵显。   \n  "
  quote_sha256: f79ef0cbe495a86e6adf8dcbb713a2230544667166cccfc4c3baf2e0cc26c7fd
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15564
    raw_end: 15594
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15010
    end_offset: 15040
    quote_sha256: f79ef0cbe495a86e6adf8dcbb713a2230544667166cccfc4c3baf2e0cc26c7fd
- span_id: ss_qianyuan_ed01_o0015594
  sequence: 595
  start_offset: 15040
  end_offset: 15116
  text: "　 或十一曜拱命垣、或计罗拦截、或空四正、或空三方、或空对两宫、或空子午丑未、或空卯酉辰戌、或居三隔三、或守一空一，皆贵气所属，亦宜留意。   \n\
    \   "
  quote_sha256: 8d04e91496a8449fb23f75869e94e7789a4ac446cbf8542f1ed4ad6c2b4086a2
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15594
    raw_end: 15670
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15040
    end_offset: 15116
    quote_sha256: 8d04e91496a8449fb23f75869e94e7789a4ac446cbf8542f1ed4ad6c2b4086a2
- span_id: ss_qianyuan_ed01_o0015670
  sequence: 596
  start_offset: 15116
  end_offset: 15165
  text: '　或七政归垣，或七政升殿，或五星齐与日有关照，或五星齐与月有关照，亦属罕觏，均宜细审。      '
  quote_sha256: 074aa61961b2a7eee720483c15ff890d4bfa6b9fe07c1d0ca0d97e8c285d7bd0
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15670
    raw_end: 15719
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15116
    end_offset: 15165
    quote_sha256: 074aa61961b2a7eee720483c15ff890d4bfa6b9fe07c1d0ca0d97e8c285d7bd0
- span_id: ss_qianyuan_ed01_o0015719
  sequence: 597
  start_offset: 15165
  end_offset: 15243
  text: 有谓木气之入子丑，金之入寅亥，水孛之入卯戌，火罗之入辰酉，土计之入巳申，木气之入午，土计之入未，所主者之宫究竟受伤，此亦宜泛泛参观，兼当揆时度势，不可执泥。
  quote_sha256: 29f5ca88a3ec3da04b2b6e38d915acf39e1ea2b983266c877e33996d8d40159e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15719
    raw_end: 15797
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15165
    end_offset: 15243
    quote_sha256: 29f5ca88a3ec3da04b2b6e38d915acf39e1ea2b983266c877e33996d8d40159e
- span_id: ss_qianyuan_ed01_o0015797
  sequence: 598
  start_offset: 15243
  end_offset: 15253
  text: 立命于子，木独守命；
  quote_sha256: b2c8439601c9b1d948b71024db236a28078ec9a4cf7742aafbcc4c7ee2e8e252
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15797
    raw_end: 15807
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15243
    end_offset: 15253
    quote_sha256: b2c8439601c9b1d948b71024db236a28078ec9a4cf7742aafbcc4c7ee2e8e252
- span_id: ss_qianyuan_ed01_o0015807
  sequence: 599
  start_offset: 15253
  end_offset: 15291
  text: "立命于寅，金独守命，现在皆作卿贰矣，必欲一一执泥焉，庸有当乎？   \n   "
  quote_sha256: 5b788618e5ede6a3693fc9db639027d1ce94ad16fc946b6e18bc31dcd5f9ef15
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15807
    raw_end: 15845
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15253
    end_offset: 15291
    quote_sha256: 5b788618e5ede6a3693fc9db639027d1ce94ad16fc946b6e18bc31dcd5f9ef15
- span_id: ss_qianyuan_ed01_o0015845
  sequence: 600
  start_offset: 15291
  end_offset: 15305
  text: 　童限或十岁出，或二十岁出。
  quote_sha256: 8969f5c4f9cc4271472b9cc1bbcd1cc07996306f10d9c62dd2b244180f704c04
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15845
    raw_end: 15859
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15291
    end_offset: 15305
    quote_sha256: 8969f5c4f9cc4271472b9cc1bbcd1cc07996306f10d9c62dd2b244180f704c04
- span_id: ss_qianyuan_ed01_o0015859
  sequence: 601
  start_offset: 15305
  end_offset: 15322
  text: 其在童限中，即将所立之度逐年挨查。
  quote_sha256: e77e42650718737e582e3644292351db97b289c9b2e491c05e1e6c2f92cee6bf
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15859
    raw_end: 15876
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15305
    end_offset: 15322
    quote_sha256: e77e42650718737e582e3644292351db97b289c9b2e491c05e1e6c2f92cee6bf
- span_id: ss_qianyuan_ed01_o0015876
  sequence: 602
  start_offset: 15322
  end_offset: 15340
  text: 如度是木，木原与日通，童限中即克父。
  quote_sha256: 1f9941268f71462b612fabbbd18aea4e7ab46c4c16e1f45a8eee95534d974222
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15876
    raw_end: 15894
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15322
    end_offset: 15340
    quote_sha256: 1f9941268f71462b612fabbbd18aea4e7ab46c4c16e1f45a8eee95534d974222
- span_id: ss_qianyuan_ed01_o0015894
  sequence: 603
  start_offset: 15340
  end_offset: 15357
  text: 度是土，土原与月通，童限中即克母。
  quote_sha256: 739005e8c413666aff726fa1d2795d44983c00cfd053d0d70bae2f2ac302443d
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15894
    raw_end: 15911
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15340
    end_offset: 15357
    quote_sha256: 739005e8c413666aff726fa1d2795d44983c00cfd053d0d70bae2f2ac302443d
- span_id: ss_qianyuan_ed01_o0015911
  sequence: 604
  start_offset: 15357
  end_offset: 15370
  text: 度是吉气所钟，童限中即发；
  quote_sha256: 0e5f98951699be5c134ba00b2ab7e6ff23c5444916d4ae1fb5d36049341afe89
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15911
    raw_end: 15924
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15357
    end_offset: 15370
    quote_sha256: 0e5f98951699be5c134ba00b2ab7e6ff23c5444916d4ae1fb5d36049341afe89
- span_id: ss_qianyuan_ed01_o0015924
  sequence: 605
  start_offset: 15370
  end_offset: 15387
  text: "度是凶气所会，童限中即亡。   \n"
  quote_sha256: dd393b05fa4e6982bee3642fe576ca2e4fa7d2aafbe054c8a154b26dc1557e78
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15924
    raw_end: 15941
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15370
    end_offset: 15387
    quote_sha256: dd393b05fa4e6982bee3642fe576ca2e4fa7d2aafbe054c8a154b26dc1557e78
- span_id: ss_qianyuan_ed01_o0015941
  sequence: 606
  start_offset: 15387
  end_offset: 15414
  text: 　　女命与男命略同，所异者命主之外，尤以夫星子星为重。
  quote_sha256: 0ae650ee1fd9e779c158c91b79f3b669b497a0790de3b3a028ca252fe431359c
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15941
    raw_end: 15968
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15387
    end_offset: 15414
    quote_sha256: 0ae650ee1fd9e779c158c91b79f3b669b497a0790de3b3a028ca252fe431359c
- span_id: ss_qianyuan_ed01_o0015968
  sequence: 607
  start_offset: 15414
  end_offset: 15449
  text: 从夫子星之生克制化及经络贯串拦拱夹上，细细推求其贫富贵贱，亦相应如响。
  quote_sha256: 04facdb9a394b080300b3a49b80b0f7f2e12f2a34622c6c44fcb528fc846666a
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 15968
    raw_end: 16003
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15414
    end_offset: 15449
    quote_sha256: 04facdb9a394b080300b3a49b80b0f7f2e12f2a34622c6c44fcb528fc846666a
- span_id: ss_qianyuan_ed01_o0016003
  sequence: 608
  start_offset: 15449
  end_offset: 15470
  text: 双生之别，命主太旺幼者胜，命主太弱长者胜；
  quote_sha256: edac26d60f5784854c38e0d9a9e2ca0f555130c92f5438a32a3ddba6e9a1dd40
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16003
    raw_end: 16024
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15449
    end_offset: 15470
    quote_sha256: edac26d60f5784854c38e0d9a9e2ca0f555130c92f5438a32a3ddba6e9a1dd40
- span_id: ss_qianyuan_ed01_o0016024
  sequence: 609
  start_offset: 15470
  end_offset: 15482
  text: 命主不旺不弱，长幼略同。
  quote_sha256: 04ae7a94028d2d9a193029723fef33dfbc86e95cc20980018b624bcb1d7e3dde
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16024
    raw_end: 16036
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15470
    end_offset: 15482
    quote_sha256: 04ae7a94028d2d9a193029723fef33dfbc86e95cc20980018b624bcb1d7e3dde
- span_id: ss_qianyuan_ed01_o0016036
  sequence: 610
  start_offset: 15482
  end_offset: 15504
  text: 又长主正，幼主余，政余恒不类，则长幼亦多异。
  quote_sha256: cd16f408a3cee8e0a4e48ef63a5bd570337c553187500a468ce9d555b4b2b3f5
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16036
    raw_end: 16058
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15482
    end_offset: 15504
    quote_sha256: cd16f408a3cee8e0a4e48ef63a5bd570337c553187500a468ce9d555b4b2b3f5
- span_id: ss_qianyuan_ed01_o0016058
  sequence: 611
  start_offset: 15504
  end_offset: 15520
  text: 大吉大凶之命一望而知，易于推算；
  quote_sha256: 66c94b103016f59c0a014c43091df10dfe67bee6ff71f30ce19061bceca00abe
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16058
    raw_end: 16074
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15504
    end_offset: 15520
    quote_sha256: 66c94b103016f59c0a014c43091df10dfe67bee6ff71f30ce19061bceca00abe
- span_id: ss_qianyuan_ed01_o0016074
  sequence: 612
  start_offset: 15520
  end_offset: 15533
  text: 若中立之辈，只可断其大概。
  quote_sha256: 243bc023e3e615e68aded14914d24ea5e17c02a98fe8ce6a1240d8e8ee2dc027
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16074
    raw_end: 16087
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15520
    end_offset: 15533
    quote_sha256: 243bc023e3e615e68aded14914d24ea5e17c02a98fe8ce6a1240d8e8ee2dc027
- span_id: ss_qianyuan_ed01_o0016087
  sequence: 613
  start_offset: 15533
  end_offset: 15569
  text: 必谓当为某等人，不作某等业，岂未知士农之子长为士农，工商之子长为工商乎？
  quote_sha256: 358f1919dd144c7056038ba2c761eaa1f5ef6f9dcb892809c95dd372886f86e9
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16087
    raw_end: 16123
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15533
    end_offset: 15569
    quote_sha256: 358f1919dd144c7056038ba2c761eaa1f5ef6f9dcb892809c95dd372886f86e9
- span_id: ss_qianyuan_ed01_o0016123
  sequence: 614
  start_offset: 15569
  end_offset: 15585
  text: 一日不过十二时，所产何止数万人？
  quote_sha256: 4916cf770ba8bd6525431d6f36cdad52e952532090632a4f41f3e79a1eae5d37
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16123
    raw_end: 16139
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15569
    end_offset: 15585
    quote_sha256: 4916cf770ba8bd6525431d6f36cdad52e952532090632a4f41f3e79a1eae5d37
- span_id: ss_qianyuan_ed01_o0016139
  sequence: 615
  start_offset: 15585
  end_offset: 15601
  text: 虽五方风土不齐，要亦大率相类也。
  quote_sha256: 5fdc2815b79bb9749497b0538c672411ed94b503ece0c8f802c2ee6ca34be5aa
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16139
    raw_end: 16155
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15585
    end_offset: 15601
    quote_sha256: 5fdc2815b79bb9749497b0538c672411ed94b503ece0c8f802c2ee6ca34be5aa
- span_id: ss_qianyuan_ed01_o0016155
  sequence: 616
  start_offset: 15601
  end_offset: 15626
  text: 大富大贵之命往往不重生，而贫贱者恒层见叠出，何欤？
  quote_sha256: 32f21c03c6b660dc1c7f4d42e690ec0857a7e04dc14fc823eaa20a59de4d775b
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16155
    raw_end: 16180
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15601
    end_offset: 15626
    quote_sha256: 32f21c03c6b660dc1c7f4d42e690ec0857a7e04dc14fc823eaa20a59de4d775b
- span_id: ss_qianyuan_ed01_o0016180
  sequence: 617
  start_offset: 15626
  end_offset: 15676
  text: 盖天地之精华独蕴酿于此日之一时，譬之祥麟彩凤原不多见，若泛泛化生于阴阳五行，不啻吠犬呜鸡，何地无之？
  quote_sha256: d68cd76945fb04c57d799252ef70b76e5cbc1e173fb552e45be84c96c96f1270
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16180
    raw_end: 16230
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15626
    end_offset: 15676
    quote_sha256: d68cd76945fb04c57d799252ef70b76e5cbc1e173fb552e45be84c96c96f1270
- span_id: ss_qianyuan_ed01_o0016230
  sequence: 618
  start_offset: 15676
  end_offset: 15691
  text: 限度虽极危，其气未尽，即不死；
  quote_sha256: 1c9dcc2cc9973c0da49dae35f85cf4c05e2f5a43483023960a67a042aae9a10f
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16230
    raw_end: 16245
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15676
    end_offset: 15691
    quote_sha256: 1c9dcc2cc9973c0da49dae35f85cf4c05e2f5a43483023960a67a042aae9a10f
- span_id: ss_qianyuan_ed01_o0016245
  sequence: 619
  start_offset: 15691
  end_offset: 15706
  text: 限度虽尚稳，其气已尽，即必死。
  quote_sha256: ce2023e85f460c53880adb17c813223212d80013bb55213264978e23b4a160e7
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16245
    raw_end: 16260
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15691
    end_offset: 15706
    quote_sha256: ce2023e85f460c53880adb17c813223212d80013bb55213264978e23b4a160e7
- span_id: ss_qianyuan_ed01_o0016260
  sequence: 620
  start_offset: 15706
  end_offset: 15722
  text: 大贵之人常在极吉之度死者，何也？
  quote_sha256: b633370f144ad4eb578d1367c3b1fe0f269b7cd83c63df56ac34a3ee486f4434
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16260
    raw_end: 16276
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15706
    end_offset: 15722
    quote_sha256: b633370f144ad4eb578d1367c3b1fe0f269b7cd83c63df56ac34a3ee486f4434
- span_id: ss_qianyuan_ed01_o0016276
  sequence: 621
  start_offset: 15722
  end_offset: 15736
  text: 其气尽也，且当受身后之荣也。
  quote_sha256: 3bf75f69e9ee4a0afb1141712e50a4343392836343432cef2df626ab438b0cd5
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16276
    raw_end: 16290
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15722
    end_offset: 15736
    quote_sha256: 3bf75f69e9ee4a0afb1141712e50a4343392836343432cef2df626ab438b0cd5
- span_id: ss_qianyuan_ed01_o0016290
  sequence: 622
  start_offset: 15736
  end_offset: 15763
  text: "若至凶度而死，必罹祸患矣，非其命所应有也。 \n\n   "
  quote_sha256: 2ea2e1b1599c860210e29a5ea4c808c8d9171d65555826da72d3d9bfc68e7dfb
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16290
    raw_end: 16317
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15736
    end_offset: 15763
    quote_sha256: 2ea2e1b1599c860210e29a5ea4c808c8d9171d65555826da72d3d9bfc68e7dfb
- span_id: ss_qianyuan_ed01_o0016317
  sequence: 623
  start_offset: 15763
  end_offset: 15785
  text: 　命只合得一科第，弱冠得之，其气已尽，即死。
  quote_sha256: 5c9c83d5266dcedd9c6538420f5f077351fb8eb7b2267bc5f30836481dceb706
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16317
    raw_end: 16339
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15763
    end_offset: 15785
    quote_sha256: 5c9c83d5266dcedd9c6538420f5f077351fb8eb7b2267bc5f30836481dceb706
- span_id: ss_qianyuan_ed01_o0016339
  sequence: 624
  start_offset: 15785
  end_offset: 15819
  text: "命必至一二品，虽六七十岁外，其气未尽，必候到此地位才死。   \n  "
  quote_sha256: 5501b7c66e979e39dd0277368533783cf0669ef370864cbb890166a3a62f61a6
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16339
    raw_end: 16373
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15785
    end_offset: 15819
    quote_sha256: 5501b7c66e979e39dd0277368533783cf0669ef370864cbb890166a3a62f61a6
- span_id: ss_qianyuan_ed01_o0016373
  sequence: 625
  start_offset: 15819
  end_offset: 15834
  text: 　 有两人之命，皆宜位至二品。
  quote_sha256: c1b689945c4a0ed2c69edc5fe9ed0ec26023a61311efadaf125fbb484690188a
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16373
    raw_end: 16388
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15819
    end_offset: 15834
    quote_sha256: c1b689945c4a0ed2c69edc5fe9ed0ec26023a61311efadaf125fbb484690188a
- span_id: ss_qianyuan_ed01_o0016388
  sequence: 626
  start_offset: 15834
  end_offset: 15862
  text: 一人于三二十岁时，猝于数年间超擢至二品，其气已尽，即死。
  quote_sha256: faa1cd61782010b48623f50266acdcdd10d1ca661d7f8d22f719c00793adec69
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16388
    raw_end: 16416
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15834
    end_offset: 15862
    quote_sha256: faa1cd61782010b48623f50266acdcdd10d1ca661d7f8d22f719c00793adec69
- span_id: ss_qianyuan_ed01_o0016416
  sequence: 627
  start_offset: 15862
  end_offset: 15903
  text: "一人历久不升，即升亦循序渐进，迁延至六七十岁得之，其气不尽，总不死。   \n   "
  quote_sha256: 97a1500f8b579e1034eaa1ab7d86f079aa8a545e87c1590030e525b45db67f7e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16416
    raw_end: 16457
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15862
    end_offset: 15903
    quote_sha256: 97a1500f8b579e1034eaa1ab7d86f079aa8a545e87c1590030e525b45db67f7e
- span_id: ss_qianyuan_ed01_o0016457
  sequence: 628
  start_offset: 15903
  end_offset: 15925
  text: 　有中年忽然折挫者，如气正未尽，可决其复起；
  quote_sha256: 7725f3dcce5278b0b9769242964bf35e338bf2aced1ca9203e76947b401c6330
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16457
    raw_end: 16479
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15903
    end_offset: 15925
    quote_sha256: 7725f3dcce5278b0b9769242964bf35e338bf2aced1ca9203e76947b401c6330
- span_id: ss_qianyuan_ed01_o0016479
  sequence: 629
  start_offset: 15925
  end_offset: 15945
  text: "如其气或已尽，即判以终身。   \n   "
  quote_sha256: 1df31ea4a9eda90854857d3c36f6331f2a36d90d72f918fc2698b94638051c2e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16479
    raw_end: 16499
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15925
    end_offset: 15945
    quote_sha256: 1df31ea4a9eda90854857d3c36f6331f2a36d90d72f918fc2698b94638051c2e
- span_id: ss_qianyuan_ed01_o0016499
  sequence: 630
  start_offset: 15945
  end_offset: 15961
  text: 　死生本有定数，而非所论于自取。
  quote_sha256: bf0ab6222850d7642eb32f66fcb4f5cd0797aee09c8294af3dea8151921fee4e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16499
    raw_end: 16515
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15945
    end_offset: 15961
    quote_sha256: bf0ab6222850d7642eb32f66fcb4f5cd0797aee09c8294af3dea8151921fee4e
- span_id: ss_qianyuan_ed01_o0016515
  sequence: 631
  start_offset: 15961
  end_offset: 15996
  text: 尝读孔子之言而爽然矣，曰：「寝处不时，饮食不节，劳佚过度者，疾共杀之；
  quote_sha256: 4c02c1e828171e7ed948a158850db8d185ce915dcd488e05eb5143ac157460bc
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16515
    raw_end: 16550
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15961
    end_offset: 15996
    quote_sha256: 4c02c1e828171e7ed948a158850db8d185ce915dcd488e05eb5143ac157460bc
- span_id: ss_qianyuan_ed01_o0016550
  sequence: 632
  start_offset: 15996
  end_offset: 16020
  text: 居下位而好干上，嗜欲无厌，求索不止者，刑共杀之；
  quote_sha256: c92ce731b49e2310c48b5235890fea047b3b8c48194106bb6c58ed8c971dcc58
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16550
    raw_end: 16574
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 15996
    end_offset: 16020
    quote_sha256: c92ce731b49e2310c48b5235890fea047b3b8c48194106bb6c58ed8c971dcc58
- span_id: ss_qianyuan_ed01_o0016574
  sequence: 633
  start_offset: 16020
  end_offset: 16040
  text: 少以犯众，弱以侮强，忿不量力，兵共杀之。
  quote_sha256: 22d077044dbadffed2d8f93d69346318c2afcea90d8d77d4866f9db67864999d
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16574
    raw_end: 16594
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 16020
    end_offset: 16040
    quote_sha256: 22d077044dbadffed2d8f93d69346318c2afcea90d8d77d4866f9db67864999d
- span_id: ss_qianyuan_ed01_o0016594
  sequence: 634
  start_offset: 16040
  end_offset: 16062
  text: "」此三死者非其命也，人自取之。   \n   "
  quote_sha256: 04f8ba4625a97bdc919c761ee14b6597930230ffcc3715e0af93fcef42000a7d
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 16594
    raw_end: 16616
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 16040
    end_offset: 16062
