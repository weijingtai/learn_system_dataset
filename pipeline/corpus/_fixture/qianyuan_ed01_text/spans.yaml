  quote_sha256: f6793cfc291060e46e76e4a65a02a5b8c3869dd8d6ecc6364ca5a37945cdc87e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8772
    raw_end: 8790
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8218
    end_offset: 8236
    quote_sha256: f6793cfc291060e46e76e4a65a02a5b8c3869dd8d6ecc6364ca5a37945cdc87e
- span_id: ss_qianyuan_ed01_o0008790
  sequence: 349
  start_offset: 8236
  end_offset: 8254
