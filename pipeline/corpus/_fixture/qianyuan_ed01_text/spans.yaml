    start_offset: 4111
    end_offset: 4138
    quote_sha256: 38bd07a20ea74bb13161ea61f0bb0b53c872905e0db4ad7b8478bb5e9aeb6949
- span_id: ss_qianyuan_ed01_o0004692
  sequence: 207
  start_offset: 4138
  end_offset: 4173
  text: 试撮其大概言之，凡造历必造观天之器，自古观天者三家：周髀、宣夜、浑天。
  quote_sha256: 1aa31224d91b002a22528ba0fb7c27e18e7ca95f3541c712fb9b36a0a6bd4448
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 4692
    raw_end: 4727
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4138
    end_offset: 4173
    quote_sha256: 1aa31224d91b002a22528ba0fb7c27e18e7ca95f3541c712fb9b36a0a6bd4448
- span_id: ss_qianyuan_ed01_o0004727
  sequence: 208
  start_offset: 4173
  end_offset: 4262
  text: 周髀、宣夜多所违失，惟浑天为得其情，郭守敬循之，更为简仪、仰仪、悬坐、正坐诸器，乃用二线推测余分，测景之所凡二十有七，东极高丽、西至滇池、南逾珠崖、北尽铁勒，中法以天仪而尽地矣。
  quote_sha256: fadcb92fe6e4a6bc2eacfc8a92c84e924bb7e6eb8ae946885d3dbbe88753db46
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 4727
    raw_end: 4816
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4173
    end_offset: 4262
    quote_sha256: fadcb92fe6e4a6bc2eacfc8a92c84e924bb7e6eb8ae946885d3dbbe88753db46
- span_id: ss_qianyuan_ed01_o0004816
  sequence: 209
  start_offset: 4262
  end_offset: 4391
  text: 西法则增置测仪六式，曰象限悬仪、平面悬仪、象限立运仪、象限坐正仪、象限大仪、三直游仪，又有子午仪、黄赤全仪、弩仪、天环、天球等器，而最巧者无如远镜，用之能详日蚀分秒，能见太白上下弦，能见镇星为撱形，能见岁星旁四小星，能见鬼宿中之积尸气，能见天汉中之无算微星；
  quote_sha256: 7532519633a406f9ffaf462419054158227351126e8807bd22cfbfed3d0a5134
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 4816
    raw_end: 4945
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4262
    end_offset: 4391
    quote_sha256: 7532519633a406f9ffaf462419054158227351126e8807bd22cfbfed3d0a5134
- span_id: ss_qianyuan_ed01_o0004945
  sequence: 210
  start_offset: 4391
  end_offset: 4412
  text: "西法更以地仪而尽天，器之疏密不同矣。  \n"
  quote_sha256: b808d47f7ad24a3f17aa41fd46266919ce2e86b6b429a5ed120b46808758116b
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 4945
    raw_end: 4966
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4391
    end_offset: 4412
    quote_sha256: b808d47f7ad24a3f17aa41fd46266919ce2e86b6b429a5ed120b46808758116b
- span_id: ss_qianyuan_ed01_o0004966
  sequence: 211
  start_offset: 4412
  end_offset: 4438
  text: 中法以天为三百六十五度二十五分，度析百分，分析百秒；
  quote_sha256: ad5df1d1ea5c010526e96f6e8d94c6a6b32c4b00cd98de868303403230a6cbe4
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 4966
    raw_end: 4992
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4412
    end_offset: 4438
    quote_sha256: ad5df1d1ea5c010526e96f6e8d94c6a6b32c4b00cd98de868303403230a6cbe4
- span_id: ss_qianyuan_ed01_o0004992
  sequence: 212
  start_offset: 4438
  end_offset: 4462
  text: 西法则以三百六十平剖之，度析六十分，分析六十秒。
  quote_sha256: 01bd4d26ae715f8b94e9d4b90644d068f44fb5a080b552728c6741cee8960642
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 4992
    raw_end: 5016
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4438
    end_offset: 4462
    quote_sha256: 01bd4d26ae715f8b94e9d4b90644d068f44fb5a080b552728c6741cee8960642
- span_id: ss_qianyuan_ed01_o0005016
  sequence: 213
  start_offset: 4462
  end_offset: 4484
  text: 中法以一日为百刻，时各八刻，子午卯酉为九刻；
  quote_sha256: 73cc044d64fa878f2450def57760efaa34e454a81f18131865e0fe6d685282bd
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5016
    raw_end: 5038
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4462
    end_offset: 4484
    quote_sha256: 73cc044d64fa878f2450def57760efaa34e454a81f18131865e0fe6d685282bd
- span_id: ss_qianyuan_ed01_o0005038
  sequence: 214
  start_offset: 4484
  end_offset: 4516
  text: 西法则以齐之以九十六刻，减天之度，正日之刻，此又于疏之中寓密也。
  quote_sha256: 98b0d11a384a7a8f718fbe8fda9b128e9de6a35554a075d663a082be0a708797
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5038
    raw_end: 5070
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4484
    end_offset: 4516
    quote_sha256: 98b0d11a384a7a8f718fbe8fda9b128e9de6a35554a075d663a082be0a708797
- span_id: ss_qianyuan_ed01_o0005070
  sequence: 215
  start_offset: 4516
  end_offset: 4578
  text: 置闰之法，气盈朔虚，此其大纲，中法二十四气平分，每一节气十五日二十一刻有奇，积算每年所余十一日，三年所余三十三日，因而置润；
  quote_sha256: f659deac9e2013398e4d39f42377c2fd34a9e72c49de30e46b0865796718504e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5070
    raw_end: 5132
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4516
    end_offset: 4578
    quote_sha256: f659deac9e2013398e4d39f42377c2fd34a9e72c49de30e46b0865796718504e
- span_id: ss_qianyuan_ed01_o0005132
  sequence: 216
  start_offset: 4578
  end_offset: 4617
  text: 西法则云：冬夏不齐，冬一节气，十四日八十四刻有奇，夏一节气十五日七十二刻有奇。
  quote_sha256: bf6f63dc0221d7dd6b436d09024f17900d33edbd3294e18bbb9cfc5ba7f315f7
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5132
    raw_end: 5171
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4578
    end_offset: 4617
    quote_sha256: bf6f63dc0221d7dd6b436d09024f17900d33edbd3294e18bbb9cfc5ba7f315f7
- span_id: ss_qianyuan_ed01_o0005171
  sequence: 217
  start_offset: 4617
  end_offset: 4676
  text: 因日行距地远近不等，冬日距地远而行疾，夏日距地近而行迟，以此详算置闰，气朔分齐，无盈缩之差，其置闰视中法疏密为何如耶？
  quote_sha256: 9b12355470406b7d482dfaaaafb930dda48f6eb722b5248a136ae204b80e6aed
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5171
    raw_end: 5230
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4617
    end_offset: 4676
    quote_sha256: 9b12355470406b7d482dfaaaafb930dda48f6eb722b5248a136ae204b80e6aed
- span_id: ss_qianyuan_ed01_o0005230
  sequence: 218
  start_offset: 4676
  end_offset: 4696
  text: 岁差之法，则以日躔之所迁，验列宿之退数。
  quote_sha256: 37eb6b33b058979e4e448a48c5f9dce8b62ec3dd9333d93bf2200c244e1b326d
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5230
    raw_end: 5250
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4676
    end_offset: 4696
    quote_sha256: 37eb6b33b058979e4e448a48c5f9dce8b62ec3dd9333d93bf2200c244e1b326d
- span_id: ss_qianyuan_ed01_o0005250
  sequence: 219
  start_offset: 4696
  end_offset: 4716
  text: 古无差法，虞喜始立其法，以五十年差一度；
  quote_sha256: ac809339e278e62d63de1fd9e8dbc8679c4485241525de4aff6d0eb411db5782
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5250
    raw_end: 5270
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4696
    end_offset: 4716
    quote_sha256: ac809339e278e62d63de1fd9e8dbc8679c4485241525de4aff6d0eb411db5782
- span_id: ss_qianyuan_ed01_o0005270
  sequence: 220
  start_offset: 4716
  end_offset: 4727
  text: 何承天则以百年差一度；
  quote_sha256: b99b0eb6e9d371864ec33a27ab2616ffb882fccd25ffe38b44e5f5a5fb1a7750
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5270
    raw_end: 5281
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4716
    end_offset: 4727
    quote_sha256: b99b0eb6e9d371864ec33a27ab2616ffb882fccd25ffe38b44e5f5a5fb1a7750
- span_id: ss_qianyuan_ed01_o0005281
  sequence: 221
  start_offset: 4727
  end_offset: 4739
  text: 刘焯则以七十五年差一度；
  quote_sha256: 7a6a9a9253bf7f52377af27d4c4c12cc8535a6b0313d2149caef1f79d2f4f5b5
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5281
    raw_end: 5293
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4727
    end_offset: 4739
    quote_sha256: 7a6a9a9253bf7f52377af27d4c4c12cc8535a6b0313d2149caef1f79d2f4f5b5
- span_id: ss_qianyuan_ed01_o0005293
  sequence: 222
  start_offset: 4739
  end_offset: 4750
  text: 一行以八十三年差一度。
  quote_sha256: e40fbd4c23d37091f407d20f7dbf097fef0ef0b36bc1bc481b318cb20b726482
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5293
    raw_end: 5304
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4739
    end_offset: 4750
    quote_sha256: e40fbd4c23d37091f407d20f7dbf097fef0ef0b36bc1bc481b318cb20b726482
- span_id: ss_qianyuan_ed01_o0005304
  sequence: 223
  start_offset: 4750
  end_offset: 4809
  text: "中法始减周岁为三百六十五度二十四分五秒，加周天为三百六十五度二十五分七十五秒，以六十七年而差一度，视前为不同矣。  \n"
  quote_sha256: 298e6e9846e1b158a0172fa9db1092066f032b713945918db6d7192888bdc292
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5304
    raw_end: 5363
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4750
    end_offset: 4809
    quote_sha256: 298e6e9846e1b158a0172fa9db1092066f032b713945918db6d7192888bdc292
- span_id: ss_qianyuan_ed01_o0005363
  sequence: 224
  start_offset: 4809
  end_offset: 4876
  text: 西法详算列星，每年东行五十一秒，积七十年有奇而差一度，二千一百十七年有奇而差一宫，二万五千四百一十年有奇而东旋一周，西法岁差更不同焉。
  quote_sha256: 7c95367ee94b60019a4af8a075db6805ddf8324c5112e4e86af6c515e512eeb5
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5363
    raw_end: 5430
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4809
    end_offset: 4876
    quote_sha256: 7c95367ee94b60019a4af8a075db6805ddf8324c5112e4e86af6c515e512eeb5
- span_id: ss_qianyuan_ed01_o0005430
  sequence: 225
  start_offset: 4876
  end_offset: 4889
  text: 里差之法，为分省节气之刻；
  quote_sha256: 182c33bff81f66259e9bd3c6acdae56f61c77b30908ecbfd504d1d357063bc45
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5430
    raw_end: 5443
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4876
    end_offset: 4889
    quote_sha256: 182c33bff81f66259e9bd3c6acdae56f61c77b30908ecbfd504d1d357063bc45
- span_id: ss_qianyuan_ed01_o0005443
  sequence: 226
  start_offset: 4889
  end_offset: 4918
  text: 中法立表测景以求时刻，难为依据，即所测冬夏二至，犹未尽善；
  quote_sha256: 8dc428aee60dfd5f53aa39104a4ff7f91430e2067e5e8aac03bb6b0e9da45472
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5443
    raw_end: 5472
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4889
    end_offset: 4918
    quote_sha256: 8dc428aee60dfd5f53aa39104a4ff7f91430e2067e5e8aac03bb6b0e9da45472
- span_id: ss_qianyuan_ed01_o0005472
  sequence: 227
  start_offset: 4918
  end_offset: 4947
  text: 西法用八线表法，已为精细，且又有别法以相济，人莫窥其底蕴。
  quote_sha256: 8bfe5227aa69a96f62c4e3cf4043b29361c25d388b81492cdccd297f432d1ed6
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5472
    raw_end: 5501
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4918
    end_offset: 4947
    quote_sha256: 8bfe5227aa69a96f62c4e3cf4043b29361c25d388b81492cdccd297f432d1ed6
- span_id: ss_qianyuan_ed01_o0005501
  sequence: 228
  start_offset: 4947
  end_offset: 5024
  text: 西法里差密乎不密，异乎不异，以交蚀言之，日月之行由南北而纵分之谓之度，由东西而横截之谓之道，日行高而月行卑，若合朔之时，日与月同度同道，则日为月掩而日蚀；
  quote_sha256: 7ea603e839092d49fecf3efd176d090b61eaca85532b180ab10cf39ec3f38fb8
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5501
    raw_end: 5578
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4947
    end_offset: 5024
    quote_sha256: 7ea603e839092d49fecf3efd176d090b61eaca85532b180ab10cf39ec3f38fb8
- span_id: ss_qianyuan_ed01_o0005578
  sequence: 229
  start_offset: 5024
  end_offset: 5034
  text: 月本无光，借日之光；
  quote_sha256: b22516ebcb9fdae2eca53f2d566d0d8fa7b5238fca8355b0df913f0f2126ef9a
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5578
    raw_end: 5588
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5024
    end_offset: 5034
    quote_sha256: b22516ebcb9fdae2eca53f2d566d0d8fa7b5238fca8355b0df913f0f2126ef9a
- span_id: ss_qianyuan_ed01_o0005588
  sequence: 230
  start_offset: 5034
  end_offset: 5064
  text: 若对望之时，月与日对度对道，则月为日所，阳极 反亢，故蚀；
  quote_sha256: 981a2d415675597c5393534f0b3e8649cbbe7eeb72d420ff02991cbec265fa53
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5588
    raw_end: 5618
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5034
    end_offset: 5064
    quote_sha256: 981a2d415675597c5393534f0b3e8649cbbe7eeb72d420ff02991cbec265fa53
- span_id: ss_qianyuan_ed01_o0005618
  sequence: 231
  start_offset: 5064
  end_offset: 5088
  text: 凡交蚀分数总由同道对道之多寡，此中法西法之同也。
  quote_sha256: 492499f56e3b3da41212666fbf4f9fde49daf4a9292cbe4e69f80e1f6fa6ca9b
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5618
    raw_end: 5642
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5064
    end_offset: 5088
    quote_sha256: 492499f56e3b3da41212666fbf4f9fde49daf4a9292cbe4e69f80e1f6fa6ca9b
- span_id: ss_qianyuan_ed01_o0005642
  sequence: 232
  start_offset: 5088
  end_offset: 5125
  text: 至西法更谓月蚀则在日月正望，而地球介乎其间，月入地影中失其所借之光而为蚀；
  quote_sha256: 69ff6b8415a081d96962179d7b6edc84b26fb80909662214d35a015aa9592bf6
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5642
    raw_end: 5679
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5088
    end_offset: 5125
    quote_sha256: 69ff6b8415a081d96962179d7b6edc84b26fb80909662214d35a015aa9592bf6
- span_id: ss_qianyuan_ed01_o0005679
  sequence: 233
  start_offset: 5125
  end_offset: 5161
  text: 地在天中，其体微渺，寻常不能障隔日月，惟日月同在一线，乃为地所隔而成蚀；
  quote_sha256: 7492854efe5da86c2848f9cdfb25e5e93b94af0075f0881a8ca6f44c7a3acd5d
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5679
    raw_end: 5715
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5125
    end_offset: 5161
    quote_sha256: 7492854efe5da86c2848f9cdfb25e5e93b94af0075f0881a8ca6f44c7a3acd5d
- span_id: ss_qianyuan_ed01_o0005715
  sequence: 234
  start_offset: 5161
  end_offset: 5212
  text: 故中法谓太阳之体本有暗虚，月值之则遥夺其光，西法则谓月蚀仍名暗虚，为地所隔则暗而虚也，是月蚀又更异矣。
  quote_sha256: 2bb8565ad19d5b55392363df067ed842f0cdc11391e309ee27ede54cc91ff54b
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5715
    raw_end: 5766
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5161
    end_offset: 5212
    quote_sha256: 2bb8565ad19d5b55392363df067ed842f0cdc11391e309ee27ede54cc91ff54b
- span_id: ss_qianyuan_ed01_o0005766
  sequence: 235
  start_offset: 5212
  end_offset: 5237
  text: 刻漏之制，周礼挈壶氏掌之，孔壶谓之漏，浮箭谓之刻。
  quote_sha256: 11af86f7b4665ef635077a9154f4346aafc3908ae2f8058a1a201e3f0a71bf49
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5766
    raw_end: 5791
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5212
    end_offset: 5237
    quote_sha256: 11af86f7b4665ef635077a9154f4346aafc3908ae2f8058a1a201e3f0a71bf49
- span_id: ss_qianyuan_ed01_o0005791
  sequence: 236
  start_offset: 5237
  end_offset: 5255
  text: 浮箭壶、漏水壶名异而实同，中法因之。
  quote_sha256: 2af1fc957e5ca63fee813ceff7a4a8f26991db88c195b8c2111f44384fde8db1
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5791
    raw_end: 5809
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5237
    end_offset: 5255
    quote_sha256: 2af1fc957e5ca63fee813ceff7a4a8f26991db88c195b8c2111f44384fde8db1
- span_id: ss_qianyuan_ed01_o0005809
  sequence: 237
  start_offset: 5255
  end_offset: 5292
  text: 西法又有地平晷、百游晷、通光晷、十字晷，遇阴雨则有自呜钟，沙漏、水漏之制。
  quote_sha256: 891752f41a25ef3f072dcd29fd854acc3f04988f94038f211547e9b2f0ba371e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5809
    raw_end: 5846
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5255
    end_offset: 5292
    quote_sha256: 891752f41a25ef3f072dcd29fd854acc3f04988f94038f211547e9b2f0ba371e
- span_id: ss_qianyuan_ed01_o0005846
  sequence: 238
  start_offset: 5292
  end_offset: 5353
  text: 中法以水入壶而时箭浮，西法以水出壶而时牌出，壶体并不开孔，以节时分、定晨昏、考中星、拨晷景，无有差忒，刻漏视中法亦较密焉。
  quote_sha256: 3f1850efe0dcf0273259accd38904d908d16ef14ec76a98ad93548502c7af288
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5846
    raw_end: 5907
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5292
    end_offset: 5353
    quote_sha256: 3f1850efe0dcf0273259accd38904d908d16ef14ec76a98ad93548502c7af288
- span_id: ss_qianyuan_ed01_o0005907
  sequence: 239
  start_offset: 5353
  end_offset: 5402
  text: 惟历元之准于北极，推而上之，而章、而蔀、而纪、而元，东西两汉异而实同，中法、西法皆循之，无疏密也。
  quote_sha256: a578d0a9d9d70c24ccb5d0a76c51cdf725636896cfe04d44acca2c5578e2c91d
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5907
    raw_end: 5956
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5353
    end_offset: 5402
    quote_sha256: a578d0a9d9d70c24ccb5d0a76c51cdf725636896cfe04d44acca2c5578e2c91d
- span_id: ss_qianyuan_ed01_o0005956
  sequence: 240
  start_offset: 5402
  end_offset: 5439
  text: 至西法谓地如圆球，正居天中，日大于地，月小于地，五星大如月，尤振古所未闻。
  quote_sha256: 1c8d5f79bb8d5425598f7df9e7a93768eee819487fb8febdecd7fb22ebb09898
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5956
    raw_end: 5993
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5402
    end_offset: 5439
    quote_sha256: 1c8d5f79bb8d5425598f7df9e7a93768eee819487fb8febdecd7fb22ebb09898
- span_id: ss_qianyuan_ed01_o0005993
  sequence: 241
  start_offset: 5439
  end_offset: 5531
  text: 若其论恒星之南北差、赤黄道之疏密差、日与地之不同心差、七政之视差、日蚀之内三差外三差、月蚀时刻之里差以及悉月星之本次，轮调参觜之先后度，正罗计之误，元思至理，深切着明，中法不能赞词矣。
  quote_sha256: 00ccfbe441ecced52587ef73b9d03e2bd945987ae81fdccf5b7a7c0b6255ebcc
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 5993
    raw_end: 6085
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5439
    end_offset: 5531
    quote_sha256: 00ccfbe441ecced52587ef73b9d03e2bd945987ae81fdccf5b7a7c0b6255ebcc
- span_id: ss_qianyuan_ed01_o0006085
  sequence: 242
  start_offset: 5531
  end_offset: 5628
  text: "更用以三角八线之算，揆以均数自变量根数之法，天地之寒暑、日月之晦明、浑沦磅礴于太虚之表而不能出其范围，直可上接容成之统，远绍羲和之传，行之万世而可无敝，密莫密于此，异莫异于此。\
    \    \n    "
  quote_sha256: 82d571eac8a860802e40a21343d863109a429dd2a0b7f7c335f9b48de544fa16
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6085
    raw_end: 6182
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5531
    end_offset: 5628
    quote_sha256: 82d571eac8a860802e40a21343d863109a429dd2a0b7f7c335f9b48de544fa16
- span_id: ss_qianyuan_ed01_o0006182
  sequence: 243
  start_offset: 5628
  end_offset: 5680
  text: "有志者诚取预定之万年书，及当年之七政经纬躔度书，一一遵而行之，求其故而晰其微，庶几精算无余蕴矣。   \n"
  quote_sha256: 906fd684a154afc3f2c8720222b1dc3684acfcb88ef2591475587f2453119351
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6182
    raw_end: 6234
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5628
    end_offset: 5680
    quote_sha256: 906fd684a154afc3f2c8720222b1dc3684acfcb88ef2591475587f2453119351
- span_id: ss_qianyuan_ed01_o0006234
  sequence: 244
  start_offset: 5680
  end_offset: 5702
  text: 　　十二宫分度数相照隔六宫，一百八十度相。
  quote_sha256: 0dcb701d85aea43e792d2baa23738f4743023db75837632123e0aab0c339cd88
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6234
    raw_end: 6256
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5680
    end_offset: 5702
    quote_sha256: 0dcb701d85aea43e792d2baa23738f4743023db75837632123e0aab0c339cd88
- span_id: ss_qianyuan_ed01_o0006256
  sequence: 245
  start_offset: 5702
  end_offset: 5714
  text: 隔四宫，一百二十度三合。
  quote_sha256: 849909ef2702185f205c21fab87ca17c7ed1dacacae0e4b6350b33abfef40d82
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6256
    raw_end: 6268
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5702
    end_offset: 5714
    quote_sha256: 849909ef2702185f205c21fab87ca17c7ed1dacacae0e4b6350b33abfef40d82
- span_id: ss_qianyuan_ed01_o0006268
  sequence: 246
  start_offset: 5714
  end_offset: 5724
  text: 隔三宫，九十度二弦。
  quote_sha256: 8aa828d1fb5ee13125dd0cc7c9a9fdec90efe49c396a75950874c8ab74673401
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6268
    raw_end: 6278
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5714
    end_offset: 5724
    quote_sha256: 8aa828d1fb5ee13125dd0cc7c9a9fdec90efe49c396a75950874c8ab74673401
- span_id: ss_qianyuan_ed01_o0006278
  sequence: 247
  start_offset: 5724
  end_offset: 5738
  text: "隔二宫，六十度六合。   \n"
  quote_sha256: 452228a6f1cff5a84fe6603a78e5a553e85d4024a8b6bc4e85ce8f2cd852937c
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6278
    raw_end: 6292
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5724
    end_offset: 5738
    quote_sha256: 452228a6f1cff5a84fe6603a78e5a553e85d4024a8b6bc4e85ce8f2cd852937c
- span_id: ss_qianyuan_ed01_o0006292
  sequence: 248
  start_offset: 5738
  end_offset: 5758
  text: "　　立命生时加太阳上顺数至卯是。   \n"
  quote_sha256: c5caa2b6a2aea49d400fbd497cd055ea297bc809ed2a576f324a779132c00f87
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6292
    raw_end: 6312
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5738
    end_offset: 5758
    quote_sha256: c5caa2b6a2aea49d400fbd497cd055ea297bc809ed2a576f324a779132c00f87
- span_id: ss_qianyuan_ed01_o0006312
  sequence: 249
  start_offset: 5758
  end_offset: 5824
  text: "　　立度从太阳所躔之度，用量天尺直数至命宫某度是，即所谓络也，亦即对三合六合二弦之谓，特兼及三十度，一百五十度而其数益全。   \n"
  quote_sha256: 10b2fcd547b4d93358c0bc7f889574e0bdf351829151806eca6f06a4cd6780c1
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6312
    raw_end: 6378
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5758
    end_offset: 5824
    quote_sha256: 10b2fcd547b4d93358c0bc7f889574e0bdf351829151806eca6f06a4cd6780c1
- span_id: ss_qianyuan_ed01_o0006378
  sequence: 250
  start_offset: 5824
  end_offset: 5845
  text: 　　十二宫名目次序人以命为主，故命宫第一；
  quote_sha256: 06d365cef4f7775810268b3a7a29ebadcab162b06b1bda9bfe05ad6bacaaf4d2
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6378
    raw_end: 6399
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5824
    end_offset: 5845
    quote_sha256: 06d365cef4f7775810268b3a7a29ebadcab162b06b1bda9bfe05ad6bacaaf4d2
- span_id: ss_qianyuan_ed01_o0006399
  sequence: 251
  start_offset: 5845
  end_offset: 5856
  text: 财为养命之源，故次二；
  quote_sha256: c09fb08d49d15bcea38a1e2dc13f358add58044ae2052f97ebb8dcbb869a1c4e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6399
    raw_end: 6410
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5845
    end_offset: 5856
    quote_sha256: c09fb08d49d15bcea38a1e2dc13f358add58044ae2052f97ebb8dcbb869a1c4e
- span_id: ss_qianyuan_ed01_o0006410
  sequence: 252
  start_offset: 5856
  end_offset: 5868
  text: 分我之财曰兄弟，故次三；
  quote_sha256: a9e3109c416786eb6eb9c999f363bfcf98a8271bcc4fabe8db6295ee4abdbf33
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6410
    raw_end: 6422
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5856
    end_offset: 5868
    quote_sha256: a9e3109c416786eb6eb9c999f363bfcf98a8271bcc4fabe8db6295ee4abdbf33
- span_id: ss_qianyuan_ed01_o0006422
  sequence: 253
  start_offset: 5868
  end_offset: 5885
  text: 田宅所以安命藏财而居兄弟，故次四；
  quote_sha256: fc2a5b52f5df30270c41b9805557509a59b55b472cda9369a02451c676255281
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6422
    raw_end: 6439
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5868
    end_offset: 5885
    quote_sha256: fc2a5b52f5df30270c41b9805557509a59b55b472cda9369a02451c676255281
- span_id: ss_qianyuan_ed01_o0006439
  sequence: 254
  start_offset: 5885
  end_offset: 5910
  text: 既有财帛兄弟田宅，而男女所以承田与财者也，故次五；
  quote_sha256: 6ee17bb1f8c1605cc9e7df5f111e12c509dfdc2da257d0c87260df1f490e438d
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6439
    raw_end: 6464
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5885
    end_offset: 5910
    quote_sha256: 6ee17bb1f8c1605cc9e7df5f111e12c509dfdc2da257d0c87260df1f490e438d
- span_id: ss_qianyuan_ed01_o0006464
  sequence: 255
  start_offset: 5910
  end_offset: 5922
  text: 奴婢所以辅男女，故次六；
  quote_sha256: ef84b52fb664b5a6e25153e3a03b4f6ee770bd4d1d004103741ef2211db14e57
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6464
    raw_end: 6476
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5910
    end_offset: 5922
    quote_sha256: ef84b52fb664b5a6e25153e3a03b4f6ee770bd4d1d004103741ef2211db14e57
- span_id: ss_qianyuan_ed01_o0006476
  sequence: 256
  start_offset: 5922
  end_offset: 5937
  text: 妻妾敌体，与命宫对，故次七；
  quote_sha256: 36487e80e31257917827ef2f75f4b5a24962a5948e342fdd67c1ad283ce40e37
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6476
    raw_end: 6491
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5922
    end_offset: 5937
    quote_sha256: 36487e80e31257917827ef2f75f4b5a24962a5948e342fdd67c1ad283ce40e37
- span_id: ss_qianyuan_ed01_o0006491
  sequence: 257
  start_offset: 5937
  end_offset: 5948
  text: 疾厄人所难免，故次八；
  quote_sha256: 67941a2fe01845b5c37bd26b7998732212cbd6810429f4cb040ce9fd5c512f0a
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6491
    raw_end: 6502
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5937
    end_offset: 5948
    quote_sha256: 67941a2fe01845b5c37bd26b7998732212cbd6810429f4cb040ce9fd5c512f0a
- span_id: ss_qianyuan_ed01_o0006502
  sequence: 258
  start_offset: 5948
  end_offset: 5959
  text: 迁移人所常有，故次九；
  quote_sha256: afe60755e00e6b402c210da8c79f290cbe1edb64936c8fb1b10494aab7a33433
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6502
    raw_end: 6513
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5948
    end_offset: 5959
    quote_sha256: afe60755e00e6b402c210da8c79f290cbe1edb64936c8fb1b10494aab7a33433
- span_id: ss_qianyuan_ed01_o0006513
  sequence: 259
  start_offset: 5959
  end_offset: 5972
  text: 官禄夭之所予于人，故次十；
  quote_sha256: fbdfb3153425d41d409ee11e0fc514e869828099fdaeec7c16929b2c22f7e5a4
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6513
    raw_end: 6526
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5959
    end_offset: 5972
    quote_sha256: fbdfb3153425d41d409ee11e0fc514e869828099fdaeec7c16929b2c22f7e5a4
- span_id: ss_qianyuan_ed01_o0006526
  sequence: 260
  start_offset: 5972
  end_offset: 5986
  text: 福德人之所享于天，故次十一；
  quote_sha256: 4e584eb578c416ed6b4ca57d1b837920378db9bed80371ff4f930a1a807e8719
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6526
    raw_end: 6540
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5972
    end_offset: 5986
    quote_sha256: 4e584eb578c416ed6b4ca57d1b837920378db9bed80371ff4f930a1a807e8719
- span_id: ss_qianyuan_ed01_o0006540
  sequence: 261
  start_offset: 5986
  end_offset: 5998
  text: 相貌所以成身，故次十二。
  quote_sha256: 8bd7b0ea2d4d99776dab746b7de52ba3601f113f3827e83bb7e03f0f8204acda
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6540
    raw_end: 6552
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5986
    end_offset: 5998
    quote_sha256: 8bd7b0ea2d4d99776dab746b7de52ba3601f113f3827e83bb7e03f0f8204acda
- span_id: ss_qianyuan_ed01_o0006552
  sequence: 262
  start_offset: 5998
  end_offset: 6011
  text: 自命宫而至妻宫，其叙不乱；
  quote_sha256: 541a87783881f5b06a7073c9ccfec0dac32a7423488436143749f0057a44cc8b
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6552
    raw_end: 6565
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 5998
    end_offset: 6011
    quote_sha256: 541a87783881f5b06a7073c9ccfec0dac32a7423488436143749f0057a44cc8b
- span_id: ss_qianyuan_ed01_o0006565
  sequence: 263
  start_offset: 6011
  end_offset: 6027
  text: 自疾厄而至相貌，却乃倒置，何欤？
  quote_sha256: 9d017d164db8594f37ab29a44e9b8c3fde6ef609e948fdb07a6456a7bba60f25
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6565
    raw_end: 6581
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6011
    end_offset: 6027
    quote_sha256: 9d017d164db8594f37ab29a44e9b8c3fde6ef609e948fdb07a6456a7bba60f25
- span_id: ss_qianyuan_ed01_o0006581
  sequence: 264
  start_offset: 6027
  end_offset: 6049
  text: 命与妻相对，相貌福德官禄出天上，故列在命前；
  quote_sha256: 08b64feb0227202f6b0307ce723f4ffd93a945c729af9abc8cbac28e96ea0f51
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6581
    raw_end: 6603
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6027
    end_offset: 6049
    quote_sha256: 08b64feb0227202f6b0307ce723f4ffd93a945c729af9abc8cbac28e96ea0f51
- span_id: ss_qianyuan_ed01_o0006603
  sequence: 265
  start_offset: 6049
  end_offset: 6065
  text: 财帛兄弟田宅隐地下，故列在命后。
  quote_sha256: 774eb096dcd01a8fc9c9c2798349a0f6b7b1dfd3c8f9dc69eb4bbc9949cea95c
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6603
    raw_end: 6619
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6049
    end_offset: 6065
    quote_sha256: 774eb096dcd01a8fc9c9c2798349a0f6b7b1dfd3c8f9dc69eb4bbc9949cea95c
- span_id: ss_qianyuan_ed01_o0006619
  sequence: 266
  start_offset: 6065
  end_offset: 6114
  text: 有相貌才见福德，有福德才居官禄，有官禄才多迁移，才迁移才招疾厄，自相貌至疾厄，皆日月之喜升而恶沉；
  quote_sha256: 5395fb4a520865ff80579bd3e22f10b0bb1805eefc3bd732e471dce1ef4b42ea
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6619
    raw_end: 6668
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6065
    end_offset: 6114
    quote_sha256: 5395fb4a520865ff80579bd3e22f10b0bb1805eefc3bd732e471dce1ef4b42ea
- span_id: ss_qianyuan_ed01_o0006668
  sequence: 267
  start_offset: 6114
  end_offset: 6163
  text: 有财帛应分兄弟，有兄弟应剖田宅，有田宅应归男女，有男女应用奴仆，自财帛至奴仆，皆日月之右转而分布。
  quote_sha256: 8782b8dab24459eddeebcb0f6d3dfba33e9c89dc6708cffc4a6ecb95bc90c1e8
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6668
    raw_end: 6717
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6114
    end_offset: 6163
    quote_sha256: 8782b8dab24459eddeebcb0f6d3dfba33e9c89dc6708cffc4a6ecb95bc90c1e8
- span_id: ss_qianyuan_ed01_o0006717
  sequence: 268
  start_offset: 6163
  end_offset: 6187
  text: "此十二宫之立，而人之所以为生，尽在是矣。   \n"
  quote_sha256: a86d9895c6c743f492ab1ea3b255d21bf241cb8e33baf23ddcc2083a230084f2
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6717
    raw_end: 6741
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6163
    end_offset: 6187
    quote_sha256: a86d9895c6c743f492ab1ea3b255d21bf241cb8e33baf23ddcc2083a230084f2
- span_id: ss_qianyuan_ed01_o0006741
  sequence: 269
  start_offset: 6187
  end_offset: 6243
  text: 　　限年命与禄十有五，福与妻十有一，田宅子孙各四年半，而奴仆随之，财帛兄弟各五，而相貌独十年，疾厄迁移退以七八。
  quote_sha256: 53858081a85be7020994e1cbd16755fc77ab5240e5c59f5df2a4deeaba7135d9
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6741
    raw_end: 6797
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6187
    end_offset: 6243
    quote_sha256: 53858081a85be7020994e1cbd16755fc77ab5240e5c59f5df2a4deeaba7135d9
- span_id: ss_qianyuan_ed01_o0006797
  sequence: 270
  start_offset: 6243
  end_offset: 6290
  text: 其所以若此者，子午卯酉居阴阳之中位，命禄妻田为四正宫，管四十五年有奇，乃含洛书四十有五之妙也；
  quote_sha256: d873a66e2e1c6158a9dbe571af5c98aa4eef875266f3affb90e21bbaea5355f1
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6797
    raw_end: 6844
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6243
    end_offset: 6290
    quote_sha256: d873a66e2e1c6158a9dbe571af5c98aa4eef875266f3affb90e21bbaea5355f1
- span_id: ss_qianyuan_ed01_o0006844
  sequence: 271
  start_offset: 6290
  end_offset: 6333
  text: "寅申巳亥辰戌丑未八宫，当阴阳终始之地，管五十五年无奇，乃具河图五十有五之妙也。   \n"
  quote_sha256: 35075c14d094b5ec76204eb540044518e23dd61a55b245332d458e40f44506c6
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6844
    raw_end: 6887
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6290
    end_offset: 6333
    quote_sha256: 35075c14d094b5ec76204eb540044518e23dd61a55b245332d458e40f44506c6
- span_id: ss_qianyuan_ed01_o0006887
  sequence: 272
  start_offset: 6333
  end_offset: 6353
  text: 　　出童限行大限童限管十五年，此其常也。
  quote_sha256: 87c086c099ef038d2c50d111c2f67a18997404eebfd88a35a400ce4de7cd22d0
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6887
    raw_end: 6907
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6333
    end_offset: 6353
    quote_sha256: 87c086c099ef038d2c50d111c2f67a18997404eebfd88a35a400ce4de7cd22d0
- span_id: ss_qianyuan_ed01_o0006907
  sequence: 273
  start_offset: 6353
  end_offset: 6389
  text: 不及则十岁后即出，太过则二十岁才出，总查太阳过宫之浅深，以定行限之迟早。
  quote_sha256: efe68d5af8be4bbc7ee5b17af463cf908fb5aee9246ca5cc6bfbd9be171d5ceb
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6907
    raw_end: 6943
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6353
    end_offset: 6389
    quote_sha256: efe68d5af8be4bbc7ee5b17af463cf908fb5aee9246ca5cc6bfbd9be171d5ceb
- span_id: ss_qianyuan_ed01_o0006943
  sequence: 274
  start_offset: 6389
  end_offset: 6413
  text: 太阳过宫三日管一年，三十日管十年，须扣算实数起；
  quote_sha256: 2097aa7238910eb6694532cddfbb5d727270b61aa48d6f5897e233f6dba0006f
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6943
    raw_end: 6967
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6389
    end_offset: 6413
    quote_sha256: 2097aa7238910eb6694532cddfbb5d727270b61aa48d6f5897e233f6dba0006f
- span_id: ss_qianyuan_ed01_o0006967
  sequence: 275
  start_offset: 6413
  end_offset: 6436
  text: 倘未满三日，只二日零六个时，即十岁十个月行限。
  quote_sha256: bf8ee60e3ce3953484ee5087796b4d4666967968e9222d4b06f6a2726b57f3a4
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6967
    raw_end: 6990
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6413
    end_offset: 6436
    quote_sha256: bf8ee60e3ce3953484ee5087796b4d4666967968e9222d4b06f6a2726b57f3a4
- span_id: ss_qianyuan_ed01_o0006990
  sequence: 276
  start_offset: 6436
  end_offset: 6475
  text: 如七月初一生，必至十一岁六月三十满十岁，再加十个月，行限则十二岁五月初一才起。
  quote_sha256: 8ef67fd29079bf6144a9b1c7f8c38b455facc5486868533d856671b4de3aa136
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 6990
    raw_end: 7029
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6436
    end_offset: 6475
    quote_sha256: 8ef67fd29079bf6144a9b1c7f8c38b455facc5486868533d856671b4de3aa136
- span_id: ss_qianyuan_ed01_o0007029
  sequence: 277
  start_offset: 6475
  end_offset: 6500
  text: 倘将满三十日，只缺少九个时，即十九岁零九个月行限。
  quote_sha256: 179d26d78c11f7bc3869b6493f5025db67385081ffd541380c657b958ef28616
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7029
    raw_end: 7054
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6475
    end_offset: 6500
    quote_sha256: 179d26d78c11f7bc3869b6493f5025db67385081ffd541380c657b958ef28616
- span_id: ss_qianyuan_ed01_o0007054
  sequence: 278
  start_offset: 6500
  end_offset: 6545
  text: "如六月初十生，必至二十岁六月初九满十九岁，再加九个月，行限则二十一岁三月初十才起。   \n"
  quote_sha256: ed7660cb0b7ab0352a403efae791023e43f66401156fccf5b0b05c199ee9916a
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7054
    raw_end: 7099
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6500
    end_offset: 6545
    quote_sha256: ed7660cb0b7ab0352a403efae791023e43f66401156fccf5b0b05c199ee9916a
- span_id: ss_qianyuan_ed01_o0007099
  sequence: 279
  start_offset: 6545
  end_offset: 6556
  text: "　　定命      \n"
  quote_sha256: e41549ff9da7ed1fdb679b63730f300629c118349f76eaa21053b0eb2af6009a
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7099
    raw_end: 7110
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6545
    end_offset: 6556
    quote_sha256: e41549ff9da7ed1fdb679b63730f300629c118349f76eaa21053b0eb2af6009a
- span_id: ss_qianyuan_ed01_o0007110
  sequence: 280
  start_offset: 6556
  end_offset: 6620
  text: "    定命专论宫，果老论度固不可以，即另立度主亦在所不必，但看度之经纬、贯串以卜休咎而已，至于身主尤属泛泛，皆所宜削。   \n"
  quote_sha256: c4336e6158f980c922b5b77b05ca0fb9ee515941b8952f9ee957b6ac16c7ad32
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7110
    raw_end: 7174
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6556
    end_offset: 6620
    quote_sha256: c4336e6158f980c922b5b77b05ca0fb9ee515941b8952f9ee957b6ac16c7ad32
- span_id: ss_qianyuan_ed01_o0007174
  sequence: 281
  start_offset: 6620
  end_offset: 6631
  text: "　　行限      \n"
  quote_sha256: 986690a6ce941bb44464a385a45a2972190655b83db0c35a193d35110af4060a
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7174
    raw_end: 7185
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6620
    end_offset: 6631
    quote_sha256: 986690a6ce941bb44464a385a45a2972190655b83db0c35a193d35110af4060a
- span_id: ss_qianyuan_ed01_o0007185
  sequence: 282
  start_offset: 6631
  end_offset: 6676
  text: '    行限专论度，如寅宫有房心尾箕四度，行房以日论，行心以月论，行尾以火论，行箕以水论。'
  quote_sha256: a4063e6890437787c69e5c187451f52b43352ba7ee939808ee8c6adbc8537ae5
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7185
    raw_end: 7230
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6631
    end_offset: 6676
    quote_sha256: a4063e6890437787c69e5c187451f52b43352ba7ee939808ee8c6adbc8537ae5
- span_id: ss_qianyuan_ed01_o0007230
  sequence: 283
  start_offset: 6676
  end_offset: 6702
  text: 若又论宫之为木，则金躔尾，顾不受火克而反云克木可乎？
  quote_sha256: e9d20ecb98e1efca96a9694eb0a367993f5bc17a5b9f57fb6db1823f3839dddb
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7230
    raw_end: 7256
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6676
    end_offset: 6702
    quote_sha256: e9d20ecb98e1efca96a9694eb0a367993f5bc17a5b9f57fb6db1823f3839dddb
- span_id: ss_qianyuan_ed01_o0007256
  sequence: 284
  start_offset: 6702
  end_offset: 6753
  text: "卯宫有亢氐二度，行亢以金论，行氐以土论，若又论宫之为火，则金躔氐，顾不受土生，而反云火克可乎？   \n"
  quote_sha256: a1fcf484f800bd09e557ee5a9eca76c7d66886d6711798d1316eef99dd4cdc48
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7256
    raw_end: 7307
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6702
    end_offset: 6753
    quote_sha256: a1fcf484f800bd09e557ee5a9eca76c7d66886d6711798d1316eef99dd4cdc48
- span_id: ss_qianyuan_ed01_o0007307
  sequence: 285
  start_offset: 6753
  end_offset: 6764
  text: "　　命主      \n"
  quote_sha256: c2bb0655ca6af3d000ae3a1cf8925c5f077376b009518d03c4e67475a1e242b7
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7307
    raw_end: 7318
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6753
    end_offset: 6764
    quote_sha256: c2bb0655ca6af3d000ae3a1cf8925c5f077376b009518d03c4e67475a1e242b7
- span_id: ss_qianyuan_ed01_o0007318
  sequence: 286
  start_offset: 6764
  end_offset: 6828
  text: '    命主总在得时得地但左右无相克者，有相生者更优游自如，尤须朝阳近吉，或作阳引，或作阳从，或有吉神引，或有吉神从，皆主贵显；'
  quote_sha256: 7f5c3fe1d60026746d2f053fbcc2ec964b29c0b3fd6f8b3f36e261b23589ab02
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7318
    raw_end: 7382
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6764
    end_offset: 6828
    quote_sha256: 7f5c3fe1d60026746d2f053fbcc2ec964b29c0b3fd6f8b3f36e261b23589ab02
- span_id: ss_qianyuan_ed01_o0007382
  sequence: 287
  start_offset: 6828
  end_offset: 6839
  text: 若凶神引从，便以祸论。
  quote_sha256: 8261a886ecd320d9da93f0388b725b3125c9173c33d744a6ba415e27186bfc6a
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7382
    raw_end: 7393
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6828
    end_offset: 6839
    quote_sha256: 8261a886ecd320d9da93f0388b725b3125c9173c33d744a6ba415e27186bfc6a
- span_id: ss_qianyuan_ed01_o0007393
  sequence: 288
  start_offset: 6839
  end_offset: 6858
  text: 如吉凶神均不引从，则专看经络贯串等矣。
  quote_sha256: f0652c5a3a5e1d7f4f199dbeb6d468bfa381d8e3c2ead52e983215d4c9ba0d4f
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7393
    raw_end: 7412
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6839
    end_offset: 6858
    quote_sha256: f0652c5a3a5e1d7f4f199dbeb6d468bfa381d8e3c2ead52e983215d4c9ba0d4f
- span_id: ss_qianyuan_ed01_o0007412
  sequence: 289
  start_offset: 6858
  end_offset: 6881
  text: "倘有盘合全格而不贵者，皆由主星失之也。   \n"
  quote_sha256: 03c5e6534a5ae4bfde21ed275976c8be4cfe0bb569dcfc3e9b4301729f7d716d
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7412
    raw_end: 7435
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6858
    end_offset: 6881
    quote_sha256: 03c5e6534a5ae4bfde21ed275976c8be4cfe0bb569dcfc3e9b4301729f7d716d
- span_id: ss_qianyuan_ed01_o0007435
  sequence: 290
  start_offset: 6881
  end_offset: 6887
  text: "　　经  \n"
  quote_sha256: 68d8f4d5c342f0b53d6c07a467bb57a472951ed361719492563bcc892c4d835e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7435
    raw_end: 7441
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6881
    end_offset: 6887
    quote_sha256: 68d8f4d5c342f0b53d6c07a467bb57a472951ed361719492563bcc892c4d835e
- span_id: ss_qianyuan_ed01_o0007441
  sequence: 291
  start_offset: 6887
  end_offset: 6948
  text: '    经者四经，如箕参轸壁、井角斗奎、尾窒觜翼、亢牛娄鬼、氐女胃柳、房虚昴星、心危毕张，在天同为一气，故宫神皆暗相管摄。'
  quote_sha256: 36ce58a390ef4e578d841df82aedfddb50765addb80cb40e8d7663eaedc3abaf
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7441
    raw_end: 7502
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6887
    end_offset: 6948
    quote_sha256: 36ce58a390ef4e578d841df82aedfddb50765addb80cb40e8d7663eaedc3abaf
- span_id: ss_qianyuan_ed01_o0007502
  sequence: 292
  start_offset: 6948
  end_offset: 6963
  text: 命主在箕，吉星在箕，固是同经；
  quote_sha256: 761ae83e545f343fc2d78ef11fc5d4d57f396dc78b935a3c5f7d58ace54a5bde
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7502
    raw_end: 7517
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6948
    end_offset: 6963
    quote_sha256: 761ae83e545f343fc2d78ef11fc5d4d57f396dc78b935a3c5f7d58ace54a5bde
- span_id: ss_qianyuan_ed01_o0007517
  sequence: 293
  start_offset: 6963
  end_offset: 6985
  text: 命主在箕，吉星在参轸壁，亦系同经，应无不利。
  quote_sha256: 6e73527d5b33d3510309fde43b3a388467e6f0dccd0f30c2dc4c6e7da9b1515c
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7517
    raw_end: 7539
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6963
    end_offset: 6985
    quote_sha256: 6e73527d5b33d3510309fde43b3a388467e6f0dccd0f30c2dc4c6e7da9b1515c
- span_id: ss_qianyuan_ed01_o0007539
  sequence: 294
  start_offset: 6985
  end_offset: 7001
  text: "反是而为凶曜，害亦如之。   \n"
  quote_sha256: 6b7dfa4516fa0c35e1a161a69f9000a3b611d693461e339f473abc0be0a0ea5d
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7539
    raw_end: 7555
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 6985
    end_offset: 7001
    quote_sha256: 6b7dfa4516fa0c35e1a161a69f9000a3b611d693461e339f473abc0be0a0ea5d
- span_id: ss_qianyuan_ed01_o0007555
  sequence: 295
  start_offset: 7001
  end_offset: 7007
  text: "　　络  \n"
  quote_sha256: de62648ad0dcffeff7c7c0343d13c88669a7c0e955f87bd31bcd23cd4b44eaca
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7555
    raw_end: 7561
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7001
    end_offset: 7007
    quote_sha256: de62648ad0dcffeff7c7c0343d13c88669a7c0e955f87bd31bcd23cd4b44eaca
- span_id: ss_qianyuan_ed01_o0007561
  sequence: 296
  start_offset: 7007
  end_offset: 7053
  text: '    络者宫度对也，即对冲三合二弦六合之谓，而兼及三十度、一百五十度，所以立度者即此道也。'
  quote_sha256: cecfbc3d67485b5799aaad76dc9017bc117334e694ac6a6242cf584db3a66b11
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7561
    raw_end: 7607
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7007
    end_offset: 7053
    quote_sha256: cecfbc3d67485b5799aaad76dc9017bc117334e694ac6a6242cf584db3a66b11
- span_id: ss_qianyuan_ed01_o0007607
  sequence: 297
  start_offset: 7053
  end_offset: 7133
  text: 一气相通最为亲切，即以日月论，日昼夜行一度，月昼夜行十二三四度不等，月与日同宫同度则合朔，离日九十度则上弦，离日一百八十度则望，近日九十度又下弦，非即络之谓欤？
  quote_sha256: 8eae6ee8a04060e33a18b8b054b3fe4ebe4edc764d5077e54f687fd51cf5d441
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7607
    raw_end: 7687
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7053
    end_offset: 7133
    quote_sha256: 8eae6ee8a04060e33a18b8b054b3fe4ebe4edc764d5077e54f687fd51cf5d441
- span_id: ss_qianyuan_ed01_o0007687
  sequence: 298
  start_offset: 7133
  end_offset: 7146
  text: 诸星之互相感通，何独不然？
  quote_sha256: ea97185fe0f8788e61385c7e66dd2e7637a740df5434efdcaa29914da8ad77e6
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7687
    raw_end: 7700
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7133
    end_offset: 7146
    quote_sha256: ea97185fe0f8788e61385c7e66dd2e7637a740df5434efdcaa29914da8ad77e6
- span_id: ss_qianyuan_ed01_o0007700
  sequence: 299
  start_offset: 7146
  end_offset: 7168
  text: "故命主与吉凶星络对而荣枯立判。  \n    "
  quote_sha256: d364f3e3bb9a340278d862255a121a27359e354f70b6fa91e871a7f1cdea3795
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7700
    raw_end: 7722
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7146
    end_offset: 7168
    quote_sha256: d364f3e3bb9a340278d862255a121a27359e354f70b6fa91e871a7f1cdea3795
- span_id: ss_qianyuan_ed01_o0007722
  sequence: 300
  start_offset: 7168
  end_offset: 7172
  text: "贯  \n"
  quote_sha256: 000578a2fa565c2b5be062defd7465b87d7a6887ad5fd18da71707f1b6fd1f91
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7722
    raw_end: 7726
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7168
    end_offset: 7172
    quote_sha256: 000578a2fa565c2b5be062defd7465b87d7a6887ad5fd18da71707f1b6fd1f91
- span_id: ss_qianyuan_ed01_o0007726
  sequence: 301
  start_offset: 7172
  end_offset: 7190
  text: '    贯者，他星与命度共为一经也。'
  quote_sha256: 577175d68de3460dd3c0fe4759796fbe65821212e9ada6fd41773bfe053512d8
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7726
    raw_end: 7744
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7172
    end_offset: 7190
    quote_sha256: 577175d68de3460dd3c0fe4759796fbe65821212e9ada6fd41773bfe053512d8
- span_id: ss_qianyuan_ed01_o0007744
  sequence: 302
  start_offset: 7190
  end_offset: 7204
  text: 如命与度是火，他星即火之类。
  quote_sha256: 114389bac88d3926655bfee1426c8769fc4eb96a689f93eaff5c038b58688153
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7744
    raw_end: 7758
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7190
    end_offset: 7204
    quote_sha256: 114389bac88d3926655bfee1426c8769fc4eb96a689f93eaff5c038b58688153
- span_id: ss_qianyuan_ed01_o0007758
  sequence: 303
  start_offset: 7204
  end_offset: 7229
  text: "分衰旺不分同异，吉星自亨，凶星自蹇。 \n\n    "
  quote_sha256: 8478313a0437bf380ed31336814c3aba02eaa91309b70a83343c319077ccac8e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7758
    raw_end: 7783
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7204
    end_offset: 7229
    quote_sha256: 8478313a0437bf380ed31336814c3aba02eaa91309b70a83343c319077ccac8e
- span_id: ss_qianyuan_ed01_o0007783
  sequence: 304
  start_offset: 7229
  end_offset: 7237
  text: "串      \n"
  quote_sha256: 033c045184c20e5aa91146e894898810aeca83c216959606d6ae13d1c31c7753
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7783
    raw_end: 7791
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7229
    end_offset: 7237
    quote_sha256: 033c045184c20e5aa91146e894898810aeca83c216959606d6ae13d1c31c7753
- span_id: ss_qianyuan_ed01_o0007791
  sequence: 305
  start_offset: 7237
  end_offset: 7253
  text: '    串者，在立命立度之度也。'
  quote_sha256: 2d62162f1995cfdfb8ad66ba3049000279a324925f82934b5fc9a6e81f14b198
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7791
    raw_end: 7807
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7237
    end_offset: 7253
    quote_sha256: 2d62162f1995cfdfb8ad66ba3049000279a324925f82934b5fc9a6e81f14b198
- span_id: ss_qianyuan_ed01_o0007807
  sequence: 306
  start_offset: 7253
  end_offset: 7267
  text: 如命是木，他星即躔角斗奎井；
  quote_sha256: ada1d1cc3f888d0b6dda99e5a0de5fd49e2844a4ad55c11b14f860f6b9c71290
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 7807
    raw_end: 7821
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7253
    end_offset: 7267
