- span_id: ss_qianyuan_ed01_o0010241
  sequence: 419
  start_offset: 9687
  end_offset: 9705
  text: 与子星有关，子星又不得气，每每绝嗣；
  quote_sha256: eb5d958eac82457ab3943743ff3375ae51815cd34f3443b8c0d3a45c9b2942c5
  evidence_level: offset_level
  source_anchor:
