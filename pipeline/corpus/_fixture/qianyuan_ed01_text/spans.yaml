- span_id: ss_qianyuan_ed01_o0010479
  sequence: 430
  start_offset: 9925
  end_offset: 9973
  text: "引从者吉，则外贵乎空，挈提者凶，则内喜乎善，吉凶扶阳势，余奴亦足敌杀，安亦恒不在恩也。   \n"
  quote_sha256: bc6a8b5a8bebd6f35332dc1605dfa317e6aec9b273f05c2a74b3e65ed71d638e
