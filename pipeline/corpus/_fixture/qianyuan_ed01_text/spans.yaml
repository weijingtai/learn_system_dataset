- span_id: ss_qianyuan_ed01_o0011702
  sequence: 488
  start_offset: 11148
  end_offset: 11162
  text: 水又是刃煞，三方无救，多凶。
  quote_sha256: 2007ce1781f32e9605835eea858fc3276a9d3897a0b4df60e94ad05d6de7b65b
  evidence_level: offset_level
  source_anchor:
