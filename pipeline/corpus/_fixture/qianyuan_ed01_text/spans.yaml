    start_offset: 11162
    end_offset: 11195
    quote_sha256: 012a0ac13e92289747caacafdd4e2eaa01a9ef747e55594229a00318e2cccadd
- span_id: ss_qianyuan_ed01_o0011749
  sequence: 490
  start_offset: 11195
  end_offset: 11225
  text: 如火为伤劫煞，正喜其犯原水、遇流水，喜其能制之也，故须活看。
  quote_sha256: b13a800c582b0428a80b3a2a8a599872ac617fdb9cf6e5f7209b1fdde171236b
  evidence_level: offset_level
  source_anchor:
