  sequence: 3
  start_offset: 21
  end_offset: 38
  text: ' 《楚词》言：阛则九重，孰营度之？'
  quote_sha256: 29d104574abfe8ea7199cbd8d061be3912055973d690edfeb03e28c6d30dbc51
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
