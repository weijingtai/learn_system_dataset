  sequence: 432
  start_offset: 9980
  end_offset: 10029
  text: '    官福皆分宫挨定，原非无理，但按之似近于泛，不如从年干上径用天官等星，神明变化而不离乎其宗。'
  quote_sha256: d61e0119dd0850e9ac6b73bca75926f23279dae5f3ddee53bd2e73448a32e474
