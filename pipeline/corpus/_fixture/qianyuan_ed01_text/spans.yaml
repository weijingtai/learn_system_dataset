  sequence: 663
  start_offset: 16617
  end_offset: 16673
  text: 有庚年人行奎木煞度居大位掌重权者，查原木与气照已经合化，天官金与太阳俱在斗躔，则奎木乃天官与太阳 贵气所通故也。
  quote_sha256: 0a5ded7540a70361af7591bfc70bc0cd4ff98f6df1924b33095281146bd212de
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
