    raw_end: 12074
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11496
    end_offset: 11520
    quote_sha256: e0f26bd56fe792e8211817de5deb29109ddd4358d35df7f50fc3807b2f976741
