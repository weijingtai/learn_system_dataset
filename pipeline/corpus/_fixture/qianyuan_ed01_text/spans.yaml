    raw_start: 13011
    raw_end: 13017
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12457
    end_offset: 12463
    quote_sha256: b6e73377c87fec0fb4b13781e94de3ba4d2a1de5650a4824d8c8ea980de679fc
- span_id: ss_qianyuan_ed01_o0013017
  sequence: 530
  start_offset: 12463
  end_offset: 12525
  text: ' 　　余论是书成而星命之理昭然可?矣，然亦有书不尽言，言不尽意之憾，所望好学深思者辟彼邪说，循此正规，引而伸之，触类而长之。'
  quote_sha256: c74ebab8107b21cace0482586a61e7a97b98190a35c35da795582da7887e7665
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13017
    raw_end: 13079
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12463
    end_offset: 12525
    quote_sha256: c74ebab8107b21cace0482586a61e7a97b98190a35c35da795582da7887e7665
- span_id: ss_qianyuan_ed01_o0013079
  sequence: 531
  start_offset: 12525
  end_offset: 12541
  text: 盖入微之旨，可以意会不可以言传。
  quote_sha256: bde8462ef470e1ad3ae5d4cb81e8e6017991fe330e2528717198682388e7cb34
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13079
    raw_end: 13095
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12525
    end_offset: 12541
    quote_sha256: bde8462ef470e1ad3ae5d4cb81e8e6017991fe330e2528717198682388e7cb34
- span_id: ss_qianyuan_ed01_o0013095
  sequence: 532
  start_offset: 12541
  end_offset: 12565
  text: "若必欲一一遍及焉，虽累牍盈编，岂有竟乎？   \n"
  quote_sha256: 46e6171e40eee02d47fd88832efa5f9f841ba047eafe739fe1102b71bccf6202
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13095
    raw_end: 13119
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12541
    end_offset: 12565
    quote_sha256: 46e6171e40eee02d47fd88832efa5f9f841ba047eafe739fe1102b71bccf6202
- span_id: ss_qianyuan_ed01_o0013119
  sequence: 533
  start_offset: 12565
  end_offset: 12579
  text: 　　黄赤俱差，甚至前后易次；
  quote_sha256: bedc571033c56b2296bcecc5cfba3908abd92b47827b14386c39915b2a344a42
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13119
    raw_end: 13133
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12565
    end_offset: 12579
    quote_sha256: bedc571033c56b2296bcecc5cfba3908abd92b47827b14386c39915b2a344a42
- span_id: ss_qianyuan_ed01_o0013133
  sequence: 534
  start_offset: 12579
  end_offset: 12629
  text: 觜宿距星，汉测距参二度，唐测一度，宋祟宁测半度，元郭守敬测五分，明测之不啻无分，且侵入参宿二十四分。
  quote_sha256: 8b0e1d89b37fd1c642ff6f0edd79d1cbb085e3d994474e9e233e7d3138655d3f
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13133
    raw_end: 13183
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12579
    end_offset: 12629
    quote_sha256: 8b0e1d89b37fd1c642ff6f0edd79d1cbb085e3d994474e9e233e7d3138655d3f
- span_id: ss_qianyuan_ed01_o0013183
  sequence: 535
  start_offset: 12629
  end_offset: 12647
  text: 故旧法先觜后参，今不得不先参后觜也。
  quote_sha256: a548ceb070ed1bf1452f517258f2e723c60c307be1f8f79eab2a62311071835c
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13183
    raw_end: 13201
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12629
    end_offset: 12647
    quote_sha256: a548ceb070ed1bf1452f517258f2e723c60c307be1f8f79eab2a62311071835c
- span_id: ss_qianyuan_ed01_o0013201
  sequence: 536
  start_offset: 12647
  end_offset: 12678
  text: 罗喉计都生于日月交行，谓之天首天尾，中法以天首属罗，天尾属计；
  quote_sha256: be9e902bd09d5c355c1628b4722fa770455d090f56309050a7c0df72ff21c572
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13201
    raw_end: 13232
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12647
    end_offset: 12678
    quote_sha256: be9e902bd09d5c355c1628b4722fa770455d090f56309050a7c0df72ff21c572
- span_id: ss_qianyuan_ed01_o0013232
  sequence: 537
  start_offset: 12678
  end_offset: 12734
  text: 西法改而易之，遂以罗为尾，计为首，爰自利玛窦等入中土，与明宰辅徐光启等所裁定，后有作者皆莫之及，应不可轻议纷更。
  quote_sha256: 3d14a855717981875d7c573ea7747626e2001b898dfaad4b1de80c500fd6940a
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13232
    raw_end: 13288
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12678
    end_offset: 12734
    quote_sha256: 3d14a855717981875d7c573ea7747626e2001b898dfaad4b1de80c500fd6940a
- span_id: ss_qianyuan_ed01_o0013288
  sequence: 538
  start_offset: 12734
  end_offset: 12765
  text: 恒星之行即古岁差之度，古谓恒星千古不移，而黄度之节气每岁西退。
  quote_sha256: 75c038d4b80da849535605fe73dc958e5bfa5d722c0f2bc8947c90ac8654eca4
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13288
    raw_end: 13319
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12734
    end_offset: 12765
    quote_sha256: 75c038d4b80da849535605fe73dc958e5bfa5d722c0f2bc8947c90ac8654eca4
- span_id: ss_qianyuan_ed01_o0013319
  sequence: 539
  start_offset: 12765
  end_offset: 12784
  text: 西法则谓黄道终古不动，而恒星每岁东行。
  quote_sha256: 5ca7d1ef02c14c4cd64ce67649eb30a9c8daba35d6cc6bdfd638cd69faffb864
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13319
    raw_end: 13338
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12765
    end_offset: 12784
    quote_sha256: 5ca7d1ef02c14c4cd64ce67649eb30a9c8daba35d6cc6bdfd638cd69faffb864
- span_id: ss_qianyuan_ed01_o0013338
  sequence: 540
  start_offset: 12784
  end_offset: 12863
  text: 由今考之，恒星实有动移，其说不谬，故各宫皆有歧度，如角十歧辰卯，房初歧卯寅之类，数十年后歧者便当尽移，须逐年挨查，一以钦天监七政经纬躔度书为准，不可草率迁就。
  quote_sha256: 81866f1eaba6e2e23a2dc4e877bdbb6973c3465f4cbb9095f08a4730b6021b8d
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13338
    raw_end: 13417
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12784
    end_offset: 12863
    quote_sha256: 81866f1eaba6e2e23a2dc4e877bdbb6973c3465f4cbb9095f08a4730b6021b8d
- span_id: ss_qianyuan_ed01_o0013417
  sequence: 541
  start_offset: 12863
  end_offset: 12949
  text: 太阳每日皆从子正起，如初一注女二，初二注虚四，初一子时在女二，丑时即在女三，寅时即在女四，挨查至亥时当在虚三，则初二子时便在虚四矣，一日之行常不止十二度，再分派于各时可也。
  quote_sha256: 5e3be3cb500bbeb47eb5a135c1d76e718054b9c5883b9ef36eb2986ffec3e7a1
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13417
    raw_end: 13503
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12863
    end_offset: 12949
    quote_sha256: 5e3be3cb500bbeb47eb5a135c1d76e718054b9c5883b9ef36eb2986ffec3e7a1
- span_id: ss_qianyuan_ed01_o0013503
  sequence: 542
  start_offset: 12949
  end_offset: 12976
  text: 每度六十分，日与木如同在卯宫氐十，孰先孰后，必须辨明。
  quote_sha256: edfeef4a7ef5368062032970d13b0b6ae6faf4a0db43769d06ea282581928849
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13503
    raw_end: 13530
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12949
    end_offset: 12976
    quote_sha256: edfeef4a7ef5368062032970d13b0b6ae6faf4a0db43769d06ea282581928849
- span_id: ss_qianyuan_ed01_o0013530
  sequence: 543
  start_offset: 12976
  end_offset: 12993
  text: 日每日行六十分，木或六日行六十分。
  quote_sha256: 012727727a8669f8d31397fc2290559d07a05245b202afa90afd1f8b6facd31d
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13530
    raw_end: 13547
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12976
    end_offset: 12993
    quote_sha256: 012727727a8669f8d31397fc2290559d07a05245b202afa90afd1f8b6facd31d
- span_id: ss_qianyuan_ed01_o0013547
  sequence: 544
  start_offset: 12993
  end_offset: 13044
  text: 生人在午时，日已及三十五分，木自前二日至后三日才行尽氐十，则本日午时只及二十五分有奇，是日前而木后也。
  quote_sha256: c8ee54fa5bee340139d91ce6ccb8cda0b17c7accc8caae9f2523c2000305e0ab
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13547
    raw_end: 13598
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 12993
    end_offset: 13044
    quote_sha256: c8ee54fa5bee340139d91ce6ccb8cda0b17c7accc8caae9f2523c2000305e0ab
- span_id: ss_qianyuan_ed01_o0013598
  sequence: 545
  start_offset: 13044
  end_offset: 13101
  text: 有另立异说者，如一命三月初一卯时生，命在戌躔奎，其奎环转流行于卯，是奎在戌乃其空名，奎在卯正其实迹，安用此宫度为？
  quote_sha256: 277c542be823c5ebb9e988e2f26323559463759e58b924957addea715f5cf099
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13598
    raw_end: 13655
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13044
    end_offset: 13101
    quote_sha256: 277c542be823c5ebb9e988e2f26323559463759e58b924957addea715f5cf099
- span_id: ss_qianyuan_ed01_o0013655
  sequence: 546
  start_offset: 13101
  end_offset: 13156
  text: "不知奎既流卯，而亥子丑等十一宫，未尝不从流卯之戌上循次排列也，其理仍不外此，又何必立异而鸣高乎？   \n   "
  quote_sha256: 87b910db2ce8d58d4689409f89c4742f00d18f9532ece3aef0c8278340357cc6
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13655
    raw_end: 13710
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13101
    end_offset: 13156
    quote_sha256: 87b910db2ce8d58d4689409f89c4742f00d18f9532ece3aef0c8278340357cc6
- span_id: ss_qianyuan_ed01_o0013710
  sequence: 547
  start_offset: 13156
  end_offset: 13165
  text: 钓之间正须详看。
  quote_sha256: 2b87c317b5ec99b0cf476065732dfed08d3a7a7461fbc0d5867e5d91d21f40f0
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13710
    raw_end: 13719
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13156
    end_offset: 13165
    quote_sha256: 2b87c317b5ec99b0cf476065732dfed08d3a7a7461fbc0d5867e5d91d21f40f0
- span_id: ss_qianyuan_ed01_o0013719
  sequence: 548
  start_offset: 13165
  end_offset: 13208
  text: 如甲生人，天官辛气在卯亢，正财己月在酉娄五，天官虽躔伤，却与正财同经，伤方生财，生官；
  quote_sha256: 5576fdc415686a0409510a437db0acf9f15cd1f504b78529da0eb17877eb586e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13719
    raw_end: 13762
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13165
    end_offset: 13208
    quote_sha256: 5576fdc415686a0409510a437db0acf9f15cd1f504b78529da0eb17877eb586e
- span_id: ss_qianyuan_ed01_o0013762
  sequence: 549
  start_offset: 13208
  end_offset: 13304
  text: "七煞庚水在酉娄三，虽旁正财却躔伤而稍受制，限行至娄十二、十一、十、九、八、七、六、五等度，正财对生官，官场极顺，及行过娄五，遂在正财之后，与七煞密迩，而正财且生煞，宜乎顺中稍逆。\
    \   \n  "
  quote_sha256: fbb57b038b406f784ec0f2fa270a8f545601c40265bdfacabd3d4fb0130b24fd
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13762
    raw_end: 13858
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13208
    end_offset: 13304
    quote_sha256: fbb57b038b406f784ec0f2fa270a8f545601c40265bdfacabd3d4fb0130b24fd
- span_id: ss_qianyuan_ed01_o0013858
  sequence: 550
  start_offset: 13304
  end_offset: 13313
  text: 　 一星常有数用。
  quote_sha256: ddcbe6f8e4cc4bf60c7280b9174f9c4729cd2b3b97ae8095660486e6a7557cf1
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13858
    raw_end: 13867
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13304
    end_offset: 13313
    quote_sha256: ddcbe6f8e4cc4bf60c7280b9174f9c4729cd2b3b97ae8095660486e6a7557cf1
- span_id: ss_qianyuan_ed01_o0013867
  sequence: 551
  start_offset: 13313
  end_offset: 13359
  text: 即以日论，日君象亦父象，立命于午即命主，立命于子即妻主，立命于戌即男女主，立命于申即兄弟主。
  quote_sha256: c35ad549eb1c16b5fce702444e7f2470eca88fc4e4221babba544869ebbc639f
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13867
    raw_end: 13913
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13313
    end_offset: 13359
    quote_sha256: c35ad549eb1c16b5fce702444e7f2470eca88fc4e4221babba544869ebbc639f
- span_id: ss_qianyuan_ed01_o0013913
  sequence: 552
  start_offset: 13359
  end_offset: 13430
  text: 或化文、或化魁化刃，每有行一度而吉凶参半者，亦宜此不宜彼，宜彼不宜此之故，且吉中或微带危机，凶中或偶挟贵气，即一用之中亦有不同，所当细为查参。
  quote_sha256: f600efe277ff08f5f298713348e233db60a01c1d7fc9a06fe1f5a763e8468d8b
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13913
    raw_end: 13984
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13359
    end_offset: 13430
    quote_sha256: f600efe277ff08f5f298713348e233db60a01c1d7fc9a06fe1f5a763e8468d8b
- span_id: ss_qianyuan_ed01_o0013984
  sequence: 553
  start_offset: 13430
  end_offset: 13458
  text: "分金度，先天五行，皆节外生枝，在所宜辟。   \n   "
  quote_sha256: 955227b8023119487cc5bd5a1055bf191977f45ee03011cb2d820a74eb0a96e1
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 13984
    raw_end: 14012
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13430
    end_offset: 13458
    quote_sha256: 955227b8023119487cc5bd5a1055bf191977f45ee03011cb2d820a74eb0a96e1
- span_id: ss_qianyuan_ed01_o0014012
  sequence: 554
  start_offset: 13458
  end_offset: 13502
  text: "　天盘地盘、竹箩三限等，固属谬说，即华罗五星，出自周述学，亦牵合无理，均宜廓清。   \n"
  quote_sha256: 01fbc379f935a43f89fc07ef66bb87fc2692c7ce4ce74aff43c07a1caed91512
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14012
    raw_end: 14056
