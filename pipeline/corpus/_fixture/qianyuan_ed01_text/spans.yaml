  quote_sha256: 97ee8350d55713ddb387c1a99bc5ebcba49a21fe107e173ea782705b8a35b8ce
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
