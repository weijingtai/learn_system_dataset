    end_offset: 11225
    quote_sha256: b13a800c582b0428a80b3a2a8a599872ac617fdb9cf6e5f7209b1fdde171236b
- span_id: ss_qianyuan_ed01_o0011779
  sequence: 491
  start_offset: 11225
  end_offset: 11289
  text: 假如甲年生人，天官辛气，躔卯宫亢度，限行至戌，壁水七煞度足以暗混天官，幸有流木到度，则丙木能制庚水，若流土到度，则戊土能生庚水。
  quote_sha256: a7866f1426521bbfc5c10f939e1d6b61f86fcfaba9c6c20c1fb2687a52222160
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11779
    raw_end: 11843
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11225
    end_offset: 11289
    quote_sha256: a7866f1426521bbfc5c10f939e1d6b61f86fcfaba9c6c20c1fb2687a52222160
- span_id: ss_qianyuan_ed01_o0011843
  sequence: 492
  start_offset: 11289
  end_offset: 11336
  text: 又如天官流气入午伤官，丁金在戌之奎，现行奎度，奎木属官，本是官度坐伤，又三方见流官，不吉孰甚？
  quote_sha256: 5ccd52d8180b3ccf0831147267591c5c2f9a5bf0cbf269522f022dd1b8c3465e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11843
    raw_end: 11890
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11289
    end_offset: 11336
    quote_sha256: 5ccd52d8180b3ccf0831147267591c5c2f9a5bf0cbf269522f022dd1b8c3465e
- span_id: ss_qianyuan_ed01_o0011890
  sequence: 493
  start_offset: 11336
  end_offset: 11359
  text: 却有流罗到奎，则 丁金方受癸罗之制，岂能戕官？
  quote_sha256: 1455e2280c1e070042bea9d89949aa4099bfc34660d6c100e53b832ff84e15bd
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11890
    raw_end: 11913
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11336
    end_offset: 11359
    quote_sha256: 1455e2280c1e070042bea9d89949aa4099bfc34660d6c100e53b832ff84e15bd
- span_id: ss_qianyuan_ed01_o0011913
  sequence: 494
  start_offset: 11359
  end_offset: 11408
  text: 迨自奎行壁，壁乃煞度，正喜丁金之制庚水，而偏以癸罗到奎之故，使丁金无暇及煞，而煞势猖獗，遂至夺官。
  quote_sha256: dd2137e08fe3eec8ef9b8a92767b371bd8f52ec9655ba624cd6e02f8778281a9
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11913
    raw_end: 11962
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 11359
    end_offset: 11408
    quote_sha256: dd2137e08fe3eec8ef9b8a92767b371bd8f52ec9655ba624cd6e02f8778281a9
- span_id: ss_qianyuan_ed01_o0011962
  sequence: 495
  start_offset: 11408
  end_offset: 11426
  text: 此亦见移步换形，必不可胶柱而鼓瑟也。
  quote_sha256: f3ec5a38a8754b9192ecc514a9f0966410a4eeb3ec2eb30950d89f40a527bfd2
  evidence_level: offset_level
  source_anchor:
