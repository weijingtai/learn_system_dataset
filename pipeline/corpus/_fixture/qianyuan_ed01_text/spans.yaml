- span_id: ss_qianyuan_ed01_o0010328
  sequence: 422
  start_offset: 9774
  end_offset: 9781
  text: "　　元禄  \n"
  quote_sha256: f9d3bc4791431080629e96df0443b7a30b203a43131d21e5ee0f9cf85be2ea01
  evidence_level: offset_level
  source_anchor:
