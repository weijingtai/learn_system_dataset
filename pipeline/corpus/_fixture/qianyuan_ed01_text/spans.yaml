    start_offset: 7908
    end_offset: 7931
    quote_sha256: 77c79749309ee9db0da1b8fadb684ecd0661e9ac4070f7336e5609621d3051a2
- span_id: ss_qianyuan_ed01_o0008485
  sequence: 335
  start_offset: 7931
  end_offset: 7938
  text: "　　拦截  \n"
  quote_sha256: 7470937a9a6ed046be4252b5500588b920f3e573e379e1931ed351918fbcfd78
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8485
    raw_end: 8492
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7931
    end_offset: 7938
    quote_sha256: 7470937a9a6ed046be4252b5500588b920f3e573e379e1931ed351918fbcfd78
- span_id: ss_qianyuan_ed01_o0008492
  sequence: 336
  start_offset: 7938
  end_offset: 7959
  text: '    或罗计拦出一星，日月拦出一星是也。'
  quote_sha256: 3325d855495a8c05fe4598bbbaeb441f9b7018214e9a28bcfae535700af0a361
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8492
    raw_end: 8513
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7938
    end_offset: 7959
    quote_sha256: 3325d855495a8c05fe4598bbbaeb441f9b7018214e9a28bcfae535700af0a361
- span_id: ss_qianyuan_ed01_o0008513
  sequence: 337
  start_offset: 7959
  end_offset: 7995
  text: 所当辨拦截之星之吉凶，并当辨吉凶星之与命度有关会与否，更取其无他星混杂。
  quote_sha256: a78b49988e601ac5e75e7aa67767fee63a3371392a0e87715f477e3ce1d0bc8f
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8513
    raw_end: 8549
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7959
    end_offset: 7995
    quote_sha256: a78b49988e601ac5e75e7aa67767fee63a3371392a0e87715f477e3ce1d0bc8f
- span_id: ss_qianyuan_ed01_o0008549
  sequence: 338
  start_offset: 7995
  end_offset: 8038
  text: 然使拦出吉凶星，兼拦出命主，则此吉凶星虽与命度绝不经络贯串，却以命主同拦出而有关会矣。
  quote_sha256: a94b5562077bd60eb1ca52864f43c74b017b8e7a8385a19421d87d32a9e905ed
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8549
    raw_end: 8592
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 7995
    end_offset: 8038
    quote_sha256: a94b5562077bd60eb1ca52864f43c74b017b8e7a8385a19421d87d32a9e905ed
- span_id: ss_qianyuan_ed01_o0008592
  sequence: 339
  start_offset: 8038
  end_offset: 8079
  text: 又冬生人，拦出水孛，兼拦出火罗，似乎混杂，但水孛是官魁科名，得火罗暖之，其气正扬；
  quote_sha256: bf5e1d3b9a93fd0e7bf1ba8f6c9a882cee1f4eadd34dd9e40bfa1050f15088ba
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8592
    raw_end: 8633
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8038
    end_offset: 8079
    quote_sha256: bf5e1d3b9a93fd0e7bf1ba8f6c9a882cee1f4eadd34dd9e40bfa1050f15088ba
- span_id: ss_qianyuan_ed01_o0008633
  sequence: 340
  start_offset: 8079
  end_offset: 8109
  text: "水孛是劫煞伤官，有火罗助之，其焰弥炽，未可执一而断。   \n"
  quote_sha256: edc0f260d5aa18324f6506c92e553f51415d9eeca6d34407e282d9f4e00d7187
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8633
    raw_end: 8663
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8079
    end_offset: 8109
    quote_sha256: edc0f260d5aa18324f6506c92e553f51415d9eeca6d34407e282d9f4e00d7187
- span_id: ss_qianyuan_ed01_o0008663
  sequence: 341
  start_offset: 8109
  end_offset: 8116
  text: "　　天官  \n"
  quote_sha256: 9a07edabc6246eff01146931a4211b85f33b757088d4aee7c26ba586fa7ed106
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8663
    raw_end: 8670
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8109
    end_offset: 8116
    quote_sha256: 9a07edabc6246eff01146931a4211b85f33b757088d4aee7c26ba586fa7ed106
- span_id: ss_qianyuan_ed01_o0008670
  sequence: 342
  start_offset: 8116
  end_offset: 8126
  text: '    等天官者何？'
  quote_sha256: 498e758a5a4576a87a502f7c8c9bbdee3d82665b65b8040a48b6dc769bd57c71
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8670
    raw_end: 8680
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8116
    end_offset: 8126
    quote_sha256: 498e758a5a4576a87a502f7c8c9bbdee3d82665b65b8040a48b6dc769bd57c71
- span_id: ss_qianyuan_ed01_o0008680
  sequence: 343
  start_offset: 8126
  end_offset: 8140
  text: 天干之官也，余俱从天干取用。
  quote_sha256: 009a108a670f52191830e5a4819d259436cb8ca8e7c3ed699b67f3ba79f1cf57
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8680
    raw_end: 8694
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8126
    end_offset: 8140
    quote_sha256: 009a108a670f52191830e5a4819d259436cb8ca8e7c3ed699b67f3ba79f1cf57
- span_id: ss_qianyuan_ed01_o0008694
  sequence: 344
  start_offset: 8140
  end_offset: 8164
  text: 如甲年生人，甲以辛为官，辛之化禄为气，气即天官；
  quote_sha256: 3594774863c842c2c7428f62779864ad0b68d965fd19bdbd3035cb99630c2c74
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8694
    raw_end: 8718
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8140
    end_offset: 8164
    quote_sha256: 3594774863c842c2c7428f62779864ad0b68d965fd19bdbd3035cb99630c2c74
- span_id: ss_qianyuan_ed01_o0008718
  sequence: 345
  start_offset: 8164
  end_offset: 8182
  text: 以庚为七煞，庚之化禄为水，水即七煞；
  quote_sha256: c6690a9223472f44388452e2ccd547fd0e123fd01e078777ae01c7e77a571998
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8718
    raw_end: 8736
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8164
    end_offset: 8182
    quote_sha256: c6690a9223472f44388452e2ccd547fd0e123fd01e078777ae01c7e77a571998
- span_id: ss_qianyuan_ed01_o0008736
  sequence: 346
  start_offset: 8182
  end_offset: 8200
  text: 以丁为伤官，丁之化禄为金，金即伤官；
  quote_sha256: e1b68ae5bdf83b140af375930bf0953b35e3bf1545558765908be361e41404c7
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8736
    raw_end: 8754
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8182
    end_offset: 8200
    quote_sha256: e1b68ae5bdf83b140af375930bf0953b35e3bf1545558765908be361e41404c7
- span_id: ss_qianyuan_ed01_o0008754
  sequence: 347
  start_offset: 8200
  end_offset: 8218
  text: 以丙为食神，丙之化禄为木，木即食神；
  quote_sha256: dc9916f4fbfc7e8a4b2387063c9e6feb86fe2a1ed4203bf2e93612fa0987cfce
  evidence_level: offset_level
  source_anchor:
