    end_offset: 9809
    quote_sha256: 8ce099838354b031175df85b8796b7ea2d1aaf57673c44f140dddfb159a475cf
- span_id: ss_qianyuan_ed01_o0010363
  sequence: 425
  start_offset: 9809
  end_offset: 9844
  text: "惟不取其有合，阳年与正财合，无以生官，阴年与天官合，有以夺官。   \n"
