- span_id: ss_qianyuan_ed01_o0010833
  sequence: 447
  start_offset: 10279
  end_offset: 10289
  text: 命宫犹家，限度犹寓。
  quote_sha256: 5c5ecd8db95504b4d6c1d6c6e1439755b653abf027b46f3ee066ca684d034a6d
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10833
    raw_end: 10843
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10279
    end_offset: 10289
    quote_sha256: 5c5ecd8db95504b4d6c1d6c6e1439755b653abf027b46f3ee066ca684d034a6d
- span_id: ss_qianyuan_ed01_o0010843
  sequence: 448
  start_offset: 10289
  end_offset: 10300
  text: 试以家北而寓南者譬之。
  quote_sha256: 90e1bc43af384d70a37ddeeaca5a7c456a7c88d4ba2264712c5fcec5609cc31c
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10843
    raw_end: 10854
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10289
    end_offset: 10300
    quote_sha256: 90e1bc43af384d70a37ddeeaca5a7c456a7c88d4ba2264712c5fcec5609cc31c
- span_id: ss_qianyuan_ed01_o0010854
  sequence: 449
  start_offset: 10300
  end_offset: 10329
  text: 其家遭水火，其寓遭水火，一及身，一不及身，其缓急迥不侔矣。
  quote_sha256: a1de07874bbf20c70a12286e4f3c9e95022a7969f21f3aefe48d5f529b19088d
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10854
    raw_end: 10883
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10300
    end_offset: 10329
    quote_sha256: a1de07874bbf20c70a12286e4f3c9e95022a7969f21f3aefe48d5f529b19088d
- span_id: ss_qianyuan_ed01_o0010883
  sequence: 450
  start_offset: 10329
  end_offset: 10359
  text: 现行之度有星无星，总须察其与当生何吉星有关会，何凶星有关会。
  quote_sha256: 941898633f4e80d301a920969a2d847adaa0ffcb40472156389b01a6b92941bd
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10883
    raw_end: 10913
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10329
    end_offset: 10359
    quote_sha256: 941898633f4e80d301a920969a2d847adaa0ffcb40472156389b01a6b92941bd
- span_id: ss_qianyuan_ed01_o0010913
  sequence: 451
  start_offset: 10359
  end_offset: 10379
  text: 当生吉星满用，主行此星之度之年定见荣华。
  quote_sha256: eabd8cdee771579af6ba6a4871ad47117411d9862718e711c764dd10594ebfcc
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10913
    raw_end: 10933
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10359
    end_offset: 10379
    quote_sha256: eabd8cdee771579af6ba6a4871ad47117411d9862718e711c764dd10594ebfcc
- span_id: ss_qianyuan_ed01_o0010933
  sequence: 452
  start_offset: 10379
  end_offset: 10399
  text: 当生凶神有力，主行此星之度之年立看凋落。
  quote_sha256: 9b177ce09518bca557afa78a478c4c264a3d53beb9dbe9001438141da151ae00
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10933
    raw_end: 10953
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10379
    end_offset: 10399
    quote_sha256: 9b177ce09518bca557afa78a478c4c264a3d53beb9dbe9001438141da151ae00
- span_id: ss_qianyuan_ed01_o0010953
  sequence: 453
  start_offset: 10399
  end_offset: 10430
  text: 原吉凶星顶度，又当以情之轻重分祸福之大小，其理至微，所当经究。
  quote_sha256: 3f305355793bbd94d6a3a1691b8cb8127d36b79d08eb9380b6610e0bcb0db1a5
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10953
    raw_end: 10984
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10399
    end_offset: 10430
    quote_sha256: 3f305355793bbd94d6a3a1691b8cb8127d36b79d08eb9380b6610e0bcb0db1a5
- span_id: ss_qianyuan_ed01_o0010984
  sequence: 454
  start_offset: 10430
  end_offset: 10462
  text: 一甲年四月生人，一壬年二月生人，同行戌宫奎木度，奎木上同坐金星。
  quote_sha256: d693dac6baec107385182f8ef3e1e816ec7bd60892e590d36cc8dce65571f35c
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10984
    raw_end: 11016
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10430
    end_offset: 10462
    quote_sha256: d693dac6baec107385182f8ef3e1e816ec7bd60892e590d36cc8dce65571f35c
- span_id: ss_qianyuan_ed01_o0011016
  sequence: 455
  start_offset: 10462
  end_offset: 10478
  text: 甲生人以金为伤官，遂致仕途屡跌；
  quote_sha256: 69c8298340fea3efb22b9e5a721be44f0c5f355485b9cbc2d40c51dbcf6250d4
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11016
    raw_end: 11032
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10462
    end_offset: 10478
    quote_sha256: 69c8298340fea3efb22b9e5a721be44f0c5f355485b9cbc2d40c51dbcf6250d4
- span_id: ss_qianyuan_ed01_o0011032
  sequence: 456
  start_offset: 10478
  end_offset: 10494
  text: 壬年人以金为正财，遂致官级联升。
  quote_sha256: 999dd87d3a80017dcad4503fd4b5e8f31e3925407d80f6096a9469aac16d47f2
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11032
    raw_end: 11048
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10478
    end_offset: 10494
    quote_sha256: 999dd87d3a80017dcad4503fd4b5e8f31e3925407d80f6096a9469aac16d47f2
- span_id: ss_qianyuan_ed01_o0011048
  sequence: 457
  start_offset: 10494
  end_offset: 10553
  text: 一辛年十一月生人，一辛年十月生人，同行丑宫斗木度，度为天官，十一月生人正财火星在斗，太阳在尾火度，与太阳通，即入翰林；
  quote_sha256: 0787f18c0e8795a4ad8e0b411231c68a6c2258052e71a04c01ebe74206f908df
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11048
    raw_end: 11107
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10494
    end_offset: 10553
    quote_sha256: 0787f18c0e8795a4ad8e0b411231c68a6c2258052e71a04c01ebe74206f908df
- span_id: ss_qianyuan_ed01_o0011107
  sequence: 458
  start_offset: 10553
  end_offset: 10583
  text: 十月生人正财火星在箕，太阳虽在尾，火度与太阳不通，仅中进士。
  quote_sha256: c025ec286423b388b9264902cdfae99019c6731ccde3d0c50c08431e32966c35
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11107
    raw_end: 11137
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10553
    end_offset: 10583
    quote_sha256: c025ec286423b388b9264902cdfae99019c6731ccde3d0c50c08431e32966c35
- span_id: ss_qianyuan_ed01_o0011137
  sequence: 459
  start_offset: 10583
  end_offset: 10596
  text: 甚矣，度之所系为切且要也。
  quote_sha256: 93a472e3d8784e1cb461015f3c89e4f02b5077b2d6c6fe1eea10774ca80e66dd
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11137
    raw_end: 11150
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10583
    end_offset: 10596
    quote_sha256: 93a472e3d8784e1cb461015f3c89e4f02b5077b2d6c6fe1eea10774ca80e66dd
- span_id: ss_qianyuan_ed01_o0011150
  sequence: 460
  start_offset: 10596
  end_offset: 10630
  text: "度固因太岁填钓而弥动，其初入度将出度 之时，尤与寻常不同。   \n"
  quote_sha256: 159219a5cb3b4620e007b67e9d8526faadd51ddbb7db64a9f0c3a9dc77b76e91
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11150
    raw_end: 11184
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10596
    end_offset: 10630
    quote_sha256: 159219a5cb3b4620e007b67e9d8526faadd51ddbb7db64a9f0c3a9dc77b76e91
- span_id: ss_qianyuan_ed01_o0011184
  sequence: 461
  start_offset: 10630
  end_offset: 10636
  text: "度   \n"
  quote_sha256: 604647806ea0bc9847951dc392c9d38ba04c4e75480624df6008e30eea7e3e65
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11184
    raw_end: 11190
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10630
    end_offset: 10636
    quote_sha256: 604647806ea0bc9847951dc392c9d38ba04c4e75480624df6008e30eea7e3e65
- span_id: ss_qianyuan_ed01_o0011190
  sequence: 462
  start_offset: 10636
  end_offset: 10647
  text: 度之说，所谓纬克经也。
  quote_sha256: d12ec012ea6af5bafdc548f46acd0a156a6fbb3e6f2e7b02941ed7071863d612
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11190
    raw_end: 11201
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10636
    end_offset: 10647
    quote_sha256: d12ec012ea6af5bafdc548f46acd0a156a6fbb3e6f2e7b02941ed7071863d612
- span_id: ss_qianyuan_ed01_o0011201
  sequence: 463
  start_offset: 10647
  end_offset: 10660
  text: 如金躔木度，木躔土度是也。
  quote_sha256: 60a4c19e7a085c08913285cc6eb49a9f6b55bdc5db22e50bf8e637fe4a759f7f
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11201
    raw_end: 11214
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10647
    end_offset: 10660
    quote_sha256: 60a4c19e7a085c08913285cc6eb49a9f6b55bdc5db22e50bf8e637fe4a759f7f
- span_id: ss_qianyuan_ed01_o0011214
  sequence: 464
  start_offset: 10660
  end_offset: 10688
  text: 倘有水火冲钓，可以救解，然亦难免刑耗病疾、火盗官非等事。
  quote_sha256: 0f15f0f9c30cfb84bdfea86b4c5972590b6c2f4cb4b6cac9732c3a9eaf9cf3e3
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11214
    raw_end: 11242
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10660
    end_offset: 10688
    quote_sha256: 0f15f0f9c30cfb84bdfea86b4c5972590b6c2f4cb4b6cac9732c3a9eaf9cf3e3
- span_id: ss_qianyuan_ed01_o0011242
  sequence: 465
  start_offset: 10688
  end_offset: 10716
  text: 若带刃煞来，流年又逢度之星、杀刃之 类，死更速矣耳。
  quote_sha256: 7ff61270b396a191331ad24e8f9915f78be7a0c690ebff3bc48e0323ca8f9640
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11242
    raw_end: 11270
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10688
    end_offset: 10716
    quote_sha256: 7ff61270b396a191331ad24e8f9915f78be7a0c690ebff3bc48e0323ca8f9640
- span_id: ss_qianyuan_ed01_o0011270
  sequence: 466
  start_offset: 10716
  end_offset: 10747
  text: 木躔金度，火躔水度，便是经克纬，似乎稍轻，然有刃煞加临者亦死。
  quote_sha256: 04674db0e75bf98f26e5c0e8ee0c120a81f8f02b5910ef5ab20a7394c2f1aca4
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11270
    raw_end: 11301
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10716
    end_offset: 10747
    quote_sha256: 04674db0e75bf98f26e5c0e8ee0c120a81f8f02b5910ef5ab20a7394c2f1aca4
- span_id: ss_qianyuan_ed01_o0011301
  sequence: 467
  start_offset: 10747
  end_offset: 10764
  text: 若度上刃煞俱占，不拘相生之度皆死。
  quote_sha256: 22c22dfabaf37dc62613022988d5aa856567acee772439f84bfbbe9c2beaecef
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11301
    raw_end: 11318
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10747
    end_offset: 10764
    quote_sha256: 22c22dfabaf37dc62613022988d5aa856567acee772439f84bfbbe9c2beaecef
- span_id: ss_qianyuan_ed01_o0011318
  sequence: 468
  start_offset: 10764
  end_offset: 10797
  text: 刃度逢煞，煞度逢刃，纬克经固重，经克纬亦不轻，行度至此，其害立?。
  quote_sha256: da3fd7a40d06f407acca2f8f36ada620883951d980562a1476bfcf738f64f6e4
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11318
    raw_end: 11351
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10764
    end_offset: 10797
    quote_sha256: da3fd7a40d06f407acca2f8f36ada620883951d980562a1476bfcf738f64f6e4
- span_id: ss_qianyuan_ed01_o0011351
  sequence: 469
  start_offset: 10797
  end_offset: 10821
  text: 如限入刃乡，度又为煞，谓之凶会临，出限之年亦死。
  quote_sha256: 68c613eb5532e34cf598a7f5e52a1e12dfd368989d7216a396d78db9661f08a4
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11351
    raw_end: 11375
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10797
    end_offset: 10821
    quote_sha256: 68c613eb5532e34cf598a7f5e52a1e12dfd368989d7216a396d78db9661f08a4
- span_id: ss_qianyuan_ed01_o0011375
  sequence: 470
  start_offset: 10821
  end_offset: 10834
  text: 至于水孛同经，行水度即危；
  quote_sha256: 0f3dc774fd60c6e97d0d5531b0772f2fa201a0cbca020deeb1351c334f24baa8
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11375
    raw_end: 11388
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10821
    end_offset: 10834
    quote_sha256: 0f3dc774fd60c6e97d0d5531b0772f2fa201a0cbca020deeb1351c334f24baa8
- span_id: ss_qianyuan_ed01_o0011388
  sequence: 471
  start_offset: 10834
  end_offset: 10864
  text: 又如限行木度，木登木殿，遇流气来， 太岁刃煞又至其宫亦危；
  quote_sha256: 0191a6959bdf437005d4bc4b147266c573b79e6077cacbac9ee9ceaa62b2de3b
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11388
    raw_end: 11418
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10834
    end_offset: 10864
    quote_sha256: 0191a6959bdf437005d4bc4b147266c573b79e6077cacbac9ee9ceaa62b2de3b
- span_id: ss_qianyuan_ed01_o0011418
  sequence: 472
  start_offset: 10864
  end_offset: 10882
  text: 若木翼火胃，不过泄气而已，其灾自减。
  quote_sha256: ffb8296619973004e2c2deb5acf9b5d8ea8734fc9a35fa8a27dd7d6b1bd90a85
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11418
    raw_end: 11436
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10864
    end_offset: 10882
    quote_sha256: ffb8296619973004e2c2deb5acf9b5d8ea8734fc9a35fa8a27dd7d6b1bd90a85
- span_id: ss_qianyuan_ed01_o0011436
  sequence: 473
  start_offset: 10882
  end_offset: 10911
  text: 要而论之，不问坐命何宫何度，但一岁之中只看限行至何度为率。
  quote_sha256: 7ad800eb9110c42e7c2daf24159f688c529f32a3aff4405b21be753b21de195a
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 11436
    raw_end: 11465
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 10882
    end_offset: 10911
    quote_sha256: 7ad800eb9110c42e7c2daf24159f688c529f32a3aff4405b21be753b21de195a
- span_id: ss_qianyuan_ed01_o0011465
  sequence: 474
  start_offset: 10911
  end_offset: 10938
  text: 虽系天官，既是度，亦任中闻 擢而亡，或得之亦不可久。
  quote_sha256: 49297dfe8c7071dbd2b8f495773fe3bb6de8649fbfef5e5e649bc6e5c62f0b19
  evidence_level: offset_level
