    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8254
    end_offset: 8272
    quote_sha256: 45b54ffb093fff90eb4ea987d3e7d8a313c9c225b25cbae61308813b4701fd9f
- span_id: ss_qianyuan_ed01_o0008826
  sequence: 351
  start_offset: 8272
  end_offset: 8290
  text: 以癸为正印，癸之化禄为罗，罗即正印；
  quote_sha256: 46c2b700a71257921a702afa5a022e0ebe22651b92eeb61241c0c0c4f69a8303
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8826
    raw_end: 8844
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8272
    end_offset: 8290
    quote_sha256: 46c2b700a71257921a702afa5a022e0ebe22651b92eeb61241c0c0c4f69a8303
- span_id: ss_qianyuan_ed01_o0008844
  sequence: 352
  start_offset: 8290
  end_offset: 8308
  text: 以乙为劫财，乙之化禄为孛，孛即劫财；
  quote_sha256: 823879b854c3688f3630ce58d10befaffbe06746c7e1c03700fe5614d38a7c66
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
