- span_id: ss_qianyuan_ed01_o0010346
  sequence: 424
  start_offset: 9792
  end_offset: 9809
  text: 果得时得地，与命主有情，多食天禄。
  quote_sha256: 8ce099838354b031175df85b8796b7ea2d1aaf57673c44f140dddfb159a475cf
  evidence_level: offset_level
  source_anchor:
