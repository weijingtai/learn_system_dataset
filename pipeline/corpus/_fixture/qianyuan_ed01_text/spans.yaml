  text: 昔人有歌云：「疏中外辅密中密，不中密兮即中日，众密出特特上取，特不如间升阶明，疏密只就日边说，数者又不如一叠，叠日叠辅皆登第，经纬连处可登云，聚处逢之魁南北，遇日须遇日度数，日度亦是度末年。
  quote_sha256: 1e1bc27c1616503e56b3d27d7aab6c18ee9db0c553a8578ddda27027cc0dbdbd
