    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8290
    end_offset: 8308
    quote_sha256: 823879b854c3688f3630ce58d10befaffbe06746c7e1c03700fe5614d38a7c66
- span_id: ss_qianyuan_ed01_o0008862
  sequence: 353
  start_offset: 8308
  end_offset: 8320
  text: 甲之化禄为火，火即元禄。
  quote_sha256: 443ffd398d7037025f406774c4ddccbcc82e37b9d4ccf6a6f657c9efc44900ad
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8862
    raw_end: 8874
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8308
    end_offset: 8320
    quote_sha256: 443ffd398d7037025f406774c4ddccbcc82e37b9d4ccf6a6f657c9efc44900ad
- span_id: ss_qianyuan_ed01_o0008874
  sequence: 354
  start_offset: 8320
  end_offset: 8328
  text: "余仿此。   \n"
  quote_sha256: ec01b096ac4a63d7cea979368004990ce06e9fa8af42e423c214c2d3fca962bb
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8874
    raw_end: 8882
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8320
    end_offset: 8328
    quote_sha256: ec01b096ac4a63d7cea979368004990ce06e9fa8af42e423c214c2d3fca962bb
- span_id: ss_qianyuan_ed01_o0008882
  sequence: 355
  start_offset: 8328
  end_offset: 8356
  text: 　　天官天官固取其与命度经络贯串矣，亦有通根而不通根者。
  quote_sha256: aae187ee135b2bc4d35e164771fc9c4ab6c9cb05e43a2f6c2e898b39852b77b2
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8882
    raw_end: 8910
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8328
    end_offset: 8356
    quote_sha256: aae187ee135b2bc4d35e164771fc9c4ab6c9cb05e43a2f6c2e898b39852b77b2
- span_id: ss_qianyuan_ed01_o0008910
  sequence: 356
  start_offset: 8356
  end_offset: 8370
  text: 如官躔伤官度，命亦躔伤是也；
  quote_sha256: f7775bfd29348b524ec8a1184fc07d45a0acb1297e99021e348b29c6f2e7f699
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8910
    raw_end: 8924
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8356
    end_offset: 8370
    quote_sha256: f7775bfd29348b524ec8a1184fc07d45a0acb1297e99021e348b29c6f2e7f699
- span_id: ss_qianyuan_ed01_o0008924
  sequence: 357
  start_offset: 8370
  end_offset: 8392
  text: 或官躔他度，正财躔命度，则又不通根而通根焉。
  quote_sha256: 7184a1087023b313214c36c11ecb8b2861a25a402de8747222624baa6e28e7e0
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8924
    raw_end: 8946
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8370
    end_offset: 8392
    quote_sha256: 7184a1087023b313214c36c11ecb8b2861a25a402de8747222624baa6e28e7e0
- span_id: ss_qianyuan_ed01_o0008946
  sequence: 358
  start_offset: 8392
  end_offset: 8410
  text: 《天官经》云：「日月扶官，才昭廊庙。
  quote_sha256: 424bec2203698f5e450afa1e789889fe26d063961c294cd1bdca0235a785ef20
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8946
    raw_end: 8964
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8392
    end_offset: 8410
    quote_sha256: 424bec2203698f5e450afa1e789889fe26d063961c294cd1bdca0235a785ef20
- span_id: ss_qianyuan_ed01_o0008964
  sequence: 359
  start_offset: 8410
  end_offset: 8420
  text: 官入命垣，格低还贵。
  quote_sha256: fa8e1b3bc08cbb3fca36b7855d4966e2ee1bed39961e71ddadedf52d52348fc4
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8964
    raw_end: 8974
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8410
    end_offset: 8420
    quote_sha256: fa8e1b3bc08cbb3fca36b7855d4966e2ee1bed39961e71ddadedf52d52348fc4
- span_id: ss_qianyuan_ed01_o0008974
  sequence: 360
  start_offset: 8420
  end_offset: 8430
  text: 天官秉令，身居九鼎。
  quote_sha256: 7446b3755ccd8d7d326f35e9f2b7f0c8a2490df351463c51088bf3c52b0c26a4
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8974
    raw_end: 8984
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8420
    end_offset: 8430
    quote_sha256: 7446b3755ccd8d7d326f35e9f2b7f0c8a2490df351463c51088bf3c52b0c26a4
- span_id: ss_qianyuan_ed01_o0008984
  sequence: 361
  start_offset: 8430
  end_offset: 8440
  text: 天官贯日，食禄丰隆。
  quote_sha256: 4775c46f30cb50906e4eb10a3006f5a0ff3aecffa68e1d1f30a836ffcfb1d532
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8984
    raw_end: 8994
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8430
    end_offset: 8440
    quote_sha256: 4775c46f30cb50906e4eb10a3006f5a0ff3aecffa68e1d1f30a836ffcfb1d532
- span_id: ss_qianyuan_ed01_o0008994
  sequence: 362
  start_offset: 8440
  end_offset: 8450
