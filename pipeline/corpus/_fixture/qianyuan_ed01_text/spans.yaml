    start_offset: 13502
    end_offset: 13550
    quote_sha256: 4cc57d3afdd9560a86bc0216cfd62de13b8358f7084959974e542ad128b18bfc
- span_id: ss_qianyuan_ed01_o0014104
  sequence: 556
  start_offset: 13550
  end_offset: 13579
  text: "尝取《天步真原》一书试之，从不一验，亦宜屏弃。   \n  "
  quote_sha256: a9ec9882f9f86323f6f8f8aa5130cf6c06430a2d91f63dbc4832bf42258ae77f
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 14104
    raw_end: 14133
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 13550
    end_offset: 13579
    quote_sha256: a9ec9882f9f86323f6f8f8aa5130cf6c06430a2d91f63dbc4832bf42258ae77f
- span_id: ss_qianyuan_ed01_o0014133
  sequence: 557
  start_offset: 13579
  end_offset: 13653
  text: "　《果老星宗》《琴堂指金》《神道大编》《望斗仙经》《星学纲目》《星学源流》《历府大成》《星学大成》等书所载正五行甚详，但仅合此理十之一。   \n\
    \  "
  quote_sha256: b84f0929f1a8836a7db8699b03356a11b9e1c866b1fb2955384034719f5c0520
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
