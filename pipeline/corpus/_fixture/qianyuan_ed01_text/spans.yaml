    end_offset: 2463
    quote_sha256: 545dedf2c4cb116728042f5615d232485db877c09b0c704021a085c1102e7127
- span_id: ss_qianyuan_ed01_o0003017
  sequence: 117
  start_offset: 2463
  end_offset: 2485
  text: 命主是火，水孛辅日，虽系春生人，遇日度亦死。
  quote_sha256: 2e9803ec94d492410685d7232b6058e757e851cc749de1e6c9af0d122e61d18b
  evidence_level: offset_level
  source_anchor:
