- span_id: ss_qianyuan_ed01_o0000520
  sequence: 4
  start_offset: 38
  end_offset: 51
  text: 则天有九重，古昔已言之矣。
  quote_sha256: b7c11a3a61bfb6a40030a5b7d0a6f7b318458c8ac9445395e4a403d3681f1ccf
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 520
    raw_end: 533
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 38
    end_offset: 51
