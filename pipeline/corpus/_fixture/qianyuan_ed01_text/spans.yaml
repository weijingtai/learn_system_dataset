    end_offset: 4041
    quote_sha256: 752fae399b3b9e65883247300b6e38ec646c194f2be3252f3e144787f35d1162
- span_id: ss_qianyuan_ed01_o0004595
  sequence: 205
  start_offset: 4041
  end_offset: 4111
  text: 　　万年书历之由来久矣，自汉至明修辑者七十余家，创制者十有三家，其中如《太初》、《大衍》，皆称精当，至元郭守敬《授时历》出，而前人莫有及焉。
  quote_sha256: 30ca272512a77979544ea6f1dc6e5a5534c378491ffd7f0a93ee22171d1cf01b
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 4595
    raw_end: 4665
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 4041
    end_offset: 4111
    quote_sha256: 30ca272512a77979544ea6f1dc6e5a5534c378491ffd7f0a93ee22171d1cf01b
- span_id: ss_qianyuan_ed01_o0004665
  sequence: 206
  start_offset: 4111
  end_offset: 4138
  text: 迨西法行，而后更由疏入密，由同得异，识者遂以为观止也。
  quote_sha256: 38bd07a20ea74bb13161ea61f0bb0b53c872905e0db4ad7b8478bb5e9aeb6949
  evidence_level: offset_level
  source_anchor:
