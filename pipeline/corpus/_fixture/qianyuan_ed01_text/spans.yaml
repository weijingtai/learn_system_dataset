- span_id: ss_qianyuan_ed01_o0011716
  sequence: 489
  start_offset: 11162
  end_offset: 11195
  text: 若原火本被水克，限度又是火，纵不犯原水，但遇流水，不必是刃煞亦灾。
  quote_sha256: 012a0ac13e92289747caacafdd4e2eaa01a9ef747e55594229a00318e2cccadd
  evidence_level: offset_level
  source_anchor:
