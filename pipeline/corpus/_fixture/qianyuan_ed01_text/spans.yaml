    end_offset: 11426
    quote_sha256: f3ec5a38a8754b9192ecc514a9f0966410a4eeb3ec2eb30950d89f40a527bfd2
- span_id: ss_qianyuan_ed01_o0011980
  sequence: 496
  start_offset: 11426
  end_offset: 11479
  text: 太阳君象，须用太阳，照命宫无益，照大限有济，到大限不如在四正照，在四正不如在三方照，在三方又不如在对宫照。
  quote_sha256: 93566c16e62f6e2de09dbff99db23f2c54879958a4eed26306794d0515b9dbe9
  evidence_level: offset_level
  source_anchor:
