- span_id: ss_qianyuan_ed01_o0008082
  sequence: 324
  start_offset: 7528
  end_offset: 7549
  text: 四正即隔三宫之二弦，而不必拘拘于九十度也。
  quote_sha256: 4efa199f6979f89912923db8ac9bd20c0606b6fc543c4f015577c20661ef7802
  evidence_level: offset_level
  source_anchor:
