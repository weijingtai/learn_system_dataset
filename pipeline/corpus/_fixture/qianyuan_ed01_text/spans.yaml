  sequence: 200
  start_offset: 3928
  end_offset: 3938
  text: 直伤官矣，漫云催乎？
  quote_sha256: 2eac5a17634558507bb8d9c41705a9b27c81372daab6ff9c870f7b66abf2e7a8
  evidence_level: offset_level
  source_anchor:
