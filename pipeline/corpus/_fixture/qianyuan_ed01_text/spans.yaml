  quote_sha256: fd55886c0fc27fb9b89c28240f5977872a360d3ebd947dcbfb67816c6fcb7450
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 8790
    raw_end: 8808
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8236
    end_offset: 8254
    quote_sha256: fd55886c0fc27fb9b89c28240f5977872a360d3ebd947dcbfb67816c6fcb7450
- span_id: ss_qianyuan_ed01_o0008808
  sequence: 350
  start_offset: 8254
  end_offset: 8272
  text: 以壬为偏印，壬之化禄为计，计即偏印；
  quote_sha256: 45b54ffb093fff90eb4ea987d3e7d8a313c9c225b25cbae61308813b4701fd9f
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
