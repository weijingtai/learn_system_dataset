- span_id: ss_qianyuan_ed01_o0009004
  sequence: 363
  start_offset: 8450
  end_offset: 8460
  text: 官躔伤度，逢生犹荣。
  quote_sha256: 18e7db61110f9eedefda359da00b15505a3ae1f59ca6c3288fd1b498b35de27a
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9004
    raw_end: 9014
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8450
    end_offset: 8460
    quote_sha256: 18e7db61110f9eedefda359da00b15505a3ae1f59ca6c3288fd1b498b35de27a
- span_id: ss_qianyuan_ed01_o0009014
  sequence: 364
  start_offset: 8460
  end_offset: 8474
  text: 正财随驾而对照兮，乔迁不次。
  quote_sha256: 733f6942f6018b94abc9c3b8f553df9834f89039753dc96bde28515c865d278c
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9014
    raw_end: 9028
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8460
    end_offset: 8474
    quote_sha256: 733f6942f6018b94abc9c3b8f553df9834f89039753dc96bde28515c865d278c
- span_id: ss_qianyuan_ed01_o0009028
  sequence: 365
  start_offset: 8474
  end_offset: 8488
  text: 正财当限而拱官兮，恩宠骈集。
  quote_sha256: feadd0d18e8dd860c914659188f029ae41c2baee7e206368502ad16d5e39ac02
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9028
    raw_end: 9042
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8474
    end_offset: 8488
    quote_sha256: feadd0d18e8dd860c914659188f029ae41c2baee7e206368502ad16d5e39ac02
- span_id: ss_qianyuan_ed01_o0009042
  sequence: 366
  start_offset: 8488
  end_offset: 8502
  text: 惟忌伤官作妒，更嫌七煞当前。
  quote_sha256: cd820240d05170695e2901922fa9ec130bd3604686ac4f9b367d93dd5d19a800
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9042
    raw_end: 9056
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8488
    end_offset: 8502
    quote_sha256: cd820240d05170695e2901922fa9ec130bd3604686ac4f9b367d93dd5d19a800
- span_id: ss_qianyuan_ed01_o0009056
  sequence: 367
  start_offset: 8502
  end_offset: 8522
  text: 伤官伴官兮崎岖有阻，七煞混官兮荆棘自生。
  quote_sha256: 1c56fb6ee579d590f56d9523c5b7239e69506085698c1fe071d86556ac83e3d8
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9056
    raw_end: 9076
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8502
    end_offset: 8522
    quote_sha256: 1c56fb6ee579d590f56d9523c5b7239e69506085698c1fe071d86556ac83e3d8
- span_id: ss_qianyuan_ed01_o0009076
  sequence: 368
  start_offset: 8522
  end_offset: 8531
  text: 」此亦得其大概也。
  quote_sha256: 8e82d9f8be7bbf774398c4d8d45445c0b46f2b2aa96bb7512afa395187f46c08
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9076
    raw_end: 9085
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8522
    end_offset: 8531
    quote_sha256: 8e82d9f8be7bbf774398c4d8d45445c0b46f2b2aa96bb7512afa395187f46c08
- span_id: ss_qianyuan_ed01_o0009085
  sequence: 369
  start_offset: 8531
  end_offset: 8554
  text: 更不宜合化，如丙用罗官愁见月，土阴凑合不为官。
  quote_sha256: 97433daa207c48187065ed8129ac865cc6d79ffa41495c29a18eecf74d78de6b
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9085
    raw_end: 9108
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8531
    end_offset: 8554
    quote_sha256: 97433daa207c48187065ed8129ac865cc6d79ffa41495c29a18eecf74d78de6b
- span_id: ss_qianyuan_ed01_o0009108
  sequence: 370
  start_offset: 8554
  end_offset: 8562
  text: "余仿此。   \n"
  quote_sha256: ec01b096ac4a63d7cea979368004990ce06e9fa8af42e423c214c2d3fca962bb
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9108
    raw_end: 9116
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8554
    end_offset: 8562
    quote_sha256: ec01b096ac4a63d7cea979368004990ce06e9fa8af42e423c214c2d3fca962bb
- span_id: ss_qianyuan_ed01_o0009116
  sequence: 371
  start_offset: 8562
  end_offset: 8569
  text: "　　七煞  \n"
  quote_sha256: d1de7f37895a21cd405086c6796f1e9b5f5b737c84166dfdf440916bb8c15a7f
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9116
    raw_end: 9123
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8562
    end_offset: 8569
    quote_sha256: d1de7f37895a21cd405086c6796f1e9b5f5b737c84166dfdf440916bb8c15a7f
- span_id: ss_qianyuan_ed01_o0009123
  sequence: 372
  start_offset: 8569
  end_offset: 8626
  text: '    子平可去官留煞，五星则煞总不可混官，须以食神制之，遂使官清，否则阳年之煞与劫合化，阴年之煞与伤合化，亦可。'
  quote_sha256: a7bcafe8c6c983b4043aa057f037102d4bc00940804dff3b6d245e6271fedf77
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9123
    raw_end: 9180
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8569
    end_offset: 8626
    quote_sha256: a7bcafe8c6c983b4043aa057f037102d4bc00940804dff3b6d245e6271fedf77
- span_id: ss_qianyuan_ed01_o0009180
  sequence: 373
  start_offset: 8626
  end_offset: 8647
  text: 《天官经》云：「劫伤见煞也相制，天官有势。
  quote_sha256: 74b79ab12b645666ec08115202cd73378aba0af6585a4c9d41acf2c7d92dc3ec
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9180
    raw_end: 9201
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8626
    end_offset: 8647
    quote_sha256: 74b79ab12b645666ec08115202cd73378aba0af6585a4c9d41acf2c7d92dc3ec
- span_id: ss_qianyuan_ed01_o0009201
  sequence: 374
  start_offset: 8647
  end_offset: 8665
  text: 」又云：「贪合见煞也忘煞，天官亦尊。
  quote_sha256: ba0c94961b80dcf610c19e640178ffc449f999a4502a44a33327c421505c7842
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9201
    raw_end: 9219
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8647
    end_offset: 8665
    quote_sha256: ba0c94961b80dcf610c19e640178ffc449f999a4502a44a33327c421505c7842
- span_id: ss_qianyuan_ed01_o0009219
  sequence: 375
  start_offset: 8665
  end_offset: 8694
  text: 」若七煞无食神制，又无劫伤合，独与天官经串钓，难望清贵。
  quote_sha256: 819c2dbecd1b6d72172aeb591a1ea412c712a1e7bd12bec47d5dd3f5e50fc191
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9219
    raw_end: 9248
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8665
    end_offset: 8694
    quote_sha256: 819c2dbecd1b6d72172aeb591a1ea412c712a1e7bd12bec47d5dd3f5e50fc191
- span_id: ss_qianyuan_ed01_o0009248
  sequence: 376
  start_offset: 8694
  end_offset: 8714
  text: 纵得进士亦不能馆选，即使馆选亦必至散去。
  quote_sha256: 9966e7a349da1e73b44a746416d26612505f9cf9d5431b57214e89b5e47123b0
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9248
    raw_end: 9268
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8694
    end_offset: 8714
    quote_sha256: 9966e7a349da1e73b44a746416d26612505f9cf9d5431b57214e89b5e47123b0
- span_id: ss_qianyuan_ed01_o0009268
  sequence: 377
  start_offset: 8714
  end_offset: 8728
  text: 内至京 堂四品，终不能大轿；
  quote_sha256: d0015f9ed8951b0798e4549a8b9099580eea7d19303070af9f8bb0b3de181ec7
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9268
    raw_end: 9282
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8714
    end_offset: 8728
    quote_sha256: d0015f9ed8951b0798e4549a8b9099580eea7d19303070af9f8bb0b3de181ec7
- span_id: ss_qianyuan_ed01_o0009282
  sequence: 378
  start_offset: 8728
  end_offset: 8741
  text: 外至藩臬两司，亦不能八座。
  quote_sha256: 1b81ec5764d394fc126166d0352ef278604a71a2600163fa0482b2321655f009
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9282
    raw_end: 9295
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8728
    end_offset: 8741
    quote_sha256: 1b81ec5764d394fc126166d0352ef278604a71a2600163fa0482b2321655f009
- span_id: ss_qianyuan_ed01_o0009295
  sequence: 379
  start_offset: 8741
  end_offset: 8789
  text: 更有公卿贵命，原盘并未官受煞混，特无食神制煞，劫伤化煞，往往从不清贵之衙门，一转则煞之为崇大也。
  quote_sha256: 7f07370f8e4b210bb26bc0d18f57f6e1f48ddd644d77b56094ceb9a33ea4f9bd
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9295
    raw_end: 9343
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8741
    end_offset: 8789
    quote_sha256: 7f07370f8e4b210bb26bc0d18f57f6e1f48ddd644d77b56094ceb9a33ea4f9bd
- span_id: ss_qianyuan_ed01_o0009343
  sequence: 380
  start_offset: 8789
  end_offset: 8813
  text: 惟武职官员，由行五起者，煞而兼刃，或掌威权有之。
  quote_sha256: 844ac3b2c5e1bcc9679d0da616b7dbf8d18ee0df174789b4ef73c5b4db6053c9
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9343
    raw_end: 9367
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8789
    end_offset: 8813
    quote_sha256: 844ac3b2c5e1bcc9679d0da616b7dbf8d18ee0df174789b4ef73c5b4db6053c9
- span_id: ss_qianyuan_ed01_o0009367
  sequence: 381
  start_offset: 8813
  end_offset: 8843
  text: "至于煞兼魁兼科，又当分观魁科之盛衰，或作清宦亦有之。   \n"
  quote_sha256: bd7c6f8e7e014c58bde3310c8808998ca1a8465be30281e83597fe0e2b3d0a9a
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9367
    raw_end: 9397
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8813
    end_offset: 8843
    quote_sha256: bd7c6f8e7e014c58bde3310c8808998ca1a8465be30281e83597fe0e2b3d0a9a
- span_id: ss_qianyuan_ed01_o0009397
  sequence: 382
  start_offset: 8843
  end_offset: 8850
  text: "　　正财  \n"
  quote_sha256: d6dfd124b1efa3ba240ed4625eb89de3c7591cd835caafd9cf74e5d743913cd2
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9397
    raw_end: 9404
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8843
    end_offset: 8850
    quote_sha256: d6dfd124b1efa3ba240ed4625eb89de3c7591cd835caafd9cf74e5d743913cd2
- span_id: ss_qianyuan_ed01_o0009404
  sequence: 383
  start_offset: 8850
  end_offset: 8897
  text: '    正财乃生天官星也，亦看与命主经络贯串何如，司令升殿或拱夹拦截合宜，不但增秩，兼能至富。'
  quote_sha256: 3522f8bc17cacc9a849b2ed2d75ad377b148ac8a4fa6d51a1791013bcf9ca8d6
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9404
    raw_end: 9451
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8850
    end_offset: 8897
    quote_sha256: 3522f8bc17cacc9a849b2ed2d75ad377b148ac8a4fa6d51a1791013bcf9ca8d6
- span_id: ss_qianyuan_ed01_o0009451
  sequence: 384
  start_offset: 8897
  end_offset: 8925
  text: 总须与天官有情，或经或络，或串或拱，或或同，拦截皆妙。
  quote_sha256: a1bbafa6d306fdb8495463e5969c7ea5aaa86f8bcf5c5b52227b4d751c1a7784
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9451
    raw_end: 9479
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8897
    end_offset: 8925
    quote_sha256: a1bbafa6d306fdb8495463e5969c7ea5aaa86f8bcf5c5b52227b4d751c1a7784
- span_id: ss_qianyuan_ed01_o0009479
  sequence: 385
  start_offset: 8925
  end_offset: 8957
  text: "但阳年不可遇元禄，阴年不可遇偏印，遇之则贪合而忘生也。   \n "
  quote_sha256: c845b13e1e8e60f703b93bb04aab9fefe1d8c59e4a34481dbb847ece99fa77f5
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9479
    raw_end: 9511
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8925
    end_offset: 8957
    quote_sha256: c845b13e1e8e60f703b93bb04aab9fefe1d8c59e4a34481dbb847ece99fa77f5
- span_id: ss_qianyuan_ed01_o0009511
  sequence: 386
  start_offset: 8957
  end_offset: 8964
  text: "　　偏财  \n"
  quote_sha256: a13cc3dcbd2be122bc862f3487827a1d7fcdb51f3c5ca397317aac9650e81f9e
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9511
    raw_end: 9518
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8957
    end_offset: 8964
    quote_sha256: a13cc3dcbd2be122bc862f3487827a1d7fcdb51f3c5ca397317aac9650e81f9e
- span_id: ss_qianyuan_ed01_o0009518
  sequence: 387
  start_offset: 8964
  end_offset: 8995
  text: '    偏财虽能生煞，亦能生官，特阳生阴，阴生阳，其力自薄耳。'
  quote_sha256: 89d1563da63b9c41f0e6036602c7ae5175d07d2759505c3f5b2533cebd290566
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9518
    raw_end: 9549
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8964
    end_offset: 8995
    quote_sha256: 89d1563da63b9c41f0e6036602c7ae5175d07d2759505c3f5b2533cebd290566
- span_id: ss_qianyuan_ed01_o0009549
  sequence: 388
  start_offset: 8995
  end_offset: 9019
  text: 倘与煞同宫同度，或独钓，或独，则生煞而煞弥横；
  quote_sha256: 5dcde338836c69c76587be6f755cbdd11d936bf9a6512a911b3889147673e1e9
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9549
    raw_end: 9573
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 8995
    end_offset: 9019
    quote_sha256: 5dcde338836c69c76587be6f755cbdd11d936bf9a6512a911b3889147673e1e9
- span_id: ss_qianyuan_ed01_o0009573
  sequence: 389
  start_offset: 9019
  end_offset: 9044
  text: 如与官同宫同度，或独钓，或独，则于官亦不无小补。
  quote_sha256: a40860f589ff0f5913b88cf6549f36e2963339373f023cc9be2c8d51a626a1b9
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9573
    raw_end: 9598
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9019
    end_offset: 9044
    quote_sha256: a40860f589ff0f5913b88cf6549f36e2963339373f023cc9be2c8d51a626a1b9
- span_id: ss_qianyuan_ed01_o0009598
  sequence: 390
  start_offset: 9044
  end_offset: 9061
  text: 但阳年与正印合化，懮其无以制伤官；
  quote_sha256: dd13d0e436a40a75080c4b47c6e4ee9fbf58fda77c4123a6cf8c877cacc29d9c
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9598
    raw_end: 9615
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9044
    end_offset: 9061
    quote_sha256: dd13d0e436a40a75080c4b47c6e4ee9fbf58fda77c4123a6cf8c877cacc29d9c
- span_id: ss_qianyuan_ed01_o0009615
  sequence: 391
  start_offset: 9061
  end_offset: 9081
  text: "阴年与劫财合化，喜其有以扶正财。   \n"
  quote_sha256: 0954b0d673d88a9a198a7fa06f79a2e5e14ff0ecda5d1dce46be2648a88021d5
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9615
    raw_end: 9635
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9061
    end_offset: 9081
    quote_sha256: 0954b0d673d88a9a198a7fa06f79a2e5e14ff0ecda5d1dce46be2648a88021d5
- span_id: ss_qianyuan_ed01_o0009635
  sequence: 392
  start_offset: 9081
  end_offset: 9088
  text: "　　伤官  \n"
  quote_sha256: 612c3ff2b68dd6a00c6bae6aef7af31a6b456e8d25a5970dd174f52ae92856ff
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9635
    raw_end: 9642
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9081
    end_offset: 9088
    quote_sha256: 612c3ff2b68dd6a00c6bae6aef7af31a6b456e8d25a5970dd174f52ae92856ff
- span_id: ss_qianyuan_ed01_o0009642
  sequence: 393
  start_offset: 9088
  end_offset: 9104
  text: '    凡天官遇伤者，须见正财。'
  quote_sha256: 2fba4cfbc9abd04656df785ed7a739288dc83f069e0b6e02b2d16b52d5e0a3f4
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9642
    raw_end: 9658
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9088
    end_offset: 9104
    quote_sha256: 2fba4cfbc9abd04656df785ed7a739288dc83f069e0b6e02b2d16b52d5e0a3f4
- span_id: ss_qianyuan_ed01_o0009658
  sequence: 394
  start_offset: 9104
  end_offset: 9149
  text: 若见正财，转能生官，盖伤生财，财生官也，故有行伤官度发者，非伤官在正财度，即正财在伤官度。
  quote_sha256: 32e625411d50011587b5effad2609c98e254c589d03fa54be16e79476115c62a
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9658
    raw_end: 9703
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9104
    end_offset: 9149
    quote_sha256: 32e625411d50011587b5effad2609c98e254c589d03fa54be16e79476115c62a
- span_id: ss_qianyuan_ed01_o0009703
  sequence: 395
  start_offset: 9149
  end_offset: 9162
  text: 伤财互躔，行伤度胜于财度。
  quote_sha256: 0d30049cea929186b328b12956e72bfcdc46fff8b53aeb2f8e1ee3bc571cc540
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9703
    raw_end: 9716
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9149
    end_offset: 9162
    quote_sha256: 0d30049cea929186b328b12956e72bfcdc46fff8b53aeb2f8e1ee3bc571cc540
- span_id: ss_qianyuan_ed01_o0009716
  sequence: 396
  start_offset: 9162
  end_offset: 9209
  text: 昔人有专看天官正财伤官三星者，详其聚散，审其衰旺，知其生中有伤、伤中有生，从而断之，无不立验。
  quote_sha256: 742c1955017f8a6ca21c257b52a8826abf149bf70951b3be090722ef84330efe
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9716
    raw_end: 9763
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9162
    end_offset: 9209
    quote_sha256: 742c1955017f8a6ca21c257b52a8826abf149bf70951b3be090722ef84330efe
- span_id: ss_qianyuan_ed01_o0009763
  sequence: 397
  start_offset: 9209
  end_offset: 9255
  text: "是天官遇伤官，必须正财，若无正财，即须正印以制之，尤须阳年以偏印，阴年以七煞合化之。   \n"
  quote_sha256: 03b016ae80ce70d5e763d739e1fc82640b827243f094d01cac948a34b28113a4
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9763
    raw_end: 9809
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9209
    end_offset: 9255
    quote_sha256: 03b016ae80ce70d5e763d739e1fc82640b827243f094d01cac948a34b28113a4
- span_id: ss_qianyuan_ed01_o0009809
  sequence: 398
  start_offset: 9255
  end_offset: 9262
  text: "　　食神  \n"
  quote_sha256: 53237e8a0102c990554e4143366394519a45480e6faa7b62c2d85619e0eb3a5c
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9809
    raw_end: 9816
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9255
    end_offset: 9262
    quote_sha256: 53237e8a0102c990554e4143366394519a45480e6faa7b62c2d85619e0eb3a5c
- span_id: ss_qianyuan_ed01_o0009816
  sequence: 399
  start_offset: 9262
  end_offset: 9297
  text: '    食神取其制煞，因之煞去官清，但阳年颇忌其合官，阴年亦忌其剥官。'
  quote_sha256: 7807c2608871253cb14eaf9992fcf0ee8800dbd66ec9ebc734dc75fc93e53d56
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9816
    raw_end: 9851
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9262
    end_offset: 9297
    quote_sha256: 7807c2608871253cb14eaf9992fcf0ee8800dbd66ec9ebc734dc75fc93e53d56
- span_id: ss_qianyuan_ed01_o0009851
  sequence: 400
  start_offset: 9297
  end_offset: 9337
  text: 如煞在对宫，官在同宫，则只能合近地之官，剥近地之官，而不能及煞，煞仍自如，何也？
  quote_sha256: 63f2c52a03c81d0859c222b7e0cda9c580d9a2d6440dd00ddab77c45f0cd8c0f
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9851
    raw_end: 9891
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9297
    end_offset: 9337
    quote_sha256: 63f2c52a03c81d0859c222b7e0cda9c580d9a2d6440dd00ddab77c45f0cd8c0f
- span_id: ss_qianyuan_ed01_o0009891
  sequence: 401
  start_offset: 9337
  end_offset: 9350
  text: "对宫疏而同宫亲也。   \n"
  quote_sha256: b88c9c63b110f3d06fd98fbcabbb19914838140dfd4efedd6071544098de3b2c
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9891
    raw_end: 9904
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9337
    end_offset: 9350
    quote_sha256: b88c9c63b110f3d06fd98fbcabbb19914838140dfd4efedd6071544098de3b2c
- span_id: ss_qianyuan_ed01_o0009904
  sequence: 402
  start_offset: 9350
  end_offset: 9357
  text: "　　正印  \n"
  quote_sha256: 1db0b9690e42e3d351c7308359ea102966999874e74dcefc967aeb3f2efb2cbf
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9904
    raw_end: 9911
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9350
    end_offset: 9357
    quote_sha256: 1db0b9690e42e3d351c7308359ea102966999874e74dcefc967aeb3f2efb2cbf
- span_id: ss_qianyuan_ed01_o0009911
  sequence: 403
  start_offset: 9357
  end_offset: 9402
  text: '    正印乃所以制伤官也，但阳年与偏财合化，既无以制伤官，又虑天官有藉于偏财，为之阻隔；'
  quote_sha256: a416b105eab1afac54c89c255157324ce1c729cd1f1d3d3ce68aaf15126c6886
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9911
    raw_end: 9956
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9357
    end_offset: 9402
    quote_sha256: a416b105eab1afac54c89c255157324ce1c729cd1f1d3d3ce68aaf15126c6886
- span_id: ss_qianyuan_ed01_o0009956
  sequence: 404
  start_offset: 9402
  end_offset: 9436
  text: "阴年与食神合化，既无以制伤官，又虑七煞待制于食神，为之消灭。   \n"
  quote_sha256: 3f46c72a9fb144b956870cc8c487c11613dc8ecb36f01644df6d9b97b1e5695b
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9956
    raw_end: 9990
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9402
    end_offset: 9436
    quote_sha256: 3f46c72a9fb144b956870cc8c487c11613dc8ecb36f01644df6d9b97b1e5695b
- span_id: ss_qianyuan_ed01_o0009990
  sequence: 405
  start_offset: 9436
  end_offset: 9443
  text: "　　偏印  \n"
  quote_sha256: b5893e5f9787bcf2351bcad7a3cba63694bf6e113f44016c5247eb6549b35408
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9990
    raw_end: 9997
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9436
    end_offset: 9443
    quote_sha256: b5893e5f9787bcf2351bcad7a3cba63694bf6e113f44016c5247eb6549b35408
- span_id: ss_qianyuan_ed01_o0009997
  sequence: 406
  start_offset: 9443
  end_offset: 9468
  text: '    偏印能制食神，使食神不能制七煞，其害最大。'
  quote_sha256: 23e249a433758cdc84166c4bae27718cf5ec0533e988d88e4be03482c2a539a4
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 9997
    raw_end: 10022
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9443
    end_offset: 9468
    quote_sha256: 23e249a433758cdc84166c4bae27718cf5ec0533e988d88e4be03482c2a539a4
- span_id: ss_qianyuan_ed01_o0010022
  sequence: 407
  start_offset: 9468
  end_offset: 9485
  text: 惟食神与天官有碍，则又赖偏印之制。
  quote_sha256: 68cb9c8ed94a4b9cd571e827861f71f887f84cee2f48dabc5e5fe27cfc5386b1
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10022
    raw_end: 10039
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9468
    end_offset: 9485
    quote_sha256: 68cb9c8ed94a4b9cd571e827861f71f887f84cee2f48dabc5e5fe27cfc5386b1
- span_id: ss_qianyuan_ed01_o0010039
  sequence: 408
  start_offset: 9485
  end_offset: 9498
  text: 阳年与伤官合化，可以助官；
  quote_sha256: 48c6a59c3fc0adfc7fc490d70f79b84879d32f54c98ccda30badecdd36d4676a
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10039
    raw_end: 10052
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9485
    end_offset: 9498
    quote_sha256: 48c6a59c3fc0adfc7fc490d70f79b84879d32f54c98ccda30badecdd36d4676a
- span_id: ss_qianyuan_ed01_o0010052
  sequence: 409
  start_offset: 9498
  end_offset: 9515
  text: "阴年与正财合化，适以损官。   \n"
  quote_sha256: c6bf46bbddfc424d09c30e239332641dff825d1db5daf835ae1c97e3ecc19f96
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10052
    raw_end: 10069
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9498
    end_offset: 9515
    quote_sha256: c6bf46bbddfc424d09c30e239332641dff825d1db5daf835ae1c97e3ecc19f96
- span_id: ss_qianyuan_ed01_o0010069
  sequence: 410
  start_offset: 9515
  end_offset: 9522
  text: "　　劫财  \n"
  quote_sha256: e4120cc792f35eeabc8d0e22bae3982ffa3a8c6ad01bf04953248494a6f9bed9
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10069
    raw_end: 10076
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9515
    end_offset: 9522
    quote_sha256: e4120cc792f35eeabc8d0e22bae3982ffa3a8c6ad01bf04953248494a6f9bed9
- span_id: ss_qianyuan_ed01_o0010076
  sequence: 411
  start_offset: 9522
  end_offset: 9535
  text: '   此为十曜中最恶之星。'
  quote_sha256: 79b505db23dac130ca5c1d52959d8873c05b670fac3bbc131669bc2da403cece
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10076
    raw_end: 10089
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9522
    end_offset: 9535
    quote_sha256: 79b505db23dac130ca5c1d52959d8873c05b670fac3bbc131669bc2da403cece
- span_id: ss_qianyuan_ed01_o0010089
  sequence: 412
  start_offset: 9535
  end_offset: 9573
  text: 阳年虽有合七煞之休，阴年实有合偏财之咎，经但端主伤妻，自历年试之，正不止此。
  quote_sha256: d466a916c1f06b1e5dfc1971a543a523d1cbe7adb9e8748cda34708d6dc75e3f
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10089
    raw_end: 10127
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9535
    end_offset: 9573
    quote_sha256: d466a916c1f06b1e5dfc1971a543a523d1cbe7adb9e8748cda34708d6dc75e3f
- span_id: ss_qianyuan_ed01_o0010127
  sequence: 413
  start_offset: 9573
  end_offset: 9586
  text: 与日有关，即行劫度，克父；
  quote_sha256: 06ea00fdaa4a99a50e426918510dc18f0b1c183a9b3b75836bfbf1c0758ad635
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10127
    raw_end: 10140
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9573
    end_offset: 9586
    quote_sha256: 06ea00fdaa4a99a50e426918510dc18f0b1c183a9b3b75836bfbf1c0758ad635
- span_id: ss_qianyuan_ed01_o0010140
  sequence: 414
  start_offset: 9586
  end_offset: 9599
  text: 与月有关，即行劫度，克母；
  quote_sha256: 5ab1c6f81228e258381b4b104c8a7966e398d9fa59787a0e2a0bf0573e9aa5f3
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10140
    raw_end: 10153
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9586
    end_offset: 9599
    quote_sha256: 5ab1c6f81228e258381b4b104c8a7966e398d9fa59787a0e2a0bf0573e9aa5f3
- span_id: ss_qianyuan_ed01_o0010153
  sequence: 415
  start_offset: 9599
  end_offset: 9614
  text: 与弟兄有关，即行劫度，克弟兄；
  quote_sha256: b27962d8959895c532f87689b60679a1fa8ebc686117ee05917d2d2184bf00b9
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10153
    raw_end: 10168
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9599
    end_offset: 9614
    quote_sha256: b27962d8959895c532f87689b60679a1fa8ebc686117ee05917d2d2184bf00b9
- span_id: ss_qianyuan_ed01_o0010168
  sequence: 416
  start_offset: 9614
  end_offset: 9629
  text: 与子孙有关，即行劫度，克子孙。
  quote_sha256: 71e1e37836636feda6069bfab568f860d0ef8b847a76a1ab2ab3494ce74e2e7f
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10168
    raw_end: 10183
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9614
    end_offset: 9629
    quote_sha256: 71e1e37836636feda6069bfab568f860d0ef8b847a76a1ab2ab3494ce74e2e7f
- span_id: ss_qianyuan_ed01_o0010183
  sequence: 417
  start_offset: 9629
  end_offset: 9668
  text: 虽不行劫度，但逢劫顶度，亦诸恶毕集，而且耗散有之、疾病有之，居官者降罚亦有之；
  quote_sha256: 050fecef516c730a652fcd2f2cf38799d91d743a60f38aeb627748029c1ddc47
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10183
    raw_end: 10222
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9629
    end_offset: 9668
    quote_sha256: 050fecef516c730a652fcd2f2cf38799d91d743a60f38aeb627748029c1ddc47
- span_id: ss_qianyuan_ed01_o0010222
  sequence: 418
  start_offset: 9668
  end_offset: 9687
  text: 若与妻主有关，妻主又不得气，常常断弦；
  quote_sha256: ce5dd0a83fa479b744bc6947ef90a37bf019e4448a4969c70adbc7e513b34372
  evidence_level: offset_level
  source_anchor:
    raw_text_revision_id: rev_1ce3ae8b96e046efa12981166780c282
    raw_start: 10222
    raw_end: 10241
    cleaned_text_revision_id: rev_500f0eabc3514f9784161999f782d793
    start_offset: 9668
    end_offset: 9687
