- span_id: ss_qianyuan_ed01_o0003973
  sequence: 175
  start_offset: 3419
  end_offset: 3465
  text: "如生旺得地，妇人不富即贵，男子多得贤妻妾，子孙茂盛，或主作赘，且皇族每与此煞关通。   \n "
