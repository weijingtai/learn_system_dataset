  verdict: B
  reason: 第23-24行是把《元星》一书的星图/星盘插图，用'星曜名目+连字符分隔'的方式线性文本化排布，紧接第25行原文明确说明'右将元星天道立极之图、元星仰观天文之图，依元星一书开载'，可确认这两行对应两幅插图。README
    §5 第10项边界说明（裁决第91/92条）明确：检测范围覆盖'连续2行以上、每行≥3个字符的制表符/框线字符区块（覆盖...ASCII 框线 +-|...）'，本区块 2 行、每行远超 3 个转义连字符，按规格文字描述应在检测范围内，不属于'自由手绘式字符画、单行图形或分散的标点线条'这类已知未覆盖范围。但
    cleaner.py 里 textualized_diagram 的框线正则（diagram_box_pattern）要求'整行只由框线/ASCII 图形字符组成'（如 r'^[ \t]*[...]{3,}[
    \t]*$' 或以框线字符开头结尾），而本区块每行是'中文星曜名+转义连字符'交替出现（如'计\-\-\-\-日\-\-\-\-...'），整行并非纯框线字符，无法匹配任何一个分支正则，也不含【图表】/【图式】显式标记或
    Markdown 表格竖线，因此 M2 对这两行零命中。这是检测规则实现比规格文字描述更严格导致的漏报：规格说的是'每行≥3个此类字符的区块'，代码实现却要求'整行都是此类字符'。判定 M2 漏报：textualized_diagram
    的框线检测正则需要放宽为'一行内此类分隔字符达到密度/数量阈值即可'，而不强制要求整行都是分隔符（星曜名目穿插其间也应算作同一图表区块）。
