    命中并标记 action=patched（即会被从 cleaned_text 中整段剥离）。但这不是'水印广告'意义上的污染内容——它是文件自身声明的溯源字段（键名就是 github_repo_url），与
    M1 契约 §2.1 里 source_url/source_site 字段的功能完全对应，属于本该保留的结构化出处信息，而非第三方转换站点塞进正文的广告/推广链接。watermark 规则里的'链接'子类用无差别的'任意
    http(s) URL'正则实现，无法区分'广告推广链接'与'文件自带的溯源引用链接'，把后者也当噪声剥离属于误报，且会导致 cleaned_text 丢失可核验的来源引用。判定 M2 误报：应在
    watermark 检测里为 YAML 结构化字段（或至少是已被识别为 source_url/source_site 类字段的值）设排除，或将'链接'子类的触发范围限定为正文可读段落内出现的 URL，而非无差别扫描全文（含头）。
