    YAML block 并登记'头体未分离'。经核实 M1 (pipeline/intake/source.py) 把 yaml_metadata 作为提交时的独立字段存入 source_manifest，但冻结进
    raw_text 的仍是原始文件全部字节（含 YAML 头），M2 的 clean_text() 直接对这份含头文件调用，因此这属于M2 检测规则集的真实空缺，不是'因为上游已处理所以不需要再登记'。判定
    M2 漏报：README §5 第5项要求的'YAML 头与正文分离'检查在 escape_residue 实现里完全缺失。
