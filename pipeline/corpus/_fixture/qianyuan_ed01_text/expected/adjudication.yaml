  context: 大，而化禄之体精用博也。   \n 　　计\-\-\-\-日\-\-\-\-\-\-月\-\-\-
  verdict: E
  reason: 此区间（第23-24行星图分隔符 4 个 '\-' 连写）是逐字符计 vs 相邻合并计口径分歧的代表样本，适用于全部 escape_residue 分歧：M2 对全文 76 个 '\X'
    形式转义符逐个生成独立 finding（76 条，每条 2 字符），golden 把相邻转义符合并为连续区间登记（23 条）。经逐字符集合比对，M2 的 76 条与 golden 的 23 条（不含
    YAML 头那条）覆盖的字符偏移集合完全相同（均为 152 个字符位置，集合相等）——不是漏报/误报，纯粹是'一个转义符一条记录'还是'相邻转义符合并为一条区间记录'的登记粒度选择。逐字符计的优点：每条
    finding 对应唯一确定性 patch，patch_id 到字符级映射更直接、便于 deterministic_patch_set 逐字符核对；缺点：76 条记录中大量是同一视觉分隔线的碎片，人工审阅报告时噪音大、难以一眼看出'这是同一个装饰性分隔线'。合并区间的优点：报告可读性更好，一条
    finding 直接对应'第23-24行的分隔符残留'这一语义单元，人工决定表填写量从76降到23；缺点：合并规则（何为'相邻'、跨行是否合并）需要额外定义，且丢失了逐字符 patch 的一一对应关系，需要在
    patch 层再做一次展开才能落到确定性映射。两种口径各有取舍，不建议强行统一，建议主 Agent 明确sanitization_report 的 finding 粒度口径写入规格（README
    §81），并要求两种粒度都可从同一份 patch 集合无损互相推导。
