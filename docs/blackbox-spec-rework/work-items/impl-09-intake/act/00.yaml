act_id: impl-09/00
title: M1 纯函数：来源校验、文件读取与 source_manifest 构造
estimated_minutes: 60
group: J1
depends_on: []
scope:
  write: [pipeline/intake/__init__.py, pipeline/intake/errors.py, pipeline/intake/serialize.py, pipeline/intake/source.py, pipeline/intake/manifest.py, pipeline/intake/tests/__init__.py, pipeline/intake/tests/helpers.py, pipeline/intake/tests/test_manifest.py]
tests_first:
  - 先写 tests/helpers.py 与 tests/test_manifest.py（用例名与下文逐字），运行 `.venv/bin/python -m unittest discover -s pipeline/intake/tests -t .`，因 ImportError 全红，记录 Red；再实现
contract: |
  __init__.py：
    M1_TOOL = "pipeline.intake"；M1_TOOL_VERSION = "0.1.0"
    MANIFEST_TASK_ID = "ingest_source"
  errors.py：
    class IntakeRefused(Exception)，构造 IntakeRefused(message, code=None)
    class SourceAssetMissing(IntakeRefused)，构造 SourceAssetMissing(paths)
      paths：list[str]；code="SRC_001"
      message = "\n".join("BLOCKED_SOURCE_ASSET_MISSING %s" % p for p in paths)
  serialize.py：dump_manifest_yaml(obj) -> bytes
    _M1Dumper 为 yaml.SafeDumper 的私有子类，只在该子类上 add_representer(str, ...)
    匹配 ^[0-9a-f]{64}$ 的字符串以 style='"' 输出
    不得向 yaml.SafeDumper 注册任何 representer
  source.py：
    load_source(data) -> dict（不修改入参）
      data 非 dict → IntakeRefused(SCH_001)
      必填键（11 个）：source_id, work_title, edition_note, technique_id, rights_status, release_policy, edition_part, source_site, source_url, file_sha256, pages
      可选键（2 个）：repo_commit（缺省 None）, yaml_metadata（缺省 None）
      出现表外键 → IntakeRefused(SCH_002)
      source_site：非空 str
      source_url：以 http:// 或 https:// 开头
      file_sha256：匹配 ^[0-9a-f]{64}$
      pages：非空 list，每项匹配 ^[a-zA-Z0-9_-]+$，无重复
      edition_part：键集合 == {artifact_id, label, pages}；artifact_id 非空 str；label 非空 str
      返回：按固定键序重建的新 dict
    read_source_files(source_dir, pages) -> list[dict]
      source_dir 不是目录 → SourceAssetMissing([str(source_dir)])
      按 pages 顺序先收集全部不存在的路径，非空则一次 raise SourceAssetMissing(paths)
      每项 {"page", "data": bytes, "sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}
      编码检测：尝试 UTF-8；如有 BOM 则记录原始编码
      返回 bytes 为 UTF-8 编码后的字节（统一编码）
  manifest.py（纯函数）：
    build_source_manifest(source_info, files) -> dict
      顶层键序（10 个）：source_id, work_title, edition_note, technique_id, rights_status, release_policy, edition_part, source_assets, files, conversion, content_status
      source_assets[] 键序（12 个）：page, path_ref, sha256, size, width, height, object_store, in_git, yaml_metadata, source_site, source_url, repo_commit
        width/height：电子文本恒为 None
        size：文件字节长度
        object_store: "local"
        in_git: false
        repo_commit：无则 None
      files = []
      conversion = {"tool": M1_TOOL, "tool_version": M1_TOOL_VERSION, "inputs": [各 path_ref], "note": "M1 电子文本入库；不做清洗（§9）"}
      content_status = "machine_extracted"
      注意：顶层不含 source_sites——来源以 source_assets[] 逐份登记为权威（§77 来源无关），顶层不冗余
    manifest_bytes(source_info, files) -> bytes = serialize.dump_manifest_yaml(build_source_manifest(source_info, files))
  tests/helpers.py（只供测试）：
    make_text_file(name, content, encoding="utf-8") -> Path：写入临时文件，返回路径
    fixture_source() -> dict：返回合法 source_info（乾元秘旨片段）
tests:
  test_manifest.py: |
    - test_dump_roundtrip（synthetic_fixture: true，dump_manifest_yaml 写出后 safe_load 回来键值不变）
    - test_dump_does_not_touch_global_safedumper（synthetic_fixture: true，调用前后 yaml.SafeDumper.yaml_representers 相等）
    - test_sha256_quoted_other_strings_plain（synthetic_fixture: true，64 位十六进制带双引号；其他字符串不加引号）
    - test_load_source_valid_returns_new_dict（synthetic_fixture: true，返回值键序固定；修改返回值不影响入参）
    - test_load_source_missing_key_SCH_001（synthetic_fixture: true）
    - test_load_source_extra_key_SCH_002（synthetic_fixture: true）
    - test_load_source_bad_source_url_SCH_002（synthetic_fixture: true）
    - test_load_source_bad_file_sha256_SCH_002（synthetic_fixture: true）
    - test_load_source_bad_pages_duplicate_SCH_002（synthetic_fixture: true）
    - test_load_source_optional_repo_commit_accepted（synthetic_fixture: true，带 repo_commit 通过；缺省为 None）
    - test_read_source_files_collects_all_missing（synthetic_fixture: true）
    - test_read_source_files_missing_dir（synthetic_fixture: true）
    - test_read_source_files_reads_utf8（synthetic_fixture: true）
    - test_read_source_files_records_sha256（synthetic_fixture: true）
    - test_build_manifest_key_order（synthetic_fixture: true）
    - test_build_manifest_source_assets_key_order（synthetic_fixture: true，逐字断言 12 键键序）
    - test_build_manifest_no_source_sites（synthetic_fixture: true，顶层不含 source_sites）
    - test_manifest_bytes_deterministic（synthetic_fixture: true）
verify:
  - .venv/bin/python -m unittest discover -s pipeline/intake/tests -t . 2>&1 | tail -3   # OK，用例数 ≥ 18
  - grep -rnE 'PIL|paddle|requests|openai|anthropic|httpx' pipeline/intake --include='*.py' | wc -l   # 0
  - grep -rn 'SafeDumper.add_representer' pipeline/intake --include='*.py' | wc -l   # 0
  - TDD §3 回归
commit:
  add: [pipeline/intake]
  message: "feat(m1-intake): pure source intake core — source validation, file reading, manifest construction (electronic text route, §9/§22.1)"
on_fail: 停止并报告；需要新增来源字段时停手上报
