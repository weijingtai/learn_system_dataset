act_id: impl-09/04
title: M2 事务：Ledger 写路径（cleaned_text_revision + deterministic_patch_set + sanitization_report）
estimated_minutes: 90
group: J3
depends_on: [impl-09/01, impl-09/02, impl-09/03]
scope:
  write: [pipeline/digitization/step.py, pipeline/digitization/__main__.py, pipeline/digitization/tests/test_step.py]
tests_first:
  - 先写 tests/test_step.py（用例名与下文逐字），因 import 失败全红，记录 Red；再实现
contract: |
  step.py：
    run_m2(service, raw_text_revision_id: str, source_info: dict, edition_part_id: str) -> dict
      事务序列（§17 + §7.1 人工事件）：
      1. 检查同一 edition_part_id 不得已有 m2 Checkpoint，有则 DigitizationRefused
      2. 读取 raw_text 修订内容
      3. begin_step_run(service, stage="m2", task_id="sanitize_text")
      4. 执行 clean_text(raw_content) → CleanResult
      5. 执行 build_patches(raw_text, cleaned_text, findings) → patches
      6. 执行 build_sanitization_report(findings, patches) → report
      7. 执行 evaluate_m2_gate(report) → gate_result
      8. 如果 gate_result.passed == false：fail_step_run(service, failed_check="m2_gate")
      9. 如果有 deferred findings：await_human(service, ...) → 返回 awaiting_human
      10. put_artifact(service, artifact_type="cleaned_text_revision", content=cleaned_bytes, ...)
      11. put_artifact(service, artifact_type="deterministic_patch_set", content=patches_bytes, ...)
      12. put_artifact(service, artifact_type="sanitization_report", content=report_bytes, ...)
      13. record_transformation(service, task_id="sanitize_text", inputs=[raw_text_rev], outputs=[cleaned_rev, patch_rev, report_rev])
      14. seal_revision(service, cleaned_rev)
      15. finish_step_run(service)
      返回：{"cleaned_revision_id": str, "patch_revision_id": str, "report_revision_id": str, "gate_result": GateResult, "step_run_id": str}
    failed_check 闭集：input_contract, m2_gate, internal
  __main__.py：
    CLI 入口：--raw-text-revision-id, --source-json, --edition-part-id, --ledger-dir
    成功 exit 0，末行以 "M2 OK" 开头
    DigitizationRefused exit 2
    Gate 失败 exit 1
tests:
  test_step.py: |
    - test_run_m2_success（synthetic_fixture: true，合法输入 → 三个 revision_id + gate_result.passed=True）
    - test_run_m2_gate_failure（synthetic_fixture: true，deferred findings → gate_result.passed=False, failed_check="m2_gate"）
    - test_run_m2_duplicate_refused（synthetic_fixture: true，同 edition_part_id 二次运行 → DigitizationRefused）
    - test_run_m2_zero_writes_on_failure（synthetic_fixture: true，失败时 Ledger 行数不变）
    - test_run_m2_raw_text_unchanged（synthetic_fixture: true，raw_text 修订不可变）
    - test_run_m2_manifest_sha256（synthetic_fixture: true，sanitization_report 内容 sha256 可取回）
    - test_run_m2_cli_success（synthetic_fixture: true，exit 0，"M2 OK"）
    - test_run_m2_cli_gate_failure（synthetic_fixture: true，exit 1）
verify:
  - .venv/bin/python -m unittest discover -s pipeline/digitization/tests -t . 2>&1 | tail -3   # OK，用例数 ≥ 48
  - TDD §3 回归
commit:
  add: [pipeline/digitization]
  message: "feat(m2-digitization): Ledger write path for cleaned_text, patches, and report (§17/§81)"
on_fail: 停止并报告
