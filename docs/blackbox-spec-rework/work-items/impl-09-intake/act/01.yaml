act_id: impl-09/01
title: M1 事务：Ledger 写路径（source_manifest + raw_text 冻结）
estimated_minutes: 75
group: J2
depends_on: [impl-09/00]
scope:
  write: [pipeline/intake/step.py, pipeline/intake/__main__.py, pipeline/intake/tests/test_step.py]
tests_first:
  - 先写 tests/test_step.py（用例名与下文逐字），因 import 失败全红，记录 Red；再实现
contract: |
  step.py：
    run_m1(service, source_info, files, edition_part_id) -> dict
      事务序列（§17）：
      1. 检查同一 edition_part_id 不得已有 m1 Checkpoint，有则 IntakeRefused("M1 已封存")
      2. begin_step_run(service, stage="m1", task_id="ingest_source")
      3. 对每个文件：put_artifact(service, artifact_type="raw_text", content=bytes, ...) → 冻结 raw_text 修订
      4. put_artifact(service, artifact_type="source_manifest", content=manifest_bytes, ...)
      5. record_transformation(service, task_id="ingest_source", inputs=[], outputs=[manifest_rev, raw_text_revs])
      6. seal_revision(service, manifest_rev)
      7. finish_step_run(service)
      返回：{"manifest_revision_id": str, "raw_text_revision_ids": list[str], "step_run_id": str}
      失败时：fail_step_run(service, failed_check="...")，返回 {"error": str}
    failed_check 闭集：input_contract, internal
  __main__.py：
    CLI 入口：--source-dir, --source-json（JSON 字符串或文件路径）, --edition-part-id, --ledger-dir
    成功 exit 0，末行以 "M1 OK" 开头
    IntakeRefused exit 2
    SourceAssetMissing exit 3
tests:
  test_step.py: |
    - test_run_m1_success（synthetic_fixture: true，合法输入 → manifest_revision_id, raw_text_revision_ids, step_run_id）
    - test_run_m1_duplicate_refused（synthetic_fixture: true，同 edition_part_id 二次运行 → IntakeRefused）
    - test_run_m1_zero_writes_on_failure（synthetic_fixture: true，失败时 Ledger 行数不变）
    - test_run_m1_raw_text_frozen（synthetic_fixture: true，raw_text 修订不可变）
    - test_run_m1_manifest_sha256（synthetic_fixture: true，manifest 内容 sha256 可从 Object Store 取回）
    - test_run_m1_cli_success（synthetic_fixture: true，exit 0，末行 "M1 OK"）
    - test_run_m1_cli_missing_files（synthetic_fixture: true，exit 3，"BLOCKED_SOURCE_ASSET_MISSING"）
verify:
  - .venv/bin/python -m unittest discover -s pipeline/intake/tests -t . 2>&1 | tail -3   # OK，用例数 ≥ 26
  - TDD §3 回归
commit:
  add: [pipeline/intake]
  message: "feat(m1-intake): Ledger write path for electronic text source manifest and raw_text freeze (§17)"
on_fail: 停止并报告
