act_id: impl-09/02
title: M2 纯函数：文本清洗、patch 映射与 SanitizationReport 发现记录
estimated_minutes: 90
group: J3
depends_on: [impl-09/00]
scope:
  write: [pipeline/digitization/__init__.py, pipeline/digitization/errors.py, pipeline/digitization/raw_text.py, pipeline/digitization/cleaner.py, pipeline/digitization/patcher.py, pipeline/digitization/reporter.py, pipeline/digitization/tests/__init__.py, pipeline/digitization/tests/helpers.py, pipeline/digitization/tests/test_cleaner.py]
tests_first:
  - 先写 tests/helpers.py 与 tests/test_cleaner.py（用例名与下文逐字），因 ImportError 全红，记录 Red；再实现
contract: |
  __init__.py：
    M2_TOOL = "pipeline.digitization"
    M2_TOOL_VERSION = "0.1.0"
    FINDING_KINDS = ("replacement_char", "private_use_area", "escape_residue", "watermark", "header_footer", "duplicate", "missing", "textualized_diagram", "variant_mixed", "suspected_error", "control_char", "encoding_issue")
    TERMINAL_STATES = ("processed", "known_unresolvable", "deferred")
    ACTIONS = ("kept", "patched", "flagged")
  errors.py：
    class DigitizationError(Exception)
    class DigitizationRefused(DigitizationError)，构造 DigitizationRefused(message, code=None)
  raw_text.py：
    freeze_raw_text(content: bytes, encoding: str) -> dict
      返回 {"content": bytes（UTF-8 编码后）, "encoding_original": str, "encoding_normalized": "utf-8", "has_bom": bool, "size": int}
  cleaner.py（§4.4 十三项清洗，纯函数）：
    class CleanResult：属性 findings: list[Finding], cleaned_text: str
    clean_text(raw_content: str) -> CleanResult
      对 raw_content 依次执行 13 项清洗检查，每项生成 Finding 记录
      不修改原始文本，只记录发现
    class Finding：属性 finding_id: str, kind: str, raw_start: int, raw_end: int, raw_excerpt: str, context: str, action: str, patch_id: str|None, basis: str, terminal_state: str
    finding_id 格式："<kind>@<raw_start>-<raw_end>"（无新前缀，P8 合规；同一 kind 同一区间唯一）
  patcher.py：
    class Patch：属性 patch_id: str, raw_start: int, raw_end: int, cleaned_start: int, cleaned_end: int, action: str, basis: str
    build_patches(raw_text: str, cleaned_text: str, findings: list[Finding]) -> list[Patch]
      对比原始与清洗后文本，生成确定性 patch 映射
      patch_id 格式："patch_001" 起顺序编号
    apply_patches(raw_text: str, patches: list[Patch]) -> str
      应用 patches 到 raw_text，验证可逆性
  reporter.py：
    build_sanitization_report(findings: list[Finding], patches: list[Patch]) -> dict
      返回 {"schema_version": "0.1.0-draft", "findings": [...], "patches": [...], "summary": {各 kind 计数, deferred_count: int}}
      finding 键序：finding_id, kind, raw_start, raw_end, raw_excerpt, context, action, patch_id, basis, terminal_state
tests:
  test_cleaner.py: |
    - test_clean_text_finds_replacement_chars（synthetic_fixture: true，含 ? 的合成文本 → replacement_char finding）
    - test_clean_text_finds_pua（synthetic_fixture: true，含 PUA 字符 → private_use_area finding）
    - test_clean_text_finds_escape_residue（synthetic_fixture: true，含 \- 的文本 → escape_residue finding）
    - test_clean_text_finds_control_chars（synthetic_fixture: true，含零宽字符 → control_char finding）
    - test_clean_text_finds_variant_mixed（synthetic_fixture: true，含繁简混杂 → variant_mixed finding）
    - test_clean_text_finds_suspected_error（synthetic_fixture: true，含疑似形近误字 → suspected_error finding）
    - test_clean_text_no_findings_clean_input（synthetic_fixture: true，无问题文本 → 0 findings）
    - test_clean_text_deferred_blocks_gate（synthetic_fixture: true，deferred finding → deferred_count > 0）
    - test_build_patches_deterministic（synthetic_fixture: true，两次调用字节相同）
    - test_apply_patches_reversible（synthetic_fixture: true，apply_patches(raw, patches) == cleaned）
    - test_build_sanitization_report_key_order（synthetic_fixture: true）
    - test_build_sanitization_report_summary_counts（synthetic_fixture: true）
    - test_findings_have_unique_ids（synthetic_fixture: true，finding_id 格式 <kind>@<raw_start>-<raw_end>）
    - test_findings_raw_offsets_consistent（synthetic_fixture: true，raw_start < raw_end）
    - test_deferred_finding_in_report（synthetic_fixture: true）
    - test_clean_text_finds_encoding_issue（synthetic_fixture: true，含 BOM 或编码声明 → encoding_issue finding）
    - test_clean_text_finds_watermark（synthetic_fixture: true，含非文献水印内容 → watermark finding）
    - test_clean_text_finds_header_footer（synthetic_fixture: true，含重复页眉页脚行 → header_footer finding）
    - test_clean_text_finds_duplicate（synthetic_fixture: true，含连续重复内容 → duplicate finding）
    - test_clean_text_finds_missing（synthetic_fixture: true，含缺失缺口标记 → missing finding，终态恒 deferred）
    - test_clean_text_finds_textualized_diagram（synthetic_fixture: true，含文本化图表区块 → textualized_diagram finding）
    - test_every_finding_kind_has_detector（断言每个 kind 存在触发样本，缺失检测逻辑时转红）
verify:
  - .venv/bin/python -m unittest discover -s pipeline/digitization/tests -t . 2>&1 | tail -3   # OK，用例数 ≥ 22
  - TDD §3 回归
commit:
  add: [pipeline/digitization]
  message: "feat(m2-digitization): pure cleaning, patch mapping, and SanitizationReport generation (§4.4/§81)"
on_fail: 停止并报告
