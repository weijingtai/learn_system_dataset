act_id: impl-09/03
title: M2 Gate：电子文本清洗放行判定
estimated_minutes: 60
group: J3
depends_on: [impl-09/02]
scope:
  write: [pipeline/digitization/gate.py, pipeline/digitization/tests/test_gate.py]
tests_first:
  - 先写 tests/test_gate.py（用例名与下文逐字），因 import 失败全红，记录 Red；再实现
contract: |
  gate.py：
    class GateResult：属性 passed: bool, failed_checks: list[str], warnings: list[str]
    evaluate_m2_gate(report: dict, decisions: dict|None = None) -> GateResult
      report: build_sanitization_report 的返回值
      decisions: 用户决定表（可选，第一版可为 None）
      检查项（逐条独立）：
      1. report_valid：report 结构合法（有 findings、summary 键）
      2. no_deferred：summary.deferred_count == 0
      3. findings_valid：每个 finding 的 kind ∈ FINDING_KINDS，terminal_state ∈ TERMINAL_STATES
      4. patches_consistent：每个 finding 的 patch_id 如存在则在 patches 列表中
      5. summary_consistent：summary 各 kind 计数 == 实际 findings 数
      全过 → GateResult(passed=True, failed_checks=[], warnings=...)
      任一失败 → GateResult(passed=False, failed_checks=[失败项], warnings=...)
      warnings：非阻断项（如 kind=variant_mixed 的发现数 > 阈值时警告）
      gate.py 不 import cleaner、patcher、reporter、raw_text
tests:
  test_gate.py: |
    - test_gate_passes_clean_input（synthetic_fixture: true，无 findings → passed=True）
    - test_gate_passes_with_processed_findings（synthetic_fixture: true，有 processed findings → passed=True）
    - test_gate_fails_deferred（synthetic_fixture: true，deferred_count > 0 → passed=False, "no_deferred"）
    - test_gate_fails_invalid_kind（synthetic_fixture: true，非法 kind → passed=False, "findings_valid"）
    - test_gate_fails_invalid_terminal_state（synthetic_fixture: true，非法 terminal_state → passed=False, "findings_valid"）
    - test_gate_fails_patch_missing（synthetic_fixture: true，patch_id 不在 patches 中 → passed=False, "patches_consistent"）
    - test_gate_fails_summary_mismatch（synthetic_fixture: true，计数不符 → passed=False, "summary_consistent"）
    - test_gate_fails_invalid_report（synthetic_fixture: true，缺 findings 键 → passed=False, "report_valid"）
    - test_gate_independence（不 import cleaner/patcher/reporter/raw_text）
verify:
  - .venv/bin/python -m unittest discover -s pipeline/digitization/tests -t . 2>&1 | tail -3   # OK，用例数 ≥ 24
  - grep -rnE 'import.*(cleaner|patcher|reporter|raw_text)' pipeline/digitization/gate.py | wc -l   # 0
  - TDD §3 回归
commit:
  add: [pipeline/digitization]
  message: "feat(m2-gate): independent M2 sanitization gate for electronic text (§10.1)"
on_fail: 停止并报告
