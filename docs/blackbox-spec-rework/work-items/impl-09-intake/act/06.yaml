act_id: impl-09/06
title: 来源不可区分：真实 M1→M2 与 fixture_ingest 同形，M3 在本包产物上编译出与金标逐字节相同的 corpus_spans
estimated_minutes: 60
group: K4
depends_on: [impl-09/05]
preconditions:
  - impl-02 状态为 ACCEPTED（run_m3 行为冻结）；否则停手上报
scope:
  write: [pipeline/digitization/tests/test_parity.py]
tests_first:
  - 本 ACT 只写测试。先写 test_parity.py，在本机（有真实前三页页图）运行；若任一用例因实现缺陷失败，停手上报，不得改 scope 外文件
contract: |
  只写测试，不改任何生产代码。
  整个测试类 skipUnless：ocr/data_work/sanche_pages/page_001.png、page_002.png、page_003.png 均存在；skip 原因为 "BLOCKED_SOURCE_ASSET_MISSING <缺失路径>"
  共享准备（setUpClass，tempfile）：
    A 侧 Ledger（本包路径）：
      run_m1(service_a, source_intake.tests.helpers.fixture_submission(), "ocr/data_work/sanche_pages")
      build_ocr_root(tmp/"ocr")（fixture 三页 + fixture 异常记录 + 空审计）
      run_m2(service_a, "art_000000000000000000000000000000e1", tmp/"ocr", fixture_decisions 字节)
    B 侧 Ledger（fixture 路径）：pipeline.ledger.fixture_ingest.ingest(FIXTURE, service_b, stages=("m1","m2"))
  「M3 可见投影」project(service, ep) 由测试内实现，只用 Ledger 读接口，返回：
    m1_ingest_source_artifact_type
    m1_manifest_projection：safe_load 后取 source_id, work_title, technique_id, edition_part, source_assets[].page/sha256
    m2_tasks：[(task_id, terminal_state)] 按 Checkpoint 顺序
    m2_page_bytes_sha256：{页: 修订 sha256}
    ocr_page_set_projection：ocr_pages[(page, sha256)] 与 terminal_states
    human_event_common：[{page, terminal_state, layout_type, evidence}]
    human_decisions_count
tests:
  test_parity.py: |
    - test_m1_manifest_source_assets_equal_fixture（A 侧 source_manifest 的 source_assets 列表 == fixture manifest.yaml 的 source_assets；顶层键序 == fixture）
    - test_m2_counts_hash_payload_equal_fixture_expected（A 侧 m2 StagePackage counts、content_sha256 == expected/m2；ocr_page_set 的 page/sha256/terminal_states == expected/m2 payload）
    - test_ledger_shape_parity_with_fixture_ingest（project(A) == project(B)）
    - test_m3_passthrough_spans_bytes_equal_golden（A 侧 run_m3(service_a, ep) succeeded；corpus_spans 修订字节 == fixture spans.yaml 字节；sha256 == "ec6d77b90aa1408d040465babc28a81f59aadf6d6edd9ba8db66ff8ead0b44ef"；excluded_pages == {"page_002": "known_unrecognizable"}）
    - test_m3_passthrough_twice_identical（另起一对临时 Ledger 重复 A 侧 M1→M2→M3，corpus_spans 字节相同）
verify:
  - .venv/bin/python -m unittest discover -s pipeline/digitization/tests -t . 2>&1 | tail -3   # OK，用例数 ≥ 64；本机 skip 为 0
  - FIXTURE_ASSET_ROOT=/nonexistent 情形不适用于本测试；在无页图机器上 5 个用例 skip，原因以 BLOCKED_SOURCE_ASSET_MISSING 开头
  - TDD §3 回归
commit:
  add: [pipeline/digitization/tests/test_parity.py]
  message: "test(m1/m2): source-indistinguishable parity with fixture ingest; m3 compiles golden spans from real intake"
on_fail: 停止并报告首个不等字段或首个字节差异位置；不得修改 fixture、fixture_ingest 或 corpus_compiler；不得放宽比较
