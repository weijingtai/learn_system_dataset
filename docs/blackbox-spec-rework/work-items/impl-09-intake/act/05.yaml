act_id: impl-09/05
title: M2 决定表：人工终态决定表加载与 §7.1 人工事件登记
estimated_minutes: 60
group: J3
depends_on: [impl-09/04]
scope:
  write: [pipeline/digitization/decisions.py, pipeline/digitization/tests/test_decisions.py]
tests_first:
  - 先写 tests/test_decisions.py（用例名与下文逐字），因 import 失败全红，记录 Red；再实现
contract: |
  decisions.py：
    load_decisions(data: dict) -> dict
      data 必须键：schema_version, edition_part_artifact_id, entries
      schema_version == "1.0.0"
      entries: list[dict]，每项必须键：page, terminal_state, reason, decided_by
      terminal_state ∈ {"processed", "known_unresolvable", "deferred"}
      reason: 非空 str
      decided_by: 非空 str（P7：必须由用户本人填写，执行者不得代填）
      note: 可选 str
      返回：{"schema_version": str, "edition_part_artifact_id": str, "entries": list[dict]}
      校验失败 → DigitizationRefused(SCH_001 或 SCH_002)
    check_decisions_coverage(decisions: dict, findings: list[Finding]) -> list[str]
      返回需要决定但缺决定的 finding_id 列表
      deferred findings 必须有对应决定
      无决定的 deferred → 返回缺决定的 finding_id 列表
tests:
  test_decisions.py: |
    - test_load_decisions_valid（synthetic_fixture: true，合法输入 → 返回值键序固定）
    - test_load_decisions_missing_key_SCH_001（synthetic_fixture: true）
    - test_load_decisions_bad_terminal_state_SCH_002（synthetic_fixture: true）
    - test_load_decisions_empty_reason_SCH_001（synthetic_fixture: true）
    - test_load_decisions_bad_schema_version_SCH_002（synthetic_fixture: true）
    - test_check_decisions_coverage_all_decided（synthetic_fixture: true）
    - test_check_decisions_coverage_missing_deferred（synthetic_fixture: true）
    - test_check_decisions_coverage_non_deferred_not_required（synthetic_fixture: true）
    - test_decisions_modification_does_not_affect_input（synthetic_fixture: true）
verify:
  - .venv/bin/python -m unittest discover -s pipeline/digitization/tests -t . 2>&1 | tail -3   # OK，用例数 ≥ 38
  - TDD §3 回归
commit:
  add: [pipeline/digitization]
  message: "feat(m2-decisions): decision sheet loading and coverage check for deferred findings (§7.1/P7)"
on_fail: 停止并报告
