package: blackbox-impl-09-electronic-text
title: M1 电子文本入库 + M2 电子文本清洗（§9、§10、G7-RULINGS §76–§83）
status: DRAFT
executor_groups:
  J1: [impl-09/00, impl-09/01]              # M1 纯函数清洗与发现记录
  J2: [impl-09/02, impl-09/03]              # M1 入库事务（Ledger 写路径）
  J3: [impl-09/04, impl-09/05, impl-09/06]  # M2 清洗运行与 Gate
  J4: [impl-09/07]                          # 验收脚本
acts:
  - file: act/00.yaml
    id: impl-09/00
    writes: [pipeline/intake/__init__.py, pipeline/intake/errors.py, pipeline/intake/serialize.py, pipeline/intake/source.py, pipeline/intake/manifest.py, pipeline/intake/tests/__init__.py, pipeline/intake/tests/helpers.py, pipeline/intake/tests/test_manifest.py]
  - file: act/01.yaml
    id: impl-09/01
    writes: [pipeline/intake/step.py, pipeline/intake/__main__.py, pipeline/intake/tests/test_step.py]
  - file: act/02.yaml
    id: impl-09/02
    writes: [pipeline/digitization/__init__.py, pipeline/digitization/errors.py, pipeline/digitization/raw_text.py, pipeline/digitization/cleaner.py, pipeline/digitization/patcher.py, pipeline/digitization/reporter.py, pipeline/digitization/tests/__init__.py, pipeline/digitization/tests/helpers.py, pipeline/digitization/tests/test_cleaner.py]
  - file: act/03.yaml
    id: impl-09/03
    writes: [pipeline/digitization/gate.py, pipeline/digitization/tests/test_gate.py]
  - file: act/04.yaml
    id: impl-09/04
    writes: [pipeline/digitization/step.py, pipeline/digitization/__main__.py, pipeline/digitization/tests/test_step.py]
  - file: act/05.yaml
    id: impl-09/05
    writes: [pipeline/digitization/decisions.py, pipeline/digitization/tests/test_decisions.py]
  - file: act/06.yaml
    id: impl-09/06
    writes: [pipeline/digitization/tests/test_parity.py]
  - file: act/07.yaml
    id: impl-09/07
    writes: [pipeline/intake/acceptance.py, pipeline/intake/tests/test_acceptance.py, pipeline/digitization/acceptance.py, pipeline/digitization/tests/test_acceptance.py, openspec/acceptance/m1-intake.sh, openspec/acceptance/m2-sanitization.sh]
global_rules:
  - 每个 ACT 先写测试（Red 原文入报告）再实现；unittest；测试只用 tempfile 目录
  - 只用标准库 + PyYAML + jsonschema；不新增依赖；不新增 ID 前缀；不调用模型 API
  - M1 只读来源文件与申报件，M2 只读 raw_text 修订与决定表；begin 前一次读入字节并把哈希快照写入配置修订
  - 不得伪造文件、哈希或人工决定；真实决定表由用户写，执行者只在 tempfile 构造测试决定表
  - 中文注释与 docstring；公开函数名、参数名、返回键、检查名、CLI 输出前缀与 ACT contract 逐字一致
  - 每个 ACT 一个提交；不得 git add -A / git add .；执行者不写 ACCEPTANCE 或 ACCEPTED
  - 所有测试用合成文本样例与合成决定表均标 `synthetic_fixture: true`；验收判定不得把它们当作真实签发或真实书源（第 52、53 条、P7）
  - `finding_id` 格式 `<kind>@<raw_start>-<raw_end>`，无新前缀（P8）
  - 本包只新建 `m1-intake.sh`、`m2-sanitization.sh` 两份验收脚本；不修改 `run_all.sh`；接进 `run_all.sh` 属另一个独占 ACT（P4）
gates:
  - python3 docs/blackbox-spec-rework/work-items/impl-00-interfaces/check_interfaces.py | tail -1   # I00-IF SUMMARY pass=36 fail=0
  - bash openspec/schemas/verify.sh >/dev/null; echo $?                                             # 0
  - git diff --check
on_fail: 停止并报告；遇到以下任一情况一律停手上报——contract 有两种理解、测试无法按定义写出、需要改 scope 外文件、发现需新增 ID 前缀、发现修改了 run_all.sh
