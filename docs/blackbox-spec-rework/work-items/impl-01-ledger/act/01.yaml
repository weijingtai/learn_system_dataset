act_id: impl-01/01
title: 标识、状态机、错误码（pipeline/ledger/ids.py states.py errors.py actor.py）
estimated_minutes: 40
group: H1
depends_on: [impl-01/00]
scope:
  write: [pipeline/ledger/__init__.py, pipeline/ledger/ids.py, pipeline/ledger/states.py, pipeline/ledger/errors.py, pipeline/ledger/actor.py, pipeline/ledger/tests/__init__.py, pipeline/ledger/tests/test_ids.py, pipeline/ledger/tests/test_states.py]
tests_first:
  - 先写 test_ids.py、test_states.py（下列用例名逐个存在），运行 `.venv/bin/python -m unittest discover -s pipeline/ledger/tests -t .` 因 ImportError 全红；再实现
contract:
  errors.py: |
    class LedgerError(Exception): code: str | None, message
    子类（类名即语义，不新造错误码）：InvalidIdentifier(code='ID_001')、DuplicateIdentifier(code='ID_002')、MissingReference(code='REF_001')、HashMismatch(code='SRC_003')、SchemaViolation(code='SCH_001' 或 'SCH_002' 由调用方指定)、IllegalTransition(code=None)、NotConsumable(code=None)（引用了非 sealed Revision）、WriterLocked(code=None)、InvalidResumeToken(code=None)
    ERROR_CODES = frozenset({'SRC_001','SRC_003','TXT_001','ID_001','ID_002','REF_001','SCH_001','SCH_002','SEM_001'})  # §8.2 第 3 表逐字
  ids.py: |
    PATTERNS: dict[str, str]，键为前缀家族名，值为完整正则（^…$），逐字按 §8.1：
      artifact_id        ^art_[0-9a-f]{32}$
      artifact_revision_id ^rev_[0-9a-f]{32}$
      processing_run_id  ^prun_[0-9a-f]{32}$
      step_run_id        ^srun_[0-9a-f]{32}$
      stage_package_id   ^pkg_m[1-8]_[0-9a-f]{32}$
      release_id         ^rel_[0-9a-f]{32}$
      school_id          ^sch_[a-z][a-z0-9]*_[0-9]{3}$
      school_view_id     ^sv_[0-9a-f]{32}$
      conflict_group_id  ^cg_[0-9a-f]{32}$
      pattern_id         ^pat_[a-z][a-z0-9]*_[0-9]{6}$
      entry_id           ^ent_[0-9a-f]{32}$
      source_id          ^src_[a-z][a-z0-9]*_ed[0-9]{2}$
      source_span_id     ^ss_[a-z][a-z0-9]*_ed[0-9]{2}_p[0-9]{4}_s[0-9]{2}$
      knowledge_unit_id  ^ku_[a-z][a-z0-9]*_[0-9]{6}$
      assertion_id       ^as_[a-z][a-z0-9]*_[0-9]{6}$
      proposition_id     ^pr_[a-z][a-z0-9]*_[0-9]{6}$
      shared_concept_id  ^co_shared_[a-z][a-z0-9]*_[0-9]{2}$
      technique_concept_id ^co_[a-z][a-z0-9]*_[0-9]{6}$
      homograph_anchor_id ^hg_[0-9]{4}$
    STAGES = ('m1','m2','m3','m4','m5','m6','m7','m8')
    new_id(kind: str, stage: str | None = None) -> str：用 uuid.uuid4().hex；kind ∈ {artifact_id, artifact_revision_id, processing_run_id, step_run_id, stage_package_id, release_id, school_view_id, conflict_group_id, entry_id}；stage_package_id 必须给 stage ∈ STAGES 否则 InvalidIdentifier
    validate(kind: str, value: str) -> str：不匹配则 raise InvalidIdentifier(code='ID_001', message 含 kind 与 value)；返回 value
    kind_of(value: str) -> str | None：按前缀最长匹配返回家族名（注意 co_shared_ 先于 co_，prun_ 先于 pr_）
    is_hex32(s) -> bool
  states.py: |
    ARTIFACT_STATUS = ('draft','sealed','quarantined','invalidated','superseded')
    ARTIFACT_TRANSITIONS = {'draft': {'sealed','quarantined'}, 'sealed': {'invalidated','superseded'}, 'quarantined': {'superseded'}, 'invalidated': {'superseded'}, 'superseded': set()}
    STEP_RUN_STATUS = ('running','awaiting_human','suspended','succeeded','failed','superseded')
    STEP_RUN_TRANSITIONS = {'running': {'awaiting_human','suspended','succeeded','failed','superseded'}, 'awaiting_human': {'running','suspended','failed','superseded'}, 'suspended': {'running','failed','superseded'}, 'succeeded': set(), 'failed': set(), 'superseded': set()}
    TERMINAL_STEP_RUN = frozenset({'succeeded','failed','superseded'})
    CONTENT_MATURITY = ('source_verified','machine_extracted','cross_model_reviewed','disputed','needs_expert','expert_verified','deprecated')
    REVIEW_DECISION_TYPES = ('review_source_fidelity','review_edition_collation','review_school_attribution','review_explanation_quality','review_case_authenticity','review_practical_validity','review_safety','review_rights')
    check_artifact_transition(cur, nxt) / check_step_run_transition(cur, nxt)：非法则 raise IllegalTransition(message 含 cur→nxt)；表外取值 raise SchemaViolation(code='SCH_002')
  actor.py: |
    class ActorProvider(Protocol): def current_actor(self) -> str
    class LocalActorProvider: current_actor() 固定返回 'local_owner'
tests:
  test_ids.py:
    - test_new_id_matches_pattern_for_each_kind
    - test_stage_package_requires_valid_stage（'m9'、'ledger' → InvalidIdentifier）
    - test_validate_rejects_uppercase_hex（'art_' + 'A'*32）
    - test_validate_rejects_wrong_length（31/33 位）
    - test_validate_rejects_pr_for_processing_run（'pr_' + hex32 作 processing_run_id → ID_001）
    - test_kind_of_prefers_longest_prefix（co_shared_x_01 → shared_concept_id；prun_… → processing_run_id）
    - test_legacy_formats_verbatim（src_sanche_ed01、ss_sanche_ed01_p0001_s01、ku_qizheng_000001、hg_0001 合法；ss_sanche_ed01_p001_s01 非法）
    - test_error_has_code_ID_001
  test_states.py:
    - test_artifact_transition_table_exact（对 5×5 全组合逐一断言与表一致）
    - test_step_run_transition_table_exact（6×6）
    - test_terminal_states_have_no_exits
    - test_unknown_status_is_SCH_002
    - test_enum_closed_sets_verbatim（三组枚举与 ACT 常量逐字相等）
verify:
  - .venv/bin/python -m unittest discover -s pipeline/ledger/tests -t . 2>&1 | tail -3   # OK，用例数 ≥ 13
  - grep -c 'uuid4' pipeline/ledger/ids.py    # ≥ 1
  - grep -rE 'import (pytest|sqlalchemy|pydantic)' pipeline/ledger | wc -l   # 0
  - TDD §0 三门禁不变
commit:
  add: [pipeline/ledger]
  message: "feat(ledger): identifiers, state machines and error codes per spec §8.1/§8.2"
on_fail: 停止并报告
