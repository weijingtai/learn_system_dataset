act_id: impl-01/02
title: Object Store + SQLite Metadata Ledger + 写入者锁（objects.py store.py lock.py）
estimated_minutes: 90
group: H1
depends_on: [impl-01/01]
scope:
  write: [pipeline/ledger/objects.py, pipeline/ledger/store.py, pipeline/ledger/lock.py, pipeline/ledger/tests/test_objects.py, pipeline/ledger/tests/test_store.py, .gitignore]
tests_first:
  - 先写 test_objects.py、test_store.py 用例名齐全并全红，再实现
contract:
  layout: |
    LEDGER_ROOT（默认 repo 根 `var/ledger`，可由环境变量 LEDGER_ROOT 或参数覆盖）
      ledger.sqlite（+ -wal/-shm）
      objects/<sha256 前 2 位>/<sha256>          内容寻址；写入先写 objects/tmp/<uuid> 再 os.replace
      writer.lock                               fcntl.flock LOCK_EX|LOCK_NB
    根 .gitignore 追加一行 `var/`
  objects.py: |
    class ObjectStore(root: Path)
      put(data: bytes) -> tuple[str, int]        返回 (sha256, size)；已存在则不重写（去重），返回相同
      get(sha256: str) -> bytes                  不存在 raise MissingReference(code='REF_001')
      exists(sha256) -> bool
      verify(sha256) -> bool                     重算哈希相等
      path_for(sha256) -> Path
  lock.py: |
    class WriterLock(root: Path)：acquire() 取不到 raise WriterLocked；release()；上下文管理器；同一进程重复 acquire 幂等
  store.py: |
    DDL（表名与列名固定；全部 NOT NULL 除标 NULL；时间为 ISO-8601 UTC 字符串）：
      schema_meta(key TEXT PK, value TEXT)                                       # ('ledger_schema_version','1.0.0')
      artifacts(artifact_id PK, artifact_type, created_at, actor_ref)
      artifact_revisions(artifact_revision_id PK, artifact_id FK, status, status_version INTEGER, sha256, size_bytes INTEGER, object_key, schema_id NULL, schema_version NULL,
                         processing_run_id NULL, step_run_id NULL, producer_module, producer_version, configuration_revision_id NULL, validation_report_revision_id NULL,
                         rights_scope, prev_revision_id NULL, created_at, sealed_at NULL, actor_ref)
      revision_status_events(id INTEGER PK AUTOINCREMENT, artifact_revision_id FK, from_status, to_status, reason NULL, actor_ref, created_at)
      stage_packages(stage_package_id PK, artifact_id FK, stage)                  # StagePackage 逻辑身份 ↔ Artifact
      processing_runs(processing_run_id PK, kind, edition_part_id, technique_id, created_at, actor_ref)   # kind ∈ edition_run|release_run
      step_runs(step_run_id PK, processing_run_id FK, stage, status, status_version INTEGER, request_json, result_json NULL, supersedes_step_run_id NULL,
                resume_token_hash NULL, deadline NULL, created_at, updated_at, actor_ref)
      step_run_events(id INTEGER PK AUTOINCREMENT, step_run_id FK, event_type, from_status NULL, to_status NULL, reason NULL, source NULL, actor_ref, payload_json NULL, created_at)
        # event_type ∈ created|transition|suspended|recovery|human_event|await_human|resume|checkpoint|failure
      frozen_inputs(step_run_id FK, artifact_revision_id FK, PRIMARY KEY(step_run_id, artifact_revision_id))
      transformations(id INTEGER PK AUTOINCREMENT, step_run_id FK, operation, tool, tool_version, model_ref NULL, configuration_revision_id FK, validation_report_revision_id NULL, created_at)
      transformation_inputs(transformation_id FK, artifact_revision_id FK, PRIMARY KEY(transformation_id, artifact_revision_id))
      transformation_outputs(transformation_id FK, artifact_revision_id FK, PRIMARY KEY(transformation_id, artifact_revision_id))
      transformation_human_events(transformation_id FK, event_revision_id FK, PRIMARY KEY(transformation_id, event_revision_id))
      human_events(event_revision_id PK FK→artifact_revisions, step_run_id FK, decision_type NULL, created_at)
      stage_checkpoints(artifact_revision_id PK FK, artifact_id FK, edition_part_id, stage, step_run_id FK, prev_checkpoint_revision_id NULL, rework_impact_report_revision_id NULL, actor_ref, created_at)
      audit_log(id INTEGER PK AUTOINCREMENT, created_at, actor_ref, action, target, payload_json NULL)
    PRAGMA journal_mode=WAL; PRAGMA foreign_keys=ON; PRAGMA synchronous=FULL
    class MetadataStore(path: Path)
      open() / close()；migrate()（幂等建表，写 schema_meta）
      transaction() 上下文管理器：BEGIN IMMEDIATE；异常回滚
      低层 CRUD（供 service 调用，不做业务校验）：insert_artifact/insert_revision/update_revision_status(rev, from, to, reason, actor)（用 UPDATE … WHERE status=from 且 rowcount==1 否则 IllegalTransition）/get_revision/insert_processing_run/insert_step_run/update_step_run_status(step_run_id, from, to, expected_status_version, …)（乐观锁：WHERE status=from AND status_version=expected；成功后 status_version+1）/append_step_run_event/add_frozen_inputs/insert_transformation(+inputs/outputs/human_events)/insert_human_event/insert_checkpoint/latest_checkpoint(edition_part_id, stage)/list_checkpoints/append_audit/get_step_run/list_step_run_events/list_transformations(step_run_id)
      只读打开：MetadataStore.open_readonly(path) 用 `file:...?mode=ro` URI，不取写锁
tests:
  test_objects.py:
    - test_put_returns_sha256_and_size_and_is_content_addressed
    - test_put_dedups_identical_bytes（两次 put 同内容 → 同 key，磁盘只一个文件）
    - test_get_missing_raises_REF_001
    - test_tmp_file_not_left_behind_on_success
    - test_verify_detects_tampered_object（直接改文件一字节 → verify False）
  test_store.py:
    - test_migrate_creates_all_tables（sqlite_master 表名集合 == DDL 15 张表）
    - test_wal_and_foreign_keys_enabled
    - test_update_revision_status_rejects_stale_from_status（IllegalTransition）
    - test_step_run_optimistic_lock（两次以同一 expected_status_version 更新，第二次 IllegalTransition）
    - test_transaction_rolls_back_on_exception
    - test_readonly_open_cannot_write（写入 raise sqlite3.OperationalError）
    - test_writer_lock_exclusive（子进程 multiprocessing 尝试 acquire → WriterLocked）
    - test_gitignore_has_var（根 .gitignore 含整行 `var/`）
verify:
  - .venv/bin/python -m unittest discover -s pipeline/ledger/tests -t . 2>&1 | tail -3   # OK，用例数 ≥ 26
  - grep -Fxc 'var/' .gitignore    # 1
  - git status --short var/ 2>/dev/null | wc -l   # 0（测试产物不入库；测试必须用 tempfile 目录）
  - TDD §0 三门禁不变
commit:
  add: [pipeline/ledger, .gitignore]
  message: "feat(ledger): content-addressed object store, SQLite metadata ledger DDL and single-writer lock (spec §17)"
on_fail: 停止并报告；不得为通过测试放宽 DDL 或去掉 FK
