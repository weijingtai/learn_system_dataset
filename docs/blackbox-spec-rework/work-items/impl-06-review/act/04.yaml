act_id: impl-06/04
title: M4/M5 缺席时的非生产上游桩 + resolve_m6_inputs（只读 Ledger 解析 CorpusPackage/CandidatePackage/ValidationPackage）
estimated_minutes: 75
group: K2
depends_on: [impl-06/03, impl-02 ACCEPTED]
decisions_required: [D-05, D-11, D-13]
scope:
  write: [pipeline/review/testing/__init__.py, pipeline/review/testing/upstream_stub.py, pipeline/review/testing/data/m4_candidates.yaml, pipeline/review/testing/data/m5_validation.yaml, pipeline/review/testing/data/m6_decisions.yaml, pipeline/review/testing/data/corrections.yaml, pipeline/review/testing/data/expected_review.yaml, pipeline/review/inputs.py, pipeline/review/tests/test_inputs.py]
tests_first:
  - 先写 tests/test_inputs.py（用例名逐字）并全红，再写 testing 数据与桩，最后实现 inputs.py
contract: |
  testing/data（合成数据；注释首行写明「合成数据，仅验证结构与血缘，不含术理内容；fixture 前 3 页为书名页与目录」）：
    m4_candidates.yaml：technique_id: qizheng；candidates 4 项，顶层键逐字 entity_id, kind, content_status, content, evidence_links, source_refs, subject_entity_id, claim_refs, school_ids, conflict_group_id, model_run_refs
      as_qizheng_000001 assertion content.text「卷第一載七政旺宮星度」 evidence [p0003_s04 0-3, p0003_s08 0-6] school_ids [sch_qizheng_001]
      as_qizheng_000002 assertion content.text「目錄列貴格之圗」 evidence [p0003_s03 0-6, p0003_s05 0-4]
      as_qizheng_000003 assertion content.text「是書宋錢如璧撰」 evidence [p0001_s02 3-7]
      sv_00000000000000000000000000000001 school_view content {school_id: sch_qizheng_001, changes_current_judgment: null}
        source_refs [ss_sanche_ed01_p0003_s08] subject_entity_id as_qizheng_000001 claim_refs [as_qizheng_000001] conflict_group_id cg_00000000000000000000000000000001
      （span_id 全写为 ss_sanche_ed01_p000N_sNN 完整形式；非适用键为 [] 或 null；content_status 均 machine_extracted）
    m5_validation.yaml：validator_version stub-0.1.0；gate {passed: true, severe_error_count: 0, failed_task_count: 0, pending_rework_count: 0}；
      entries 每候选 1 条 {entity_id, check, result, code, message}（as_…003 为 warn、code null，其余 pass）；broken_relations []；rework_tasks []
    m6_decisions.yaml：4 条 {queue_item_id, verdict, rationale, amended_content?, changes_current_judgment?}：as_…001 accept；as_…002 reject；as_…003 amend（amended_content.text「（宋）錢如璧撰」）；sv_…1 accept + changes_current_judgment false
    corrections.yaml：correction_request {source_span_ids: [ss_sanche_ed01_p0003_s08], description}；span_patches [{span_id: ss_sanche_ed01_p0003_s08, char_index: 3, char: 官}, {span_id: ss_sanche_ed01_p0003_s05, bbox_dx: 1.0}]
    expected_review.yaml：first_review {approved: [as_qizheng_000001, as_qizheng_000003, sv_…1], rejected: [as_qizheng_000002], decisions: 4, checkpoints: 5}；
      rework {changed_span_ids: [ss_sanche_ed01_p0003_s05, ss_sanche_ed01_p0003_s08], reachable_entity_ids: [as_qizheng_000001, as_qizheng_000002, sv_…1], invalidated_count: 6, carried_forward_count: 3, needs_review_count: 2, valid_object_count: 8, invalidated_ratio: 0.75, warnings: [rework_threshold_exceeded], rework_round: 1}；
      rereview {queue: [as_qizheng_000001#review_source_fidelity, sv_…1#review_school_attribution], active: 2, carried_forward: 2}
  testing/upstream_stub.py（非生产；STUB_TOOL = "pipeline.review.testing.upstream_stub"，STUB_TOOL_VERSION = "0.1.0"）：
    seed_upstream(service, fixture_dir) -> dict
      1 ingest(fixture_dir, service, stages=("m1","m2")) → run_m3(service, edition_part_id)（必须 succeeded）
      2 m4：put_run_artifact(processing_run_id, "configuration", {"stage": "m4", "tool": STUB_TOOL, ...}) → begin_step_run（冻结 corpus_package、corpus_spans）
        每候选：内容 = yaml 候选 + evidence_links[].quote_sha256（按 corpus_spans 截取引文 UTF-8 sha256）→ put "knowledge_candidate" → seal → write_checkpoint(stage m4, task_id=entity_id)
        candidate_package JSON {schema_version, edition_part_id, technique_id, corpus_package_revision_id, candidates[{entity_id, kind, candidate_revision_id}]} → seal
        validation_report(stub) → seal；record_transformation(operation "extract_candidates_stub")；m4 StagePackage；finish_step_run
      3 m5：同构；validation_package JSON {schema_version, candidate_package_revision_id, validator_version, gate, entries[+candidate_revision_id], broken_relations, rework_tasks}；每条目一个 Checkpoint 或单 task 一个 Checkpoint（task_id "validate_candidates"）
      返回键：edition_part_id, processing_run_id, corpus_package_revision_id, corpus_spans_revision_id, candidate_package_revision_id, candidate_revision_ids({entity_id: rev}), validation_package_revision_id, m3_step_run_id, m4_step_run_id, m5_step_run_id
    load_data(name) -> dict：读 testing/data/<name>.yaml
  inputs.py：resolve_m6_inputs(reader, edition_part_id) -> dict（只调用 Ledger 读接口；查 artifact_type 允许经 reader.store.conn 只读 SELECT，同 impl-02 inputs.py）
    对 stage ∈ (m3, m4, m5)：latest_checkpoint(ep, stage) 非空；其 StepRun get_step_run.status == "succeeded"（否则 ReviewRefused，message 含「<stage> 未通过」）；
      list_transformations(step) 输出中对应 artifact_type（m3 corpus_package、m4 candidate_package、m5 validation_package）恰 1 个
    corpus_spans_revision_id = corpus_package 内容 spans_revision_id；candidate_revision_ids 取自 candidate_package 内容，每个 artifact_type 必须 knowledge_candidate
    validation_package.candidate_package_revision_id != 解析出的候选包 → ReviewRefused(code="REF_001")
    validation_package.gate.passed 非 True 或三项计数非 0 → ReviewRefused（message 含「M5 未通过」）
    candidate_package.corpus_package_revision_id != 解析出的 corpus 包 → ReviewRefused(code="REF_001")
    所有修订 status 必须 "sealed"（否则 NotConsumable）；缺失 → MissingReference(REF_001)
    latest_checkpoint(ep, "m6") 属于 succeeded StepRun → ReviewRefused（message 含「M6 已封存」；返工走 rework.py）
    processing_run_id = m5 StepRun 的 processing_run_id；technique_id = candidate_package 内容 technique_id
    返回键：processing_run_id, technique_id, corpus_package_revision_id, corpus_spans_revision_id, candidate_package_revision_id, candidate_revision_ids, validation_package_revision_id, m3_step_run_id, m4_step_run_id, m5_step_run_id
    本函数不做任何写入
tests:
  test_inputs.py: |
    脚手架：tempfile → LedgerService(root/"ledger") → seed_upstream(FIXTURE, service)
    - test_seed_upstream_all_stages_succeeded
    - test_seed_candidates_quote_hashes_match_corpus
    - test_resolve_returns_exact_revisions
    - test_resolve_writes_nothing（前后 artifact_revisions、step_runs、audit_log 行数相等）
    - test_refuses_when_m5_missing
    - test_refuses_when_m5_gate_not_passed（桩参数 gate.passed=false）
    - test_refuses_when_validation_bound_to_other_candidate_package
    - test_refuses_when_candidate_revision_invalidated（invalidate_revision 后 → NotConsumable）
verify:
  - .venv/bin/python -m unittest discover -s pipeline/review/tests -t . 2>&1 | tail -3   # OK，用例数 ≥ 58
  - grep -rn 'testing' pipeline/review/inputs.py | wc -l                                  # 0
  - grep -rn '_fixture' pipeline/review/inputs.py | wc -l                                 # 0
  - TDD §3 回归
commit:
  add: [pipeline/review/testing, pipeline/review/inputs.py, pipeline/review/tests/test_inputs.py]
  message: "feat(m6): non-production upstream stub and frozen input resolution for review (spec §7/§14)"
on_fail: 停止并报告；run_m3 在灌入后失败、或 M4/M5 草案契约已定稿且与本 contract 不一致时停手
