act_id: impl-06/02
title: 独立 M6 Review Gate evaluate_review（九项检查，零未解决项，§13:606 承接、§14:631）
estimated_minutes: 60
group: K1
depends_on: [impl-06/01]
decisions_required: [D-03, D-04]
scope:
  write: [pipeline/review/gate.py, pipeline/review/tests/test_gate.py]
tests_first:
  - 先写 tests/test_gate.py（用例名逐字），新增用例全 ERROR 后再实现
contract: |
  gate.py（纯函数；不得 import pipeline.review.model / propagation / step / rework；8 类/5 verdict/3 standing 常量在本文件内独立重写，不从 review_events import 常量）：
    evaluate_review(*, candidate_objects, seen_revision_id, validation_package, corpus_spans_doc, decision_entries, prior_decision_events=(), reviewed_edition) -> dict
      参数：candidate_objects = [{entity_id, kind, required_decision_types, content_hash}]（required_decision_types 由 review_events.required_decision_types 逐对象推导，第 67 条；content_hash 为该对象当前修订的 model.content_hash）；validation_package = M5 包内容；
            corpus_spans_doc = corpus_spans YAML 解析结果；decision_entries = [{decision_revision_id, queue_item_id, target_entity_id, kind, decision_type, verdict, standing, seen_revision_id, modified_revision_id, carried_from_revision_id, carried_to_revision_id, carried_content_hash, rationale}]（第 69 条）；
            prior_decision_events = 首审决定事件 [{decision_revision_id, seen_revision_id, modified_revision_id}]（仅用于 carried 校验）；reviewed_edition = 待封存的主内容
      返回：{"review": "passed"|"failed", "checks": {名: {"passed": bool, "detail": str}}}，checks 键序逐字如下
      九项检查（名称与顺序固定）：
        validation_intake：validation_package["gate"]["passed"] is True 且 validation_package["scope"] == "corpus_only"（M5 首切片只到 corpus 级；candidate 级由本 Gate 承担）
        queue_coverage：独立重算 {entity_id#decision_type} = ∪ 逐对象 {entity_id, required_decision_types[dt]}；decision_entries 的 queue_item_id 集合 == 该集合
        decision_anchoring（第 68/69 条，条件式）：每条 decision 的 target_entity_id ∈ candidate_objects；decision_revision_id 形如 rev_<32hex>；verdict == "modify" ⇔ modified_revision_id 非空且形如 rev_<32hex>，否则必须为 None；
          standing == "active" ⇒ seen_revision_id == seen_revision_id 参数（当前修订）、carried_from_revision_id/carried_to_revision_id/carried_content_hash 均为 None；
          standing == "carried_forward" ⇒ carried_to_revision_id == seen_revision_id 参数（复审队列项当前修订）、carried_from_revision_id 出现在 prior_decision_events 中且其 seen_revision_id == 本条 seen_revision_id（首审旧修订，未改写）、carried_content_hash == candidate_objects[target_entity_id].content_hash（旧/新规范化内容哈希相等）、verdict == "modify" ⇔ modified_revision_id 非空且等于 carried_from 所指首审事件的 modified_revision_id（第 74 条），非 modify 为 None
        decision_closed_sets：decision_type ∈ 本文件独立列出的 8 类；verdict ∈ {accept, modify, reject, request_evidence, school_dispute}；standing ∈ {active, carried_forward, needs_review}；rationale 非空
        zero_unresolved：reviewed_edition["unresolved_count"] == 0；无 verdict == "request_evidence" 或 standing == "needs_review" 的立场；每个队列项恰有 1 条立场
        outcome_consistency：独立推导 approved/rejected（全部必审维度 accept/modify → approved；任一 reject → rejected）与 reviewed_edition 两列表集合相等；approved 项 content_status == "expert_verified"；approved ∪ rejected == 全部候选 entity_id
        evidence_closure：每个 approved 且 kind == "assertion" 的对象在 reviewed_edition["evidence_links"] 中 ≥ 1 条；每条 source_span_id 存在于 corpus_spans_doc；text[start:end] 的 UTF-8 sha256 == quote_sha256
        school_divergence：每个 approved 的 school_view 在 reviewed_edition["school_views"] 中出现，conflict_group_id 与候选一致
        package_counts：len(approved) + len(rejected) == len(candidate_objects)；len(decision_entries) == 队列项数
      review == "passed" 当且仅当九项全过
tests:
  test_gate.py: |
    脚手架：内联构造 BDD 首审金标（3 获批、1 驳回、5 决定，含 sv_…1 两条）的全部参数；corpus_spans_doc 取 fixture spans.yaml 解析结果（测试允许读 fixture）
    - test_golden_all_nine_pass
    - test_check_names_and_order_exact
    - test_validation_gate_not_passed_fails_validation_intake
    - test_validation_scope_not_corpus_only_fails_validation_intake
    - test_missing_queue_item_fails_queue_coverage
    - test_wrong_seen_anchor_fails_decision_anchoring
    - test_modify_without_modified_revision_fails_decision_anchoring
    - test_accept_with_modified_revision_fails_decision_anchoring
    - test_carried_without_carried_from_fails_decision_anchoring
    - test_carried_entry_passes_when_carried_to_matches_and_hash_equal（第 69 条：seen 保持首审旧修订、carried_to == 当前修订、旧/新哈希相等）
    - test_carried_with_wrong_carried_to_fails_decision_anchoring
    - test_carried_from_unknown_event_fails_decision_anchoring
    - test_carried_content_hash_changed_fails_decision_anchoring
    - test_carried_modify_with_matching_modified_revision_passes_decision_anchoring（第 74 条）
    - test_carried_modify_modified_revision_mismatch_fails_decision_anchoring（第 74 条：缺失或与首审事件不等 → 失败）
    - test_unknown_decision_type_fails_closed_sets
    - test_empty_rationale_fails_closed_sets
    - test_request_evidence_standing_fails_zero_unresolved
    - test_needs_review_standing_fails_zero_unresolved
    - test_duplicate_standing_for_item_fails_zero_unresolved
    - test_approved_with_reject_dimension_fails_outcome
    - test_rejected_entity_dropped_fails_outcome
    - test_quote_hash_mismatch_fails_evidence_closure
    - test_unknown_span_fails_evidence_closure
    - test_school_view_group_mismatch_fails_school_divergence
    - test_count_mismatch_fails_package_counts
    - test_gate_does_not_import_model_or_propagation（读源码 AST，import 名单不含 model/propagation/step/rework）
verify:
  - .venv/bin/python -m unittest discover -s pipeline/review/tests -t . 2>&1 | grep -E "^(Ran|OK|FAILED)"   # OK，用例数 ≥ 48
  - grep -nE '^(from|import) .*(model|propagation|step|rework)' pipeline/review/gate.py | wc -l   # 0
  - TDD §3 回归
commit:
  add: [pipeline/review/gate.py, pipeline/review/tests/test_gate.py]
  message: "feat(m6): independent review gate with nine checks and zero-unresolved rule (spec §14)"
on_fail: 停止并报告；不得为让金标通过而放宽检查
