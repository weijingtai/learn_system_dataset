act_id: impl-06/02
title: 独立 M6 Review Gate evaluate_review（九项检查，零未解决项，§13:606 承接、§14:631）
estimated_minutes: 60
group: K1
depends_on: [impl-06/01]
decisions_required: [D-03, D-04]
scope:
  write: [pipeline/review/gate.py, pipeline/review/tests/test_gate.py]
tests_first:
  - 先写 tests/test_gate.py（用例名逐字），新增用例全 ERROR 后再实现
contract: |
  gate.py（纯函数；不得 import pipeline.review.model / propagation / step / rework；常量在本文件内独立重写）：
    evaluate_review(*, candidates, validation_package, corpus_spans_doc, configuration, decision_events, reviewed_package) -> dict
      参数：candidates = [候选对象 dict，含 candidate_revision_id]；validation_package = M5 包内容；corpus_spans_doc = corpus_spans YAML 解析结果；
            configuration = M6 配置修订内容（含 required_decision_types）；decision_events = 本次立场所依据的全部 review_decision 事件（含继承）；reviewed_package = 待封存的 reviewed_edition_package 内容
      返回：{"review": "passed"|"failed", "checks": {名: {"passed": bool, "detail": str}}}，checks 键序逐字如下
      九项检查（名称与顺序固定）：
        validation_intake：validation_package.gate.passed is True 且 severe_error_count、failed_task_count、pending_rework_count 均为 0
        queue_coverage：独立重算 {entity_id#decision_type} = candidates × configuration.required_decision_types[kind]；reviewed_package.decisions 中立场项号集合 == 该集合
        decision_anchoring：每条 decision 的 target_entity_id ∈ candidates；standing == "active" 时 seen_artifact_revision_id == 该候选 candidate_revision_id；standing == "carried_forward" 时 carried_from_revision_id 非空；每条 decision_revision_id 形如 rev_<32hex>
        decision_closed_sets：decision_type ∈ 本文件内独立列出的 8 类；verdict ∈ {accept, amend, reject, request_evidence}；standing ∈ {active, carried_forward, needs_review}；rationale 非空（从 decision_events 按 decision_revision_id 对应取）
        zero_unresolved：reviewed_package.unresolved_count == 0；无 verdict == request_evidence 或 standing == needs_review 的立场；每个队列项恰有 1 条立场
        outcome_consistency：独立推导 approved/rejected（全部必审维度 accept/amend → approved；任一 reject → rejected）与 reviewed_package 两列表集合相等；approved 项 content_status == "expert_verified"；approved ∪ rejected == 全部候选 entity_id
        evidence_closure：每个 approved 且 kind == assertion 的对象在 reviewed_package.evidence_links 中 ≥ 1 条；每条 source_span_id 存在于 corpus_spans_doc；text[start:end] 的 UTF-8 sha256 == quote_sha256
        school_divergence：每个 approved 的 school_view 在 reviewed_package.school_views 中出现，changes_current_judgment 为 bool，conflict_group_id 与候选一致
        package_counts：reviewed_package 的 approved/rejected/decisions 长度与 manifest 口径一致（len(approved)+len(rejected) == len(candidates)；len(decisions) == 队列项数）
      review == "passed" 当且仅当九项全过
tests:
  test_gate.py: |
    脚手架：内联构造 README BDD 首审金标（3 获批、1 驳回、4 决定）的全部参数；corpus_spans_doc 取 fixture spans.yaml 解析结果（测试允许读 fixture）
    - test_golden_all_nine_pass
    - test_check_names_and_order_exact
    - test_validation_gate_not_passed_fails_validation_intake
    - test_severe_error_nonzero_fails_validation_intake
    - test_missing_queue_item_fails_queue_coverage
    - test_wrong_seen_revision_fails_decision_anchoring
    - test_carried_without_carried_from_fails_decision_anchoring
    - test_unknown_decision_type_fails_closed_sets
    - test_empty_rationale_fails_closed_sets
    - test_request_evidence_standing_fails_zero_unresolved
    - test_needs_review_standing_fails_zero_unresolved
    - test_duplicate_standing_for_item_fails_zero_unresolved
    - test_approved_with_reject_dimension_fails_outcome
    - test_rejected_entity_dropped_fails_outcome
    - test_quote_hash_mismatch_fails_evidence_closure
    - test_unknown_span_fails_evidence_closure
    - test_school_view_null_judgment_fails_school_divergence
    - test_count_mismatch_fails_package_counts
    - test_gate_does_not_import_model_or_propagation（读源码 AST，import 名单不含 model/propagation/step/rework）
verify:
  - .venv/bin/python -m unittest discover -s pipeline/review/tests -t . 2>&1 | tail -3   # OK，用例数 ≥ 36
  - grep -nE '^(from|import) .*(model|propagation|step|rework)' pipeline/review/gate.py | wc -l   # 0
  - TDD §3 回归
commit:
  add: [pipeline/review/gate.py, pipeline/review/tests/test_gate.py]
  message: "feat(m6): independent review gate with nine checks and zero-unresolved rule (spec §14)"
on_fail: 停止并报告；不得为让金标通过而放宽检查
