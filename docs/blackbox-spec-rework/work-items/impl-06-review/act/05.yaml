act_id: impl-06/05
title: open_review / record_decision / recover_review：awaiting_human、每条人工决定即时 Checkpoint、从最近 Checkpoint 恢复（§7.1、§17.1）
estimated_minutes: 90
group: K2
depends_on: [impl-06/04]
decisions_required: [D-03, D-04, D-15, D-16]
scope:
  write: [pipeline/review/step.py, pipeline/review/tests/test_step_open.py]
tests_first:
  - 先写 tests/test_step_open.py（用例名逐字），全部 Red 后再实现
contract: |
  step.py：
    open_review(service, edition_part_id, *, required_decision_types=None) -> dict
      1 inputs = resolve_m6_inputs(service, edition_part_id)（拒绝原样抛出，零写入）
      2 mapping = required_decision_types or model.DEFAULT_REQUIRED_DECISION_TYPES
        config = service.put_run_artifact(processing_run_id, "configuration", json {"stage": "m6", "task": "review", "tool": M6_TOOL, "tool_version": M6_TOOL_VERSION, "required_decision_types": mapping, "verdicts": list(VERDICTS), "console": "cli"}（sort_keys, ensure_ascii=False）, producer_module=M6_TOOL, producer_version=M6_TOOL_VERSION)
      3 frozen = [corpus_package, corpus_spans, candidate_package] + [候选修订 按 candidate_package 顺序] + [validation_package]
        step = begin_step_run({"schema_version": "1.0.0", "processing_run_id", "step_run_id": ids.new_id("step_run_id"), "input_artifact_ids": frozen, "technique_profile_id": technique_id, "configuration_artifact_id": config})
      4 begin 之后任何异常 → _fail(step, 检查名, detail)（input_contract / internal），同 impl-02 step._fail 形状：put "failure_report" → seal → fail_step_run
        输入契约（input_contract）：读冻结修订字节；候选内容 entity_id/kind 与包索引一致；每条 evidence_links/source_refs 的 span 存在于 corpus_spans；quote_sha256 与截取引文一致；M5 条目 entity_id ⊆ 候选
      5 queue = model.build_review_queue(candidates=…, required_decision_types=mapping) → put "review_queue"（json.dumps(queue, sort_keys=True, ensure_ascii=False)）→ seal
      6 write_checkpoint(step, edition_part_id=…, stage="m6", completed_tasks=[{"task_id": "build_review_queue", "artifact_revision_id": queue_rev, "status": "succeeded", "terminal_state": None}], human_decisions=[], pending_queue=[{"task_id": 项号} …], next_pointer=首项)
      7 token = service.await_human(step, [queue_rev])
      返回键：status("awaiting_human"), processing_run_id, step_run_id, resume_token, configuration_revision_id, frozen_input_revision_ids, queue_revision_id, queue, checkpoint_revision_id
    record_decision(service, step_run_id, resume_token, *, queue_item_id, verdict, rationale, amended_content=None, evidence_refs=(), changes_current_judgment=None) -> dict
      前置（任何失败直接抛出，零写入、不消费 token）：StepRun status == "awaiting_human"；读本运行 review_queue 修订（本运行自有或冻结输入中 artifact_type=review_queue 的唯一修订）；queue_item_id ∈ 队列（否则 ReviewRefused REF_001）；
        verdict/字段按 model.decision_event 规则预校验（先用占位 amended_revision_id 校验再写）
      1 若 verdict == "amend"：amended_content 必须保留原候选 entity_id 与 kind（否则 ReviewRefused SCH_002）；内容 = 原候选 + amended_content 覆盖 content 键 → put "reviewed_candidate"(prev_revision_id=None) → seal
      2 event = model.decision_event(step_run_id=…, queue_item=…, verdict, rationale, actor_ref=service.actor(), amended_revision_id, evidence_refs, changes_current_judgment)
        rev = put "human_event"（model.event_bytes(event)）→ seal
      3 service.record_human_event(step_run_id, resume_token, rev, decision_type=queue_item.decision_type)
      4 folded = model.fold_decisions(queue, 继承决定（冻结输入中 event_kind=review_decision 的 human_event，按 Checkpoint human_decisions 顺序）+ 本运行已记录决定)
        human_decisions = 继承决定修订 + 本运行全部 human_event 修订（按记录顺序）
        completed_tasks = [build_review_queue 项] + [{"task_id": 项号, "artifact_revision_id": 该项最后决定修订, "status": "succeeded", "terminal_state": None} for 已有决定的项（队列顺序）]
        pending = [项 for 项 in 队列 if folded[项] is None or folded[项].verdict == "request_evidence"]
        write_checkpoint(step, stage="m6", completed_tasks, human_decisions, pending_queue=[{"task_id": 项号}…], next_pointer=首个 pending 或 None)
      返回键：decision_revision_id, amended_revision_id, checkpoint_revision_id, remaining(len(pending))
    recover_review(service, edition_part_id, *, reason) -> dict
      1 old = latest_checkpoint(ep, "m6")（不存在 → MissingReference）；其 StepRun 必须非终态（awaiting_human 或 suspended）否则 ReviewRefused
      2 request：沿用旧运行 configuration_artifact_id 与 technique；input_artifact_ids = 旧冻结输入 + 旧运行 review_queue 修订 + 旧运行全部 sealed human_event 修订（去重保持顺序）；新 step_run_id
      3 new_step, plan = service.recover_from_checkpoint(ep, "m6", request)（Ledger 在此补写晚于最后决定的 Checkpoint，§17.1:845）
      4 write_checkpoint(new_step, completed_tasks=plan 口径重算, human_decisions=旧全部决定（不重录）, pending_queue=未决项, next_pointer)
      5 token = await_human(new_step, [旧 review_queue 修订])
      返回键：step_run_id, supersedes_step_run_id, resume_token, carried_decision_revision_ids, replayed_pending([项号]), checkpoint_revision_id
      依 D-15 推荐 B：旧运行 status 断言为 "superseded"；若裁 A，测试改为断言保持 "awaiting_human"
tests:
  test_step_open.py: |
    脚手架：tempfile → LedgerService → seed_upstream → open_review
    - test_open_review_awaiting_human_with_token
    - test_open_frozen_inputs_exact_eight
    - test_open_queue_sealed_and_first_checkpoint
    - test_open_refuses_without_upstream_zero_writes
    - test_open_input_contract_failure_fails_step_run（patch 读取后的候选 quote_sha256 → failed_check input_contract）
    - test_four_decisions_four_human_events_with_decision_type
    - test_checkpoint_per_decision_chain_and_cumulative_lists（Checkpoint 共 5，human_decisions 长度 0→4，pending 4→0）
    - test_amend_seals_reviewed_candidate_first
    - test_redecide_request_evidence_then_accept_keeps_history
    - test_wrong_token_zero_writes
    - test_unknown_item_zero_writes
    - test_recover_after_checkpoint_write_crash（patch write_checkpoint 在第 2 条决定后抛异常 → recover_review → 补写 Checkpoint；新运行 human_decisions 含 2 条旧决定；replayed_pending 2 项；旧决定修订未重录）
    - test_recover_old_run_superseded（依 D-15）
verify:
  - .venv/bin/python -m unittest discover -s pipeline/review/tests -t . 2>&1 | tail -3   # OK，用例数 ≥ 70
  - grep -rn 'testing\|_fixture' pipeline/review/step.py | wc -l                          # 0
  - TDD §3 回归
commit:
  add: [pipeline/review/step.py, pipeline/review/tests/test_step_open.py]
  message: "feat(m6): open review queue, record human decisions as ledger events with per-decision checkpoints (spec §7.1/§17.1)"
on_fail: 停止并报告；需要改 pipeline/ledger（例如 D-15 未落地导致断言无法成立）时停手上报，不得绕过 Ledger 直接写库
