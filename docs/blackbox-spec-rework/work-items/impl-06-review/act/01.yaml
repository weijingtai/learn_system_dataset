act_id: impl-06/01
title: 纯函数领域模型：审核队列（由 required_decision_types 推导）、ReviewDecision 事件（复用 review_events）、决定记录（active/carried）、规范化内容哈希、折叠与 outcome
estimated_minutes: 60
group: K1
depends_on: []
decisions_required: [D-03, D-04, D-06, D-07]
scope:
  write: [pipeline/review/__init__.py, pipeline/review/errors.py, pipeline/review/model.py, pipeline/review/tests/__init__.py, pipeline/review/tests/test_model.py]
tests_first:
  - 先写 tests/test_model.py（用例名与下文逐字），运行 `.venv/bin/python -m unittest discover -s pipeline/review/tests -t .` 因 ImportError 全红，记录 Red；再实现
contract: |
  __init__.py：M6_TOOL = "pipeline.review"；M6_TOOL_VERSION = "0.1.0"；CANDIDATE_KINDS = ("assertion", "school_view")；STANDINGS = ("active", "carried_forward", "needs_review")
  errors.py：class ReviewRefused(pipeline.ledger.errors.LedgerError)，构造 ReviewRefused(message, code=None)
  model.py（纯函数：不读文件、不访问 Ledger、不取时间、不用随机数；事件经 review_events）：
    常量（逐字）：
      NON_CONTENT_KEYS = ("candidate_revision_id", "content_status", "origin")   # D-07：不进规范化内容
      APPROVED_CONTENT_STATUS = "expert_verified"
      ENTITY_ID_KINDS = {"assertion": "assertion_id", "school_view": "school_view_id"}
    queue_item_id(entity_id, decision_type) -> str：返回 "%s#%s"
    required_types(candidate) -> list[str]
      逐字调用 pipeline.knowledge_extraction.review_events.required_decision_types(candidate["source_object"], entity_kind=candidate["kind"])；返回列表（P9/第 67 条：M6 不另立映射，唯一来源）
    build_review_queue(*, candidates, seen_revision_id) -> list[dict]
      candidates：[{entity_id, kind, source_object}]，按给定顺序；source_object 为 candidate_set 内该对象的 dict
      entity_id 经 pipeline.ledger.ids.validate(ENTITY_ID_KINDS[kind], …)（失败 InvalidIdentifier ID_001）
      重复 entity_id → DuplicateIdentifier(code="ID_002")
      seen_revision_id 经 validate("artifact_revision_id")
      kind 不在 CANDIDATE_KINDS → ReviewRefused(code="SCH_002")；required_types 返回空或含表外 decision_type → SchemaViolation(code="SCH_002")
      每个候选按其 required_types 列表顺序生成队列项；队列项键序逐字：queue_item_id, target_entity_id, kind, decision_type, seen_artifact_revision_id（每项同一 seen_revision_id）
    decision_event(*, queue_item, seen_artifact_revision_id, processing_run_id, step_run_id, verdict, rationale, actor_ref, evidence_refs=(), consumption_level="INTERNAL_DEMO") -> dict
      直接调用 pipeline.knowledge_extraction.review_events.build_review_decision(decision_type=queue_item["decision_type"], verdict=…, entity_kind=queue_item["kind"], entity_id=queue_item["target_entity_id"], seen_artifact_revision_id=…, processing_run_id=…, step_run_id=…, actor_ref=…, rationale=…, evidence_refs=…, consumption_level=…)
      返回其产物；本函数不新增任何顶层键（第 68 条：事件锚点恒为 seen；modified_revision_id/standing/carried_* 不进事件）
    event_bytes(event) -> bytes：json.dumps(event, sort_keys=True, ensure_ascii=False).encode("utf-8")
    decision_entry(*, decision_revision_id, queue_item, event=None, standing="active", carried_from_revision_id=None, carried_to_revision_id=None, carried_content_hash=None, modified_revision_id=None) -> dict
      active（standing == "active"，event 必填）：event["event_kind"]=="review_decision"；event["target"]["entity_id"] == queue_item["target_entity_id"]；event["target"]["artifact_revision_id"] == queue_item["seen_artifact_revision_id"]（事件锚恒 seen，第 68 条）；verdict=="modify" ⇔ modified_revision_id 非空且 validate("artifact_revision_id")（否则 ReviewRefused SCH_001 / InvalidIdentifier ID_001）；carried_from_revision_id/carried_to_revision_id/carried_content_hash 必须为 None；seen_revision_id = event target 修订
      carried（standing == "carried_forward"，event 必填为该决定的**首审原始事件**，第 69 条）：seen_revision_id = event["target"]["artifact_revision_id"]（首审审核者实际所见的**旧**修订，**不得改写为复审新修订**）；carried_to_revision_id == queue_item["seen_artifact_revision_id"]（复审队列项当前修订）且 validate("artifact_revision_id")；carried_from_revision_id == decision_revision_id（原决定事件修订）且 validate("artifact_revision_id")；carried_content_hash 非空（该对象旧修订的 content_hash）；verdict == "modify" ⇔ modified_revision_id 非空且 validate("artifact_revision_id")（= 首审决定的 modified_revision_id，保留人工修订，第 74 条；非 modify 必须为 None）
      needs_review（standing == "needs_review"）：仅由 propagation/复审对照产出，流经 fold/outcome，不写 Ledger；seen_revision_id = queue_item["seen_artifact_revision_id"]，carried_* 为 None
      键序逐字：decision_revision_id, queue_item_id, target_entity_id, kind, decision_type, verdict, standing, seen_revision_id, modified_revision_id, carried_from_revision_id, carried_to_revision_id, carried_content_hash, rationale
    normalize_content(candidate, spans_by_id) -> bytes
      obj = candidate["source_object"] 去掉 NON_CONTENT_KEYS 后的浅拷贝；追加
        "evidence_quotes": [{"source_span_id": l["source_span_id"], "quote": spans_by_id[id]["text"][start:end]} for l in source_object.get("evidence", [])]
        "source_quotes": [{"source_span_id": s["source_span_id"], "quote": spans_by_id[s["source_span_id"]]["text"]} for s in (source_object.get("source_refs") or [])]   # school_view 的 source_refs 元素为 {source_id, source_span_id}
      Span 不存在 → MissingReference(code="REF_001")；0 <= start < end <= len(text) 不成立 → SchemaViolation(code="SCH_002")
      字框几何（source_anchor）不进入规范化内容（D-07）
      返回 json.dumps(obj, sort_keys=True, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
    content_hash(candidate, spans_by_id) -> str：hashlib.sha256(normalize_content(...)).hexdigest()
    fold_decisions(queue, decision_entries) -> dict
      返回 {queue_item_id: 该项最后一条 decision_entry 或 None}，键覆盖全部队列项；条目按给定顺序，后者覆盖前者
      条目 queue_item_id 不在队列 → ReviewRefused(code="REF_001")；条目 target_entity_id 与队列项不符 → ReviewRefused(code="REF_001")
      active/needs_review：entry.seen_revision_id != 队列项 seen_artifact_revision_id → ReviewRefused(code="REF_001")
      carried_forward：**不以 seen 不等报 REF_001**（第 69 条；seen 为首审旧修订）；改判 entry.carried_to_revision_id == 队列项 seen_artifact_revision_id，否则 ReviewRefused(code="REF_001")
    outcome(queue, folded) -> dict
      按 target_entity_id 分组（保持队列首次出现顺序）：任一项为 None、verdict == "request_evidence" 或该项 standing == "needs_review" → unresolved；否则任一 verdict == "reject" → rejected；否则 approved
      返回键：approved([entity_id]), rejected([entity_id]), unresolved([queue_item_id])
tests:
  test_model.py: |
    测试用内联构造的 4 个候选（as_qizheng_000001 evidence p0003_s04/s08、as_qizheng_000002 p0003_s03/s05、as_qizheng_000003 p0001_s02、sv_…1 school_view source_refs p0003_s08）与内联 spans_by_id（文字取自 fixture spans.yaml），不读 Ledger
    - test_queue_five_items_ids_and_order
    - test_queue_deterministic_twice
    - test_queue_uses_review_events_required_decision_types（school_view 含 review_source_fidelity + review_school_attribution；assertion 仅 review_source_fidelity；共 5 项）
    - test_queue_invalid_entity_id_ID_001
    - test_queue_duplicate_entity_ID_002
    - test_queue_unknown_kind_SCH_002
    - test_decision_event_matches_review_events_key_order
    - test_decision_event_has_no_standing_key
    - test_decision_entry_seen_anchor_and_modify_modified_revision（active；事件锚 = seen；modify 另携 modified_revision_id）
    - test_decision_entry_accept_forbids_modified_revision
    - test_decision_entry_modify_requires_modified_revision
    - test_decision_entry_active_forbids_carried_fields
    - test_decision_entry_carried_keeps_old_seen_and_carried_to（第 69 条：seen = 首审旧修订；carried_to = 复审队列项 seen）
    - test_decision_entry_carried_requires_carried_from_and_content_hash
    - test_decision_entry_carried_modify_keeps_modified_revision（第 74 条：carried × modify 必须携首审 modified_revision_id，缺失 → SCH_001）
    - test_decision_empty_rationale_rejected
    - test_decision_school_dispute_requires_school_attribution
    - test_decision_invalid_verdict_rejected
    - test_fold_carried_entry_seen_mismatch_allowed（第 69 条：carried 不以 seen 不等报 REF_001，改判 carried_to）
    - test_fold_active_entry_seen_mismatch_REF_001
    - test_fold_unknown_item_REF_001
    - test_outcome_approved_rejected_unresolved
    - test_content_hash_ignores_geometry_but_not_text
    - test_normalize_missing_span_and_bad_offsets
verify:
  - .venv/bin/python -m unittest discover -s pipeline/review/tests -t . 2>&1 | grep -E "^(Ran|OK|FAILED)"   # OK，用例数 ≥ 23
  - grep -rE '^\s*(import|from) (requests|openai|anthropic|httpx)' pipeline/review | wc -l   # 0
  - grep -nE 'datetime|time\.|random|uuid' pipeline/review/model.py | wc -l                  # 0
  - TDD §3 回归
commit:
  add: [pipeline/review]
  message: "feat(m6): pure review model - queue from required_decision_types, active/carried decision entries, normalized content hash (spec §8.1/§8.2/§14)"
on_fail: 停止并报告；D-03/D-04/D-06/D-07 与已落地 review_events 契约不符（第 67/68/69 条）时不得自行调和
