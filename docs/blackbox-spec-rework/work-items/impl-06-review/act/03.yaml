act_id: impl-06/03
title: 纯函数精确失效传播 propagate：变更 Span 判定、对象级可达闭包、决定继承/降级、ReworkImpactReport（§14.1）
estimated_minutes: 75
group: K1
depends_on: [impl-06/01]
decisions_required: [D-05, D-06, D-07, D-08, D-09]
scope:
  write: [pipeline/review/propagation.py, pipeline/review/tests/test_propagation.py]
tests_first:
  - 先写 tests/test_propagation.py（用例名逐字），新增用例全 ERROR 后再实现
contract: |
  propagation.py（纯函数；允许 import pipeline.review.model 的 content_hash）：
    SPAN_COMPARE_KEYS = ("text", "source_anchor")          # D-07：排除 start_offset/end_offset/batch_id
    THRESHOLD_RATIO = 0.30；THRESHOLD_ROUND = 3              # §14.1:642
    changed_span_ids(old_spans_doc, new_spans_doc) -> dict
      以 span_id 对齐；对 SPAN_COMPARE_KEYS 取子字典做 json.dumps(sort_keys=True, ensure_ascii=False) 比较
      返回 {"changed": [排序], "removed": [排序], "added": [排序]}
    reachable_entities(candidates, affected_span_ids) -> list[str]
      直接可达：候选 evidence[].source_span_id 或 source_refs[].source_span_id 与 affected 有交集
      传递闭包：反复加入 subject_entity_id 或 claim_refs 命中已可达集合的候选，直至不动点
      返回 entity_id 排序列表
    propagate(*, old_candidates, old_spans_doc, new_spans_doc, validation_entries, standing_decisions, rework_round_before, trigger_correction_request_revision_id) -> dict
      参数：old_candidates = 修正前 candidate_set 的候选对象（[{entity_id, kind, source_object}]）；
            validation_entries = 本 Gate 依据的校验条目（含 entity_id）；standing_decisions = 修正前 reviewed_edition.decisions；
            trigger_correction_request_revision_id = CorrectionRequest 修订号
      签名中不得出现任何由操作者挑选对象的参数（§14.1:643）；**本函数不写 Ledger、不调用 invalidate_revision**（D-08 推荐 B）
      步骤：
        1 spans = changed_span_ids(old, new)；affected = changed ∪ removed
        2 reachable = reachable_entities(old_candidates, affected)
        3 invalidated = [{"kind": "candidate", "entity_id", "revision_id": <该项所属候选修订>} for 可达候选（按 entity_id 排序）]
                      + [{"kind": "validation_entry", "entity_id", "revision_id": None, "check": entry.check} for entity_id ∈ reachable 的条目（按 entity_id, check 排序）]
        4 对不可达候选：carried_forward += {"kind": "candidate", "entity_id", "revision_id": <候选修订>, "carried_from_revision_id": <候选修订>}
        5 对每条立场决定（按 queue_item_id 排序）：
             目标不可达 → carried_forward += {"kind": "decision", "entity_id": target, "revision_id": decision_revision_id, "carried_from_revision_id": seen_artifact_revision_id}
             目标可达且其任一证据/来源 Span ∈ removed → needs_review += {"decision_revision_id", "target_entity_id", "queue_item_id", "reason": "target_removed"}
             目标可达且 model.content_hash(候选, 旧 spans) == model.content_hash(候选, 新 spans) → carried_forward（同上 decision 形状）
             否则 → needs_review（reason "content_changed"）
        6 valid_object_count = len(old_candidates) + len(validation_entries)；ratio = round(len(invalidated) / valid_object_count, 4)（分母 0 → 0.0）
        7 rework_round = rework_round_before + 1；warnings = ["rework_threshold_exceeded"] 当 rework_round >= 3 或 ratio >= 0.30，否则 []
      返回键序逐字：schema_version("1.0.0"), trigger_correction_request_revision_id, rework_round, changed_span_ids(spans.changed), removed_span_ids(spans.removed),
        reachable_entity_ids, invalidated, carried_forward, needs_review, invalidated_count, carried_forward_count, needs_review_count,
        valid_object_count, invalidated_ratio, warnings, affected_queues(needs_review 非空 → ["m6"] 否则 [])
tests:
  test_propagation.py: |
    脚手架：old_spans_doc = fixture spans.yaml 解析结果；new_spans_doc = 深拷贝后按场景修改；候选、校验条目、立场决定内联构造（5 条立场：as_…001/as_…002/as_…003 各 source_fidelity、sv_…1 的 source_fidelity 与 school_attribution；每候选 1 条校验条目）
    场景 S1：p0003_s08 文字第 4 字「宮」改为「官」（合成修正，逐字框 char 同步改）；p0003_s05 source_anchor.bbox.x += 1.0
    - test_changed_spans_excludes_offset_shift（p0003_s06 文字加一字并平移其后 offset → changed 只含 s06）
    - test_changed_removed_added_sets
    - test_reachable_direct_and_transitive（S1 → [as_qizheng_000001, as_qizheng_000002, sv_…1]）
    - test_s1_counts_exact（invalidated 3、carried_forward 3、needs_review 3、valid 4、ratio 0.75；首切片 validation_entries=[]）
    - test_s1_equal_content_reachable_decision_carried（as_qizheng_000002 reject → carried_forward）
    - test_s1_changed_content_decisions_need_review（as_…001 与 sv_…1 的两条决定 → reason content_changed）
    - test_s1_school_view_two_decisions_need_review（sv_…1 的 source_fidelity 与 school_attribution 各计 1）
    - test_unreachable_object_and_decision_carried_with_from_revision
    - test_removed_span_gives_target_removed
    - test_threshold_by_round（rework_round_before=2，单改 p0001_s02 字框 → round 3 且告警）
    - test_threshold_below_ratio_no_warning（构造 ratio < 0.30、round 1 → warnings 为空）
    - test_report_key_order_exact
    - test_propagate_signature_has_no_operator_selection（inspect.signature 参数名集合逐字等于 contract）
    - test_module_does_not_reference_invalidate_revision（源码不含 "invalidate_revision"）
    - test_deterministic_twice
verify:
  - .venv/bin/python -m unittest discover -s pipeline/review/tests -t . 2>&1 | grep -E "^(Ran|OK|FAILED)"   # OK，用例数 ≥ 56
  - grep -nE 'datetime|time\.|random|uuid|open\(' pipeline/review/propagation.py | wc -l   # 0
  - grep -c 'invalidate_revision' pipeline/review/propagation.py                            # 0（D-08 推荐 B）
  - TDD §3 回归
commit:
  add: [pipeline/review/propagation.py, pipeline/review/tests/test_propagation.py]
  message: "feat(m6): precise invalidation propagation with carried_forward/needs_review and rework impact report (spec §14.1)"
on_fail: 停止并报告；D-07/D-09 口径与本 contract 冲突时不得自行折中
