act_id: impl-06/06
title: close_review：Review Gate、ReviewedEditionPackage、带全部人工决定的 Transformation、m6 StagePackage（§14:631、§17、§20.3）
estimated_minutes: 90
group: K2
depends_on: [impl-06/05]
decisions_required: [D-04, D-13, D-17]
scope:
  write: [pipeline/review/step.py, pipeline/review/tests/test_step_close.py]
tests_first:
  - 先写 tests/test_step_close.py（用例名逐字），全部 Red 后再实现
contract: |
  step.py 追加：
    close_review(service, step_run_id, resume_token) -> dict
      前置（零写入、不消费 token）：StepRun awaiting_human；读队列与决定并 fold；model.outcome(...).unresolved 非空 → ReviewRefused（message 含「未解决项 <n>」）
        CorrectionRequest 不阻断结审（D-10 A），只登记进包
      1 service.resume(step_run_id, resume_token)；此后任何异常 → _fail（检查名 review_gate / internal）
      2 构造 reviewed_edition_package（键序逐字，README §5.3）：
          approved：对 outcome.approved 按候选顺序 {entity_id, kind, reviewed_revision_id(有 amend 取最后 amended_revision_id，否则候选修订), content_status: "expert_verified", decision_revision_ids}
          rejected：{entity_id, kind, seen_revision_id, content_status(候选原值), decision_revision_ids}
          decisions：每个队列项的立场决定 {decision_revision_id, queue_item_id, target_entity_id, seen_artifact_revision_id, current_target_revision_id, decision_type, verdict, standing, carried_from_revision_id, trigger_correction_request_id}
          evidence_links：获批对象（amend 取修订后内容）的 evidence_links + corpus_spans_revision_id
          school_views：获批 school_view {school_view_id: entity_id, school_id, subject_entity_id, conflict_group_id, changes_current_judgment: 其 review_school_attribution 立场决定的值}
          unresolved_count: 0
          correction_request_revision_ids：冻结输入与本运行中 event_kind == "correction_request" 的 human_event 修订（按记录顺序）
          rework_impact_report_revision_id: None（返工运行由 ACT 09 填写）
      3 gate_report = gate.evaluate_review(candidates, validation_package, corpus_spans_doc, configuration, decision_events, reviewed_package)
        validation_report = put "validation_report"（json {"gate_profile": "m6_review_v1", "review": gate.review, "checks": gate.checks, "failed_checks": [...]}）→ seal
        log = put "step_log"（每步一行 UTF-8，不含时间戳）→ seal
        gate.review == "failed" → _fail("review_gate", 失败检查名以逗号连接)
      4 package_rev = put "reviewed_edition_package"（json.dumps(sort_keys=True, ensure_ascii=False)）→ seal
      5 transformation_id = record_transformation(step, operation="review_curate", tool=M6_TOOL, tool_version=M6_TOOL_VERSION, configuration_revision_id=config,
          input_revision_ids=冻结输入 + 本运行 review_queue + 本运行 reviewed_candidate 修订, output_revision_ids=[package_rev],
          validation_report_revision_id=validation_report, human_event_revision_ids=冻结与本运行全部 human_event 修订（决定、CorrectionRequest、阈值确认）)
      6 m6 StagePackage（形状同 impl-02 act/03 第 13 步）：stage_package_id = new_id("stage_package_id", stage="m6")；
          payload {"reviewed_edition_package_revision_id", "approved_count", "rejected_count", "decision_count", "unresolved_count": 0}
          manifest {"schema_version", "processing_run_id", "step_run_id", "input_artifacts": [ref(x) for x in 冻结], "output_artifacts": [ref(package_rev)], "counts": {"candidates", "approved", "rejected", "decisions"}, "content_sha256": sha256(package 字节)}
          validation {"passed": True, "report_artifacts": [ref(validation_report)]}
          lineage {"upstream_artifacts": [ref(corpus_package), ref(candidate_package), ref(validation_package)], "transformations": [{"operation": "review_curate", "step_run_id", "configuration_artifact_revision_id", "input_artifact_revision_ids", "output_artifact_revision_ids": [package_rev]}]}
          logs [ref(log)]；failures []
          register_stage_package → seal
      7 finish_step_run(step, StepResult{status "succeeded", output_artifact_ids [package_rev, stage_package_rev], validation_report_ids [validation_report], log_artifact_ids [log], failure_artifact_ids []})
      返回键：status, processing_run_id, step_run_id, reviewed_edition_package_revision_id, stage_package_id, package_revision_id, validation_report_revision_id, log_revision_id, transformation_id, step_manifest_revision_id, approved, rejected, decision_revision_ids, gate
        失败时：status "failed", failed_check, failure_revision_id, reason
tests:
  test_step_close.py: |
    脚手架：seed_upstream → open_review → 按 testing/data/m6_decisions.yaml 逐条 record_decision → close_review
    - test_close_succeeds_three_approved_one_rejected（与 expected_review.first_review 逐项相等）
    - test_close_consumes_token_and_step_succeeded
    - test_reviewed_package_decisions_have_entity_and_seen_revision（§8.1:265 双锚）
    - test_amended_object_uses_reviewed_candidate_revision
    - test_evidence_links_quote_hash_recomputed_from_ledger_spans
    - test_stage_package_validates_schema_and_content_sha
    - test_transformation_records_all_human_events（human_event_revision_ids 集合 == 4 条决定）
    - test_close_refuses_with_unresolved_zero_writes_token_kept
    - test_close_lists_correction_requests_without_blocking（首审期间 request_correction 覆盖 p0003_s08，4 条决定后仍可结审，包内 correction_request_revision_ids 含该修订）
    - test_gate_failure_fails_step_run_no_stage_package（patch gate.evaluate_review 返回 failed）
    - test_exception_after_resume_fails_internal（patch record_transformation 抛异常 → failed_check internal，失败修订 sealed）
verify:
  - .venv/bin/python -m unittest discover -s pipeline/review/tests -t . 2>&1 | tail -3   # OK，用例数 ≥ 80
  - export LC_ALL=en_US.UTF-8; bash openspec/acceptance/run_all.sh | tail -1               # SUMMARY pass=2 fail=1 blocked=8（未改动）
  - TDD §3 回归
commit:
  add: [pipeline/review/step.py, pipeline/review/tests/test_step_close.py]
  message: "feat(m6): close review with independent gate, reviewed edition package and m6 stage package (spec §14/§20.3)"
on_fail: 停止并报告；不得在 Gate 失败时仍产出 StagePackage
