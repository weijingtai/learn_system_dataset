package: blackbox-impl-06-review
title: 首纵切薄用：M6 Review & Curation（§14）+ 精确失效传播（§14.1）+ 命令行 Review Console
status: READY_FOR_REVIEW   # W5-H 定稿 2026-09-13，依 G7-RULINGS §1 P1–P9、§4 impl-06、§9.3 第 34–43 条、§9.5 第 45–46 条、§9.6–§9.11 第 47–58 条、§9.12 第 61–62 条；未经实现
executor_groups:
  K1: [impl-06/01, impl-06/02, impl-06/03]             # 纯函数，无 Ledger；一个执行 Agent 串行
  K2: [impl-06/04, impl-06/05, impl-06/06, impl-06/07] # 前置 impl-05/impl-03 ACCEPTED 且 K1 ACCEPTED
  K3: [impl-06/08, impl-06/09, impl-06/11, impl-06/12]   # 前置 K2 ACCEPTED；impl-06/10 已 WITHDRAWN（第 61 条）
preconditions:
  - K2 起：impl-05（M4）、impl-03（M5）状态 ACCEPTED，且 run_m4/run_m5 输出契约与 README §5.1 一致
  - 下游解析上游 StagePackage 只接受所属 StepRun `succeeded` 的包（P5）；M5 包另须 StagePackage `validation.passed == true`（第 21 条）
  - P2：本包新增 artifact_type（review_queue / reviewed_edition / reviewed_edition_package / rework_impact_report）须由 impl-00 `act/13.yaml` 登记写入 impl-00-interfaces/INTERFACES.md §4 闭集；开工前提为 `python3 docs/blackbox-spec-rework/work-items/impl-00-interfaces/check_interfaces.py` 末行 `fail=0` 且 exit 0，且上述类型各自 PASS 行存在（第 54 条：不写死 pass 总数；未登记不得实现）
  - P7：真实 `expert_verified` 签发决定表由用户撰写（README §9）；本包测试只用非生产合成数据并在 README/数据中显式标注 synthetic_fixture，不计为真实签发
  - 第 61 条（D-01）：ACT 10 已 WITHDRAWN（`act/10.yaml` 保留备查），不派发；acceptance 第 12 项 snapshot_projection 恒 BLOCKED（前置缺失: M7 创世汇编）
  - 第 62 条（D-08）：采纳 B，M6 不改 M4 修订状态（rework.py 不含 invalidate_revision），旧 candidate_set 由 M4' 以 supersede_revision 替换
  - 本包写范围与 impl-08（pipeline/orchestrator/、pipeline/contract_registry/）零交集；不写 run_all.sh
acts:
  - file: act/01.yaml
    id: impl-06/01
    writes: ["pipeline/review/__init__.py", "pipeline/review/errors.py", "pipeline/review/model.py", "pipeline/review/tests/__init__.py", "pipeline/review/tests/test_model.py"]
  - file: act/02.yaml
    id: impl-06/02
    writes: ["pipeline/review/gate.py", "pipeline/review/tests/test_gate.py"]
  - file: act/03.yaml
    id: impl-06/03
    writes: ["pipeline/review/propagation.py", "pipeline/review/tests/test_propagation.py"]
  - file: act/04.yaml
    id: impl-06/04
    writes: ["pipeline/review/testing/__init__.py", "pipeline/review/testing/upstream_stub.py", "pipeline/review/testing/data/m4_candidates.yaml", "pipeline/review/testing/data/m5_validation.yaml", "pipeline/review/testing/data/m6_decisions.yaml", "pipeline/review/testing/data/corrections.yaml", "pipeline/review/testing/data/expected_review.yaml", "pipeline/review/inputs.py", "pipeline/review/tests/test_inputs.py"]
  - file: act/05.yaml
    id: impl-06/05
    writes: ["pipeline/review/step.py", "pipeline/review/tests/test_step_open.py"]
  - file: act/06.yaml
    id: impl-06/06
    writes: ["pipeline/review/step.py", "pipeline/review/tests/test_step_close.py"]
  - file: act/07.yaml
    id: impl-06/07
    writes: ["pipeline/review/console.py", "pipeline/review/__main__.py", "pipeline/review/tests/test_console.py"]
  - file: act/08.yaml
    id: impl-06/08
    writes: ["pipeline/review/rework.py", "pipeline/review/testing/upstream_stub.py", "pipeline/review/tests/test_rework.py", "pipeline/review/console.py"]
  - file: act/09.yaml
    id: impl-06/09
    writes: ["pipeline/review/rework.py", "pipeline/review/step.py", "pipeline/review/testing/upstream_stub.py", "pipeline/review/tests/test_rework_review.py", "pipeline/review/console.py"]
  - file: act/10.yaml
    id: impl-06/10
    status: WITHDRAWN   # G7-RULINGS §9.12 第 61 条：CanonicalKnowledgeSnapshot 归 M7；不派发，保留文件备查
    writes: ["pipeline/review/snapshot.py", "pipeline/review/tests/test_snapshot.py"]
  - file: act/11.yaml
    id: impl-06/11
    writes: ["pipeline/review/acceptance.py", "pipeline/review/tests/test_acceptance.py", "openspec/acceptance/m6-data-fields.sh"]
  - file: act/12.yaml
    id: impl-06/12
    writes: ["pipeline/review/acceptance.py", "pipeline/review/tests/test_acceptance.py", "pipeline/review/model.py", "openspec/acceptance/m6-data-fields.sh"]
global_rules:
  - 每个 ACT 先写测试（Red 原文入报告）再实现；unittest；测试只用 tempfile 目录，不写 var/ 与 fixture
  - 只用标准库 + PyYAML + jsonschema；不新增依赖、不新增 ID 前缀（队列项号 <entity_id>#<decision_type> 是任务标签）、不调用模型 API
  - review_decision 事件逐字复用 pipeline.knowledge_extraction.review_events.build_review_decision，不新造顶层键、不把 standing 写进事件
  - 生产代码只读 Ledger 冻结修订；pipeline/review/testing/ 为非生产子包，只允许 tests/ 与 acceptance.py import
  - 不改 pipeline/ledger、pipeline/knowledge_extraction、pipeline/validation、pipeline/dataset_compiler、pipeline/orchestrator、pipeline/contract_registry、run_all.sh、m3-coverage.sh、fixture、规格与 schemas
  - 每条人工决定：put human_event → seal → record_human_event → write_checkpoint，不得合并多条决定；同阶段后续运行经 supersede_step_run
  - 中文注释与 docstring；公开函数名、参数名、返回键、检查名、输出行与 ACT contract 逐字一致
  - 每个 ACT 一个提交；不得 git add -A / git add .；执行者不写台账、不写 ACCEPTED、不伪造人工签发
gates:
  - bash docs/blackbox-spec-rework/verify-T.sh | tail -1
  - bash docs/blackbox-spec-rework/work-items/g3-r3/mutations.sh all | tail -1
  - bash openspec/schemas/verify.sh >/dev/null; echo $?
  - python3 docs/blackbox-spec-rework/work-items/impl-00-interfaces/check_interfaces.py; echo exit=$?   # 末行 fail=0 且 exit 0，本包类型 PASS 行存在（第 54 条）
  - .venv/bin/python -m unittest discover -s pipeline/ledger/tests -t . 2>&1 | grep -E "^(Ran|OK|FAILED)"
  - .venv/bin/python -m unittest discover -s pipeline/corpus_compiler/tests -t . 2>&1 | grep -E "^(Ran|OK|FAILED)"
  - .venv/bin/python -m unittest discover -s pipeline/knowledge_extraction/tests -t . 2>&1 | grep -E "^(Ran|OK|FAILED)"
  - .venv/bin/python -m unittest discover -s pipeline/validation/tests -t . 2>&1 | grep -E "^(Ran|OK|FAILED)"
  - .venv/bin/python -m unittest discover -s pipeline/review/tests -t . 2>&1 | grep -E "^(Ran|OK|FAILED)"   # OK（ACT 01 起，用例数达 TDD §1 阈值）
  - export LC_ALL=en_US.UTF-8; bash openspec/acceptance/run_all.sh | tail -1      # == TDD §0 BASELINE_RUN_ALL（本批不改）
  - bash openspec/acceptance/m3-coverage.sh | tail -1                            # == TDD §0 BASELINE_M3（不回退）
  - git diff --check
on_fail: 停止并报告；contract 两种理解、测试无法按定义写出、Ledger 公开方法行为与 contract 假设不符、需要改 scope 外文件（尤其 pipeline/ledger 或已验收模块）→ 一律停手上报
