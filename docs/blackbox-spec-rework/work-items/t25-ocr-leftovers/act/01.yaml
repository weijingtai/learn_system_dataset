    - ocr/src/gujiorc/ocr/segment.py
    - ocr/tests/test_export_corpus.py
    - ocr/src/gujiorc/core/export.py       # 第 5 步：只加 EXPORT_CORPUS_FORMAT 常量 + docstring 一段，不改 manifest 字段结构
    - docs/blackbox-spec-rework/work-items/t25-ocr-leftovers/act/01.yaml   # 仅用于第 6/7 步填记录表
  read_only:
    - ocr/src/gujiorc/core/models.py
    - ocr/tests/test_segment_alignment.py  # 必须保持通过，不许改它来迁就新逻辑
    - ocr/docs/                            # 全部只读参考
    - pipeline/                            # 全部只读参考（本任务不改 pipeline）
    - openspec/                            # 全部只读参考
  forbidden:
    - ocr/local/static/                    # 未验收的 Vue 前端，禁止碰（ocr/docs/HANDOFF.md:115）
