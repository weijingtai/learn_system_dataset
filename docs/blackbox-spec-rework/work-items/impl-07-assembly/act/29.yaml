background: |
  先读 `CHARTER-INCREMENTAL.md` §19（F2/F3/F4 实测）与 §25（本波全部口径）全文。
  规格依据：`README.md` §6 第 330 行（可比单元口径）、第 523–526 行（R07/R07b/R08/R09 规则表）；
  规格 `openspec/learn-system-blackbox-architecture.md` §15:655（不覆盖旧版本）。

  主 Agent 2026-09-22 实测（HEAD 64f2946，assembly 229 OK，m7-assembler pass=16 fail=0 blocked=1）：
  - r2 金标唯一的对齐关系是自环 `alignment as_qizheng_900001 -> as_qizheng_900001`：ed99 视图沿用了 ed01 的断言号
  - `incremental.py` R07/R08 用 `entity_ref`（= 断言号）相等判断可比；规格要的是主体（subject_entity_id）
  - `_base_units` 把**所有**基底断言（含同 source）都当作 present:true 的单元；Snapshot `editions[]` 没有 collation_units 字段
  - R09 用 `sorted([declared, absent])` 的 source_id 字典序决定增文/缺文方向；R09 提案不带 targets
  - `apply._collation_pair` 在 targets 不足 2 个时按 collation_key 去两侧各找一条断言——缺侧必然 0 条 → 拒收（F2）
  - `model.py:604-607` 关系端点为 None 时跳过校验（`attached` 已在用）
  - M8（`dataset_compiler/inputs.py`）只按修订号定位 Snapshot，不解析 `editions[]` 字段
  - 复现探针：`.venv/bin/python pipeline/assembly/tests/probe_g_blockers.py` 当前 F2/F3/F4 REPRODUCED
contract: |
  ⚠ 范围变更（主 Agent 2026-09-22，CHARTER §26）：本 ACT 拆为两条并行轨道。
    本 ACT = 轨道 1：引擎（model / genesis / apply / incremental / orchestrate）+ fixture + 金标 + 引擎侧用例。
    下文第七（Gate）、第九（acceptance.py）两节**移交 ACT 30**，本 ACT 不做，gate.py / acceptance.py 只读。
    走 run_m7 的全栈用例会经过旧 Gate，可能因旧 Gate 不认识 §25 新形状而红——这是预期：
    逐条列出（用例、Gate 检查项、明细），其余全绿即可提交；不许改 gate.py。
    Gate 分支合并后由主 Agent 做集成验证（R15 全栈用例、m7-assembler pass=17、run_all 20.5 PASS）。
  全部按 CHARTER §25 实现。要点复述（有出入以 §25 为准）：

  一、断言号属于一个版次（§25.1）
    视图带着基底另一版次拥有的 as_ 号 → DuplicateIdentifier，message 含「跨版次沿用断言号」。
    关系自环 → model 拒收。

  二、R07/R08/R07b 比主体（§25.2）
    前提：同 work_key、同 collation_key、不同 source_id、两侧都声明 present。
    两侧 subject_entity_id 裁决到同一正式对象：NFC 文本相等 → R07；不等 → R08（detail 带 difflib opcodes）；
    主体不同 → R07b 人工；主体尚待人工裁决 → depends_on 那条提案。推不出确定对应 → 停手上报。

  三、同 source 不配对（§25.3）；方向按角色（§25.4）：新版 = 本轮视图，旧版 = 基底。删掉按 source_id 字典序定方向。

  四、Snapshot editions[].collation_units（§25.5）
    必填，按 collation_key 升序，未声明为 []；创世与合并时写入，同书返工整体替换。
    基底一侧声明只从这里读。未声明 → not_comparable；声明 present 但无获批断言 → not_comparable（declared_without_assertion）。

  五、关系两端（§25.6 表）；null 端点只许 addition / omission。

  六、提案带 targets = [from, to]（§25.7）；apply._collation_pair 只按 targets 落关系，删掉回头搜索路径。

  七、Gate 独立跟上（§25.8），不许导入被验模块。

  八、fixture（§25.9）：ed01 加声明 0005 present:false；ed99 的 0001 自己发号；按 §25.9 造出四类各一；
      0004 必须 not_comparable。r1/r2/r3 金标由 build_fixture.py 实跑重出。

  九、acceptance.py 的 edition_collation 改为实跑判定（四类各 ≥1、与金标一致、不可比单元无关系），不再 BLOCKED。

  十、不许做的事
    - 不许用文本相似度、不许调模型（§4 与 README :330「M7 不做文本相似度」）
    - 不许改 matcher.py（要改就停手上报）、不许改 step.py / run_all.sh / m7-assembler.sh
    - 不许为了让新关系通过而放宽 Gate
    - 不许手写金标；不许写 var/ 真书正本；不许改 mini_ed01
