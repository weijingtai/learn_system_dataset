background: |
  **先读**：`CHARTER-INCREMENTAL.md` 全文（尤其 §3.1、§8、§9、§10），
  再读 `act/04.yaml` **第 20–40 行的规格细节**——本 ACT **逐字沿用**那份规格
  （发号、merge_entities、split、retire、reject_alias、accept_alias、attach、unify、
   对勘四类、content_status、返回键、IdentityDelta entry 键序），不重抄、不改写。

  主 Agent 2026-09-22 实测：
  - B 波已落地 `matcher.py`（7.6K）与 `incremental.py`（32.9K）；`assembly` **136 用例全绿**
  - `m7-assembler.sh` `pass=11 fail=0 blocked=5`；`upstream_m6_real` 与 `no_model_calls` **PASS**
  - `incremental.py:34 proposal_key(kind, subject)` 已实现，本波直接用，不得另造
contract: |
  一、§11 裁定（主 Agent 2026-09-22，解 C 波与 B 波护栏的冲突）—— **先读这条**

    **冲突事实**：`act/04.yaml` 规定 `variant_reading` 的 detail 用
    `difflib.SequenceMatcher(...).get_opcodes()` 计算；
    而 B 波护栏 `test_propose_pairs_is_the_only_matching_site`
    （`test_incremental_proposals.py:141-152`）用 AST **禁止 `matcher.py` 与
    `incremental.py` 导入 `difflib`**。两者直接打架。

    **裁定**：
      1. `difflib.SequenceMatcher.get_opcodes()` **允许**用于**记录**
         已确立配对的差异细节（`variant_reading.detail.opcodes`）。
         理由：它是**确定性**的（同输入同输出，可复现），
         且此处**不做任何配对判断**——配对早已由 `propose_pairs` 确立。
         CHARTER §4 禁止的是「**模糊文本相似度匹配**」即用相似度**决定谁和谁配对**，
         与「记录两个已配对文本的差异」是两回事。
      2. **但只许出现在本波新建的 `apply.py`**，
         `matcher.py` / `incremental.py` **仍然绝对禁止**（B 波护栏一字不改）。
      3. **必写护栏** `test_difflib_only_records_never_decides_pairing`：
         断言 `apply.py` 中 `difflib` 的使用**不影响任何配对/裁定结果**——
         做法：把 `difflib.SequenceMatcher` 打桩成返回空 opcodes，
         断言**除 `variant_reading.detail.opcodes` 之外，产物逐字节不变**。
      4. `apply.py` 仍**禁止**导入 `requests` / `httpx` / `openai` 等网络库。

  二、应用裁定主体（apply.py，新建）
    按 `act/04.yaml:20-40` 逐字实现，包括但不限于：
      - `affected=None` 全部重建；`affected=集合` 时**集合外基底对象的规范 JSON 必须原样拷贝**
        （从 `base_knowledge` 取对象，**不重新构造**）——这条是增量正确性的核心
      - 发号、`merge_entities`、`split`、`retire`、`reject_alias`、`accept_alias`、
        `attach`、`unify`、`first_layer_display` 各分支
      - 对勘四类（alignment / variant_reading / addition / omission）写入 `relations`
      - `content_status` 只写入 provenance 与 assertions 原值，
        Pattern/Concept 顶层**不得出现** `content_status` 键
      - 返回键与 IdentityDelta entry 键序**逐字**按草稿
    硬性：结果经 `model.validate_snapshot_knowledge` 自检。

  三、发号口径（D-04 + CHARTER §8.1）
      - 号 = `max(id_allocation["pat_<technique>"], 活对象与 retired 中该命名空间最大号) + 1` 起递增
      - **但 `id_allocation` 的来源只能是「已获批、进入 Snapshot 的对象」**（§8.1），
        未获批且携带 M4 自发号的候选**不得计入**，并须写进 `assembly_report`
        （键 `unapproved_with_self_issued_id`），**不得静默丢弃**
      - `as_` / `co_` **不由 M7 发号**，只做碰撞检测，冲突即 `ID_002` fail-closed

  四、名实一致收口（CHARTER §9.3，B 波已立，本波不得破坏）
    本波产出必须继续满足
    「`prev_revision_id` 非空 ⟺ `meta.base_snapshot_revision_id` 非空」。
    既有护栏 `test_prev_revision_and_meta_base_agree` **不许改、不许跳过**。

  五、确定性
    同一输入两次调用，`knowledge_bytes` / `knowledge_sha256` / `identity_delta`
    **逐字节相同**；所有列表按草稿规定的键升序排序，不得依赖字典插入序。

  六、金标
    若本波产出使 `mini_release01` 的 r1/r2 金标发生变化，**必须重建并贴出新旧 sha256 对照**
    （CHARTER §8.4 同口径）。不得让过期金标留在库里。

  七、不许做的事
    - 不许改 `matcher.py` / `incremental.py` / `genesis.py` / `canonical.py` / `gate.py` / `inputs.py`
    - 不许改 `model.py` 既有定义（只许新增）
    - 不许在 `matcher.py` / `incremental.py` 引入 `difflib`（B 波护栏）
    - 不许调用模型 API；不许用相似度决定配对
    - 不许写 `var/` 真书正本；不许改 `mini_ed01`
    - 不许让 `upstream_m6_real` / `no_model_calls` 转红或转 BLOCKED
