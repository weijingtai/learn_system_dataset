estimated_minutes: 200
group: INC-C
depends_on: [impl-07/22]
supersedes: [impl-07/04]     # 规格细节逐字沿用该草稿，冲突处见第一节
decisions: [D-04, D-05, CHARTER §3.1, §8.1, §8.4, §9.3, §11（本 ACT 新立）]
