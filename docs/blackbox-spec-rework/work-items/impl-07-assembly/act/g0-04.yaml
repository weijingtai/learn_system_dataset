act_id: impl-07/G0-04
title: 最小 Ledger 事务：resolve_m7_inputs（P5）+ run_m7 创世 + 合成宿主 fixture_seed + CLI
estimated_minutes: 110
group: G0
depends_on: [impl-07/G0-03]
scope:
  write: [pipeline/assembly/inputs.py, pipeline/assembly/fixture_seed.py, pipeline/assembly/step.py, pipeline/assembly/__main__.py, pipeline/assembly/tests/data/genesis_package.json, pipeline/assembly/tests/test_genesis_ledger.py]
tests_first:
  - 先写 tests/test_genesis_ledger.py（用例名逐字）与 tests/data/genesis_package.json（合成 ReviewedEditionPackage 输入，顶层及各级标 synthetic: true）；运行取得 Red 原文，再实现
contract: |
  inputs.py（只读；resolve_m7_inputs(service, reviewed_package_revision_ids) -> dict）
    每个入参修订必须 sealed；所属 StepRun 必须 succeeded（P5）；stage_package stage == "m6"；manifest.output_artifacts 恰 1 个 reviewed_edition_package、manifest.lineage.upstream_artifacts 含 candidate_package
    解析 reviewed_edition_package → reviewed_edition → candidate_package → candidate_set；candidate_package 所属 m4 StepRun succeeded（P5）
    technique_id 必须与 candidate_set.technique_id 一致
    返回 {"technique_id", "m6_stage_package_id", "reviewed_package_revision_id", "reviewed_edition_package_revision_id",
          "reviewed_edition_revision_id", "candidate_package_revision_id", "candidate_set_revision_id",
          "edition_part_artifact_id", "reviewed_package", "reviewed_edition", "candidate_set"}
    任一不满足 → AssemblyRefused(user_message)（begin 之前，Ledger 无写入；修订单数或字段不符时报告首个不满足项）
    允许经 reader.store.conn 只读 SELECT（frozen_inputs、artifacts.artifact_type、stage_packages），缺口并入 impl-00 README §5.2 清单；优先用 LedgerReader 公开方法
  fixture_seed.py（非生产；只经参数读 tests/data 的合成输入，灌入临时 Ledger）
    seed_genesis_package(service, doc) -> dict
      按 doc 的 ledger_constants 写：candidate_set/candidate_package/reviewed_edition/reviewed_edition_package 修订（put_artifact + seal_revision）
      写 m4 StepRun（succeeded，输出 candidate_package）与 m6 StepRun（succeeded，输出 reviewed_edition_package + m6 StagePackage）
      写配置修订（put_run_artifact）；返回 {"candidate_set_revision_id", "candidate_package_revision_id", "reviewed_edition_revision_id", "reviewed_edition_package_revision_id", "m6_package_revision_id"}
    合成输入标 synthetic: true（§9.7 第 52 条）；test/data/genesis_package.json 中任何人工决定（decisions/human_event）必须含 synthetic_fixture: true，且不得计为真实 expert_verified 或任何发布依据（P7、第 66 条）
  step.py（最小事务）
    run_m7(service, edition_part_id, *, technique_id, reviewed_package_revision_ids, base_snapshot_revision_id=None) -> dict
      begin 之前的拒绝（无写入）：base_snapshot_revision_id 非 None → AssemblyRefused（message 含「纵切后」）；
        resolve_m7_inputs 前置不满足；该 technique 已有 canonical_snapshot（创世重复）→ AssemblyRefused（message 含「已汇编」）
      create_processing_run("release_run", edition_part_id)（D-0-4；edition_part_id 即 reviewed_edition.edition_part_artifact_id）
      put_run_artifact("configuration", {stage: "m7", task: "assemble", technique_id, reviewed_package_revision_ids,
                                         base_snapshot_revision_id: None, id_range: {"pattern": [<start>, <end>]},
                                         tool: M7_TOOL, tool_version: M7_TOOL_VERSION})   # id_range 由配置修订登记（第 64 条）
      begin_step_run(input_artifact_ids=[m6 包修订])；若同一 Part 阶段已被 succeeded 运行封存，则先 supersede_step_run（经读接口查出最近 succeeded 运行，不写死号，第 58 条）
      propose_genesis → assemble_genesis(id_range=配置修订的 id_range) → evaluate_genesis
        （补发只从配置修订登记的 id_range 确定性取号；号段与补发清单随 knowledge 写入 Snapshot 修订，第 64 条）
      put_artifact("canonical_snapshot", …) + seal_revision；put_artifact("assembly_package", …) + seal_revision；put_artifact("validation_report", …) + seal_revision
      record_transformation(operation="assemble_knowledge", inputs=[m6 包修订], outputs=[canonical_snapshot, assembly_package])
      register_stage_package(stage="m7", output_artifacts=[assembly_package])
      write_checkpoint(completed_tasks=[{"task_id": "propose_r1"}, {"task_id": "seal_snapshot"}], pending_queue=[], next_pointer=None)
      finish_step_run(validation_report_ids=[validation_report], output_artifact_ids=[stage_package, canonical_snapshot, assembly_package])
      Gate 不过 → put_artifact("failure_report") + fail_step_run（检查名 ∈ {"input_contract", "genesis_gate", "internal"}）
      返回 {"status", "step_run_id", "snapshot_revision_id", "assembly_package_revision_id", "validation_report_revision_id", "gate"}
    supersede 路径以具名 helper `begin_or_supersede(service, edition_part_id, stage, configuration_revision_id)` 表达（第 58 条），供下一波多 Edition 复用
  __main__.py：python -m pipeline.assembly run --edition-part-id <art_…> --technique-id <t> --reviewed-package-revision-id <rev_…>（可重复）
    成功末行以 "M7 OK" 开头、退出 0；begin 之前被拒退出 2；运行中异常失败封存退出 1
tests:
  test_genesis_ledger.py: |
    读 tests/data/genesis_package.json；全部用例只写 tempfile 目录下的临时 Ledger
    - test_run_m7_genesis_succeeds_and_seals_snapshot（knowledge 字节与纯函数 assemble_genesis 结果逐字相同）
    - test_configuration_and_processing_run_shape（kind == release_run；edition_part_id == 传入 Part；configuration.stage == "m7"）
    - test_stage_package_schema_and_lineage（过 stage_package.schema.json；lineage 输入集合 == frozen_inputs；output 恰 1 个 assembly_package）
    - test_checkpoints_propose_then_seal（链为 propose_r1 → seal_snapshot，prev 成链）
    - test_refuse_before_begin_no_writes（base 非 None / 上游非 succeeded / 重复创世 → artifact_revisions、step_runs、audit_log 行数不变）
    - test_begin_or_supersede_uses_existing_succeeded_run（第 58 条；seed 一个 succeeded m7 运行后调用 helper，断言经 supersede_step_run 而非越阶段封存守卫）
    - test_gate_failure_seals_failure_report_and_no_package
    - test_cli_success_and_refusal_codes（"M7 OK" / 0；被拒 2）
    - test_no_upstream_mutation（运行前后 m6 包与 reviewed_edition 的 status/sha256 与 revision_status_events 行数不变）
    - test_configuration_registers_id_range（配置修订含 id_range 且 run_m7 据此取号）
    - test_snapshot_knowledge_records_id_range_and_allocation_list（Snapshot 修订的 knowledge.id_range/allocated_pattern_ids 与配置一致）
    - test_synthetic_human_decisions_marked_and_not_expert_verified（genesis_package.json 中每个决定含 synthetic_fixture: true；Snapshot 中无 expert_verified 泄漏，第 66 条）
verify:
  - .venv/bin/python -m unittest discover -s pipeline/assembly/tests -t . 2>&1 | grep -E "^(Ran|OK|FAILED)"   # OK，用例数 ≥ 71
  - .venv/bin/python -m unittest discover -s pipeline/ledger/tests -t . 2>&1 | grep -E "^(Ran|OK|FAILED)"      # OK，与基线相同（Ledger 未改）
  - grep -rE '_fixture' pipeline/assembly --include='*.py' | grep -v '/tests/' | grep -vE 'fixture_seed.py|acceptance.py' | wc -l   # 0
  - TDD §3 回归
commit:
  add: [pipeline/assembly]
  message: "feat(m7): genesis release run with minimal ledger transaction and P5 upstream resolution (spec §6.2, §17)"
on_fail: 停止并报告；Ledger 公开方法行为与 contract 不符、需改 pipeline/ledger 或共享 fixture → 停手上报
