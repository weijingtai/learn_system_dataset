  停止并报告，不许提交红的基线。
  五种情况必须停手写「## 待裁决」：
    ① 拆掉 F1 护栏后，替换的语义在规格里有两种读法
    ② 有代码或测试依赖 merged_into 关系（第三节）
    ③ ed01r2 实跑结果与预期（retired / merged / carried）不符，判断不了是 fixture 造错还是引擎有问题
    ④ 要修 F1/F5/F6 必须动 incremental.py
    ⑤ 修完后真书第二轮不再通过
