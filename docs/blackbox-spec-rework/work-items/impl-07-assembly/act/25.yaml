  cd /Users/jingtaiwei/Git/Public/learn_system && export LC_ALL=en_US.UTF-8
  .venv/bin/python -m unittest discover -s pipeline/assembly/tests -t . 2>&1 | tail -3
      # OK；≥172 + 新增；skipped 数写进回报（真书用例在无 var/ 时 skip 是允许的，别的不许新增 skip）
  .venv/bin/python - <<'PY'
  import ast; t=ast.parse(open("pipeline/assembly/gate.py").read())
  mods={(n.module or "") for n in ast.walk(t) if isinstance(n,ast.ImportFrom)}|{a.name for n in ast.walk(t) if isinstance(n,ast.Import) for a in n.names}
