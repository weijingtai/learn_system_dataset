  PY
      # 必须输出空列表
  grep -n "pending_e_wave" pipeline/assembly/step.py        # 必须无输出
  bash openspec/acceptance/m7-assembler.sh 2>&1 | grep -E "upstream_m6_real|no_model_calls|SUMMARY"
  for p in dataset_compiler review validation corpus_compiler; do
    .venv/bin/python -m unittest discover -s pipeline/$p/tests -t . 2>&1 | grep -E "^Ran|^OK|^FAILED" | tail -2; done
      # corpus_compiler 中间几行 FAIL m3_acceptance 是已知噪声，以最后的 OK 为准
  git diff --stat 593aad5 -- pipeline/assembly/matcher.py pipeline/assembly/incremental.py pipeline/assembly/apply.py pipeline/assembly/orchestrate.py pipeline/assembly/genesis.py pipeline/assembly/canonical.py pipeline/assembly/inputs.py
      # 必须无输出
  git status --short var/                                   # 无输出
  # 真书第二轮（副本上）：贴 13 项检查逐项结果与总判定
  # 篡改探针（三条，绿→红→改回，完整仓库副本含 ocr/，R13）：
  #   P1 让 view_objects_unaltered 改为对照基底而非视图 → test_tamper_view_change_silently_reverted_to_base 转红
  #   P2 让 step.py 增量路径跳过 Gate                   → test_incremental_round_fails_closed_on_gate_failure 转红
  #   P3 让 Gate 的闭包直接取 report.affected（不自算） → test_tamper_report_affected_missing_one 转红
