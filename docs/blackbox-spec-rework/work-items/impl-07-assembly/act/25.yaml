on_fail: |
  停止并报告，不许提交红的基线。
  五种情况必须停手写「## 待裁决」：
    ① 真书第二轮有检查不过，且你判断不了是 Gate 写错了还是汇编真有问题
    ② 要独立重算闭包，却发现只能照搬 orchestrate 的实现（说明规格描述不足以独立实现）
    ③ fixture r2 金标下有检查不过
    ④ 需要改 evaluate_genesis 或任何只读模块
    ⑤ 某条关系既推不出确定性依据、又确实是正确的（说明校准 4 的口径有漏洞）
