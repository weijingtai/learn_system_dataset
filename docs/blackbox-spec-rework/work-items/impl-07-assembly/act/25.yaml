act_id: impl-07/25
title: E 波 —— 独立增量 Gate evaluate_assembly，并接进增量路径（现状增量轮不过任何 Gate）
estimated_minutes: 180
group: INC-E
depends_on: [impl-07/24b]
supersedes: [impl-07/06]     # 检查清单逐字沿用该草稿，四处校准见第一节
decisions: [CHARTER §10.1, §13.1, §13.2, §14.1, §15（本 ACT 新立）]
scope:
  write:
    - pipeline/assembly/gate.py              # 新增 evaluate_assembly；既有 evaluate_genesis 与其检查函数不许改行为
    - pipeline/assembly/step.py              # 只许改增量路径：把 Gate 接进去
    - pipeline/assembly/tests/
  read_only:
    - var/ledgers/qianyuan_w8/
    - pipeline/assembly/matcher.py
    - pipeline/assembly/incremental.py
    - pipeline/assembly/apply.py
    - pipeline/assembly/orchestrate.py
    - pipeline/assembly/genesis.py
    - pipeline/assembly/canonical.py
    - pipeline/assembly/inputs.py
