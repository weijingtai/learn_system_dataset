on_fail: |
  停止并报告，不许提交红的基线。
  四种情况必须停手写「## 待裁决」：
    ① Omission / Addition 的可比口径拿不准（规格与 README 对不上）
    ② ed01r2 实跑结果与预期（retired / merged / carried）不符，且你判断不了是 fixture 造错还是汇编有问题
    ③ 要让新场景跑通必须改只读模块
    ④ 重建的 r2 金标与旧金标的差异超出 meta、包身份、关系格式这三类
