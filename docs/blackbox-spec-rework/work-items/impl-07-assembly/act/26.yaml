  cd /Users/jingtaiwei/Git/Public/learn_system && export LC_ALL=en_US.UTF-8
  .venv/bin/python -m unittest discover -s pipeline/assembly/tests -t . 2>&1 | tail -3     # OK；≥197 + 新增
  bash pipeline/corpus/_fixture/mini_release01/verify.sh; echo "exit=$?"                  # 0
  .venv/bin/python pipeline/corpus/_fixture/mini_release01/tools/build_fixture.py --check 2>&1 | tail -3
      # 重跑生成与盘上金标逐字节一致（若脚本无 --check，就重跑一遍再 git diff 证明无变化）
  git diff --stat 58b327f -- pipeline/assembly/matcher.py pipeline/assembly/incremental.py pipeline/assembly/apply.py pipeline/assembly/genesis.py pipeline/assembly/canonical.py pipeline/assembly/inputs.py
      # 必须无输出
  git status --short var/ pipeline/corpus/_fixture/mini_ed01/    # 无输出
  # 篡改探针（两条，完整仓库副本含 ocr/，R13）：
  #   P1 让 gate 的 identity_delta_contract 忽略 round_proposal_keys → test_identity_delta_reason_ref_must_be_in_round_proposal_keys 转红
  #   P2 把 ed01r2 的替换识别改按 stage_package_id → test_rework_ed01r2_identified_as_replacement 转红
