    test_r2_incremental_matches_rebuilt_gold_byte_for_byte      # 恢复逐字节判据
    test_collation_all_four_kinds_present
    test_not_comparable_units_have_no_collation_relation
    test_rework_ed01r2_identified_as_replacement                # 按 (source_id, edition_part_ids)
    test_rework_ed01r2_identity_delta_matches_gold              # retired + merged（+ split 若有）
    test_report_records_round_proposal_keys
    test_identity_delta_reason_ref_must_be_in_round_proposal_keys   # 回到草稿口径
