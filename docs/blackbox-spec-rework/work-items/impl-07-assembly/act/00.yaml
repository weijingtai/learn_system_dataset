act_id: impl-07/00
title: 规范 fixture mini_release01 输入：三份 ReviewedEdition 视图 + 三份人工决定 + 确定性构建器 + verify.sh
estimated_minutes: 90
group: F
depends_on: []   # 前置：README §4 D-10 选 A；D-04/D-07/D-12/D-18 已裁决
scope:
  write:
    - pipeline/corpus/_fixture/mini_release01/README.md
    - pipeline/corpus/_fixture/mini_release01/manifest.yaml
    - pipeline/corpus/_fixture/mini_release01/verify.sh
    - pipeline/corpus/_fixture/mini_release01/tools/build_fixture.py
    - pipeline/corpus/_fixture/mini_release01/editions/ed01.reviewed.json
    - pipeline/corpus/_fixture/mini_release01/editions/ed99.reviewed.json
    - pipeline/corpus/_fixture/mini_release01/editions/ed01r2.reviewed.json
    - pipeline/corpus/_fixture/mini_release01/decisions/r2.decisions.yaml
    - pipeline/corpus/_fixture/mini_release01/decisions/r2b.decisions.yaml
    - pipeline/corpus/_fixture/mini_release01/decisions/r3.decisions.yaml
tests_first:
  - 先写 verify.sh 与构建器的 --out 模式；在空目录运行 verify.sh 记录 Red（缺文件 FAIL），再补数据
contract: |
  总则
    构建器 tools/build_fixture.py 只用标准库 + yaml；不 import pipeline.*；不写时间戳、绝对路径、随机值；
      读取 pipeline/corpus/_fixture/mini_ed01/spans.yaml（缺失 → 打印 BLOCKED_HOST_MISSING 并退出 3，不建任何文件）
      用法：build_fixture.py --out <dir>；重放 diff -r --exclude=tools --exclude=README.md <dir> mini_release01 无输出
    视图文件是规范 JSON：json.dumps(obj, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n"，UTF-8
    全部视图顶层 synthetic: true；README 写明「合成数据，仅作 M7 结构验收宿主，不得作为知识、证据或发布来源」
    固定号构造（不得手敲，构建器按公式生成）：
      UUID 家族常量 = <前缀> + "0" * (32 - len(code)) + code，例如 sv_ 前缀、code "a1"
      规则哈希 H(X) = sha256(("fixture-rule-" + X).encode("utf-8")).hexdigest()，X ∈ {A, B, B2, D}
    work_key 由 source_id 正则 ^src_([a-z][a-z0-9]*)_ed([0-9]{2})$ 的第 1 组得出（D-18）；三份视图均为 sanche

  manifest.yaml 键序：fixture_id(mini_release01), synthetic(true), technique_id(qizheng), host_binding, ledger_constants, files
    host_binding: {mini_ed01_spans_path: pipeline/corpus/_fixture/mini_ed01/spans.yaml, mini_ed01_spans_sha256: ec6d77b90aa1408d040465babc28a81f59aadf6d6edd9ba8db66ff8ead0b44ef}
    ledger_constants（fixture_seed 灌入 Ledger 时使用的显式号；code 为 4 位）：
      ed01:   processing_run_id prun_/0701, step_run_id srun_/0701, configuration_revision_id rev_/07c1,
              knowledge_artifact_id art_/07a1, knowledge_revision_id rev_/07b1, stage_package_id pkg_m6_/07f1, package_revision_id rev_/07e1
      ed99:   同上，code 末位 1→9（0709、07c9、07a9、07b9、07f9、07e9）
      ed01r2: 同上，code 末位 1→2（0702、07c2、07a2、07b2、07f2、07e2）
      （pkg_m6_ 的 32hex 段同样按公式补零；所有常量须过 §8.1 正则）
    files: [{path, role, sha256}]，role ∈ view|decisions|expected，按 path 升序

  视图字段（README §5.1；键全部出现，列表按主键升序）
    ed01.reviewed.json：source_id src_sanche_ed01；technique_id qizheng；edition_part_ids [art_000000000000000000000000000000e1]；edition_complete false；unresolved_count 0
      collation_units: juan01.u001 T、juan01.u002 T、juan01.u003 T、juan01.u004 F、juan01.u006 T
      concepts: co_qizheng_900001「示例概念甲」、co_qizheng_900002「示例概念乙」（aliases []，content_status machine_extracted）
      patterns:
        pat_qizheng_900001 / candidate_key ed01.p1 / 示例格局甲 / aliases [格局甲别名] / co_qizheng_900001 / rules [{rule_key ed01.r1, ast_sha256 H(A)}] / assertion_ids [as_qizheng_900001, as_qizheng_900002]
        pat_qizheng_900002 / ed01.p2 / 示例格局乙 / [] / co_qizheng_900002 / [{ed01.r2, H(B)}] / [as_qizheng_900003, as_qizheng_900004]
      assertions（text 逐字等于 mini_ed01 对应 Span 的 text）:
        as_qizheng_900001 subject pat_qizheng_900001 juan01.u001 spans [ss_sanche_ed01_p0001_s02]
        as_qizheng_900002 subject pat_qizheng_900001 juan01.u002 spans [ss_sanche_ed01_p0001_s03]
        as_qizheng_900003 subject pat_qizheng_900002 juan01.u003 spans [ss_sanche_ed01_p0003_s01]
        as_qizheng_900004 subject pat_qizheng_900002 juan01.u006 spans [ss_sanche_ed01_p0001_s01]
      school_views:
        sv_/a1 sch_qizheng_001 subject pat_qizheng_900001 claim_refs [as_qizheng_900001] conflict_group_id cg_/c1 changes_current_judgment false source_refs [src_sanche_ed01]
        sv_/a2 sch_qizheng_002 subject pat_qizheng_900001 claim_refs [as_qizheng_900002] cg_/c1 true [src_sanche_ed01]
      rejected []；review_decisions []
    ed99.reviewed.json：source_id src_sanche_ed99；edition_part_ids [art_000000000000000000000000000000e9]；edition_complete false
      collation_units: u001 T、u002 T、u003 F、u004 T（均带 juan01. 前缀；不声明 u006）
      synthetic_spans: ss_sanche_ed99_p0001_s01..s06，text 见下方 assertions
      concepts: co_qizheng_900001、co_qizheng_900002（名称同 ed01）
      patterns（pattern_id 为 null 者须有 candidate_key）:
        c1: pat_qizheng_900001 / ed99.c1 / 示例格局甲 / [] / co_qizheng_900001 / [{ed99.r1, H(A)}] / [as_qizheng_900011, as_qizheng_900012]
        c2: null / ed99.c2 / 示例格局乙 / [] / co_qizheng_900002 / [{ed99.r2, H(B2)}] / [as_qizheng_900013]
        c3: null / ed99.c3 / 示例格局丙 / [] / co_qizheng_900001 / [{ed99.r3, H(A)}] / [as_qizheng_900015]
        c4: null / ed99.c4 / 示例格局丁 / [] / co_qizheng_900002 / [{ed99.r4, H(D)}] / [as_qizheng_900014]
        c5: null / ed99.c5 / 示例格局戊 / [] / co_qizheng_900002 / [{ed99.r5, H(B2)}] / [as_qizheng_900016]
      assertions（subject 写候选键 ed99.cN；span 依次 s01..s06）:
        as_qizheng_900011 ed99.c1 u001 text = ed01 as_qizheng_900001 的 text
        as_qizheng_900012 ed99.c1 u002 text = mini_ed01 ss_sanche_ed01_p0001_s04 的 text
        as_qizheng_900013 ed99.c2 u004 text「示例增文一句」
        as_qizheng_900014 ed99.c4 null text「示例格局丁之文」
        as_qizheng_900015 ed99.c3 null text「示例格局丙之文」
        as_qizheng_900016 ed99.c5 null text「示例格局戊之文」
      school_views: sv_/b1 sch_qizheng_001 subject ed99.c1 claim_refs [as_qizheng_900011] cg_/c2 false [src_sanche_ed99]
    ed01r2.reviewed.json：在 ed01 基础上只改四处
      as_qizheng_900002 的 spans 改为 [ss_sanche_ed01_p0001_s04]，text 同步为该 Span 的 text
      删除 as_qizheng_900004；pat_qizheng_900002.assertion_ids 改为 [as_qizheng_900003]；collation_units 删除 juan01.u006
      sv_/a2 的 changes_current_judgment 改为 false

  决定文件（YAML；键序 decisions → [select, choice, target_entity_ids, decision_type, note]）
    r2.decisions.yaml：
      - select {kind: merge, rule_id: R03b, source_id: src_sanche_ed99, candidate_key: ed99.c2}；choice attach；targets [pat_qizheng_900002]；decision_type null
      - select {kind: alias, rule_id: R03c, source_id: src_sanche_ed99, candidate_key: ed99.c3}；choice reject_alias；targets [pat_qizheng_900001]；null
      - select {kind: conflict, rule_id: R06, subject_entity_id: pat_qizheng_900001}；choice unify；targets [sv_/a1, sv_/a2, sv_/b1]；review_school_attribution
    r2b.decisions.yaml：
      - select {kind: alias, rule_id: R03c, source_id: src_sanche_ed99, candidate_key: ed99.c5}；choice reject_alias；targets [pat_qizheng_900002]；null
    r3.decisions.yaml：
      - select {kind: conflict, rule_id: R06, subject_entity_id: pat_qizheng_900001}；choice unify；targets [sv_/a1, sv_/a2, sv_/b1]；review_school_attribution

  verify.sh（set -u；export LC_ALL=en_US.UTF-8；FIXTURE_DIR 默认脚本目录；只用 .venv/bin/python + 标准库 + yaml；不 import pipeline.*）
    检查项（每项一行 PASS <名> / FAIL <名> <原因> / BLOCKED <名> <说明>）：
      manifest_sha256   files[] 每项 sha256 == 实际文件；目录内不存在 files[] 之外的数据文件（tools/、README.md、verify.sh、manifest.yaml 除外）
      host_binding      mini_ed01 spans.yaml sha256 == host_binding；ed01 与 ed01r2 每条 Assertion 的 text == 其 spans 文本以 "" 连接
      ids               视图、决定中每个号匹配 §8.1 对应家族正则（正则逐字抄写，不 import）；candidate_key 匹配 ^ed[0-9]{2}(r[0-9])?\.[a-z0-9]+$；collation_key 匹配 ^[a-z0-9]+\.[a-z0-9]+$
      views_wellformed  三份视图 synthetic true、unresolved_count 0、列表按主键升序、Assertion 主体与 SchoolView claim_refs 在视图内可解析
      no_images         目录内无 png/jpg/jpeg/pdf
      expected_present  expected/ 下 act/01 列出的 8 个文件齐全；本 ACT 阶段缺失 → BLOCKED expected_pending
    退出码：任一 FAIL → 1；无 FAIL 有 BLOCKED → 3；否则 0（末行 FIXTURE OK）；.venv 缺失 → BLOCKED_ENV 并 exit 3
tests:
  shell: |
    - 空 --out 目录重放：diff -r 无输出
    - verify.sh：manifest_sha256/host_binding/ids/views_wellformed/no_images PASS；expected_present BLOCKED；exit 3
    - 副本：改 ed01 as_qizheng_900001 text 一字 → FAIL host_binding，exit 1
    - 副本：把 as_qizheng_900011 改为 as_qizheng_90011 → FAIL ids，exit 1
    - 副本：放入 x.png → FAIL no_images，exit 1
verify:
  - .venv/bin/python pipeline/corpus/_fixture/mini_release01/tools/build_fixture.py --out /tmp/mr01 && diff -r --exclude=tools --exclude=README.md --exclude=expected /tmp/mr01 pipeline/corpus/_fixture/mini_release01   # 无输出
  - bash pipeline/corpus/_fixture/mini_release01/verify.sh; echo exit=$?   # 5 PASS + BLOCKED expected_present；exit=3
  - grep -rE '^\s*(import|from) pipeline' pipeline/corpus/_fixture/mini_release01 | wc -l   # 0
  - bash pipeline/corpus/_fixture/mini_ed01/verify.sh >/dev/null; echo $?   # 0 或 3（未被改动）
commit:
  add: [pipeline/corpus/_fixture/mini_release01]
  message: "fixture(m7): mini_release01 reviewed-edition views and scripted M7 decisions (synthetic, host-bound to mini_ed01)"
on_fail: 停止并报告；场景表有歧义、mini_ed01 Span 不存在或文本与预期不符 → 停手上报，不得改 mini_ed01、不得自行替换 Span
