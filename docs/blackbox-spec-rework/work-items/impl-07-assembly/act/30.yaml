    本分支允许存在「只因 fixture 仍为旧口径」而红的既有全栈用例，须在提交信息与回报里逐条列出。
    新增的两个测试文件必须全绿。合并与集成由主 Agent 在轨道 1 完成后做。
on_fail: |
  停手并通过 SendMessage 告诉主 Agent（同时写进回报文件的「## 待裁决」一节并推送）。必须停手的情况：
    ① §25 某条口径你读出两种意思，或与规格原文对不上
    ② 要实现某条检查，必须读引擎内部才知道怎么判（说明规格描述不足以独立实现）
    ③ 需要改 read_only 里的文件
    ④ 13 项检查的名字或顺序必须变
    ⑤ 既有用例红了，但原因不是「fixture 仍为旧口径」
