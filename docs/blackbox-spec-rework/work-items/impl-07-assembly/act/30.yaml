act_id: impl-07/30
title: I 波并行轨道 2 —— Gate 对勘检查与验收判据按 CHARTER §25 独立实现（另一台机器，独立分支）
estimated_minutes: 120
group: INC-I
depends_on: [impl-07/27]
parallel_with: [impl-07/29]        # 轨道 1：引擎 + fixture + 金标，在主机器上同时进行
decisions: [CHARTER §25（全文）, §26（本拆分）, §10.1, R15]
branch: m7/i-gate                  # 从 gitea 上的 m7/i-base 拉出（codex/docs/knowledge-compilation 在 gitea 上受保护）；只推 m7/i-gate
scope:
  write:
    - pipeline/assembly/gate.py                 # 只许改对勘相关：_asm_check_collation_comparable_only、
                                                #   _asm_has_pairing_basis、_asm_declared_presence、_asm_collation_contacts、
                                                #   _asm_closure 里对勘单元触点的来源；可新增私有辅助函数
    - pipeline/assembly/acceptance.py           # 只许改 check_edition_collation 及其私有辅助函数
    - pipeline/assembly/tests/test_gate_collation.py        # 新建
    - pipeline/assembly/tests/test_acceptance_collation.py  # 新建
