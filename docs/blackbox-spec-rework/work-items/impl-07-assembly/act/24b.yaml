contract: |
  一、§13.2 闭包健全性（orchestrate.py）
    1. 删掉 `rebuilt_entity_ids == closure["affected"]` 的等式断言。
    2. 新增闭包健全性检查：在调用 `apply` **之前**，从本轮交给 `apply` 的裁定（resolutions）里
       **独立推出**「本轮将要改动的对象集」，断言它 ⊆ `closure["affected"]`；
       不满足 → `AssemblyRefused`，message 含「闭包不完整」，并列出漏掉的对象 id（升序）。
       硬性：推导**不许调用或复刻 `apply` 的私有函数**，只能从裁定本身（subject / targets / auto_choice
       / 人工决定）读出要动哪些对象。推不出来时**停手上报**，不要猜。
    3. 保留 `rebuilt ⊆ affected` 检查（廉价健全检查）。
    4. 保留 ACT 24 新增的监视护栏（传给 `_restore_untouched` 的 affected 必须是闭包集合、不是 None）。
    5. 扩张到但未被改动的对象：交给 `apply` 原样拷贝，不做任何额外处理。

  二、§13.3 R04 按概念分组（incremental.py，只改 R04）
    1. 先把 `new_concept_candidates + concept_mentions` **按主体键分组**，每组只出一条提案。
    2. 组内聚合：`aliases` 取并集（排序）；规则哈希取并集（排序）；
       名称必须一致——同一 `concept_id` 下出现不同名称 → `AssemblyRefused`，
       message 含「概念名称冲突」及冲突的 concept_id 与各名称（排序），**不许静默挑一个**。
    3. `basis_sha256` 按组聚合后的内容计算（仍用 `_concept_basis` 的字段口径）。
    4. 组内若同时有「已存在于基底」「同名歧义」「全新」三种分支判定不一致 → 停手上报。
    5. **不许**在 orchestrate 或别处做按 `proposal_key` 的通用去重；
       `ID_002` 唯一性检查对其余规则**原样保留**。
    6. 只改 R04。R01–R03、R06–R11b 一字不动；`propose_pairs` 与 `matcher.py` 一字不动。

  三、不许做的事
    - 不许改 `apply.py`（冻结）
    - 不许改 R04 以外的任何规则
    - 不许加通用去重
    - 不许调用模型、不许用相似度
    - 不许写 `var/` 真书正本；不许改 `mini_ed01`
    - 不许让 `upstream_m6_real` / `no_model_calls` 转红
