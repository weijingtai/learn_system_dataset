background: |
  **先读这三份，顺序不要颠倒**：
  1. `impl-07-assembly/CHARTER-INCREMENTAL.md` **全文**（派发依据），
     尤其 §3.1（配对层硬约束）、§8（F 波后四条裁定）、§9（A 波后四条裁定）
  2. `impl-07-assembly/act/03.yaml` 的 **R01–R10 规则表**（第 26–48 行）——
     本 ACT **逐字沿用该规则表**，不重抄、不改写；该草稿其余部分按 CHARTER §5 校准后作废
  3. `impl-07-assembly/act/21.yaml`（A 波，已验收 `8162585`）

  主 Agent 2026-09-22 实测（可复算）：

  - A 波已落地：`inputs.py:18 BASE_SNAPSHOT_ARTIFACT_TYPE = "canonical_snapshot"`、
    `inputs.py:302 resolve_base_snapshot(...)`；`run_m7` 不再拒绝 base_snapshot
  - `genesis.py:27 propose_genesis(candidate_set, reviewed_edition)` 是**创世专用纯函数**，
    本波**不得改它**，增量提案要另起 `incremental.py`
  - `assembly` 套件当前 **126 用例全绿**；`m7-assembler.sh` `pass=11 fail=0 blocked=5`，
    其中 `upstream_m6_real` 与 `no_model_calls` **已是 PASS，不许转红**
  - 真书实测（CHARTER §8.2）：`candidate_set` **无 `collation_units` 键**，
    26 条断言的 `collation_key` **全为 `null`**
contract: |
  一、提案生成（incremental.py，新建）
    按 `act/03.yaml` 第 26–48 行的 **R01–R10 规则表逐字实现**，产出四类提案
    Merge / Alias / Conflict / EvidenceRelation，三态 `auto` / `human` / `blocked`。
    硬性：
      - `rule_id` **逐字**取规则表里的名字（`R01` `R01b` `R02` `R03a`…`R11b`），不许自造
      - 提案键按 D-12：`proposal_key = "<kind>:" + sha256(规范 JSON(主体元组))[:32]`，
        kind ∈ `merge|alias|conflict|evidence`；**不发任何登记 ID 前缀**
      - D-05：`MergeProposal.relation` 闭集 `{attach, admit_new, merge_entities}`，
        **禁止静默并入**——任何并入都必须有一条提案留痕
      - D-06：**名称相等不得自动 attach**（保留同名异义）
      - 同一输入两次调用，提案集合**逐字节相同**（含排序）

  二、propose_pairs 独立配对层（matcher.py，新建；CHARTER §3.1 硬约束）
    签名**固定**：`propose_pairs(left_units, right_units) -> list[PairCandidate]`
    硬性四条，**不可协商**：
      1. 本波**只允许确定性实现**：精确键相等、共享证据片段、同一已正式对象。
         **禁止**模糊文本相似度、编辑距离、任何阈值可调的打分
      2. **不得调用任何模型 API**（规格 §2.10；`m7-assembler.sh` 的 `no_model_calls` 会验）
      3. `matcher.py` **之外的任何代码不得直接做配对判断**——
         `incremental.py` 只能调用 `propose_pairs`，不得自己比对
      4. `PairCandidate` 须预留 `suggestion` 字段（本波恒为 `None`）。
         将来接入模型建议只换 `matcher.py` 这一个文件，且 `suggestion`
         **不得进入 Gate 判定、不得影响 ID 发号、不得改变自动裁定结果**

  三、collation_key 为 null 的处置（CHARTER §8.2）
    真书路径上 `collation_key` 全为 `null`、`collation_units` 键不存在。
    硬性：
      - 此时 `propose_pairs` 必须**如实返回「无法配对」**，**不许猜、不许回退到文本比对**
      - 在 `assembly_report` 里计数（例如 `not_comparable_missing_collation_key`），
        **不得静默跳过**
      - R07/R07b/R08/R09 这几条对勘规则在该输入下**不产生提案**，这是正确行为

  四、id_allocation 只按已获批对象取号（CHARTER §8.1）
    硬性：
      - `id_allocation` 的最大号**只从进入 Snapshot 的已获批对象**取
      - 遇到「携带 M4 自发 `pat_` 号但未获批」的候选，必须写入 `assembly_report`
        （键名 `unapproved_with_self_issued_id`），**不得静默丢弃**
      - 现状两处口径打架（Snapshot 丢掉它、`id_allocation` 又算上它）的根因就是静默，
        本波必须消除

  五、名实一致收口（CHARTER §9.3，**本波最重要的一条**）
    A 波留下一处中间态：`snapshot.prev_revision_id` 有基底，而
    `knowledge.meta.base_snapshot_revision_id` 为 `null`——**名实不符**。
    本波必须收口：
      1. 接线合并时同时补 `meta.base_snapshot_revision_id` / `assembly_seq` / `decision_refs`
      2. **必写护栏用例** `test_prev_revision_and_meta_base_agree`：
         断言「`prev_revision_id` 非空 **⟺** `meta.base_snapshot_revision_id` 非空」，
         两者不一致即失败。**这条是本线最重要的名实一致护栏**
      3. 篡改探针须证明该护栏非空转（见 verify 段 P3）

  六、重建 r1 金标（CHARTER §8.4）
    接线真实包身份后，F 波留下的 r1 金标里的占位值
    （`pkg_m6_0000…` / `rev_0000…`）**必须重建**。
    硬性：回报中贴出**新旧 sha256 对照**与重建命令；不得让占位值留在金标里冒充真值。

  七、不许做的事
    - 不许改 `genesis.py` / `canonical.py` / `gate.py` / `inputs.py`
    - 不许改 `model.py` 的既有定义（只许新增增量所需类型）
    - 不许调用模型 API、不许做模糊相似度匹配
    - 不许写 `var/` 真书正本
    - 不许让 `upstream_m6_real` / `no_model_calls` 转红或转 BLOCKED
    - 不许改 `mini_ed01`
