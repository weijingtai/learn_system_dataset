  - export LC_ALL=en_US.UTF-8; .venv/bin/python -m unittest discover -s pipeline/assembly/tests -t . 2>&1 | grep -E "^(Ran|OK|FAILED)"   # OK，用例数 ≥ 107（96 + 11 新增具名用例）
  - export LC_ALL=en_US.UTF-8; .venv/bin/python -m unittest discover -s pipeline/review/tests -t . 2>&1 | grep -E "^(Ran|OK|FAILED)"    # OK，166 不得减少
  - export LC_ALL=en_US.UTF-8; .venv/bin/python -m unittest discover -s pipeline/dataset_compiler/tests -t . 2>&1 | grep -E "^(Ran|OK|FAILED)"  # OK，162 不得减少
  - export LC_ALL=en_US.UTF-8; bash openspec/acceptance/m7-assembler.sh; echo exit=$?   # pass 不得下降；判定变化必须在回报中说明
  - python3 docs/blackbox-spec-rework/work-items/impl-00-interfaces/check_interfaces.py | tail -1   # pass=44 fail=0
