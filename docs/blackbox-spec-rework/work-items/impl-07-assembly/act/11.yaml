on_fail: |
  停止并写「## 待裁决」，不要猜。以下情形一律停手上报：
  - candidate_set 里根本没有 evidence_level 字段，或其取值不在闭集内
  - 各 evidence_links 的 corpus_spans_revision_id 出现两个及以上不同值
  - M6 链与 M4 候选两路证据区间不相等（说明 106 D1 的修复没有覆盖到某条路径）
  - 需要修改 scope 之外的文件
  - 既有用例因本次改动转红且你认为该用例本身有问题
discipline:
  - 提交前必须全套绿。因待裁决事项导致既有用例红时，**不得提交**，保持工作树未提交并写「## 待裁决」（第 108 条纪律）
  - 回报只写真实跑过的命令与输出；没跑的写「未跑」。禁止用「将/应当/会」陈述验证结果（第 93 条）
  - 不得修改 pipeline/corpus/_fixture/qianyuan_ed01_text/expected/ 下任何文件（第 95、101 条）
  - 不得写 var/ledgers/（持久 Ledger）
