act_id: impl-07/06
title: 独立 Gate evaluate_assembly（不 import matcher/apply/incremental，自行重算闭包、对勘与身份账目）
estimated_minutes: 90
group: J2
depends_on: [impl-07/05]
scope:
  write: [pipeline/assembly/gate.py, pipeline/assembly/tests/test_gate.py]
tests_first:
  - 先写 tests/test_gate.py（用例名逐字）并全红，再实现
contract: |
  gate.py（纯函数；只允许 import canonical、model、pipeline.ledger.ids、pipeline.ledger.states、标准库；禁止 import matcher、apply、incremental）
    evaluate_assembly(*, base_knowledge, views, decisions, knowledge, identity_delta, collation, report) -> dict
      返回 {"passed": bool, "checks": {名: {"passed": bool, "detail": str}}}；检查名与顺序固定：
      schema_and_ids           model.validate_snapshot_knowledge 通过；全部 proposal_key/relation_key 的 ids.kind_of 为 None
      identity_preserved       base 每个活对象号：仍为活对象，或是 identity_delta 某条的 from_entity_id；新 knowledge 中不存在 base retired 的号
      allocation_monotonic     新发 pat_ 号（knowledge 活对象 − base 活对象 − 视图自带号）全部 > base id_allocation；id_allocation ≥ 活对象与 retired 最大号
      provenance_complete      每个视图对象都在 knowledge 某对象的 provenance（Pattern/Concept）或作为活 Assertion/SchoolView 出现，除非其号在 identity_delta retired/merged 中
      view_objects_unaltered   provenance.content_sha256 == canonical.content_sha256(视图对象)；Assertion.text_sha256 == sha256(NFC 视图 text)
      untouched_byte_identical 自行重算闭包（独立实现 README §6.2 第 1–3 条）；闭包外 base 对象在 knowledge 中规范 JSON 字节不变
      affected_scope_exact     report.affected_entity_ids == 自算闭包 == report.rebuilt_entity_ids
      collation_comparable_only 自行从视图与 base 重算可比单元；knowledge 中 omission/addition 只出现在两侧均声明的单元；not_comparable 单元无任何对勘关系
      no_silent_fold           base 与视图中的每个 SchoolView 在 knowledge 中仍存在（或号在 delta 中）；base 冲突组成员不减少
      first_layer_display      每组 first_layer_display == 任一成员 changes_current_judgment
      identity_delta_contract  change_type ∈ {migrated, merged, split, retired}；entity_kind ∈ {pattern, concept, assertion}；reason_ref.kind == "proposal" 且 proposal_key 出现在 report 轮次提案中；
                               merged 的 to 为 1 个活对象；split 的 to ≥ 2 个活对象且 span_allocation 覆盖旧 Span、互不相交；retired 的 to 为空
      maturity_not_synthesized Pattern/Concept 顶层无 content_status；provenance 与 assertions 的 content_status 等于视图原值
      decisions_consistent     每条决定的 proposal_key 唯一；human 提案 resolution 在 knowledge 中 mode 为 human 当且仅当有决定
    说明：gate 不信任 report 除 affected/rebuilt/轮次提案外的任何字段；闭包与可比单元必须独立重算
tests:
  test_gate.py: |
    - test_s1_all_checks_pass
    - test_s2_all_checks_pass
    - test_s3_all_checks_pass
    - test_gate_does_not_import_assembly_logic（ast 解析 gate.py 的 import，不含 matcher/apply/incremental）
    篡改矩阵（每例断言指定检查 passed False 且 passed 总体 False）：
    - test_tamper_drop_base_entity_without_delta → identity_preserved
    - test_tamper_revive_retired_id → identity_preserved
    - test_tamper_new_id_not_above_allocation → allocation_monotonic
    - test_tamper_drop_view_school_view → no_silent_fold
    - test_tamper_provenance_hash → view_objects_unaltered
    - test_tamper_assertion_text_sha → view_objects_unaltered
    - test_tamper_untouched_entity_bytes → untouched_byte_identical
    - test_tamper_report_affected_missing_one → affected_scope_exact
    - test_tamper_report_affected_extra_one → affected_scope_exact
    - test_tamper_omission_on_undeclared_unit → collation_comparable_only
    - test_tamper_first_layer_display_false → first_layer_display
    - test_tamper_delta_bad_change_type → identity_delta_contract
    - test_tamper_delta_unresolvable_reason_ref → identity_delta_contract
    - test_tamper_split_without_allocation → identity_delta_contract
    - test_tamper_synthesized_pattern_status → maturity_not_synthesized
    - test_tamper_human_mode_without_decision → decisions_consistent
    - test_tamper_relation_key_looks_like_registered_id → schema_and_ids
verify:
  - .venv/bin/python -m unittest discover -s pipeline/assembly/tests -t . 2>&1 | tail -3   # OK，用例数 ≥ 80
  - grep -nE '^\s*(from|import) .*(matcher|apply|incremental)' pipeline/assembly/gate.py | wc -l   # 0
  - TDD §3 回归
commit:
  add: [pipeline/assembly/gate.py, pipeline/assembly/tests/test_gate.py]
  message: "feat(m7): independent assembly gate re-deriving closure, comparability and identity accounting"
on_fail: 停止并报告；金标输入下任一检查不通过时报告检查名与明细，不得放宽检查或改金标
