on_fail: |
  停止并报告，不许提交红的基线。
  七种情况必须停手写「## 待裁决」：
    ① `propose_incremental` 签名缺 `round_no` 或与草稿假定不符（**不要改 B 波签名**）
    ② `incremental=True` 与 `incremental=False` 结果不等价，且你判断不了是闭包漏了还是 apply 有副作用
    ③ `rebuilt_entity_ids != affected` 且你认为断言本身写错了
    ④ 真书作第二轮时 `affected` 覆盖了几乎全部对象（说明闭包过宽，先报不要调）
    ⑤ 需要改 `apply.py` / `incremental.py` / `matcher.py` 才能完成
    ⑥ `upstream_m6_real` / `no_model_calls` 任一转红或转 BLOCKED
    ⑦ 重建金标后 F/B/C 波的某条用例转红
