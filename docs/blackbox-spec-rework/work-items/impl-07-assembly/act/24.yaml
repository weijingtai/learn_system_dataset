background: |
  **先读**：`CHARTER-INCREMENTAL.md` 全文（尤其 §3.1、§8、§9、§10、§11），
  再读 `act/05.yaml` **第 18–40 行的规格细节**——本 ACT **逐字沿用**那份规格
  （`affected_closure` 的触点与闭包规则、`carry_forward` 的 carried/needs_review 判定、
   `assemble` 的回流轮次与 `report` 键序、`knowledge_equivalent`），不重抄、不改写。

  主 Agent 2026-09-22 实测：
  - C 波已落地 `apply.py`（`apply_resolutions` 在 :204、`validate_decision` 在 :118）
  - B 波公开入口是 **`incremental.propose_incremental(base_knowledge, views, *, decisions=…)`**（:236），
    `matcher.py` 只有配对层（`propose_pairs` :137、`units_of_view` :73、`unpairable_units` :119）
  - `assembly` **151 用例全绿**；`m7-assembler.sh` `pass=11 fail=0 blocked=5`，
    `upstream_m6_real` 与 `no_model_calls` **PASS**
contract: |
  一、§12 裁定（主 Agent 2026-09-22，两处校准 act/05 草稿）

    **校准 1 —— 提案入口名**：草稿写 `p = matcher.propose(base, views, decisions=…, round_no=…)`，
    但 B 波实际把提案生成放在 `incremental.py`、`matcher.py` 只放配对层。
    **裁定：调用 `incremental.propose_incremental(...)`**，不得为了迁就草稿字面而
    在 `matcher.py` 里新增 `propose`——那会破坏 CHARTER §3.1 的配对层隔离。
    若 `propose_incremental` 的签名缺 `round_no`，**停手写「## 待裁决」**，
    不要自行改 B 波的签名（`incremental.py` 是只读）。

    **校准 2 —— 名实一致（CHARTER §9.3）不得破坏**：
    本波接线 `run_m7` 后，产物仍须满足
    「`prev_revision_id` 非空 ⟺ `meta.base_snapshot_revision_id` 非空」。
    既有护栏 `test_prev_revision_and_meta_base_agree` **不许改、不许跳过**。

  二、增量编排主体（orchestrate.py，新建）
    按 `act/05.yaml:18-40` 逐字实现三个函数：
      - `affected_closure(...)` —— 触点 + 沿 `alias_of` / `distinct_from` / `merged_into`
        两端与 `conflict_groups` 同组成员**迭代到不动点**；
        返回 `{"affected", "created", "untouched"}`（各按升序）
      - `carry_forward(base_knowledge, views, proposals)` ——
        base 中 mode 为 human 的 resolution，本轮同键提案 resolution 为 human 且 basis 不同
        → `needs_review`；否则 `carried`
      - `assemble(base_knowledge, views, decisions, *, max_rounds=10, incremental=True)` ——
        回流轮次；有待决 → `awaiting_human`；超 `max_rounds` → `AssemblyRefused`（message 含「回流未收敛」）
    硬性：
      - `report` 键序**逐字**按草稿（`affected_entity_ids` … `not_comparable_count`）
      - `incremental=True` 时**必须断言** `r["rebuilt_entity_ids"] == closure["affected"]`，
        不等即 `AssemblyRefused`（message 含「重建范围」）——**这条是增量正确性的核心**
      - `incremental=False` 时 `affected=None`，全部重建

  三、替换继承（D-14）
    以 `(source_id, edition_part_ids 集合相等)` 识别替换，**不以 `stage_package_id` 识别**。
    provenance 哈希未变的对象不再产生 merge/alias/conflict 提案（沿用 Snapshot 结果）；
    变化或新增照常；被删除的 Assertion → `R11` retire auto；
    Pattern/Concept 失去全部 provenance → `R11b` human。

  四、人审回流只重算受影响提案（D-16 后半）
    人工决定被 Ledger 接受后**即时落一个 Checkpoint**（D-16 A 的人工半边，A 波只做了非人工半边）。
    恢复后回流**只重算受影响提案**，不得整批重算。

  五、增量必须等于全量（本波须自证，E 波会独立复验）
    同一组输入分别以 `incremental=True` 与 `incremental=False` 跑，
    `knowledge_equivalent(a, b)` 必须为 `True`（即 `content_sha256` 相等）。
    **这条是 M7 增量汇编的根本正确性判据**，本波必须有用例覆盖。

  六、不许做的事
    - 不许改 `matcher.py` / `incremental.py` / `apply.py` / `genesis.py` / `canonical.py` / `gate.py` / `inputs.py`
    - 不许改 `model.py` 既有定义（只许新增）
    - 不许在 `matcher.py` / `incremental.py` 引入 `difflib`（B 波护栏）
    - 不许调用模型 API；不许用相似度决定配对
    - 不许写 `var/` 真书正本；不许改 `mini_ed01`
    - 不许让 `upstream_m6_real` / `no_model_calls` 转红或转 BLOCKED
