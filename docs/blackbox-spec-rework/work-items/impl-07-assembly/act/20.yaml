on_fail: |
  停止并报告，不许提交红的基线。
  六种情况必须停手写「## 待裁决」而不是自行决定：
    ① 真实 m6 产物缺少 fixture 假定的字段，且你判断不了该改 fixture 还是该补 M4/M6 接口
    ② D-18 Work 标识没有明确推荐，或推荐自相矛盾
    ③ 需要改 `genesis.py` / `model.py` / `canonical.py`（G0 已验收）才能完成
    ④ 需要改 `mini_ed01` 或写 `var/` 真书正本
    ⑤ `upstream_m6_real` 或 `no_model_calls` 任一从 PASS 转红/转 BLOCKED
    ⑥ 两个版次的金标产物无法由脚本确定性生成（说明形状设计有问题）
