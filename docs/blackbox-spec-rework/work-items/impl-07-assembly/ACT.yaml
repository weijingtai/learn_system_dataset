package: blackbox-impl-07-assembly
title: 首切片：M7 创世汇编（W5-L0）——空基底 + 单个 ReviewedEditionPackage → CanonicalKnowledgeSnapshot 修订（§6.2、§15）
status: READY_FOR_REVIEW（创世薄切片）   # W5-L0 定稿 2026-09-13，依 G7-RULINGS §1 P1–P9、§5 impl-07、§9.12 第 61 条；未经实现；派发前置见 preconditions
executor_groups:
  G0: [impl-07/G0-01, impl-07/G0-02, impl-07/G0-03, impl-07/G0-04, impl-07/G0-05, impl-07/G0-06]   # 串行；每个 ACT ACCEPTED 后派下一个
preconditions:
  - impl-01 Artifact Ledger 状态 ACCEPTED（已满足）；G0 只经 Ledger 公开方法与只读查询读写（§17:836）
  - P2/impl-00 闭集：本切片不新增 artifact_type 名（使用 INTERFACES.md §4 M7 行已登记的 canonical_snapshot、assembly_package）。开工前提为 `python3 docs/blackbox-spec-rework/work-items/impl-00-interfaces/check_interfaces.py` 末行 `fail=0` 且 exit 0（第 54 条，不写死 pass 总数）。建议（不阻塞实现）由该波 impl-00 登记 ACT 把 §4 M7 行状态由「纵切后」更新为「创世薄切片（W5-L0）」并登记内容草案
  - 上游只认 succeeded（P5）：解析 m6 StagePackage 及其血缘 candidate_package 时，其所属 StepRun 必须 succeeded（INTERFACES.md:24【I-13】）
  - M6 未实现（impl-06 status READY_FOR_REVIEW，且已按第 61 条删除 Snapshot 直通 ACT 10）：G0-04/G0-05 用包内非生产 fixture_seed.py + tests/data/ 的合成 ReviewedEditionPackage 灌入临时 Ledger（标 synthetic: true，§9.7 第 52 条口径）；真实 M6 输出存在时优先，否则 m7-assembler.sh 保留 BLOCKED upstream_m6_real
  - P7：不伪造人工决定；本切片无人工回路，合成输入不得计为真实 expert_verified 或任何发布依据
  - P3：内容结构以代码草案表达 schema_version "0.1.0-draft"；不向 openspec/schemas/ 新增文件
  - 写范围零交集：G0 只写 pipeline/assembly/** 与 openspec/acceptance/m7-assembler.sh；不写 run_all.sh、pipeline/ledger/**、pipeline/review/**、pipeline/dataset_compiler/**、pipeline/orchestrator/**、fixture、规格、Schema、台账
