global_rules:
  - 每个 ACT 先写具名测试（Red 原文入报告）再实现；unittest；测试只用 tempfile 目录，不写 var/ 与任何 fixture
  - 只用标准库 + PyYAML + jsonschema；不新增依赖；不新增 ID 前缀；不调用模型 API；不做模糊文本相似度
  - 生产代码只读 Ledger 冻结修订；fixture_seed.py 与 acceptance.py 是唯二可读 tests/data 的非测试模块，且只经参数
  - 同阶段后续运行一律经 supersede_step_run 接替该阶段最近一个 succeeded 运行（经读接口查出，不写死号，第 58 条）
  - 第 64 条：pattern 补发只从本 Run 配置修订登记的 id_range 确定性取号（跳过已占用值），保留 M4 已发 pat_，不新增前缀（P8）；号段与补发清单写入 Snapshot 修订（knowledge.id_range / knowledge.allocated_pattern_ids）
  - 第 66 条：合成输入的人工决定须含 synthetic_fixture: true 且不计 expert_verified；「消费真实 M6 产出」验收项在 impl-06 实现并验收前判 BLOCKED
  - 第 65 条：M4/M6 内容缺口（concepts[]/patterns[].concept_id/rules[]）登记为接口需求（README §0.7），不在 M7 内补造内容
  - 不改任何 m6 StagePackage / reviewed_edition 修订的状态；不读其他 ReleaseRun 的人工决定（§6.2:173、:175）
  - M7 不发 ent_ / rel_；不合成或升级 content_status（§8.2:440）；关系端点与 SchoolView 主体一律改写为正式号
  - 中文注释与 docstring；公开函数名、参数名、返回键、检查名、rule_id 与 ACT contract 逐字一致
  - 每个 ACT 一个提交；只 git add contract 列出的路径；不得 git add -A / git add .
  - 执行者不写 SUBAGENT_TODO.md、HANDOFF.md、PLAN.md、G7-*.md，不得自记 ACCEPTED
gates:
  - bash docs/blackbox-spec-rework/verify-T.sh | tail -1                          # FAIL 合计: 0
  - bash openspec/schemas/verify.sh >/dev/null; echo $?                           # 0
  - python3 docs/blackbox-spec-rework/work-items/impl-00-interfaces/check_interfaces.py; echo exit=$?   # 末行 fail=0 且 exit 0（第 54 条）
  - bash pipeline/corpus/_fixture/mini_ed01/verify.sh >/dev/null; echo $?         # 0 或 3
  - bash openspec/acceptance/m3-coverage.sh | tail -1                             # == 开工基线（本切片不改 M3）
  - .venv/bin/python -m unittest discover -s pipeline/ledger/tests -t . 2>&1 | grep -E "^(Ran|OK|FAILED)"      # OK，与基线相同
  - .venv/bin/python -m unittest discover -s pipeline/assembly/tests -t . 2>&1 | grep -E "^(Ran|OK|FAILED)"    # OK（G0-01 起）
  - export LC_ALL=en_US.UTF-8; bash openspec/acceptance/m7-assembler.sh; echo exit=$?                          # G0-06 起：SUMMARY pass=11 fail=0 blocked=5；exit=2
  - export LC_ALL=en_US.UTF-8; bash openspec/acceptance/run_all.sh | tail -1      # SUMMARY pass=2 fail=1 blocked=8（本切片不改 run_all.sh）
  - git diff --check
