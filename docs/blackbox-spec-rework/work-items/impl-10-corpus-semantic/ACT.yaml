global_rules:
  - 组间纪律：各执行组（L1 → L2 → L3 → L4）必须严格串行；每组全部完成立即停手，提交主 Agent 独立验收；验收通过后方可放行下一组。
  - 先红后绿（TDD）：每个 ACT 必须先写测试，运行取得真实 Red 原文记录入回报，再编写实现代码，绝不允许先写实现后补测试。
  - 单元测试与环境：测试一律使用标准库 unittest 与 tempfile 临时目录，严禁向生产目录或任何 fixture 目录写入临时文件。
  - 零模型调用与零网络（P6）：不引入任何模型库与网络库；LiveProposer 必须为默认禁用的桩；测试与验收一律使用手写回放录制（标 synthetic: true）。
  - 不新增 ID 前缀（P8）：只允许使用已登记的 ss_（含偏移形态）与 sem_（含偏移形态），严禁自创未登记前缀。
  - 单一权威契约（第 85、86 条）：M2 产出形态以 impl-09 README §4 为唯一权威出处，本包一律引用，不得复述第二份形态说明。
  - 护栏不得空转（第 88 条）：凡 contract 列明「不得...」的负向约束，必须配有能真检出违规的具名用例，并在 tests 中写明检测机制。
  - 单一提交与范围纪律：每个 ACT 一个独立提交；git add 严格限定在该 ACT 的 scope.write 路径；严禁使用 git add -A 或 git add .。
  - run_all.sh 不动（P4）：本包严禁修改 openspec/acceptance/run_all.sh，验收脚本在宿主缺失时如实 exit 2（BLOCKED）。
gates:
  - python3 docs/blackbox-spec-rework/work-items/impl-00-interfaces/check_interfaces.py | tail -1   # fail=0
  - bash openspec/acceptance/run_all.sh | tail -1                                                 # SUMMARY pass=2 fail=1 blocked=8
  - bash openspec/schemas/verify.sh >/dev/null; echo $?                                          # 0
  - .venv/bin/python -m unittest discover -s pipeline/ledger/tests -t .                          # OK
  - .venv/bin/python -m unittest discover -s pipeline/corpus_compiler/tests -t .                 # OK
  - git diff --check
on_fail: 停止并报告；遇契约冲突、两种理解、需改范围外文件、发现需新增 ID 前缀 → 一律写「## 待裁决」+ 原始输出停手。
