act_id: impl-10/03
title: M3 电子文本结构 Gate 判定与 StagePackage 组装
estimated_minutes: 75
group: L2
depends_on: [impl-10/02]
scope:
  write:
    - pipeline/corpus_compiler/gate_offset.py
    - pipeline/corpus_compiler/assemble_offset.py
    - pipeline/corpus_compiler/tests/test_gate_offset.py
tests_first:
  - 先写 tests/test_gate_offset.py（具名用例逐字），全红，记录真实 Red 原文；再实现 gate_offset.py 与 assemble_offset.py
contract: |
  1. 模块 pipeline/corpus_compiler/gate_offset.py（独立纯函数；不访问 Ledger、零网络）：
     - 严禁 import pipeline.corpus_compiler.text_compiler、step_offset 或 assemble_offset（防同错同过）；
     - evaluate_text_coverage(*, raw_text: str, cleaned_text: str, patches: list[dict], spans_doc: dict) -> dict
       返回：{"passed": bool, "checks": {name: {"ok": bool, "detail": str}}}
       六项检查（名称与顺序固定）：
       (1) text_contiguous_coverage：片段首尾相连、无缺口、无重叠，各片段文本拼接后 100% 等于 cleaned_text
       (2) text_strict_offset：每条 Span 的 cleaned_text[start:end] == span.text，且 quote_sha256 == sha256(span.text)
       (3) raw_anchor_fidelity：通过 patches 校验 (raw_start, raw_end) 换算后等于 (start_offset, end_offset)
       (4) identity_and_stability：span_id 严格符合 ss_<work>_<edition>_o<NNNNNNN>，序号单调递增，ID 全局唯一
       (5) evidence_level_honest：每条 Span 及顶层 evidence_level 严格为 "offset_level"
       (6) header_counts：文档顶层 span_count 与 spans 列表长度严格一致
     - 判定规则：六项检查全部 ok 时 passed 才为 True，否则 passed 为 False。

  2. 模块 pipeline/corpus_compiler/assemble_offset.py：
     - assemble_m3_text_stage_package(*, edition_part_id: str, spans_revision_id: str,
                                     spans_bytes: bytes, spans_doc: dict,
                                     validation_report_revision_id: str,
                                     coverage_report_revision_id: str,
                                     step_run_id: str, transformations: list) -> dict
     - 组装符合 openspec/schemas/stage_package.schema.json 的 StagePackage：
       - stage: "m3"
       - gate_profile: "structural_only"
       - payload 包含：spans_revision_id, coverage_report_revision_id, coverage, gate_profile, evidence_level("offset_level")
       - manifest 包含：counts({"spans": len(spans)}), content_sha256(sha256(spans_bytes))
       - validation 包含：passed(True), report_artifacts([validation_report_revision_id])
       - lineage 包含 transformations 列表。

  3. 护栏约束（第 88 条）：
     - Gate 模块必须完全独立，不得引入任何编译生成器代码；
     - 任何切片偏移漂移、文本篡改或哈希不符必须准确判 FAIL。
tests:
  test_gate_offset.py: |
    - test_evaluate_text_coverage_golden_all_pass
    - test_gate_offset_does_not_import_compiler_modules（第 88 条护栏用例：通过 AST 解析断言 gate_offset.py 未 import text_compiler 或 step_offset，防止同错同过）
    - test_drop_span_fails_contiguous_coverage
    - test_overlap_spans_fails_contiguous_coverage
    - test_tampered_quote_fails_strict_offset_check
    - test_tampered_quote_hash_fails_strict_offset_check
    - test_tampered_patch_mapping_fails_raw_anchor_fidelity
    - test_raw_start_mismatch_fails_raw_anchor_fidelity
    - test_duplicate_span_id_fails_identity_and_stability
    - test_invalid_span_id_format_fails_identity_and_stability
    - test_upgraded_glyphbox_fails_evidence_level_honest（若伪造为 glyphbox_level 必判 FAIL）
    - test_span_count_mismatch_fails_header_counts
    - test_assemble_m3_text_stage_package_conforms_to_schema
    - test_assemble_m3_text_stage_package_payload_keys
    - test_assemble_m3_text_stage_package_manifest_sha256
    - test_assemble_m3_text_stage_package_lineage
verify:
  - .venv/bin/python -m unittest discover -s pipeline/corpus_compiler/tests -t . 2>&1 | grep -E '^(Ran|OK|FAILED)'   # OK，≥ 136（累计 120 + 16）
  - grep -rn 'import.*text_compiler' pipeline/corpus_compiler/gate_offset.py | wc -l   # 0
  - git diff --check
commit:
  add: [pipeline/corpus_compiler/gate_offset.py, pipeline/corpus_compiler/assemble_offset.py, pipeline/corpus_compiler/tests/test_gate_offset.py]
  message: "feat(corpus_compiler): electronic text coverage gate and M3 StagePackage assembly (rulings 76, 78)"
on_fail: 停止并报告；遇 Gate 误判或 Schema 校验失败停手
