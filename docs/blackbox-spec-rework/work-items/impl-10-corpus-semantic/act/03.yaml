act_id: impl-10/03
title: 独立语义 Gate evaluate_semantic（同层覆盖、严格 offset、分歧零未决、证据级别如实）
estimated_minutes: 80
group: J1
depends_on: [impl-10/02]
scope:
  write: [pipeline/corpus_compiler/semantic/semantic_gate.py, pipeline/corpus_compiler/semantic/tests/test_semantic_gate.py]
tests_first:
  - 先写 tests/test_semantic_gate.py（用例名逐字），全红，记录 Red；再实现
contract: |
  semantic_gate.py：纯函数；只允许 import 标准库、yaml、json、hashlib、re、pipeline.ledger.ids、pipeline.ledger.states；
    不得 import pipeline.corpus_compiler.compiler / serialize / gate，以及 semantic 子包的 rules / proposals / proposer / reconcile / anchors / assemble（防同错同过）
  evaluate_semantic(*, manifest, page_docs, terminal_states, structural_spans_doc, structural_spans_sha256, semantic_spans_doc, window_responses, decisions, model_min_chars) -> dict
    参数：window_responses = [{"window_id", "structural_span_id", "response_a": str, "response_b": str}]（原始响应文本，Gate 自行解析）；
          decisions = [人工事件内容 dict（schema m3_boundary_decision/1）]
    返回：{"semantic": "passed" | "failed", "checks": {名: {"ok": bool, "detail": str}}}；任何检查内部异常 → 该项 ok False、detail 为异常类名与消息
    九项检查（名称与顺序固定）：
      semantic_page_accounting：语义片段覆盖页集合 == 结构覆盖页集合；terminal_states 为 known_unrecognizable 的页无片段
      semantic_contiguous_coverage：页块由 page_docs 自行重算（行 text 以 "\n" 连接）；每页按 start 排序后首 0、末 len、相邻缺口只能是 "\n"、无重叠
      semantic_strict_offset：block[start:end] == text；quote_sha256 == sha256(text UTF-8)；text 非空
      structural_refs_consistent：每片恰 1 个 ref；ref.span_id 在结构文档中存在；0 ≤ start < end ≤ len(结构 text)；结构 text[start:end] == text；start_offset == 结构 start_offset + ref.start；同页 sequence 与结构行顺序一致
      window_rule：按 model_min_chars 自行重算窗口集合与 window_id（"<work>_w%03d"）；非窗口行恰 1 片且 boundary_origin == "rule"、window_id is None、ref 覆盖整行；窗口行各片 window_id 相符且 boundary_origin ∈ {cross_model_agreed, human_decided}；window_responses 的窗口集合 == 重算窗口集合
      disputes_resolved：Gate 自写最小解析器解析 response_a/b（与 act/01 parse_proposal 规则同义，独立书写）；
        A、B 均合法且边界相同 → 该窗口片段边界 == 该边界、origin cross_model_agreed、且无针对它的裁决；
        否则 → decisions 中该 structural_span_id 恰 1 条、其 segments 铺满窗口、片段边界 == 裁决、origin human_decided；
        未决分歧数必须为 0（§11:521）；decisions 不得指向非窗口或一致窗口
      evidence_level_honest：从 page_docs 自行取 parent == line_id 且 char != "" 的字框序列判定对齐；对齐 → glyphbox_level 且 glyphs == 序列[ref.start:ref.end] 的 (id, char, box)；不对齐 → offset_level 且 glyphs == []；image_sha256 == manifest.source_assets 同页 sha256；line_id、bbox 与页 JSON 行一致
      semantic_identity：ID 匹配 ^sem_([a-z][a-z0-9]*)_ed([0-9]{2})_p([0-9]{4})_s([0-9]{3})$（本文件独立书写）且 work/edition 与 source_id 一致、页号与 page 一致、序号 == sequence；全局唯一；每页 sequence 从 1 连续
      header_counts：span_count、window_count、dispute_count、evidence_level_counts、gate_profile == "structural_and_semantic"、语义文档 structural_spans_sha256 == 参数 structural_spans_sha256（调用方传入 Ledger 中 corpus_spans 修订字节的 sha256）
    semantic = "passed" 当且仅当九项全部 ok
tests:
  test_semantic_gate.py: |
    脚手架：金标 semantic_spans.yaml（yaml 解析）+ mini_ed01 manifest/pages/spans + anomalies 终态 + recordings 原始 response_text + human_decisions 转为事件内容 dict；每个篡改用例 deepcopy 后只改一处
    - test_golden_passes_all_nine
    - test_gate_does_not_import_forbidden_modules（解析 semantic_gate.py 源码 AST 的 import 节点）
    - test_drop_span_fails_contiguous_coverage
    - test_overlap_fails_contiguous_coverage
    - test_shift_offset_fails_strict_offset
    - test_change_text_fails_strict_offset
    - test_change_quote_hash_fails_strict_offset
    - test_bad_structural_ref_fails_structural_refs_consistent
    - test_split_rule_line_fails_window_rule
    - test_missing_window_response_fails_window_rule
    - test_agreed_window_boundary_changed_fails_disputes_resolved
    - test_disputed_window_without_decision_fails_disputes_resolved
    - test_decision_segments_mismatch_fails_disputes_resolved
    - test_decision_on_agreed_window_fails_disputes_resolved
    - test_response_b_equal_a_but_origin_human_fails_disputes_resolved
    - test_offset_level_upgraded_fails_evidence_level_honest
    - test_glyph_changed_fails_evidence_level_honest
    - test_image_sha_changed_fails_evidence_level_honest
    - test_duplicate_id_fails_semantic_identity
    - test_sequence_gap_fails_semantic_identity
    - test_header_count_fails_header_counts
    - test_excluded_page_with_span_fails_page_accounting
verify:
  - .venv/bin/python -m unittest discover -s pipeline/corpus_compiler/semantic/tests -t . 2>&1 | grep -E '^(Ran|OK|FAILED)'   # OK，≥ 52（累计 59）
  - grep -nE '^\s*(import|from) ' pipeline/corpus_compiler/semantic/semantic_gate.py   # 只出现 contract 允许的模块
  - TDD §3 回归
commit:
  add: [pipeline/corpus_compiler/semantic/semantic_gate.py, pipeline/corpus_compiler/semantic/tests/test_semantic_gate.py]
  message: "feat(m3-semantic): independent semantic gate for same-layer coverage, strict offsets, zero unresolved disputes and honest evidence level (spec §11 Gate)"
on_fail: 停止并报告；任一篡改用例未被指定检查捕获时不得放宽断言
