act_id: impl-10/05
title: 语义层合成 compile_semantic_offset（sem_ 偏移锚点）与人工裁决/恢复
estimated_minutes: 85
group: L3
depends_on: [impl-10/04]
scope:
  write:
    - pipeline/corpus_compiler/semantic/offset_assemble.py
    - pipeline/corpus_compiler/semantic/review.py
    - pipeline/corpus_compiler/semantic/tests/test_offset_assemble.py
    - pipeline/corpus_compiler/semantic/tests/test_review.py
tests_first:
  - 先写 tests/test_offset_assemble.py 与 tests/test_review.py（具名用例逐字），全红，记录真实 Red 原文；再实现
contract: |
  1. offset_assemble.py（纯函数）：
     - compile_semantic_offset(*, structural_spans: list[dict], windows: list[dict],
                               resolutions: dict, raw_text_revision_id: str, raw_text: str,
                               cleaned_text_revision_id: str, cleaned_text: str,
                               patches: list[dict], work: str, edition: str) -> dict
       - 为每个片段生成带 sem_ 前缀的 SemanticSpan：
         - semantic_span_id: format_semantic_span_id(work, edition, raw_start)（格式 sem_<work>_<edition>_o<NNNNNNN>）
         - boundary_origin: "rule"（非窗口）、"cross_model_agreed"（一致窗口）、"human_decided"（裁决窗口）
         - structural_refs: [{"span_id": 对应结构 Span ID, "start": 局部起点, "end": 局部终点}]
         - evidence_level: "offset_level"
         - source_anchor: 7 键偏移锚点字典
       - 文档顶层键序逐字：work, source_id, edition_part_artifact_id, raw_spans_sha256, gate_profile("structural_and_semantic"), segmentation_profile, content_status("machine_extracted"), span_count, window_count, dispute_count, evidence_level_counts, spans。

  2. review.py：
     - submit_boundary_decision(service: LedgerService, step_run_id: str, resume_token: str, decision: dict) -> dict
       - 校验 StepRun 处于 awaiting_human 状态；
       - 校验 decision 指向合法的分歧窗口，格式符合 m3_boundary_decision/1，decision_type 恒为 review_source_fidelity；
       - 封存 human_event 并记录 record_human_event；
       - 核心纪律（§17.1）：每条人工裁决被接受后必须立即落盘一个独立 Checkpoint，不得延后合并；
     - resume_m3_text_full(service: LedgerService, step_run_id: str, resume_token: str) -> dict
       - 校验所有分歧窗口均已解决；若存在未裁决窗口，拒绝恢复并抛 DisputesUnresolved，保持 awaiting_human；
       - 恢复后执行 compile_semantic_offset 并运行语义 Gate；
       - 组装并登记 m3 StagePackage（gate_profile="structural_and_semantic", semantic="passed"）；
       - 结束 StepRun 为 succeeded。

  3. 护栏约束（第 88 条）：
     - 存在未解决分歧时恢复必须阻断；
     - 每次人工裁决必须立即写入 Checkpoint；
     - 前缀严格限定为 sem_，不得包含任何第三方前缀。
tests:
  test_offset_assemble.py: |
    - test_compile_semantic_offset_keys_and_order
    - test_semantic_span_id_prefix_strictly_sem（第 88 条护栏用例：断言生成的每一个 ID 严格以 sem_ 起头，绝无未登记前缀）
    - test_semantic_spans_rule_boundary_origin
    - test_semantic_spans_cross_model_agreed_origin
    - test_semantic_spans_human_decided_origin
    - test_semantic_spans_structural_refs_integrity
    - test_semantic_spans_evidence_level_strictly_offset_level
    - test_compile_semantic_offset_counts_exact
  test_review.py: |
    - test_submit_boundary_decision_success
    - test_submit_boundary_decision_invalid_token_rejected
    - test_submit_boundary_decision_non_disputed_window_rejected
    - test_checkpoint_written_immediately_after_each_decision（第 88 条护栏用例：断言在 submit_boundary_decision 调用后 Checkpoint 数量立即 +1，且 task_id 为 review:<window_id>）
    - test_resume_without_resolving_all_disputes_rejected（第 88 条护栏用例：在存在 2 个分歧仅裁决 1 个时调用 resume，断言严禁放行并抛 DisputesUnresolved）
    - test_resume_all_resolved_succeeds
    - test_resume_registers_stage_package_with_structural_and_semantic_profile
    - test_resume_m3_stage_package_payload_semantic_passed
    - test_resume_lineage_contains_all_transformations
    - test_resume_step_run_transitions_to_succeeded
verify:
  - .venv/bin/python -m unittest discover -s pipeline/corpus_compiler/semantic/tests -p 'test_*.py' -t . 2>&1 | grep -E '^(Ran|OK|FAILED)'   # OK，≥ 104（累计算术：86 + 18 = 104）
  - grep -rn 'sem_' pipeline/corpus_compiler/semantic/offset_assemble.py | wc -l   # > 0
  - git diff --check
commit:
  add: [pipeline/corpus_compiler/semantic/offset_assemble.py, pipeline/corpus_compiler/semantic/review.py, pipeline/corpus_compiler/semantic/tests/test_offset_assemble.py, pipeline/corpus_compiler/semantic/tests/test_review.py]
  message: "feat(corpus_compiler): semantic span assembly with sem_ prefix and human adjudication review queue (rulings 80, 81)"
on_fail: 停止并报告；遇未决分歧放行或 Checkpoint 未落盘停手
