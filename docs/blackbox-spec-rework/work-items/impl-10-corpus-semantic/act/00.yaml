act_id: impl-10/00
title: 偏移锚点计算与 DeterministicPatchSet 双向换算纯函数（§78）
estimated_minutes: 60
group: L1
depends_on: []
scope:
  write:
    - pipeline/corpus_compiler/offset_anchors.py
    - pipeline/corpus_compiler/tests/test_offset_anchors.py
tests_first:
  - 先写 tests/test_offset_anchors.py（具名用例逐字），因 ImportError 全红，记录真实 Red 原文；再实现 offset_anchors.py
contract: |
  模块 pipeline/corpus_compiler/offset_anchors.py（纯函数；只用标准库 hashlib、re；无外部依赖；不访问 Ledger、不写文件）：

  1. format_source_span_id(work: str, edition: str, raw_start: int) -> str
     - 格式：f"ss_{work}_{edition}_o{raw_start:07d}"
     - 校验：work 符合 ^[a-z][a-z0-9]*$（依第 102 条 Q1：禁止下划线）；edition 符合 ^ed[0-9]{2}$；raw_start >= 0；否则抛 ValueError("SCH_002: 无效的 SourceSpan ID 参数")
     - 产出严格匹配正则：^ss_[a-z][a-z0-9]*_ed[0-9]{2}_o[0-9]{7}$（依第 102 条）

  2. format_semantic_span_id(work: str, edition: str, raw_start: int) -> str
     - 格式：f"sem_{work}_{edition}_o{raw_start:07d}"
     - 校验同上，产出匹配：^sem_[a-z][a-z0-9]*_ed[0-9]{2}_o[0-9]{7}$（依第 102 条；sem_ 本次只登记偏移形态，页码形态留待第二版）
     - 严禁引入除 ss_ 与 sem_ 之外的任何新前缀（P8）

  3. map_raw_to_cleaned(patches: list[dict], raw_start: int, raw_end: int) -> tuple[int, int]
     - patches 每项符合 impl-09 README §4.3：{patch_id, raw_start, raw_end, cleaned_start, cleaned_end, action, basis}
     - 依据 patches 确定性映射原始文本区间 [raw_start, raw_end) 到清洗文本区间 [cleaned_start, cleaned_end)
     - 若 raw_start > raw_end 或 raw_start < 0，抛 ValueError("SCH_002: 原始偏移区间非法")
     - 不得修改入参 patches 列表与字典（纯函数）

  4. map_cleaned_to_raw(patches: list[dict], cleaned_start: int, cleaned_end: int) -> tuple[int, int]
     - 逆向映射清洗文本区间到原始文本区间，与 map_raw_to_cleaned 互为逆运算
     - 若 cleaned_start > cleaned_end 或 cleaned_start < 0，抛 ValueError("SCH_002: 清洗偏移区间非法")

  5. make_offset_anchor(*, raw_text_revision_id: str, raw_start: int, raw_end: int,
                        cleaned_text_revision_id: str, start_offset: int, end_offset: int,
                        quote: str) -> dict
     - 返回键序逐字：raw_text_revision_id, raw_start, raw_end, cleaned_text_revision_id, start_offset, end_offset, quote_sha256
     - quote_sha256 = hashlib.sha256(quote.encode("utf-8")).hexdigest()
     - 约束：len(quote) == end_offset - start_offset > 0；raw_end > raw_start >= 0；不满足抛 ValueError("SCH_002: 锚点引文或区间非法")

  6. verify_anchor(*, raw_text: str, cleaned_text: str, patches: list[dict], anchor: dict) -> tuple[bool, str]
     - 验证 anchor 内部一致性：
       (a) quote_sha256 == sha256(cleaned_text[start_offset:end_offset])
       (b) map_raw_to_cleaned(patches, raw_start, raw_end) == (start_offset, end_offset)
       (c) map_cleaned_to_raw(patches, start_offset, end_offset) == (raw_start, raw_end)
     - 一致返回 (True, "")；任一不符返回 (False, <原因说明>)
tests:
  test_offset_anchors.py: |
    - test_format_source_span_id_valid
    - test_format_source_span_id_zero_padded_7_digits
    - test_format_source_span_id_rejects_negative_offset_SCH_002
    - test_format_source_span_id_rejects_invalid_edition_SCH_002
    - test_format_semantic_span_id_valid
    - test_format_semantic_span_id_prefix_strictly_sem（断言前缀恒以 sem_ 起头，绝无第三方前缀）
    - test_map_raw_to_cleaned_without_patches（无补丁时偏移严格恒等）
    - test_map_raw_to_cleaned_with_single_replacement_patch
    - test_map_raw_to_cleaned_with_insertion_and_deletion_patches
    - test_map_cleaned_to_raw_roundtrip_reversibility（正反向映射往返恒等）
    - test_map_raw_to_cleaned_rejects_inverted_range_SCH_002
    - test_make_offset_anchor_keys_and_order（7 键键序严格逐字对齐）
    - test_make_offset_anchor_computes_exact_quote_sha256
    - test_make_offset_anchor_rejects_quote_len_mismatch_SCH_002
    - test_verify_anchor_success_on_valid_inputs
    - test_verify_anchor_detects_tampered_quote_hash（篡改引文哈希检出失败）
    - test_verify_anchor_detects_patch_offset_drift（偏移与 patch 换算不符检出失败）
    - test_anchors_pure_does_not_mutate_inputs（护栏用例：断言入参 patches 深度比对在调用前后完全一致，检出意外修改）
verify:
  - .venv/bin/python -m unittest discover -s pipeline/corpus_compiler/tests -t . 2>&1 | grep -E '^(Ran|OK|FAILED)'   # OK，≥ 86（基线 68 + 本 ACT 18）
  - git diff --check
commit:
  add: [pipeline/corpus_compiler/offset_anchors.py, pipeline/corpus_compiler/tests/test_offset_anchors.py]
  message: "feat(corpus_compiler): offset anchor computation and deterministic patch set bidirectional mapping (ruling 78)"
on_fail: 停止并报告；遇区间换算歧义或入参格式不符停手
