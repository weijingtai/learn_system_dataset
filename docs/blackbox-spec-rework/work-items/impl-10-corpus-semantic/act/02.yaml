act_id: impl-10/02
title: M3 电子文本输入解析与 StepRun 事务（resolve_m3_text_inputs 与 run_m3_text）
estimated_minutes: 80
group: L2
depends_on: [impl-10/01]
scope:
  write:
    - pipeline/corpus_compiler/step_offset.py
    - pipeline/corpus_compiler/tests/test_step_offset.py
tests_first:
  - 先写 tests/test_step_offset.py（具名用例逐字），全红，记录真实 Red 原文；再实现 step_offset.py
contract: |
  模块 pipeline/corpus_compiler/step_offset.py：

  1. resolve_m3_text_inputs(service: LedgerService, edition_part_id: str) -> M3TextInputs
     - 从 Ledger 查询对应 EditionPart 的最新 M2 阶段产物：
       (a) raw_text 修订
       (b) cleaned_text_revision 修订
       (c) deterministic_patch_set 修订
       (d) sanitization_report 修订
     - 校验 M2 StepRun 状态：必须为 succeeded，否则抛 CompileRefused("P5: M2 阶段未成功完成")；
     - 校验清洗报告终态：sanitization_report 中的 deferred_count 必须 == 0；若 > 0，抛 CompileRefused("§10.1: 存在暂缓处理项 deferred，阻断 M3 编译")；
     - 返回数据类 M3TextInputs，封装上述产物的文本内容、解析后的 patches 以及 revision_id。

  2. run_m3_text(service: LedgerService, edition_part_id: str, *, batch_size: int = 10) -> dict
     - 执行 M3 电子文本结构编译 StepRun：
       P1 输入解析：inputs = resolve_m3_text_inputs(service, edition_part_id)
       P2 阶段守卫：同阶段已存在 succeeded StepRun 且未提供 supersedes 时拒绝；
       P3 配置与启动：写入 configuration（指定 tool="pipeline.corpus_compiler.step_offset", evidence_level="offset_level"），调用 begin_step_run 冻结输入；
       P4 编译产出：调用 compile_offset_spans 生成结构 spans，按 batch_size 切分子批次并写入 Checkpoint；
       P5 封存制品：封存 corpus_spans（artifact_type="corpus_spans", evidence_level="offset_level"）；
       P6 记录血缘：写入 record_transformation(operation="compile_corpus", ...)。
     - 异常分层：已知校验失败走 _fail(<check_name>) 并记录 failure_report；未捕获异常走 _fail("internal")。
     - 失败检查名闭集：input_contract, compile, deferred_findings, structural_gate, internal。

  3. 护栏约束（第 88 条）：
     - 若 M2 报告含 deferred 发现，必须严禁编译并拒绝写入任何 M3 产物（fail-closed）；
     - 未成功的 M2 运行产物严禁被读取消费；
     - 严禁调用真实模型 API 或外部网络。
tests:
  test_step_offset.py: |
    - test_resolve_m3_text_inputs_success
    - test_non_succeeded_m2_run_rejected（护栏用例：当 M2 状态为 running 或 failed 时拒绝解析，断言抛 CompileRefused）
    - test_deferred_sanitization_findings_blocks_compilation（第 88 条护栏用例：构造 deferred_count=1 的 M2 报告，断言严禁放行，抛 CompileRefused 且 Ledger 表无变动）
    - test_resolve_m3_text_inputs_missing_patch_set_SCH_001
    - test_resolve_m3_text_inputs_missing_raw_text_SCH_001
    - test_resolve_m3_text_inputs_missing_cleaned_text_SCH_001
    - test_run_m3_text_emits_offset_spans_artifact
    - test_run_m3_text_frozen_inputs_include_all_four_m2_artifacts
    - test_run_m3_text_checkpoints_chain_in_order
    - test_run_m3_text_records_compile_corpus_transformation
    - test_run_m3_text_configuration_contains_tool_and_evidence_level
    - test_run_m3_text_succeeded_summary_keys
    - test_run_m3_text_input_contract_tampered_fails_gracefully
    - test_run_m3_text_already_sealed_stage_refuses_rerun
    - test_run_m3_text_empty_input_handled
    - test_run_m3_text_zero_network_via_socket_guard（护栏用例：打补丁拦截 socket 连接，验证全流程零网络）
    - test_run_m3_text_spans_bytes_deterministic_between_runs
    - test_run_m3_text_batch_size_configuration_respected
verify:
  - .venv/bin/python -m unittest discover -s pipeline/corpus_compiler/tests -p 'test_step_offset.py' -t . 2>&1 | grep -E '^(Ran|OK|FAILED)'   # OK，≥ 52（累计算术：34 + 18 = 52）
  - grep -rn 'socket\.' pipeline/corpus_compiler/step_offset.py | wc -l   # 0
  - git diff --check
commit:
  add: [pipeline/corpus_compiler/step_offset.py, pipeline/corpus_compiler/tests/test_step_offset.py]
  message: "feat(corpus_compiler): M3 electronic-text input resolution and step run transaction (rulings 76, 78)"
on_fail: 停止并报告；遇 Ledger 状态异常或前置校验不通过停手
