act_id: impl-10/06
title: 独立语义 Gate evaluate_semantic_offset（无网络、严格覆盖、未决为零）
estimated_minutes: 80
group: L3
depends_on: [impl-10/05]
scope:
  write:
    - pipeline/corpus_compiler/semantic/semantic_gate.py
    - pipeline/corpus_compiler/semantic/tests/test_semantic_gate.py
tests_first:
  - 先写 tests/test_semantic_gate.py（具名用例逐字），全红，记录真实 Red 原文；再实现 semantic_gate.py
contract: |
  模块 pipeline/corpus_compiler/semantic/semantic_gate.py（独立纯函数；不访问 Ledger、零网络）：

  1. evaluate_semantic_offset(*, cleaned_text: str, patches: list[dict],
                             structural_spans_doc: dict, semantic_spans_doc: dict,
                             window_responses: list[dict], decisions: list[dict],
                             model_min_chars: int = 12) -> dict
     - 返回：{"semantic": "passed" | "failed", "checks": {name: {"ok": bool, "detail": str}}}
     - 八项独立语义检查（名称与顺序固定）：
       (1) semantic_contiguous_coverage：语义片段首尾相连、无缺口、无重叠，拼接后完全等于 cleaned_text
       (2) semantic_strict_offset：每条语义片段的 cleaned_text[start:end] == span.text，且 quote_sha256 正确
       (3) structural_refs_consistent：每条语义片段引用合法的结构 Span，局部起点与全局起点换算一致
       (4) window_rule_fidelity：len(text) >= model_min_chars 的片段均正确成为窗口，其余行严格一行一片
       (5) disputes_resolved_zero：Gate 独立复算双模型提议；分歧窗口必须在 decisions 中恰有 1 条有效裁决；未决分歧数必须为 0（§11:521）
       (6) evidence_level_honest：每条语义片段及顶层 evidence_level 严格为 "offset_level"
       (7) semantic_identity：semantic_span_id 严格符合 ^sem_[a-z][a-z0-9]*_ed[0-9]{2}_o[0-9]{7}$（依第 102 条，work 段禁止下划线；唯一权威 pipeline/ledger/ids.py），全局唯一、序号连续
       (8) header_counts：文档顶层 span_count, window_count, dispute_count 等计数与实体严格一致
     - 判定规则：八项检查全部 ok 时 semantic 判定为 "passed"，任一失败判定为 "failed"。

  2. 护栏约束（第 88 条）：
     - semantic_gate.py 严禁 import offset_assemble、review、proposer、offset_rules 等生产模块（防同错同过）；
     - 存在未决分歧、重叠或缺口时必须判定 failed。
tests:
  test_semantic_gate.py: |
    - test_evaluate_semantic_offset_golden_all_pass
    - test_semantic_gate_ast_forbids_compiler_imports（第 88 条护栏用例：AST 解析断言未 import 任何编译器实现模块）
    - test_semantic_gate_catches_gap_and_overlap（第 88 条护栏用例：篡改片段造成缺口或重叠，断言 semantic_contiguous_coverage 失败）
    - test_tampered_semantic_text_fails_strict_offset
    - test_tampered_semantic_quote_hash_fails_strict_offset
    - test_broken_structural_ref_fails_structural_refs_consistent
    - test_offset_mismatch_with_structural_ref_fails
    - test_non_window_split_fails_window_rule_fidelity
    - test_window_threshold_discrepancy_fails_window_rule_fidelity
    - test_unresolved_dispute_fails_semantic_gate（第 88 条护栏用例：遗留未决分歧窗口时，断言 disputes_resolved_zero 判定为 ok: False）
    - test_decision_on_agreed_window_fails
    - test_tampered_decision_segments_fails
    - test_upgraded_glyphbox_fails_evidence_level_honest
    - test_duplicate_semantic_span_id_fails_identity
    - test_invalid_semantic_span_id_regex_fails_identity
    - test_semantic_span_count_mismatch_fails_header_counts
    - test_window_count_mismatch_fails_header_counts
    - test_dispute_count_mismatch_fails_header_counts
verify:
  - .venv/bin/python -m unittest discover -s pipeline/corpus_compiler/semantic/tests -t . 2>&1 | grep -E '^(Ran|OK|FAILED)'   # OK，≥ 54（累计 36 + 18）
  - grep -rn 'import.*offset_assemble' pipeline/corpus_compiler/semantic/semantic_gate.py | wc -l   # 0
  - git diff --check
commit:
  add: [pipeline/corpus_compiler/semantic/semantic_gate.py, pipeline/corpus_compiler/semantic/tests/test_semantic_gate.py]
  message: "feat(corpus_compiler): independent semantic gate for offset spans with zero unresolved disputes (spec §11)"
on_fail: 停止并报告；遇 Gate 检查项遗漏或同错同过停手
