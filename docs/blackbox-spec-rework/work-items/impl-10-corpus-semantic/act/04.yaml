act_id: impl-10/04
title: 语义窗口选择、Proposer Adapter 接口与提议解析比较（纯函数）
estimated_minutes: 80
group: L3
depends_on: [impl-10/03]
scope:
  write:
    - pipeline/corpus_compiler/semantic/offset_rules.py
    - pipeline/corpus_compiler/semantic/proposer.py
    - pipeline/corpus_compiler/semantic/proposals.py
    - pipeline/corpus_compiler/semantic/tests/test_offset_rules.py
    - pipeline/corpus_compiler/semantic/tests/test_proposer.py
    - pipeline/corpus_compiler/semantic/tests/test_proposals.py
tests_first:
  - 先写三个测试文件（具名用例逐字），全红，记录真实 Red 原文；再实现对应的生产模块
contract: |
  1. offset_rules.py（纯函数）：
     - select_text_windows(spans: list[dict], *, model_min_chars: int = 12) -> list[dict]
       - 遍历结构 spans（原顺序）；
       - len(text) >= model_min_chars 的片段成为模型切分窗口；
       - window_id 编号格式：f"{work}_w{n:03d}"（n 从 1 递增）；
       - 每项键序：window_id, span_id, text, text_sha256, raw_start, raw_end。

  2. proposer.py（零网络，不 import 网络库）：
     - PROMPT_TEMPLATE_ID = "m3_boundary_v1"
     - PROMPT_TEMPLATE：古籍语义切分提示词模板，只输出 JSON，不复述原文；
     - build_request(*, slot: str, model: dict, window: dict) -> bytes
       - slot ∈ {"a", "b"}；只包含本窗口原文，严禁泄漏其他窗口或对端 slot 内容（§12.2）；
     - load_recordings(data: bytes) -> dict
       - 校验 schema == "m3_boundary_recordings/1"，synthetic is True，template_id 一致；
     - class ReplayProposer：通过预先录制的内容回放模型提议；
     - class LiveProposer：默认禁用的真实模型桩，未设环境变量抛 ModelCallDisabled，设了调用 propose 仍抛 ModelCallDisabled。

  3. proposals.py（纯函数）：
     - parse_proposal(response_bytes: bytes, window_text: str) -> dict
       - 返回键：valid(bool), segments([[start, end], ...]), reasons([str]), error(None | "json" | "shape" | "type" | "range" | "empty" | "gap" | "overlap" | "coverage")
       - 严禁信任模型返回的 text，片段原文一律由程序从 window_text[start:end] 切取；
     - compare_proposals(parsed_a: dict, parsed_b: dict) -> dict
       - A、B 均有效且切分边界完全一致 → {"status": "agreed", "reason": None, "segments": parsed_a["segments"]}
       - 任一无效或切分边界不一致 → {"status": "disputed", "reason": "boundary_mismatch" | "proposal_invalid", "segments": None}

  4. 护栏约束（第 88 条）：
     - 生产代码严禁 import socket、urllib、requests、httpx 等网络库；
     - LiveProposer 绝不包含真实模型调用代码；
     - 单个窗口请求体严禁泄漏其他窗口数据。
tests:
  test_offset_rules.py: |
    - test_select_text_windows_threshold_filtering
    - test_select_text_windows_empty_input
    - test_select_text_windows_keys_and_order
  test_proposer.py: |
    - test_template_sha256_matches_constant
    - test_request_bytes_deterministic
    - test_request_contains_only_current_window_text（护栏用例：断言窗口 B 的请求体不含窗口 A 文本或其它 slot 响应）
    - test_load_recordings_valid
    - test_load_recordings_rejects_synthetic_false
    - test_replay_proposer_returns_recorded_response
    - test_replay_proposer_miss_raises_RecordingMiss
    - test_live_proposer_strictly_disabled_with_or_without_env（第 88 条护栏用例：测试在有无环境变量下构造与调用 propose，断言恒抛 ModelCallDisabled，无网络逻辑）
    - test_proposer_zero_network_via_socket_monkeypatch（第 88 条护栏用例：拦截 socket.socket 与 create_connection，断言回放流程网络调用次数严格为 0）
  test_proposals.py: |
    - test_parse_proposal_valid_single_segment
    - test_parse_proposal_valid_multi_segment
    - test_parse_proposal_ignores_model_text_field
    - test_parse_proposal_detects_gap_and_overlap
    - test_compare_proposals_agreed
    - test_compare_proposals_disputed_on_mismatch
verify:
  - .venv/bin/python -m unittest discover -s pipeline/corpus_compiler/semantic/tests -p 'test_*.py' -t . 2>&1 | grep -E '^(Ran|OK|FAILED)'   # OK，≥ 86（累计算术：68 + 18 = 86）
  - grep -rE '^\s*(import|from) (socket|urllib|http|requests|httpx)' pipeline/corpus_compiler/semantic/proposer.py | wc -l   # 0
  - git diff --check
commit:
  add: [pipeline/corpus_compiler/semantic/offset_rules.py, pipeline/corpus_compiler/semantic/proposer.py, pipeline/corpus_compiler/semantic/proposals.py, pipeline/corpus_compiler/semantic/tests/test_offset_rules.py, pipeline/corpus_compiler/semantic/tests/test_proposer.py, pipeline/corpus_compiler/semantic/tests/test_proposals.py]
  message: "feat(corpus_compiler): semantic window selection, proposer adapter and proposal comparison (rulings 76, 80)"
on_fail: 停止并报告；遇提示词模板漂移或网络注入停手
