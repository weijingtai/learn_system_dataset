act_id: impl-10/01
title: 电子文本切分与 SourceSpan 产出（纯函数）
estimated_minutes: 65
group: L1
depends_on: [impl-10/00]
scope:
  write:
    - pipeline/corpus_compiler/text_compiler.py
    - pipeline/corpus_compiler/tests/test_text_compiler.py
tests_first:
  - 先写 tests/test_text_compiler.py（具名用例逐字），因 ImportError 全红，记录真实 Red 原文；再实现 text_compiler.py
contract: |
  模块 pipeline/corpus_compiler/text_compiler.py（纯函数；不访问 Ledger、不写文件、零网络）：

  1. segment_cleaned_text(cleaned_text: str) -> list[tuple[int, int]]
     - 依据换行符与标点规则将清洗后文本切分为结构行/片段
     - 必须 100% 覆盖全文，无缺口、无重叠，拼接后严格等于 cleaned_text
     - 若 cleaned_text 为空串，返回 []

  2. compile_offset_spans(*, work: str, edition: str,
                           edition_part_artifact_id: str,
                           raw_text_revision_id: str, raw_text: str,
                           cleaned_text_revision_id: str, cleaned_text: str,
                           patches: list[dict]) -> dict
     - 切分 cleaned_text 并为每片构造偏移锚点与 SourceSpan
     - 每条 Span 键序逐字：span_id, sequence, start_offset, end_offset, text, quote_sha256, evidence_level, source_anchor
       - span_id: format_source_span_id(work, edition, raw_start)，格式 ss_<work>_<edition>_o<NNNNNNN>
       - sequence: 顺序号，从 1 连续递增
       - start_offset / end_offset: 清洗文本局部偏移
       - text: cleaned_text[start_offset:end_offset]
       - quote_sha256: sha256(text.encode('utf-8'))
       - evidence_level: const "offset_level"（严禁标为 glyphbox_level）
       - source_anchor: make_offset_anchor 产出的 7 键字典
     - 文档顶层键序逐字：work, source_id, edition_part_artifact_id, evidence_level, content_status, span_count, spans
       - evidence_level: "offset_level"
       - content_status: "machine_extracted"
       - span_count: len(spans)
     - 返回结构：{
         "spans": spans,
         "spans_doc": spans_doc,
         "spans_bytes": dump_yaml_bytes(spans_doc),
         "spans_sha256": sha256(spans_bytes),
         "counts": {"spans": len(spans), "evidence_level_counts": {"offset_level": len(spans), "glyphbox_level": 0}}
       }

  3. 护栏约束（第 88 条）：
     - 不得向全局 yaml.SafeDumper 注册任何自定义 representer（通过专用局部 Dumper 或序列化器保证）；
     - evidence_level 恒为 offset_level，不得生成 glyphbox_level；
     - 切片拼接必须与 cleaned_text 逐字符恒等。
tests:
  test_text_compiler.py: |
    - test_segment_cleaned_text_empty_string
    - test_segment_cleaned_text_single_line
    - test_segment_cleaned_text_multi_line
    - test_segmentation_no_gap_no_overlap（护栏用例：验证所有片段首尾相接、无缺口、无重叠，拼接后完全等于原文本）
    - test_compile_offset_spans_doc_top_level_keys_and_order（7 个顶层键序严格逐字对齐）
    - test_compile_offset_spans_span_keys_and_order（8 个 Span 键序严格逐字对齐）
    - test_compile_offset_spans_source_span_id_stability_across_patches（补丁增删导致 cleaned 偏移漂移时，RawText 偏移不变使得 ID 严格恒定）
    - test_compile_offset_spans_quote_and_hash_integrity
    - test_compile_offset_spans_sequence_continuous_from_one
    - test_compile_offset_spans_counts_and_sha256_exact
    - test_evidence_level_strictly_offset_level（护栏用例：断言顶层及每条 Span 的 evidence_level 恒等于 offset_level）
    - test_dump_yaml_bytes_deterministic
    - test_global_safedumper_not_polluted_on_import_and_runtime（第 88 条护栏用例：断言 SafeDumper.yaml_representers 未被污染，并通过 importlib.reload 模块二次验证 import 期无副作用）
    - test_compile_offset_spans_rejects_empty_raw_text_SCH_002
    - test_compile_offset_spans_rejects_invalid_edition_SCH_002
    - test_compile_offset_spans_rejects_patch_out_of_bounds_SCH_002
verify:
  - .venv/bin/python -m unittest discover -s pipeline/corpus_compiler/tests -p 'test_*.py' -t . 2>&1 | grep -E '^(Ran|OK|FAILED)'   # OK，≥ 34（累计算术：18 + 16 = 34）
  - grep -rn 'SafeDumper.add_representer' pipeline/corpus_compiler/text_compiler.py | wc -l   # 0
  - git diff --check
commit:
  add: [pipeline/corpus_compiler/text_compiler.py, pipeline/corpus_compiler/tests/test_text_compiler.py]
  message: "feat(corpus_compiler): electronic text segmentation and offset SourceSpan assembly (ruling 78)"
on_fail: 停止并报告；遇切片覆盖缺口或 YAML 污染停手
