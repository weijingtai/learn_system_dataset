global_rules:
  - 每个 ACT 先写测试（Red 原文入报告）再实现；unittest；测试只用 tempfile 目录，不写 var/、fixture、pipeline/TASKS
  - 只用标准库 + PyYAML + jsonschema；不新增依赖；不新增 ID 前缀（task_id、dispute_id 是任务标签，不是登记册 ID）；不调用模型 API
  - 生产代码只读 Ledger 冻结修订；Adapter 入口（adapters/）读外部文件后必须先登记进 Ledger 才能被 M4 核心消费；测试可读 fixture 作输入或金标
  - 生产代码不得 import pipeline/validators、pipeline/tools、pipeline/runner 下的脚本
  - M4 产出的 content_status 只能是 machine_extracted / disputed / needs_expert
  - 中文注释与 docstring；公开函数名、参数名、返回键、检查名、task_id、artifact_type 与 ACT contract 逐字一致
  - 每个 ACT 一个提交；不得 git add -A / git add .；执行者不写台账、不写 ACCEPTED
gates:
  - bash docs/blackbox-spec-rework/verify-T.sh | tail -1                               # FAIL 合计: 0
  - bash docs/blackbox-spec-rework/work-items/g3-r3/mutations.sh all | tail -1         # 与基线相同
  - bash openspec/schemas/verify.sh >/dev/null; echo $?                                # 0
  - .venv/bin/python -m unittest discover -s pipeline/ledger/tests -t .                # OK（与基线相同）
  - .venv/bin/python -m unittest discover -s pipeline/corpus_compiler/tests -t .       # OK（与基线相同）
  - .venv/bin/python -m unittest discover -s pipeline/knowledge_extraction/tests -t .  # OK（ACT 00 起）
  - export LC_ALL=en_US.UTF-8; bash openspec/acceptance/run_all.sh | tail -1           # == TDD §0 BASELINE_RUN_ALL
  - test ! -e pipeline/tools/import_legacy_candidates.py; echo $?                      # 0
  - git diff --check
on_fail: 停止并报告；contract 两种理解、测试无法按定义写出、Ledger 公开方法行为与 contract 假设不符、需要改 scope 外文件 → 一律停手上报
