act_id: impl-05/00
title: 包骨架 + 提交件契约 validate_submission + 任务管线 Adapter（normalize_task_output / export_task_inputs）
estimated_minutes: 75
group: K1
depends_on: []
pending_decisions: [D-01, D-10, D-16]
scope:
  write: [pipeline/knowledge_extraction/__init__.py, pipeline/knowledge_extraction/errors.py, pipeline/knowledge_extraction/serialize.py, pipeline/knowledge_extraction/submission.py, pipeline/knowledge_extraction/adapters/__init__.py, pipeline/knowledge_extraction/adapters/task_pipeline.py, pipeline/knowledge_extraction/tests/__init__.py, pipeline/knowledge_extraction/tests/test_submission.py, pipeline/knowledge_extraction/tests/test_task_pipeline_adapter.py, pipeline/knowledge_extraction/tests/data/appendix_a/submission_assertion_a.yaml, pipeline/knowledge_extraction/tests/data/appendix_a/submission_assertion_b.yaml, pipeline/knowledge_extraction/tests/data/appendix_a/submission_concept_mention_a.yaml, pipeline/knowledge_extraction/tests/data/appendix_a/ruling_m4_d001.yaml]
tests_first:
  - 先把 README 附录 A 的四个 YAML 逐字落到 tests/data/appendix_a/（B 路与 concept_mention 按附录文字展开为完整 YAML，顶层键同 A 路；裁决件 ruling_m4_d001.yaml 含 synthetic_fixture 为 true 与 actor_ref 为 fixture:mini_ed01 两键，G7-RULINGS §9.7 第 52 条 / §9.8 第 55 条，不得当作真实人工决定）
  - 再写 tests/test_submission.py 与 tests/test_task_pipeline_adapter.py（用例名逐字），运行 `.venv/bin/python -m unittest discover -s pipeline/knowledge_extraction/tests -t .` 因 ImportError 全红，记录 Red；再实现
contract: |
  __init__.py：
    M4_TOOL = "pipeline.knowledge_extraction"；M4_TOOL_VERSION = "0.1.0"；CANDIDATE_SCHEMA_VERSION = "0.1.0-draft"
    CATEGORIES = ("assertion", "pattern", "school_view", "concept_mention")
    LANES = ("a", "b", "c")
    CHANNELS = ("fixture_gold", "task_pipeline_manual", "model_adapter", "legacy_workbench")
    ACCEPTED_CHANNELS = ("fixture_gold", "task_pipeline_manual")          # D-01
    PRODUCER_KINDS = ("fixture", "human", "external_agent", "model")
    RELATIONS = ("supports", "qualifies", "opposes", "corresponds", "equivalent")   # SCHEMA.md §4
    LAYERS = ("general", "case", "editorial")   # §13.1 G4 通则/命例/注文·异文·校勘；与 INTERFACES §3.2 一致
    SUPPORT_TYPES = ("direct", "interpreted")
    M4_STATUS_CEILING = ("machine_extracted", "disputed", "needs_expert")
    ITEM_KEYS = {
      "assertion": {"required": ("proposition", "relation", "evidence"), "optional": ("conditions", "exceptions", "concept_refs", "school_ids", "layer", "status")},
      "pattern": {"required": ("name", "assertion_propositions", "evidence"), "optional": ("interpretation", "status")},
      "school_view": {"required": ("school_id", "subject", "claim_propositions", "changes_current_judgment", "evidence"), "optional": ("conflict_key", "status")},
      "concept_mention": {"required": ("surface", "evidence"), "optional": ("concept_ref", "status")},
    }
  errors.py：class ExtractionRefused(pipeline.ledger.errors.LedgerError)，构造 ExtractionRefused(message, code=None)
  serialize.py：
    canonical_json(obj) -> bytes = json.dumps(obj, sort_keys=True, ensure_ascii=False, separators=(",", ":"), allow_nan=False).encode("utf-8")   # 与 README §5.3 固化默认逐字一致
    sha256_hex(data: bytes) -> str
  submission.py（纯函数）：validate_submission(doc, *, technique_id) -> dict
    返回深拷贝后的规范化提交件；异常一律 pipeline.ledger.errors.SchemaViolation（整件拒收）
    S1 doc 必须是 dict；顶层必填键 schema_version, category, lane, channel, technique_id, producer, items；可选 source_task, skipped, adapter_notes；其他顶层键 → SCH_002；缺必填 → SCH_001
    S2 schema_version == CANDIDATE_SCHEMA_VERSION，否则 SCH_002；technique_id == 参数 technique_id，否则 SCH_002
    S3 category ∈ CATEGORIES、lane ∈ LANES、channel ∈ CHANNELS，否则 SCH_002（本函数不判定渠道是否被首切片接受，那是 run_m4_submit 的职责）
    S4 producer 为 dict，必填 kind ∈ PRODUCER_KINDS、name 非空字符串；可选 model_id, prompt_sha256, response_sha256（缺省补 None）
    S5 items 为 list；每个 item 为 dict；键 ⊆ required ∪ optional（多出键 → SCH_002，message 含「类别混合」）；缺 required → SCH_001
    S6 evidence 为 list（可为空，空证据由装配阶段按 SEM_001 逐条拒收）；每条 dict，必填 source_span_id（str）、support_type ∈ SUPPORT_TYPES；可选 span_char_start 与 span_char_end（非负 int，必须成对出现，否则 SCH_001）、quote（非空 str）；其他键 → SCH_002
    S7 assertion：relation ∈ RELATIONS；layer 缺省补 "general" 且 ∈ LAYERS；conditions / exceptions / concept_refs / school_ids 缺省补 []，必须为 list
    S8 status 缺省补 None；status ∉ {None, "machine_extracted"} → SCH_002（message 含「状态越权」）
    S9 pattern：assertion_propositions 为非空 list[str]；interpretation 缺省补 None
    S10 school_view：subject 为 {"kind": "assertion"|"pattern", "key": 非空 str}；changes_current_judgment 为 bool；conflict_key 缺省补 None
    S11 concept_mention：concept_ref 缺省补 None
    S12 source_task 缺省补 None，skipped 缺省补 []，adapter_notes 缺省补 []
  adapters/__init__.py：空（中文模块 docstring：Adapter 只负责把外部形态转成提交件，产物必须先登记进 Ledger）
  adapters/task_pipeline.py：
    normalize_task_output(doc, *, category, lane, channel, technique_id, producer, source_task=None, seg_span_map=None) -> dict
      category == "assertion"：读 doc["assertions"]（缺失 → SchemaViolation SCH_001）；每条 a 生成 item：
        proposition = a["proposition"]；relation = a["relation"]；
        evidence = [{"source_span_id": e["source_span_id"], "support_type": e["support_type"]} 附带 e 中已有的 quote / span_char_start / span_char_end]
        conditions、exceptions、school_ids 原样（缺省 []）；concept_refs = a.get("concept_ids", [])；layer = a.get("layer", "general")；status = a.get("status")
        a 中出现 assertion_id / proposition_id / canon_refs → 丢弃，并各向 adapter_notes 追加一行「丢弃 <键>（M4 重新分配或首切片不收）」（按键名排序、去重）
        doc.get("skipped_segments", []) → 顶层 skipped 原样
      category == "concept_mention"：条目来源依次为 doc["new_concept_candidates"]、doc["concept_mentions"]（二者都缺 → SCH_001）；
        每条须含 surface 与 source_span_id 或 span_id；只有 seg_id 时经 seg_span_map 映射（映射缺失 → SchemaViolation SCH_001）；
        item = {"surface", "evidence": [{"source_span_id", "support_type": "direct", "quote": surface}], "concept_ref": 条目 concept_id 或 None}
      其他 category → SchemaViolation SCH_002（首切片 Adapter 只支持工位 4/5 形态）
      返回值必须经 validate_submission(…, technique_id=technique_id) 校验后返回；任何条目 status ∈ {cross_model_reviewed, expert_verified} → 由 validate_submission 抛 SCH_002
    export_task_inputs(spans_doc, *, out_dir, task_id, category, lane, technique_id, template_path, id_range, instruction_version, spans_revision_id=None) -> list[str]
      out_dir 已存在且非空 → ExtractionRefused(code="SCH_002")；只在 out_dir 内写文件
      写 INSTRUCTIONS.md = template_path 字节原样拷贝
      写 input/segments.yaml = {"segments": [{"seg_id": "s%03d" % (i+1), "span_id", "page", "text"} for i, span in enumerate(spans_doc["spans"])]}
      写 input/spans.yaml = {"spans": [{"seg_id", "span_id"}]}
      写 task.yaml = {"task_id", "stage": {"assertion": "assertions", "concept_mention": "concepts"}[category], "technique_id", "source_id": spans_doc["source_id"], "lane", "instruction_version", "id_range", "spans_revision_id", "note": "segments 取自 Ledger corpus_spans；产出经 normalize_task_output 登记"}
      YAML 序列化：yaml.safe_dump(obj, allow_unicode=True, sort_keys=False).encode("utf-8")
      返回写出的相对路径列表（按 ["INSTRUCTIONS.md", "input/segments.yaml", "input/spans.yaml", "task.yaml"] 顺序）
tests:
  test_submission.py: |
    统一读 tests/data/appendix_a/submission_assertion_a.yaml 作为基底，逐例 deepcopy 后篡改
    - test_valid_assertion_submission_passes（缺省字段补齐：conditions == []、status is None、source_task is None）
    - test_mixed_category_item_key_SCH_002（assertion item 加 surface）
    - test_missing_required_field_SCH_001
    - test_unknown_enum_values_SCH_002（category / lane / channel / relation / layer / support_type 各一次，subTest）
    - test_status_above_machine_extracted_SCH_002（cross_model_reviewed 与 expert_verified）
    - test_technique_id_mismatch_SCH_002
    - test_unpaired_span_char_range_SCH_001
    - test_school_view_subject_shape
    - test_concept_mention_fixture_submission_passes（submission_concept_mention_a.yaml）
  test_task_pipeline_adapter.py: |
    - test_normalize_handbook_assertions_doc（内联 SCHEMA.md §4 形态两条主张，含 assertion_id/proposition_id/concept_ids/canon_refs → 通过校验；adapter_notes 三行；concept_refs 来自 concept_ids）
    - test_skipped_segments_preserved
    - test_new_concept_candidates_become_concept_mention_items（quote == surface、concept_ref is None）
    - test_seg_id_without_map_SCH_001
    - test_normalize_rejects_expert_verified_status
    - test_export_task_inputs_writes_four_files_deterministic（读 fixture spans.yaml；两次导出到两个临时目录字节相同；segments 43 条且 span_id 与 spans.yaml 顺序一致；非空目录拒绝）
    - test_canonical_json_sort_keys_and_unicode
verify:
  - .venv/bin/python -m unittest discover -s pipeline/knowledge_extraction/tests -t . 2>&1 | grep -E "^(Ran|OK|FAILED)"   # OK，用例数 ≥ 16
  - grep -rE '_fixture' pipeline/knowledge_extraction --include='*.py' | grep -v '/tests/' | wc -l      # 0
  - grep -rE '^\s*(import|from) (requests|openai|anthropic|httpx)' pipeline/knowledge_extraction | wc -l   # 0
  - grep -rE 'pipeline\.(validators|tools|runner)|from validators|from tools' pipeline/knowledge_extraction --include='*.py' | wc -l   # 0
  - TDD §3 回归
commit:
  add: [pipeline/knowledge_extraction]
  message: "feat(m4): candidate submission contract and task-pipeline adapter (spec §12.2, thin no-model slice)"
on_fail: 停止并报告；附录 A 文字存在两种展开方式时不得自选，报告差异处
