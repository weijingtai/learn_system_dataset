act_id: impl-08/04
title: StepRun 执行器 execute_step（§7 execute 落点）+ EditionRun：start / adopt / advance / run_until / edition_status + legacy 绑定
estimated_minutes: 90
group: K2
depends_on: [impl-08/03]
scope:
  write: [pipeline/orchestrator/runner.py, pipeline/orchestrator/edition_run.py, pipeline/orchestrator/tests/test_runner.py, pipeline/orchestrator/tests/test_edition_run.py]
tests_first:
  - 先写 tests/test_runner.py 与 tests/test_edition_run.py（用例名逐字），全红后再实现
contract: |
  runner.py：
    FAILURE_CHECKS = ("module_exception", "outcome_contract")
    execute_step(port, binding, request, context) -> dict StepResult   # §7 execute(StepRequest) → StepResult
      前置：StepRun 已由调用方 begin（fresh/rerun）或已回到 running（resumed/recovered）
      try：outcome = binding.target.execute(PortGuard(port), request, context)
      except Exception as exc → return _seal_failure(port, request, "module_exception", "%s: %s" % (类名, exc))
      problems = validate_outcome(outcome)；非空 → return _seal_failure(port, request, "outcome_contract", "; ".join(problems))
      return finalize_outcome(port, request, outcome)
    finalize_outcome(port, request, outcome) -> dict StepResult（返回前一律 jsonschema 校验 step_result.schema.json，失败抛 SchemaViolation(SCH_001)）
      base = {"schema_version": "1.0.0", "processing_run_id": request.processing_run_id, "step_run_id": request.step_run_id} + OUTCOME_LIST_KEYS 四列表
      succeeded：result = base + {"status": "succeeded", "status_version": get_step_run(step)["status_version"] + 1}；port.finish_step_run(step, result)；return result
        （finish_step_run 抛 LedgerError → _seal_failure(… "outcome_contract", 异常文本)）
      failed：port.fail_step_run(step, outcome.failure_artifact_ids, "module failed")；result = base + {"status": "failed", "status_version": 迁移后 get_step_run 值}
      awaiting_human：token = port.await_human(step, outcome.pending_queue_artifact_ids)；
        result = base + {"status": "awaiting_human", "status_version": 迁移后值, "resume_token": token, "pending_queue_artifact_ids": list(...)}
    _seal_failure(port, request, check, detail) -> StepResult：put_artifact(step, "failure_report", json {"check", "detail"}（sort_keys, ensure_ascii False）,
      producer_module=ORCH_TOOL, producer_version=ORCH_TOOL_VERSION) → seal → fail_step_run(step, [rev], "orchestrator %s: %s" % (check, detail)) → failed StepResult（failure_artifact_ids=[rev]，其余列表为空）
    run_legacy(port, binding, handle) -> dict StepResult
      service = port.unwrap()（NotImplementedError → OrchestratorRefused("legacy_self_driving 需要直连 Ledger Adapter")，零写入）
      summary = binding.target(service, handle["edition_part_id"])；入口抛异常 → 原样包装为 OrchestratorRefused（message 含异常类名；此时入口承诺 begin 之前零写入）
      step = port.get_step_run(summary["step_run_id"])；step.processing_run_id != handle.processing_run_id → OrchestratorRefused
      succeeded：result = json.loads(step.result_json)，校验 Schema 后返回
      failed：从 list_step_run_events 的 failure 事件 payload 取 failure_revision_ids，构造 failed StepResult（status_version 取当前值）并校验 Schema
      其他状态 → OrchestratorRefused
  edition_run.py：
    start_edition_run(port, *, edition_part_id, technique_id) -> handle（port.create_processing_run("edition_run", edition_part_id, technique_id)）
    adopt_edition_run(port, *, processing_run_id, edition_part_id, technique_id) -> handle
      交叉校验：run_status 可读；每个 StepRun 的 request.technique_profile_id == technique_id；
      EDITION_STAGES 中已有 Checkpoint 的 stage，其 latest_checkpoint(ep, stage).step_run_id 属于本运行；任一不符 → OrchestratorRefused，零写入
    ADVANCE_ACTIONS = ("executed", "waiting", "blocked", "refused", "complete")
    advance(port, registry, handle, *, modules=None) -> dict
      返回键（逐字）：action, stage, step_run_id, step_result, gate, reason
      for stage in EDITION_STAGES：
        gate = evaluate_stage_gate(port, registry, handle, stage)；passed → continue
        eff = effective_step_runs(...)
        有 status ∈ {running, awaiting_human, suspended} → action waiting（step_run_id 取首个），零写入
        有 failed → action blocked，reason "存在失败未重跑的 StepRun"，零写入
        eff 非空（全 succeeded）→ action blocked，reason = 首个失败检查名，零写入
        descriptor = registry.module_for(stage)；None → refused，reason "阶段 %s 未登记 Module（%s）" % (stage, registry.stage_rows[stage])
        binding = bind_module(descriptor, modules=modules)；imported → refused，reason 含 "imported"
        legacy_self_driving → step_result = run_legacy(...)；action executed
        step_request →
          planned = binding.target.plan(PortGuard(port), edition_part_id=, processing_run_id=, technique_id=, upstream={s: [succeeded 有效 StepRun] for s in 早于 stage 的 EDITION_STAGES})
          写入前校验（任一不符 → refused，零写入）：configuration 为 dict 且 stage == descriptor.stage 且 module_id == descriptor.module_id；
            input_artifact_ids 全部 get_revision 存在且 status == "sealed"
          config_rev = port.put_run_artifact(prun, "configuration", json.dumps(configuration, sort_keys=True, ensure_ascii=False).encode(), producer_module=descriptor.module_id, producer_version=descriptor.version)[1]
          request = {"schema_version": "1.0.0", "processing_run_id", "step_run_id": ids.new_id("step_run_id"), "input_artifact_ids", "technique_profile_id": handle.technique_id, "configuration_artifact_id": config_rev}
          jsonschema 校验 step_request → port.begin_step_run(request)
          stage != "m1" → 上游 gate（EDITION_STAGES 前一项）以 put_artifact(step, "stage_gate_report", json.dumps(上游 gate, sort_keys=True, ensure_ascii=False).encode(), producer_module=ORCH_TOOL, producer_version=ORCH_TOOL_VERSION) 写入并 seal（本 StepRun 首个 artifact）
          step_result = execute_step(port, binding, request, StepContext(mode="fresh", edition_part_id, stage, module_id))
          action executed，gate = 执行前本阶段 gate
        return
      全部 passed → action complete，stage None
    run_until(port, registry, handle, stage, *, modules=None, max_steps=16) -> list[dict]
      循环 advance：遇 action != "executed" 停；或 executed 后 step_result.status != "succeeded" 停；或目标 stage 的 gate 已 passed 停；超过 max_steps → OrchestratorRefused
    edition_status(port, registry, handles) -> dict {"complete": bool, "parts": {edition_part_id: "complete"|"incomplete"}}
      某 Part complete ⇔ EDITION_STAGES 六个 gate 全 passed；Edition complete ⇔ 全部 Part complete 且 handles 非空（§6.1 :149 合取）
tests:
  test_runner.py: |
    - test_execute_step_succeeded_result_validates_schema_and_finishes
    - test_execute_step_failed_result_validates_schema
    - test_execute_step_awaiting_human_has_token_and_pending
    - test_module_exception_sealed_as_failure_report
    - test_outcome_contract_violation_sealed_as_failure_report
    - test_finish_rejection_converted_to_failed（桩返回别的 StepRun 的修订作为输出 → finish_step_run 抛错 → failed，check outcome_contract）
    - test_module_receives_port_guard（桩在 execute 内访问 port.store → module_exception）
    - test_run_legacy_rebuilds_result_from_ledger（测试内假入口：用 service 自建配置+StepRun+StagePackage 并 finish）
    - test_run_legacy_refused_before_begin_zero_writes（假入口直接 raise → OrchestratorRefused；三表行数不变）
    - test_run_legacy_refused_on_ledgerd_adapter（LedgerdClientAdapter 或 unwrap 抛 NotImplementedError 的替身）
  test_edition_run.py: |
    统一脚手架：桩 m1–m6（modules= 注入，Registry.from_dict allow_stub=True）+ DirectLedgerAdapter 临时 Ledger + start_edition_run
    - test_run_until_m6_all_executed_then_complete
    - test_downstream_first_artifact_is_upstream_gate_report_passed
    - test_downstream_frozen_inputs_include_upstream_stage_package
    - test_failed_m3_blocks_and_no_m4_step_run
    - test_blocked_advance_is_zero_write
    - test_awaiting_human_m2_then_waiting_zero_write
    - test_unregistered_stage_refused_with_section_19_row_name（删去 m4 桩登记 → reason 含 "M4 Knowledge Extraction"）
    - test_imported_stage_without_tasks_refused
    - test_plan_config_stage_mismatch_refused_before_write
    - test_plan_unsealed_input_refused_before_write
    - test_adopt_rejects_foreign_technique
    - test_edition_status_conjunction_two_parts
verify:
  - .venv/bin/python -m unittest discover -s pipeline/orchestrator/tests -t . 2>&1 | tail -3   # OK，用例数 ≥ 42
  - grep -rnE '\.store\b|\.objects\b' pipeline/orchestrator --include='*.py' | grep -v '/tests/' | wc -l   # 0
  - export LC_ALL=en_US.UTF-8; bash openspec/acceptance/run_all.sh | tail -1                           # SUMMARY pass=2 fail=1 blocked=8
  - TDD §3 回归
commit:
  add: [pipeline/orchestrator/runner.py, pipeline/orchestrator/edition_run.py, pipeline/orchestrator/tests/test_runner.py, pipeline/orchestrator/tests/test_edition_run.py]
  message: "feat(orchestrator): step executor mapping StepRequest to schema-valid StepResult and gated EditionRun advance (spec §6.1/§7/§17)"
on_fail: 停止并报告；status_version 语义与 Ledger 实际不符、begin_step_run 拒绝合法请求时不得改 Ledger
