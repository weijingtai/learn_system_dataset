package: blackbox-impl-00-interfaces
title: 跨模块接口契约：INTERFACES §4 临时闭集登记与首纵切裁决对齐（按 G7 裁决裁剪）
status: READY_FOR_REVIEW   # W2-C1 定稿 2026-09-12，依 G7-RULINGS §9；仅 impl-00/10 可派
risk: low      # 首纵切只改 INTERFACES.md 与本目录；openspec/schemas、fixture、ledger 一字不动
executor_groups:
  K1: [impl-00/10]                                  # 首纵切唯一 ACT
deferred_groups:   # 原分组保留，全部 DEFERRED，纵切后另立波次（见 README §5）
  K1: [impl-00/00, impl-00/01, impl-00/02, impl-00/03, impl-00/04]
  K2: [impl-00/05, impl-00/06, impl-00/07, impl-00/08]
  K3: [impl-00/09]
decisions_required:   # 全部裁决已由主 Agent 写入 README §4（执行者不重议）；本 ACT 无新增待裁决
  impl-00/10: []
