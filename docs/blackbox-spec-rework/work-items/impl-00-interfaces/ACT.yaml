global_rules:
  - 首纵切只允许写 ACT 10 的 scope.write；ACT 12（M4 闭集登记）与 ACT 05（m4 金标）为 W4 独占 ACT，不在首纵切执行，各自执行时只写其 scope.write
  - openspec/schemas、pipeline/ledger、pipeline/corpus_compiler、pipeline/validation、pipeline/dataset_compiler、openspec/acceptance 一律一字不动；ACT 05 是 W4 内唯一写 pipeline/corpus/_fixture/mini_ed01/ 的 ACT（P4）
  - 每个 ACT 先取得 Red 再实现；Red 原文与 Green 输出写报告
  - 只用标准库（check_interfaces.py 不 import yaml/jsonschema）；不新增依赖、不新增 ID 前缀、不调用模型 API（P6/P8）
  - INTERFACES.md 的 §4 闭集名称逐字取 README §5.1 与 impl-05 定稿；不得使用未入闭集的类型名（P2）
  - ACT 05 的金标不得由 impl-05 实现方生成（不得 import pipeline.knowledge_extraction，§9.6 第 48 条）
  - 中文注释与 docstring；公开函数名、检查名、常量名与 ACT contract 逐字一致
  - 每个 ACT 一个提交；只 add scope.write 中的路径；不得 git add -A / git add .；不得写台账或 ACCEPTED
  - DEFERRED 的 ACT（00–04、06–09）在本波不执行；其 act 文件保留原样，仅由 ACT.yaml 标 status: DEFERRED
gates:
  - python3 docs/blackbox-spec-rework/work-items/impl-00-interfaces/check_interfaces.py; echo exit=$?   # 末行 fail=0 且 exit=0；所需类型 PASS 行存在（第 54 条，不写死 pass 总数）
  - .venv/bin/python -m unittest discover -s docs/blackbox-spec-rework/work-items/impl-00-interfaces/tests -t docs/blackbox-spec-rework/work-items/impl-00-interfaces 2>&1 | grep -E "^(Ran|OK|FAILED)"   # OK
  - export LC_ALL=en_US.UTF-8; bash pipeline/corpus/_fixture/mini_ed01/verify.sh | tail -1   # ACT 05 后：FIXTURE OK（11 项）
  - bash openspec/schemas/verify.sh >/dev/null; echo $?                     # 0（未改 schemas）
  - export LC_ALL=en_US.UTF-8; bash openspec/acceptance/run_all.sh | tail -1   # SUMMARY pass=2 fail=1 blocked=8（未改 acceptance）
  - git status --short openspec/schemas pipeline/ledger   # 空（未写热点；fixture 仅 ACT 05 写）
  - git diff --check
on_fail: 停止并报告；§4 闭集名称与 README §5.1/impl-05 不一致、impl-05 引用到未登记类型、需要写 scope 外文件、需要改 schemas/ledger 才能通过、ACT 05 金标需 impl-05 代码 → 一律停手上报
