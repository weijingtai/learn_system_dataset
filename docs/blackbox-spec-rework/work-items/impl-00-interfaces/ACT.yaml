global_rules:
  - 首纵切只允许写 ACT 10 的 scope.write；openspec/schemas、pipeline/corpus/_fixture、pipeline/ledger、pipeline/corpus_compiler、pipeline/validation、pipeline/dataset_compiler、openspec/acceptance 一律一字不动
  - 每个 ACT 先取得 Red 再实现；Red 原文与 Green 输出写报告
  - 只用标准库（check_interfaces.py 不 import yaml/jsonschema）；不新增依赖、不新增 ID 前缀、不调用模型 API（P6/P8）
  - INTERFACES.md 的 §4 闭集名称逐字取 README §5.1；不得使用未入闭集的类型名（P2）
  - 中文注释与 docstring；公开函数名、检查名、常量名与 ACT contract 逐字一致
  - 每个 ACT 一个提交；只 add scope.write 中的路径；不得 git add -A / git add .；不得写台账或 ACCEPTED
  - DEFERRED 的 ACT（00–09）在本波不执行；其 act 文件保留原样，仅由 ACT.yaml 标 status: DEFERRED
gates:
  - python3 docs/blackbox-spec-rework/work-items/impl-00-interfaces/check_interfaces.py; echo exit=$?   # exit=0，末行 I00-IF SUMMARY pass=<n> fail=0
  - .venv/bin/python -m unittest discover -s docs/blackbox-spec-rework/work-items/impl-00-interfaces/tests -t docs/blackbox-spec-rework/work-items/impl-00-interfaces 2>&1 | tail -3   # OK
  - bash openspec/schemas/verify.sh >/dev/null; echo $?                     # 0（未改 schemas）
  - export LC_ALL=en_US.UTF-8; bash openspec/acceptance/run_all.sh | tail -1   # SUMMARY pass=2 fail=1 blocked=8（未改 acceptance）
  - git status --short openspec/schemas pipeline/corpus/_fixture pipeline/ledger   # 空（未写热点）
  - git diff --check
on_fail: 停止并报告；§4 闭集名称与 README §5.1 不一致、impl-03/impl-04 引用到未登记类型、需要写 scope 外文件、需要改 schemas/fixture/ledger 才能通过 → 一律停手上报
