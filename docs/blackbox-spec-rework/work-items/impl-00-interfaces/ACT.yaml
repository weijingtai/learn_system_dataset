global_rules:
  - 每个 ACT 先取得 Red（check_i00.py 对应项 FAIL 或测试 ERROR，原文写入报告）再实现
  - 只用标准库 + PyYAML + jsonschema（+ 现有 .venv 的 check-jsonschema CLI）；不新增依赖、不新增 ID 前缀、不调用模型 API
  - 不得修改 manifest.yaml、spans.yaml、anomalies.yaml、pages/、source/、expected/m1..m3 的任何字节；fixture 内不得出现图像
  - 不得修改 artifact_ref / stage_package / step_request / step_result 四份 L0 Schema；openspec/schemas/verify.sh 只能在末尾追加
  - fixture 的 verify.sh 是生成物：只能改 build_fixture.py 中的 VERIFY_SH 模板后重新生成，禁止手改 verify.sh
  - 每次改动生成器后，必须把重放 diff 为空作为提交前条件（TDD §0 最后一行）
  - Schema 文件为 2 空格缩进 JSON、键序与 contract 列表一致；description 用中文
  - 中文注释与 docstring；contract 中的文件名、$defs 名、键名、检查名、枚举值逐字一致
  - 每个 ACT 一个提交；只 add scope.write 中的路径；不得 git add -A / git add .；不得写台账或 ACCEPTED
gates:
  - bash docs/blackbox-spec-rework/verify-T.sh | tail -1                           # FAIL 合计: 0
  - bash docs/blackbox-spec-rework/work-items/g3-r3/mutations.sh all | tail -1     # 109/109
  - bash openspec/schemas/verify.sh >/dev/null; echo $?                            # 0
  - python3 docs/blackbox-spec-rework/work-items/g4-r3/check_d16.py                # D16 OK
  - .venv/bin/python -m unittest discover -s pipeline/ledger/tests -t .            # OK
  - .venv/bin/python -m unittest discover -s pipeline/corpus_compiler/tests -t .   # OK
  - .venv/bin/python docs/blackbox-spec-rework/work-items/impl-00-interfaces/check_i00.py --upto <本 ACT 号> | tail -1   # fail=0
  - export LC_ALL=en_US.UTF-8; bash pipeline/corpus/_fixture/mini_ed01/verify.sh | tail -1   # FIXTURE OK
  - export LC_ALL=en_US.UTF-8; bash openspec/acceptance/run_all.sh | tail -1       # SUMMARY pass=2 fail=1 blocked=8
  - export LC_ALL=en_US.UTF-8; bash openspec/acceptance/m3-coverage.sh >/dev/null; echo $?   # 2
  - git diff --check
on_fail: 停止并报告；contract 有两种理解、金标内容与 spans/transcript 对不上、需要改 scope 外文件、五个基线哈希任一变化、重放 diff 非空 → 一律停手上报，不得「顺手」修 fixture
