  - python3 docs/blackbox-spec-rework/work-items/impl-00-interfaces/check_interfaces.py; echo exit=$?   # 末行 fail=0 且 exit=0；IF25–IF28 四个 PASS 行存在（第 54 条，不写死 pass 总数）
