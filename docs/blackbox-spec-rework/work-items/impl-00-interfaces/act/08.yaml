contract: |
  只改 build_fixture.py 中的 VERIFY_SH 模板字符串与 fixture README.md（人工维护文本）；verify.sh 一律重新生成，禁止手改
  V1、V3、V4、V7、V8 不变；输出顺序 V1…V8、V9、V10、V11、V12；末行 FIXTURE OK；缺页图时相关项 SKIP/BLOCKED、exit 3
  V2 ids 扩展：ID_RULES 增加 co_shared_（先于 co_）、co_、as_、pr_、ent_、rel_、sch_、sv_、cg_、pat_；
    收集所有以 _id / _ids 结尾的键以及 entity_id 的字符串值，排除 technique_id, line_id, glyph_id, glyph_ids, task_id
  V5 expected_schema 扩展：m1–m8 StagePackage 过 stage_package.schema.json；m4–m8 payload 过 stage_payload_mN；
    每个内容文件过对应 Schema（m6 决定过 review_decision；m8 子包过同名 Schema；release_validation_report 过 gate_results）
  V6 expected_hash 扩展：m4–m8 的 content_sha256 == sha256(主内容文件字节)；counts 由内容独立重算；
    m7 与 release_manifest 的 canonical_hash 按 INTERFACES §3.7 规则重算且相等
  V9 stage_chain（新）：m2–m8 各自 manifest.input_artifacts 含上一阶段 output_artifacts[0]；
    lineage.transformations[0].input_artifact_revision_ids == [x.artifact_revision_id for x in input_artifacts]；
    m1–m6 的 processing_run_id 为 f1、m7–m8 为 f7；每个 payload 的 *_revision_id 能在 FIXTURE-PLAN §2.3 常量表中找到
  V10 evidence_closure（新）：证据 span 存在；0 ≤ char_start < char_end ≤ len(text)；quote 等于切片；quote_sha256 正确；
    每条主张至少 1 条证据（SEM_001）；co_/as_/pr_ 不重复（ID_002）；主体存在；mention 召回与精确均 100%；
    m6 决定的 target 存在且修订号正确；approved 集合 == 被接受的 co_/as_ 目标；m7 concepts/assertions 与 m6 approved 一致且逐字等于 m4
  V11 publication_chain（新）：entries.assertion_ids 非空且属于 m7；chain 键序恰为 7 段固定顺序；chain 集合 ==
    由 entries×evidence 推出的集合；source_span/source_anchor 等于 spans.yaml；glyph_id 属于 pages/<页>.json；image_sha256 等于 manifest；
    所有 bbox 与字框落在 [0,width]×[0,height]；subpacks 的 sha256/byte_size 等于文件且恰 6 项；
    INTERNAL_DEMO 须带水印且 known_defects 非空；source_release != dev；锚点稳定性映射逐字相同
  V12 expected_sums（新）：SHA256SUMS 覆盖集合 == expected/ 实际文件集合（不含自身），每行哈希相等
  生成后必须 `diff -r --exclude=tools --exclude=README.md` 为空作为提交前条件（verify.sh 是生成物）
  fixture_mutations.sh（新建，权限 755）：
    按 FIXTURE-PLAN §5.2 的 20 例；执行方式：复制规范 fixture 到 tempfile 目录 → 施加篡改 →（除标注「不修哈希」者外）
      按规则修复受影响阶段包的 content_sha256 与 SHA256SUMS → `FIXTURE_DIR=<副本> bash <仓库>/规范 verify.sh` →
      要求退出码 1，且指定检查名出现在 FAIL 行；输出每例一行 `PASS Mnn <检查名>` / `FAIL Mnn <原因>`，末行 `MUTATIONS <通过数>/20`；
      全部通过 exit 0，否则 exit 1；.venv 缺失 exit 3
    20 例逐一对应 FIXTURE-PLAN §5.2 表（01 m4 quote 改字→evidence_closure；…；20 SHA256SUMS 改一位（不修哈希）→expected_sums）
  fixture README.md：登记 12 项检查名、20 例矩阵的入口与用法、五个基线哈希、SHA256SUMS 冻结说明、页图缺失时 exit 3 的语义
