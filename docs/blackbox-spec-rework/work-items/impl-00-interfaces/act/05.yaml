act_id: impl-00/05
status: READY_FOR_REVIEW   # W4-G 起草 2026-09-13，依 G7-RULINGS §9.6 第 48 条与 §9.7 第 52 条（P4 独占 + P7 合成标记）；原 m5 部分删除；未经执行
title: mini_ed01 m4 金标与 verify.sh 对应扩展（仅 m4；独占 ACT，P4）
estimated_minutes: 60
group: W4G
depends_on: [impl-00/12]   # act/12 先于 act/05；M4 类型登记后本 ACT 才落地
decisions_required: []     # 已由 G7-RULINGS §9.6 第 48 条、§9.7 第 52 条与 impl-05 定稿裁决；执行者不重议
scope:
  write: [pipeline/corpus/_fixture/mini_ed01/m4/submission_assertion_a.yaml, pipeline/corpus/_fixture/mini_ed01/m4/submission_assertion_b.yaml, pipeline/corpus/_fixture/mini_ed01/m4/submission_concept_mention_a.yaml, pipeline/corpus/_fixture/mini_ed01/m4/ruling_m4_d001.yaml, pipeline/corpus/_fixture/mini_ed01/m4/candidate_set.yaml, pipeline/corpus/_fixture/mini_ed01/m4/build_expected_m4.py, pipeline/corpus/_fixture/mini_ed01/m4/SHA256SUMS, pipeline/corpus/_fixture/mini_ed01/m4/README.md, pipeline/corpus/_fixture/mini_ed01/expected/m4.stage_package.yaml, pipeline/corpus/_fixture/mini_ed01/verify.sh]
tests_first:
  - 先写 m4 四个输入金标、candidate_set.yaml、build_expected_m4.py、SHA256SUMS、README；运行 build_expected_m4.py 两次比对字节；再扩 verify.sh；`bash verify.sh` 在 m4 文件齐备前应 FAIL（Red 原文入报告）
contract: |
  独占 ACT（P4）：本 ACT 是本波唯一写 `pipeline/corpus/_fixture/mini_ed01/` 的 ACT。只写 scope.write 列出的路径；不得写 `expected/m1..m3`、`manifest.yaml`、`spans.yaml`、`pages/**`、`source/**`、`anomalies.yaml`、`tools/**`；不得改 `tools/build_fixture.py`（m1–m3 生成器与字节冻结）。
  **金标不得由 impl-05 实现方生成**（G7-RULINGS §9.6 第 48 条）：本 ACT 不得 import `pipeline.knowledge_extraction`、不得运行 impl-05 代码；内容按 impl-05 定稿 README 附录 A 的期望手写/独立生成。
  1. 四个输入金标（YAML，无 uuid/时间/随机）：
     `m4/submission_assertion_a.yaml`、`m4/submission_assertion_b.yaml`、`m4/submission_concept_mention_a.yaml` 三件提交件**逐字取 impl-05 README 附录 A**；
     `m4/ruling_m4_d001.yaml` 按 G7-RULINGS §9.7 第 52 条与 §9.8 第 55 条，在附录 A 四键（schema_version/dispute_id/choice/rationale）基础上追加 `synthetic_fixture: true` 与 `actor_ref: fixture:mini_ed01` 两键（W2 订正）——impl-05 附录 A、`act/00` 的 `tests/data/appendix_a/ruling_m4_d001.yaml` 与 `act/07` 的字节等同期望已随 impl-05 返工（`d982dd6`）同步为同一六键内容；impl-05 `record_category_ruling` 的键集契约放宽为「⊇ 四键、⊆ 六键」（§9.7 第 53 条，随 impl-05 返工落地）
  2. `m4/candidate_set.yaml`：按 impl-05 README 附录 A「期望结果」冻结的 canonical 内容——`counts = {assertions: 2, patterns: 0, school_views: 0, concept_mentions: 0, new_concept_candidates: 2, rejected: 1, disputes: 1, human_decisions: 1}`；断言 `as_qizheng_000001`「宋錢如璧撰」（证据 s02 [8,12]、s04 [27,32]）、`as_qizheng_000002`「三辰通載三十卷」（证据 s04 [20,27]）；`new_concept_candidates`「身宮」s12 [68,70]、「官祿宮」s19 [119,122]；`rejected` 1 条 assertion/b/item_index 2/TXT_001；`disputes` 1 条 `m4_d001`（key `[[ss_sanche_ed01_p0001_s02,8,12],[ss_sanche_ed01_p0001_s04,27,32]]`，choice a）。其字节即 `manifest.content_sha256` 的被哈希对象。存储格式钉死（W4）：`m4/candidate_set.yaml` 虽以 `.yaml` 命名，内容为 **canonical JSON 字节**——`json.dumps(obj, sort_keys=True, ensure_ascii=False, separators=(",", ":"), allow_nan=False).encode("utf-8")`，与 impl-05 act/00 修复后的 `canonical_json` 逐字同一函数规则
  3. `m4/build_expected_m4.py`（stdlib only，确定性）：读 `m4/candidate_set.yaml` 字节与四个输入金标，产出 `expected/m4.stage_package.yaml`（信封键序逐字；`stage: m4`；`payload` 含 `candidate_set_revision_id, corpus_stage_package_revision_id, spans_revision_id, technique_profile_revision_id, gate_profile: "thin_no_model", span_layer: "structural", cross_model: "not_evaluated", term_layering: "verify_only", content_status_counts`；`manifest.content_sha256 = sha256(candidate_set 字节)`；`manifest.counts = candidate_set.counts`；`validation.passed: true`）。信封须含 stage_package.schema.json 全部 required 键（W5）：`stage_package_id`/`artifact_revision_id` 用固定占位 hex（如 `pkg_m4_00000000000000000000000000000000` / `rev_00000000000000000000000000000000`）；`manifest.processing_run_id`/`step_run_id` 用固定占位 `prun_…`/`srun_…`；`manifest.input_artifacts`/`output_artifacts` 与 `lineage.upstream_artifacts`/`transformations` 用最小占位 ArtifactRef；`logs`/`failures` 为空数组。impl-05 act/07 的 `golden_match` 只比对 counts / `manifest.content_sha256` / payload 四个标量 / assertions 的 (assertion_id, proposition) 列表，**不比对任何 ID/lineage/logs 字段**。两次运行字节相同；不 import `pipeline.knowledge_extraction`；无 uuid/时间/随机
  4. SHA 冻结：`m4/SHA256SUMS` 记录四个输入金标 + `candidate_set.yaml` + `expected/m4.stage_package.yaml` 的 sha256（格式 `<hex>  m4/<file>` / `<hex>  expected/m4.stage_package.yaml`，**相对 fixture 目录 `pipeline/corpus/_fixture/mini_ed01/`**，按路径排序；生成与复算都在该目录 CWD 下进行，W1 订正）；verify.sh V9 在 `$FIX` 内复算比对
  5. `m4/README.md` 登记：（a）三件提交件逐字来自 impl-05 README 附录 A；裁决件 `ruling_m4_d001.yaml` 为附录 A 四键加第 52 条两键（同 impl-05 附录 A 修订后内容）；（b）`expected/m4.stage_package.yaml` 由 `build_expected_m4.py` 确定性产出；（c）`SHA256SUMS` 冻结方式（fixture 目录相对路径）；（d）**本 ACT 为独占、金标不由 impl-05 实现方生成**（§9.6 第 48 条）；（e）impl-05 K4 以本目录为 `--gold-dir`；（f）**§9.7 第 52 条（P7）**：m4 下人工裁决/签发类金标均为测试合成（含 `synthetic_fixture: true`，`actor_ref` 为 fixture 作者），**仅供验收宿主，不计入真实 `expert_verified`、不得进入任何发布级别判定**，验收与实现不得把它当作真实人工决定
  6. `verify.sh` 扩展（8 → 11 项；m1–m3 判定结论不变——仍全 PASS、末行仍 `FIXTURE OK`；V5/V6 的 emit 文本按本条同步为 `m1/m2/m3/m4`，W6 订正）：
     - V5 `expected_schema`：循环由 `("m1", "m2", "m3")` 扩为 `("m1", "m2", "m3", "m4")`；emit 文本同步为 `m1/m2/m3/m4`
     - V6 `expected_hash`：对 m4 追加 `m4_hash = sha256_file("m4/candidate_set.yaml")`，m4 counts 由 candidate_set 计算，与 `expected/m4.stage_package.yaml` 的 `manifest.content_sha256`、`manifest.counts` 比对
     - V9 `m4_sha256sums`：在 `$FIX`（fixture 目录）CWD 下 `shasum -a 256 -c m4/SHA256SUMS` 全绿（与条目 4 的 fixture 相对路径基准一致）
     - V10 `m4_submission_closed_set`：四件输入金标的 category/lane/channel 取闭集；A 路与 concept_mention 的 evidence quote 逐字等于 spans.yaml 对应 Span 区间文本（B 路 item2 的 `錢如璧撰述` 不在 Span 内属预期，不参与本项）
     - V11 `m4_synthetic_human_events`（§9.7 第 52 条；W4 订正）：只探测含 `event_kind:` 的人工事件文件（命名约定 `m4/ruling_*.yaml`）；`candidate_set.yaml` 为 canonical JSON 字节、其 `disputes[].dispute_id` 键不参与本项；凡命中文件必须含 `synthetic_fixture: true` 且 `actor_ref: fixture:mini_ed01`，否则 FAIL
verify:
  - T=$(mktemp -d); .venv/bin/python pipeline/corpus/_fixture/mini_ed01/m4/build_expected_m4.py --out $T/a >/dev/null && .venv/bin/python pipeline/corpus/_fixture/mini_ed01/m4/build_expected_m4.py --out $T/b >/dev/null && diff -r $T/a $T/b; echo twice=$?   # twice=0
  - export LC_ALL=en_US.UTF-8; bash pipeline/corpus/_fixture/mini_ed01/verify.sh | tail -1   # FIXTURE OK
  - bash pipeline/corpus/_fixture/mini_ed01/verify.sh 2>&1 | grep -c '^PASS'   # ≥ 11
  - (cd pipeline/corpus/_fixture/mini_ed01 && shasum -a 256 -c m4/SHA256SUMS >/dev/null); echo $?   # 0
  - for f in pipeline/corpus/_fixture/mini_ed01/m4/ruling_*.yaml; do grep -q 'synthetic_fixture: true' "$f" || echo "MISSING $f"; done   # 无输出（只探测人工事件文件 ruling_*.yaml；candidate_set.yaml 不参与，§9.7 第 52 条 / W4）
  - grep -c 'pipeline.knowledge_extraction' pipeline/corpus/_fixture/mini_ed01/m4/build_expected_m4.py   # 0（grep 无匹配 exit 1 属预期）
  - git status --short pipeline/corpus/_fixture/mini_ed01/tools pipeline/corpus/_fixture/mini_ed01/expected/m1.stage_package.yaml pipeline/corpus/_fixture/mini_ed01/manifest.yaml pipeline/corpus/_fixture/mini_ed01/spans.yaml   # 空（热点未动）
  - shasum -a 256 pipeline/corpus/_fixture/mini_ed01/spans.yaml   # ec6d77b90aa1408d040465babc28a81f59aadf6d6edd9ba8db66ff8ead0b44ef（不变）
  - git diff --check
commit:
  add: [pipeline/corpus/_fixture/mini_ed01/m4, pipeline/corpus/_fixture/mini_ed01/expected/m4.stage_package.yaml, pipeline/corpus/_fixture/mini_ed01/verify.sh]
  message: "fixture(mini_ed01): m4 golden set and verify extension (exclusive act, not generated by impl-05)"
on_fail: 停止并报告；m1–m3 任一字节/哈希变化、需改 tools/build_fixture.py、需写 m4 之外的 fixture 路径、金标需 impl-05 代码、m4 人工事件金标缺 `synthetic_fixture` 标记（§9.7 第 52 条）→ 停手上报
