act_id: t06/01
title: M4 本机模型适配器 —— 阶段 A 探测 → 阶段 B 用户裁决（停手）→ 阶段 C 实现（用户批准后）
estimated_minutes: 480
group: T06
depends_on: []
decisions: []
scope:
  write:
    # 阶段 A：只写这两份记录文件，不动任何生产代码
    - docs/handoff/T06-phase-a.md
    - docs/handoff/T06.report.md
    # 阶段 C（仅当用户在阶段 B 批准后才允许写下面这些；阶段 A/B 阶段绝不能碰）
    - pipeline/knowledge_extraction/adapters/freebuff.py
    - pipeline/knowledge_extraction/adapters/opencode.py
    - pipeline/knowledge_extraction/adapters/task_pipeline.py
    - pipeline/knowledge_extraction/__init__.py
    - pipeline/knowledge_extraction/submit.py
    - pipeline/knowledge_extraction/acceptance.py
    - pipeline/knowledge_extraction/tests/test_model_adapter_freebuff.py
    - pipeline/knowledge_extraction/tests/test_model_adapter_opencode.py
    - pipeline/knowledge_extraction/tests/test_task_pipeline_adapter.py
    - pipeline/knowledge_extraction/tests/test_submit.py
    - pipeline/knowledge_extraction/tests/test_acceptance.py
    - pipeline/knowledge_extraction/tests/data/fake_models/
  read_only:
    - pipeline/corpus/_fixture/qianyuan_ed01_text/           # 真书宿主，六份提交件与 brief.md 一字不动
    - pipeline/corpus/_fixture/mini_ed01/                    # 金标，一字不动
    - pipeline/knowledge_extraction/entry.py                 # T04 调度器接线，不改
    - pipeline/knowledge_extraction/step.py                  # 不改 run_m4/resume_m4 签名
    - pipeline/knowledge_extraction/inputs.py
    - pipeline/knowledge_extraction/submission.py
    - pipeline/knowledge_extraction/review_events.py
