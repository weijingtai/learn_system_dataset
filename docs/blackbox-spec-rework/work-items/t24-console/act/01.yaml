act_id: t24-console/01
title: Web 控制台接真流程 —— 后端换真管道 + 前端换真 API（电子文本路线，M4/M6 全走界面）
estimated_minutes: 900
group: T24
depends_on: []
decisions: [规格 P7, G7-RULINGS 第104条D1, TODO.md T24, ASK-2026-09-26.reply.md 第1题, 用户2026-09-26裁决resume_token候选B]
scope:
