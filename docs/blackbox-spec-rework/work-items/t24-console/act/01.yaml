on_fail: |
  停止并报告，不许提交红的基线当作绿。
  以下情况必须停手写「## 待裁决」而不是自行决定：
    ① resume_token 后端重启后的恢复路径——**已裁决，不再待裁决**：用户 2026-09-26 选
       候选 B，`reissue_resume_token`（README §8、本文件 §一之五）；实现阶段照做即可，
       若发现候选 B 的设计（前置条件/审计字段/触发方式）与实测的 ledger 代码有出入，
       停手更新文档再动代码，不要自己改设计
