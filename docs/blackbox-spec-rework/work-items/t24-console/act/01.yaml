    - pipeline/ledger/client.py                        # 新增 LedgerClient.reissue_resume_token 转发方法
    - pipeline/contract_registry/ports.py              # LEDGER_PORT_METHODS 元组新增一项 "reissue_resume_token"
    - pipeline/ledger/tests/                           # 新增 reissue_resume_token 的 ledger 层测试，见 TDD.md
    - docs/blackbox-spec-rework/work-items/impl-00-interfaces/INTERFACES.md   # §1.1 新增登记行（README §8.6）
    - console_backend/app/orchestrator_client.py     # 新增，唯一允许调用 pipeline.orchestrator 公开入口的模块
    - console_backend/app/repository.py              # 改造：流水线事实部分换 LedgerPort 只读查询；UI 偏好可留 SQLite
    - console_backend/app/routers/workbench.py        # 删 mock，M4/M6 队列与提交改接真流程
    - console_backend/app/routers/pipeline.py         # EditionRun 生命周期端点（创建/advance/上传提交件/上传AI建议/resume/reissue-token/run_release/下载/查状态）
    - console_backend/tests/                          # 新增测试，见 TDD.md 第 1 节
    - console_frontend/src/**                         # mock 数据源换真 API；新增 AI 预审建议展示与采纳交互、恢复审核按钮
