    - docs/handoff/                                    # 参考材料，不改内容（除非另有 ACT 授权）
background: |
  控制台（console_backend FastAPI + console_frontend Vue3）09-17 前后交付后停在壳子：
  M1 页面扫描是硬编码 mock（workbench.py:37 `_create_default_mock_page_scan`），只有 M2
  cleaner 调了真实 `pipeline.digitization.cleaner`；M3/M6 审核队列也是硬编码的四条示例数据
  （`_create_default_review_queue`）；仓储是控制台自己的 SQLite（repository.py），从未接
  `pipeline.orchestrator` 或 Ledger。PRD 二期 2.3（M1～M8 后台任务管理器）与四期（联调闭环）
  从未开工也从未派单（`docs/handoff/ASK-2026-09-26.reply.md` 第 1 题，Dataset 会话 09-26 核实）。

  用户 09-26 追加要求：M4 分歧裁决与 M6 审核**必须在 Web 界面完成**，不许看命令行/编辑文件；
  界面还要显示本机外部 agent（FreeBuff/OpenCode，T06 范畴）产出的「AI 预审建议」文件，供用户
  参考/采纳/修改，但任何情况下不得因为存在建议就自动提交决定。

  **本 ACT 只交付工作文档（README.md/TDD.md/本文件）+ PRD 作废标注，不写实现代码**——这是
  协调者 09-26 在本轮会话中途缩小的范围（"实现改由用户本机的外部 agent 按你的文档来做"）。
  下面 contract 部分描述的是**给后续实现者的完整设计约束**，本 ACT 本身只需要完成"写文档"
  这一半，verify 部分对应区分了"本次必须做到"和"实现阶段必须做到"。

  **基线更正（协调者 09-26）**：本 worktree 原先错误地基于 `main`（缺 T04 产出）；已
  `git merge claude/wizardly-maxwell-pqrzh9`（合并提交 `6a06144`，merge 不是 rebase，
  无冲突），本分支现在含 T04 全部产出——`start_edition_run` 接受 `run_inputs`，
  `registry.yaml` 里 m4/m6/m7 均已登记且带 `resume_entry`。本文档第 6 节与 README.md §0
  的函数签名/行号均已在合并后的树（`6a06144`）上重新核实。分支合并不再是阻断。
contract: |
  零、前置修复步骤（实现阶段第一步，本 ACT 已实测确认修法，见 README.md §9）
    `console_backend/tests` 现在的基线是 `Ran 6 tests ... FAILED (errors=2)`，根因是
    `.venv`（Python 3.14.0rc2）里 `pydantic==2.13.5` 与 `fastapi==0.141.1` 的兼容性缺口
    （`typing._eval_type() got an unexpected keyword argument 'prefer_fwd_module'`）。
    已实测排除：升级到 `pydantic==2.14.0b2` 无效（同一根因仍报）；降级到 `2.10.6` 因无
    Python 3.14 预编译 wheel、源码编译失败，不可行。**确切可用修法**：另建一个基于
    Python 3.13.12（本机 `/usr/bin/python3.13` 已装）的 venv，同一份 `requirements-dev.txt`：
        uv venv .venv-py313 --python 3.13.12
        uv pip install --python .venv-py313/bin/python -r requirements-dev.txt
        export LC_ALL=C.UTF-8
        .venv-py313/bin/python -m unittest discover -s console_backend/tests -t .
        # 实测：Ran 22 tests in 0.297s / OK
    实现者开工写 TDD.md 第 1 节新测试前先做这一步；`requirements-dev.txt` 不改动版本锁定，
    只是 `console_backend` 的测试换一个解释器版本跑（11 个 pipeline 包是否也切到 3.13
    本 ACT 未验证，不能预先断言可行，实现者若要统一环境需自己先跑一次基线）。这属于环境/
    依赖版本问题，处理它不算违反"不改 pipeline/ 下生产代码"。

  一、控制台定位（P7 铁律，不许有例外）
    控制台是 `pipeline.orchestrator` 人工节点的前端，不是决策者。所有写账本操作只能经
    公开入口：`start_edition_run` / `advance` / `run_until` / `resume` / `run_release` /
    `run_m4_submit` / `record_category_ruling` / `record_decision` 等。
    完成判据：`pipeline.contract_registry.acceptance.scan_ledger_internals(["console_backend"])`
    返回空列表。**已实测基线（改造前，`6a06144`）：`[]`**——但这只说明"现在还没碰
    Ledger"，不说明"接入后仍然干净"（该函数按正则 `\.store\b|\.objects\b` 扫描直接访问
    LedgerPort 内部属性的写法，`console_backend` 现在完全不 import
    `pipeline.orchestrator`/`pipeline.ledger`，正则自然扫不到东西，见 README.md §7.1）。
    实现阶段接入 `orchestrator_client` 之后必须重跑这条扫描仍为 `[]`，并在
    `pipeline/contract_registry/tests/` 新增一条独立用例长期钉住它（不是扩展现有
    `modules_port_clean`——那个函数只扫 `registry.yaml` 里登记的模块，`console_backend`
    不是登记模块，不会被它覆盖）。控制台自带 SQLite 仓储里存"流水线事实"的部分（PipelineRun
    状态、M1/M2/M6 数据、审核决定）必须换成对 LedgerPort 的查询；纯 UI 偏好（如"用户上次
    打开的标签页"）可以留在 SQLite 或前端本地存储，不算违反本条。

  一之五、新增 LedgerPort 公开入口：resume_token 重签发（**排在接 M4/M6 审核之前实现**，
    用户 2026-09-26 裁决候选 B，规格变更已获批，详见 README.md §8/§8.1-§8.6）
    - 函数签名：`LedgerService.reissue_resume_token(self, step_run_id, *, actor_ref, reason)`，
      放 `pipeline/ledger/service.py`（建议紧邻 `recover()` 之后）；`LedgerClient` 加同名转发
      方法（`pipeline/ledger/client.py`）；`pipeline/contract_registry/ports.py` 的
      `LEDGER_PORT_METHODS` 元组加一项 `"reissue_resume_token"`（建议紧跟 `"recover",`
      之后），`DirectLedgerAdapter`/`LedgerdClientAdapter`/`PortGuard` 自动跟随，
      `ledgerd.py` 按方法名通用分派，不需要改。这是本 ACT 唯一允许改动的
      `pipeline/` 生产代码，范围严格限定为这三个文件的这三处改动。
    - 前置条件：`step_run_id` 必须存在（否则 `MissingReference` code=REF_001）；
      StepRun 当前 `status` 必须是 `awaiting_human`（否则 `IllegalTransition`，带上当前
      实际状态）。**不调用 `check_step_run_transition`**——`STEP_RUN_TRANSITIONS` 表里
      `awaiting_human` 没有到自己的边（status 没变，只是版本号与哈希换新），改成显式
      `if step["status"] != "awaiting_human": raise IllegalTransition(...)`。
    - 效果：旧 token 立即作废——新哈希绑定 `status_version+1`，旧 token 再拿去调
      `resume()`/`record_human_event()` 时 `_check_token` 的版本号比对会先失败，天然被拒，
      不需要额外黑名单。`store.update_step_run_status` 的 `from_status=to_status=
      "awaiting_human"` 自转已被既有 SQL（`WHERE status=from_status AND
      status_version=expected`）天然支持，不需要改 `store.py`。
    - 审计：同一事务内两处——`store.append_step_run_event(step_run_id,
      "resume_token_reissued", actor_ref, from_status="awaiting_human",
      to_status="awaiting_human", reason=reason)`（经 `list_step_run_events` 可从端口读到）；
      `store.append_audit("reissue_resume_token", str(step_run_id), actor_ref,
      json.dumps({"reason": reason}))`（同其余 resume/suspend/recover，不经端口读，
      测试里直接读 `DirectLedgerAdapter(...).unwrap().store`）。
    - token 仍不落盘：只 `return token`，调用方（`orchestrator_client`）只放进程内存映射。
    - 不改变已记录的决定：本方法只碰 `step_runs.resume_token_hash`/`status_version` 与新增
      的两条事件/审计记录，不触碰任何 `human_event`/`artifact_revisions`/`checkpoints`。
    - 触发方式：仅由用户在控制台界面点击"恢复审核"并在确认框里给出/确认 `reason` 后，
      前端发一次请求，后端才调用本方法；**不得**在检测到内存映射缺 token 时后台自动重签。
    - 规格登记：`INTERFACES.md` §1.1「调用、事务与人工恢复」表新增一行（README.md §8.6
      给了完整表格式），由实现者在开工时加，不倒填成"已有"。

  二、不得有任何 AI/Agent 代签路径（规格 P7）
    M4 分歧裁决与 M6 审核只能由用户本人在界面上点击提交才算数。
    - `WEB_CONSOLE_PRD_AND_PLAN.md` 的 Task 2.5「AI Auto-Reviewer 自动签发」与
      Task 4.1「全自动 AI 代审出包」已标注**作废（T24，P7）**（本 ACT 已完成这条标注，
      不删原文，加删除线注明理由）。
    - 决定的 `actor_ref` 由用户在界面给出/配置，默认 `user:wjt`，代码不得伪造成别人、
      不得省略、不得由后端自行推断成"ai:"/"agent:"前缀。
    - AI 预审建议（用户 09-26 新增要求）**只是展示数据**：界面可以显示、可以"一键采纳"
      把建议内容填进表单，但填表单之后仍必须用户点击"提交"才产生一次
      `record_category_ruling`/`record_decision` 调用；没有用户这次显式点击，就不存在
      决定。任何"批量提交"/"全部采纳建议后自动提交"的功能都不许做（见 TDD.md
      `test_queue_endpoint_is_read_only_no_bulk_submit_route`、
      `test_adopt_suggestion_does_not_auto_submit`）。

  三、AI 预审建议文件与决定记录的关联方式（本 ACT 已在 README.md §4 定型，实现阶段照做）
    - 建议文件路径、字段、与 `queue_item_id`/`dispute_id` 的对位规则、对不上时界面提示，
      按 README.md §4.1 执行，不许实现者另起一套格式。
    - 不改账本 schema：用户的决定若曾展示过匹配的建议，后端在提交前把建议来源
      （`model_id`/`generated_at`/`suggestion_file_sha256`/`adopted`）追加进
      `rationale` 文本，格式按 README.md §4.2 的 `[AI预审建议] key=value` 约定。
      如果将来需要结构化字段（例如统计采纳率），那是**待裁决**的 schema 变更，
      本 ACT 与后续实现阶段都不擅自扩展 `ruling_doc`/`record_decision` 的参数闭集。

  四、resume_token 不许落盘（ACT 19 铁律的延伸，不因候选 B 而放松）
    - `resume_token`（包括 `reissue_resume_token` 新签发的那个）只能存在于控制台后端
      进程内存里；有测试按字节在临时账本目录、控制台代码与后端日志文件里搜索明文 token，
      确认无命中（`test_resume_token_never_written_to_disk_or_log`）。
    - 后端重启后如何重新拿到已丢失的 token：**已裁决候选 B（用户 2026-09-26）**——
      新增 `reissue_resume_token` 入口（一之五）。候选 A（控制台本地落盘）与候选 C
      （只靠运维保活、不提供恢复手段）不采用；候选 C 原有的"界面如实提示"行为保留，
      但只用作"用户还没点恢复审核/重签发本身失败"时的兜底展示，不再是唯一手段。

  五、只做电子文本路线（route: text）
    M4 内容暂由用户上传提交件 YAML（沿用 `run_m4_submit` 现有形态），不实现模型调用
    （T06 的模型适配器另有人做，本 ACT 及其后续实现阶段都不碰）。

  六、测试先行、篡改探针（实现阶段的硬约束，本 ACT 只文档不代码）
    每个功能先写测试并确认红，再实现到绿；每个核心修复做篡改探针（故意破坏→测试转红→
    恢复），探针用 `cp` 备份文件后恢复，不用 `git checkout` 恢复（铁律，避免误吞其他会话
    的并发改动）。

  七、不放宽任何检查、不改 pipeline/ 生产代码、不删测试
    若确有必要改 `pipeline/` 下生产代码，先停手报告理由，不许直接改。新增
    `test_scan_ledger_internals_console_backend_is_empty` 属于新增契约测试用例，
    不是放宽既有检查（`scan_ledger_internals` 本身是通用函数，不需要改它的实现，只是
    多了一处调用它的地方）；若实现者觉得这条边界拿不准，停手上报，不要自己决定"这算不算
    放宽"。
