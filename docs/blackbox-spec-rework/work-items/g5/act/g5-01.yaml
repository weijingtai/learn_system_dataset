act_id: blackbox-g5/01
title: 规格文档级状态翻转 REVIEW_FAILED_R1 → R1_REWORK_CLOSED
estimated_minutes: 10
group: G
precondition: 用户已书面确认进入实现阶段（README §2 填入日期）；否则不得执行
scope:
  write: [openspec/learn-system-blackbox-architecture.md, docs/blackbox-spec-rework/README.md]
anchors:
  spec_status: '状态：`REVIEW_FAILED_R1`'
  spec_quote_1: '> R1 交叉审查（2026-09-08，架构 / 验收 / 用户体验 / 规划四角色独立进行）结论为**不通过**，'
  spec_quote_2: '> 原 38 条返工项与追加的 2 条版权/存储返工项见 `PLAN.md` 的「黑箱架构规格 R1 审查返工项」一节。'
  spec_quote_3: '> 在该节全部结清前，本规格不得作为 tasks 拆解依据，亦不得启动 M1-M8 任何 Module 的实现任务。'
  readme_status: '> 审查对象：`openspec/learn-system-blackbox-architecture.md`（状态 `REVIEW_FAILED_R1`）'
steps:
  - 断言五个锚点各恰 1 次（grep -Fxc）；断言 spec_status 在第 3 行、三行引用块在第 5–7 行
  - 第 3 行整行替换为 new_status
  - 第 5–7 行三行整体替换为 new_quote（四行）
  - README 第 5 行整行替换为 readme_new
  - 除此之外任何行不改：`git diff --numstat` 规格必须为 +5/−4，README +1/−1
new_status: '状态：`R1_REWORK_CLOSED`（R1 返工全部结清，允许进入 §22 首纵切实现；各节四态标签见每节「状态：」行，整份规格尚未批准为最终规范）'
new_quote: |
  > R1 交叉审查（2026-09-08，架构 / 验收 / 用户体验 / 规划四角色独立进行）结论为**不通过**，
  > 原 38 条返工项与追加的 2 条版权/存储返工项见 `PLAN.md` 的「黑箱架构规格 R1 审查返工项」一节。
  > 该节 44 条已于 2026-09-11 全部结清（G1–G4 共 36 个工作项 `ACCEPTED`，证据 `docs/blackbox-spec-rework/SUBAGENT_TODO.md` 与 `reviews/G5-EXIT-REVIEW.md`）；
  > 用户于 <日期> 确认进入实现阶段。实现批次的完成判据为 `openspec/acceptance/run_all.sh` 对应条目由 `BLOCKED` 变 `PASS`。
readme_new: '> 审查对象：`openspec/learn-system-blackbox-architecture.md`（状态 `R1_REWORK_CLOSED`，2026-09-11；历史状态 `REVIEW_FAILED_R1`）'
verify:
  - export LC_ALL=en_US.UTF-8
  - sed -n '3p' openspec/learn-system-blackbox-architecture.md | grep -c 'R1_REWORK_CLOSED'      # 1
  - grep -c 'REVIEW_FAILED_R1' openspec/learn-system-blackbox-architecture.md                    # 0
  - grep -c '^状态：' openspec/learn-system-blackbox-architecture.md                              # 19（与改前相同）
  - bash docs/blackbox-spec-rework/verify-T.sh | tail -1                                         # FAIL 合计: 0
  - bash docs/blackbox-spec-rework/work-items/g3-r3/mutations.sh all | tail -1                   # 109/109
  - bash openspec/schemas/verify.sh >/dev/null; echo $?                                          # 0
  - git diff --check
commit:
  add: [openspec/learn-system-blackbox-architecture.md, docs/blackbox-spec-rework/README.md]
  message: "spec: close R1 rework (REVIEW_FAILED_R1 -> R1_REWORK_CLOSED) after G5 exit review; user confirmed implementation phase"
on_fail: 停止并报告；不得改节标签
