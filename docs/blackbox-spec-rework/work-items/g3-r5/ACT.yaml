  - Red 阶段 d07/t07/t08 的 not-rejected 行（恰 4/2/5 行）与 selftest 41/41
  - Green 阶段正常门禁尾行、selftest、d07/t07/t08/all 尾行、MUTATION_NOT_APPLIED 计数 0、git diff --check
  - git status --short（不得新增或改动范围外文件；开工前已存在的脏文件原样列出）
  - 明确写明「等待主 Agent 独立验收；未启动 G4」
