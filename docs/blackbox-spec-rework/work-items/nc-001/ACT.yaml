  - "python3 openspec/annotation-community/tools/check_integration_baseline.py --profile integrated --input openspec/annotation-community/integration_baseline.json"
ON_FAIL: "Stop with exact assertion or missing prerequisite; do not edit inputs/standards, use cloud credentials, install packages or expand scope"
