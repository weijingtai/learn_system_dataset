  - "local requires PLANNED_NEW with NC-004 owner and existing parent OR EXISTING with pubspec and lib"
  - "SDK evidence must exist; pins must match approved input; identity HOST_SCOPE_ONLY and new_identity_system=false"
  - "book_work must remain DEFERRED_BY_USER"
