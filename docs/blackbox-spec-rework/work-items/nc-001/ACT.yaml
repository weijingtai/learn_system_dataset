  - "Implement local profile validation with exact field paths and no filesystem writes"
  - "Implement integrated profile validation without bypassing any missing evidence"
  - "Run all TDD commands; preserve integrated-current failure as expected negative evidence"
  - "Stage only the two owned files and commit; report paths and raw command results"
