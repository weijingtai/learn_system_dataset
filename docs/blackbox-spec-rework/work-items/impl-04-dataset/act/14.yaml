on_fail: |
  停止并报告，不许提交红的基线。
  五种情况必须停手写「## 待裁决」而不是自行决定：
    ① 需要改 gate.py 或 step.py 才能完成
    ② 真书 Span 或 source_manifest 的实际形状与本 ACT 背景里写的不符（以实测为准，立即上报差异）
    ③ 既有 OCR 档用例有任何一条转红，或 skipped 数增加
    ④ 八段清单与 README:375 有出入，或发现第三种 evidence_level
    ⑤ source_assets 条目的 sha256 与 raw_text 修订 sha256 不相等（那是上游数据问题，不是本 ACT 能修的）
