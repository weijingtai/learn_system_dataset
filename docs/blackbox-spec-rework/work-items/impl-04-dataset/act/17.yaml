on_fail: |
  停止并报告，不许提交红的基线。
  六种情况必须停手写「## 待裁决」而不是自行决定：
    ① 某项在 offset 档「既不适用也无法实评」，二选一都不成立
    ② 需要改 packs.py 或夹具才能完成
    ③ `text_offsets` 与 `offset_anchor_continuity` 是否重复，你判断不了
    ④ 补传 kwarg 后 `sanitization_disclosure` 仍 FAIL，且你无法判断是真实缺陷还是实现缺口
    ⑤ glyphbox 档五项有任何一项行为改变
    ⑥ 发现 `_CHECK_APPLICABILITY` 里还有本 ACT 未列出的「声明与实现不一致」项
       （**这种情况要报，不要顺手改** —— 可能需要扩大裁定范围）
