background: |
  五项都是主 Agent 在 2026-09-19/20 的投产评估中**查实**的缺陷，已记在
  `tasks/dataset-blackbox-line.md` 的「投产前必改（质量项）」段，编号沿用 ④–⑧。
  它们互不依赖，可各自独立完成、独立提交。**任何一项卡住，做完其余的，不要整批停。**
contract: |
  Q1（原 ④）M4 brief 每批 20 条上限，两路都顶格截断
    实测：a 路正好 20 条、b 路正好 20 条，b 路 adapter_notes 自述
      「为控总数略去」「受 20 条上限所限未逐一登记」。
    734 字 / 41 片段就顶格，说明该上限对论断密集段必然造成漏抽。
    改：brief 模板里的固定上限改为**自适应** `上限 = ceil(1.2 × 该批片段数)`，
      并在 brief 里写明「若因上限略去任何候选，必须在 adapter_notes 中逐条点名」。
    硬性：**只改模板文本**，不重跑 M4（重跑是另一件事，不在本 ACT）。

  Q2（原 ⑤）补回被上限截掉的 5 个 concept 词条
    b 路 notes 已逐个点名：正财、偏财、偏印、正印、劫财。
    改：按既有 concept 词条格式补登记到真书 M6 审核产物所在目录，
      **每条必须带原文出处偏移**（从 `var/ledgers/qianyuan_w8` 只读查证，不许凭空写）。
    硬性：
      - 不许推断 `concept_refs`（裁定 107 Q-M8-01）
      - 补登记件要标注「来源：b 路 adapter_notes 点名 + 主 Agent 2026-09-20 查实」
      - **不许改真书正本账本 `var/ledgers/qianyuan_w8/`**；补登记落在 review 目录

  Q3（原 ⑥）M5 Gate 增一条扫描 adapter_notes
    现状：`adapter_notes` 是**无下游消费者的死数据**——抽取员写了「我略去了什么」，没有任何人读。
    改：M5 Gate 增一条检查，扫描 `adapter_notes`，命中
      「控总数 / 上限 / 略去 / 未逐一登记」等词即置为**待处理**（不得静默通过）。
    硬性：
      - 该项命中时**不得冒充 ok**，按既有三态口径给 `not_applicable` 之外的明确状态
      - 词表要可配置或集中定义，不许散落在多处硬编码
      - 既有 M5 用例（validation 108）一个都不许转红

  Q4（原 ⑦）41 片段清单缺失，可复现性缺口
    现状：M4 提交件 README 记了 `spans_tianguan_qisha.yaml` 的 sha256 `b4240c74…`，
      但**全盘无此文件**（主 Agent 搜过仓库与 `~/tmux-agents`）。
    已知可无损重建：证据引用的 37 个 span id ∪ notes 提及的 4 个 = 恰好 41；
      偏移首尾相接无空洞无重叠，字数合计 734，与 README 吻合。
    改：从提交件机械重建该清单并落盘入库，
      **必须标注「与 README 记录的 sha256 未能核对（原文件不存在）」**。
    硬性：不许伪造成「已核对」；重建脚本或命令要写进回报，便于复算。

  Q5（原 ⑧）护栏测试随发现范围变红
    现状：`pipeline/corpus_compiler/tests/test_gate_offset.py::test_gate_offset_does_not_import_compiler_modules`
      自检用的 `GATE_SOURCE_ENV` 会泄漏到真实用例，导致按不同 discover 范围跑时结果不同。
    改：修**测试设施**（环境变量隔离），不是改产品代码。
    硬性：
      - 修完后，单跑该文件、跑 corpus_compiler 全套、跑全仓库 discover，三种范围结果一致
      - 产品代码一行不许改
tests_first: |
  每项各自先红后绿，逐项贴 Red 原文。至少：
    Q3：test_m5_gate_flags_adapter_notes_truncation / test_m5_gate_adapter_notes_clean_passes
    Q5：三种 discover 范围下同一用例结果一致（把三次命令与输出都贴出来）
    Q1/Q2/Q4 以文档与数据产物为主，用「改前/改后」实物对照代替单元测试，
      但 Q2 的 5 个词条**每条都要贴出其原文偏移与查证命令**。
