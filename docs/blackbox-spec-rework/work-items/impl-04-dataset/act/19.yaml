commit: |
  **分五个提交**，每项一个，互不混合：
    1. docs(m4): make the per-batch candidate cap adaptive to segment count (W8 Q1)
    2. data(m6): register the five concept entries dropped by the batch cap (W8 Q2)
    3. feat(m5): flag adapter_notes truncation instead of passing silently (W8 Q3)
    4. data(m4): rebuild the missing span list and mark its sha256 unverified (W8 Q4)
    5. test(m3): isolate the gate self-check env so discovery scope cannot change results (W8 Q5)
  各含对应 TDD 阈值行；末尾空一行加 `Co-Authored-By: Freebuff <noreply@freebuff.ai>`。
on_fail: |
  **单项停手，不要整批停**：某项卡住就跳过它做下一项，最后在回报里列明哪项停、为什么。
  必须停手写「## 待裁决」的情况：
    ① Q2 的某个词条在原文里找不到确切出处偏移（不许凭空补）
    ② Q3 的新检查会让既有 M5 用例转红
    ③ Q4 重建出的清单不是恰好 41 段、或偏移不连续（说明重建前提错了）
    ④ 任何一项需要写 `var/ledgers/qianyuan_w8/` 真书正本
    ⑤ Q5 修完三种范围结果仍不一致
