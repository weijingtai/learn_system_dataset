act_id: impl-04/15
title: run_m8 按路线装配冻结输入与输入契约（现状 step.py:247 KeyError，真书同一断点）
estimated_minutes: 150
group: K4
depends_on: [impl-04/14]
decisions: [D-W8-15, 裁定 78 D3, 裁定 81, 裁定 102 Q4]
