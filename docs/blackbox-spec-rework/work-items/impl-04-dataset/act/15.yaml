  五种情况必须停手写「## 待裁决」而不是自行决定：
    ① 需要改 gate.py 或 packs.py 才能完成
    ② ACT 14 落成的包形状与本 ACT 第三节假定不符（以 ACT 14 实际成果为准，立即上报差异）
    ③ 电子文本 m3 包里四类 M2 产物引用不是「恰好各 1 个」
    ④ 既有 OCR 用例有任何一条转红，或 skipped 数增加
    ⑤ 真书副本上 run_m8 仍在 begin_step_run 之前崩溃，且原因不在本 ACT 范围内
