background: |
  主 Agent 2026-09-20 实测现状（`pipeline/dataset_compiler/step.py:240-249`）：

    frozen = [
        inputs["m3_package_revision_id"],
        inputs["spans_revision_id"],
        inputs["manifest_revision_id"],
        inputs["ocr_page_set_revision_id"],      # ← 电子文本路线为 None，会把 None 塞进冻结集
    ]
    for page in manifest["edition_part"]["pages"]:
        frozen.append(inputs["page_revision_ids"][page])    # ← KeyError
    for page in manifest["edition_part"]["pages"]:
        frozen.append(inputs["asset_revision_ids"][page])   # ← KeyError

  真书 source_manifest 里 edition_part.pages = ["qianyuan_ed01_text"]（单文件、无页码，
  但**确实有一个「页单位」**），而 ACT 13a 契约下电子文本路线的
  page_revision_ids / asset_revision_ids 均为 {} → `KeyError: 'qianyuan_ed01_text'`。
  该异常发生在 begin_step_run **之前**，故零写入（前一轮执行器在账本副本上实测确认）。

  同一处还有两个连带问题：
    - `_run_after_begin` 第 6 步用 `inputs["page_revision_ids"].items()` 装 page_docs，
      电子文本路线为空字典 → page_docs 为 {}，下游按页取用会再次 KeyError
    - `_validate_input_contract`（step.py:103-130）无条件要求 m3 包的
      source_manifest / ocr_page_set / ocr_page 三组引用与解析一致；
      电子文本 m3 包的 input_artifacts 是
      {cleaned_text_revision, deterministic_patch_set, raw_text, sanitization_report}
      → 三条校验全部误报 REF_001

  README §11.4:250 已写定电子文本线的输入口径：
    「若 evidence_level == "offset_level"：分派至电子文本线逻辑，解析 M2 产物
     （raw_text、cleaned_text_revision、deterministic_patch_set、sanitization_report）
     与 M1 source_manifest 中的 SourceAsset 元数据。」
contract: |
  一、inputs.py 补齐电子文本路线的 M2 产物修订（ACT 13a 未做这一层）
    resolve_m8_inputs 在 route == "electronic_text" 时，返回字典新增四个键，
    取值来自 M3 包 manifest.input_artifacts 中对应 artifact_type 的 artifact_revision_id：
      "raw_text_revision_id"
      "cleaned_text_revision_id"
      "deterministic_patch_set_revision_id"
      "sanitization_report_revision_id"
    每个都必须**恰好 1 个**引用，否则 REF_001（消息含实际个数）。
    每个都要 _sealed_revision 校验已封存 + _artifact_type 校验类型，不符 SCH_002。
    route == "ocr" 时这四个键取 None（**不许省略键**，下游按名取用）。
    ACT 13a 已有的 14 个键名一个都不许改。

  二、step.py 冻结输入按路线装配（D-W8-15）
    分派权威 = inputs["route"]（ACT 13a 已产出的键），不许新增环境变量、不许看别处。
    ocr 路线：现有装配逐字不变。
    electronic_text 路线：
      frozen = [m3_package_revision_id, spans_revision_id, manifest_revision_id,
                raw_text_revision_id, cleaned_text_revision_id,
                deterministic_patch_set_revision_id, sanitization_report_revision_id]
      **不含** ocr_page_set_revision_id（它是 None，塞进去会污染冻结集与 input_artifact_ids）
      **不遍历** edition_part.pages 取页/资产修订
    硬性：frozen 列表中**不得出现 None**。新增一条断言式校验：装配完成后若含 None →
      DatasetRefused REF_001，消息指明是哪个键。这条对两条路线都生效。

  三、page_docs 与输入契约按路线分派
    1) `_run_after_begin` 第 6 步：electronic_text 路线 page_docs = {}（保持空字典，
       ACT 14 的 offset 变体本就不读它）；ocr 路线逐字不变
    2) `_validate_input_contract`：把 source_manifest / ocr_page_set / ocr_page 三组引用校验
       改为按路线分派：
         ocr 路线：三条逐字不变
         electronic_text 路线：改为校验第一节那四类 M2 产物引用与解析一致（同样 REF_001），
           且**不得**出现 ocr_page_set / ocr_page 引用（出现即 REF_001，说明路线判定与实际不符）
    3) manifest.source_assets 的对账：electronic_text 路线仍要做，但对的是
       raw_text 修订的 sha256（ACT 14 第三节已定同口径），不是页图

  四、判据：真书账本上 run_m8 至少要越过 begin_step_run
    本 ACT 的成功判据**不是**「真书上 M8 全绿」——知识链、GraphProjectionPack 等仍可能如实失败。
    判据是：在真书账本的**副本**上调用 run_m8，不再抛 KeyError，
    且失败（若失败）是经 `_fail` 封存的正常失败，不是 begin 之前的崩溃。
    **真书正本一律只读**；副本放 /tmp 或你的临时目录。

  五、不许做的事
    - 不许动 gate.py（D-W8-13b）、不许动 packs.py（ACT 14 成果）
    - 不许给电子文本路线伪造 ocr_page_set / ocr_page 修订来「凑齐」既有校验
    - 不许把 OCR 路线的校验放宽来迁就电子文本路线（两条路线各走各的分支）
