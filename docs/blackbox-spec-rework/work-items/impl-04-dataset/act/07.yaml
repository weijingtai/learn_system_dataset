act_id: impl-04/07
title: m8-span-identity 验收：acceptance.py 两组判定 + openspec/acceptance/m8-span-identity.sh（§19.0 判据）
estimated_minutes: 100
group: K3
depends_on: [impl-04/06]
decisions: [D3, D6, D14]
scope:
  write: [pipeline/dataset_compiler/acceptance.py, pipeline/dataset_compiler/tests/test_acceptance.py, openspec/acceptance/m8-span-identity.sh]
tests_first:
  - 先写 tests/test_acceptance.py（用例名逐字）并全红，再实现 acceptance.py，最后新建 m8-span-identity.sh
contract: |
  acceptance.py：python -m pipeline.dataset_compiler.acceptance --fixture <dir> [--check span_identity|publication] [--keep]
    准备：tempfile 目录 → LedgerService(root/"ledger") → ingest(fixture, service, stages=("m1","m2")) → run_m3 → register_source_assets(service, ep, ASSET_ROOT)
      （ASSET_ROOT 由环境变量 FIXTURE_ASSET_ROOT 指定，缺省为仓库根 ocr/data_work/sanche_pages）；再 run_m8(consumption_level="INTERNAL_DEMO")；
      判定函数只读 Ledger 与 fixture 金标，不信任 run_m8 的 gate 报告，须自行重算（不 import packs/gate，不读 run_m8 summary["gate"]）
    检查 span_identity（名称与顺序固定，7 项）：
      run_succeeded：m8 StepRun 状态 "succeeded"
      span_key_unique：EvidenceMapPack 的 entries 键集合 == spans_doc span_id 集合 == fixture `spans.yaml` 金标 span_id 集合（金标副本被删一条 span 时在此 FAIL）；len(entries) == spans_doc["span_count"] == 43；无重复
      legacy_collision_exposed：按 pipeline/rag/build_index.py:133-138 的 (source_id, int(sNN)) 规则对同一批 span 取键，独立复算得 legacy_keys=39、collision_groups=4，而 pack_keys=43；
        三数均由 fixture 重算，不得写成常量；PASS 行说明逐字含 `legacy_keys=39 collision_groups=4 pack_keys=43`
      span_page_binding：entries 键中 _p<4位> == int(entry["page"][5:])、_s<2位> == entry["line_index"] + 1；entry["page"] == spans_doc 同 span 的 page
      anchor_to_page_image：entry["image_sha256"] == 清单同页 source_assets.sha256 == 页图修订对象字节 sha256
      glyph_closure：entry["glyphs"] == 从页 JSON 重算的 [{char_index, glyph_id, char, box}]（parent == entry["line_id"]）；glyph_text_equal 与 highlight_level 由重算字串给出；
        fixture 上 glyph 高亮 41 条、line_bbox 2 条（ss_sanche_ed01_p0001_s03、ss_sanche_ed01_p0001_s04）
      reverse_index：page_index 键顺序 == 清单页序；每页值 == spans_doc 中该页 span_id 顺序；排除页值 == []（page_001 4 条、page_002 []、page_003 39 条）
      mentions_mapping：恒为 BLOCKED，说明逐字为「前置缺失: M4 Knowledge Extraction；concept→span mentions 映射未产出；SearchIndexPack 未产出（D14-C）」
    检查 publication（8 项 + 1 BLOCKED）：
      run_succeeded（同 span_identity）
      evidence_chain_closure：gate 检查 1–5（span_identity, span_page_binding, text_offsets, glyph_anchor_closure, highlight_level）全部 ok
      coordinate_frame：gate 检查 8（coordinate_frame）
      release_manifest_hashes：gate 检查 10（release_manifest_hashes）
      input_reconciliation：gate 检查 11
      consumption_level：gate 检查 12
      watermark_disclosure：gate 检查 13
      fail_closed_levels：在另起的两个临时 Ledger 上分别跑 DEV_SEARCH 与 PUBLIC_RELEASE，二者均 failed 且 failed_check "admission"、四类子包修订数为 0
      knowledge_chain：恒为 BLOCKED，说明逐字为「前置缺失: KnowledgeEntry→Assertion→EvidenceLink；knowledge_chain=not_compiled」
    输出：每项一行 `PASS <名>` / `FAIL <名> <原因>` / `BLOCKED <名> <说明>`；末行 `SUMMARY pass=<n> fail=<n> blocked=<n>`
    退出码：3 仅限「<fixture>/manifest.yaml 不存在」「FIXTURE_ASSET_ROOT 缺失或三页页图不存在」「yaml/jsonschema 不可导入」；
            准备/run/判定抛异常 → 打印 `FAIL m8_acceptance 宿主准备失败: <异常类名>: <消息>` 并退出 1（判定函数内异常转该项 FAIL）；
            任一 FAIL → 1；无 FAIL 有 BLOCKED → 2；全部 PASS → 0
    无 --keep 时删除临时目录
  m8-span-identity.sh（新建，权限 755）：
    set -u；export LC_ALL=en_US.UTF-8；REPO_ROOT 由脚本所在目录推出（openspec/acceptance → 仓库根）
    FIXTURE_DIR 默认 "$REPO_ROOT/pipeline/corpus/_fixture/mini_ed01"，可由环境变量覆盖（先解析为绝对路径）
    FIXTURE_ASSET_ROOT 默认 "$REPO_ROOT/ocr/data_work/sanche_pages"，可由环境变量覆盖
    PY="$REPO_ROOT/.venv/bin/python"；不可执行 → 打印 `BLOCKED m8_acceptance 前置缺失: 测试宿主匮乏；.venv 缺失` 与 `SUMMARY pass=0 fail=0 blocked=1` 并 exit 3
    宿主校验：FIXTURE_DIR="$FIXTURE_DIR" FIXTURE_ASSET_ROOT="$FIXTURE_ASSET_ROOT" bash "$REPO_ROOT/pipeline/corpus/_fixture/mini_ed01/verify.sh"
      （永远调用仓库内规范脚本，绝不执行 "$FIXTURE_DIR/verify.sh"）
      退出 0 → 继续；退出 3（缺页图）→ 打印 `BLOCKED m8_acceptance BLOCKED_SOURCE_ASSET_MISSING <path_ref…>` 与 `SUMMARY pass=0 fail=0 blocked=1` 并 exit 3；
      退出 1 或其他 → 打印 `FAIL fixture_host <verify.sh 的首个 FAIL 行>` 与 `SUMMARY pass=0 fail=1 blocked=0` 并 exit 1
    然后 cd "$REPO_ROOT" 执行 "$PY" -m pipeline.dataset_compiler.acceptance --fixture "$FIXTURE_DIR" --check span_identity，退出码原样返回
tests:
  test_acceptance.py: |
    - test_span_identity_seven_pass_one_blocked_exit_2（SUMMARY pass=7 fail=0 blocked=1）
    - test_publication_eight_pass_one_blocked_exit_2（SUMMARY pass=8 fail=0 blocked=1）
    - test_legacy_collision_exposed_numbers_recomputed（PASS 行含 legacy_keys=39 collision_groups=4 pack_keys=43）
    - test_mentions_mapping_blocked_exact_text
    - test_knowledge_chain_blocked_exact_text
    - test_tampered_span_golden_fails（fixture 临时副本 `spans.yaml` 删一条 span → FIXTURE_DIR 指向副本、acceptance.main 直接调用，`span_key_unique` FAIL，exit 1）
    - test_dropped_entry_fails（patch 编译结果删一条 entry → evidence_chain_closure FAIL，exit 1）
    - test_prepare_failure_exits_1（patch fixture_ingest.ingest 抛 RuntimeError → exit 1，首行以 "FAIL m8_acceptance 宿主准备失败: RuntimeError" 开头）
    - test_missing_fixture_exit_3
    - test_missing_assets_exit_3（FIXTURE_ASSET_ROOT 指空目录 → exit 3）
    - test_shell_exit_2_on_fixture（subprocess 运行 m8-span-identity.sh，末行 SUMMARY pass=7 fail=0 blocked=1，exit 2）
    - test_shell_never_trusts_copy_verify（fixture 副本删一条 span 并把副本 verify.sh 换成 `echo FIXTURE OK; exit 0` → FIXTURE_DIR=副本 运行 m8-span-identity.sh，exit 1，首行以 "FAIL fixture_host" 开头）
verify: |
  .venv/bin/python -m unittest discover -s pipeline/dataset_compiler/tests -t . 2>&1 | tail -3   # OK，用例数 ≥ 124
  export LC_ALL=en_US.UTF-8; bash openspec/acceptance/m8-span-identity.sh; echo exit=$?             # 7 PASS + BLOCKED mentions_mapping + SUMMARY pass=7 fail=0 blocked=1；exit=2
  FIXTURE_ASSET_ROOT=/nonexistent bash openspec/acceptance/m8-span-identity.sh; echo exit=$?        # 首行 BLOCKED m8_acceptance BLOCKED_SOURCE_ASSET_MISSING …；exit=3
  .venv/bin/python -m pipeline.dataset_compiler.acceptance --fixture pipeline/corpus/_fixture/mini_ed01 --check publication; echo exit=$?   # 8 PASS + BLOCKED knowledge_chain；exit=2
  grep -c 'FIXTURE_DIR/verify.sh' openspec/acceptance/m8-span-identity.sh                            # 0
  bash openspec/acceptance/run_all.sh | tail -1                                                      # SUMMARY pass=2 fail=1 blocked=8（未改动）
  TDD §3 回归
commit:
  add: [pipeline/dataset_compiler/acceptance.py, pipeline/dataset_compiler/tests/test_acceptance.py, openspec/acceptance/m8-span-identity.sh]
  message: "feat(m8): m8-span-identity acceptance (7 span-identity checks PASS, mentions_mapping BLOCKED) per spec §19.0"
on_fail: 停止并报告；不得把 mentions_mapping、knowledge_chain 写成 PASS；不得让 m8-span-identity.sh 在本批返回 0
