on_fail: |
  停止并报告，不许提交红的基线。
  四种情况必须停手写「## 待裁决」而不是自行决定：
    ① 需要改 gate.py 或 packs.py 才能接通
    ② m7 Checkpoint 有多个 succeeded 且无法确定唯一最新
    ③ 接通后既有用例（dataset 162+ / assembly 107 / review 166）有任何一个转红
    ④ 为了让知识链「看起来完整」而需要推断 concept_refs（裁定 107 Q-M8-01 禁止）
