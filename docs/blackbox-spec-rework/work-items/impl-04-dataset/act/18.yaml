on_fail: |
  停止并报告，不许提交红的基线。
  五种情况必须停手写「## 待裁决」：
    ① 重算结果与 cleaned_text 不一致，且你判断不了是数据问题还是重放语义理解错
    ② DeterministicPatchSet 不在 m3 包的 input_artifacts 里、解析路径不唯一
    ③ 不 import digitization 就无法正确重放（说明 patch 语义有隐含约定，需要主 Agent 定）
    ④ glyphbox 档该项行为被迫改变
    ⑤ 修好后电子文本路线冒出**新的** FAIL 项（如实报，不要顺手修）
