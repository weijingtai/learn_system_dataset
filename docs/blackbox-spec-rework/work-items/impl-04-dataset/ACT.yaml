global_rules:
  - 每个 ACT 先写测试（Red 原文入报告）再实现；unittest；测试只用 tempfile 目录，不写 var/、fixture、ocr/
  - 只用标准库 + PyYAML + jsonschema；不新增依赖、不新增 ID 前缀、不调用模型 API（P6）
  - 生产代码只读 Ledger 冻结修订；唯一例外 shim/m1_shim_source_assets.py 读 --asset-root 页图（D2）；acceptance.py 只经 --fixture/FIXTURE_ASSET_ROOT 读宿主
  - 合成 PNG 只可配合合成清单用于单元测试，不得与 fixture 登记哈希同值；缺页图时报 BLOCKED_SOURCE_ASSET_MISSING，不得伪造
  - 中文注释与 docstring；公开函数名、参数名、返回键、检查名、artifact_type、task_id 与 ACT contract 逐字一致
  - 每个 ACT 一个提交；不得 git add -A / git add .；不得写 SUBAGENT_TODO.md、HANDOFF.md、PLAN.md、ACCEPTANCE.md 或任何台账，不得自记 ACCEPTED
