forbidden:
  - 引入任何未批准的第三方 pub 依赖或临时 Mock 包
  - 修改 pattern_knowledge_workbench/lib/database/ 或 assets/
  - 修改 main_page.dart 或 db_provider.dart 中除指定 unused_import 以外的任何代码
  - 修改或消除既有的 11 条 info 级 avoid_print 提示（门禁仅断言 0 warning，退出码 0）
  - 手动修改平台 generated plugin 文件
steps:
  - 在 pattern_knowledge_workbench/pubspec.yaml 中删除 dependencies 下的 ai_core（4 行）与 dependency_overrides 下的 ai_core（4 行）
  - 修改 pattern_knowledge_workbench/lib/pages/chat_page.dart：删除 package:ai_core 导入与 AiChatView，替换为纯静态占位说明页面（提示功能已剥离至 M4 流水线）
  - 修改 pattern_knowledge_workbench/lib/providers/ai_chat_controller.dart：彻底删除 package:ai_core 的 6 处导入；仅保留不依赖外部库的最小安全适配控制器（支持 isInitialized=false 与 recognizeCondition 占位），确保其他未改动页面（如 ai_recognition_dialog.dart）可正常编译
  - 修改 pattern_knowledge_workbench/lib/pages/rule_list_page.dart：删除 package:ai_core 导入与 Drawer 中的 AiChatView 嵌入，替换为说明视图或安全占位
  - 修改 pattern_knowledge_workbench/lib/main.dart：适配无害化的 AiChatController 挂载
  - 正式最小范围扩展处理：
    - main_page.dart：仅删除 3 处 unused_import（provider, drift_database, rule_provider），严禁修改其他代码
    - db_provider.dart：仅删除 1 处 unused_import（drift/drift.dart），严禁修改其他代码
  - 运行依赖求解：cd pattern_knowledge_workbench && flutter pub get
  - 运行静态代码分析：cd pattern_knowledge_workbench && flutter analyze --no-fatal-infos
  - 运行已有单元测试：cd pattern_knowledge_workbench && flutter test
  - 确认自动生成的 pubspec.lock 与各平台 generated plugin 文件完全由 flutter pub get 产生且无人工手工修改
  - 运行全局回归验证：bash docs/blackbox-spec-rework/verify-T.sh
  - 确认 git diff --check
  - 独立提交 commit 2
