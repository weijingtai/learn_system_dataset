act_id: blackbox-g4-r1/d08
title: D-08 SchoolView 对象与 SchoolViewPack 逻辑分包（§12.2 / §16 / §18）
estimated_minutes: 45
group: B
depends_on: [blackbox-g4-r1/d06]
scope:
  write: [openspec/learn-system-blackbox-architecture.md]
tests_first:
  - TDD §1 d08 五条 Red 值（0 / 2 / 0 / 0 / 记录当前「待用户确认」计数）
anchors:
  list_line: '- Interpretation、School、Alias；'
  para_after_list_prefix: '不同类别不得由一个模型一次混合完成。'   # 该段首句；整段为一行
  anchor_pack_last_line: '- **验收项**：`ValidationReport` 计算「跨 Release 注解锚点可迁移率」= 经 `migrated`/`merged`/`split` 后仍可解析的锚点数 ÷ 上一 Release 全部白名单锚点数；`PUBLIC_RELEASE` 要求为 100%，`retired` 项必须在 `ReleaseManifest` 中逐条披露；未达标或缺少 IdentityMigrationMap 时 fail-closed。'
  tp_start_line: '`TechniqueProfilePack` 承载各术数领域确定性事实结构与规则语法标准，消除跨技法匹配歧义：'
  kg_line_after_d06: '- `KnowledgeGraph`：Work、Edition、Pattern、Assertion、Rule、School 和 Evidence 关系，以及来自 `IdentityMigrationMap` 的「锚点迁移关系」边（`anchor_migration`，见 §16 `AnchorContractPack`）；'
steps:
