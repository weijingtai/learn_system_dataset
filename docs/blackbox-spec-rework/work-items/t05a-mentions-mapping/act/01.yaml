    ⑥ 任何一步需要动 `pipeline/assembly/genesis.py`、
       `pipeline/dataset_compiler/step.py`/`gate.py`/`acceptance.py`
       （write scope 之外）才能让判据反映真实状态
    ⑦ 真书/宿主复核阶段（在副本上）发现走完 M4→M6→M7→M8 全链路后，
       `evidence_map_pack.mentions` 仍然为空，且你排查后确认不是自己代码的
