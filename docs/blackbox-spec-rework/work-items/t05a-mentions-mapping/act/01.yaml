  不需要贴完整堆栈）。**建议按 TDD.md 的节顺序做（第 1 节 M6 队列 → 第 2 节
  M7 发号 → 第 3–4 节 span 归属/schema → 第 5 节 M8 mentions → 第 6 节
  R15 全链路），每节全绿才进下一节**，因为后面节的用例依赖前面节的产物形状。
  至少覆盖 TDD.md 里列出的全部具名用例（第 1 节 5 条、第 2 节 7 条、第 3 节
