background: |
  见同目录 README.md 全文（根因链路、真书实测数字、已裁决方案）。

  **裁决状态**：用户 2026-09-26 已把 README「二」原「待用户决定」两项都裁为 (a)：
  1) 新概念发号：仿 Pattern 建 concept 号池游标（`id_range` 增 `co_<tech>` 键、
     `id_allocation` 同口径），M6 已审通过的 `new_concept_candidates` 在 M7 发
     `co_` 号成为 Concept；不另立 T05a2，纳入本任务。
  2) `mentions` 形状：Concept 加 `source_span_ids`，M8 派生 `mentions`（与原候选
     (a) 相同，未变）。

  用户同时要求核实 `new_concept_candidates` 是否已进 M6 审核队列——**已核实：
  没有**（T19 只把 pattern 纳入了队列，见 README 2.0）。因此 M6 队列纳入
  `concept_mention`/`new_concept_candidate` 是本 ACT 的**前置步骤**（一、二节），
  不是可选项；没有这一步，M7 的发号机制（三节）无候选可发。

  合并基线：本文档基于 `worktree-agent-a05fa5819d06e2a48` 与
  `claude/wizardly-maxwell-pqrzh9`（`d3c01d3`，其后另有一次 `68d7975` 的
  merge commit 把本任务自己的文档合了回去）合并后的树。执行者开工前先确认
  自己的工作树也已包含这次合并（`git log --oneline -5` 应能看到这两个哈希
  或其后代），否则先合并、重新核对 README 里的行号，再开始。**本 ACT 篇幅大，
  建议按下面四节顺序分批提交**（一节全绿再进下一节），不要求一次做完，但
  会话结束前必须把「进行到一半」的确切位置写进 TODO.md T05a 行的备注。
contract: |
  一、范围边界（严格执行，超出即停手上报，不得自行扩大或缩小）
    1. 不改 `pipeline/assembly/genesis.py`（R04 提案生成早已统一处理 concept
       类候选，本任务不需要改它，也不许因为"顺手"改它）。
    2. 只加字段、不改任何既有字段的语义或既有测试的既有断言（除非该断言本身就是
       在断言"这个字段不存在"/"这个候选不材化"，那种情况下允许把断言改成新的
       正确断言，并在回报里逐条列出改了哪条既有断言、为什么——尤其是 TDD.md
       §2 里那条取代原有护栏的用例，改动方向必须与 README 2.4 一致）。
    3. 不碰 `assertion.concept_refs` 的产出/推断——第 107 条裁决 P7 明确禁止
       Agent 代补，与本任务的 mentions 映射是两件事（README 1.5、完成判据 5）。
    4. 不碰 `pipeline/dataset_compiler/step.py`/`gate.py`/`acceptance.py` 的
       接线与判定逻辑（`snapshot_knowledge` 已经传进 `build_evidence_map_pack`，
       不需要新接线；`_check_mentions_mapping` 的判定代码不改）。
    5. 不碰 README 1.4「附带发现」记录的 `evidence_map_pack`/`evidence_chain`
       artifact_type 撞名问题——那是另一条 TODO，本任务只记录不动手。
    6. 不新增 Snapshot 版本号机制、不修 Pattern 已知的"最大号退役"边界缺陷、
       不实现 Concept 退役的专门流程（README 2.2 已说明）。

  二、前置步骤：`pipeline/review/` 纳入 concept 类候选（README 2.1 逐条机械
      步骤，2.1.1–2.1.10 对应下面九个文件，逐条照做，不要跳步）：
    1. `__init__.py`：`CANDIDATE_KINDS` 加 `"concept_mention"`、
       `"new_concept_candidate"`。
    2. `model.py`：新增 `_validate_entity_id(kind, entity_id)` 辅助函数
       （concept_mention 走双正则 OR 校验，new_concept_candidate 只要求非空
       字符串，其余 kind 走原 `validate(ENTITY_ID_KINDS[kind], entity_id)`），
       `build_review_queue` 里原来直接调 `validate(...)` 那一行改为调这个
       新函数。**`ENTITY_ID_KINDS` 本身不加新键**（README 2.1.2 已说明原因）。
    3. `inputs.py`：`resolve_m6_inputs` 的 `candidate_objects` 拼接追加
       `concept_mentions`（`entity_id=concept_ref`）与
       `new_concept_candidates`（`entity_id=surface`）两段。
    4. `step.py`：四处（`_modified_by_entity_id`、`_carried_decision_entries`
       的 `objects`、`record_decision` 查 `orig_obj`、`close_review` 的
       `cand_objects`）都追加对 concept 类两段的同形处理，逐字对照 README 2.1.4。
    5. `rework.py`：`_candidate_objects` 与 `_resolve_rerun_inputs` 两处追加
       同形两段。
    6. `console.py`：`cmd_show` 的目标查找链追加 concept_mention/
       new_concept_candidate 两级。
    7. `gate.py`：`evaluate_review` 的 `evidence_closure` 新增
       `kind in ("concept_mention", "new_concept_candidate")` 分支，复用
       assertion 分支的校验方式（只核 `span_id in spans_dict`，不核引文哈希，
       因为 concept 候选的 evidence 未经 `normalize_evidence_offsets` 规范化——
       README 2.1.7 已详细说明，包括"是否要让 concept 候选也走
       `normalize_candidate_object`"这个新增一致性问题，执行者判断后必须在
       回报里说明做了哪个选择、为什么）。
    8. `acceptance.py`：`_check_queue_from_upstream` 的 `expected` 集合追加
       对 `concept_mentions`/`new_concept_candidates` 的同形两段。
    9. `testing/upstream_stub.py`：`seed_upstream` 追加读取/装配
       `concept_mentions`/`new_concept_candidates`（缺省仍是 `[]`/`0`）。
    10. `INTERFACES.md` §3.5、`impl-06-review/README.md` §5.1–§5.3：登记
        两个新候选类别与决定类型（`review_source_fidelity`）。

  三、M7 概念发号（README 2.2 逐条对照表，`pipeline/assembly/`）：
    1. `model.py`：`empty_snapshot_knowledge` 初始化 `id_range["co_<tech>"]`；
       `validate_snapshot_knowledge` 新增对 `concepts[].source_span_ids`、
       `allocated_concept_ids[]` 的校验（升序互异、元素合法）；**不对
       `id_range["co_<tech>"]` 做硬性存在性要求**（与 pattern 的
       `expected_range_key` 检查刻意不同，见下面第五节向后兼容）。
    2. `incremental.py`：`allocate_ids` 新增 `_concept_number_of`
       （前缀 `"co_%s_" % technique_id`）与 `used_concepts` 收集循环
       （基底 `concepts[]`/`retired_entity_ids`/`allocated_concept_ids`/
       本轮已获批带正式 `co_` 号的候选），返回值 `id_allocation` 追加
       `"co_%s" % technique_id` 键。
    3. `apply.py`：
       - 新增 `_used_concept_numbers(base_state, technique_id)`（仿
         `_used_pattern_numbers`）。
       - 新增 `_is_concept_candidate_approved(approved_index, candidate)`
         （检查 `candidate.get("concept_ref")` 或 `candidate.get("surface")`
         是否在 `approved_index` 里）。
       - 新增 `_allocate_new_concepts(base_state, view_docs,
         concept_watermark, concept_range_start, technique_id)`（仿
         `_build_patterns` 的 `pending`/发号循环，候选来源
         `view["candidate_set"].get("new_concept_candidates", [])`，
         排序键 `(source_id, surface)`）。
       - 新增 `_concept_id_allocation(base, knowledge, technique_id,
         concept_range_key)`（仿 `_id_allocation`）。
       - 改 `_build_concepts`：追加读取已批准的 `new_concept_candidates`，
         用 `_allocate_new_concepts` 分配到的号新建 Concept 对象（`name`=
         surface、`source_span_ids`=该候选 evidence 的 span 并集），并把
         这些 surface/号计入返回的 `materialized["concept"]`。
       - 改 `_concept_provenance`/新建 concept 分支/已存在 concept 合并分支：
         收集 `source_span_ids`（并集、排序、去重），逐字仿 README 2.2 与
         act 四节的写法。
       - `apply_resolutions` 里 `knowledge["id_allocation"]`（原第 434 行
         `_id_allocation(...)` 那行）改为合并两个号段的结果；
         `knowledge["allocated_pattern_ids"]` 旁新增
         `knowledge["allocated_concept_ids"]`（与基底并集）。
       - concept 的 `range_key`/`range_start` 计算**独立于** pattern 那套
         （`apply.py:236-242` 那段是 pattern 专用，不要改它，新写一段
         concept 专用的、允许缺键缺省为 0 的等价逻辑）。

  四、M8 `mentions` 派生（`pipeline/dataset_compiler/packs.py`，与本任务
      最初版本相同，未变）：
    1. `build_evidence_map_pack`：在 `entries`/`page_index` 组装完成之后，
       从 `snapshot_knowledge.get("concepts") or []` 派生 `mentions`——每个
       concept 的 `source_span_ids` 与刚组装好的 `entries` 键集合取交集，
       非空才写入 `mentions[concept_id]`（升序列表）；`mentions` 键恒存在
       （`snapshot_knowledge=None` 时为 `{}`，不抛异常）。
    2. `_build_offset_evidence_map_pack`：新增 `snapshot_knowledge=None` 形参，
       从 `build_evidence_map_pack` 的 offset 分派处转传；`mentions` 派生
       逻辑写成小型私有 helper，两处调用共用，不复制粘贴。
    3. `INTERFACES.md` §3.10：追加登记 `mentions` 键（不修改该节已有的
       `chains[]` 描述，那是另一件事）。

  五、退役号/最大号边界与向后兼容（README 2.2 最后两段，机械规则，不是
      待裁决项，照做）：
    1. Concept 侧照抄 Pattern 已知的"`id_allocation` 校验在最大号退役时
       两难"这个既有边界，不新增更强约束，不修 Pattern 那处已知缺陷。
    2. Concept 退役目前无场景触发，本任务不新增专门处理，只要号位收集函数
       能正确识别 `co_` 前缀即可。
    3. **向后兼容（新增边界，Concept 特有）**：真书账本
       `var/ledgers/qianyuan_t04` 上已有的 Snapshot **没有**
       `id_range["co_qizheng"]` 键。`apply.py` 对 concept 的
       `range_key`/`range_start` 计算**不得**照抄 pattern 那样在缺键时
       `AssemblyRefused`——缺键时 `range_start` 取 `0`，并把这个缺省值
       **写回** `knowledge["id_range"]`（下一轮起就有了，不需要一次性迁移
       脚本、不需要额外操作 `var/ledgers/qianyuan_t04`）。
