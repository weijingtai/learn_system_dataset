    - pipeline/dataset_compiler/gate.py            # 不在本任务范围
    - pipeline/dataset_compiler/acceptance.py      # _check_mentions_mapping 的判定逻辑不改；本任务只让它读到非空 mentions 时如实产出结果，不改判定代码本身
background: |
  见同目录 README.md 全文（根因链路、真书实测数字、待用户决定两项）。本 ACT 只在
  README「二、待用户决定」两项都已获用户批准（或主 Agent 转达的书面裁决）后才可执行；
  若尚未批准，执行者读到这里应立刻停手，在 TODO.md T05a 行与本文件末尾写「待裁决」，
  不做任何 write scope 里的改动。

  合并基线：本文档基于 `worktree-agent-a05fa5819d06e2a48` 与
  `claude/wizardly-maxwell-pqrzh9`（`d3c01d3`）合并后的树。执行者开工前先确认自己的
  工作树也已包含这次合并（`git log --oneline -1` 应能看到 `d3c01d3` 或其后代），
  否则先合并、重新核对 README 里的行号，再开始。
contract: |
  一、范围边界（严格执行，超出即停手上报，不得自行扩大或缩小）
    1. 只处理"已经带 `concept_ref` 的 `concept_mentions`"这一条数据路径；
       `new_concept_candidates` 的材化/发号**不做**（README 待用户决定 #1 已定 (c)）。
    2. 只加字段、不改任何既有字段的语义或既有测试的既有断言（除非该断言本身就是
       在断言"这个字段不存在"，那种情况下允许把断言改成"这个字段存在且为空/正确值"，
       并在回报里逐条列出改了哪条既有断言、为什么）。
    3. 不碰 `assertion.concept_refs`（第 107 条 Q-M8-01 P7 禁止 Agent 代补，
       与本任务的 mentions 映射是两件事，见 README 1.5）。
    4. 不碰 `pipeline/dataset_compiler/step.py` 的接线（1.4 已核实 `snapshot_knowledge`
       已经传进 `build_evidence_map_pack`，不需要新接线）。
    5. 不碰 README 里记录的"附带发现"（`evidence_map_pack`/`evidence_chain`
       artifact_type 撞名）——那是另一条 TODO（建议 T05a3），本任务只记录不动手。

  二、`pipeline/assembly/model.py`（`validate_snapshot_knowledge`）
    在 concept 的校验循环（现状：第 521 行 `_check_sorted(knowledge.get("concepts",
    []), key_fn=lambda x: x["concept_id"], name="concepts")`，附近没有逐字段校验
    concept 内部结构的循环——需要新增一个）里，对每个 concept 新增：
      - `source_span_ids` 键必须存在，值为列表；
      - 列表内元素升序且互异（仿 `_check_sorted` 或手写排序检查）；
      - 每个元素经 `ids.validate("source_span_id", element)` 校验，非法即让该异常
        原样外抛（`InvalidIdentifier`）。
    不改动 `concept` 字典里任何既有键的校验（`concept_id`/`name`/`aliases`/`provenance`）。

  三、`pipeline/assembly/apply.py`（`_build_concepts` / `_concept_provenance`）
    - `_concept_provenance`（第 703-710 行）签名与调用点都要能拿到 `items` 里每条
      mention 的 `evidence`（已经在手，`mention["evidence"]` 是
      `[{source_span_id, support_type}]`，见 README 1.1），从中收集
      `source_span_id` 集合。
    - 新建 concept（第 671-676 行 `by_id[ref] = {...}` 那个分支）时，加一个
      `"source_span_ids": sorted({span_id for item in items for ev in
      item.get("evidence") or [] for span_id in [ev["source_span_id"]]})`
      这样形状的字段（写法自定，语义是：本次这批 mention 的证据 span 的并集，排序去重）。
    - 已存在 concept 的合并分支（第 689-698 行 `existing["aliases"] = ...`
      那一段附近）要**同样**把这批新 mention 的 span 并入
      `existing["source_span_ids"]`（并集、排序、去重），不得覆盖丢弃已有版次的 span。
    - 不改变函数签名对外的调用方式（`_build_concepts(base_state, view_docs, touched)`
      不变），不改变返回值元组结构。

  四、`pipeline/dataset_compiler/packs.py`
    - `build_evidence_map_pack`（第 293 行起）：在现有 `entries`/`page_index`
      组装完成之后，新增 `mentions` 的派生——从形参 `snapshot_knowledge`（已经在
      现有参数列表里，第 300 行 `snapshot_knowledge=None`）读
      `snapshot_knowledge.get("concepts") or []`，对每个 concept 取
      `source_span_ids`，与刚组装好的 `entries` 的键集合做交集，非空交集才写入
      `mentions[concept_id]`（升序列表）；`mentions` 键必须始终存在（哪怕是
      `{}`），不得为 `None`，不得省略。**`snapshot_knowledge=None`（现状真书未来
      也可能出现这个情形）时 `mentions` 恒为 `{}`**，不抛异常。
    - `_build_offset_evidence_map_pack`（第 452 行起）：签名当前没有
      `snapshot_knowledge` 形参——新增一个（缺省 `None`，向后兼容），从
      `build_evidence_map_pack`（第 329-336 行的 offset 分派调用点）把
      `snapshot_knowledge` 转传过去；`mentions` 派生逻辑与 glyphbox 档复用同一段
      代码（写成一个小的私有 helper 函数，两处调用，不要复制粘贴两份逻辑）。
    - `pack` 字典里 `mentions` 放在 `page_index`/`excluded_pages` 附近（键序不是
      强制的，JSON 无法约束键序——参考 INTERFACES §3.10 现有的免责声明——但为了
      可读性建议放在 `entries` 之后）。

  五、`INTERFACES.md` 登记
    在 §3.10 `evidence_map_pack.schema.json` 段落（当前描述与实现不符，见 README
    1.4「附带发现」——**本任务不修那处不符**，只新增一句登记）后面加一条说明：
    `evidence_map_pack.entries` 之外新增 `mentions: {conceptId: [sourceSpanId,...]}`
    键，来源 T05a、README.md 链接。同时在 §3.9 `knowledge_data_pack.schema.json`
    或另找恰当位置（执行者判断，写清楚放在哪一节、为什么）登记 Snapshot `concepts[]`
    新增 `source_span_ids[]` 字段。**不修改 §3.10 已有文字描述的 `chains[]`
    形状**（那是另一件事，见 README「附带发现」）。
