on_fail: |
  以下情况必须停手写「## 待裁决」，不得自行决定：
    ① 开工前发现 README「二、待用户决定」任一项尚未获批准
       —— 不写任何代码，只更新 TODO.md 状态为「待用户决定」并说明卡在哪一项
    ② `_build_concepts` 已有的既有测试（第 990 行
       `test_decided_proposal_with_decision_is_applied` 等）因为新增
       `source_span_ids` 字段而意外断言失败，且你判断不出是"该改的既有断言"
       还是"暴露了新的既有缺陷"
    ③ `validate_snapshot_knowledge` 现有调用方（`orchestrator`、`review`、
       `assembly` 里任何读 Snapshot 的既有代码）因为新字段而报错
    ④ 真书复核发现 `concepts[]` **不是**空列表（即 README 的推断被证伪）——
       这说明还有一条本文档没追踪到的数据路径，需要主 Agent 重新核根因，不许
       顺手改代码去"处理"这个意外
    ⑤ 发现 offset 档与 glyphbox 档的 `mentions` 派生逻辑无法共用同一段代码
       （比如两边 `entries` 键的形状差异导致交集逻辑要写两套）
    ⑥ 任何一步需要动 `step.py`/`gate.py`/`acceptance.py`（write scope 之外）
       才能让 `mentions_mapping` 判据反映真实状态
  停手后：在 TODO.md T05a 行写清楚卡在哪一条、已完成到哪一步（精确到文件/函数/
  提交哈希），不要笼统写"遇到问题"。

