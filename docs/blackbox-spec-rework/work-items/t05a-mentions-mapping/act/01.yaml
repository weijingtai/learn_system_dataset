    ① `_build_concepts`/M6 相关既有测试因为新增字段或新分支而意外断言失败，
       且你判断不出是"该改的既有断言"还是"暴露了新的既有缺陷"
    ② `validate_snapshot_knowledge`/`build_review_queue` 现有调用方
       （`orchestrator`、`assembly` 里任何读 Snapshot 或建队列的既有代码）
       因为新字段/新 kind 而报错
    ③ concept 候选的 `evidence` 缺 `start`/`end`/`quote_sha256`（未经
       `normalize_evidence_offsets`），导致 `evidence_closure` 分支只能核
       span_id 存在、不能核引文——判断"是否要让 concept 候选也走
       `normalize_candidate_object`"你拿不准时，停手上报，不要自行决定
       改变既有归一化调用范围
    ④ 真书/宿主复核发现新分配的 `co_` 号与已有号冲突，或
       `id_allocation`/`allocated_pattern_ids` 一类既有校验因为新增的
       concept 姊妹字段而报出你无法判断是否合理的错误
    ⑤ `_admit_new_without_object` 的既有行为（"有 auto 提案没材化就报告"）
       在本任务改动后，对**已批准**的候选也报告了（说明"已批准即不再报告"
