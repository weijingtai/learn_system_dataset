contract: |
  acceptance.py：
    C1 模块顶层改为：
         try:
             import yaml
         except ImportError:  # 宿主缺依赖：main 返回 3
             yaml = None
       `main()` 在解析参数之后、检查 fixture 目录之前：若 `yaml is None`，打印一行
       `FAIL m3_acceptance 宿主准备失败: ImportError: PyYAML 不可导入` 并返回 3。
       其余逻辑与退出码不变。模块其他顶层 import 若间接依赖 PyYAML（如 pipeline.corpus_compiler.step、pipeline.ledger.fixture_ingest），
       一并移入 main 内部、在 yaml 检查之后导入（导入失败 ImportError 同样返回 3）；函数体内对 run_m3/ingest/LedgerService 的引用改为使用这些局部或模块级延迟导入的名字，
       并保证 J2 验收用的 `mock.patch.object(acceptance, "run_m3", ...)` 仍可用——即 acceptance 模块仍暴露模块级名字 `run_m3`（可在模块顶层用 try/except ImportError 置 None，main 中为 None 时返回 3）。
  test_step.py：
    C2 在 test_manifest_object_tamper_fails_input_contract、test_page_set_object_tamper_fails_input_contract、
       test_human_event_object_tamper_fails_input_contract、test_post_begin_exception_seals_failure 四个用例末尾各追加：
         count = self.service.store.conn.execute("select count(*) from stage_packages where stage='m3'").fetchone()[0]
         self.assertEqual(count, 0)
       保留原有断言，不删除任何断言。
