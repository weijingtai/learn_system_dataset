package: blackbox-impl-03-validation
title: 首纵切第三批：M5 Automatic Validation（§13）首切片——G1–G3 与 glyphbox_level 证据门禁
status: DRAFT   # README §4 裁决完成、按裁决定稿为 READY 并做 wjt-react 四查后才可派发
executor_groups:
  K1: [impl-03/00, impl-03/01, impl-03/02, impl-03/03]   # 纯函数模块与 14 个已注册 Validator；K1 全部 ACCEPTED 后才派 K2
  K2: [impl-03/04, impl-03/05, impl-03/06]               # Ledger 读接口、run_m5 事务序列、m5-evidence-gate 验收
decisions_required:
  impl-03/00: [D-07, D-10]
  impl-03/01: [D-04, D-06]
  impl-03/02: [D-01]
  impl-03/03: [D-02, D-03, D-05]
  impl-03/04: [D-01, D-14, D-15]
  impl-03/05: [D-07, D-08, D-09, D-11, D-12]
  impl-03/06: [D-12, D-13]
acts:
  - file: act/00.yaml
    id: impl-03/00
    writes: ["pipeline/validation/__init__.py", "pipeline/validation/errors.py", "pipeline/validation/serialize.py", "pipeline/validation/findings.py", "pipeline/validation/registry.py", "pipeline/validation/tests/__init__.py", "pipeline/validation/tests/helpers.py", "pipeline/validation/tests/test_registry.py"]
  - file: act/01.yaml
    id: impl-03/01
    writes: ["pipeline/validation/g1_source.py", "pipeline/validation/replay.py", "pipeline/validation/tests/test_g1.py"]
  - file: act/02.yaml
    id: impl-03/02
    writes: ["pipeline/validation/g2_coverage.py", "pipeline/validation/tests/test_g2.py"]
  - file: act/03.yaml
    id: impl-03/03
    writes: ["pipeline/validation/g3_evidence.py", "pipeline/validation/tests/test_g3.py"]
  - file: act/04.yaml
    id: impl-03/04
    writes: ["pipeline/validation/inputs.py", "pipeline/validation/context.py", "pipeline/validation/tests/test_inputs.py"]
  - file: act/05.yaml
    id: impl-03/05
    writes: ["pipeline/validation/package.py", "pipeline/validation/step.py", "pipeline/validation/__main__.py", "pipeline/validation/tests/test_step.py"]
  - file: act/06.yaml
    id: impl-03/06
    writes: ["pipeline/validation/acceptance.py", "pipeline/validation/tests/test_acceptance.py", "openspec/acceptance/m5-evidence-gate.sh"]
global_rules:
  - 每个 ACT 先写测试（Red 原文入报告）再实现；unittest；测试只用 tempfile 目录，不写 var/ 与 fixture
  - 只用标准库 + PyYAML + jsonschema；不新增依赖、不新增 ID 前缀（validator_id、task_id 是任务标签，不是登记册 ID）、不调用模型 API
  - 生产代码只读 Ledger 冻结修订；元数据查询允许经 reader.store.conn 只读 SELECT，沿用 impl-02 inputs.py 先例
  - 上游约束（impl-02 ACCEPTANCE §5.3）：解析上游 StagePackage 时只接受 StepRun 状态 succeeded 的包，非 succeeded 包坚决拒绝并抛 ValidationRefused
  - 独立性纪律：g1_source、g2_coverage、g3_evidence 不得 import pipeline.corpus_compiler；唯一允许 import compiler 的是 replay.py；acceptance.py 不得 import 内部验证器逻辑，一律独立重算
  - 中文注释与 docstring；公开函数名、参数名、返回键、检查名与 ACT contract 逐字一致
  - 每个 ACT 一个提交；只 add scope.write 中的路径；不得 git add -A / git add .；不得写台账或 ACCEPTED
gates:
  - bash docs/blackbox-spec-rework/verify-T.sh | tail -1
  - bash docs/blackbox-spec-rework/work-items/g3-r3/mutations.sh all | tail -1
  - bash openspec/schemas/verify.sh >/dev/null; echo $?
  - python3 docs/blackbox-spec-rework/work-items/g4-r3/check_d16.py
  - .venv/bin/python -m unittest discover -s pipeline/ledger/tests -t .
  - .venv/bin/python -m unittest discover -s pipeline/corpus_compiler/tests -t .
  - .venv/bin/python -m unittest discover -s pipeline/validation/tests -t .      # ACT 00 起
  - export LC_ALL=en_US.UTF-8; bash openspec/acceptance/m3-coverage.sh | tail -1
  - export LC_ALL=en_US.UTF-8; bash openspec/acceptance/run_all.sh | tail -1
  - git diff --check
on_fail: 停止并报告；contract 两种理解、测试无法按定义写出、需要改 scope 外文件、上游包状态未校验 → 一律停手上报
