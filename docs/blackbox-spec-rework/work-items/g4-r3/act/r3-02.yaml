act_id: blackbox-g4-r3/02
title: 登记 pat_ / ent_ 到规格 §8.1 第 3b 节表（用户 2026-09-11 确认）
estimated_minutes: 15
group: F
depends_on: [blackbox-g4-r3/01]
scope:
  write: [openspec/learn-system-blackbox-architecture.md]
tests_first:
  - TDD §2 Red：`pat_<technique>_<6位数字>` 0、`ent_<32hex>` 0、3b 表 5 行
anchors:
  last_row: '| ConflictGroup（冲突组） | `cg_<32hex>` | 分组标识（`conflict_group_id`） | 同一主题下相互冲突的一组 SchoolView 共享；M4 / M7 产出，UUIDv4 家族 |'
  after_table: '旧工作台 slug（`qin_tang`、`tian_guan`）迁移时作为别名保留，不作 `school_id`；`guo_lao` 在旧表中类型为 book，不是流派。'
steps:
  - 断言两个锚点各恰 1 次（grep -Fxc）
  - 在 last_row 行之后紧接插入 rows 两行（表不断开）
  - 在 after_table 行之后插入一个空行再插入 note 一行
rows: |
  | Pattern（格局） | `pat_<technique>_<6位数字>` | 稳定身份（`pattern_id`，`entity_id` 语义） | 某技法下一个可规则识别的格局；按技法命名空间、人工闭集、从 `000001` 起顺序编号且不复用；M4 产出候选、M7 聚合后正式；只能引用 Contract Registry 已登记值 |
  | KnowledgeEntry（发布词条） | `ent_<32hex>` | 稳定身份（`entry_id`，`entity_id` 语义） | M8 编译出的发布视图词条，UUIDv4 家族；内容变化以 `rev_<32hex>` 表达，不换号；跨 Release 保号，退役写入 `IdentityMigrationMap`（§16） |
note: '`pat_` 与 `ent_` 两行为用户 2026-09-11 确认（`openspec/id-prefix-registry.md` §3.4），随本表一并冻结；§4 已有字段 `pattern_id`、`entry_id` 自此按本表格式校验。'
verify:
  - export LC_ALL=en_US.UTF-8
  - S=openspec/learn-system-blackbox-architecture.md
  - grep -c 'pat_<technique>_<6位数字>' $S      # 1
  - grep -c 'ent_<32hex>' $S                    # 1
  - sed -n '/^#### 3b\. /,/^#### 4\. /p' $S | grep -c '^| '     # 7
  - sed -n '/^#### 3b\. /,/^#### 4\. /p' $S | grep -c '用户 2026-09-11 确认'   # 1
  - TDD §3 回归
commit:
  add: [openspec/learn-system-blackbox-architecture.md]
  message: "spec(ids): register pat_/ent_ prefixes in §8.1 (confirmed by user 2026-09-11)"
on_fail: 停止并报告
